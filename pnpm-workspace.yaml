packages:
  - "packages/a11oy-knowledge"
  - "packages/qec-integrity"
  - "packages/mesh-router"
  - "packages/policy"
  - "packages/receipt-substrate"
  - "artifacts/a11oy-uds"
  - "web/packages/a11oy-core"
  - "web/packages/a11oy-connection"

linkWorkspacePackages: true

allowBuilds:
  esbuild@0.28.1: true
  unrs-resolver@1.12.2: true

# pnpm 11 reads workspace-wide overrides here.
overrides:
  vite: ^6.4.2
  esbuild: 0.28.1
  js-yaml@<4.3.1: 4.3.1
  brace-expansion: 5.0.9
  fast-uri@<3.1.6: 3.1.6
