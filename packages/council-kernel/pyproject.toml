[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "a11oy-council-kernel"
version = "0.6.0"
description = "Deterministic authority, diversity, veto, and receipt kernel for governed agent councils"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "SZL Holdings" }
]
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["a11oy_council*"]
