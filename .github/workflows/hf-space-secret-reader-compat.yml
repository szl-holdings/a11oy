# SPDX-License-Identifier: Apache-2.0
name: HF Space secret-reader compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/hf_publish_vertical_flagships_v4.py
      - tests/test_hf_space_secret_reader_compat.py
      - .github/workflows/hf-space-secret-reader-compat.yml
  push:
    branches: [main]
    paths:
      - scripts/hf_publish_vertical_flagships_v4.py
      - tests/test_hf_space_secret_reader_compat.py
      - .github/workflows/hf-space-secret-reader-compat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-client-contract:
    name: Preserve existing Space secrets on huggingface_hub 1.10.1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install hash-locked test closure and exact production client
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt
          python -m pip install --disable-pip-version-check --no-cache-dir "huggingface_hub==1.10.1"

      - name: Prove native, legacy, and malformed-response contracts
        run: python -m pytest tests/test_hf_space_secret_reader_compat.py -q
