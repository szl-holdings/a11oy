name: Refresh current Hugging Face ecosystem evidence once

on:
  push:
    branches:
      - ops/codex-perplexity-recovery-20260904-v1
    paths:
      - .github/workflows/_refresh_hf_evidence_current_once.yml

permissions:
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: refresh-hf-ecosystem-evidence-20260904
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate, review, merge, and verify canonical HF evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_ADMIN_TOKEN: ${{ secrets.SZL_GITHUB_TOKEN || secrets.GH_ADMIN_TOKEN || secrets.GITHUB_ADMIN_TOKEN || secrets.ORG_ADMIN_TOKEN || secrets.GH_PAT || github.token }}
      TARGET_BRANCH: fix/hf-ecosystem-manifest-current-20260904
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out recovery branch with push authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/codex-perplexity-recovery-20260904-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Generate canonical evidence from current protected main
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git switch -C "$TARGET_BRANCH" origin/main
          python scripts/audit_huggingface_ecosystem.py --output docs/huggingface-ecosystem-manifest.json
          python scripts/audit_huggingface_ecosystem.py --check --output docs/huggingface-ecosystem-manifest.json
          python scripts/build_ecosystem_stage_matrix.py
          python scripts/build_ecosystem_stage_matrix.py --check
          git diff --check
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          allowed="$(printf '%s\n' docs/ecosystem-stage-matrix.json docs/huggingface-ecosystem-manifest.json | sort)"
          if [ -z "$changed" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$changed" = "$allowed" || {
            echo '::error::Generator changed a path outside the canonical evidence pair'
            printf 'observed:\n%s\n' "$changed"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/huggingface-ecosystem-manifest.json docs/ecosystem-stage-matrix.json
          git commit -s -m 'chore(hf): refresh current public ecosystem evidence'
          git push --force-with-lease origin HEAD:"$TARGET_BRANCH"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or normalize the protected evidence PR
        if: steps.generate.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ env.GH_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh api 'repos/szl-holdings/a11oy/pulls?state=open&head=szl-holdings%3Afix%2Fhf-ecosystem-manifest-current-20260904' --jq '.[0].number // empty')"
          body=$(cat <<'EOF'
          ## Purpose

          Refresh the canonical public Hugging Face ecosystem manifest and its derived stage matrix from current Hub evidence.

          ## Generation

          ```bash
          python scripts/audit_huggingface_ecosystem.py --output docs/huggingface-ecosystem-manifest.json
          python scripts/audit_huggingface_ecosystem.py --check --output docs/huggingface-ecosystem-manifest.json
          python scripts/build_ecosystem_stage_matrix.py
          python scripts/build_ecosystem_stage_matrix.py --check
          ```

          The candidate is generated from current protected `main`; no inventory or stage value is hand-authored. The net diff is restricted to the two canonical generated evidence files.

          No model, dataset, Space, collection, bucket, visibility, hardware, storage, custom domain, secret, or branch-protection setting is changed.

          Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>
          EOF
          )
          if [ -z "$number" ]; then
            number="$(gh api --method POST repos/szl-holdings/a11oy/pulls \
              -f title='chore(hf): refresh current public ecosystem evidence' \
              -f head="$TARGET_BRANCH" -f base=main -f body="$body" \
              -F maintainer_can_modify=true --jq .number)"
          else
            gh api --method PATCH "repos/szl-holdings/a11oy/pulls/${number}" \
              -f title='chore(hf): refresh current public ecosystem evidence' \
              -f body="$body" -f state=open >/dev/null
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-head checks and merge normally
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ env.GH_ADMIN_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          for cycle in 1 2; do
            head="$(gh api "repos/szl-holdings/a11oy/pulls/${PR_NUMBER}" --jq .head.sha)"
            for _ in $(seq 1 180); do
              pr="$(gh api "repos/szl-holdings/a11oy/pulls/${PR_NUMBER}")"
              state="$(printf '%s' "$pr" | jq -r .mergeable_state)"
              current="$(printf '%s' "$pr" | jq -r .head.sha)"
              test "$current" = "$head"
              if [ "$state" = behind ]; then
                gh api --method PUT "repos/szl-holdings/a11oy/pulls/${PR_NUMBER}/update-branch" -f expected_head_sha="$head" >/dev/null
                sleep 20
                head="$(gh api "repos/szl-holdings/a11oy/pulls/${PR_NUMBER}" --jq .head.sha)"
                continue
              fi
              checks="$(gh api -H 'Accept: application/vnd.github+json' "repos/szl-holdings/a11oy/commits/${head}/check-runs?per_page=100")"
              count="$(printf '%s' "$checks" | jq '.check_runs | length')"
              pending="$(printf '%s' "$checks" | jq '[.check_runs[] | select(.status != "completed")] | length')"
              failed="$(printf '%s' "$checks" | jq '[.check_runs[] | select(.status == "completed" and (.conclusion | IN("success", "neutral", "skipped") | not))] | length')"
              if [ "$count" -gt 0 ] && [ "$pending" -eq 0 ]; then
                test "$failed" -eq 0
                gh api --method PUT "repos/szl-holdings/a11oy/pulls/${PR_NUMBER}/merge" \
                  -f sha="$head" -f merge_method=squash \
                  -f commit_title="chore(hf): refresh current public ecosystem evidence (#${PR_NUMBER})" \
                  -f commit_message=$'Regenerate the canonical Hub manifest and derived stage matrix from current public evidence. No Hub resource or provider setting is mutated.\n\nSigned-off-by: Stephen Lutar <stephenlutar2@gmail.com>' \
                  --jq '{merged, message, sha}'
                exit 0
              fi
              sleep 20
            done
          done
          echo '::error::HF evidence PR did not reach a terminal green exact-head state'
          exit 1

      - name: Close stale-manifest tracker when current main verifies
        if: success()
        env:
          GH_TOKEN: ${{ env.GH_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git switch --detach origin/main
          python scripts/audit_huggingface_ecosystem.py --check --output docs/huggingface-ecosystem-manifest.json
          python scripts/build_ecosystem_stage_matrix.py --check
          gh issue comment 1282 --repo szl-holdings/a11oy \
            --body "Current protected main regenerates and verifies the canonical Hugging Face ecosystem manifest and derived stage matrix without drift. Closing from the exact current source; no Hub resource was mutated by this evidence refresh."
          gh issue close 1282 --repo szl-holdings/a11oy --reason completed

      - name: Retire one-shot evidence refresher
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git switch ops/codex-perplexity-recovery-20260904-v1
          git pull --rebase origin ops/codex-perplexity-recovery-20260904-v1
          git rm --ignore-unmatch .github/workflows/_refresh_hf_evidence_current_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -s -m 'chore(ops): retire one-shot HF evidence refresher'
            git push origin HEAD:ops/codex-perplexity-recovery-20260904-v1
          fi
