# SPDX-License-Identifier: Apache-2.0
name: Refresh ecosystem stage matrix once

on:
  push:
    branches:
      - fix/ecosystem-stage-matrix-20260904
    paths:
      - .github/workflows/refresh-ecosystem-stage-matrix-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/ecosystem-stage-matrix-20260904
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install the locked schema toolchain
        run: pnpm install --frozen-lockfile

      - name: Regenerate and verify the derived stage matrix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_ecosystem_stage_matrix.py
          python scripts/build_ecosystem_stage_matrix.py --check
          python scripts/test_audit_huggingface_ecosystem.py
          node scripts/test_validate_huggingface_ecosystem_schema.mjs
          node scripts/validate_huggingface_ecosystem_schema.mjs
          python -m py_compile \
            scripts/audit_huggingface_ecosystem.py \
            scripts/build_ecosystem_stage_matrix.py \
            scripts/prepare_huggingface_payload.py \
            scripts/publish_huggingface_payload.py \
            scripts/build_operational_payload.py
          git diff --check

      - name: Commit the derived matrix and remove this controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add docs/ecosystem-stage-matrix.json
          git rm .github/workflows/refresh-ecosystem-stage-matrix-once.yml
          git diff --cached --quiet && { echo "no stage-matrix change"; exit 1; }
          git commit -s -m "fix(hf): refresh derived ecosystem stage matrix"
          git push origin HEAD:fix/ecosystem-stage-matrix-20260904
