name: Encrypted code-scanning observation
on:
  push:
    branches: [audit/security-observation-20260917]
    paths:
      - scripts/security/observe_code_alerts.mjs
      - scripts/security/observe_code_alerts.test.mjs
      - scripts/security/audit-recipient.pem
      - .github/workflows/encrypted-security-observation.yml
permissions:
  contents: read
  security-events: read
concurrency:
  group: encrypted-security-observation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    name: Read alert records; persist private details only as ciphertext
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - name: Checkout exact observer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run credentialless observer tests
        run: node --test scripts/security/observe_code_alerts.test.mjs
      - name: Read main-branch code-scanning state and encrypt details
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/security/observe_code_alerts.mjs
      - name: Retain ciphertext and aggregate summary only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: encrypted-security-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-observation/
          if-no-files-found: error
          retention-days: 7
