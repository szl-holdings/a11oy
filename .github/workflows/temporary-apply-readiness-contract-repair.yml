name: temporary-apply-readiness-contract-repair

on:
  push:
    branches:
      - fix/readiness-verdict-contracts-20260830
    paths:
      - .github/workflows/temporary-apply-readiness-contract-repair.yml
      - .github/scripts/temporary_apply_readiness_contract_repair.py
      - .github/scripts/temporary_run_readiness_repair.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/readiness-verdict-contracts-20260830
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact-match constructor and regenerate contracts
        run: |
          python3 .github/scripts/temporary_run_readiness_repair.py
          python3 tools/readiness-harness/gen_tabs_matrix.py
          python3 tools/readiness-harness/gen_tabs_matrix.py --check

      - name: Verify runtime, schema, label, and probe regressions
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci-core.txt
          python -m pytest -q \
            tests/test_readiness_runtime_contract_alignment.py \
            tests/test_functest_router_receipts.py \
            tests/test_readiness_honesty_relock_contract.py
          node tools/readiness-harness/probe_runner.test.mjs
          git diff --check

      - name: Commit only the passing repair and remove temporary constructors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          rm .github/workflows/temporary-readiness-contract-diagnostic.yml
          rm .github/workflows/temporary-apply-readiness-contract-repair.yml
          rm .github/scripts/temporary_apply_readiness_contract_repair.py
          rm .github/scripts/temporary_run_readiness_repair.py
          git add -A
          git commit \
            -m "fix(readiness): align verdict contracts with observed runtime" \
            -m "Admit explicitly labeled stale official-equity observations while retaining the one-hour observation SLA, and replace the obsolete modeled router schema with the live/degraded/unavailable process-lifetime routing-decision contract." \
            -m "Signed-off-by: Stephen P. Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:refs/heads/fix/readiness-verdict-contracts-20260830
