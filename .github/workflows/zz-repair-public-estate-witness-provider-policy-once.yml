# SPDX-License-Identifier: Apache-2.0
name: Repair public estate witness identity policy once

on:
  push:
    branches:
      - fix/public-estate-witness-provider-policy-v1
    paths:
      - .github/workflows/zz-repair-public-estate-witness-provider-policy-once.yml

permissions:
  contents: write

concurrency:
  group: repair-public-estate-witness-provider-policy-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/public-estate-witness-provider-policy-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Apply bounded identity-policy repair
        run: python tools/patch_public_estate_witness_provider_policy.py

      - name: Prove fixed-origin and fail-closed contracts
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.3.5"
          python -m pytest -q tests/test_public_estate_live_witness.py
          python scripts/public_estate_live_witness.py \
            --offline-contract-only \
            --output public-estate-contract.json
          python -m py_compile \
            scripts/public_estate_live_witness.py \
            tests/test_public_estate_live_witness.py
          python -m json.tool governance/public-estate.v1.json >/dev/null
          git diff --check

      - name: Commit only durable repair
        run: |
          set -euo pipefail
          git rm tools/patch_public_estate_witness_provider_policy.py
          git rm .github/workflows/zz-repair-public-estate-witness-provider-policy-once.yml
          git add \
            scripts/public_estate_live_witness.py \
            tests/test_public_estate_live_witness.py \
            governance/public-estate.v1.json
          git config user.name "SZL Public Estate Witness Controller"
          git config user.email "stephenlutar2@gmail.com"
          git commit \
            -m "fix(witness): normalize Killinchu source and provider evidence" \
            -m "Accept the strict Killinchu build.revision shape only under an explicit manifest-fixed runtime policy, observe the current Space revision through the Hugging Face provider API without pretending the process declared it, and retain fail-closed behavior for ambiguous identity." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:fix/public-estate-witness-provider-policy-v1
