name: Diagnose public Hugging Face card transport once

on:
  push:
    branches: [fix/hf-public-card-read-401-20260905]
    paths: [.github/workflows/zz-diagnose-hf-card-read-once.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compare anonymous raw, resolve, and revision API reads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          HEADERS = {
              'Accept': '*/*',
              'User-Agent': 'a11oy-public-estate-audit/1.0 (+https://github.com/szl-holdings/a11oy)',
          }

          def read_json(url):
              request = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def status(url):
              request = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      response.read(1)
                      return {'status': response.status, 'final_url': response.geturl()}
              except urllib.error.HTTPError as error:
                  return {
                      'status': error.code,
                      'final_url': error.geturl(),
                      'www_authenticate': error.headers.get('WWW-Authenticate'),
                  }

          items = read_json('https://huggingface.co/api/models?author=SZLHOLDINGS&limit=100&full=true')
          anomalies = []
          for item in sorted(items, key=lambda value: value.get('id') or value.get('modelId') or ''):
              item_id = item.get('id') or item.get('modelId')
              revision = item.get('sha')
              if not isinstance(item_id, str) or not isinstance(revision, str):
                  continue
              encoded_id = urllib.parse.quote(item_id, safe='/')
              encoded_revision = urllib.parse.quote(revision, safe='')
              probes = {
                  'raw': status(f'https://huggingface.co/{encoded_id}/raw/{encoded_revision}/README.md'),
                  'resolve': status(f'https://huggingface.co/{encoded_id}/resolve/{encoded_revision}/README.md'),
                  'revision_api': status(f'https://huggingface.co/api/models/{encoded_id}/revision/{encoded_revision}'),
              }
              if any(result['status'] not in {200, 404} for result in probes.values()):
                  anomalies.append({
                      'id': item_id,
                      'sha': revision,
                      'private': bool(item.get('private', False)),
                      'gated': item.get('gated', False),
                      'probes': probes,
                  })
          print(json.dumps({'models': len(items), 'anomalies': anomalies}, indent=2, sort_keys=True))
          PY
