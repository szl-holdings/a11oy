name: Diagnose public Hugging Face card transport once

on:
  push:
    branches: [fix/hf-public-card-read-401-20260905]
    paths: [.github/workflows/zz-diagnose-hf-card-read-once.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Separate exact-revision path behavior from request headers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          item_id = 'SZLHOLDINGS/SZL-Forge-1.5B-ReceiptAgent'
          revision = 'ebbf0db2732c3b0941512a1c0d5c95b9bcc70a3b'
          headers = {
              'Accept': '*/*',
              'User-Agent': 'a11oy-public-estate-audit/1.0 (+https://github.com/szl-holdings/a11oy)',
          }

          def status(url, *, identified):
              target = urllib.request.Request(url, headers=headers) if identified else url
              try:
                  with urllib.request.urlopen(target, timeout=30) as response:
                      response.read(1)
                      return {'status': response.status, 'final_url': response.geturl()}
              except urllib.error.HTTPError as error:
                  return {
                      'status': error.code,
                      'final_url': error.geturl(),
                      'www_authenticate_present': bool(error.headers.get('WWW-Authenticate')),
                  }

          raw = f'https://huggingface.co/{item_id}/raw/{revision}/README.md'
          resolve = f'https://huggingface.co/{item_id}/resolve/{revision}/README.md'
          revision_api = f'https://huggingface.co/api/models/{item_id}/revision/{revision}'
          evidence = {
              'item_id': item_id,
              'revision': revision,
              'raw_default': status(raw, identified=False),
              'resolve_default': status(resolve, identified=False),
              'raw_identified': status(raw, identified=True),
              'resolve_identified': status(resolve, identified=True),
              'revision_api_default': status(revision_api, identified=False),
          }
          print(json.dumps(evidence, indent=2, sort_keys=True))
          if evidence['resolve_default']['status'] != 200:
              raise SystemExit('The anonymous exact-revision resolve path is not readable')
          if evidence['revision_api_default']['status'] != 200:
              raise SystemExit('The public exact-revision metadata is not readable')
          PY
