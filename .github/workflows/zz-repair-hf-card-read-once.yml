name: Diagnose exact Hugging Face semantic delta once

on:
  push:
    branches: [fix/hf-public-card-read-401-20260905]
    paths: [.github/workflows/zz-repair-hf-card-read-once.yml]

permissions:
  contents: read

concurrency:
  group: diagnose-hf-public-card-semantic-delta-once
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/fix/hf-public-card-read-401-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Generate through the verified resolve transport and print only semantic drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/audit_huggingface_ecosystem.py)" = 6a963fdf602fed8705c9bd704705354763d97f92
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit_huggingface_ecosystem.py')
          source = path.read_text(encoding='utf-8')
          raw = 'f"https://huggingface.co/{prefix}{encoded_id}/raw/"'
          resolved = 'f"https://huggingface.co/{prefix}{encoded_id}/resolve/"'
          if source.count(raw) != 1 or resolved in source:
              raise SystemExit('Exact card transport boundary changed')
          path.write_text(source.replace(raw, resolved), encoding='utf-8')
          PY
          python -m py_compile scripts/audit_huggingface_ecosystem.py
          python scripts/audit_huggingface_ecosystem.py --output /tmp/hf-candidate.json
          python - <<'PY'
          import json
          from pathlib import Path

          existing = json.loads(Path('docs/huggingface-ecosystem-manifest.json').read_text(encoding='utf-8'))
          candidate = json.loads(Path('/tmp/hf-candidate.json').read_text(encoding='utf-8'))

          def stable_item(item, category):
              value = json.loads(json.dumps(item))
              value.pop('sha', None)
              value.pop('lastModified', None)
              if category == 'datasets' and isinstance(value.get('tags'), list):
                  value['tags'] = [
                      tag for tag in value['tags']
                      if not (
                          isinstance(tag, str)
                          and tag.startswith(('size_categories:', 'modality:', 'format:', 'library:'))
                      )
                  ]
              return value

          report = {
              'existing_observedAt': existing.get('observedAt'),
              'candidate_observedAt': candidate.get('observedAt'),
              'existing_counts': existing.get('counts'),
              'candidate_counts': candidate.get('counts'),
              'top_level_changes': {},
              'inventory': {},
          }
          for key in sorted(set(existing) | set(candidate)):
              if key in {'observedAt', 'inventory'}:
                  continue
              if existing.get(key) != candidate.get(key):
                  report['top_level_changes'][key] = {
                      'existing': existing.get(key),
                      'candidate': candidate.get(key),
                  }

          for category in ('models', 'datasets', 'spaces'):
              old = {
                  item['id']: stable_item(item, category)
                  for item in existing.get('inventory', {}).get(category, [])
              }
              new = {
                  item['id']: stable_item(item, category)
                  for item in candidate.get('inventory', {}).get(category, [])
              }
              changed = []
              for item_id in sorted(set(old) & set(new)):
                  if old[item_id] == new[item_id]:
                      continue
                  fields = {}
                  for field in sorted(set(old[item_id]) | set(new[item_id])):
                      if old[item_id].get(field) != new[item_id].get(field):
                          fields[field] = {
                              'existing': old[item_id].get(field),
                              'candidate': new[item_id].get(field),
                          }
                  changed.append({'id': item_id, 'fields': fields})
              report['inventory'][category] = {
                  'added': sorted(set(new) - set(old)),
                  'removed': sorted(set(old) - set(new)),
                  'changed': changed,
              }

          print(json.dumps(report, indent=2, sort_keys=True))
          if not report['top_level_changes'] and all(
              not block['added'] and not block['removed'] and not block['changed']
              for block in report['inventory'].values()
          ):
              raise SystemExit('No semantic drift found; checker behavior needs separate diagnosis')
          PY
