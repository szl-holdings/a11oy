name: temporary-remove-unused-kernel-alias-1538

on:
  push:
    branches:
      - fix/console-command-bar-restore-20260830
    paths:
      - .github/workflows/temporary-remove-unused-kernel-alias-1538.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/console-command-bar-restore-20260830
          fetch-depth: 0
          persist-credentials: true
      - name: Remove the unused compatibility alias and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('a11oy_landing.html')
          text = path.read_text(encoding='utf-8')
          dead = '''  // Compatibility alias: identity-lock surfaces wired to the earlier name.
          const loadKernelLocked = loadLockedKernel;
          '''
          if text.count(dead) != 1:
              raise SystemExit(f'expected one exact dead alias block, found {text.count(dead)}')
          text = text.replace(dead, '', 1)
          if 'loadKernelLocked' in text:
              raise SystemExit('unused compatibility alias remains')
          if text.count('loadLockedKernel') < 2:
              raise SystemExit('canonical loader definition/invocation contract is incomplete')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/temporary-remove-unused-kernel-alias-1538.yml
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add a11oy_landing.html .github/workflows/temporary-remove-unused-kernel-alias-1538.yml
          git commit -m "fix(frontend): remove unused kernel loader alias" -m "Signed-off-by: Stephen P. Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:fix/console-command-bar-restore-20260830
