name: Repair residual Series-A baseline

on:
  push:
    branches:
      - work/repair-residual-series-a-20260830-v1

permissions:
  contents: write

concurrency:
  group: repair-residual-series-a-20260830-v1
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/work/repair-residual-series-a-20260830-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install exact repository CI dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt

      - name: Apply fail-closed source repair
        run: python scripts/repair_residual_series_a_baseline_v4.py

      - name: Compile repaired Python source
        run: python -m compileall -q serve.py a11oy_khipu_chat.py

      - name: Run the exact previously failing regression set
        run: >-
          python -m pytest -q
          tests/test_demo_critical_routes.py
          tests/test_holographic_command_bar.py
          tests/test_series_a_estate.py
          tests/test_frontier_model_admission.py
          tests/test_model_intel_frontier_estate.py

      - name: Reject malformed diffs and test mutations
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet -- tests/; then
            echo 'The repair attempted to change tests.' >&2
            exit 1
          fi
          test ! -e scripts/repair_residual_series_a_baseline.py
          test ! -e scripts/repair_residual_series_a_baseline_v2.py
          test ! -e scripts/repair_residual_series_a_baseline_v4.py
          test ! -e .github/workflows/repair-residual-series-a-baseline.yml

      - name: Commit the repaired candidate tree to the isolated branch
        run: |
          set -euo pipefail
          git config user.name 'SZL Repair Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit \
            -m 'fix(runtime): restore Series-A, Khipu, and command baseline' \
            -m 'Signed-off-by: SZL Repair Bot <41898282+github-actions[bot]@users.noreply.github.com>' \
            -m 'Authorized-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:work/repair-residual-series-a-20260830-v1
