# Verifies a cosign bundle, CycloneDX ML-BOM and lineage manifest (fail closed).
# This workflow never signs, publishes or deploys. Live verify runs only on
# workflow_dispatch. pull_request runs the offline contract only, so a merge
# of this file does not attach a signature or change a release.
name: model-provenance

on:
  pull_request:
    paths:
      - .github/workflows/model-provenance.yml
      - .github/scripts/verify_model_provenance.py
  workflow_dispatch:
    inputs:
      bundle_path:
        description: Path in this repo to the cosign or model-signing bundle JSON
        required: true
      mlbom_path:
        description: Path in this repo to the CycloneDX ML-BOM (mlbom/<model>.cdx.json)
        required: true
      lineage_path:
        description: Path in this repo to lineage/<model>.json
        required: true
      image_ref:
        description: Optional image digest ref (ghcr.io/org/name@sha256-...) for cosign verify
        required: false
        default: ""

permissions:
  contents: read

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout pull-request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run fail-closed provenance contract
        run: python3 -I -B .github/scripts/verify_model_provenance.py --self-check

  verify:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify bundle, ML-BOM and lineage (fail closed)
        env:
          BUNDLE_PATH: ${{ inputs.bundle_path }}
          MLBOM_PATH: ${{ inputs.mlbom_path }}
          LINEAGE_PATH: ${{ inputs.lineage_path }}
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          test -n "${BUNDLE_PATH}"
          test -n "${MLBOM_PATH}"
          test -n "${LINEAGE_PATH}"
          python3 -I -B .github/scripts/verify_model_provenance.py \
            --bundle "${BUNDLE_PATH}" \
            --mlbom "${MLBOM_PATH}" \
            --lineage "${LINEAGE_PATH}" \
            --image-ref "${IMAGE_REF}"
