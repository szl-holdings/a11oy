name: Scoped source pin maintenance
on:
  push:
    branches: [szl/hf-integrity-pin-e14015d-20260914]
    paths: [.github/workflows/szl-pin-maintenance.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/szl/hf-integrity-pin-e14015d-20260914' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - name: Checkout source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply exact previously reviewed preparation with corrected fixture count
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          import textwrap
          raw = subprocess.check_output(['git', 'show', '66accbcb6bc0059fdcefb147ed8e4dd0182782d5:.github/workflows/szl-pin-maintenance.yml'])
          actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if actual != '0fcbb19da58245ab4f7d8b4db97185d0cfd2b3d0':
              raise RuntimeError('reviewed maintenance source drift')
          parts = raw.decode().split("          python - <<'PY'\n")
          if len(parts) != 3:
              raise RuntimeError('reviewed maintenance block shape changed')
          code = textwrap.dedent(parts[1].split('          PY\n', 1)[0])
          replacements = {
              "git('rev-parse', 'HEAD^') == BASE": "git('rev-parse', 'HEAD^') == '66accbcb6bc0059fdcefb147ed8e4dd0182782d5'",
              "git('diff', '--name-only', 'HEAD^', 'HEAD')": "git('diff', '--name-only', BASE, 'HEAD')",
              "[(list(PINS)[0], 1), (list(PINS)[1], 2)]": "[(list(PINS)[0], 1), (list(PINS)[1], 3)]",
          }
          for old, new in replacements.items():
              if code.count(old) != 1:
                  raise RuntimeError('maintenance correction anchor changed')
              code = code.replace(old, new, 1)
          exec(compile(code, '<source-pin-preparation>', 'exec'))
          PY
      - name: Create only tested content blobs, never refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          import textwrap
          raw = subprocess.check_output(['git', 'show', '66accbcb6bc0059fdcefb147ed8e4dd0182782d5:.github/workflows/szl-pin-maintenance.yml'])
          actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if actual != '0fcbb19da58245ab4f7d8b4db97185d0cfd2b3d0':
              raise RuntimeError('reviewed blob-writer source drift')
          parts = raw.decode().split("          python - <<'PY'\n")
          if len(parts) != 3:
              raise RuntimeError('reviewed maintenance block shape changed')
          code = textwrap.dedent(parts[2].split('          PY\n', 1)[0])
          exec(compile(code, '<source-blob-preparation>', 'exec'))
          PY
      - name: Retain exact changes and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-pin-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: pin-repair-evidence/
          if-no-files-found: error
          retention-days: 30
