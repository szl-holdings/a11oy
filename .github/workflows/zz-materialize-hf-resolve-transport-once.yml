name: Materialize exact Hugging Face resolve transport once

on:
  push:
    branches: [fix/hf-card-resolve-transport-current-main-20260905]
    paths: [.github/workflows/zz-materialize-hf-resolve-transport-once.yml]

permissions:
  contents: write

concurrency:
  group: materialize-hf-resolve-transport-once
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/fix/hf-card-resolve-transport-current-main-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: '10.33.3'
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
      - name: Install exact schema-validator closure
        run: pnpm install --frozen-lockfile
      - name: Apply minimal exact-revision transport and regression repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/audit_huggingface_ecosystem.py)" = 6a963fdf602fed8705c9bd704705354763d97f92
          test "$(git hash-object scripts/test_audit_huggingface_ecosystem.py)" = 8d271f3615cfd3a4d774228f4df916aba496953d
          test "$(git hash-object docs/huggingface-ecosystem-manifest.json)" = 37756c1322bc3af7efe5325f749925f0664060c9
          test "$(git hash-object docs/ecosystem-stage-matrix.json)" = ef75a047b5587b9a6bac824369a9d35f5c154c03
          python - <<'PY'
          from pathlib import Path

          collector = Path('scripts/audit_huggingface_ecosystem.py')
          source = collector.read_text(encoding='utf-8')
          raw = 'f"https://huggingface.co/{prefix}{encoded_id}/raw/"'
          resolved = 'f"https://huggingface.co/{prefix}{encoded_id}/resolve/"'
          if source.count(raw) != 1 or resolved in source:
              raise SystemExit('Exact card transport boundary changed; refusing broad edit')
          collector.write_text(source.replace(raw, resolved), encoding='utf-8')

          tests = Path('scripts/test_audit_huggingface_ecosystem.py')
          source = tests.read_text(encoding='utf-8')
          marker = (
              '    def test_manifest_has_public_scope_and_no_unrelated_'
              'canonical_numbers(self) -> None:\n'
          )
          if source.count(marker) != 1:
              raise SystemExit('Test insertion boundary changed; refusing broad edit')
          lines = [
              '    def test_card_fetch_uses_exact_resolve_revision_and_fails_closed(self) -> None:',
              '        original_urlopen = audit.urllib.request.urlopen',
              '        calls: list[str] = []',
              '',
              '        class Response:',
              '            def __enter__(self):',
              '                return self',
              '',
              '            def __exit__(self, *_: object) -> None:',
              '                return None',
              '',
              '            def read(self) -> bytes:',
              '                return b"# exact revision\\r\\n"',
              '',
              '        def success(url: str, *, timeout: float):',
              '            self.assertEqual(timeout, 30)',
              '            calls.append(url)',
              '            return Response()',
              '',
              '        def missing(url: str, *, timeout: float):',
              '            self.assertEqual(timeout, 30)',
              '            calls.append(url)',
              '            raise audit.urllib.error.HTTPError(',
              '                url, 404, "Not Found", {}, None',
              '            )',
              '',
              '        def unauthorized(url: str, *, timeout: float):',
              '            self.assertEqual(timeout, 30)',
              '            calls.append(url)',
              '            raise audit.urllib.error.HTTPError(',
              '                url, 401, "Authentication Required", {}, None',
              '            )',
              '',
              '        revision = "e" * 40',
              '        cases = (',
              '            ("model", "SZLHOLDINGS/model", ""),',
              '            ("dataset", "SZLHOLDINGS/dataset", "datasets/"),',
              '            ("space", "SZLHOLDINGS/space", "spaces/"),',
              '        )',
              '        try:',
              '            audit.urllib.request.urlopen = success',
              '            for repo_type, item_id, prefix in cases:',
              '                with self.subTest(repo_type=repo_type):',
              '                    self.assertEqual(',
              '                        self.original_fetch_card_markdown(',
              '                            item_id, repo_type, revision',
              '                        ),',
              '                        "# exact revision\\r\\n",',
              '                    )',
              '                    self.assertEqual(',
              '                        calls[-1],',
              '                        f"https://huggingface.co/{prefix}{item_id}/"',
              '                        f"resolve/{revision}/README.md",',
              '                    )',
              '            audit.urllib.request.urlopen = missing',
              '            self.assertEqual(',
              '                self.original_fetch_card_markdown(',
              '                    "SZLHOLDINGS/no-card", "model", revision',
              '                ),',
              '                "",',
              '            )',
              '            audit.urllib.request.urlopen = unauthorized',
              '            with self.assertRaises(',
              '                audit.urllib.error.HTTPError',
              '            ) as context:',
              '                self.original_fetch_card_markdown(',
              '                    "SZLHOLDINGS/gated", "model", revision',
              '                )',
              '            self.assertEqual(context.exception.code, 401)',
              '        finally:',
              '            audit.urllib.request.urlopen = original_urlopen',
              '',
              '        self.assertEqual(len(calls), 5)',
              '        self.assertTrue(all("/resolve/" in url for url in calls))',
              '        self.assertTrue(all("/raw/" not in url for url in calls))',
              '',
              '    def test_auto_gated_public_model_keeps_observed_card_evidence(self) -> None:',
              '        model = item("SZLHOLDINGS/gated-model")',
              '        model["gated"] = "auto"',
              '        fixtures = {"models": [model], "datasets": [], "spaces": []}',
              '        audit.api_items = lambda kind: fixtures[kind]',
              '        manifest = audit.build_manifest(',
              '            observed_at="2026-07-26T00:00:00Z"',
              '        )',
              '        summary = manifest["inventory"]["models"][0]',
              '        self.assertTrue(summary["gated"])',
              '        self.assertEqual(len(summary["cardSemanticSha256"]), 64)',
              '',
          ]
          tests.write_text(
              source.replace(marker, '\n'.join(lines) + '\n' + marker),
              encoding='utf-8',
          )
          PY
          python -m py_compile \
            scripts/audit_huggingface_ecosystem.py \
            scripts/test_audit_huggingface_ecosystem.py
          python -S scripts/test_audit_huggingface_ecosystem.py
      - name: Refresh current public evidence and derived matrix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_huggingface_ecosystem.py \
            --output docs/huggingface-ecosystem-manifest.json
          python scripts/build_ecosystem_stage_matrix.py
          python scripts/audit_huggingface_ecosystem.py \
            --check --output docs/huggingface-ecosystem-manifest.json
          python scripts/build_ecosystem_stage_matrix.py --check
          node scripts/test_validate_huggingface_ecosystem_schema.mjs
          node scripts/validate_huggingface_ecosystem_schema.mjs
      - name: Prove bounded semantic delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          import subprocess
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              'audit_huggingface_ecosystem',
              Path('scripts/audit_huggingface_ecosystem.py'),
          )
          audit = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(audit)

          def original(path: str) -> dict:
              raw = subprocess.check_output(
                  ['git', 'show', f'HEAD:{path}'], text=True
              )
              return json.loads(raw)

          old_manifest = original('docs/huggingface-ecosystem-manifest.json')
          new_manifest = json.loads(
              Path('docs/huggingface-ecosystem-manifest.json').read_text(
                  encoding='utf-8'
              )
          )
          assert old_manifest['schemaVersion'] == 1
          assert new_manifest['schemaVersion'] == 1
          assert old_manifest['counts'] == new_manifest['counts']

          target = 'SZLHOLDINGS/SZL-Forge-1.5B-ReceiptAgent'
          old_models = {
              item['id']: item
              for item in old_manifest['inventory']['models']
          }
          new_models = {
              item['id']: item
              for item in new_manifest['inventory']['models']
          }
          assert old_models[target]['gated'] is False
          assert new_models[target]['gated'] is True
          assert (
              old_models[target]['cardSemanticSha256']
              == new_models[target]['cardSemanticSha256']
          )

          expected = audit.semantic_manifest(old_manifest)
          expected_models = {
              item['id']: item
              for item in expected['inventory']['models']
          }
          expected_models[target]['gated'] = True
          assert expected == audit.semantic_manifest(new_manifest), (
              'Unexpected semantic inventory drift occurred during refresh'
          )

          old_matrix = original('docs/ecosystem-stage-matrix.json')
          new_matrix = json.loads(
              Path('docs/ecosystem-stage-matrix.json').read_text(
                  encoding='utf-8'
              )
          )
          old_matrix['observedAt'] = new_matrix['observedAt']
          assert old_matrix == new_matrix, (
              'Derived stage matrix changed beyond its evidence timestamp'
          )
          print(json.dumps({
              'state': 'VERIFIED_MINIMAL_DELTA',
              'transport': 'exact-revision-resolve',
              'counts': new_manifest['counts'],
              'semantic_change': {
                  'id': target,
                  'field': 'gated',
                  'before': False,
                  'after': True,
                  'card_digest_unchanged': True,
              },
          }, indent=2, sort_keys=True))
          PY
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              'docs/ecosystem-stage-matrix.json',
              'docs/huggingface-ecosystem-manifest.json',
              'scripts/audit_huggingface_ecosystem.py',
              'scripts/test_audit_huggingface_ecosystem.py',
          }
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  f'Unexpected permanent repair scope: {sorted(changed)}'
              )
          print('Verified permanent scope:', sorted(changed))
          PY
      - name: Commit permanent repair and consume both controllers
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/hf-card-resolve-transport-current-main-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_HEAD"
          git rm -- \
            .github/workflows/zz-enable-hf-materializer-deps-once.yml \
            .github/workflows/zz-materialize-hf-resolve-transport-once.yml
          git add -- \
            docs/ecosystem-stage-matrix.json \
            docs/huggingface-ecosystem-manifest.json \
            scripts/audit_huggingface_ecosystem.py \
            scripts/test_audit_huggingface_ecosystem.py
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          expected=".github/workflows/zz-enable-hf-materializer-deps-once.yml .github/workflows/zz-materialize-hf-resolve-transport-once.yml docs/ecosystem-stage-matrix.json docs/huggingface-ecosystem-manifest.json scripts/audit_huggingface_ecosystem.py scripts/test_audit_huggingface_ecosystem.py "
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'fix(hf): read public cards through exact resolve revisions' \
            -m 'Refresh ReceiptAgent gated=true while preserving its unchanged exact-revision card digest and all inventory counts.' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$branch"
