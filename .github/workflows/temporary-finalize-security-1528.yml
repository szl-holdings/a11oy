name: temporary-finalize-security-1528

on:
  push:
    branches:
      - fix/p0-1-dead-security-contact
    paths:
      - .github/workflows/temporary-finalize-security-1528.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/p0-1-dead-security-contact
          fetch-depth: 0
          persist-credentials: true
      - name: Integrate main, verify disclosure surface, and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::security branch has a real conflict with current main"
            git diff --name-status --diff-filter=U || true
            git merge --abort
            rm -f \
              .github/workflows/temporary-update-security-1528.yml \
              .github/workflows/temporary-finalize-security-1528.yml
            git add -A
            git commit -m "ci: remove failed security integration workflows" -m "Signed-off-by: Stephen P. Lutar <stephenlutar2@gmail.com>"
            git push origin HEAD:fix/p0-1-dead-security-contact
            exit 1
          fi
          python -m pip install --require-hashes -r .github/requirements/ci-core.txt
          python -m pytest -q \
            tests/test_discovery_files.py::test_security_txt_is_canonical_and_copied_into_runtime_static_tree \
            tests/test_demo_critical_routes.py \
            tests/test_identity_lock.py
          python scripts/check_banned_tokens.py --root . --allowlist .doctrine-allowlist
          python -m py_compile szl_connectors/base.py serve.py
          rm -f \
            .github/workflows/temporary-update-security-1528.yml \
            .github/workflows/temporary-finalize-security-1528.yml
          git add -A
          git commit -m "chore(security): finalize disclosure repair on current main" -m "Signed-off-by: Stephen P. Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:fix/p0-1-dead-security-contact
