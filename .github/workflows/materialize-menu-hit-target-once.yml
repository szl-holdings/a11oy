name: Materialize menu hit-target repair once

on:
  push:
    branches:
      - fix/hf-frontend-menu-hit-target-v1-20260904
    paths:
      - .github/workflows/materialize-menu-hit-target-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-menu-hit-target-v1
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-frontend-menu-hit-target-v1-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize the cascade-safe geometry lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path("console/assets/szl-flow.css")
          css = css_path.read_text(encoding="utf-8")
          base = """.szl-flow-toggle {
            display: none;
            min-width: 48px;
            min-height: 48px;
            border-radius: 6px;
          }
          """
          override = """/* Specificity lock: the generic product-button rule resolves to 44px.
             Keep this selector stronger so rounded corners retain a contiguous 44x44 hit region. */
          body[data-szl-flow] .szl-flow-toggle {
            min-width: 48px;
            min-height: 48px;
            border-radius: 6px;
          }
          """
          if override not in css:
              if css.count(base) != 1:
                  raise SystemExit("flow toggle geometry anchor drifted")
              css = css.replace(base, base + override, 1)
              css_path.write_text(css, encoding="utf-8")

          test_path = Path("tests/test_frontend_source_boundaries.py")
          test = test_path.read_text(encoding="utf-8")
          marker = '        self.assertIn("border-radius: 6px", body)\n'
          inserted_marker = "        applied_bodies = re.findall(\n"
          i1 = " " * 8
          i2 = " " * 12
          block = (
              "\n"
              + i1 + "applied_bodies = re.findall(\n"
              + i2 + 'r"(?m)^body\\[data-szl-flow\\][ ]+[.]szl-flow-toggle[ ]*[{](?P<body>[^}]*)[}]",\n'
              + i2 + "css,\n"
              + i2 + "re.S,\n"
              + i1 + ")\n"
              + i1 + "applied = next(\n"
              + i2 + '(candidate for candidate in applied_bodies if "min-height: 48px" in candidate),\n'
              + i2 + "None,\n"
              + i1 + ")\n"
              + i1 + "self.assertIsNotNone(applied)\n"
              + i1 + 'self.assertIn("min-width: 48px", applied)\n'
              + i1 + 'self.assertIn("min-height: 48px", applied)\n'
              + i1 + 'self.assertIn("border-radius: 6px", applied)\n'
              + i1 + "# A centered 44px square must remain inside all four 6px rounded corners.\n"
              + i1 + "inset = (48 - 44) / 2\n"
              + i1 + "self.assertLessEqual(2 * (6 - inset) ** 2, 6 ** 2)\n"
          )
          if inserted_marker not in test:
              if test.count(marker) != 1:
                  raise SystemExit("frontend geometry test anchor drifted")
              test = test.replace(marker, marker + block, 1)
              test_path.write_text(test, encoding="utf-8")
          PY

      - name: Verify the focused source and geometry contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/test_frontend_source_boundaries.py
          python3 tests/test_frontend_source_boundaries.py
          git diff --check
          grep -Fq 'body[data-szl-flow] .szl-flow-toggle {' console/assets/szl-flow.css
          grep -Fq 'contiguous 44x44 hit region' console/assets/szl-flow.css

      - name: Commit the permanent candidate
        shell: bash
        run: |
          set -euo pipefail
          git add console/assets/szl-flow.css tests/test_frontend_source_boundaries.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'fix(frontend): preserve a full mobile menu hit target' \
            -m 'Override the higher-specificity generic button geometry for the Flow Shell menu so its 48px square and 6px radius contain a fully hit-testable 44x44 region. Extend the source-boundary regression to lock the applied cascade and rounded-corner geometry.' \
            -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:fix/hf-frontend-menu-hit-target-v1-20260904
