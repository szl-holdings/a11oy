name: HF frontend live canary report fix 2026-08-17

on:
  push:
    branches:
      - feat/hf-frontend-live-canary-v1-20260817
    paths:
      - .github/workflows/hf-frontend-live-canary-report-fix-20260817.yml

permissions:
  contents: write

jobs:
  repair-and-retire:
    if: >-
      github.actor == 'stephenlutar2-hash' &&
      github.ref == 'refs/heads/feat/hf-frontend-live-canary-v1-20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_BRANCH: feat/hf-frontend-live-canary-v1-20260817
      SELF_PATH: .github/workflows/hf-frontend-live-canary-report-fix-20260817.yml
      TARGET_PATH: .github/workflows/hf-frontend-live-canary-v1.yml
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind checkout to event head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Repair environment-bound issue rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/hf-frontend-live-canary-v1.yml')
          text = path.read_text(encoding='utf-8')
          old = """          import json\n          from pathlib import Path\n          report = json.loads(Path('evidence/hf-frontend-live-canary/report.json').read_text())\n          print('## Hugging Face universal frontend live canary')\n          print()\n          print(f\"- Protected source: `${{GITHUB_SHA}}`\")\n          print(f\"- Run: ${{GITHUB_SERVER_URL}}/${{GITHUB_REPOSITORY}}/actions/runs/${{GITHUB_RUN_ID}}\")\n"""
          new = """          import json\n          import os\n          from pathlib import Path\n          report = json.loads(Path('evidence/hf-frontend-live-canary/report.json').read_text())\n          print('## Hugging Face universal frontend live canary')\n          print()\n          print(f\"- Protected source: `{os.environ['GITHUB_SHA']}`\")\n          print(f\"- Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\")\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one report block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify repaired workflow contract
        run: |
          grep -Fq "os.environ['GITHUB_SHA']" "$TARGET_PATH"
          grep -Fq "os.environ['GITHUB_RUN_ID']" "$TARGET_PATH"
          ! grep -Fq '${{GITHUB_SERVER_URL}}/${{GITHUB_REPOSITORY}}' "$TARGET_PATH"

      - name: Retire repair controller and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm "$SELF_PATH"
          git add "$TARGET_PATH"
          git config user.name 'Stephen P. Lutar Jr.'
          git config user.email 'stephen@szlholdings.com'
          git commit \
            -m 'fix(hf): bind live-canary report to workflow environment' \
            -m 'Signed-off-by: Stephen P. Lutar Jr. <stephen@szlholdings.com>'
          git push origin HEAD:$HEAD_BRANCH
