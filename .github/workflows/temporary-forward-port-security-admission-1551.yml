name: temporary-forward-port-security-admission-1551

on:
  push:
    branches:
      - fix/hf-security-input-admission-bootstrap-20260830
    paths:
      - .github/workflows/temporary-forward-port-security-admission-1551.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-security-input-admission-bootstrap-20260830
          fetch-depth: 0
          persist-credentials: true

      - name: Integrate protected main and verify both admission controllers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git fetch origin main
          git merge --no-ff --no-commit origin/main
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::unexpected current-main conflict"
            git diff --name-status --diff-filter=U
            exit 1
          fi
          python -m py_compile \
            .github/scripts/select_hf_candidate_admission.py \
            .github/scripts/verify_hf_security_candidate_admission.py \
            .github/scripts/verify_hf_candidate_admission.py
          python -m unittest \
            tests.test_hf_security_candidate_admission \
            tests.test_verify_hf_candidate_admission -v
          git diff --check
          rm .github/workflows/temporary-forward-port-security-admission-1551.yml
          git add -A
          git commit \
            -m "feat(hf): integrate security admission with current main" \
            -m "The new exact-byte RFC 9116 successor lane and the established candidate controller both passed after a conflict-free protected-main integration." \
            -m "Signed-off-by: Stephen P. Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:refs/heads/fix/hf-security-input-admission-bootstrap-20260830
