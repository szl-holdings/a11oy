name: temporary-close-superseded-1535

on:
  push:
    branches:
      - feat/frontier-brainanswer
    paths:
      - .github/workflows/temporary-close-superseded-1535.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  close-when-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/frontier-brainanswer
          fetch-depth: 0
          persist-credentials: true
      - name: Wait for serialized successor merge
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            merged_at="$(gh api repos/szl-holdings/a11oy/pulls/1545 --jq '.merged_at // empty' 2>/dev/null || true)"
            if [ -n "$merged_at" ]; then
              gh pr close 1535 --repo szl-holdings/a11oy --comment "Superseded by protected merge #1545, serialized after Brain Retro and Brain Local on the resulting current main."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Successor #1545 has not merged within the bounded wait; original PR remains open."
          exit 1
      - name: Remove watcher from branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          rm .github/workflows/temporary-close-superseded-1535.yml
          git add -A
          git commit -m "chore(ci): remove superseded-PR watcher" -m "Signed-off-by: Stephen P. Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:feat/frontier-brainanswer
