name: Temporary HF candidate-controller applicator

on:
  push:
    branches:
      - fix/hf-candidate-controller-wiring-20260817

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply deterministic wiring patch
        run: python3 scripts/_apply_hf_candidate_controller_wiring.py
      - name: Remove temporary applicator
        run: |
          rm scripts/_apply_hf_candidate_controller_wiring.py
          rm .github/workflows/_temp-hf-candidate-controller-applicator.yml
      - name: Validate changed Python and whitespace
        run: |
          python3 -B -m py_compile \
            scripts/validate_frontdoor_source_integrity.py \
            scripts/test_frontdoor_source_integrity.py
          git diff --check
      - name: Commit exact implementation
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(hf): wire base-controlled candidate admission

Route the pull-request candidate parity job through the controller checked out from the exact protected base. Update the independent workflow-shape guard and adversarial role-separation tests while retaining the strict baseline verifier path.

Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin "HEAD:$BRANCH"
