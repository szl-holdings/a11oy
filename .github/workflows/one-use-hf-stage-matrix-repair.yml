name: One-use HF ecosystem stage-matrix repair

on:
  push:
    branches:
      - fix/hf-ecosystem-stage-matrix-20260904
    paths:
      - .github/workflows/one-use-hf-stage-matrix-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-use-hf-ecosystem-stage-matrix-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-ecosystem-stage-matrix-20260904
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Regenerate and verify the deterministic stage matrix
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_ecosystem_stage_matrix.py
          python scripts/build_ecosystem_stage_matrix.py
          python scripts/build_ecosystem_stage_matrix.py --check

      - name: Commit derived matrix and remove this one-use runner
        run: |
          set -euo pipefail
          git config user.name 'Stephen Lutar'
          git config user.email 'stephenlutar2@gmail.com'
          git add docs/ecosystem-stage-matrix.json
          git rm .github/workflows/one-use-hf-stage-matrix-repair.yml
          if git diff --cached --quiet; then
            echo 'No derived repair was produced.' >&2
            exit 1
          fi
          git commit -s -m 'fix(hf): reconcile ecosystem stage matrix'
          git push origin HEAD:fix/hf-ecosystem-stage-matrix-20260904
