name: Materialize exact ecosystem matrix once
on:
  push:
    branches: [fix/ecosystem-matrix-alignment-20260905]
    paths: [.github/workflows/repair-ecosystem-matrix-once.yml]
permissions:
  contents: write
concurrency:
  group: ecosystem-matrix-alignment-once
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/fix/ecosystem-matrix-alignment-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Regenerate only from the three committed evidence sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/build_ecosystem_stage_matrix.py)" = fa3e043085ac2942b22a9ebd30d9e09e2f335929
          python -S scripts/build_ecosystem_stage_matrix.py
          python -S scripts/build_ecosystem_stage_matrix.py --check
          python -S - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          paths = ['docs/ecosystem-readiness-report.json','docs/theorem-runtime-manifest.json','docs/huggingface-ecosystem-manifest.json']
          before = json.loads(subprocess.check_output(['git','show','HEAD:docs/ecosystem-stage-matrix.json'],text=True))
          raw = Path('docs/ecosystem-stage-matrix.json').read_bytes()
          after = json.loads(raw)
          hf = json.loads(Path(paths[2]).read_text())
          if after['machineGeneratedCounts']['huggingFacePublic'] != hf['counts']:
              raise SystemExit('Generated counts do not match source evidence')
          expected = {(item['id'], kind[:-1] if kind.endswith('s') else kind) for kind, items in hf['inventory'].items() for item in items}
          actual = {(item['id'], item['repoType']) for item in after['huggingFace']}
          if actual != expected or len(actual) != len(after['huggingFace']):
              raise SystemExit('Generated inventory is incomplete or duplicated')
          if after['observedAt'] != hf['observedAt']:
              raise SystemExit('Observation timestamp must come from the source, not regeneration time')
          if set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) != {'docs/ecosystem-stage-matrix.json'}:
              raise SystemExit('Unexpected changed files')
          print(json.dumps({'schema':'szl.ecosystem-matrix-repair/v1','input_sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},'matrix_sha256':hashlib.sha256(raw).hexdigest(),'old_counts':before['machineGeneratedCounts']['huggingFacePublic'],'new_counts':hf['counts'],'rows':len(actual),'observed_at':hf['observedAt'],'provider_writes':False,'runtime_claims_upgraded':False},sort_keys=True))
          PY
          git diff --check
      - name: Commit only the verified matrix to the unchanged isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/ecosystem-matrix-alignment-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_HEAD"
          git add -- docs/ecosystem-stage-matrix.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ecosystem): regenerate matrix from current committed evidence'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
