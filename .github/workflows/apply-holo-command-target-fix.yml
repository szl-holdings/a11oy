# SPDX-License-Identifier: Apache-2.0
name: Apply Holo command target repair

on:
  push:
    branches:
      - fix/holo-command-target-48px-v1
    paths:
      - .github/workflows/apply-holo-command-target-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-holo-command-target-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/holo-command-target-48px-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Repair shared command geometry and add regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css = Path("static/shared/szl_command_bar.css")
          text = css.read_text(encoding="utf-8")
          old = """.szl-origins a,.szl-origins button.szl-origin{
            appearance:none;background:transparent;border:0;color:var(--muted);
            font:inherit;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
            padding:7px 10px;border-radius:6px;min-height:36px;
          }"""
          new = """.szl-origins a,.szl-origins button.szl-origin{
            appearance:none;background:transparent;border:0;color:var(--muted);
            display:inline-flex;align-items:center;justify-content:center;
            font:inherit;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
            padding:7px 10px;border-radius:6px;min-width:48px;min-height:48px;
          }"""
          if text.count(old) != 1:
              raise SystemExit("shared origin geometry target missing or ambiguous")
          css.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("tests/test_command_bar_hit_target_contract.py")
          test.write_text('''# SPDX-License-Identifier: Apache-2.0
          from __future__ import annotations

          import math
          import re
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]


          class CommandBarHitTargetContract(unittest.TestCase):
              def test_shared_origin_controls_reserve_real_44px_hit_region(self) -> None:
                  css = (ROOT / "static/shared/szl_command_bar.css").read_text(encoding="utf-8")
                  match = re.search(
                      r"[.]szl-origins a,[.]szl-origins button[.]szl-origin[{](.*?)[}]",
                      css,
                      flags=re.DOTALL,
                  )
                  self.assertIsNotNone(match)
                  block = re.sub(r"\\s+", "", match.group(1))
                  self.assertIn("display:inline-flex", block)
                  self.assertIn("align-items:center", block)
                  self.assertIn("justify-content:center", block)
                  self.assertIn("min-width:48px", block)
                  self.assertIn("min-height:48px", block)
                  self.assertIn("border-radius:6px", block)

                  # A centered 44x44 square leaves two CSS pixels on every side.
                  # At a 6px rounded corner, the square's outer corner remains
                  # inside the quarter circle: hypot(6-2, 6-2) <= 6.
                  self.assertLessEqual(math.hypot(4, 4), 6)

              def test_holo_link_uses_the_shared_origin_contract(self) -> None:
                  js = (ROOT / "static/shared/szl_command_bar.js").read_text(encoding="utf-8")
                  self.assertRegex(
                      js,
                      r"var holo = el[(]'a', [{][^}]*class: 'szl-origin'[^}]*href: '/holographic'",
                  )
                  self.assertIn("var origins = el('div', { class: 'szl-origins' }", js)


          if __name__ == "__main__":
              unittest.main()
          '''.replace("          ", ""), encoding="utf-8")

          Path(".github/workflows/apply-holo-command-target-fix.yml").unlink()
          PY

      - name: Verify focused regression and repository syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_command_bar_hit_target_contract -v
          node --check static/shared/szl_command_bar.js
          git diff --check

      - name: Commit exact forward repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add static/shared/szl_command_bar.css \
            tests/test_command_bar_hit_target_contract.py \
            .github/workflows/apply-holo-command-target-fix.yml
          git commit -s -m "fix(frontend): reserve a real Holo command hit region"
          git push origin HEAD:fix/holo-command-target-48px-v1
