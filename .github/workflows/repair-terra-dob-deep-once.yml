name: Materialize detailed DOB parity once

on:
  push:
    branches: [fix/terra-dob-recent-valid-20260905]
    paths: [.github/workflows/repair-terra-dob-deep-once.yml]

permissions:
  contents: write

concurrency:
  group: repair-terra-dob-deep-20260905
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/fix/terra-dob-recent-valid-20260905' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact isolated repair source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply verified detailed function and continuous test coverage
        shell: bash
        run: |
          set -euo pipefail
          python -S - <<'PY'
          import ast
          import hashlib
          from pathlib import Path
          summary = Path('a11oy_vertical_feeds.py').read_text(encoding='utf-8')
          nodes = [n for n in ast.parse(summary).body if isinstance(n, ast.FunctionDef) and n.name == 'feed_nyc_dob']
          if len(nodes) != 1:
              raise SystemExit('Summary function identity is ambiguous')
          original = ast.get_source_segment(summary, nodes[0]) + '\n'
          if hashlib.sha256(original.encode()).hexdigest() != 'df8abee1b24b863cc7f87b65251246de143f612075256c0d89fba39a17f1e485':
              raise SystemExit('Reviewed summary function changed')
          target = Path('a11oy_deva_feeds.py')
          raw = target.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if blob != '141706b81f95c605c3da13deecd645453d841709':
              raise SystemExit('Detailed module changed; preserve concurrent work')
          deep = original.replace('def feed_nyc_dob(limit: int = 30)', 'def feed_dob_violations(limit: int = 60)').replace('_bounded_limit(limit, 30, 1000)', '_bounded_limit(limit, 60, 1000)').replace('isn_dob_bis_viol,violation_type,house_number,street,boro,issue_date', 'isn_dob_bis_viol,violation_type,house_number,street,boro,issue_date,violation_category,block,lot,description').replace('"boro": row.get("boro"),', '"boro": row.get("boro"),\n                "category": row.get("violation_category"),\n                "block": row.get("block"),\n                "lot": row.get("lot"),\n                "desc": str(row.get("description") or "")[:120],').replace('_variant_cache_key("nyc_dob",', '_variant_cache_key("dob_viol",')
          if hashlib.sha256(deep.encode()).hexdigest() != '84d191739866408e164575d3365a70a625c07f31707055cac3b3fffc45a122f9':
              raise SystemExit('Detailed candidate differs from locally tested bytes')
          text = raw.decode('utf-8')
          nodes = [n for n in ast.parse(text).body if isinstance(n, ast.FunctionDef) and n.name == 'feed_dob_violations']
          if len(nodes) != 1:
              raise SystemExit('Detailed function identity is ambiguous')
          lines = text.splitlines(keepends=True)
          lines[nodes[0].lineno - 1:nodes[0].end_lineno] = [deep]
          updated = ''.join(lines)
          compile(updated, str(target), 'exec')
          target.write_text(updated, encoding='utf-8')
          workflow = Path('.github/workflows/nyc-dob-source-contract.yml')
          content = workflow.read_text(encoding='utf-8')
          marker = '      - a11oy_vertical_feeds.py\n'
          if content.count(marker) != 2 or content.count('run: python -S -m py_compile a11oy_vertical_feeds.py') != 1:
              raise SystemExit('Continuous test workflow shape changed')
          content = content.replace(marker, marker + '      - a11oy_deva_feeds.py\n')
          content = content.replace('run: python -S -m py_compile a11oy_vertical_feeds.py', 'run: python -S -m py_compile a11oy_vertical_feeds.py a11oy_deva_feeds.py')
          workflow.write_text(content, encoding='utf-8')
          print('Updated exactly one detailed function and its continuous-test inputs')
          PY
          python -S -m unittest discover -s tests -p test_nyc_dob_recent_source.py -v
          git diff --check
      - name: Remove the one-use materializer and fast-forward only its isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/terra-dob-recent-valid-20260905
          observed="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$observed" = "$EXPECTED_HEAD"
          rm .github/workflows/repair-terra-dob-deep-once.yml
          git add -- a11oy_deva_feeds.py .github/workflows/nyc-dob-source-contract.yml .github/workflows/repair-terra-dob-deep-once.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(terra): keep detailed DOB views calendar-valid and recent'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
