name: Finalize Killinchu defense convergence v1

on:
  push:
    branches:
      - feat/killinchu-aegis-convergence-v1
    paths:
      - .github/workflows/finalize-killinchu-defense-convergence-v1.yml

permissions:
  contents: write

concurrency:
  group: finalize-killinchu-defense-convergence-v1
  cancel-in-progress: false

jobs:
  reconcile-and-clean:
    name: Reconcile, prove, and remove temporary controllers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: feat/killinchu-aegis-convergence-v1
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact convergence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile with protected main
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/strategy/killinchu-defense-convergence.v1.json
          test -f tests/test_killinchu_defense_convergence.py
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Prove focused convergence contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool docs/strategy/living-command-fabric.v1.json >/dev/null
          python -m json.tool docs/strategy/killinchu-defense-convergence.v1.json >/dev/null
          python -m json.tool docs/holographic-experience-v2/theme-registry.json >/dev/null
          python -m unittest \
            tests.test_living_command_fabric_frontdoor \
            tests.test_killinchu_defense_convergence \
            -v
          python -m pytest -q tests/test_hf_publish_vertical_flagships_v4.py
          python -m py_compile \
            tests/test_living_command_fabric_frontdoor.py \
            tests/test_killinchu_defense_convergence.py \
            scripts/hf_publish_vertical_flagships_v4_impl.py
          node --check console/assets/szl-holo-v2.js
          git diff --check HEAD

      - name: Remove temporary controllers and push clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/finalize-killinchu-defense-convergence-v1.yml \
            .github/workflows/apply-killinchu-aegis-convergence-v1.yml \
            tools/apply_killinchu_aegis_convergence_v1.py
          git diff --check HEAD
          git add -A
          git commit -m "chore(killinchu): remove convergence bootstrap controllers" \
            -m "Keep only the tested five-body architecture, canonical Killinchu lobe contract, publisher configuration, and regression evidence." \
            -m "Signed-off-by: Stephen P. Lutar Jr. <stephenlutar2@gmail.com>"
          git push origin "HEAD:${BRANCH}"
