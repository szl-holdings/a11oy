name: Publicize and recover every SZLHOLDINGS Space

on:
  push:
    branches:
      - ops/public-all-hf-spaces-20260904

permissions:
  contents: read
  issues: write

concurrency:
  group: szl-public-all-hf-spaces-20260904
  cancel-in-progress: false

env:
  HF_ORG: SZLHOLDINGS
  REPORT_JSON: reports/hf-estate-public-operational-20260904.json
  REPORT_MD: reports/hf-estate-public-operational-20260904.md
  TRACKING_ISSUE: "1764"

jobs:
  converge:
    name: Publicize, restart, and anonymously prove every Space
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_WRITE_TOKEN || secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_HUB_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact Hub control client
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface_hub==1.23.0"
          "requests==2.32.5"

      - name: Converge the live organization estate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import hashlib
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          import requests
          from huggingface_hub import HfApi, hf_hub_download, wait_for_space
          from huggingface_hub.errors import BadRequestError, HfHubHTTPError

          ORG = os.environ["HF_ORG"]
          TOKEN = (os.environ.get("HF_TOKEN") or "").strip()
          REPORT_JSON = Path(os.environ["REPORT_JSON"])
          REPORT_MD = Path(os.environ["REPORT_MD"])
          REPORT_JSON.parent.mkdir(parents=True, exist_ok=True)

          if not TOKEN:
              raise SystemExit("No write-capable Hugging Face token is configured in the repository secrets.")

          api = HfApi(token=TOKEN)
          anonymous = HfApi(token=False)
          identity = api.whoami(token=TOKEN, cache=False)

          # High-confidence detectors only. Findings are path + detector names; never secret bytes.
          secret_patterns: tuple[tuple[str, re.Pattern[str]], ...] = (
              ("pem-private-key", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----")),
              ("huggingface-token", re.compile(r"\bhf_[A-Za-z0-9]{30,}\b")),
              ("github-token", re.compile(r"\b(?:github_pat_|gh[pousr]_)[A-Za-z0-9_]{20,}\b")),
              ("openai-token", re.compile(r"\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b")),
              ("aws-access-key", re.compile(r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b")),
          )
          text_suffixes = {
              ".py", ".js", ".mjs", ".cjs", ".ts", ".tsx", ".jsx", ".json",
              ".yaml", ".yml", ".toml", ".ini", ".cfg", ".conf", ".md", ".txt",
              ".sh", ".bash", ".zsh", ".ps1", ".env", ".properties", ".xml",
              ".html", ".css", ".dockerfile",
          }
          forbidden_basenames = {
              ".env", "id_rsa", "id_ed25519", "credentials.json", "service-account.json",
              "secrets.json", "private_key.pem", "private-key.pem",
          }
          forbidden_suffixes = {".p12", ".pfx", ".jks", ".keystore"}
          allowed_example_markers = {"example", "sample", "template", "placeholder"}

          def stage_value(runtime: Any) -> str | None:
              value = getattr(runtime, "stage", None)
              return str(value) if value is not None else None

          def safe_error(exc: BaseException) -> str:
              rendered = " ".join(str(exc).split())[:600]
              if TOKEN:
                  rendered = rendered.replace(TOKEN, "<redacted>")
              return rendered or type(exc).__name__

          def scan_private_space(repo_id: str) -> list[dict[str, str]]:
              findings: list[dict[str, str]] = []
              try:
                  info = api.space_info(repo_id, files_metadata=True, token=TOKEN)
              except Exception as exc:  # report and refuse exposure when inspection is impossible
                  return [{"path": "<repository>", "detector": "inspection-failed", "detail": safe_error(exc)}]

              for sibling in getattr(info, "siblings", None) or []:
                  path = str(getattr(sibling, "rfilename", "") or "")
                  if not path:
                      continue
                  lower = path.lower()
                  base = Path(lower).name
                  size = getattr(sibling, "size", None)
                  is_example = any(marker in lower for marker in allowed_example_markers)

                  if base in forbidden_basenames and not is_example:
                      findings.append({"path": path, "detector": "sensitive-filename"})
                      continue
                  if Path(lower).suffix in forbidden_suffixes and not is_example:
                      findings.append({"path": path, "detector": "private-keystore"})
                      continue
                  if size is not None and int(size) > 1_000_000:
                      continue
                  suffix = Path(lower).suffix
                  if suffix not in text_suffixes and base not in {"dockerfile", "procfile", "makefile"}:
                      continue
                  try:
                      local = hf_hub_download(
                          repo_id=repo_id,
                          filename=path,
                          repo_type="space",
                          token=TOKEN,
                      )
                      raw = Path(local).read_bytes()
                      if len(raw) > 1_000_000 or b"\x00" in raw[:8192]:
                          continue
                      text = raw.decode("utf-8", "replace")
                  except Exception as exc:
                      findings.append({"path": path, "detector": "inspection-failed", "detail": safe_error(exc)})
                      continue
                  for detector, pattern in secret_patterns:
                      if pattern.search(text):
                          findings.append({"path": path, "detector": detector})
              return findings

          def anonymous_get(url: str) -> dict[str, Any]:
              try:
                  response = requests.get(
                      url,
                      timeout=35,
                      allow_redirects=True,
                      headers={
                          "User-Agent": "SZL-HF-estate-public-proof/1.0",
                          "Cache-Control": "no-cache, no-store",
                          "Pragma": "no-cache",
                      },
                  )
                  return {
                      "status": response.status_code,
                      "final_url": response.url,
                      "content_type": response.headers.get("content-type"),
                  }
              except requests.RequestException as exc:
                  return {"status": None, "error": type(exc).__name__}

          spaces = sorted(
              list(api.list_spaces(author=ORG, full=True, token=TOKEN)),
              key=lambda item: item.id.lower(),
          )
          if not spaces:
              raise SystemExit(f"Authenticated inventory returned zero Spaces for {ORG}.")

          rows: list[dict[str, Any]] = []
          wait_ids: list[str] = []

          for listed in spaces:
              repo_id = listed.id
              row: dict[str, Any] = {
                  "id": repo_id,
                  "sdk": getattr(listed, "sdk", None),
                  "sha_before": getattr(listed, "sha", None),
                  "private_before": bool(getattr(listed, "private", False)),
                  "disabled": bool(getattr(listed, "disabled", False)),
                  "visibility_action": "already-public",
                  "restart_action": "none",
                  "errors": [],
                  "secret_scan": [],
              }

              if row["private_before"]:
                  row["secret_scan"] = scan_private_space(repo_id)
                  if row["secret_scan"]:
                      row["visibility_action"] = "blocked-by-secret-scan"
                      row["errors"].append("Private Space was not exposed because high-confidence secret inspection did not pass.")
                      rows.append(row)
                      continue

              try:
                  # Apply to every Space, not merely the cached private set. This also collapses
                  # any protected/non-public visibility to the public setting idempotently.
                  api.update_repo_visibility(repo_id=repo_id, repo_type="space", private=False, token=TOKEN)
                  row["visibility_action"] = "set-public" if row["private_before"] else "verified-public-setting"
              except Exception as exc:
                  row["visibility_action"] = "failed"
                  row["errors"].append(f"visibility: {safe_error(exc)}")
                  rows.append(row)
                  continue

              try:
                  current = api.space_info(repo_id, full=True if False else None, token=TOKEN)
              except TypeError:
                  current = api.space_info(repo_id, token=TOKEN)
              row["private_after_authenticated"] = bool(getattr(current, "private", True))
              row["sdk"] = getattr(current, "sdk", row["sdk"])
              row["sha_after"] = getattr(current, "sha", None)
              row["subdomain"] = getattr(current, "subdomain", None)
              row["host"] = getattr(current, "host", None)

              if row["private_after_authenticated"]:
                  row["errors"].append("visibility readback remains private")

              if str(row["sdk"] or "").lower() == "static":
                  row["stage_before"] = "STATIC"
                  row["stage_after"] = "STATIC"
                  row["restart_action"] = "not-applicable-static"
              else:
                  try:
                      runtime = api.get_space_runtime(repo_id, token=TOKEN)
                      before = stage_value(runtime)
                      row["stage_before"] = before
                      intermediate = {"BUILDING", "RUNNING_BUILDING", "APP_STARTING", "RUNNING_APP_STARTING"}
                      healthy = {"RUNNING"}
                      if before in healthy:
                          row["restart_action"] = "already-running"
                      elif before in intermediate:
                          row["restart_action"] = "wait-existing-transition"
                          wait_ids.append(repo_id)
                      else:
                          factory = before in {"BUILD_ERROR", "RUNTIME_ERROR", "CONFIG_ERROR", "NO_APP_FILE"}
                          api.restart_space(repo_id, token=TOKEN, factory_reboot=factory)
                          row["restart_action"] = "factory-reboot" if factory else "restart"
                          wait_ids.append(repo_id)
                  except BadRequestError as exc:
                      # A static Space can occasionally expose stale SDK metadata. Re-read and record.
                      row["restart_action"] = "not-applicable"
                      row["errors"].append(f"runtime: {safe_error(exc)}")
                  except Exception as exc:
                      row["restart_action"] = "failed"
                      row["errors"].append(f"runtime: {safe_error(exc)}")

              rows.append(row)

          def wait_one(repo_id: str) -> tuple[str, str | None, str | None]:
              try:
                  runtime = wait_for_space(
                      repo_id,
                      timeout=1200,
                      poll_interval=10,
                      token=TOKEN,
                  )
                  return repo_id, stage_value(runtime), None
              except Exception as exc:
                  try:
                      stage = stage_value(api.get_space_runtime(repo_id, token=TOKEN))
                  except Exception:
                      stage = None
                  return repo_id, stage, safe_error(exc)

          waited: dict[str, tuple[str | None, str | None]] = {}
          if wait_ids:
              with concurrent.futures.ThreadPoolExecutor(max_workers=min(8, len(wait_ids))) as pool:
                  futures = [pool.submit(wait_one, repo_id) for repo_id in sorted(set(wait_ids))]
                  for future in concurrent.futures.as_completed(futures):
                      repo_id, stage, error = future.result()
                      waited[repo_id] = (stage, error)

          for row in rows:
              repo_id = row["id"]
              if row.get("visibility_action") == "blocked-by-secret-scan":
                  row["public_repo_probe"] = {"status": None, "skipped": "secret-scan-block"}
                  row["public_app_probe"] = {"status": None, "skipped": "secret-scan-block"}
                  row["operational"] = False
                  continue

              if str(row.get("sdk") or "").lower() != "static":
                  stage, wait_error = waited.get(repo_id, (None, None))
                  if stage is None:
                      try:
                          stage = stage_value(api.get_space_runtime(repo_id, token=TOKEN))
                      except Exception as exc:
                          row["errors"].append(f"runtime-readback: {safe_error(exc)}")
                  row["stage_after"] = stage
                  if wait_error:
                      row["errors"].append(f"wait: {wait_error}")

              try:
                  public_info = anonymous.space_info(repo_id, token=False)
                  row["private_after_anonymous"] = bool(getattr(public_info, "private", True))
                  row["public_sha"] = getattr(public_info, "sha", None)
                  row["host"] = getattr(public_info, "host", None) or row.get("host")
                  row["subdomain"] = getattr(public_info, "subdomain", None) or row.get("subdomain")
              except Exception as exc:
                  row["private_after_anonymous"] = True
                  row["errors"].append(f"anonymous-metadata: {safe_error(exc)}")

              row["public_repo_probe"] = anonymous_get(f"https://huggingface.co/spaces/{repo_id}")
              app_url = row.get("host")
              if app_url and not str(app_url).startswith("http"):
                  app_url = f"https://{app_url}"
              if not app_url and row.get("subdomain"):
                  app_url = f"https://{row['subdomain']}.hf.space"
              row["app_url"] = app_url
              row["public_app_probe"] = anonymous_get(app_url) if app_url else {"status": None, "error": "no-host"}

              repo_ok = row["public_repo_probe"].get("status") == 200
              app_status = row["public_app_probe"].get("status")
              app_ok = isinstance(app_status, int) and 200 <= app_status < 400
              visibility_ok = not row.get("private_after_authenticated", True) and not row.get("private_after_anonymous", True)
              runtime_ok = (
                  str(row.get("sdk") or "").lower() == "static"
                  or row.get("stage_after") == "RUNNING"
              )
              row["operational"] = bool(visibility_ok and repo_ok and runtime_ok and app_ok and not row["errors"])

          all_public = all(
              row.get("visibility_action") != "blocked-by-secret-scan"
              and not row.get("private_after_authenticated", True)
              and not row.get("private_after_anonymous", True)
              for row in rows
          )
          all_operational = all(bool(row.get("operational")) for row in rows)
          report = {
              "schema": "szl.hf-estate-public-operational/v1",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "controller_repository": os.environ.get("GITHUB_REPOSITORY"),
              "controller_sha": os.environ.get("GITHUB_SHA"),
              "organization": ORG,
              "authenticated_identity": {
                  "name": identity.get("name") or identity.get("fullname"),
                  "type": identity.get("type"),
              },
              "space_count": len(rows),
              "private_before_count": sum(bool(row.get("private_before")) for row in rows),
              "public_after_count": sum(
                  not row.get("private_after_authenticated", True)
                  and not row.get("private_after_anonymous", True)
                  for row in rows
              ),
              "running_after_count": sum(
                  row.get("stage_after") in {"RUNNING", "STATIC"} for row in rows
              ),
              "operational_count": sum(bool(row.get("operational")) for row in rows),
              "secret_scan_block_count": sum(
                  row.get("visibility_action") == "blocked-by-secret-scan" for row in rows
              ),
              "all_public": all_public,
              "all_operational": all_operational,
              "success": bool(all_public and all_operational),
              "spaces": rows,
          }
          canonical = json.dumps(report, sort_keys=True, separators=(",", ":")).encode()
          report["receipt_sha256"] = hashlib.sha256(canonical).hexdigest()
          REPORT_JSON.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          lines = [
              "# SZLHOLDINGS Space public + operational receipt",
              "",
              f"- Generated: `{report['generated_at']}`",
              f"- Controller SHA: `{report['controller_sha']}`",
              f"- Spaces: `{report['space_count']}`",
              f"- Private before: `{report['private_before_count']}`",
              f"- Public after: `{report['public_after_count']}`",
              f"- Running/static after: `{report['running_after_count']}`",
              f"- Fully operational: `{report['operational_count']}`",
              f"- Secret-scan blocks: `{report['secret_scan_block_count']}`",
              f"- Success: `{report['success']}`",
              f"- Receipt SHA-256: `{report['receipt_sha256']}`",
              "",
              "| Space | SDK | Visibility | Runtime | Repo | App | Operational |",
              "|---|---|---|---|---:|---:|---:|",
          ]
          for row in rows:
              visibility = row.get("visibility_action")
              runtime = row.get("stage_after") or row.get("stage_before") or "UNKNOWN"
              repo_status = row.get("public_repo_probe", {}).get("status")
              app_status = row.get("public_app_probe", {}).get("status")
              lines.append(
                  f"| `{row['id']}` | `{row.get('sdk')}` | `{visibility}` | `{runtime}` | "
                  f"`{repo_status}` | `{app_status}` | `{row.get('operational')}` |"
              )
          REPORT_MD.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(json.dumps({key: report[key] for key in (
              "space_count", "private_before_count", "public_after_count",
              "running_after_count", "operational_count", "secret_scan_block_count",
              "all_public", "all_operational", "success", "receipt_sha256"
          )}, indent=2, sort_keys=True))
          PY

      - name: Upload immutable estate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-estate-public-operational-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.REPORT_JSON }}
            ${{ env.REPORT_MD }}
          if-no-files-found: error
          retention-days: 180

      - name: Reconcile tracking issue from the receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$REPORT_JSON" ]; then
            printf '## HF estate convergence failed before a receipt was written\n\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/hf-estate-comment.md
            gh issue comment "$TRACKING_ISSUE" --body-file /tmp/hf-estate-comment.md
            exit 0
          fi
          python - <<'PY' > /tmp/hf-estate-comment.md
          import json, os
          report = json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))
          print("## HF estate public + operational receipt")
          print()
          print(f"- Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          print(f"- Controller SHA: `{report['controller_sha']}`")
          print(f"- Spaces: `{report['space_count']}`")
          print(f"- Private before: `{report['private_before_count']}`")
          print(f"- Public after: `{report['public_after_count']}`")
          print(f"- Running/static after: `{report['running_after_count']}`")
          print(f"- Fully operational: `{report['operational_count']}`")
          print(f"- Secret-scan blocks: `{report['secret_scan_block_count']}`")
          print(f"- Receipt SHA-256: `{report['receipt_sha256']}`")
          print(f"- Verdict: `{'PASS' if report['success'] else 'REPAIR_REQUIRED'}`")
          failed = [row for row in report["spaces"] if not row.get("operational")]
          if failed:
              print()
              print("### Exact repair queue")
              for row in failed:
                  print(f"- `{row['id']}` — visibility `{row.get('visibility_action')}`, runtime `{row.get('stage_after') or row.get('stage_before')}`, repo HTTP `{row.get('public_repo_probe', {}).get('status')}`, app HTTP `{row.get('public_app_probe', {}).get('status')}`, errors `{'; '.join(row.get('errors') or []) or 'none'}`")
          PY
          gh issue comment "$TRACKING_ISSUE" --body-file /tmp/hf-estate-comment.md
          if python -c 'import json,os; raise SystemExit(0 if json.load(open(os.environ["REPORT_JSON"]))["success"] else 1)'; then
            gh issue close "$TRACKING_ISSUE" --reason completed
          else
            gh issue reopen "$TRACKING_ISSUE" || true
          fi

      - name: Enforce a fully public and operational estate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          path = os.environ["REPORT_JSON"]
          report = json.load(open(path, encoding="utf-8"))
          if not report["success"]:
              raise SystemExit(
                  f"Estate is not terminal: public={report['public_after_count']}/{report['space_count']} "
                  f"operational={report['operational_count']}/{report['space_count']} "
                  f"secret_blocks={report['secret_scan_block_count']}"
              )
          PY
