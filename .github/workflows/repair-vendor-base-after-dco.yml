name: Repair vendor base after DCO retirement

on:
  push:
    branches:
      - fix/vendor-base-after-dco-20260831
    paths:
      - .github/workflows/repair-vendor-base-after-dco.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repair-vendor-base-after-dco
  cancel-in-progress: false

jobs:
  repair:
    name: Remove obsolete manifest entry and resync exact drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/vendor-base-after-dco-20260831
          fetch-depth: 1
          persist-credentials: true

      - name: Remove exact retired DCO manifest entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('vendor.manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          if manifest.get('monorepo') != 'szl-holdings/platform':
              raise SystemExit('unexpected monorepo identity')
          if manifest.get('pin') != 'de08cf8ec5836b0cef968d6560a92ecbd1bc6f4b':
              raise SystemExit('unexpected platform pin')
          files = manifest.get('files')
          if not isinstance(files, dict):
              raise SystemExit('manifest files map missing')
          expected = {'source': '.github/workflows/dco.yml', 'header': True}
          if files.get('.github/workflows/dco.yml') != expected:
              raise SystemExit('retired DCO manifest entry drifted')
          del files['.github/workflows/dco.yml']
          if '.github/workflows/dco.yml' in files:
              raise SystemExit('retired DCO entry survived')
          path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Refresh only the proven vendored data drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/sync_from_monorepo.sh sync --strict-headers

          # These files were already byte-correct and carried valid canonical
          # attribution headers with abbreviated immutable pins. The sync command
          # rewrites those accepted headers to the full pin, which is unrelated to
          # this repair. Restore them so the PR remains exactly bounded.
          git checkout -- \
            static/vendor3d/OrbitControls.js \
            static/vendor3d/THREE_LICENSE.txt \
            szl_chain_of_title.py \
            szl_khipu_lmdb.py \
            szl_unified_formulas.py

          bash scripts/sync_from_monorepo.sh check --strict-headers
          git diff --check

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            vendor.manifest.json \
            web/src/data/agiConvergenceData.ts | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected vendor repair surface:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

      - name: Commit exact verified repair
        shell: bash
        env:
          BRANCH: fix/vendor-base-after-dco-20260831
        run: |
          set -euo pipefail
          git config user.name 'SZL CI'
          git config user.email 'noreply@szlholdings.ai'
          git add vendor.manifest.json web/src/data/agiConvergenceData.ts
          git diff --cached --quiet && { echo 'No vendor repair delta.'; exit 0; }
          git commit -m 'fix: align vendor manifest after DCO retirement'
          git push origin "HEAD:${BRANCH}"
