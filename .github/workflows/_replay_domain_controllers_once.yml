name: Replay protected production-domain controllers once

on:
  push:
    branches:
      - ops/codex-perplexity-recovery-20260904-v1
    paths:
      - .github/workflows/_replay_domain_controllers_once.yml

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: replay-production-domain-controllers-20260904
  cancel-in-progress: false

jobs:
  replay:
    name: Dispatch HF then Cloudflare and retain independent public proof
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out controller branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/codex-perplexity-recovery-20260904-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Dispatch and wait for protected-main controllers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/domain-replay
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          repo = 'szl-holdings/a11oy'

          def gh(*args: str, check: bool = True) -> str:
              result = subprocess.run(
                  ['gh', *args], text=True, capture_output=True, check=False
              )
              if check and result.returncode:
                  raise RuntimeError(result.stderr.strip() or result.stdout.strip())
              return result.stdout

          def api(path: str, method: str = 'GET', fields: dict[str, str] | None = None, check: bool = True):
              args = ['api']
              if method != 'GET':
                  args += ['--method', method]
              args.append(path)
              for key, value in (fields or {}).items():
                  args += ['-f', f'{key}={value}']
              raw = gh(*args, check=check)
              if not raw.strip():
                  return None
              try:
                  return json.loads(raw)
              except json.JSONDecodeError:
                  return raw

          def dispatch_and_wait(workflow: str, inputs: dict[str, str] | None = None, timeout: int = 2400):
              started = dt.datetime.now(dt.timezone.utc)
              fields = {'ref': 'main'}
              for key, value in (inputs or {}).items():
                  fields[f'inputs[{key}]'] = value
              status = 0
              error = None
              try:
                  api(f'repos/{repo}/actions/workflows/{workflow}/dispatches', 'POST', fields)
                  status = 204
              except Exception as exc:
                  error = f'{type(exc).__name__}: {exc}'[:500]
                  return {'workflow': workflow, 'dispatch_http': status, 'error': error}

              deadline = time.monotonic() + timeout
              selected = None
              while time.monotonic() < deadline:
                  runs = api(f'repos/{repo}/actions/workflows/{workflow}/runs?event=workflow_dispatch&per_page=30')
                  for run in runs.get('workflow_runs', []):
                      created = dt.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
                      if created >= started - dt.timedelta(seconds=5):
                          if selected is None or created > dt.datetime.fromisoformat(selected['created_at'].replace('Z', '+00:00')):
                              selected = run
                  if selected and selected.get('status') == 'completed':
                      return {
                          'workflow': workflow,
                          'dispatch_http': status,
                          'run_id': selected.get('id'),
                          'url': selected.get('html_url'),
                          'status': selected.get('status'),
                          'conclusion': selected.get('conclusion'),
                          'head_sha': selected.get('head_sha'),
                          'run_attempt': selected.get('run_attempt'),
                      }
                  time.sleep(15)
              return {
                  'workflow': workflow,
                  'dispatch_http': status,
                  'run_id': selected.get('id') if selected else None,
                  'url': selected.get('html_url') if selected else None,
                  'status': selected.get('status') if selected else 'NOT_FOUND',
                  'conclusion': 'TIMEOUT',
              }

          result = {
              'schema': 'szl.production-domain-controller-replay/v1',
              'generated_at': dt.datetime.now(dt.timezone.utc).isoformat(),
              'credential_values_recorded': False,
              'source_mutated': False,
              'provider_mutation_authority': 'PROTECTED_MAIN_WORKFLOWS_ONLY',
              'runs': [],
          }
          result['runs'].append(dispatch_and_wait('repair-hf-product-domain.yml', timeout=2100))
          result['runs'].append(dispatch_and_wait('repair-cloudflare-product-edge.yml', {'dry_run': 'false'}, timeout=1500))
          Path('evidence/domain-replay/controller-runs.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Capture independent public readback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          def probe(url: str, follow: bool = True):
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              opener = urllib.request.build_opener() if follow else urllib.request.build_opener(NoRedirect)
              request = urllib.request.Request(url, headers={'User-Agent': 'SZL-domain-replay-proof/1.0'})
              try:
                  with opener.open(request, timeout=30) as response:
                      body = response.read(131072)
                      return {
                          'status': response.status,
                          'effective_url': response.geturl(),
                          'location': response.headers.get('Location'),
                          'content_type': response.headers.get('Content-Type'),
                          'body_prefix': body[:500].decode('utf-8', 'replace'),
                      }
              except urllib.error.HTTPError as exc:
                  body = exc.read(131072)
                  return {
                      'status': exc.code,
                      'effective_url': exc.geturl(),
                      'location': exc.headers.get('Location'),
                      'content_type': exc.headers.get('Content-Type'),
                      'body_prefix': body[:500].decode('utf-8', 'replace'),
                  }
              except Exception as exc:
                  return {'status': 'UNAVAILABLE', 'error': f'{type(exc).__name__}: {exc}'[:500]}

          proof = {
              'schema': 'szl.production-domain-public-proof/v1',
              'credential_values_recorded': False,
              'apex': probe('https://a-11-oy.com/'),
              'honest': probe('https://a-11-oy.com/api/a11oy/v1/honest'),
              'www': probe('https://www.a-11-oy.com/__szl_edge_probe__/path?contract=v3&preserve=yes', follow=False),
              'hf_origin': probe('https://szlholdings-a11oy.hf.space/'),
          }
          honest = proof['honest']
          try:
              contract = json.loads(honest.get('body_prefix') or '{}')
          except json.JSONDecodeError:
              contract = {}
          proof['honest_contract'] = {
              'organ': contract.get('organ'),
              'locked_formula_count': contract.get('locked_formula_count'),
          }
          expected_location = 'https://a-11-oy.com/__szl_edge_probe__/path?contract=v3&preserve=yes'
          proof['verified'] = bool(
              proof['apex'].get('status') == 200
              and honest.get('status') == 200
              and contract.get('organ') == 'a11oy'
              and contract.get('locked_formula_count') == 8
              and proof['www'].get('status') in {301, 308}
              and proof['www'].get('location') == expected_location
              and proof['hf_origin'].get('status') == 200
          )
          Path('evidence/domain-replay/public-proof.json').write_text(
              json.dumps(proof, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload replay evidence and reconcile incident
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-domain-controller-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/domain-replay
          if-no-files-found: error
          retention-days: 90

      - name: Post exact result and close only on complete proof
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/domain-replay-comment.md
          import json
          from pathlib import Path
          runs = json.loads(Path('evidence/domain-replay/controller-runs.json').read_text(encoding='utf-8'))
          proof = json.loads(Path('evidence/domain-replay/public-proof.json').read_text(encoding='utf-8'))
          print('## Protected domain-controller replay')
          print()
          for row in runs['runs']:
              print(f"- `{row['workflow']}` — `{row.get('conclusion', row.get('status'))}` — run `{row.get('run_id')}`")
          print(f"- Apex root: `{proof['apex'].get('status')}`")
          print(f"- Honesty API: `{proof['honest'].get('status')}`, `{proof.get('honest_contract')}`")
          print(f"- www redirect: `{proof['www'].get('status')}` → `{proof['www'].get('location')}`")
          print(f"- Direct HF origin: `{proof['hf_origin'].get('status')}`")
          print(f"- Independent complete proof: `{proof.get('verified')}`")
          print('- Credential values recorded: `false`')
          PY
          gh issue comment 1497 --repo szl-holdings/a11oy --body-file /tmp/domain-replay-comment.md
          verified="$(jq -r .verified evidence/domain-replay/public-proof.json)"
          hf="$(jq -r '.runs[] | select(.workflow == "repair-hf-product-domain.yml") | .conclusion' evidence/domain-replay/controller-runs.json)"
          cf="$(jq -r '.runs[] | select(.workflow == "repair-cloudflare-product-edge.yml") | .conclusion' evidence/domain-replay/controller-runs.json)"
          if [ "$verified" = true ] && [ "$hf" = success ] && [ "$cf" = success ]; then
            gh issue close 1497 --repo szl-holdings/a11oy --reason completed
          else
            gh issue reopen 1497 --repo szl-holdings/a11oy || true
          fi

      - name: Retire this one-shot dispatcher
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin ops/codex-perplexity-recovery-20260904-v1
          git rm --ignore-unmatch .github/workflows/_replay_domain_controllers_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/domain-replay || true
          if ! git diff --cached --quiet; then
            git commit -s -m "chore(evidence): retain production-domain controller replay"
            git push origin HEAD:ops/codex-perplexity-recovery-20260904-v1
          fi
