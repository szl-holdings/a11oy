name: Lockfile Registry Check

# Fails fast on the PR/push that introduces a lockfile referencing a
# Replit-internal registry host (e.g. package-firewall.replit.local). Such hosts
# do not resolve on GitHub runners and break npm/pnpm install.
#
# INLINED from szl-holdings/.github/.github/workflows/reusable-lockfile-registry-check.yml@79cb06b
# (scan logic byte-identical): the cross-repo reusable call created no check
# run anywhere in the org, so the ruleset-required check
# "lockfiles / No lockfile references a Replit-internal registry host" never
# reported and ruleset-gated PRs blocked. Inline job reports the same name.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfiles:
    name: lockfiles / No lockfile references a Replit-internal registry host
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Grep committed lockfiles for *.replit.local hosts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . \
            -path ./node_modules -prune -o \
            -path ./.git -prune -o \
            -type f \( \
              -name package-lock.json -o \
              -name npm-shrinkwrap.json -o \
              -name pnpm-lock.yaml -o \
              -name yarn.lock \
            \) -print | sed 's#^\./##' | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No lockfiles found to scan."
            exit 0
          fi

          echo "Scanning ${#files[@]} lockfile(s):"
          printf '  - %s\n' "${files[@]}"

          pattern='[A-Za-z0-9_.-]+\.replit\.local'
          found=0
          for f in "${files[@]}"; do
            if hits="$(grep -Eo "$pattern" "$f" | sort -u)"; [ -n "$hits" ]; then
              found=1
              joined="$(echo "$hits" | paste -sd', ' -)"
              echo "::error file=${f}::References Replit-internal registry host(s): ${joined}. These do not resolve on GitHub runners and break npm/pnpm install. Rewrite to https://registry.npmjs.org/ (integrity sha unchanged)."
            fi
          done

          if [ "$found" -ne 0 ]; then
            echo "::error::One or more lockfiles reference a Replit-internal (*.replit.local) registry host."
            exit 1
          fi

          echo "No lockfile references a Replit-internal registry host."
