name: Materialize vertical readiness signer contract v2

on:
  push:
    branches:
      - fix/vertical-readiness-signer-contract-v2

permissions:
  contents: write

concurrency:
  group: materialize-vertical-readiness-signer-contract-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/vertical-readiness-signer-contract-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Align emergency live proof with the canonical v2 readiness schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          target = Path('.github/workflows/emergency-live-convergence-v1.yml')
          temporary = Path('.github/workflows/materialize-vertical-readiness-contract-v2.yml')
          source = target.read_text(encoding='utf-8')

          old_body = textwrap.dedent('''
          vertical_build = json_body(indexed[VERTICAL_ORIGIN + "/api/build-info"])
          vertical_ready = json_body(indexed[VERTICAL_ORIGIN + "/readyz"])
          health_status = {path: indexed[VERTICAL_ORIGIN + path].get("status") for path in VERTICAL_HEALTH}
          vertical = {
              "build_http": indexed[VERTICAL_ORIGIN + "/api/build-info"].get("status"),
              "build_revision": revision(vertical_build),
              "ready_http": indexed[VERTICAL_ORIGIN + "/readyz"].get("status"),
              "ready": vertical_ready.get("ready"),
              "signing_key_source": vertical_ready.get("sentra_signing_key_source"),
              "health_status": health_status,
              "health_all_200": all(code == 200 for code in health_status.values()),
              "bindings_agree": (vertical_build.get("source_binding") or {}).get("bindings_agree") if isinstance(vertical_build.get("source_binding"), dict) else None,
          }
          ''').lstrip()
          new_body = textwrap.dedent('''
          vertical_build = json_body(indexed[VERTICAL_ORIGIN + "/api/build-info"])
          vertical_ready = json_body(indexed[VERTICAL_ORIGIN + "/readyz"])
          health_status = {path: indexed[VERTICAL_ORIGIN + path].get("status") for path in VERTICAL_HEALTH}
          verticals = vertical_ready.get("verticals")
          verticals = verticals if isinstance(verticals, dict) else {}
          expected_verticals = {
              "sentra", "lyte", "killinchu", "finance", "terra", "counsel"
          }
          persistent_signer_ready = (
              set(verticals) == expected_verticals
              and all(
                  isinstance(row, dict)
                  and row.get("ready") is True
                  and row.get("status") == "READY"
                  and isinstance(row.get("requirements"), dict)
                  and row["requirements"].get("persistent_signing_key") is True
                  for row in verticals.values()
              )
          )
          vertical = {
              "build_http": indexed[VERTICAL_ORIGIN + "/api/build-info"].get("status"),
              "build_revision": revision(vertical_build),
              "ready_http": indexed[VERTICAL_ORIGIN + "/readyz"].get("status"),
              "ready": vertical_ready.get("ready"),
              "persistent_signer_ready": persistent_signer_ready,
              "expected_verticals": sorted(expected_verticals),
              "observed_verticals": sorted(verticals),
              "health_status": health_status,
              "health_all_200": all(code == 200 for code in health_status.values()),
              "bindings_agree": (vertical_build.get("source_binding") or {}).get("bindings_agree") if isinstance(vertical_build.get("source_binding"), dict) else None,
          }
          ''').lstrip()
          prefix = '              '
          old_block = textwrap.indent(old_body, prefix)
          new_block = textwrap.indent(new_body, prefix)
          if source.count(old_block) != 1:
              raise SystemExit(
                  f'expected one exact vertical proof block, found {source.count(old_block)}'
              )
          source = source.replace(old_block, new_block, 1)

          old_gate = '                  and vertical["signing_key_source"] == "env"\n'
          new_gate = '                  and vertical["persistent_signer_ready"] is True\n'
          if source.count(old_gate) != 1:
              raise SystemExit(
                  f'expected one obsolete signer gate, found {source.count(old_gate)}'
              )
          source = source.replace(old_gate, new_gate, 1)

          old_schema = '"schema": "szl.emergency-live-convergence-proof/v1"'
          new_schema = '"schema": "szl.emergency-live-convergence-proof/v2"'
          if source.count(old_schema) != 1:
              raise SystemExit(
                  f'expected one v1 proof schema, found {source.count(old_schema)}'
              )
          source = source.replace(old_schema, new_schema, 1)

          target.write_text(source, encoding='utf-8')
          temporary.unlink()
          PY

      - name: Validate Python, YAML, and readiness contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "huggingface_hub==1.10.1" "pytest==8.4.2" "PyYAML==6.0.3"
          python -m py_compile scripts/hf_publish_vertical_services.py
          python -m pytest -q \
            tests/test_hf_vertical_readiness_signer_contract_v2.py \
            tests/test_hf_space_secret_reader_compat.py \
            tests/test_hf_publish_vertical_flagships_v4.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = Path('.github/workflows/emergency-live-convergence-v1.yml')
          source = workflow.read_text(encoding='utf-8')
          yaml.safe_load(source)
          required = (
              'persistent_signer_ready',
              'expected_verticals',
              'observed_verticals',
              'persistent_signing_key',
              'szl.emergency-live-convergence-proof/v2',
          )
          for token in required:
              assert token in source, token
          assert 'signing_key_source' not in source
          assert 'sentra_signing_key_source' not in source
          PY

      - name: Commit the verified permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stephen Lutar"
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git diff --cached --check
          git commit -s -m "fix(hf): verify persistent signer through readiness v2"
          git push origin HEAD:fix/vertical-readiness-signer-contract-v2
