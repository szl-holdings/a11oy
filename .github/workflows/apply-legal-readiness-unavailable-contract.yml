name: Apply legal readiness unavailable contract repair

on:
  push:
    branches:
      - fix/legal-readiness-unavailable-citations
    paths:
      - .github/workflows/apply-legal-readiness-unavailable-contract.yml

permissions:
  contents: write

concurrency:
  group: apply-legal-readiness-unavailable-contract
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/legal-readiness-unavailable-citations
          fetch-depth: 0

      - name: Patch canonical unavailable labels, citations, and endpoint contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path_name}: expected one replacement seam, found {count}"
                  )
              path.write_text(
                  text.replace(old, new, 1), encoding="utf-8", newline="\n"
              )

          helper_old = (
              '    if status not in _READINESS_PUBLIC_FRESHNESS and entry.get("value") is None:\n'
              '        return entry\n'
              '    out = dict(entry)\n'
              '    fresh = dict(freshness)\n'
          )
          helper_new = (
              '    out = dict(entry)\n'
              '    fresh = dict(freshness)\n'
              '    if status not in _READINESS_PUBLIC_FRESHNESS and entry.get("value") is None:\n'
              '        fresh["status"] = "UNAVAILABLE"\n'
              '        out["freshness"] = fresh\n'
              '        return out\n'
          )
          replace_once("a11oy_vertical_feeds.py", helper_old, helper_new)
          replace_once("a11oy_devb_endpoints.py", helper_old, helper_new)

          replace_once(
              "a11oy_vertical_feeds.py",
              '    observed value passes through UNAVAILABLE so the schema fails closed.\n'
              '    Nothing is fabricated: no synthetic items, no invented timestamps.\n',
              '    observed value is emitted as canonical UNAVAILABLE so clients never\n'
              '    confuse missing evidence with live or cached data. Nothing is fabricated:\n'
              '    no synthetic items and no invented timestamps.\n',
          )
          replace_once(
              "a11oy_devb_endpoints.py",
              '# observation timestamp; a never-observed source stays UNAVAILABLE\n'
              '# so the schema fails closed. No fabricated items, no invented timestamps.\n',
              '# observation timestamp; a never-observed source is emitted as canonical\n'
              '# UNAVAILABLE. No fabricated items and no invented timestamps.\n',
          )

          replace_once(
              "a11oy_devb_endpoints.py",
              '_CL = "https://www.courtlistener.com/api/rest/v4/search/"\n',
              '_CL = "https://www.courtlistener.com/api/rest/v4/search/"\n'
              '_COURTLISTENER_CITATION = {\n'
              '    "provider": "Free Law Project - CourtListener",\n'
              '    "source_url": "https://www.courtlistener.com/help/api/rest/",\n'
              '}\n'
              '_FEDERAL_REGISTER_CITATION = {\n'
              '    "provider": "Office of the Federal Register - U.S. National Archives",\n'
              '    "source_url": "https://www.federalregister.gov/developers/documentation/api/v1",\n'
              '}\n'
              '_SEC_EDGAR_CITATION = {\n'
              '    "provider": "U.S. Securities and Exchange Commission - EDGAR",\n'
              '    "source_url": "https://www.sec.gov/edgar/sec-api-documentation",\n'
              '}\n',
          )

          replace_once(
              "a11oy_devb_endpoints.py",
              '        return JSONResponse({"surface": "matter", "term": term,\n'
              '                             "opinions": _readiness_public_source(op),\n'
              '                             "doctrine": DOCTRINE})\n',
              '        return JSONResponse({"surface": "matter", "term": term,\n'
              '                             "opinions": _readiness_public_source(op),\n'
              '                             "sources_cited": [dict(_COURTLISTENER_CITATION)],\n'
              '                             "doctrine": DOCTRINE})\n',
          )
          replace_once(
              "a11oy_devb_endpoints.py",
              '        return JSONResponse({"surface": "regulatory",\n'
              '                             "federal_register": _readiness_public_source(fr),\n'
              '                             "agencies": _readiness_public_source(ag),\n'
              '                             "doctrine": DOCTRINE})\n',
              '        return JSONResponse({"surface": "regulatory",\n'
              '                             "federal_register": _readiness_public_source(fr),\n'
              '                             "agencies": _readiness_public_source(ag),\n'
              '                             "sources_cited": [dict(_FEDERAL_REGISTER_CITATION)],\n'
              '                             "doctrine": DOCTRINE})\n',
          )
          replace_once(
              "a11oy_devb_endpoints.py",
              '    async def _legal_exposure(\n'
              '        term: Annotated[str, Query(min_length=1, max_length=160)] = "securities",\n'
              '        limit: Annotated[int, Query(ge=1, le=100)] = 18,\n'
              '    ):\n'
              '        return JSONResponse(await _run_blocking(exposure_graph, term, limit))\n',
              '    async def _legal_exposure(\n'
              '        term: Annotated[str, Query(min_length=1, max_length=160)] = "securities",\n'
              '        limit: Annotated[int, Query(ge=1, le=100)] = 18,\n'
              '    ):\n'
              '        result = dict(await _run_blocking(exposure_graph, term, limit))\n'
              '        result["sources_cited"] = [\n'
              '            dict(_SEC_EDGAR_CITATION),\n'
              '            dict(_COURTLISTENER_CITATION),\n'
              '        ]\n'
              '        return JSONResponse(result)\n',
          )

          replace_once(
              "tools/readiness-harness/gen_tabs_matrix.py",
              '    "/api/a11oy/v1/vert/legal/feed": ep(\n'
              '        schema="vert_legal_feed", sla=HOUR, citations=True,\n'
              '        allow_labels=("live", "cached", "reference"),\n',
              '    "/api/a11oy/v1/vert/legal/feed": ep(\n'
              '        schema="vert_legal_feed", sla=HOUR, citations=True,\n'
              '        allow_labels=("live", "cached", "reference", "UNAVAILABLE"),\n',
          )
          for route_and_note in (
              (
                  '    "/api/a11oy/v1/devb/legal/matter?limit=1": ep(\n'
                  '        schema="devb_legal_matter", sla=HOUR, citations=True,\n'
                  '        note="Bounded CourtListener matter probe; returned opinions carry authority URLs."),\n',
                  '    "/api/a11oy/v1/devb/legal/matter?limit=1": ep(\n'
                  '        schema="devb_legal_matter", sla=HOUR, citations=True,\n'
                  '        allow_labels=("live", "cached", "UNAVAILABLE"),\n'
                  '        note="Bounded CourtListener matter probe; returned opinions carry authority URLs."),\n',
              ),
              (
                  '    "/api/a11oy/v1/devb/legal/matter?term=defense&limit=1": ep(\n'
                  '        schema="devb_legal_matter", sla=HOUR, citations=True,\n'
                  '        note="Bounded CourtListener authority probe for the defense-builder alias."),\n',
                  '    "/api/a11oy/v1/devb/legal/matter?term=defense&limit=1": ep(\n'
                  '        schema="devb_legal_matter", sla=HOUR, citations=True,\n'
                  '        allow_labels=("live", "cached", "UNAVAILABLE"),\n'
                  '        note="Bounded CourtListener authority probe for the defense-builder alias."),\n',
              ),
              (
                  '    "/api/a11oy/v1/devb/legal/matter?term=insurance&limit=1": ep(\n'
                  '        schema="devb_legal_matter", sla=HOUR, citations=True,\n'
                  '        note="Bounded CourtListener authority probe for the insurance-review alias."),\n',
                  '    "/api/a11oy/v1/devb/legal/matter?term=insurance&limit=1": ep(\n'
                  '        schema="devb_legal_matter", sla=HOUR, citations=True,\n'
                  '        allow_labels=("live", "cached", "UNAVAILABLE"),\n'
                  '        note="Bounded CourtListener authority probe for the insurance-review alias."),\n',
              ),
              (
                  '    "/api/a11oy/v1/devb/legal/regulatory?limit=1": ep(\n'
                  '        schema="devb_legal_regulatory", sla=HOUR, citations=True,\n'
                  '        note="Federal Register documents and agency catalog with source URLs."),\n',
                  '    "/api/a11oy/v1/devb/legal/regulatory?limit=1": ep(\n'
                  '        schema="devb_legal_regulatory", sla=HOUR, citations=True,\n'
                  '        allow_labels=("live", "cached", "UNAVAILABLE"),\n'
                  '        note="Federal Register documents and agency catalog with source URLs."),\n',
              ),
              (
                  '    "/api/a11oy/v1/devb/legal/exposure?limit=1": ep(\n'
                  '        schema="devb_legal_exposure", sla=HOUR, citations=True,\n'
                  '        note="SEC/CourtListener exposure graph; case nodes retain CourtListener URLs."),\n',
                  '    "/api/a11oy/v1/devb/legal/exposure?limit=1": ep(\n'
                  '        schema="devb_legal_exposure", sla=HOUR, citations=True,\n'
                  '        allow_labels=("live", "cached", "UNAVAILABLE"),\n'
                  '        note="SEC/CourtListener exposure graph; case nodes retain CourtListener URLs."),\n',
              ),
          ):
              replace_once(
                  "tools/readiness-harness/gen_tabs_matrix.py",
                  route_and_note[0],
                  route_and_note[1],
              )
          PY
          python3 tools/readiness-harness/gen_tabs_matrix.py

      - name: Run focused no-invention and generated-contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_legal_readiness_unavailable_contract.py
          python3 tools/readiness-harness/gen_tabs_matrix.py --check
          python3 -m compileall -q \
            a11oy_vertical_feeds.py \
            a11oy_devb_endpoints.py \
            tools/readiness-harness/gen_tabs_matrix.py \
            tests/test_legal_readiness_unavailable_contract.py

      - name: Commit only the bounded source successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git add \
            a11oy_vertical_feeds.py \
            a11oy_devb_endpoints.py \
            tools/readiness-harness/gen_tabs_matrix.py \
            tools/readiness-harness/tabs.json
          git diff --cached --check
          git commit -m 'fix(readiness): preserve honest legal-source unavailability' -m 'Canonicalize never-observed evidence as UNAVAILABLE, retain null values and source errors, cite the named public legal providers, and admit that explicit degraded state without labeling it live or cached.' -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:fix/legal-readiness-unavailable-citations
