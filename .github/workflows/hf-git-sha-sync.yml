name: Sync git_sha to HF Space

# Manual recovery only. The canonical hf-sync.yml deployment is the sole
# automatic owner of SZL_GIT_SHA so the variable cannot advance ahead of the
# published runtime. This workflow remains available for an explicitly
# dispatched recovery after an operator has verified the deployed source.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-git-sha-sync
  cancel-in-progress: false

jobs:
  sync-git-sha:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set SZL_GIT_SHA Space variable to the deployed commit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: SZLHOLDINGS/a11oy
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret is not set — cannot update the Space variable."
            echo "::error::Founder action required: add repo secret HF_TOKEN (HF write token, org write to SZLHOLDINGS)."
            exit 1
          fi
          pip install --quiet "huggingface_hub>=0.25"
          python3 <<'PYEOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["SPACE_ID"]
          sha = os.environ["GIT_SHA"]
          cur = None
          try:
              v = api.get_space_variables(repo_id=space).get("SZL_GIT_SHA")
              cur = getattr(v, "value", v)
          except Exception as e:
              print("::warning::get_space_variables failed (non-fatal):", repr(e)[:160])
          if cur == sha:
              print("SZL_GIT_SHA already current on Space:", sha)
          else:
              api.add_space_variable(
                  repo_id=space, key="SZL_GIT_SHA", value=sha,
                  description="Deployed GitHub commit; surfaced at /api/a11oy/v1/honest for staleness detection. Automatic binding is owned by the canonical relock deployer.",
              )
              print("Set SZL_GIT_SHA on Space:", cur, "->", sha)
          PYEOF
