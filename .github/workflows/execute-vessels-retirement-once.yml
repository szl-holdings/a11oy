name: Execute authorized Vessels retirement once

on:
  push:
    branches: [main]
    paths:
      - .github/retirement-authorizations/vessels-20260904.json
      - .github/workflows/execute-vessels-retirement-once.yml
      - .github/scripts/retire_vessels_space.py
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: execute-authorized-vessels-retirement
  cancel-in-progress: false

jobs:
  retire:
    name: Delete Vessels only after Killinchu replacement proof
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable owner authorization marker
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          python - <<'PY'
          import json
          from pathlib import Path
          marker = json.loads(Path('.github/retirement-authorizations/vessels-20260904.json').read_text(encoding='utf-8'))
          assert marker == {
              'schema': 'szl.hf-space-retirement-authorization/v1',
              'authorized_by': 'stephenlutar2-hash',
              'authorized_at': '2026-09-04T02:00:00Z',
              'target': 'SZLHOLDINGS/vessels',
              'replacement': 'SZLHOLDINGS/killinchu',
              'confirmation': 'RETIRE-SZLHOLDINGS-VESSELS',
              'conditions': [
                  'source retained in GitHub',
                  'active publishers cannot recreate target',
                  'Killinchu maritime route returns HTTP 200',
                  'Killinchu Vessels health alias returns HTTP 200',
                  'Killinchu build identity is observable',
                  'secret-free retirement receipt is uploaded',
              ],
              'secret_values_recorded': False,
          }, marker
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install exact Hugging Face client
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface_hub==1.10.1"

      - name: Prove controller source contract
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/scripts/retire_vessels_space.py
          python -m py_compile .github/scripts/retire_vessels_space.py
          python -m unittest tests.test_retire_vessels_space -v
          git diff --check

      - name: Execute fixed-target retirement
        id: execute
        shell: bash
        env:
          HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          python .github/scripts/retire_vessels_space.py \
            --repo-root . \
            --report /tmp/vessels-space-retirement.json \
            --confirm RETIRE-SZLHOLDINGS-VESSELS
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable secret-free retirement receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: executed-vessels-retirement-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/vessels-space-retirement.json
          if-no-files-found: error
          retention-days: 180

      - name: Enforce verified terminal absence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.execute.outputs.exit_code }}' -eq 0
          python - <<'PY'
          import json
          report = json.load(open('/tmp/vessels-space-retirement.json', encoding='utf-8'))
          assert report.get('status') in {'RETIRED_VERIFIED', 'ALREADY_ABSENT'}, report
          assert report.get('target_after_exists') is False, report
          assert report.get('token_recorded') is False, report
          assert report.get('secret_values_read') is False, report
          PY
