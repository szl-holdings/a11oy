name: Observe Command Centre Cloudflare cache policy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-product-edge-v4
  cancel-in-progress: false

jobs:
  contract:
    name: Validate the read-only observer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the canonical protected branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "szl-holdings/a11oy"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out the exact admitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Exercise network-free privacy and request boundaries
        run: python -B -m unittest tests.test_cloudflare_command_centre_cache_audit -v

  observe:
    name: Read the fixed product-zone cache policy
    needs: contract
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out the exact admitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Collect sanitized policy metadata with GET only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -B scripts/audit_cloudflare_command_centre_cache.py --report "$RUNNER_TEMP/command-centre-cache-observation.json"

      - name: Retain the sanitized observation, including partial permissions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: command-centre-cache-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/command-centre-cache-observation.json
          if-no-files-found: error
          retention-days: 14
