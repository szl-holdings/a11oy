# Standard Python gate for the szl-holdings estate: ruff + pytest on the two
# supported interpreters. Installed by the szl-alignment engine (only into
# repos where Python is detected); keep in sync with
# alignment/templates/workflows/base-python-ci.yml.
name: base-python-ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Org policy: every action is pinned to a full-length commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest

      - name: Install the package
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then
            # Prefer the repo's own dev/test extra so test-time imports resolve
            # the same way they do in that repo's primary CI.
            if grep -qE '^\s*(dev|test|tests)\s*=\s*\[' pyproject.toml; then
              python -m pip install -e ".[dev]"
            else
              python -m pip install -e .
            fi
          fi
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
          if [ -f requirements-test.txt ]; then python -m pip install -r requirements-test.txt; fi

      # Blocking scope is the classes that indicate real breakage (syntax
      # errors, undefined names, unused imports). The full default ruleset runs
      # non-blocking so repos keep visibility without a forced flag day; repos
      # with their own ruff config in pyproject.toml already get stricter
      # behavior from their primary CI.
      - name: Ruff (blocking: E9/F)
        run: ruff check . --output-format github --select E9,F

      - name: Ruff (full ruleset, informational)
        run: ruff check . --statistics --exit-zero

      - name: Pytest (blocking)
        run: pytest -q
