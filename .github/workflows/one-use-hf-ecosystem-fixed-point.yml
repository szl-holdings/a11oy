name: One-use HF ecosystem fixed point

on:
  push:
    branches:
      - fix/hf-ecosystem-fixed-point-20260904
    paths:
      - .github/workflows/one-use-hf-ecosystem-fixed-point.yml
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: one-use-hf-ecosystem-fixed-point
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-ecosystem-fixed-point-20260904
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require canonical HF publication to reach a successful terminal state
        env:
          GH_TOKEN: ${{ github.token }}
          CANONICAL_RUN_ID: "33925658034"
        shell: bash
        run: |
          set -euo pipefail
          terminal='false'
          conclusion=''
          for attempt in $(seq 1 90); do
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANONICAL_RUN_ID}")"
            status="$(jq -r '.status' <<<"$payload")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$payload")"
            printf 'canonical HF publication attempt=%s status=%s conclusion=%s\n' "$attempt" "$status" "$conclusion"
            if [ "$status" = 'completed' ]; then
              terminal='true'
              break
            fi
            sleep 15
          done
          test "$terminal" = 'true'
          test "$conclusion" = 'success'

      - name: Regenerate and prove the current public ecosystem evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_audit_huggingface_ecosystem.py
          python -m py_compile \
            scripts/audit_huggingface_ecosystem.py \
            scripts/build_ecosystem_stage_matrix.py
          python scripts/audit_huggingface_ecosystem.py \
            --output docs/huggingface-ecosystem-manifest.json
          python scripts/audit_huggingface_ecosystem.py \
            --check \
            --output docs/huggingface-ecosystem-manifest.json
          python scripts/build_ecosystem_stage_matrix.py
          python scripts/build_ecosystem_stage_matrix.py --check
          python -m json.tool docs/huggingface-ecosystem-manifest.json >/dev/null
          python -m json.tool docs/ecosystem-stage-matrix.json >/dev/null
          git diff --check

      - name: Commit durable evidence and remove this controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Stephen Lutar'
          git config user.email 'stephenlutar2@gmail.com'
          git add \
            docs/huggingface-ecosystem-manifest.json \
            docs/ecosystem-stage-matrix.json
          git rm .github/workflows/one-use-hf-ecosystem-fixed-point.yml
          git diff --cached --quiet && {
            echo 'No ecosystem evidence change was produced.' >&2
            exit 1
          }
          git commit -s -m 'fix(hf): refresh exact post-publication ecosystem evidence'
          git push origin HEAD:fix/hf-ecosystem-fixed-point-20260904
