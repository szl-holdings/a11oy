name: Aegis Proof Cells protected promotion

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/aegis-proof-cells-promote.yml"
      - ".github/workflows/aegis-proof-cells.yml"
      - "console/3d/aegis-proof-cells.html"
      - "console/3d/aegis-proof-cells/**"
      - "docs/third-party/bricklayer-ai-intake-v1.md"
      - "scripts/verify_aegis_proof_cells_live.py"
      - "tests/test_aegis_proof_cells_static.py"
      - "tests/test_aegis_proof_cells_engine.mjs"
      - "tests/test_aegis_proof_cells_live.py"
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_thread:
    types: [created, edited, deleted]

permissions: read-all
concurrency:
  group: aegis-proof-cells-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-protected-auto-merge:
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.repository == 'szl-holdings/a11oy' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/aegis-proof-cells-operational-v1-20260903' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Require an independent approval and resolved review threads
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          author="${{ github.event.pull_request.user.login }}"
          number="${{ github.event.pull_request.number }}"
          payload="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewDecision reviewThreads(first:100){pageInfo{hasNextPage}nodes{isResolved isOutdated}}reviews(first:100){pageInfo{hasNextPage}nodes{state author{login}}}}}}' \
            -F owner="$owner" \
            -F repo="$repo" \
            -F number="$number")"
          graphql_errors="$(jq '[.errors[]?] | length' <<<"$payload")"
          decision="$(jq -r '.data.repository.pullRequest.reviewDecision // "NULL"' <<<"$payload")"
          threads_page="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage // true' <<<"$payload")"
          unresolved="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[]? | select(.isResolved == false and .isOutdated == false)] | length' <<<"$payload")"
          independent_approvals="$(jq --arg author "$author" '[.data.repository.pullRequest.reviews.nodes[]? | select(.state == "APPROVED" and .author.login != $author)] | length' <<<"$payload")"
          reviews_page="$(jq -r '.data.repository.pullRequest.reviews.pageInfo.hasNextPage // true' <<<"$payload")"
          (( graphql_errors == 0 )) || { echo "GraphQL returned $graphql_errors error(s)"; exit 1; }
          [[ "$decision" == "APPROVED" || "$decision" == "NULL" ]] || { echo "review decision is $decision"; exit 1; }
          [[ "$threads_page" == "false" ]] || { echo "review-thread inventory is incomplete"; exit 1; }
          [[ "$reviews_page" == "false" ]] || { echo "review inventory is incomplete"; exit 1; }
          (( unresolved == 0 )) || { echo "unresolved review threads: $unresolved"; exit 1; }
          (( independent_approvals > 0 )) || { echo "no approval from an author other than $author"; exit 1; }
      - name: Request squash merge after all protected requirements pass
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch
