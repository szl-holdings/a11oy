name: temporary-readiness-contract-diagnostic

on:
  push:
    branches:
      - fix/readiness-verdict-contracts-20260830
    paths:
      - .github/workflows/temporary-readiness-contract-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact core test closure
        run: python -m pip install --require-hashes -r .github/requirements/ci-core.txt

      - name: Capture exact local payload and generated contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          from fastapi.testclient import TestClient
          import serve

          path = Path("tools/readiness-harness/gen_tabs_matrix.py")
          spec = importlib.util.spec_from_file_location("readiness_matrix", path)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          matrix = module.build()
          response = TestClient(serve.app).get("/api/a11oy/v1/router/stats")
          payload = {
              "http_status": response.status_code,
              "router_payload": response.json(),
              "router_contract": matrix["endpoints"]["/api/a11oy/v1/router/stats"],
              "router_schema": matrix["schemas"]["router_stats"],
              "finance_contract": matrix["endpoints"]["/api/a11oy/v1/vert/finance/feed"],
          }
          Path("/tmp/readiness-contract-diagnostic.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload immutable diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: readiness-contract-diagnostic-${{ github.sha }}
          path: /tmp/readiness-contract-diagnostic.json
          if-no-files-found: error
          retention-days: 7
