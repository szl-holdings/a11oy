# SPDX-License-Identifier: Apache-2.0
# Public API keys for POST /api/a11oy/code/v1/chat/completions: keys are stored as
# salted digests, plaintext rows migrate out, the Space HF token is not a client
# key, and each key's rpm is enforced. See tests/test_code_api_keys.py.
name: Code API keys

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-keys:
    name: Salted key digests, plaintext migration and per-key rpm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r .github/requirements/ci-rag.txt
      - name: Prove digest storage, migration, refused HF token and the rpm limit
        env:
          A11OY_CODE_DB: ${{ runner.temp }}/a11oy-api-keys/code.db
          A11OY_CODE_SANDBOX: ${{ runner.temp }}/a11oy-api-keys/sandbox
          A11OY_REACT_DB: ${{ runner.temp }}/a11oy-api-keys/react.sqlite3
        run: python -B -m pytest -q -p no:cacheprovider tests/test_code_api_keys.py
