name: Holographic v2 Gate and Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: read-all
concurrency:
  group: holographic-v2-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate-and-merge:
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/holographic-experience-v2-20260902' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SELF_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run exact local contracts
        run: |
          python -m py_compile scripts/rollout_holographic_experience_v2.py tests/test_holographic_experience_v2.py
          node --check console/assets/szl-hologram-v2.js
          python tests/test_holographic_experience_v2.py
          git diff --check
      - name: Require an independent approval and resolved review threads
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          author="${{ github.event.pull_request.user.login }}"
          payload="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewDecision reviewThreads(first:100){pageInfo{hasNextPage}nodes{isResolved}}reviews(first:100){pageInfo{hasNextPage}nodes{state author{login}}}}}}' \
            -F owner="$owner" \
            -F repo="$repo" \
            -F number="$PR_NUMBER")"
          decision="$(jq -r '.data.repository.pullRequest.reviewDecision // "UNKNOWN"' <<<"$payload")"
          threads_page="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage // true' <<<"$payload")"
          unresolved="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[]? | select(.isResolved == false)] | length' <<<"$payload")"
          independent_approvals="$(jq --arg author "$author" '[.data.repository.pullRequest.reviews.nodes[]? | select(.state == "APPROVED" and .author.login != $author)] | length' <<<"$payload")"
          reviews_page="$(jq -r '.data.repository.pullRequest.reviews.pageInfo.hasNextPage // true' <<<"$payload")"
          [[ "$decision" == "APPROVED" ]] || { echo "review decision is $decision"; exit 1; }
          [[ "$threads_page" == "false" ]] || { echo "review-thread inventory is incomplete"; exit 1; }
          [[ "$reviews_page" == "false" ]] || { echo "review inventory is incomplete"; exit 1; }
          (( unresolved == 0 )) || { echo "unresolved review threads: $unresolved"; exit 1; }
          (( independent_approvals > 0 )) || { echo "no approval from an author other than $author"; exit 1; }
      - name: Wait for every peer check to finish green
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["HEAD_SHA"]
          self_run = f"/actions/runs/{os.environ['SELF_RUN_ID']}"
          allowed = {"success", "neutral", "skipped"}

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          for attempt in range(180):
              checks = api(f"repos/{repo}/commits/{sha}/check-runs?per_page=100").get("check_runs", [])
              peers = [row for row in checks if self_run not in str(row.get("details_url") or "")]
              bad = [row for row in peers if row.get("status") == "completed" and row.get("conclusion") not in allowed]
              if bad:
                  compact = [{"name": row.get("name"), "conclusion": row.get("conclusion"), "url": row.get("html_url")} for row in bad]
                  raise SystemExit("peer check failure: " + json.dumps(compact, sort_keys=True))
              pending = [row for row in peers if row.get("status") != "completed"]
              status = api(f"repos/{repo}/commits/{sha}/status")
              bad_status = [row for row in status.get("statuses", []) if row.get("state") in {"error", "failure"}]
              if bad_status:
                  raise SystemExit("legacy status failure: " + json.dumps(bad_status, sort_keys=True)[:4000])
              if peers and not pending and status.get("state") != "pending":
                  print(f"All {len(peers)} peer checks completed green.")
                  break
              time.sleep(10)
          else:
              raise SystemExit("timed out waiting for peer checks")
          PY
      - name: Squash merge without bypassing protections
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$HEAD_SHA" \
            --subject "feat(frontend): ship SZL Holographic Experience v2 (#$PR_NUMBER)" \
            --body "Original local-only holographic command-plane renderer, adaptive interaction engine, route-specific instruments, accessibility and low-power fallbacks, guarded source rollout, and offline contracts.\n\nSigned-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
