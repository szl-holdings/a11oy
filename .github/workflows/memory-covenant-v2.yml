name: Memory Covenant v2 contract

on:
  pull_request:
    branches: [main]
    paths:
      - migrations/20260811_memory_covenant_v2.sql
      - migrations/20260811_memory_covenant_v2_security_hardening.sql
      - migrations/20260820_memory_covenant_v2_postmerge_hardening.sql
      - scripts/validate_memory_covenant_v2.py
      - tests/test_memory_covenant_v2.py
      - tests/memory_covenant_acceptance.sql
      - artifacts/proof-packets/20260820-memory-covenant-neon.md
      - artifacts/proof-packets/20260820-memory-covenant-postmerge-hardening.md
      - audit/P0-2026-08-20-memory-covenant-proof.md
      - audit/P1-2026-08-20-memory-covenant-postmerge-hardening.md
      - .github/workflows/memory-covenant-v2.yml
  push:
    branches: [main]
    paths:
      - migrations/20260811_memory_covenant_v2.sql
      - migrations/20260811_memory_covenant_v2_security_hardening.sql
      - migrations/20260820_memory_covenant_v2_postmerge_hardening.sql
      - scripts/validate_memory_covenant_v2.py
      - tests/test_memory_covenant_v2.py
      - tests/memory_covenant_acceptance.sql
      - artifacts/proof-packets/20260820-memory-covenant-neon.md
      - artifacts/proof-packets/20260820-memory-covenant-postmerge-hardening.md
      - audit/P0-2026-08-20-memory-covenant-proof.md
      - audit/P1-2026-08-20-memory-covenant-postmerge-hardening.md
      - .github/workflows/memory-covenant-v2.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: memory-covenant-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Static migration and adversarial contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind qualification to the requested source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Compile the validator and self-tests
        run: >-
          python3 -m py_compile
          scripts/validate_memory_covenant_v2.py
          tests/test_memory_covenant_v2.py

      - name: Validate the committed migration contract
        run: python3 scripts/validate_memory_covenant_v2.py

      - name: Prove fail-closed adversarial behavior
        run: python3 tests/test_memory_covenant_v2.py -v

      - name: Reject whitespace defects
        run: git diff --check

  postgres-18-acceptance:
    name: PostgreSQL 18 idempotency, RLS, append-only, and worker acceptance
    needs: static-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_covenant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_covenant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind qualification to the requested source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Resolve the isolated PostgreSQL service container
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker ps --filter publish=5432 --format '{{.ID}}')
          test "${#containers[@]}" -eq 1
          echo "PG_CONTAINER=${containers[0]}" >> "$GITHUB_ENV"
          docker exec -e PGPASSWORD=postgres "${containers[0]}" \
            psql -X -U postgres -d memory_covenant -Atc 'select version()'

      - name: Exercise forward correction and two-pass idempotency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/memory-covenant-v2
          # Evidence is uploaded only when the job passes, so print it on failure.
          trap 'status=$?; if [ "$status" -ne 0 ]; then for f in evidence/memory-covenant-v2/*.log; do echo "--- $f ---"; cat "$f"; done; fi' EXIT
          : > evidence/memory-covenant-v2/migration-apply.log
          git rev-parse HEAD > evidence/memory-covenant-v2/source-sha.txt
          sha256sum \
            migrations/20260811_memory_covenant_v2.sql \
            migrations/20260811_memory_covenant_v2_security_hardening.sql \
            migrations/20260820_memory_covenant_v2_postmerge_hardening.sql \
            scripts/validate_memory_covenant_v2.py \
            tests/test_memory_covenant_v2.py \
            tests/memory_covenant_acceptance.sql \
            .github/workflows/memory-covenant-v2.yml \
            > evidence/memory-covenant-v2/source-sha256.txt

          apply_migration() {
            local migration="$1"
            echo "--- ${migration} ---" | tee -a evidence/memory-covenant-v2/migration-apply.log
            docker exec -i \
              -e PGPASSWORD=postgres \
              -e PGOPTIONS='-c search_path=memory_attacker,public' \
              "$PG_CONTAINER" \
              psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
              < "$migration" \
              | tee -a evidence/memory-covenant-v2/migration-apply.log
          }

          docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            -c 'CREATE SCHEMA memory_attacker'

          echo '=== clean-install migrations ===' | tee -a evidence/memory-covenant-v2/migration-apply.log
          apply_migration migrations/20260811_memory_covenant_v2.sql
          apply_migration migrations/20260811_memory_covenant_v2_security_hardening.sql

          echo '=== seed legacy/stale security state ===' | tee -a evidence/memory-covenant-v2/migration-apply.log
          # Seeded delegates can log in and are named by a random letter plus
          # random hex, with no fixed prefix, so neither a fixture name nor a
          # name pattern can exempt them from the sweep.
          random_role() {
            local letters=abcdefghijklmnopqrstuvwxyz
            printf '%s%s' "${letters:$((RANDOM % 26)):1}" \
              "$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          }
          hostile_delegate="$(random_role)"
          docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ${hostile_delegate} LOGIN" \
            -c "GRANT a11oy_memory_app, a11oy_memory_worker TO ${hostile_delegate} WITH ADMIN OPTION" \
            | tee -a evidence/memory-covenant-v2/migration-apply.log
          docker exec -i -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            <<'SQL' | tee -a evidence/memory-covenant-v2/migration-apply.log
          CREATE ROLE a11oy_memory_stale_grantee LOGIN;
          CREATE ROLE a11oy_memory_stale_parent NOLOGIN BYPASSRLS;
          CREATE ROLE a11oy_memory_stale_owner NOLOGIN;
          GRANT a11oy_memory_stale_parent
            TO a11oy_memory_app, a11oy_memory_worker;
          GRANT a11oy_memory_app, a11oy_memory_worker
            TO a11oy_memory_stale_grantee WITH ADMIN OPTION;
          ALTER TABLE public.memory_records
            OWNER TO a11oy_memory_stale_owner;
          ALTER TABLE public.memory_context_bindings
            OWNER TO a11oy_memory_stale_owner;
          ALTER TABLE public.memory_context_bindings ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.memory_context_bindings FORCE ROW LEVEL SECURITY;
          ALTER FUNCTION public.memory_touch_updated_at()
            OWNER TO a11oy_memory_stale_owner;
          ALTER FUNCTION public.memory_reject_mutation()
            OWNER TO a11oy_memory_stale_owner;
          ALTER FUNCTION public.a11oy_memory_context_matches(text, text)
            OWNER TO a11oy_memory_stale_owner;
          ALTER FUNCTION public.memory_lease_outbox(text, integer, integer)
            OWNER TO a11oy_memory_stale_owner;
          CREATE OR REPLACE FUNCTION public.memory_touch_updated_at()
          RETURNS trigger LANGUAGE plpgsql
          SET search_path = pg_catalog, pg_temp
          AS $stale$
          BEGIN
            RETURN NEW;
          END;
          $stale$;
          CREATE OR REPLACE FUNCTION public.memory_reject_mutation()
          RETURNS trigger LANGUAGE plpgsql
          SET search_path = pg_catalog, pg_temp
          AS $stale$
          BEGIN
            IF TG_OP = 'DELETE' THEN
              RETURN OLD;
            END IF;
            RETURN NEW;
          END;
          $stale$;
          DROP TRIGGER memory_records_touch_updated_at ON public.memory_records;
          DROP TRIGGER memory_outbox_touch_updated_at ON public.memory_outbox;
          DROP TRIGGER memory_receipts_append_only ON public.memory_receipts;
          DROP TRIGGER memory_query_audit_append_only ON public.memory_query_audit;
          DROP TRIGGER memory_idempotency_append_only ON public.memory_idempotency;
          CREATE TRIGGER memory_records_stale_trigger
            BEFORE UPDATE ON public.memory_records
            FOR EACH ROW EXECUTE FUNCTION public.memory_touch_updated_at();
          CREATE RULE memory_records_stale_update AS
            ON UPDATE TO public.memory_records DO INSTEAD NOTHING;
          ALTER TABLE public.memory_records DISABLE ROW LEVEL SECURITY;
          ALTER TABLE public.memory_evidence_refs DISABLE ROW LEVEL SECURITY;
          ALTER TABLE public.memory_outbox DISABLE ROW LEVEL SECURITY;
          ALTER TABLE public.memory_receipts DISABLE ROW LEVEL SECURITY;
          ALTER TABLE public.memory_query_audit DISABLE ROW LEVEL SECURITY;
          ALTER TABLE public.memory_index_generations DISABLE ROW LEVEL SECURITY;
          ALTER TABLE public.memory_idempotency DISABLE ROW LEVEL SECURITY;
          CREATE OR REPLACE FUNCTION public.a11oy_memory_context_matches(
              row_tenant text,
              row_domain text
          )
          RETURNS boolean LANGUAGE sql STABLE SECURITY INVOKER
          SET search_path = pg_catalog, pg_temp
          AS $$
            -- public.memory_context_bindings
            SELECT row_tenant = current_setting('a11oy.tenant_id', true)
               AND row_domain = current_setting('a11oy.security_domain', true)
          $$;
          INSERT INTO public.memory_context_bindings (
              principal_oid,
              tenant_id,
              security_domain
          ) VALUES (
              'a11oy_memory_stale_grantee'::regrole,
              'untrusted-tenant',
              'untrusted-domain'
          );
          CREATE POLICY memory_context_bindings_stale_guc_filter
            ON public.memory_context_bindings
            USING (
              tenant_id = current_setting('a11oy.tenant_id', true)
              AND security_domain = current_setting(
                'a11oy.security_domain', true
              )
            )
            WITH CHECK (
              tenant_id = current_setting('a11oy.tenant_id', true)
              AND security_domain = current_setting(
                'a11oy.security_domain', true
              )
            );
          ALTER ROLE a11oy_memory_worker
            SUPERUSER CREATEDB CREATEROLE LOGIN REPLICATION BYPASSRLS;
          GRANT CREATE ON SCHEMA public
            TO a11oy_memory_app, a11oy_memory_worker,
               a11oy_memory_stale_grantee, a11oy_memory_stale_parent,
               a11oy_memory_stale_owner;
          GRANT DELETE, TRUNCATE, REFERENCES, TRIGGER
            ON TABLE public.memory_records TO a11oy_memory_app;
          GRANT SELECT ON TABLE public.memory_outbox TO a11oy_memory_worker;
          GRANT SELECT ON TABLE public.memory_records,
            public.memory_context_bindings TO a11oy_memory_stale_grantee;
          GRANT UPDATE (classification) ON TABLE public.memory_records
            TO a11oy_memory_stale_grantee;
          GRANT SELECT ON TABLE public.memory_records TO PUBLIC;
          GRANT EXECUTE ON FUNCTION public.memory_lease_outbox(text, integer, integer)
            TO PUBLIC, a11oy_memory_app;
          GRANT EXECUTE ON FUNCTION public.memory_lease_outbox(text, integer, integer)
            TO a11oy_memory_stale_grantee WITH GRANT OPTION;
          GRANT EXECUTE ON FUNCTION public.memory_touch_updated_at(),
            public.memory_reject_mutation(),
            public.a11oy_memory_context_matches(text, text)
            TO PUBLIC, a11oy_memory_stale_grantee;
          CREATE POLICY memory_records_stale_allow_all ON public.memory_records
            USING (true) WITH CHECK (true);
          ALTER TABLE public.memory_query_audit
            DROP CONSTRAINT memory_query_audit_tenant_domain_receipt_fkey;
          ALTER TABLE public.memory_idempotency
            DROP CONSTRAINT memory_idempotency_tenant_domain_receipt_fkey;
          ALTER TABLE public.memory_receipts
            DROP CONSTRAINT memory_receipts_tenant_domain_receipt_key;
          ALTER TABLE public.memory_query_audit
            ADD CONSTRAINT memory_query_audit_receipt_id_fkey
            FOREIGN KEY (receipt_id) REFERENCES public.memory_receipts(receipt_id)
            ON DELETE RESTRICT;
          ALTER TABLE public.memory_idempotency
            ADD CONSTRAINT memory_idempotency_receipt_id_fkey
            FOREIGN KEY (receipt_id) REFERENCES public.memory_receipts(receipt_id)
            ON DELETE RESTRICT;
          INSERT INTO public.memory_receipts (
              receipt_id,
              tenant_id,
              security_domain,
              namespace,
              seq,
              prev_digest,
              digest,
              mode,
              operation,
              decision,
              request_digest,
              receipt_json
          ) VALUES (
              'legacy-cross-domain-receipt',
              'legacy-tenant',
              'legacy-domain-a',
              'legacy-tenant:legacy-domain-a',
              9223372036854770001,
              repeat('0', 64),
              repeat('4', 64),
              'UNSIGNED-CONTENT-DIGEST',
              'legacy-preflight',
              'DENY',
              repeat('5', 64),
              jsonb_build_object(
                  'receipt_id', 'legacy-cross-domain-receipt',
                  'integrity', jsonb_build_object('digest', repeat('4', 64))
              )
          );
          INSERT INTO public.memory_query_audit (
              audit_id,
              tenant_id,
              security_domain,
              receipt_id,
              query_digest,
              result_digest,
              audit_json
          ) VALUES (
              'legacy-cross-domain-audit',
              'legacy-tenant',
              'legacy-domain-b',
              'legacy-cross-domain-receipt',
              repeat('6', 64),
              repeat('7', 64),
              jsonb_build_object(
                  'audit_id', 'legacy-cross-domain-audit',
                  'query_digest', repeat('6', 64),
                  'result_digest', repeat('7', 64)
              )
          );
          SQL

          spoofed_binding_marker="$(docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -At -v ON_ERROR_STOP=1 \
            -c "SELECT strpos(pg_get_functiondef('public.a11oy_memory_context_matches(text,text)'::regprocedure), 'public.memory_context_bindings') > 0")"
          test "$spoofed_binding_marker" = "t"

          hidden_binding_count="$(docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -XqAt -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            -c "SET ROLE a11oy_memory_stale_owner; SELECT count(*) FROM public.memory_context_bindings")"
          test "$hidden_binding_count" = "0"

          echo '=== prove untrusted binding preflight fails closed ===' | tee -a evidence/memory-covenant-v2/migration-apply.log
          set +e
          {
            printf '%s\n' 'SET ROLE a11oy_memory_stale_owner;'
            cat migrations/20260820_memory_covenant_v2_postmerge_hardening.sql
          } | docker exec -i \
              -e PGPASSWORD=postgres \
              -e PGOPTIONS='-c search_path=memory_attacker,public' \
              "$PG_CONTAINER" \
              psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            > evidence/memory-covenant-v2/untrusted-binding-preflight.log 2>&1
          binding_status=$?
          set -e
          test "$binding_status" -ne 0
          # The stale owner cannot bypass row security, so the migration refuses
          # it before any check could run against rows its policy hides.
          grep -F 'the migration principal must bypass row security to check existing rows' \
            evidence/memory-covenant-v2/untrusted-binding-preflight.log
          # A principal that sees every row reaches the provenance preflight,
          # which refuses the planted rows.
          set +e
          docker exec -i \
            -e PGPASSWORD=postgres \
            -e PGOPTIONS='-c search_path=memory_attacker,public' \
            "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            < migrations/20260820_memory_covenant_v2_postmerge_hardening.sql \
            > evidence/memory-covenant-v2/untrusted-binding-provenance.log 2>&1
          binding_status=$?
          set -e
          test "$binding_status" -ne 0
          grep -F 'pre-existing memory_context_bindings rows lack durable write provenance' \
            evidence/memory-covenant-v2/untrusted-binding-provenance.log
          binding_rls_state="$(docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -XqAt -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            -c "SELECT relrowsecurity::text || ':' || relforcerowsecurity::text FROM pg_catalog.pg_class WHERE oid = 'public.memory_context_bindings'::pg_catalog.regclass")"
          test "$binding_rls_state" = "true:true"
          binding_policy_count="$(docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -XqAt -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM pg_catalog.pg_policy WHERE polrelid = 'public.memory_context_bindings'::pg_catalog.regclass AND polname = 'memory_context_bindings_stale_guc_filter'")"
          test "$binding_policy_count" = "1"
          binding_owner="$(docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -XqAt -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            -c "SELECT pg_catalog.pg_get_userbyid(relowner) FROM pg_catalog.pg_class WHERE oid = 'public.memory_context_bindings'::pg_catalog.regclass")"
          test "$binding_owner" = "a11oy_memory_stale_owner"

          docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            -c "DELETE FROM public.memory_context_bindings WHERE tenant_id = 'untrusted-tenant'"

          echo '=== prove cross-domain preflight fails closed ===' | tee -a evidence/memory-covenant-v2/migration-apply.log
          set +e
          docker exec -i \
            -e PGPASSWORD=postgres \
            -e PGOPTIONS='-c search_path=memory_attacker,public' \
            "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            < migrations/20260820_memory_covenant_v2_postmerge_hardening.sql \
            > evidence/memory-covenant-v2/cross-domain-preflight.log 2>&1
          preflight_status=$?
          set -e
          test "$preflight_status" -ne 0
          grep -F 'memory_query_audit contains a cross-domain receipt reference' \
            evidence/memory-covenant-v2/cross-domain-preflight.log

          docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            -c 'TRUNCATE TABLE public.memory_query_audit, public.memory_idempotency, public.memory_receipts CASCADE'

          echo '=== forward corrective migration ===' | tee -a evidence/memory-covenant-v2/migration-apply.log
          apply_migration migrations/20260820_memory_covenant_v2_postmerge_hardening.sql

          echo '=== corrective-only acceptance ===' | tee -a evidence/memory-covenant-v2/migration-apply.log
          docker exec -i -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            < tests/memory_covenant_acceptance.sql \
            | tee evidence/memory-covenant-v2/corrective-only-acceptance.log
          grep -F '"status": "PASS"' \
            evidence/memory-covenant-v2/corrective-only-acceptance.log
          grep -F '"memory_rows": 0' \
            evidence/memory-covenant-v2/corrective-only-acceptance.log
          grep -F '"receipt_rows": 0' \
            evidence/memory-covenant-v2/corrective-only-acceptance.log
          grep -F '"outbox_rows": 0' \
            evidence/memory-covenant-v2/corrective-only-acceptance.log
          grep -F '"context_binding_rows": 0' \
            evidence/memory-covenant-v2/corrective-only-acceptance.log
          inbound_membership_count="$(docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -At -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM pg_catalog.pg_auth_members WHERE roleid IN ('a11oy_memory_app'::regrole, 'a11oy_memory_worker'::regrole) AND member = 'a11oy_memory_stale_grantee'::regrole AND NOT admin_option AND NOT inherit_option AND NOT set_option")"
          test "$inbound_membership_count" = "2"
          hostile_delegate_swept_count="$(docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -At -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM pg_catalog.pg_auth_members WHERE roleid IN ('a11oy_memory_app'::regrole, 'a11oy_memory_worker'::regrole) AND member = '${hostile_delegate}'::regrole AND NOT admin_option AND NOT inherit_option AND NOT set_option")"
          test "$hostile_delegate_swept_count" = "2"

          echo '=== prove the lease guard requires an inherited worker role ===' | tee -a evidence/memory-covenant-v2/migration-apply.log
          # pg_has_role(..., 'MEMBER') is true for any membership row in
          # PostgreSQL 16 and later, so the guard tests USAGE. The swept
          # delegate gets EXECUTE through a path other than the worker role and
          # a SET-only member can SET ROLE to it: the guard itself must refuse
          # both, while a login that inherits the worker role still leases.
          setonly_member="$(random_role)"
          worker_login="$(random_role)"
          docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            -c "GRANT EXECUTE ON FUNCTION public.memory_lease_outbox(text, integer, integer) TO ${hostile_delegate}" \
            -c "CREATE ROLE ${setonly_member} LOGIN" \
            -c "GRANT a11oy_memory_worker TO ${setonly_member} WITH INHERIT FALSE, SET TRUE" \
            -c "CREATE ROLE ${worker_login} LOGIN" \
            -c "GRANT a11oy_memory_worker TO ${worker_login}" \
            -c "INSERT INTO public.memory_outbox (event_id, tenant_id, security_domain, memory_id, generation_id, event_type, payload_json) VALUES ('lease-guard-event', 'lease-guard-tenant', 'lease-guard-domain', 'lease-guard-memory', 'lease-guard-generation', 'INDEX_UPSERT', '{}'::jsonb)" \
            | tee -a evidence/memory-covenant-v2/migration-apply.log
          if docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
              psql -X -U "$hostile_delegate" -d memory_covenant -v ON_ERROR_STOP=1 \
              -c 'SET ROLE a11oy_memory_worker' \
              > evidence/memory-covenant-v2/swept-delegate-set-role.log 2>&1; then
            echo 'a swept delegate could SET ROLE a11oy_memory_worker'
            exit 1
          fi
          grep -F 'permission denied to set role "a11oy_memory_worker"' \
            evidence/memory-covenant-v2/swept-delegate-set-role.log
          if docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
              psql -X -U "$hostile_delegate" -d memory_covenant -v ON_ERROR_STOP=1 \
              -c "SELECT count(*) FROM public.memory_lease_outbox('swept-delegate', 1, 30)" \
              > evidence/memory-covenant-v2/swept-delegate-lease.log 2>&1; then
            echo 'a swept delegate with EXECUTE passed the lease guard'
            exit 1
          fi
          grep -F 'session user does not inherit a11oy_memory_worker' \
            evidence/memory-covenant-v2/swept-delegate-lease.log
          if docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
              psql -X -U "$setonly_member" -d memory_covenant -v ON_ERROR_STOP=1 \
              -c 'SET ROLE a11oy_memory_worker' \
              -c "SELECT count(*) FROM public.memory_lease_outbox('set-only-member', 1, 30)" \
              > evidence/memory-covenant-v2/set-only-lease.log 2>&1; then
            echo 'a SET-only member passed the lease guard'
            exit 1
          fi
          grep -F 'session user does not inherit a11oy_memory_worker' \
            evidence/memory-covenant-v2/set-only-lease.log
          inherited_lease="$(docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -XqAt -U "$worker_login" -d memory_covenant -v ON_ERROR_STOP=1 \
            -c "SELECT event_id || ':' || lease_owner FROM public.memory_lease_outbox('inherited-worker', 1, 30)")"
          test "$inherited_lease" = "lease-guard-event:inherited-worker"
          # The SET-only row is the signature older sweeps left behind; the
          # migrations and the acceptance refuse it until it is removed.
          set +e
          docker exec -i \
            -e PGPASSWORD=postgres \
            -e PGOPTIONS='-c search_path=memory_attacker,public' \
            "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            < migrations/20260820_memory_covenant_v2_postmerge_hardening.sql \
            > evidence/memory-covenant-v2/set-only-refusal.log 2>&1
          setonly_status=$?
          docker exec -i -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            < tests/memory_covenant_acceptance.sql \
            > evidence/memory-covenant-v2/set-only-acceptance-refusal.log 2>&1
          setonly_acceptance_status=$?
          set -e
          test "$setonly_status" -ne 0
          grep -F 'a capability-role membership grants SET without INHERIT; runtime logins must inherit' \
            evidence/memory-covenant-v2/set-only-refusal.log
          test "$setonly_acceptance_status" -ne 0
          grep -F 'Memory Covenant capability membership grants SET without INHERIT' \
            evidence/memory-covenant-v2/set-only-acceptance-refusal.log
          docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            -c "DELETE FROM public.memory_outbox WHERE event_id = 'lease-guard-event'" \
            -c "REVOKE EXECUTE ON FUNCTION public.memory_lease_outbox(text, integer, integer) FROM ${hostile_delegate}" \
            -c "DROP ROLE ${setonly_member}" \
            -c "DROP ROLE ${worker_login}" \
            | tee -a evidence/memory-covenant-v2/migration-apply.log

          echo '=== prove revoked binding grant lacks durable provenance ===' | tee -a evidence/memory-covenant-v2/migration-apply.log
          docker exec -i -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            <<'SQL'
          GRANT a11oy_memory_app TO a11oy_memory_stale_grantee;
          GRANT INSERT (principal_oid, tenant_id, security_domain)
            ON TABLE public.memory_context_bindings
            TO a11oy_memory_stale_grantee;
          CREATE POLICY memory_context_bindings_temporary_insert
            ON public.memory_context_bindings
            FOR INSERT TO a11oy_memory_stale_grantee
            WITH CHECK (true);
          SET ROLE a11oy_memory_stale_grantee;
          INSERT INTO public.memory_context_bindings (
              principal_oid,
              tenant_id,
              security_domain
          ) VALUES (
              'a11oy_memory_stale_grantee'::regrole,
              'revoked-grant-tenant',
              'revoked-grant-domain'
          );
          RESET ROLE;
          DROP POLICY memory_context_bindings_temporary_insert
            ON public.memory_context_bindings;
          REVOKE ALL PRIVILEGES (principal_oid, tenant_id, security_domain)
            ON TABLE public.memory_context_bindings
            FROM a11oy_memory_stale_grantee;
          SQL
          revoked_binding_acl_count="$(docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -At -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM pg_catalog.pg_attribute AS attribute CROSS JOIN LATERAL pg_catalog.aclexplode(attribute.attacl) AS acl WHERE attribute.attrelid = 'public.memory_context_bindings'::pg_catalog.regclass AND attribute.attnum > 0 AND NOT attribute.attisdropped AND attribute.attacl IS NOT NULL AND acl.grantee = 'a11oy_memory_stale_grantee'::pg_catalog.regrole")"
          test "$revoked_binding_acl_count" = "0"
          revoked_binding_policy_count="$(docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -At -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM pg_catalog.pg_policy WHERE polrelid = 'public.memory_context_bindings'::pg_catalog.regclass")"
          test "$revoked_binding_policy_count" = "0"
          set +e
          docker exec -i \
            -e PGPASSWORD=postgres \
            -e PGOPTIONS='-c search_path=memory_attacker,public' \
            "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            < migrations/20260820_memory_covenant_v2_postmerge_hardening.sql \
            > evidence/memory-covenant-v2/revoked-binding-provenance-preflight.log 2>&1
          revoked_binding_status=$?
          set -e
          test "$revoked_binding_status" -ne 0
          grep -F 'pre-existing memory_context_bindings rows lack durable write provenance' \
            evidence/memory-covenant-v2/revoked-binding-provenance-preflight.log
          planted_binding_count="$(docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -At -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM public.memory_context_bindings WHERE tenant_id = 'revoked-grant-tenant' AND security_domain = 'revoked-grant-domain'")"
          test "$planted_binding_count" = "1"
          docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            -c "DELETE FROM public.memory_context_bindings WHERE tenant_id = 'revoked-grant-tenant'"

          echo '=== full second pass ===' | tee -a evidence/memory-covenant-v2/migration-apply.log
          for migration in \
            migrations/20260811_memory_covenant_v2.sql \
            migrations/20260811_memory_covenant_v2_security_hardening.sql \
            migrations/20260820_memory_covenant_v2_postmerge_hardening.sql
          do
            apply_migration "$migration"
          done

          echo '=== prove capability-role database ownership fails closed ===' | tee -a evidence/memory-covenant-v2/migration-apply.log
          # Owning the database makes a capability role a member of
          # pg_database_owner, which owns schema public; pg_auth_members does
          # not show that path.
          docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            -c 'ALTER DATABASE memory_covenant OWNER TO a11oy_memory_app' \
            | tee -a evidence/memory-covenant-v2/migration-apply.log
          for migration in \
            migrations/20260811_memory_covenant_v2_security_hardening.sql \
            migrations/20260820_memory_covenant_v2_postmerge_hardening.sql
          do
            ownership_log="evidence/memory-covenant-v2/database-owner-$(basename "$migration" .sql).log"
            set +e
            docker exec -i \
              -e PGPASSWORD=postgres \
              -e PGOPTIONS='-c search_path=memory_attacker,public' \
              "$PG_CONTAINER" \
              psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
              < "$migration" > "$ownership_log" 2>&1
            ownership_status=$?
            set -e
            test "$ownership_status" -ne 0
            grep -F 'a capability role owns the database or a schema' "$ownership_log"
          done
          set +e
          docker exec -i -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            < tests/memory_covenant_acceptance.sql \
            > evidence/memory-covenant-v2/database-owner-acceptance.log 2>&1
          ownership_status=$?
          set -e
          test "$ownership_status" -ne 0
          grep -F 'Memory Covenant capability role owns the database or a schema' \
            evidence/memory-covenant-v2/database-owner-acceptance.log
          docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            -c 'ALTER DATABASE memory_covenant OWNER TO postgres' \
            | tee -a evidence/memory-covenant-v2/migration-apply.log

      - name: Capture exact catalog evidence
        shell: bash
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -At -v ON_ERROR_STOP=1 \
            -c "WITH tables AS (
                  SELECT c.relname, pg_get_userbyid(c.relowner) AS owner,
                         c.relrowsecurity, c.relforcerowsecurity,
                         count(DISTINCT p.polname) AS policy_count,
                         count(DISTINCT t.tgname) FILTER (WHERE NOT t.tgisinternal) AS trigger_count
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                    LEFT JOIN pg_policy p ON p.polrelid = c.oid
                    LEFT JOIN pg_trigger t ON t.tgrelid = c.oid
                   WHERE n.nspname = 'public' AND c.relname LIKE 'memory_%' AND c.relkind = 'r'
                   GROUP BY c.relname, c.relowner,
                            c.relrowsecurity, c.relforcerowsecurity
                ), roles AS (
                  SELECT rolname, rolsuper, rolcreatedb, rolcreaterole,
                         rolreplication, rolinherit, rolbypassrls, rolcanlogin
                    FROM pg_roles
                   WHERE rolname IN ('a11oy_memory_app','a11oy_memory_worker')
                ), memberships AS (
                  SELECT parent.rolname AS parent_role,
                         child.rolname AS capability_role
                    FROM pg_auth_members edge
                    JOIN pg_roles parent ON parent.oid = edge.roleid
                    JOIN pg_roles child ON child.oid = edge.member
                   WHERE child.rolname IN ('a11oy_memory_app','a11oy_memory_worker')
                ), relation_acl AS (
                  SELECT c.relname,
                         CASE acl.grantee WHEN 0 THEN 'PUBLIC'
                              ELSE pg_get_userbyid(acl.grantee) END AS grantee,
                         acl.privilege_type,
                         acl.is_grantable
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid = c.relnamespace,
                         LATERAL aclexplode(COALESCE(c.relacl, acldefault('r', c.relowner))) acl
                   WHERE n.nspname = 'public'
                     AND c.relname LIKE 'memory_%'
                     AND acl.grantee <> c.relowner
                ), column_acl AS (
                  SELECT c.relname, a.attname,
                         CASE acl.grantee WHEN 0 THEN 'PUBLIC'
                              ELSE pg_get_userbyid(acl.grantee) END AS grantee,
                         acl.privilege_type,
                         acl.is_grantable
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                    JOIN pg_attribute a ON a.attrelid = c.oid,
                         LATERAL aclexplode(a.attacl) acl
                   WHERE n.nspname = 'public'
                     AND c.relname LIKE 'memory_%'
                     AND a.attacl IS NOT NULL
                     AND acl.grantee <> c.relowner
                ), function_acl AS (
                  SELECT p.oid::regprocedure::text AS function_identity,
                         pg_get_userbyid(p.proowner) AS owner,
                         CASE acl.grantee WHEN 0 THEN 'PUBLIC'
                              ELSE pg_get_userbyid(acl.grantee) END AS grantee,
                         acl.privilege_type,
                         acl.is_grantable
                    FROM pg_proc p,
                         LATERAL aclexplode(COALESCE(p.proacl, acldefault('f', p.proowner))) acl
                   WHERE p.oid IN (
                       'memory_touch_updated_at()'::regprocedure,
                       'memory_reject_mutation()'::regprocedure,
                       'a11oy_memory_context_matches(text,text)'::regprocedure,
                       'memory_lease_outbox(text,integer,integer)'::regprocedure
                   )
                     AND acl.grantee <> p.proowner
                ), schema_create_acl AS (
                  SELECT CASE acl.grantee WHEN 0 THEN 'PUBLIC'
                              ELSE pg_get_userbyid(acl.grantee) END AS grantee,
                         acl.is_grantable
                    FROM pg_namespace n,
                         LATERAL aclexplode(COALESCE(n.nspacl, acldefault('n', n.nspowner))) acl
                   WHERE n.nspname = 'public'
                     AND acl.privilege_type = 'CREATE'
                     AND acl.grantee <> n.nspowner
                )
                SELECT jsonb_pretty(jsonb_build_object(
                  'server_version', current_setting('server_version'),
                  'database', current_database(),
                  'tables', COALESCE((SELECT jsonb_agg(to_jsonb(tables) ORDER BY relname) FROM tables), '[]'::jsonb),
                  'roles', COALESCE((SELECT jsonb_agg(to_jsonb(roles) ORDER BY rolname) FROM roles), '[]'::jsonb),
                  'outbound_memberships', COALESCE((SELECT jsonb_agg(to_jsonb(memberships)) FROM memberships), '[]'::jsonb),
                  'relation_acl', COALESCE((SELECT jsonb_agg(to_jsonb(relation_acl) ORDER BY relname, grantee, privilege_type) FROM relation_acl), '[]'::jsonb),
                  'column_acl', COALESCE((SELECT jsonb_agg(to_jsonb(column_acl) ORDER BY relname, attname, grantee, privilege_type) FROM column_acl), '[]'::jsonb),
                  'function_acl', COALESCE((SELECT jsonb_agg(to_jsonb(function_acl) ORDER BY function_identity, grantee) FROM function_acl), '[]'::jsonb),
                  'schema_create_acl', COALESCE((SELECT jsonb_agg(to_jsonb(schema_create_acl) ORDER BY grantee) FROM schema_create_acl), '[]'::jsonb),
                  'context_binding_count', (SELECT count(*) FROM memory_context_bindings),
                  'context_security_definer', (SELECT prosecdef FROM pg_proc WHERE oid='a11oy_memory_context_matches(text,text)'::regprocedure),
                  'lease_security_definer', (SELECT prosecdef FROM pg_proc WHERE oid='memory_lease_outbox(text,integer,integer)'::regprocedure)
                ));" \
            > evidence/memory-covenant-v2/catalog.json
          python3 -m json.tool evidence/memory-covenant-v2/catalog.json >/dev/null

      - name: Execute rollback-only acceptance transaction
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            < tests/memory_covenant_acceptance.sql \
            | tee evidence/memory-covenant-v2/acceptance.log
          grep -F '"status": "PASS"' evidence/memory-covenant-v2/acceptance.log
          grep -F '"memory_rows": 0' evidence/memory-covenant-v2/acceptance.log
          grep -F '"receipt_rows": 0' evidence/memory-covenant-v2/acceptance.log
          grep -F '"outbox_rows": 0' evidence/memory-covenant-v2/acceptance.log
          grep -F '"context_binding_rows": 0' evidence/memory-covenant-v2/acceptance.log

      - name: Upload immutable acceptance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-covenant-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/memory-covenant-v2
          if-no-files-found: error
          retention-days: 90

  provider-owner-acceptance:
    name: PostgreSQL 18 provider-owner (non-superuser) application
    needs: static-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_covenant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_covenant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind qualification to the requested source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Resolve the isolated PostgreSQL service container
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker ps --filter publish=5432 --format '{{.ID}}')
          test "${#containers[@]}" -eq 1
          echo "PG_CONTAINER=${containers[0]}" >> "$GITHUB_ENV"

      - name: Apply every migration twice as a non-superuser provider-style owner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/memory-covenant-v2-provider-owner
          log=evidence/memory-covenant-v2-provider-owner/provider-owner-apply.log
          echo '=== provider-owner (non-superuser) application ===' | tee "$log"
          # A provider-style owner: LOGIN NOSUPERUSER CREATEDB CREATEROLE
          # BYPASSRLS. For Neon and similar providers these attributes are
          # MODELED, not read back from any provider.
          docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE a11oy_memory_provider_owner LOGIN NOSUPERUSER CREATEDB CREATEROLE BYPASSRLS' \
            -c 'CREATE ROLE a11oy_memory_provider_runtime LOGIN NOSUPERUSER NOBYPASSRLS' \
            -c 'CREATE DATABASE memory_covenant_provider OWNER a11oy_memory_provider_owner' \
            | tee -a "$log"
          docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant_provider -v ON_ERROR_STOP=1 \
            -c 'CREATE SCHEMA memory_attacker' | tee -a "$log"
          for pass in 1 2; do
            for migration in \
              migrations/20260811_memory_covenant_v2.sql \
              migrations/20260811_memory_covenant_v2_security_hardening.sql \
              migrations/20260820_memory_covenant_v2_postmerge_hardening.sql
            do
              echo "--- pass ${pass}: ${migration} ---" | tee -a "$log"
              docker exec -i \
                -e PGPASSWORD=postgres \
                -e PGOPTIONS='-c search_path=memory_attacker,public' \
                "$PG_CONTAINER" \
                psql -X -U a11oy_memory_provider_owner -d memory_covenant_provider -v ON_ERROR_STOP=1 \
                < "$migration" | tee -a "$log"
            done
          done
          provider_owner="$(docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -XqAt -U postgres -d memory_covenant_provider -v ON_ERROR_STOP=1 \
            -c "SELECT pg_catalog.pg_get_userbyid(relowner) FROM pg_catalog.pg_class WHERE oid = 'public.memory_records'::pg_catalog.regclass")"
          test "$provider_owner" = "a11oy_memory_provider_owner"
          provider_owner_admin_count="$(docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -XqAt -U postgres -d memory_covenant_provider -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM pg_catalog.pg_auth_members WHERE roleid IN ('a11oy_memory_app'::regrole, 'a11oy_memory_worker'::regrole) AND member = 'a11oy_memory_provider_owner'::regrole AND admin_option")"
          test "$provider_owner_admin_count" = "2"
          echo '=== provider owner provisions a runtime login and a binding ===' | tee -a "$log"
          docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U a11oy_memory_provider_owner -d memory_covenant_provider -v ON_ERROR_STOP=1 \
            -c 'GRANT a11oy_memory_app TO a11oy_memory_provider_runtime' | tee -a "$log"
          docker exec -i -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U a11oy_memory_provider_owner -d memory_covenant_provider -v ON_ERROR_STOP=1 \
            <<'SQL' | tee -a "$log"
          BEGIN;
          INSERT INTO public.memory_context_bindings (principal_oid, tenant_id, security_domain)
          VALUES ('a11oy_memory_provider_runtime'::regrole, 'provider-tenant', 'provider-domain');
          ROLLBACK;
          SQL

      - name: Prove provider-owner convergence and fail-closed refusals
        shell: bash
        run: |
          set -euo pipefail
          ev=evidence/memory-covenant-v2-provider-owner
          log="$ev/provider-owner-refusals.log"
          # Evidence is uploaded only when the job passes, so print it on failure.
          trap 'status=$?; if [ "$status" -ne 0 ]; then for f in "$ev"/*.log; do echo "--- $f ---"; cat "$f"; done; fi' EXIT
          base=migrations/20260811_memory_covenant_v2.sql
          hardening=migrations/20260811_memory_covenant_v2_security_hardening.sql
          corrective=migrations/20260820_memory_covenant_v2_postmerge_hardening.sql
          echo '=== provider-owner convergence and fail-closed refusals ===' | tee "$log"
          # Seeded delegates can log in and are named by a random letter plus
          # random hex, with no fixed prefix, so neither a fixture name nor a
          # name pattern can exempt them.
          random_role() {
            local letters=abcdefghijklmnopqrstuvwxyz
            printf '%s%s' "${letters:$((RANDOM % 26)):1}" \
              "$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          }
          as_postgres() {
            docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
              psql -X -U postgres -d memory_covenant_provider -v ON_ERROR_STOP=1 "$@"
          }
          as_owner() {
            docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
              psql -X -U a11oy_memory_provider_owner -d memory_covenant_provider -v ON_ERROR_STOP=1 "$@"
          }
          apply_as() {
            docker exec -i \
              -e PGPASSWORD=postgres \
              -e PGOPTIONS='-c search_path=memory_attacker,public' \
              "$PG_CONTAINER" \
              psql -X -U "$1" -d "${3:-memory_covenant_provider}" -v ON_ERROR_STOP=1 < "$2"
          }
          expect_refusal() {
            local principal="$1" migration="$2" message="$3" out="$4"
            local database="${5:-memory_covenant_provider}"
            if apply_as "$principal" "$migration" "$database" > "$out" 2>&1; then
              echo "expected a refusal that did not happen: ${message}" | tee -a "$log"
              exit 1
            fi
            if ! grep -F "$message" "$out" | tee -a "$log"; then
              echo "refused without the expected message: ${message}" | tee -a "$log"
              exit 1
            fi
          }
          # Every state refusal runs against the hardening and against the
          # corrective alone, because existing installations apply only the
          # corrective.
          expect_state_refusal() {
            local message="$1" name="$2" migration
            for migration in "$hardening" "$corrective"; do
              expect_refusal a11oy_memory_provider_owner "$migration" "$message" \
                "$ev/refusal-${name}-$(basename "$migration" .sql).log"
            done
          }
          expect_acceptance_refusal() {
            local message="$1" out="$2"
            if docker exec -i -e PGPASSWORD=postgres "$PG_CONTAINER" \
                psql -X -U postgres -d memory_covenant_provider -v ON_ERROR_STOP=1 \
                < tests/memory_covenant_acceptance.sql > "$out" 2>&1; then
              echo "the acceptance passed a state it must refuse: ${message}" | tee -a "$log"
              exit 1
            fi
            if ! grep -F "$message" "$out" | tee -a "$log"; then
              echo "the acceptance failed without the expected message: ${message}" | tee -a "$log"
              exit 1
            fi
          }
          count_deviations() {
            as_postgres -qAt \
              -c "SELECT count(*) FROM pg_catalog.pg_roles WHERE rolname IN ('a11oy_memory_app', 'a11oy_memory_worker') AND (rolsuper OR rolcreatedb OR rolcreaterole OR rolcanlogin OR rolreplication OR NOT rolinherit OR rolbypassrls)"
          }

          echo '--- attributes and delegations the owner can clear converge ---' | tee -a "$log"
          as_postgres \
            -c 'ALTER ROLE a11oy_memory_app LOGIN CREATEDB CREATEROLE NOINHERIT BYPASSRLS' \
            -c 'ALTER ROLE a11oy_memory_worker LOGIN CREATEROLE' | tee -a "$log"
          owner_delegate="$(random_role)"
          as_owner \
            -c "CREATE ROLE ${owner_delegate} LOGIN" \
            -c "GRANT a11oy_memory_worker TO ${owner_delegate} WITH ADMIN OPTION" | tee -a "$log"
          apply_as a11oy_memory_provider_owner "$hardening" | tee -a "$log"
          apply_as a11oy_memory_provider_owner "$corrective" | tee -a "$log"
          provider_attribute_deviation_count="$(count_deviations)"
          test "$provider_attribute_deviation_count" = "0"
          owner_delegate_swept_count="$(as_postgres -qAt \
            -c "SELECT count(*) FROM pg_catalog.pg_auth_members WHERE roleid = 'a11oy_memory_worker'::regrole AND member = '${owner_delegate}'::regrole AND NOT admin_option AND NOT inherit_option AND NOT set_option")"
          test "$owner_delegate_swept_count" = "1"
          as_postgres \
            -c 'ALTER ROLE a11oy_memory_app LOGIN CREATEDB CREATEROLE NOINHERIT BYPASSRLS' \
            -c 'ALTER ROLE a11oy_memory_worker LOGIN CREATEROLE' | tee -a "$log"
          apply_as a11oy_memory_provider_owner "$corrective" | tee -a "$log"
          corrective_attribute_deviation_count="$(count_deviations)"
          test "$corrective_attribute_deviation_count" = "0"

          echo '--- states this principal cannot clear abort the migration ---' | tee -a "$log"
          as_postgres -c 'ALTER ROLE a11oy_memory_worker SUPERUSER' | tee -a "$log"
          expect_state_refusal \
            'a11oy_memory_worker holds an attribute this migration principal cannot clear' \
            superuser-attribute
          as_postgres -c 'ALTER ROLE a11oy_memory_worker NOSUPERUSER' | tee -a "$log"

          foreign_delegate="$(random_role)"
          as_postgres \
            -c "CREATE ROLE ${foreign_delegate} LOGIN" \
            -c "GRANT a11oy_memory_app TO ${foreign_delegate} WITH ADMIN OPTION" | tee -a "$log"
          expect_state_refusal \
            'capability-role delegation survived the sweep; another grantor holds it' \
            foreign-delegation
          as_postgres -c "DROP ROLE ${foreign_delegate}" | tee -a "$log"

          as_owner -c 'CREATE ROLE a11oy_memory_owner_parent NOLOGIN' | tee -a "$log"
          as_postgres -c 'GRANT a11oy_memory_owner_parent TO a11oy_memory_app' | tee -a "$log"
          expect_state_refusal \
            'a capability role still belongs to a parent role this principal could not revoke' \
            outbound-membership
          as_postgres -c 'DROP ROLE a11oy_memory_owner_parent' | tee -a "$log"

          signature_delegate="$(random_role)"
          as_postgres \
            -c "CREATE ROLE ${signature_delegate} LOGIN" \
            -c "GRANT a11oy_memory_worker TO ${signature_delegate} WITH INHERIT FALSE, SET FALSE, ADMIN FALSE" \
            | tee -a "$log"
          as_owner -c "GRANT a11oy_memory_worker TO ${signature_delegate} WITH INHERIT FALSE, SET TRUE" | tee -a "$log"
          expect_state_refusal \
            'a swept capability-role delegate keeps SET or INHERIT through another grant' \
            set-survivor
          as_postgres -c "DROP ROLE ${signature_delegate}" | tee -a "$log"

          # Older sweeps left a member with SET but neither INHERIT nor ADMIN.
          setonly_member="$(random_role)"
          as_owner \
            -c "CREATE ROLE ${setonly_member} LOGIN" \
            -c "GRANT a11oy_memory_worker TO ${setonly_member} WITH INHERIT FALSE, SET TRUE" \
            | tee -a "$log"
          expect_state_refusal \
            'a capability-role membership grants SET without INHERIT; runtime logins must inherit' \
            set-only-member
          as_owner -c "DROP ROLE ${setonly_member}" | tee -a "$log"

          # The end state of a grant raced into a migration: a delegate that
          # held ADMIN when the migration started granted the worker role to a
          # member, and the grant landed after the sweep had removed that
          # delegate's ADMIN. The grant is made normally, so the member's row
          # and its dependency on the grantor are real; a superuser then sets
          # only the delegate's own row to the shape the sweep leaves.
          raced_grantor="$(random_role)"
          raced_member="$(random_role)"
          as_owner \
            -c "CREATE ROLE ${raced_grantor} LOGIN" \
            -c "CREATE ROLE ${raced_member} LOGIN" \
            -c "GRANT a11oy_memory_worker TO ${raced_grantor} WITH ADMIN OPTION" | tee -a "$log"
          docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U "$raced_grantor" -d memory_covenant_provider -v ON_ERROR_STOP=1 \
            -c "GRANT a11oy_memory_worker TO ${raced_member}" | tee -a "$log"
          as_postgres \
            -c "UPDATE pg_catalog.pg_auth_members SET admin_option = false, inherit_option = false, set_option = false WHERE roleid = 'a11oy_memory_worker'::regrole AND member = '${raced_grantor}'::regrole" \
            | tee -a "$log"
          raced_row_count="$(as_postgres -qAt \
            -c "SELECT count(*) FROM pg_catalog.pg_auth_members WHERE roleid = 'a11oy_memory_worker'::regrole AND member = '${raced_member}'::regrole AND grantor = '${raced_grantor}'::regrole AND NOT EXISTS (SELECT 1 FROM pg_catalog.pg_auth_members AS authority WHERE authority.roleid = 'a11oy_memory_worker'::regrole AND authority.member = '${raced_grantor}'::regrole AND authority.admin_option)")"
          test "$raced_row_count" = "1"
          expect_state_refusal \
            'a capability-role membership was granted by a role that no longer holds ADMIN on it' \
            raced-grantor
          expect_acceptance_refusal \
            'Memory Covenant capability membership has a grantor without ADMIN' \
            "$ev/refusal-raced-grantor-acceptance.log"
          as_owner -c "DROP ROLE ${raced_member}" -c "DROP ROLE ${raced_grantor}" | tee -a "$log"

          # Ownership is a privilege path that pg_auth_members does not show.
          capability_schema="$(random_role)"
          as_postgres -c "CREATE SCHEMA ${capability_schema} AUTHORIZATION a11oy_memory_app" | tee -a "$log"
          expect_state_refusal 'a capability role owns the database or a schema' schema-owner
          as_postgres -c "DROP SCHEMA ${capability_schema}" | tee -a "$log"
          # The principal must still own schema public through the database
          # owner, so it inherits the capability role that now owns the database.
          as_owner -c 'GRANT a11oy_memory_app TO a11oy_memory_provider_owner WITH INHERIT TRUE' | tee -a "$log"
          as_postgres -c 'ALTER DATABASE memory_covenant_provider OWNER TO a11oy_memory_app' | tee -a "$log"
          expect_state_refusal 'a capability role owns the database or a schema' database-owner
          as_postgres -c 'ALTER DATABASE memory_covenant_provider OWNER TO a11oy_memory_provider_owner' | tee -a "$log"
          as_owner -c 'REVOKE a11oy_memory_app FROM a11oy_memory_provider_owner' | tee -a "$log"

          echo '--- principals that cannot see every row or do not own schema public ---' | tee -a "$log"
          as_postgres \
            -c 'CREATE ROLE a11oy_memory_unbypassed_principal LOGIN NOSUPERUSER CREATEDB CREATEROLE NOBYPASSRLS' \
            -c 'CREATE ROLE a11oy_memory_foreign_principal LOGIN NOSUPERUSER CREATEROLE BYPASSRLS' \
            -c 'CREATE ROLE a11oy_memory_unbypassed_owner LOGIN NOSUPERUSER CREATEDB CREATEROLE NOBYPASSRLS' \
            -c 'CREATE DATABASE memory_covenant_unbypassed OWNER a11oy_memory_unbypassed_owner' \
            | tee -a "$log"
          # Owning its own database, this principal meets the schema-ownership
          # half of the precondition, so its refusal isolates row security.
          unbypassed_owner_owns_public="$(docker exec -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -XqAt -U a11oy_memory_unbypassed_owner -d memory_covenant_unbypassed -v ON_ERROR_STOP=1 \
            -c "SELECT pg_catalog.pg_has_role(CURRENT_USER, nspowner, 'USAGE') FROM pg_catalog.pg_namespace WHERE nspname = 'public'")"
          test "$unbypassed_owner_owns_public" = "t"
          for migration in "$base" "$hardening" "$corrective"; do
            name="$(basename "$migration" .sql)"
            expect_refusal a11oy_memory_unbypassed_principal "$migration" \
              'the migration principal must bypass row security to check existing rows' \
              "$ev/refusal-row-security-${name}.log"
            expect_refusal a11oy_memory_unbypassed_owner "$migration" \
              'the migration principal must bypass row security to check existing rows' \
              "$ev/refusal-row-security-database-owner-${name}.log" \
              memory_covenant_unbypassed
            expect_refusal a11oy_memory_foreign_principal "$migration" \
              'the migration principal must own schema public' \
              "$ev/refusal-schema-owner-${name}.log"
          done
          as_postgres \
            -c 'DROP DATABASE memory_covenant_unbypassed' \
            -c 'DROP ROLE a11oy_memory_unbypassed_principal' \
            -c 'DROP ROLE a11oy_memory_foreign_principal' \
            -c 'DROP ROLE a11oy_memory_unbypassed_owner' | tee -a "$log"

          echo '--- an owner that sees every row meets a legacy cross-domain receipt ---' | tee -a "$log"
          docker exec -i -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant_provider -v ON_ERROR_STOP=1 \
            <<'SQL' | tee -a "$log"
          ALTER TABLE public.memory_query_audit
            DROP CONSTRAINT memory_query_audit_tenant_domain_receipt_fkey;
          ALTER TABLE public.memory_idempotency
            DROP CONSTRAINT memory_idempotency_tenant_domain_receipt_fkey;
          ALTER TABLE public.memory_receipts
            DROP CONSTRAINT memory_receipts_tenant_domain_receipt_key;
          ALTER TABLE public.memory_query_audit
            ADD CONSTRAINT memory_query_audit_receipt_id_fkey
            FOREIGN KEY (receipt_id) REFERENCES public.memory_receipts(receipt_id)
            ON DELETE RESTRICT;
          ALTER TABLE public.memory_idempotency
            ADD CONSTRAINT memory_idempotency_receipt_id_fkey
            FOREIGN KEY (receipt_id) REFERENCES public.memory_receipts(receipt_id)
            ON DELETE RESTRICT;
          INSERT INTO public.memory_receipts (
              receipt_id,
              tenant_id,
              security_domain,
              namespace,
              seq,
              prev_digest,
              digest,
              mode,
              operation,
              decision,
              request_digest,
              receipt_json
          ) VALUES (
              'legacy-cross-domain-receipt',
              'legacy-tenant',
              'legacy-domain-a',
              'legacy-tenant:legacy-domain-a',
              9223372036854770001,
              repeat('0', 64),
              repeat('4', 64),
              'UNSIGNED-CONTENT-DIGEST',
              'legacy-preflight',
              'DENY',
              repeat('5', 64),
              jsonb_build_object(
                  'receipt_id', 'legacy-cross-domain-receipt',
                  'integrity', jsonb_build_object('digest', repeat('4', 64))
              )
          );
          INSERT INTO public.memory_query_audit (
              audit_id,
              tenant_id,
              security_domain,
              receipt_id,
              query_digest,
              result_digest,
              audit_json
          ) VALUES (
              'legacy-cross-domain-audit',
              'legacy-tenant',
              'legacy-domain-b',
              'legacy-cross-domain-receipt',
              repeat('6', 64),
              repeat('7', 64),
              jsonb_build_object(
                  'audit_id', 'legacy-cross-domain-audit',
                  'query_digest', repeat('6', 64),
                  'result_digest', repeat('7', 64)
              )
          );
          SQL
          expect_refusal a11oy_memory_provider_owner "$corrective" \
            'memory_query_audit contains a cross-domain receipt reference' \
            "$ev/refusal-cross-domain-receipt.log"
          as_postgres \
            -c 'TRUNCATE TABLE public.memory_query_audit, public.memory_idempotency, public.memory_receipts CASCADE' \
            | tee -a "$log"

          echo '--- every refusal rolled back; the owner re-applies cleanly ---' | tee -a "$log"
          apply_as a11oy_memory_provider_owner "$hardening" | tee -a "$log"
          apply_as a11oy_memory_provider_owner "$corrective" | tee -a "$log"

      - name: Execute rollback-only acceptance against the provider-owned database
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i -e PGPASSWORD=postgres "$PG_CONTAINER" \
            psql -X -U postgres -d memory_covenant_provider -v ON_ERROR_STOP=1 \
            < tests/memory_covenant_acceptance.sql \
            | tee evidence/memory-covenant-v2-provider-owner/provider-owner-acceptance.log
          grep -F '"status": "PASS"' evidence/memory-covenant-v2-provider-owner/provider-owner-acceptance.log
          grep -F '"memory_rows": 0' evidence/memory-covenant-v2-provider-owner/provider-owner-acceptance.log
          grep -F '"context_binding_rows": 0' evidence/memory-covenant-v2-provider-owner/provider-owner-acceptance.log

      - name: Upload provider-owner evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-covenant-v2-provider-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/memory-covenant-v2-provider-owner
          if-no-files-found: error
          retention-days: 90
