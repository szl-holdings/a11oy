name: HF Space module-drift guard

# Pull requests compare the exact protected base SHA with the immutable
# Hugging Face repository revision and its managed file bytes. This remains
# measurable while a Space runtime is paused, and it never treats a candidate
# as deployed. Runtime readiness is a separate fail-closed responsibility of
# hf-sync, which verifies /api/build-info only after protected-main deployment.
# Pushes do not run this workflow because they race publication. Every main
# push enters hf-sync without a path filter, so Dockerfile sources such as
# .well-known/security.txt cannot bypass deployment; hf-sync then dispatches
# this strict repository parity check. Manual and scheduled runs compare exact
# current GitHub source with the immutable Hugging Face repository head.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 6 * * 1'  # Mondays 06:37 UTC (HF-side edits land with no GitHub push)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hf-module-drift:
    uses: szl-holdings/.github/.github/workflows/reusable-hf-module-drift-check.yml@96573c9049c0c705072cf51024d5ef12ccbee98c  # .github PR #307: immutable repository parity
    with:
      hf-repo: SZLHOLDINGS/a11oy
      # A PR candidate is intentionally not deployed. Compare its exact
      # protected base with the immutable HF repository head; candidate changes
      # remain a source-review concern until the protected merge triggers
      # hf-sync. Manual/scheduled runs compare exact current main instead.
      mode: direct
      github-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
      hf-ref: main
