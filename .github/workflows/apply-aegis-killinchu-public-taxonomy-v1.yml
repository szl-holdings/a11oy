name: Apply Aegis to Killinchu public taxonomy v1

on:
  push:
    branches:
      - feat/aegis-killinchu-public-taxonomy-v1
    paths:
      - .github/workflows/apply-aegis-killinchu-public-taxonomy-v1.yml

permissions:
  contents: write

concurrency:
  group: apply-aegis-killinchu-public-taxonomy-v1
  cancel-in-progress: false

jobs:
  converge:
    name: Converge public bodies and prove engine truth
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/aegis-killinchu-public-taxonomy-v1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply fail-closed taxonomy convergence
        run: python tools/apply_aegis_killinchu_public_taxonomy_v1.py

      - name: Prove front-door, formula, engine, and publisher contracts
        run: |
          set -euo pipefail
          python -m json.tool docs/strategy/living-command-fabric.v1.json >/dev/null
          python -m unittest tests.test_living_command_fabric_frontdoor -v
          python - <<'PY'
          from tests import test_hf_frontier_v3_rebase as contract
          for name in sorted(dir(contract)):
              if name.startswith("test_"):
                  getattr(contract, name)()
          print("frontier-v3 rebase contract: PASS")
          PY
          python -m py_compile \
            tools/apply_aegis_killinchu_public_taxonomy_v1.py \
            tests/test_living_command_fabric_frontdoor.py \
            scripts/hf_publish_vertical_services_frontier_v3.py
          git diff --check

      - name: Commit only durable implementation
        env:
          BRANCH: feat/aegis-killinchu-public-taxonomy-v1
        run: |
          set -euo pipefail
          git rm tools/apply_aegis_killinchu_public_taxonomy_v1.py
          git rm .github/workflows/apply-aegis-killinchu-public-taxonomy-v1.yml
          git add \
            a11oy_landing.html \
            docs/strategy/living-command-fabric.v1.json \
            tests/test_living_command_fabric_frontdoor.py
          git config user.name "SZL Taxonomy Controller"
          git config user.email "stephenlutar2@gmail.com"
          git commit -m "feat(frontdoor): consolidate Aegis into Killinchu" \
            -m "Present five public domain bodies backed by six internal engines. Keep Sentra and IMMUNE as Killinchu capability planes, fold Vessels into the same resilience product, retain the exact locked-eight formula authority, and preserve runtime honesty." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin "HEAD:${BRANCH}"
