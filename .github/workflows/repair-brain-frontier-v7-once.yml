# SPDX-License-Identifier: Apache-2.0
name: Repair Brain Frontier v7 selection once

on:
  push:
    branches:
      - feat/brain-frontier-holographic-v7-20260904
    paths:
      - .github/workflows/repair-brain-frontier-v7-once.yml

permissions:
  contents: write

concurrency:
  group: a11oy-brain-frontier-v7-bootstrap
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/brain-frontier-holographic-v7-20260904
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact focused test tooling
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.3.5"

      - name: Preserve all formula tissue and reserve every system lineage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script_path = Path("scripts/materialize_brain_frontier_v7.py")
          script = script_path.read_text(encoding="utf-8")
          script = script.replace("MAX_HANDLES = 64", "MAX_HANDLES = 72")
          start = script.index("def select_handles(rows: list[dict[str, Any]]) -> list[dict[str, Any]]:\n")
          end = script.index("\n\ndef build_snapshot(", start)
          replacement = '''def select_handles(rows: list[dict[str, Any]]) -> list[dict[str, Any]]:
    """Keep all formula tissue, then reserve one handle per connected system."""

    ordered = sorted(
        rows,
        key=lambda row: (
            KIND_ORDER.get(str(row.get("source_kind") or ""), 99),
            str(row.get("quant_domain") or ""),
            str(row["id"]),
        ),
    )
    formula_kinds = {
        "formula-authority",
        "quant-domain",
        "attributed-formula",
        "executable-formula",
    }
    selected: list[dict[str, Any]] = [
        row
        for row in ordered
        if str(row.get("source_kind") or "") in formula_kinds
    ]
    if len(selected) != 61:
        raise MaterializationError("complete formula tissue must contain 61 handles")

    selected_ids = {str(row["id"]) for row in selected}
    reserve_repositories = (
        "szl-holdings/anatomy",
        "szl-holdings/ouroboros",
        "szl-holdings/a11oy",
        "szl-holdings/szl-forge",
        "szl-holdings/szl-nemo",
    )
    for repository in reserve_repositories:
        candidate = next(
            (
                row
                for row in ordered
                if row["id"] not in selected_ids
                and row.get("source_repository") == repository
            ),
            None,
        )
        if candidate is not None:
            selected.append(candidate)
            selected_ids.add(str(candidate["id"]))

    for row in ordered:
        if len(selected) >= MAX_HANDLES:
            break
        if str(row["id"]) in selected_ids:
            continue
        selected.append(row)
        selected_ids.add(str(row["id"]))

    handles: list[dict[str, Any]] = []
    for row in selected[:MAX_HANDLES]:
        handle: dict[str, Any] = {
            "nodeId": row["id"],
            "title": str(row.get("title") or "")[:180],
            "sha256": row["content_sha256"],
            "repository": row["source_repository"],
            "revision": row["source_revision"],
            "path": row["source_path"],
            "kind": row["source_kind"],
            "admission": row["admission"],
            "candidateState": "DISCOVERED_REVIEW_REQUIRED",
            "contentAccess": "HANDLES_ONLY",
            "authority": "NONE",
        }
        if row.get("quant_domain"):
            handle["quantDomain"] = row["quant_domain"]
        handles.append(handle)
    return handles
'''
          script = script[:start] + replacement + script[end:]
          script_path.write_text(script, encoding="utf-8", newline="\n")

          js_path = Path("console/assets/brain-frontier-v7.js")
          js = js_path.read_text(encoding="utf-8")
          js = js.replace("payload.handles.length > 64", "payload.handles.length > 72")
          js_path.write_text(js, encoding="utf-8", newline="\n")

          test_path = Path("tests/test_brain_frontier_v7.py")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace("for index in range(62, 72):", "for index in range(62, 82):")
          test = test.replace("len(first[\"handles\"]) == 64", "len(first[\"handles\"]) == 72")
          test_path.write_text(test, encoding="utf-8", newline="\n")

          surface_path = Path("tests/test_brain_frontier_v7_surface.py")
          surface = surface_path.read_text(encoding="utf-8")
          surface = surface.replace("len(payload[\"handles\"]) == 64", "len(payload[\"handles\"]) == 72")
          surface_path.write_text(surface, encoding="utf-8", newline="\n")
          PY
          git diff --check

      - name: Rebuild and bind the exact source snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_brain_frontier_v7.py \
            --output console/assets/brain-frontier-v7.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("static/3d/holographic.html")
          text = path.read_text(encoding="utf-8")
          style = '<link rel="stylesheet" href="/assets/brain-frontier-v7.css" data-szl-brain-frontier-v7="style" />'
          script = '<script src="/assets/brain-frontier-v7.js" defer data-szl-brain-frontier-v7="script"></script>'
          if 'data-szl-brain-frontier-v7="style"' not in text:
              position = text.lower().rfind("</head>")
              if position < 0:
                  raise SystemExit("holographic shell has no closing head")
              text = text[:position] + "  " + style + "\n" + text[position:]
          if 'data-szl-brain-frontier-v7="script"' not in text:
              position = text.lower().rfind("</body>")
              if position < 0:
                  raise SystemExit("holographic shell has no closing body")
              text = text[:position] + "  " + script + "\n" + text[position:]
          if text.count('data-szl-brain-frontier-v7="style"') != 1:
              raise SystemExit("Brain Frontier style is not mounted exactly once")
          if text.count('data-szl-brain-frontier-v7="script"') != 1:
              raise SystemExit("Brain Frontier script is not mounted exactly once")
          path.write_text(text, encoding="utf-8", newline="\n")

          payload = json.loads(Path("console/assets/brain-frontier-v7.json").read_text())
          assert payload["selected_handle_count"] == len(payload["handles"]) == 72
          kinds = {handle["kind"] for handle in payload["handles"]}
          assert {"formula-authority", "quant-domain", "attributed-formula", "executable-formula"} <= kinds
          repositories = {handle["repository"] for handle in payload["handles"]}
          assert {
              "szl-holdings/szl-formulas",
              "szl-holdings/anatomy",
              "szl-holdings/ouroboros",
              "szl-holdings/a11oy",
              "szl-holdings/szl-forge",
              "szl-holdings/szl-nemo",
          } <= repositories
          encoded = json.dumps(payload, sort_keys=True).lower()
          assert '"content"' not in encoded
          assert '"text"' not in encoded
          PY
          git diff --check

      - name: Prove the corrected source, UI, and existing holographic shell
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/materialize_brain_frontier_v7.py \
            tests/test_brain_frontier_v7.py \
            tests/test_brain_frontier_v7_surface.py
          node --check console/assets/brain-frontier-v7.js
          python -m json.tool console/assets/brain-frontier-v7.json >/dev/null
          python -m pytest -q \
            tests/test_brain_frontier_v7.py \
            tests/test_brain_frontier_v7_surface.py
          for test_file in test_router_surface_3d.py tests/test_attest.py; do
            if [ -f "$test_file" ]; then
              python -m pytest -q "$test_file"
            fi
          done
          git diff --check

      - name: Commit the corrected snapshot and remove bootstrap controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add scripts/materialize_brain_frontier_v7.py \
            console/assets/brain-frontier-v7.js \
            console/assets/brain-frontier-v7.json \
            static/3d/holographic.html \
            tests/test_brain_frontier_v7.py \
            tests/test_brain_frontier_v7_surface.py
          for path in \
            .github/workflows/materialize-brain-frontier-v7-once.yml \
            .github/workflows/repair-brain-frontier-v7-once.yml; do
            if [ -e "$path" ]; then
              git rm -f "$path"
            fi
          done
          git diff --cached --quiet && { echo "no Brain Frontier repair changes"; exit 1; }
          digest="$(python -c 'import json; print(json.load(open("console/assets/brain-frontier-v7.json"))["snapshot_sha256"][:16])')"
          git commit -s -m "feat(holographic): finalize Brain Frontier v7 ${digest}"
          git push origin HEAD:feat/brain-frontier-holographic-v7-20260904
