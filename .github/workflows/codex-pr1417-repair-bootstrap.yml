name: Codex PR1417 baseline repair bootstrap

on:
  push:
    branches:
      - codex/repair-main-contracts-20260830
    paths:
      - scripts/codex_restore_pr1417.py
      - .github/workflows/codex-pr1417-repair-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-pr1417-repair-bootstrap
  cancel-in-progress: false

jobs:
  restore-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/repair-main-contracts-20260830
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Three-way inverse merge the stale overwrite
        shell: bash
        run: |
          set -uo pipefail
          if python scripts/codex_restore_pr1417.py; then
            exit 0
          fi
          echo '::group::Bounded restored estate-view context'
          python - <<'PY'
          from pathlib import Path

          lines = Path('pages/console.html').read_text(encoding='utf-8').splitlines()
          needles = (
              'V.estate', 'mountEstate', 'renderEstate', 'Latest HF', 'LAST KNOWN',
              '/api/a11oy/v1/hf/estate', 'const V', 'let V',
              'hfEstateUpdatedAt', 'estateUpdated', "case 'estate'",
              'case "estate"', "go('estate')", 'go("estate")',
              'fetchHFEstate', 'hfEstate', "V['estate']", 'V["estate"]',
          )
          indexes = sorted({
              index for index, line in enumerate(lines)
              if any(needle in line for needle in needles)
          })
          emitted = set()
          shown = 0
          for index in indexes:
              start = max(0, index - 8)
              end = min(len(lines), index + 9)
              key = (start, end)
              if key in emitted:
                  continue
              emitted.add(key)
              print(f'--- lines {start + 1}-{end} ---')
              for line_number in range(start, end):
                  print(f'{line_number + 1}: {lines[line_number]}')
                  shown += 1
                  if shown >= 300:
                      raise SystemExit(0)
          if not indexes:
              print('NO_MATCHING_ESTATE_ANCHORS')
          PY
          echo '::endgroup::'

          echo '::group::Newest remote revisions with exact live-estate contract'
          python - <<'PY'
          from __future__ import annotations

          import subprocess

          needle = 'async function fetchHFEstate()'
          refs = subprocess.check_output(
              ['git', 'for-each-ref', '--format=%(refname)', 'refs/remotes/origin'],
              text=True,
          ).splitlines()
          command = ['git', 'grep', '-n', '-F', needle, *refs, '--', 'pages/console.html']
          found = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          matching_refs = set()
          for line in found.stdout.splitlines():
              marker = ':pages/console.html:'
              if marker in line:
                  matching_refs.add(line.split(marker, 1)[0])
          ranked = []
          for ref in matching_refs:
              timestamp = int(subprocess.check_output(
                  ['git', 'log', '-1', '--format=%ct', ref], text=True
              ).strip())
              ranked.append((timestamp, ref))
          ranked.sort(reverse=True)
          print(f'MATCHING_REFS={len(ranked)}')
          context_needles = (
              'hfEstate: null', 'hfEstateUpdatedAt', needle,
              "fetch('/api/a11oy/v1/hf/estate', { cache: 'no-store' })",
              'HF estate unavailable — metrics are unknown.',
              'Latest HF API inventory', 'LAST KNOWN FALLBACK',
          )
          for _, ref in ranked[:5]:
              print(f'=== {ref} ===')
              text = subprocess.check_output(
                  ['git', 'show', f'{ref}:pages/console.html'], text=True
              )
              lines = text.splitlines()
              indexes = sorted({
                  index for index, line in enumerate(lines)
                  if any(value in line for value in context_needles)
              })
              emitted = set()
              shown = 0
              for index in indexes:
                  start = max(0, index - 10)
                  end = min(len(lines), index + 18)
                  key = (start, end)
                  if key in emitted:
                      continue
                  emitted.add(key)
                  print(f'--- {ref} lines {start + 1}-{end} ---')
                  for line_number in range(start, end):
                      print(f'{line_number + 1}: {lines[line_number]}')
                      shown += 1
                      if shown >= 220:
                          break
                  if shown >= 220:
                      break
          PY
          echo '::endgroup::'
          exit 1

      - name: Compile repaired server
        run: python -m py_compile serve.py

      - name: Install exact test dependencies
        run: pip install --require-hashes -r .github/requirements/ci-core.txt

      - name: Prove restored route, console, estate, landing, identity and honesty contracts
        run: >-
          pytest
          tests/test_demo_critical_routes.py
          tests/test_khipu_chat_proxy.py
          tests/test_khipu_console_panel.py
          tests/test_holographic_command_bar.py
          tests/test_series_a_estate.py
          tests/test_landing_flagship_catalog.py
          tests/test_landing_audit_fixes.py
          tests/test_identity_lock.py
          test_canonical_domain.py
          -q

      - name: Commit the proven restoration to the non-protected branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SZL Estate v10 Repair Bot'
          git config user.email 'stephenlutar2@gmail.com'
          git add a11oy_landing.html pages/console.html pages/landing.html serve.py
          if git diff --cached --quiet; then
            echo 'No restoration delta produced' >&2
            exit 1
          fi
          git commit -m 'fix(runtime): restore contracts removed by stale PR1417 merge [baseline-restored]

          Three-way inverse merge against PR #1417 preserves later protected-main edits while restoring the reviewed command bar, investor/estate routes, Khipu proxy, exact HEAD support, local page fallback, signer honesty, router counters, and security hardening removed by the stale branch.

          Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:codex/repair-main-contracts-20260830
