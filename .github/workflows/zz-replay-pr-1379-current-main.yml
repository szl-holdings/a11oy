name: Rebuild router decision counters on current main

on:
  push:
    branches:
      - fix/router-decision-counters-current-main-20260828

permissions:
  contents: write

concurrency:
  group: rebuild-router-decision-counters-current-main-20260828
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.repository == 'szl-holdings/a11oy' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current-main successor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/router-decision-counters-current-main-20260828
          fetch-depth: 0
          persist-credentials: true

      - name: Require landed KEV correction and replay PR 1379
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/router.env
          import json, urllib.request
          headers = {
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'szl-router-current-main-rebuilder/1',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(path):
              request = urllib.request.Request(
                  'https://api.github.com' + path, headers=headers
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          dependency = get('/repos/szl-holdings/a11oy/pulls/1378')
          source = get('/repos/szl-holdings/a11oy/pulls/1379')
          if not dependency.get('merged_at'):
              raise SystemExit('PR 1378 has not landed on protected main')
          if source.get('state') != 'open':
              raise SystemExit('PR 1379 is not open')
          head = source.get('head') or {}
          base = source.get('base') or {}
          head_repo = head.get('repo') or {}
          if head_repo.get('full_name') != 'szl-holdings/a11oy':
              raise SystemExit('PR 1379 head repository is not canonical')
          values = {
              'DEPENDENCY_MERGE': dependency.get('merge_commit_sha'),
              'SOURCE_HEAD': head.get('sha'),
              'SOURCE_BASE': base.get('sha'),
          }
          for key, value in values.items():
              if not isinstance(value, str) or len(value) != 40:
                  raise SystemExit(f'{key} is not an exact SHA')
              print(f'{key}={value}')
          PY
          . /tmp/router.env
          git fetch --no-tags origin "$DEPENDENCY_MERGE" "$SOURCE_BASE" "$SOURCE_HEAD" main
          git merge-base --is-ancestor "$DEPENDENCY_MERGE" HEAD
          git diff --binary "$SOURCE_BASE" "$SOURCE_HEAD" -- \
            . ':(exclude).github/workflows/zz-replay-pr-1379-current-main.yml' \
            > /tmp/pr-1379.patch
          test -s /tmp/pr-1379.patch
          git apply --3way --index /tmp/pr-1379.patch

      - name: Prove receipt-backed counter semantics survived the rebuild
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changed = []
          import subprocess
          paths = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines()
          for name in paths:
              path = Path(name)
              if not path.is_file() or path.suffix not in {'.py','.js','.mjs','.cjs','.ts','.tsx','.json','.md'}:
                  continue
              try:
                  changed.append((name, path.read_text(encoding='utf-8')))
              except (OSError, UnicodeError):
                  pass
          corpus = '\n'.join(text for _, text in changed)
          required = (
              'routing_decisions',
              'routingDecisionsSinceStart',
              'routing_decisions_since_process_start',
              'counter_scope',
              'throughput_state',
          )
          missing = [term for term in required if term not in corpus]
          if missing:
              raise SystemExit(f'router counter contract lost during replay: {missing}')
          if 'tok/s' in corpus or 'requests/second' in corpus or 'QPS' in corpus:
              raise SystemExit('rate semantics reintroduced into cumulative counter surfaces')
          if not any('receipt' in text.casefold() for _, text in changed):
              raise SystemExit('counter delta is not receipt-bound')
          Path('/tmp/router-changed-files.txt').write_text(
              '\n'.join(name for name, _ in changed), encoding='utf-8'
          )
          PY
          git diff --cached --check

      - name: Run focused counter and readiness qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q .github scripts tools tests 2>/dev/null || true
          if test -f package.json && command -v corepack >/dev/null 2>&1; then
            corepack enable
          fi
          if test -f pnpm-lock.yaml && command -v pnpm >/dev/null 2>&1; then
            pnpm install --frozen-lockfile --ignore-scripts
          fi
          mapfile -t tests < <(git diff --cached --name-only | grep -E '(^|/)(tests?|__tests__)/|test_.*\.py$|\.test\.[cm]?[jt]sx?$' || true)
          for file in "${tests[@]}"; do
            case "$file" in
              *.py) python3 -m pytest -q "$file" ;;
              *.test.js|*.test.mjs|*.test.cjs) node --test "$file" ;;
            esac
          done

      - name: Commit clean current-main successor
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-replay-pr-1379-current-main.yml
          git add -A
          git diff --cached --check
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git commit \
            -m 'fix(router): rebuild receipt-backed counters on current main' \
            -m 'Replay the exact PR 1379 vertical contract only after the KEV correction is present, preserve process-lifetime receipt-backed counts and degraded/unavailable truth labels, and remove this bounded rebuild workflow.' \
            -m 'Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>'
          git push origin HEAD:fix/router-decision-counters-current-main-20260828
