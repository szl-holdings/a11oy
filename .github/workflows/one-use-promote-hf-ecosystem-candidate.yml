name: One-use promote measured Hugging Face ecosystem candidate

on:
  push:
    branches:
      - fix/hf-ecosystem-current-20260904-2236
    paths:
      - .github/workflows/one-use-promote-hf-ecosystem-candidate.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: one-use-promote-hf-ecosystem-candidate-20260904-2236
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-ecosystem-current-20260904-2236
          fetch-depth: 1
          persist-credentials: true

      - name: Download and verify immutable measured candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "9956882367"
          EXPECTED_CANDIDATE_SHA256: "b264009a8be6e08dbee75ddbdf4c096314134ca73a4114d9e5c9ac58fed4e006"
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "$work/candidate.zip"
          unzip -q "$work/candidate.zip" -d "$work/candidate"
          candidate="$work/candidate/huggingface-ecosystem-manifest.candidate.json"
          test -f "$candidate"
          printf '%s  %s\n' "$EXPECTED_CANDIDATE_SHA256" "$candidate" | sha256sum --check --strict
          python - "$candidate" <<'PY'
          import json
          import pathlib
          import sys

          candidate = pathlib.Path(sys.argv[1])
          value = json.loads(candidate.read_text(encoding="utf-8"))
          assert value["generatedBy"] == "scripts/audit_huggingface_ecosystem.py"
          assert value["observedAt"] == "2026-09-04T22:36:36Z"
          assert value["counts"] == {"models": 44, "datasets": 33, "spaces": 16}
          spaces = {item["id"]: item for item in value["inventory"]["spaces"]}
          ayllu = spaces["SZLHOLDINGS/ayllu"]
          assert ayllu["private"] is False
          assert ayllu["gated"] is False
          assert ayllu["disabled"] is False
          assert ayllu["sdk"] == "docker"
          assert ayllu["sha"] == "2a22a689f04f7c158d7303540b88aeed6f9bcedc"
          assert len(value["inventory"]["models"]) == 44
          assert len(value["inventory"]["datasets"]) == 33
          assert len(value["inventory"]["spaces"]) == 16
          PY
          cp "$candidate" docs/huggingface-ecosystem-manifest.json

      - name: Regenerate and verify the derived stage matrix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_ecosystem_stage_matrix.py
          python scripts/build_ecosystem_stage_matrix.py --check
          python scripts/test_audit_huggingface_ecosystem.py
          python -m json.tool docs/huggingface-ecosystem-manifest.json >/dev/null
          python -m json.tool docs/ecosystem-stage-matrix.json >/dev/null
          git diff --check

      - name: Commit durable repair and remove this controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SZL HF Ecosystem Candidate Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add docs/huggingface-ecosystem-manifest.json docs/ecosystem-stage-matrix.json
          git rm .github/workflows/one-use-promote-hf-ecosystem-candidate.yml
          git commit -s -m "fix(hf): promote measured 44-33-16 public ecosystem"
          git push origin HEAD:fix/hf-ecosystem-current-20260904-2236
