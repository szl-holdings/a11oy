# SPDX-License-Identifier: Apache-2.0
name: Refresh HF free-tier recovery source once

on:
  push:
    branches:
      - repair/hf-free-tier-runtime-consolidation
    paths:
      - .github/workflows/refresh-hf-free-tier-source-once.yml

permissions:
  contents: write

concurrency:
  group: refresh-hf-free-tier-source-once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OLD_SHA: c24ef61716f173e48d95dad61408d9fa065f0204
      NEW_SHA: 7a84e34a05c7342bd32b56f6519fe51ce240f577
      BRANCH: repair/hf-free-tier-runtime-consolidation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repair/hf-free-tier-runtime-consolidation
          fetch-depth: 0
          persist-credentials: true

      - name: Replace the stale source authority exactly
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/hf_recover_vertical_estate_free_tier.py
            tests/test_hf_recover_vertical_estate_free_tier.py
            docs/strategy/hf-free-tier-recovery.v1.json
          )
          for path in "${files[@]}"; do
            test "$(grep -oF "$OLD_SHA" "$path" | wc -l)" -ge 1
            sed -i "s/$OLD_SHA/$NEW_SHA/g" "$path"
            ! grep -Fq "$OLD_SHA" "$path"
            grep -Fq "$NEW_SHA" "$path"
          done
          git rm .github/workflows/refresh-hf-free-tier-source-once.yml
          python -m json.tool docs/strategy/hf-free-tier-recovery.v1.json >/dev/null
          python -m py_compile scripts/hf_recover_vertical_estate_free_tier.py tests/test_hf_recover_vertical_estate_free_tier.py
          git diff --check

      - name: Commit the current tested source authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add scripts/hf_recover_vertical_estate_free_tier.py \
            tests/test_hf_recover_vertical_estate_free_tier.py \
            docs/strategy/hf-free-tier-recovery.v1.json
          git commit -s -m "fix(hf): recover from the current tested vertical source"
          git push origin HEAD:"$BRANCH"
