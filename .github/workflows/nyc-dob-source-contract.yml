name: NYC DOB source contract

on:
  pull_request:
    branches: [main]
    paths:
      - a11oy_vertical_feeds.py
      - tests/test_nyc_dob_recent_source.py
      - .github/workflows/nyc-dob-source-contract.yml
  push:
    branches: [main]
    paths:
      - a11oy_vertical_feeds.py
      - tests/test_nyc_dob_recent_source.py
      - .github/workflows/nyc-dob-source-contract.yml

permissions:
  contents: read

concurrency:
  group: nyc-dob-source-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: DOB dates, query bounds, and cache isolation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile the real source module
        run: python -S -m py_compile a11oy_vertical_feeds.py
      - name: Exercise the actual source function with offline provider fixtures
        run: python -S -m unittest discover -s tests -p test_nyc_dob_recent_source.py -v
