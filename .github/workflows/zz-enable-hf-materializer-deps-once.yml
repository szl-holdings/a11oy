name: Enable pinned Hugging Face materializer dependencies once

on:
  push:
    branches: [fix/hf-card-resolve-transport-current-main-20260905]
    paths: [.github/workflows/zz-enable-hf-materializer-deps-once.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/fix/hf-card-resolve-transport-current-main-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Add the repository's pinned frozen-lockfile dependency closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/zz-materialize-hf-resolve-transport-once.yml)" = 63fbbdd2951b969da167e640c4cd60f22b3d9c6a
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/zz-materialize-hf-resolve-transport-once.yml')
          source = path.read_text(encoding='utf-8')
          setup = "      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020\n        with:\n          node-version: '22'\n"
          replacement = "      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86\n        with:\n          version: '10.33.3'\n          run_install: false\n      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020\n        with:\n          node-version: '22'\n          cache: 'pnpm'\n      - name: Install the exact schema-validator closure\n        run: pnpm install --frozen-lockfile\n"
          if source.count(setup) != 1:
              raise SystemExit('Node setup boundary changed; refusing broad edit')
          path.write_text(source.replace(setup, replacement), encoding='utf-8')
          PY
          git diff --check
      - name: Commit the controller repair and consume this patcher
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/hf-card-resolve-transport-current-main-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_HEAD"
          git rm -- .github/workflows/zz-enable-hf-materializer-deps-once.yml
          git add -- .github/workflows/zz-materialize-hf-resolve-transport-once.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'ci(hf): install the pinned schema-validator closure' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$branch"
