name: One-shot HF canary touch remediation

on:
  push:
    branches:
      - fix/hf-live-canary-touch-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/hf-live-canary-touch-20260902
          fetch-depth: 0
      - name: Patch HF landing hit targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('a11oy_landing.html')
          text = path.read_text()
          marker = '/* live-canary touch remediation 2026-09-02 */'
          if marker in text:
              raise SystemExit('remediation marker already present')
          if 'Verify a receipt' not in text or 'Read the spec' not in text:
              raise SystemExit('expected buyer CTA text missing')
          style = '''\n  /* live-canary touch remediation 2026-09-02 */\n  .cta-row{position:relative;z-index:20}\n  .cta-row .btn{position:relative;z-index:21;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding-top:12px;padding-bottom:12px;pointer-events:auto}\n'''
          closing = '</style>'
          if closing not in text:
              raise SystemExit('style close tag missing')
          path.write_text(text.replace(closing, style + closing, 1))
          PY
          rm .github/workflows/_oneshot-hf-canary-touch-fix.yml
          git config user.name 'szl-build-fix[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a11oy_landing.html .github/workflows/_oneshot-hf-canary-touch-fix.yml
          git diff --cached --check
          git commit -s -m 'fix(hf): restore buyer CTA hit targets'
          git push origin HEAD:fix/hf-live-canary-touch-20260902
