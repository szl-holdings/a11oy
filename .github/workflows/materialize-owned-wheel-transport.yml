name: Materialize owned wheel transport repair

on:
  push:
    branches: [fix/owned-wheel-transport-closure]
    paths: [.github/workflows/materialize-owned-wheel-transport.yml]

permissions:
  contents: write

concurrency:
  group: materialize-owned-wheel-transport-repair
  cancel-in-progress: false

jobs:
  patch-and-test:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/fix/owned-wheel-transport-closure' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply only the exact reviewed Docker transport replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('Dockerfile')
          before = p.read_bytes()
          blob = hashlib.sha1(('blob ' + str(len(before)) + '\0').encode() + before).hexdigest()
          if blob != '1628d2b4ab6afc88a5975ac0a5437b0cce0c661a':
              raise SystemExit('Dockerfile advanced: refusing an unreviewed replacement')
          text = before.decode('utf-8')
          start = text.index('ADD --checksum=sha256:d172f3d3c8cdd194c3c47c71cb077ed6e61354a2d0f939ceeac0c8fd29999596')
          end = text.index("RUN python3 <<'WHEELCHK'", start)
          old = text[start:end]
          if len(old.splitlines()) != 3 or old.count('https://github.com/abetlen/llama-cpp-python/') != 1:
              raise SystemExit('unexpected remote ADD span')
          replacement = ('COPY scripts/fetch_owned_khipu_wheel.py /tmp/fetch_owned_khipu_wheel.py\n'
                         'RUN python3 /tmp/fetch_owned_khipu_wheel.py && rm /tmp/fetch_owned_khipu_wheel.py\n')
          after = text[:start] + replacement + text[end:]
          if after.replace(replacement, old, 1).encode() != before:
              raise SystemExit('non-transport bytes changed')
          p.write_bytes(after.encode())
          print('Replaced exactly three remote ADD lines; all other Dockerfile bytes preserved.')
          PY
          git diff --check
      - name: Install existing locked test closure
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt
      - name: Execute transport and existing cortex contracts
        run: python -m pytest tests/test_owned_wheel_transport.py tests/test_owned_khipu_docker_contract.py tests/test_a11oy_governed_cortex.py -q
      - name: Read exact canonical publisher for offline derivation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/.github
          ref: e3ec47ad2e99a535839afe0f30fefbd8973d52da
          path: .wheel-publisher-tools
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact Docker source closure without a Hub write
        shell: bash
        run: |
          set -euo pipefail
          python .wheel-publisher-tools/.github/scripts/hf_deploy_from_dockerfile.py \
            --repo-root . --github-repo szl-holdings/a11oy --hf-repo SZLHOLDINGS/a11oy \
            --ref "$GITHUB_SHA" --source-sha "$GITHUB_SHA" --dockerfile-path Dockerfile \
            --include-readme true --dry-run --manifest-out "$RUNNER_TEMP/wheel-closure.json"
      - name: Commit only the verified Docker replacement to its repair branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/owned-wheel-transport-closure
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          test "$(git diff --name-only)" = Dockerfile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Dockerfile
          git commit -s -m 'fix(build): preserve pinned wheel verification in local source closure'
          git push origin HEAD:refs/heads/fix/owned-wheel-transport-closure
      - name: Preserve derivation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owned-wheel-transport-closure-${{ github.run_id }}
          path: ${{ runner.temp }}/wheel-closure.json
          if-no-files-found: warn
          retention-days: 30
