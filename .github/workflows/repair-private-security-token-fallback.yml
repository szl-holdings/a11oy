name: Repair private security credential fallback

on:
  push:
    branches:
      - fix/security-posture-token-fallback-20260905
    paths:
      - .github/workflows/repair-private-security-token-fallback.yml
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read
  security-events: read

concurrency:
  group: repair-private-security-token-fallback
  cancel-in-progress: false

env:
  TARGET_REVISION: 9fbae997b48db45a9e890f79692e94acf14425a3
  REPORT_PATH: private-security-posture-fallback.json

jobs:
  repair:
    name: Add per-family credential fallback and prove the privacy boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SZL_SECURITY_TOKEN_1: ${{ secrets.SZL_ORG_ADMIN_TOKEN }}
      SZL_SECURITY_TOKEN_2: ${{ secrets.ORG_ADMIN_TOKEN }}
      SZL_SECURITY_TOKEN_3: ${{ secrets.SZL_GITHUB_TOKEN }}
      SZL_SECURITY_TOKEN_4: ${{ secrets.GH_PAT }}
      SZL_SECURITY_TOKEN_5: ${{ github.token }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply exact three-file transformation
        run: |
          set -euo pipefail
          python .github/scripts/repair_private_security_token_fallback_once.py
          git diff --check

      - name: Run complete privacy and fallback regression suite
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_private_security_posture
          python -m py_compile .github/scripts/private_security_posture.py

      - name: Exercise configured credentials against live aggregate APIs
        run: |
          set -euo pipefail
          python .github/scripts/private_security_posture.py \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$TARGET_REVISION" \
            --default-branch main \
            --report "$REPORT_PATH"
          python -c 'import json; r=json.load(open("private-security-posture-fallback.json", encoding="utf-8")); assert r["incident_action"] == "DRY_RUN"; print(json.dumps({"source_revision": r["source_revision"], "summary_digest": r["summary_digest"], "families": r["families"], "attention": r["attention"], "security_and_analysis": r["security_and_analysis"], "governance": r["governance"], "incident_action": r["incident_action"]}, indent=2, sort_keys=True))'

      - name: Enforce exact permanent repair boundary
        run: |
          set -euo pipefail
          git diff --check
          python -c 'import subprocess; changed=set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()); expected={".github/scripts/private_security_posture.py", ".github/workflows/private-security-posture.yml", "tests/test_private_security_posture.py"}; assert changed == expected, f"repair boundary mismatch: changed={sorted(changed)} expected={sorted(expected)}"'

      - name: Commit verified non-workflow portion
        run: |
          set -euo pipefail
          git restore .github/workflows/private-security-posture.yml
          python -c 'import subprocess; changed=set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()); expected={".github/scripts/private_security_posture.py", "tests/test_private_security_posture.py"}; assert changed == expected, f"push boundary mismatch: changed={sorted(changed)} expected={sorted(expected)}"'
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add \
            .github/scripts/private_security_posture.py \
            tests/test_private_security_posture.py
          git commit -m "fix(security): retry private posture credentials per family

          Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload aggregate-only fallback proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-security-token-fallback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 30
