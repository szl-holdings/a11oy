name: Repair Series A public freshness contract

on:
  push:
    branches:
      - fix/series-a-roadmap-freshness-20260829

permissions:
  contents: write

concurrency:
  group: repair-series-a-freshness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize public freshness labels and add regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("a11oy_model_intel.py")
          text = source.read_text(encoding="utf-8")
          old = '''    fetch_status = (freshness or {}).get("status")
              fetch_error = (freshness or {}).get("error")
          '''
          new = '''    raw_fetch_status = (freshness or {}).get("status")
              fetch_status = (
                  raw_fetch_status
                  if raw_fetch_status in {"live", "cached", "stale", "unavailable"}
                  else "unavailable"
              )
              fetch_error = (freshness or {}).get("error")
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one public freshness assignment, found {text.count(old)}")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("tests/test_series_a_freshness_contract.py")
          if test.exists():
              raise SystemExit("freshness regression test already exists")
          test.write_text(
              '''from __future__ import annotations

          import a11oy_model_intel as model_intel


          def test_roadmap_kernel_never_exports_internal_empty_freshness() -> None:
              card = model_intel._series_a_bind_card(
                  model_intel.SERIES_A_ROADMAP_KERNELS[0],
                  None,
                  {"status": "empty"},
              )
              assert card["freshness"]["status"] == "unavailable"


          def test_supported_public_freshness_is_preserved() -> None:
              spec = model_intel.SERIES_A_CARDS[0]
              live = {
                  "repository_id": spec["hub_id"],
                  "revision": "a" * 40,
                  "file_count": 1,
                  "weight_bearing_from_filenames": False,
                  "has_adapter_from_filenames": False,
              }
              card = model_intel._series_a_bind_card(
                  spec,
                  live,
                  {"status": "live"},
              )
              assert card["freshness"]["status"] == "live"
          ''',
              encoding="utf-8",
          )
          PY

          python3 -m py_compile a11oy_model_intel.py tests/test_series_a_freshness_contract.py
          python3 - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path
          import re
          from typing import Any, Optional

          tree = ast.parse(Path("a11oy_model_intel.py").read_text(encoding="utf-8"))
          functions = [
              node
              for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name == "_series_a_bind_card"
          ]
          if len(functions) != 1:
              raise SystemExit("expected one Series A binding function")
          module = ast.Module(
              body=[
                  ast.ImportFrom(
                      module="__future__",
                      names=[ast.alias(name="annotations")],
                      level=0,
                  ),
                  functions[0],
              ],
              type_ignores=[],
          )
          ast.fix_missing_locations(module)
          namespace = {
              "Any": Any,
              "Optional": Optional,
              "_HF_REVISION_RE": re.compile(r"^[0-9a-f]{40}$"),
          }
          exec(compile(module, "a11oy_model_intel.py", "exec"), namespace)
          bind = namespace["_series_a_bind_card"]

          roadmap = {
              "id": "sage-int8-fp8",
              "title": "Sage INT8/FP8",
              "lane": "kernel",
              "cut": "ROADMAP",
              "one_line": "Roadmap only.",
              "hub_id": None,
              "hub_kind": None,
              "hub_href": None,
              "github": None,
              "act_href": None,
              "not": "Not shipped.",
          }
          card = bind(roadmap, None, {"status": "empty"})
          assert card["freshness"]["status"] == "unavailable"

          model = {
              "id": "test-model",
              "title": "Test model",
              "lane": "model",
              "cut": "CUTTING",
              "one_line": "Test model.",
              "hub_id": "SZLHOLDINGS/test-model",
              "hub_kind": "model",
              "hub_href": "https://huggingface.co/SZLHOLDINGS/test-model",
              "github": "https://github.com/szl-holdings/test-model",
              "act_href": "https://huggingface.co/SZLHOLDINGS/test-model",
              "not": "Not operational.",
          }
          live = {
              "repository_id": model["hub_id"],
              "revision": "a" * 40,
              "file_count": 1,
              "weight_bearing_from_filenames": False,
              "has_adapter": False,
          }
          card = bind(model, live, {"status": "live"})
          assert card["freshness"]["status"] == "live"
          PY
          git diff --check

      - name: Commit exact repair and remove this bounded workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-repair-series-a-freshness.yml
          git add a11oy_model_intel.py tests/test_series_a_freshness_contract.py
          git diff --cached --check
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git commit \
            -m 'fix(readiness): normalize Series A freshness labels' \
            -m 'Prevent internal cache status empty from escaping through the public Series A model and roadmap-kernel contract. Preserve supported live, cached, stale, and unavailable states and add focused regression coverage.' \
            -m 'Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>'
          git push origin "HEAD:${GITHUB_REF_NAME}"
