# SPDX-License-Identifier: Apache-2.0
name: Fix Lyte source-owned contract once

on:
  push:
    branches:
      - fix/lyte-source-owned-publisher
    paths:
      - .github/workflows/fix-lyte-source-owned-contract-once.yml

permissions:
  contents: write

concurrency:
  group: fix-lyte-source-owned-contract-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/lyte-source-owned-publisher
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Align the topology regression test with the reviewed publisher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_hf_publish_vertical_flagships_v4.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "def test_entrypoint_publishes_four_spaces_and_folds_two_into_killinchu() -> None:":
                  "def test_entrypoint_publishes_source_owned_lyte_and_folds_vessels() -> None:",
              "        'PUBLIC_FLAGSHIP_SLUGS = (\"terra\", \"counsel\", \"finance\", \"lyte\")',\n":
                  "        'PUBLIC_FLAGSHIP_SLUGS = (\"terra\", \"sentra\", \"counsel\", \"finance\", \"lyte\")',\n"
                  "        'GENERATED_FLAGSHIP_SLUGS = (\"terra\", \"sentra\", \"counsel\", \"finance\")',\n"
                  "        'SOURCE_OWNED_FLAGSHIP_SLUGS = (\"lyte\",)',\n"
                  "        'LYTE_SOURCE_REVISION = \"2131d2eb3611267bd62c134b6bba6b4cf7523127\"',\n"
                  "        'SENTRA_SPACE = \"SZLHOLDINGS/sentra\"',\n"
                  "        'LYTE_IMPL = HERE / \"hf_publish_lyte_enterprise.py\"',\n"
                  "        'install_existing_space_guard()',\n"
                  "        '\"szl.hf-vertical-estate/v8\"',\n"
                  "        'flagship[\"lyte_runtime\"]',\n",
              "        'FOLDED_INTO_KILLINCHU = (\"sentra\", \"vessels\")',\n":
                  "        'FOLDED_INTO_KILLINCHU = (\"vessels\",)',\n",
              "    for retired in (\"sentra\", \"vessels\"):\n":
                  "    for retired in (\"vessels\",):\n",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one topology test fragment, found {count}: {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git diff --check

      - name: Prove the exact failing contract locally
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "pytest==9.0.3"
          python -m pytest -q \
            tests/test_hf_publish_vertical_flagships_v4.py::test_entrypoint_publishes_source_owned_lyte_and_folds_vessels
          python -m py_compile \
            scripts/hf_existing_space_guard.py \
            scripts/hf_publish_lyte_enterprise.py \
            scripts/hf_publish_vertical_flagships_v4.py \
            tests/test_hf_publish_vertical_flagships_v4.py
          git diff --check

      - name: Commit the durable test correction and remove this controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add tests/test_hf_publish_vertical_flagships_v4.py
          git rm .github/workflows/fix-lyte-source-owned-contract-once.yml
          git diff --cached --quiet && { echo "no Lyte contract correction"; exit 1; }
          git commit -s -m "test(hf): align vertical topology with source-owned Lyte"
          git push origin HEAD:fix/lyte-source-owned-publisher
