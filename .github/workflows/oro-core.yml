name: ORO core contracts

on:
  pull_request:
    paths:
      - szl_oro_core.py
      - tests/test_oro_core.py
      - schemas/v1/oro-rank.v1.schema.json
      - schemas/v1/oro-barrier-receipt.v1.schema.json
      - .github/workflows/oro-core.yml
  push:
    branches: [main]
    paths:
      - szl_oro_core.py
      - tests/test_oro_core.py
      - schemas/v1/oro-rank.v1.schema.json
      - schemas/v1/oro-barrier-receipt.v1.schema.json
      - .github/workflows/oro-core.yml

permissions:
  contents: read

concurrency:
  group: oro-core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Rank, barrier, persistence, and signer contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact core test dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt
      - name: Compile the ORO control plane
        run: python3 -m py_compile szl_oro_core.py tests/test_oro_core.py
      - name: Validate the committed JSON Schemas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path("schemas/v1/oro-rank.v1.schema.json"),
              Path("schemas/v1/oro-barrier-receipt.v1.schema.json"),
          ):
              value = json.loads(path.read_text(encoding="utf-8"))
              assert value["$schema"] == "https://json-schema.org/draft/2020-12/schema"
              assert value["additionalProperties"] is False
              print(f"validated {path}")
          PY
      - name: Prove structural rank, barrier, evidence, and fail-closed signing
        run: python3 -m pytest -q tests/test_oro_core.py
