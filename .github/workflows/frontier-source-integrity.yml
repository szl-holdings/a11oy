name: Frontier source-pin integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pin-integrity:
    name: Protected Frontier inputs remain digest-bound
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install hash-locked test dependencies
        run: pip install --require-hashes -r .github/requirements/ci-core.txt

      - name: Enforce workflow source pins and reject orphan digests
        run: python -I -B -m pytest -q tests/test_frontier_workflow_source_integrity.py
