# SPDX-License-Identifier: Apache-2.0
name: Repair A11oy safe-area contract

on:
  push:
    branches: [ci/public-experience-frontier-v4]
    paths:
      - ".github/workflows/frontier-v4-safe-area-repair.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ci/public-experience-frontier-v4
          fetch-depth: 0

      - name: Insert source-visible safe-area contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("a11oy_landing.html")
          text = path.read_text(encoding="utf-8")
          marker = 'id="szl-safe-area-contract-v4"'
          if marker in text:
              raise SystemExit(0)
          block = '''\n<style id="szl-safe-area-contract-v4">\n/* Public Experience Frontier v4: notch, home-indicator and landscape safe areas. */\n@supports (padding: max(0px)) {\n  body {\n    padding-bottom: max(0px, env(safe-area-inset-bottom, 0px));\n  }\n  .wrap {\n    padding-left: max(24px, env(safe-area-inset-left, 0px));\n    padding-right: max(24px, env(safe-area-inset-right, 0px));\n  }\n}\n@media (max-width: 1100px) {\n  @supports (padding: max(0px)) {\n    .nav .wrap {\n      padding-left: max(14px, env(safe-area-inset-left, 0px));\n      padding-right: max(14px, env(safe-area-inset-right, 0px));\n    }\n  }\n}\n</style>\n'''
          if "</head>" not in text:
              raise SystemExit("a11oy_landing.html has no </head> insertion point")
          path.write_text(text.replace("</head>", block + "</head>", 1), encoding="utf-8")
          PY

      - name: Commit repair to the active PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- a11oy_landing.html; then
            echo "Safe-area contract already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a11oy_landing.html
          git commit -m "fix(ux): honor device safe areas"
          git push origin HEAD:ci/public-experience-frontier-v4
