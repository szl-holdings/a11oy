name: temporary-readiness-integration

on:
  push:
    branches:
      - fix/console-command-bar-restore-20260830

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[readiness-integrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/console-command-bar-restore-20260830
          fetch-depth: 0

      - name: Fetch readiness repair and resolve the reviewed comment-only conflict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git fetch origin fix/readiness-1417-serve-regression-20260830

          set +e
          git merge --no-commit --no-ff origin/fix/readiness-1417-serve-regression-20260830
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
            printf 'unresolved files: %s\n' "${unresolved[*]:-none}"
            if [ "${#unresolved[@]}" -ne 1 ] || [ "${unresolved[0]}" != "serve.py" ]; then
              echo "::error::unexpected merge conflict set; refusing automatic resolution"
              git diff --name-status --diff-filter=U
              exit 1
            fi

            python3 - <<'PY'
          from pathlib import Path

          path = Path("serve.py")
          text = path.read_text(encoding="utf-8")
          conflict = '''<<<<<<< HEAD
                      # Public product front door (landing) never gets the operator widget baked in.
          =======
                      # Public front door: do not bake the operator widget into landing.
          >>>>>>> origin/fix/readiness-1417-serve-regression-20260830
          '''
          replacement = '''            # Public product front door (landing) never gets the operator widget baked in.
          '''
          if text.count(conflict) != 1:
              raise SystemExit("reviewed comment-only conflict was not present exactly once")
          text = text.replace(conflict, replacement, 1)
          if any(marker in text for marker in ("<<<<<<<", "=======", ">>>>>>>")):
              raise SystemExit("unexpected conflict marker remains in serve.py")
          path.write_text(text, encoding="utf-8")
          PY
            git add serve.py
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::unresolved paths remain after the reviewed resolution"
            git diff --name-status --diff-filter=U
            exit 1
          fi

      - name: Run targeted integration regressions
        shell: bash
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci-core.txt
          python -m pytest -q \
            tests/test_readiness_blocker_repairs.py \
            tests/test_readiness_honesty_relock_contract.py \
            tests/test_functest_router_receipts.py \
            tests/test_demo_critical_routes.py \
            tests/test_landing_audit_fixes.py
          python tools/readiness-harness/gen_tabs_matrix.py --check

      - name: Commit integrated repair
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit \
            -m "fix(readiness): integrate KEV/EPSS hardening [readiness-integrated]" \
            -m "Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>"
          git push origin HEAD:refs/heads/fix/console-command-bar-restore-20260830
