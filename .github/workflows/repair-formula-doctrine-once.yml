# SPDX-License-Identifier: Apache-2.0
name: Repair formula doctrine wording once

on:
  push:
    branches:
      - fix/vertical-services-v2-live-proof
    paths:
      - .github/workflows/repair-formula-doctrine-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/vertical-services-v2-live-proof
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: State the conjecture boundary and regenerate the payload digest
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          source_path = Path("szl_formula_registry.py")
          registry_path = Path("formula_registry/formula-registry.v1.json")
          workflow_path = Path(".github/workflows/repair-formula-doctrine-once.yml")

          old = (
              'EXPECTED_COVERAGE_SCOPE = (\n'
              '    "Exact locked-eight authority plus the F23 Lambda non-authority boundary; "\n'
              '    "not an exhaustive inventory of every SZL formula or theorem."\n'
              ')'
          )
          new_scope = (
              "Exact locked-eight authority plus the F23 Lambda boundary, which "
              "remains Conjecture 1 and is not a theorem; not an exhaustive "
              "inventory of every SZL formula or formal result."
          )
          new = (
              'EXPECTED_COVERAGE_SCOPE = (\n'
              '    "Exact locked-eight authority plus the F23 Lambda boundary, which "\n'
              '    "remains Conjecture 1 and is not a theorem; not an exhaustive "\n'
              '    "inventory of every SZL formula or formal result."\n'
              ')'
          )

          source = source_path.read_text(encoding="utf-8")
          if source.count(old) != 1:
              raise SystemExit("expected one exact coverage-scope source block")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          document = json.loads(registry_path.read_text(encoding="utf-8"))
          document["payload"]["coverage_scope"] = new_scope
          canonical = json.dumps(
              document["payload"],
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          document["registry_digest"]["value"] = hashlib.sha256(canonical).hexdigest()
          registry_path.write_text(
              json.dumps(document, indent=2, sort_keys=True, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          workflow_path.unlink()

      - name: Install hash-locked test closure
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r .github/requirements/ci-core.txt

      - name: Verify formula authority and vertical publication contracts
        run: |
          python -m py_compile szl_formula_registry.py scripts/hf_publish_vertical_services.py
          python -m pytest tests/test_formula_registry_reconciliation.py tests/test_hf_publish_vertical_flagships_v4.py -q

      - name: Commit deterministic repair to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SZL Canonical Repair"
          git config user.email "noreply@szlholdings.ai"
          git add szl_formula_registry.py formula_registry/formula-registry.v1.json .github/workflows/repair-formula-doctrine-once.yml
          git commit -m "fix(doctrine): state the F23 conjecture boundary explicitly" -m "Keep the exact locked-eight coverage scope while making F23's Conjecture 1 and non-theorem status explicit, then regenerate the payload digest deterministically."
          git push origin HEAD:fix/vertical-services-v2-live-proof
