name: SZL Router governed consumer contract

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: szl-router-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Governed gateway contract (${{ matrix.peer }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        peer: [fixture, pinned-router]
    steps:
      - name: Checkout A11oy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout immutable router source
        if: matrix.peer == 'pinned-router'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/szl-router
          ref: 6819d2aa616adb42d8257202df94059eff761bed
          path: .router-contract-peer
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install isolated contract dependencies
        run: python -m pip install fastapi==0.140.13 httpx==0.28.1 pydantic==2.13.4 pytest==9.1.1
      - name: Node for actual evaluation-client admission contracts
        if: matrix.peer == 'fixture'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify actual one-shot client request admission without network effects
        if: matrix.peer == 'fixture'
        run: node --test tests/test_eval_arena_client_admission.cjs
      - name: Exercise standalone contract
        if: matrix.peer == 'fixture'
        run: python -m pytest -q tests/test_szl_router_client.py tests/test_eval_request_admission.py
      - name: Exercise pinned gateway and isolated provider
        if: matrix.peer == 'pinned-router'
        env:
          SZL_ROUTER_CONTRACT_CHECKOUT: ${{ github.workspace }}/.router-contract-peer
        run: python -m pytest -q tests/test_szl_router_client.py tests/test_eval_request_admission.py
