name: Atelier Frontier clean-room contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/atelier-frontier.yml"
      - "docs/third-party/meta-success-intake-v1.md"
      - "pages/atelier.html"
      - "routers/__init__.py"
      - "routers/frontier_reads.py"
      - "routers/atelier_frontier.py"
      - "routers/atelier_frontier_web/**"
      - "tests/test_atelier_frontier*.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/atelier-frontier.yml"
      - "docs/third-party/meta-success-intake-v1.md"
      - "pages/atelier.html"
      - "routers/__init__.py"
      - "routers/frontier_reads.py"
      - "routers/atelier_frontier.py"
      - "routers/atelier_frontier_web/**"
      - "tests/test_atelier_frontier*.py"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: atelier-frontier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Prove clean-room intake, modeled evaluation, route wiring, and touch geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install hash-locked core test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r .github/requirements/ci-core.txt

      - name: Prove the focused Atelier contract
        shell: bash
        run: |
          set -euo pipefail
          pytest \
            tests/test_atelier_frontier.py \
            tests/test_atelier_frontier_geometry.py \
            -q
          python -m py_compile \
            routers/atelier_frontier.py \
            routers/frontier_reads.py \
            routers/__init__.py
          node --check routers/atelier_frontier_web/app.js
          grep -F 'from routers import atelier_frontier as _atelier_frontier' routers/frontier_reads.py
          grep -F 'href="/atelier/frontier"' pages/atelier.html

      - name: Prove committed diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="$(git merge-base HEAD origin/main)"
          git diff --check "$base" HEAD
