# SPDX-License-Identifier: Apache-2.0
name: HF Nine Flagship Consolidate

on:
  push:
    branches:
      - exec/hf-nine-flagship-consolidation
    paths:
      - docs/estate/hf-nine-flagship-keep.yaml
      - .github/workflows/hf-nine-flagship-consolidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-nine-flagship-consolidate
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
      HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned operator dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'huggingface_hub==1.10.1' 'PyYAML==6.0.3'
      - name: Apply nine flagship keep policy
        run: python scripts/hf_consolidate_fleet.py --policy docs/estate/hf-nine-flagship-keep.yaml --out hf-nine-flagship-consolidation-receipt.json
      - name: Upload immutable receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hf-nine-flagship-consolidation-${{ github.run_id }}-${{ github.run_attempt }}
          path: hf-nine-flagship-consolidation-receipt.json
          if-no-files-found: error
          retention-days: 90
