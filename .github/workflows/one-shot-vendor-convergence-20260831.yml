name: One-shot A11oy non-workflow vendor convergence

on:
  push:
    branches:
      - ops/vendor-sync-platform-880fda4-20260831

permissions:
  contents: write

concurrency:
  group: a11oy-vendor-convergence-20260831
  cancel-in-progress: false

jobs:
  converge:
    if: >-
      github.repository == 'szl-holdings/a11oy' &&
      github.ref == 'refs/heads/ops/vendor-sync-platform-880fda4-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_BASE_SHA: d9922a0dc7e6ec6162ec5be3c159579979d74a3e
      EXPECTED_OLD_PLATFORM_SHA: de08cf8ec5836b0cef968d6560a92ecbd1bc6f4b
      EXPECTED_PLATFORM_SHA: 880fda4f67fd2bbdc3507dce6d81fb782ca64c4c
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact branch, base, and Platform source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/ops/vendor-sync-platform-880fda4-20260831"
          test "$(git ls-remote origin "$GITHUB_REF" | awk '{print $1}')" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_BASE_SHA"
          test "$(git ls-remote https://github.com/szl-holdings/platform.git refs/heads/main | awk '{print $1}')" = "$EXPECTED_PLATFORM_SHA"

      - name: Rotate non-workflow vendor authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('vendor.manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          old = 'de08cf8ec5836b0cef968d6560a92ecbd1bc6f4b'
          new = '880fda4f67fd2bbdc3507dce6d81fb782ca64c4c'
          if data.get('monorepo') != 'szl-holdings/platform':
              raise SystemExit('unexpected monorepo authority')
          if data.get('pin') != old:
              raise SystemExit(f"unexpected prior pin: {data.get('pin')!r}")
          expected = {
              '.github/workflows/dco.yml': {'source': '.github/workflows/dco.yml', 'header': True},
              'scripts/qa/check-dco-workflow.py': {'source': 'scripts/qa/check-dco-workflow.py', 'header': True},
              '.github/workflows/pin-check.yml': {'source': '.github/workflows/pin-check.yml', 'header': True},
          }
          for rel, contract in expected.items():
              actual = data.get('files', {}).get(rel)
              if actual != contract:
                  raise SystemExit(f'unexpected manifest entry {rel}: {actual!r}')
              del data['files'][rel]
          data['pin'] = new
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Refresh and verify every non-workflow vendored file
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/sync_from_monorepo.sh sync
          test ! -e .github/workflows/dco.yml
          test -f scripts/qa/check-dco-workflow.py
          rm -- scripts/qa/check-dco-workflow.py
          bash scripts/sync_from_monorepo.sh check --strict-headers

      - name: Prove bounded non-workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- ':!.github/workflows/one-shot-vendor-convergence-20260831.yml'
          python3 - <<'PY'
          import json
          import subprocess

          manifest = json.load(open('vendor.manifest.json', encoding='utf-8'))
          allowed = set(manifest['files']) | {
              'vendor.manifest.json',
              'scripts/qa/check-dco-workflow.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'unexpected changed paths: {unexpected}')
          if any(path.startswith('.github/workflows/') for path in changed):
              raise SystemExit('runner commit must not modify workflow files')
          required = {'vendor.manifest.json', 'scripts/qa/check-dco-workflow.py'}
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f'required convergence changes missing: {missing}')
          if manifest.get('pin') != '880fda4f67fd2bbdc3507dce6d81fb782ca64c4c':
              raise SystemExit('manifest did not bind exact current Platform source')
          for retired in (
              '.github/workflows/dco.yml',
              'scripts/qa/check-dco-workflow.py',
              '.github/workflows/pin-check.yml',
          ):
              if retired in manifest['files']:
                  raise SystemExit(f'temporary manifest removal failed: {retired}')
          print(f'bounded non-workflow changed paths: {len(changed)}')
          PY
          git diff --cached --check

      - name: Commit non-workflow convergence to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(vendor): converge non-workflow Platform source'
          git push origin "HEAD:ops/vendor-sync-platform-880fda4-20260831"
