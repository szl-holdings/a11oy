name: One-shot A11oy vendor manifest finalization

on:
  push:
    branches:
      - ops/vendor-sync-platform-880fda4-20260831

permissions:
  contents: write

concurrency:
  group: a11oy-vendor-convergence-20260831
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'szl-holdings/a11oy' &&
      github.ref == 'refs/heads/ops/vendor-sync-platform-880fda4-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_BASE_SHA: d9922a0dc7e6ec6162ec5be3c159579979d74a3e
      EXPECTED_PLATFORM_SHA: 880fda4f67fd2bbdc3507dce6d81fb782ca64c4c
      EXPECTED_PIN_CHECK_SHA256: 859e0aca3deaa7a04d9eb2c2847c259b2c2b23287403063a560d90b6ef24d651
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact branch, base, and Platform source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/ops/vendor-sync-platform-880fda4-20260831"
          test "$(git ls-remote origin "$GITHUB_REF" | awk '{print $1}')" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_BASE_SHA"
          test "$(git ls-remote https://github.com/szl-holdings/platform.git refs/heads/main | awk '{print $1}')" = "$EXPECTED_PLATFORM_SHA"

      - name: Verify account-written current pin-check workflow
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum .github/workflows/pin-check.yml | awk '{print $1}')"
          test "$actual" = "$EXPECTED_PIN_CHECK_SHA256"

      - name: Restore current pin-check manifest authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('vendor.manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('monorepo') != 'szl-holdings/platform':
              raise SystemExit('unexpected monorepo authority')
          if data.get('pin') != '880fda4f67fd2bbdc3507dce6d81fb782ca64c4c':
              raise SystemExit('unexpected Platform pin')
          files = data.get('files', {})
          for retired in ('.github/workflows/dco.yml', 'scripts/qa/check-dco-workflow.py'):
              if retired in files:
                  raise SystemExit(f'retired authority still present: {retired}')
          expected = {'source': '.github/workflows/pin-check.yml', 'header': True}
          actual = files.get('.github/workflows/pin-check.yml')
          if actual is None:
              files['.github/workflows/pin-check.yml'] = expected
          elif actual != expected:
              raise SystemExit(f'unexpected pin-check authority: {actual!r}')
          data['files'] = dict(sorted(files.items()))
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          bash scripts/sync_from_monorepo.sh check --strict-headers

      - name: Commit manifest finalization when needed
        shell: bash
        run: |
          set -euo pipefail
          git add vendor.manifest.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Manifest already finalized.'
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "vendor.manifest.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(vendor): restore current pin-check authority'
          git push origin "HEAD:ops/vendor-sync-platform-880fda4-20260831"
