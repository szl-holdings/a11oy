name: Email sender credential repair

on:
  workflow_dispatch:
    inputs:
      expected_deployed_revision:
        description: Exact 40-character source revision currently served by the email Worker
        required: true
        type: string
      expected_version_id:
        description: Exact Cloudflare version ID from the canonical deployment record
        required: true
        type: string
      execute:
        description: Admit the single API_SECRET replacement after all fresh guards
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-production
    concurrency:
      group: deploy-szl-email-sender
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check out the exact protected control source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run the isolated offline safety cases
        run: python -B -m unittest discover -s tests -p test_email_sender_secret_repair.py -v
      - name: Admit one credential replacement and preserve value-free evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMAIL_SENDER_API_SECRET_V2: ${{ secrets.EMAIL_SENDER_API_SECRET_V2 }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DEPLOYED_REVISION: ${{ inputs.expected_deployed_revision }}
          EXPECTED_VERSION_ID: ${{ inputs.expected_version_id }}
          EXECUTE_REPAIR: ${{ inputs.execute && 'true' || 'false' }}
          REPAIR_ENVIRONMENT: cloudflare-production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          args=(
            --control-source "$GITHUB_SHA"
            --expect-revision "$EXPECTED_DEPLOYED_REVISION"
            --expected-version-id "$EXPECTED_VERSION_ID"
            --output-directory "$RUNNER_TEMP/email-secret-repair-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          )
          if [[ "$EXECUTE_REPAIR" == "true" ]]; then
            args+=(--execute)
          fi
          python -B scripts/repair_email_sender_secret.py "${args[@]}"
      - name: Preserve value-free admission and outcome receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: email-secret-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/email-secret-repair-${{ github.run_id }}-${{ github.run_attempt }}/receipt.jsonl
            ${{ runner.temp }}/email-secret-repair-${{ github.run_id }}-${{ github.run_attempt }}/report.json
          if-no-files-found: warn
          retention-days: 30
