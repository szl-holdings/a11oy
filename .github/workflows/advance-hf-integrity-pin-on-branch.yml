name: Advance HF Integrity Pin on Holographic Branch

on:
  push:
    branches:
      - feat/holographic-experience-v2-bound
    paths:
      - ".github/workflows/advance-hf-integrity-pin-on-branch.yml"

permissions:
  contents: write

concurrency:
  group: advance-hf-integrity-pin-holographic-branch
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/holographic-experience-v2-bound
          fetch-depth: 0

      - name: Advance validator and negative fixtures to fixed pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = "b09bb98e06d4d774595224525879c09bc6e98c40"
          new = "bf7454d06d71f1098171f2acdf0cd4708d7b5920"
          paths = (
              Path("scripts/validate_frontdoor_source_integrity.py"),
              Path("scripts/test_frontdoor_source_integrity.py"),
          )
          total = 0
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"expected legacy pin not found in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")
              total += count
          if total != 4:
              raise SystemExit(f"expected exactly four legacy pin references, found {total}")
          PY

      - name: Prove canonical workflow and adversarial fixtures
        run: |
          python3 scripts/test_frontdoor_source_integrity.py
          python3 -m unittest tests.test_verify_hf_repository_parity
          python3 scripts/validate_frontdoor_source_integrity.py
          git diff --check

      - name: Commit advanced control and remove one-shot controller
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/advance-hf-integrity-pin-on-branch.yml
          git config user.name "SZL Integrity Pin Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add scripts/validate_frontdoor_source_integrity.py scripts/test_frontdoor_source_integrity.py .github/workflows/advance-hf-integrity-pin-on-branch.yml
          git commit -s -m "fix(security): advance HF integrity validator to fixed runner pin"
          git push origin HEAD:feat/holographic-experience-v2-bound
