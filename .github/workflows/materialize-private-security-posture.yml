name: Materialize private security posture controller

on:
  push:
    branches:
      - feat/private-security-posture-v1-20260903
    paths:
      - ".github/workflows/materialize-private-security-posture.yml"

permissions:
  contents: write

concurrency:
  group: materialize-private-security-posture
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/private-security-posture-v1-20260903
          fetch-depth: 0

      - name: Write reviewed controller and tests
        shell: bash
        env:
          SCRIPT_B64: 
          TEST_B64: 
        run: |
          set -euo pipefail
          mkdir -p .github/scripts tests
          printf '%s' "$SCRIPT_B64" | base64 --decode | gzip --decompress > .github/scripts/private_security_posture.py
          printf '%s' "$TEST_B64" | base64 --decode | gzip --decompress > tests/test_private_security_posture.py

      - name: Verify exact materialized bytes
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_private_security_posture
          python -m py_compile .github/scripts/private_security_posture.py
          git diff --check

      - name: Commit controller and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SZL Private Security Posture Controller'
          git config user.email 'stephenlutar2@gmail.com'
          git add .github/scripts/private_security_posture.py tests/test_private_security_posture.py
          git commit -m 'feat(security): add secret-safe private alert observer' \
            -m 'Persist aggregate counts and explicit UNAVAILABLE states only; never persist raw alert objects, locations, paths, secret types, advisory details, or alert URLs.' \
            -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:feat/private-security-posture-v1-20260903
