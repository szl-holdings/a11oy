name: HF Lyte Enterprise source-owned contract

"on":
  pull_request:
    branches: [main]
    paths:
      - scripts/hf_publish_vertical_flagships_v4.py
      - scripts/hf_publish_lyte_enterprise.py
      - scripts/lyte_enterprise_live_contract.py
      - scripts/lyte_forecast_risk_live_contract.py
      - governance/public-estate.v1.json
      - tests/test_hf_publish_lyte_enterprise.py
      - tests/test_lyte_enterprise_live_contract.py
      - tests/test_lyte_forecast_risk_live_contract.py
      - tests/test_lyte_monitoring_contract.py
      - .github/workflows/hf-lyte-enterprise-contract.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-lyte-enterprise-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Exact source, Docker closure, live proof, and non-authority
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install the exact test runner used by current Lyte main
        run: python -m pip install --disable-pip-version-check --no-cache-dir pytest==9.0.3

      - name: Compile source-owned publisher chain
        run: >-
          python -m py_compile
          scripts/hf_publish_vertical_flagships_v4.py
          scripts/hf_publish_lyte_enterprise.py
          scripts/lyte_enterprise_live_contract.py
          scripts/lyte_forecast_risk_live_contract.py

      - name: Prove Lyte publication contract and behavioral negative controls
        run: >-
          python -m pytest
          tests/test_hf_publish_lyte_enterprise.py
          tests/test_lyte_enterprise_live_contract.py
          tests/test_lyte_forecast_risk_live_contract.py
          tests/test_lyte_monitoring_contract.py -q
