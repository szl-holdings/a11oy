name: Docs dependency security closure

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'web/package.json'
      - 'web/src/**'
      - 'tests/test_docs_dependency_security.py'
      - '.github/requirements/ci-core.txt'
      - '.github/workflows/docs-dependency-security.yml'
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'web/package.json'
      - 'web/src/**'
      - 'tests/test_docs_dependency_security.py'
      - '.github/requirements/ci-core.txt'
      - '.github/workflows/docs-dependency-security.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install-build:
    name: Docs locked install, security contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install hash-pinned contract test dependencies
        run: python -m pip install --require-hashes -r .github/requirements/ci-core.txt
      - name: Check manifest and lock security contracts
        run: python -m pytest -q tests/test_docs_dependency_security.py
      - name: Clean install from the committed docs lockfile
        working-directory: docs/site
        run: npm ci --no-audit --no-fund
      - name: Audit the installed docs dependency tree
        working-directory: docs/site
        run: npm audit
      - name: Build docs and diagram integration
        working-directory: docs/site
        run: npm run docs:build
      - name: Ensure package installation did not rewrite the source contract
        run: git diff --exit-code -- docs/site/package.json docs/site/package-lock.json
