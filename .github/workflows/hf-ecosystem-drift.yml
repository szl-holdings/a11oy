name: Refresh HF ecosystem manifest once

on:
  push:
    branches:
      - chore/refresh-hf-ecosystem-manifest-20260904-2228
    paths:
      - .github/workflows/hf-ecosystem-drift.yml

permissions:
  contents: write

concurrency:
  group: refresh-hf-ecosystem-manifest-20260904-2228
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact authorized branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify one-shot identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/chore/refresh-hf-ecosystem-manifest-20260904-2228"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install locked schema dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Regenerate and verify the current public inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_audit_huggingface_ecosystem.py
          python3 -m py_compile scripts/audit_huggingface_ecosystem.py
          python3 scripts/audit_huggingface_ecosystem.py \
            --output docs/huggingface-ecosystem-manifest.json
          python3 scripts/audit_huggingface_ecosystem.py \
            --check \
            --output docs/huggingface-ecosystem-manifest.json
          node scripts/validate_huggingface_ecosystem_schema.mjs
          node scripts/test_validate_huggingface_ecosystem_schema.mjs

      - name: Restore the canonical controller and commit only evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:.github/workflows/hf-ecosystem-drift.yml \
            > .github/workflows/hf-ecosystem-drift.yml
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add docs/huggingface-ecosystem-manifest.json \
            .github/workflows/hf-ecosystem-drift.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -s -m "chore(hf): refresh the measured public ecosystem manifest"
          git push origin HEAD:chore/refresh-hf-ecosystem-manifest-20260904-2228

      - name: Upload the exact refreshed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refreshed-hf-ecosystem-manifest-${{ github.run_id }}
          path: docs/huggingface-ecosystem-manifest.json
          if-no-files-found: error
          retention-days: 90
