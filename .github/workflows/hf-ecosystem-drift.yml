name: HF Ecosystem manifest drift

on:
  push:
    branches: [main]
  schedule:
    - cron: '11 7 * * 1'
  workflow_dispatch: {}

permissions: read-all
concurrency:
  group: hf-ecosystem-manifest-drift
  cancel-in-progress: false

jobs:
  drift:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate_result: ${{ steps.candidate.outcome }}
      artifact_id: ${{ steps.candidate_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.candidate_artifact.outputs.artifact-digest }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prove the manifest collector and revision contracts offline
        run: |
          python3 scripts/test_audit_huggingface_ecosystem.py
          python3 -m py_compile scripts/audit_huggingface_ecosystem.py
      - name: Compare the tracked manifest with current public Hub evidence
        id: check
        shell: bash
        run: |
          set +e
          mkdir -p evidence
          # The tee'd log feeds only the issue body; STATE still comes from the
          # collector's own exit status, which PIPESTATUS keeps through the pipe.
          python3 scripts/audit_huggingface_ecosystem.py \
            --check \
            --output docs/huggingface-ecosystem-manifest.json \
            | tee "$RUNNER_TEMP/hf-ecosystem-check.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            state='CURRENT'
          else
            state='DRIFT_OR_UNAVAILABLE'
          fi
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Generate a source-labelled candidate manifest
        id: candidate
        if: steps.check.outputs.state != 'CURRENT'
        continue-on-error: true
        run: >-
          python3 scripts/audit_huggingface_ecosystem.py
          --output evidence/huggingface-ecosystem-manifest.candidate.json
      - name: Synchronize deterministic drift incident
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.check.outputs.state }}
          CHECK_EXIT_CODE: ${{ steps.check.outputs.exit_code }}
          TITLE: '[HF-ECOSYSTEM-DRIFT] Public manifest is stale'
        shell: bash
        run: |
          set -euo pipefail
          number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --limit 100 \
            --search '"[HF-ECOSYSTEM-DRIFT] Public manifest is stale" in:title' \
            --json number,title \
            --jq '.[] | select(.title == "[HF-ECOSYSTEM-DRIFT] Public manifest is stale") | .number' \
            | head -n 1)
          if [ "${STATE:-UNKNOWN}" = 'CURRENT' ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed \
                --comment "Current protected source matches current public Hugging Face ecosystem evidence. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
            fi
            exit 0
          fi
          check_result=$(python3 -I -B scripts/format_hf_check_result.py \
            --log "$RUNNER_TEMP/hf-ecosystem-check.log" \
            --exit-code "${CHECK_EXIT_CODE:-}") \
            || check_result='UNAVAILABLE (the check result could not be formatted)'
          cat > /tmp/hf-drift-issue.md <<EOF
          ## Public Hugging Face ecosystem drift

          The tracked source-labelled manifest did not match the current public Hub observation, or the observation was unavailable.

          - Protected source: ${GITHUB_SHA}
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - State: ${STATE:-UNKNOWN}
          - Check result: ${check_result}
          - Candidate artifact: huggingface-ecosystem-manifest-candidate-${GITHUB_RUN_ID} when generation succeeds

          No model, dataset, Space, collection, bucket, visibility, hardware, or secret state was changed by this controller.
          EOF
          if [ -z "$number" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body-file /tmp/hf-drift-issue.md
          else
            gh issue reopen "$number" --repo "$GITHUB_REPOSITORY" || true
            gh issue edit "$number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file /tmp/hf-drift-issue.md
          fi
      # always(): a failed issue-sync API call must not suppress the candidate the
      # review branch is prepared from. The enforce step below still decides the job.
      - name: Upload candidate evidence
        id: candidate_artifact
        if: always() && steps.check.outputs.state != 'CURRENT'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: huggingface-ecosystem-manifest-candidate-${{ github.run_id }}
          path: evidence/huggingface-ecosystem-manifest.candidate.json
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce current public manifest
        if: always()
        env:
          STATE: ${{ steps.check.outputs.state }}
        run: test "${STATE}" = "CURRENT"

  prepare-source-review:
    name: Prepare exact-source inventory review branch (never auto-merge)
    needs: drift
    if: >-
      always() && needs.drift.outputs.candidate_result == 'success' &&
      needs.drift.outputs.artifact_id != '' &&
      github.ref == 'refs/heads/main' && github.repository == 'szl-holdings/a11oy'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install the existing projection import closure
        run: python -m pip install 'fastapi==0.141.1' 'starlette==1.6.0'
      - name: Verify offline admission controls
        run: python -B -m unittest discover -s tests -p 'test_hf_inventory_refresh*.py' -v
      - name: Create or fast-forward the rolling source review branch from this collector run
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          COLLECTOR_RUN: ${{ github.run_id }}
          ARTIFACT_ID: ${{ needs.drift.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.drift.outputs.artifact_digest }}
        run: >-
          python -B scripts/prepare_hf_inventory_refresh.py
          --source "$SOURCE_SHA" --run-id "$COLLECTOR_RUN"
          --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"
          --output "$RUNNER_TEMP/hf-inventory-source-review.json"
      # A designed stop otherwise shows only "exit code 1". Report fields are
      # printed from Python, never expanded by the shell; the failed prepare
      # step still fails the job.
      - name: Annotate a stopped review-branch preparation
        if: failure() && steps.prepare.outcome == 'failure'
        run: python -I -B scripts/format_inventory_stop_annotation.py "$RUNNER_TEMP/hf-inventory-source-review.json"
      - name: Retain source proposal or stopping evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hf-inventory-source-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hf-inventory-source-review.json
          if-no-files-found: error
          retention-days: 90
