name: Reconcile HF manifest recovery with current protected main

on:
  push:
    branches:
      - fix/hf-manifest-rate-limit-20260904
    paths:
      - .github/workflows/_reconcile_hf_manifest_matrix_branch.yml

permissions:
  contents: write

concurrency:
  group: reconcile-hf-manifest-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Merge current main and regenerate the derived stage matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-manifest-rate-limit-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile protected main without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge --no-edit --no-ff origin/main

      - name: Regenerate and verify the derived evidence matrix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_ecosystem_stage_matrix.py
          python scripts/build_ecosystem_stage_matrix.py --check
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('docs/huggingface-ecosystem-manifest.json').read_text(encoding='utf-8'))
          matrix = json.loads(Path('docs/ecosystem-stage-matrix.json').read_text(encoding='utf-8'))
          expected = {'models': 44, 'datasets': 33, 'spaces': 15}
          assert manifest['counts'] == expected
          assert matrix['machineGeneratedCounts']['huggingFacePublic'] == expected
          assert matrix['observedAt'] == manifest['observedAt']
          PY
          git diff --check
          test "$(git status --porcelain | wc -l | tr -d ' ')" = '1'
          test "$(git status --porcelain -- docs/ecosystem-stage-matrix.json | wc -l | tr -d ' ')" = '1'

      - name: Commit and push the exact derived matrix
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/ecosystem-stage-matrix.json
          git commit -s -m 'fix(hf): refresh derived matrix for 33 public datasets'
          git push origin HEAD:fix/hf-manifest-rate-limit-20260904
