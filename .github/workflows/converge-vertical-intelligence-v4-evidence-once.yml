name: Converge vertical intelligence v4 evidence once

on:
  push:
    branches:
      - fix/converge-v4-source-and-retire-bootstraps-v1
    paths:
      - .github/workflows/converge-vertical-intelligence-v4-evidence-once.yml

permissions:
  contents: write

concurrency:
  group: converge-vertical-intelligence-v4-evidence-once
  cancel-in-progress: false

jobs:
  converge:
    name: Repin v4 evidence and retire v2 bootstraps
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/converge-v4-source-and-retire-bootstraps-v1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply fail-closed v4 evidence convergence
        run: python tools/converge_vertical_intelligence_v4_evidence.py

      - name: Prove architecture, publisher, and truth contracts
        run: |
          set -euo pipefail
          python -m json.tool docs/strategy/living-command-fabric.v1.json >/dev/null
          python -m unittest tests.test_living_command_fabric_frontdoor -v
          python - <<'PY'
          import inspect
          from tests import test_hf_publish_vertical_flagships_v4 as contract

          executed = 0
          for name in sorted(dir(contract)):
              if not name.startswith("test_"):
                  continue
              function = getattr(contract, name)
              if not callable(function) or inspect.signature(function).parameters:
                  continue
              function()
              executed += 1
          if executed < 8:
              raise SystemExit(f"too few v4 publisher contract tests executed: {executed}")
          print(f"v4 publisher contract functions passed: {executed}")
          PY
          python -m py_compile \
            tools/converge_vertical_intelligence_v4_evidence.py \
            tests/test_living_command_fabric_frontdoor.py \
            scripts/hf_publish_vertical_services_intelligence_v4.py
          git diff --check

      - name: Remove completed one-shot machinery and commit durable evidence
        env:
          BRANCH: fix/converge-v4-source-and-retire-bootstraps-v1
        run: |
          set -euo pipefail
          git rm tools/converge_vertical_intelligence_v4_evidence.py
          git rm .github/workflows/converge-vertical-intelligence-v4-evidence-once.yml
          git rm .github/workflows/zz-materialize-vertical-real-data-bindings-v2-once.yml
          git rm .github/workflows/zz-execute-vertical-real-data-materializer-once.yml
          git rm .github/workflows/zz-verify-clean-vertical-bindings-once.yml
          git add \
            docs/strategy/living-command-fabric.v1.json \
            tests/test_living_command_fabric_frontdoor.py
          git diff --check
          git config user.name "SZL Vertical Evidence Controller"
          git config user.email "stephenlutar2@gmail.com"
          git commit -m "fix(verticals): converge v4 source evidence and retire bootstraps" \
            -m "Repin the Living Command Fabric and every public body to vertical-services 2.2 at 83edba5, bind the intelligence-v4 publisher and authority contract, and remove three completed v2 one-shot workflows that emitted a zero-job protected-main failure." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin "HEAD:${BRANCH}"
