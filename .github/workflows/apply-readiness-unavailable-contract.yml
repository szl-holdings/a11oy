# SPDX-License-Identifier: Apache-2.0
name: Apply honest unavailable readiness contract

on:
  push:
    branches:
      - fix/readiness-unavailable-contract-20260901

permissions:
  contents: write

concurrency:
  group: apply-readiness-unavailable-contract-20260901
  cancel-in-progress: false

jobs:
  repair:
    name: Apply, regenerate, verify, and commit readiness repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/readiness-unavailable-contract-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact protected base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/readiness-unavailable-contract-20260901"
          test "$(git rev-parse origin/main)" = "267413fe7dc4e44edb3099ef849ffae2eec7c389"

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check "pytest==8.3.5"

      - name: Apply deterministic contract edits
        run: python .github/scripts/apply_readiness_unavailable_contract.py

      - name: Regenerate the authoritative tab matrix
        run: |
          python tools/readiness-harness/gen_tabs_matrix.py
          python tools/readiness-harness/gen_tabs_matrix.py --check

      - name: Verify schema, freshness, citation, and vertical regressions
        run: |
          python -m py_compile tools/readiness-harness/gen_tabs_matrix.py
          node --test tools/readiness-harness/probe_runner.test.mjs
          python -m pytest -q tests/test_readiness_deep_vertical_contract.py
          python -m pytest -q tests/test_readiness_blocker_repairs.py
          git diff --check

      - name: Commit only the reviewed permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stephen P. Lutar"
          git config user.email "stephenlutar2@gmail.com"
          git add tools/readiness-harness/gen_tabs_matrix.py
          git add tools/readiness-harness/tabs.json
          git add tools/readiness-harness/stress/stress-targets.json
          git add tools/readiness-harness/probe_runner.mjs
          git add tools/readiness-harness/probe_runner.test.mjs
          git add tests/test_readiness_deep_vertical_contract.py
          git rm .github/scripts/apply_readiness_unavailable_contract.py
          git rm .github/workflows/apply-readiness-unavailable-contract.yml
          git diff --cached --check
          git commit -s -m "fix(readiness): admit explicit unavailable legal evidence"
          git push origin HEAD:fix/readiness-unavailable-contract-20260901
