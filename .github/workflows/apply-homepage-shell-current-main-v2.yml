name: Apply homepage shell current-main successor v2

"on":
  push:
    branches:
      - fix/homepage-shell-current-main-v2-20260905
    paths:
      - .github/workflows/apply-homepage-shell-current-main-v2.yml
      - .github/scripts/apply_homepage_shell_successor_v2.py

permissions:
  contents: write

concurrency:
  group: apply-homepage-shell-current-main-v2
  cancel-in-progress: false

jobs:
  materialize:
    name: Rebase and prove the reviewed homepage shell
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact successor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/homepage-shell-current-main-v2-20260905
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Materialize reviewed shell and legacy-gate successor
        run: python .github/scripts/apply_homepage_shell_successor_v2.py

      - name: Prove source, truth, accessibility, and idempotence contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/apply_homepage_shell_successor_v2.py \
            scripts/repair_a11oy_frontdoor.py
          python scripts/check_a11oy_frontdoor_truth.py a11oy_landing.html
          python scripts/repair_a11oy_frontdoor.py a11oy_landing.html --check
          python -m unittest -v \
            tests.test_homepage_shell_coherence \
            tests.test_landing_flagship_catalog \
            tests.test_landing_touch_targets \
            tests.test_living_command_fabric_frontdoor
          python tests/test_integrations_flow_boundary.py -v
          python tests/test_frontend_flow_shell.py -v
          python tests/test_frontend_source_boundaries.py -v
          node --check console/assets/szl-flow.js
          node --check console/assets/szl-holo-v2.js
          git diff --check

      - name: Commit only the durable eight-file successor
        env:
          BRANCH: fix/homepage-shell-current-main-v2-20260905
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/apply-homepage-shell-current-main-v2.yml \
            .github/scripts/apply_homepage_shell_successor_v2.py
          git add \
            a11oy_landing.html \
            console/assets/szl-flow.js \
            console/assets/szl-holo-v2.js \
            scripts/repair_a11oy_frontdoor.py \
            tests/test_homepage_shell_coherence.py \
            tests/test_landing_flagship_catalog.py \
            tests/test_landing_touch_targets.py \
            tests/test_living_command_fabric_frontdoor.py

          git config user.name "SZL Frontier Operator"
          git config user.email "stephenlutar2@gmail.com"
          git commit \
            -m "fix(homepage): rebase the reviewed responsive shell" \
            -m "Preserve one homepage-owned navigation shell, accessible responsive behavior, explicit receipt truth states, and guarded shared enhancers while extending the legacy repair controller with an exact fail-closed successor contract." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"

          printf '%s\n' \
            a11oy_landing.html \
            console/assets/szl-flow.js \
            console/assets/szl-holo-v2.js \
            scripts/repair_a11oy_frontdoor.py \
            tests/test_homepage_shell_coherence.py \
            tests/test_landing_flagship_catalog.py \
            tests/test_landing_touch_targets.py \
            tests/test_living_command_fabric_frontdoor.py \
            | sort > /tmp/expected-final-files
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-final-files
          diff -u /tmp/expected-final-files /tmp/actual-final-files
          git diff --check origin/main...HEAD
          git push origin "HEAD:${BRANCH}"
