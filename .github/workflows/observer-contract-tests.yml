name: Observer offline import contract

"on":
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  observer-contract:
    name: Observer kernel, import, CLI and report regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install hash-pinned test dependencies
        run: python -m pip install --require-hashes --no-deps --no-cache-dir -r .github/requirements/ci-core.txt
      - name: Test the offline Observer surface
        run: python -m pytest -p no:cacheprovider tests/test_szl_observer_kernel.py tests/test_szl_observer_contract.py -q --tb=short
