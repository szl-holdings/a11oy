name: Materialize Flow Shell reconciliation once

on:
  push:
    branches:
      - fix/flow-shell-reconcile-20260904
    paths:
      - .github/workflows/materialize-flow-shell-reconcile-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-flow-shell-reconcile-once
  cancel-in-progress: false

env:
  EXPECTED_BASE: 8086f5a0a443144039659870fdfacb739fc4ad8c

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact protected-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD

      - name: Reconcile every current source-owned HTML candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rollout_frontend_flow_shell.py \
            --report evidence/frontend-flow-shell-reconcile.json
          python3 scripts/rollout_frontend_flow_shell.py --check

      - name: Prove the complete frontend contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/rollout_frontend_flow_shell.py \
            tests/test_frontend_flow_shell.py \
            tests/test_cloudflare_product_edge.py
          python3 tests/test_frontend_flow_shell.py -v
          python3 tests/test_cloudflare_product_edge.py -v
          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(
              Path("docs/frontend-flow-shell-state.json").read_text(encoding="utf-8")
          )
          required = {
              "pages/constellation.html",
              "pages/operator-pane.html",
          }
          bound = set(state.get("injected_documents", []))
          missing = sorted(required - bound)
          if missing:
              raise SystemExit(f"current command/constellation documents not bound: {missing}")
          for rel in sorted(required):
              text = Path(rel).read_text(encoding="utf-8")
              if text.count('data-szl-flow-asset="style"') != 1:
                  raise SystemExit(f"style binding mismatch: {rel}")
              if text.count('data-szl-flow-asset="script"') != 1:
                  raise SystemExit(f"script binding mismatch: {rel}")
          PY
          git diff --check

      - name: Remove one-use materializer and commit durable bindings
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-flow-shell-reconcile-once.yml
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git commit -m "fix(frontend): reconcile the Flow Shell rollout ledger" -m "Reapply the canonical local Flow Shell to every current source-owned HTML candidate, including Constellation and the protected Command operator pane, then regenerate the deterministic rollout state." -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:fix/flow-shell-reconcile-20260904
