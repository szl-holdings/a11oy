name: Hugging Face snapshot backup and restoration

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hf-backup-restore.yml'
      - 'scripts/verify_hf_snapshot_restore.py'
      - 'tests/test_hf_snapshot_restore.py'
      - 'tests/test_hf_pr_lifecycle_controls.py'

permissions:
  contents: read

concurrency:
  group: hf-backup-restore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr-contract:
    name: PR-safe snapshot contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install exact local test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest==9.0.2"
          "huggingface_hub==1.29.0"
          "tqdm==4.69.0"
      - name: Prove archive, restore, empty-Space, and workflow contracts
        run: |
          python -m py_compile scripts/verify_hf_snapshot_restore.py tests/test_hf_snapshot_restore.py
          python -m pytest -q tests/test_hf_snapshot_restore.py tests/test_hf_pr_lifecycle_controls.py

  snapshot-backup:
    name: Exact snapshots restore byte-for-byte
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install exact Hugging Face client and progress runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.29.0"
          "tqdm==4.69.0"
      - name: Require the managed Hugging Face identity
        run: test -n "${HF_TOKEN:-}"
      - name: Snapshot and restore both live Spaces
        run: python scripts/verify_hf_snapshot_restore.py
      - name: Upload backup artifacts and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-space-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .hf-backup/archives/*.tar.gz
            .hf-backup/evidence/hf-backup-restoration.json
          if-no-files-found: error
          retention-days: 90
