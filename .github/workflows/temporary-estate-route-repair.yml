name: temporary-estate-route-repair

on:
  push:
    branches:
      - fix/console-command-bar-restore-20260830

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[estate-route-repaired]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/console-command-bar-restore-20260830
          fetch-depth: 0

      - name: Replace the removed pages-directory symbol with the canonical resolver
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("serve.py")
          text = path.read_text(encoding="utf-8")
          old = '''async def _series_a_estate_page() -> Response:
              for folder in (_LOCAL_PAGES_DIR, PAGES_DIR, _IMAGE_PAGES_DIR):
                  f = folder / "estate.html"
                  if f.is_file():
                      return FileResponse(f, media_type="text/html")
              return FileResponse(INDEX_HTML, media_type="text/html")
          '''
          new = '''async def _series_a_estate_page() -> Response:
              f = _szl_doc("pages/estate.html")
              if f.is_file():
                  return FileResponse(f, media_type="text/html")
              return FileResponse(INDEX_HTML, media_type="text/html")
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one stale estate handler, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m py_compile serve.py
          git diff --check

      - name: Prove the estate route and critical route table
        shell: bash
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci-core.txt
          python -m pytest -q \
            tests/test_series_a_estate.py::test_estate_routes_serve_html_not_spa_stub \
            tests/test_demo_critical_routes.py \
            tests/test_identity_lock.py

      - name: Commit only the product repair and remove this one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          rm .github/workflows/temporary-estate-route-repair.yml
          git add serve.py .github/workflows/temporary-estate-route-repair.yml
          git commit \
            -m "fix(routes): resolve /estate through the canonical document loader [estate-route-repaired]" \
            -m "Replace the removed _LOCAL_PAGES_DIR reference with _szl_doc, preserving checkout-first and image fallback behavior." \
            -m "Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>"
          git push origin HEAD:refs/heads/fix/console-command-bar-restore-20260830
