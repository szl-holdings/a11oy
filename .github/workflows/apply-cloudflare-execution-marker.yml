name: Apply Cloudflare production execution marker

on:
  push:
    branches:
      - ops/cloudflare-production-execution-20260904
    paths:
      - .github/workflows/apply-cloudflare-execution-marker.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact execution branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/cloudflare-production-execution-20260904
          fetch-depth: 1

      - name: Add deterministic execution marker and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('.github/workflows/repair-cloudflare-product-edge-production.yml')
          text = target.read_text(encoding='utf-8')
          marker = '# Owner-authorized production execution: 2026-09-04\n'
          if marker not in text:
              text = marker + text
              target.write_text(text, encoding='utf-8', newline='\n')
          Path('.github/workflows/apply-cloudflare-execution-marker.yml').unlink()
          PY

      - name: Commit exact source-only trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'szl-cloudflare-operator[bot]'
          git config user.email 'szl-cloudflare-operator[bot]@users.noreply.github.com'
          git add .github/workflows/repair-cloudflare-product-edge-production.yml .github/workflows/apply-cloudflare-execution-marker.yml
          git diff --cached --check
          git commit -m 'chore(cloudflare): execute bounded production controller' -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:ops/cloudflare-production-execution-20260904
