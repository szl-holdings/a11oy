name: Alert relay worker

# GitOps for szl-alert-relay (ntfy.a11oy.net): test every change, deploy only the
# exact commit that reached main, fail unless the live relay reports that exact
# 40-character SHA, then prove one real delivery. Owner prerequisites (secrets,
# token scopes, the production environment, the WAF skip rule) are in
# ops/alert-relay-worker/README.md.

on:
  pull_request:
    paths:
      - '.github/workflows/alert-relay-worker.yml'
      - 'ops/alert-relay-worker/**'
      - 'scripts/alert_channel_canary.py'
      - 'scripts/managed_alert_endpoint.py'
      - 'scripts/managed_alert_env.sh'
      - 'scripts/verify_worker_revision.py'
      - 'tests/test_alert_channel_canary.py'
      - 'tests/test_alert_channel_static_registry_contract.py'
      - 'tests/test_managed_alert_endpoint.py'
      - 'tests/test_managed_alert_transport_workflows.py'
      - 'tests/test_verify_worker_revision.py'
      - 'tests/test_workers_compute_observability.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alert-relay-worker.yml'
      - 'ops/alert-relay-worker/**'
      - 'scripts/alert_channel_canary.py'
      - 'scripts/managed_alert_endpoint.py'
      - 'scripts/managed_alert_env.sh'
      - 'scripts/verify_worker_revision.py'
      - 'tests/test_alert_channel_canary.py'
      - 'tests/test_alert_channel_static_registry_contract.py'
      - 'tests/test_managed_alert_endpoint.py'
      - 'tests/test_managed_alert_transport_workflows.py'
      - 'tests/test_verify_worker_revision.py'
      - 'tests/test_workers_compute_observability.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alert-relay-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test fail-closed relay and migration contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: false
          cache: npm
          cache-dependency-path: ops/alert-relay-worker/package-lock.json
      - name: Install the locked Wrangler
        working-directory: ops/alert-relay-worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install exact core test dependencies
        run: pip install --require-hashes -r .github/requirements/ci-core.txt
      - name: Exercise relay and workflow contracts
        run: |
          node --test ops/alert-relay-worker/test/index.test.mjs
          pytest \
            tests/test_alert_channel_canary.py \
            tests/test_alert_channel_static_registry_contract.py \
            tests/test_managed_alert_endpoint.py \
            tests/test_managed_alert_transport_workflows.py \
            tests/test_verify_worker_revision.py \
            tests/test_workers_compute_observability.py \
            -q
      - name: Bundle the exact upload without deploying
        working-directory: ops/alert-relay-worker
        run: npm run build

  deploy:
    name: Deploy exact relay, read back its revision, prove one real delivery
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency:
      group: deploy-szl-alert-relay
      cancel-in-progress: false
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prove exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: false
      - name: Install the locked Wrangler
        id: wrangler
        working-directory: ops/alert-relay-worker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          locked_version="$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")"
          test "$(node -p "require('./node_modules/wrangler/package.json').version")" = "$locked_version"
          printf 'version=%s\n' "$locked_version" >> "$GITHUB_OUTPUT"
      - name: Resolve Cloudflare deployment account
        id: cloudflare-account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::production needs CLOUDFLARE_API_TOKEN (see ops/alert-relay-worker/README.md)." >&2
            exit 1
          fi

          account_id="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -n "$account_id" ]; then
            if [[ ! "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
              echo "::error::CLOUDFLARE_ACCOUNT_ID must be exactly 32 hexadecimal characters." >&2
              exit 1
            fi
          else
            response_file="$(mktemp)"
            trap 'rm -f "$response_file"' EXIT
            if ! curl --fail --silent --show-error --retry 2 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Accept: application/json" \
              "https://api.cloudflare.com/client/v4/accounts" \
              --output "$response_file"; then
              echo "::error::Cloudflare account discovery request failed." >&2
              exit 1
            fi
            account_id="$(python - "$response_file" <<'PY'
          import json
          import re
          import sys

          try:
              payload = json.loads(open(sys.argv[1], encoding="utf-8").read())
          except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"invalid Cloudflare account discovery response: {exc}")

          if payload.get("success") is not True:
              raise SystemExit("Cloudflare account discovery response was not successful")

          accounts = payload.get("result")
          if not isinstance(accounts, list) or len(accounts) != 1:
              raise SystemExit("Cloudflare account discovery must return exactly one account")

          account = accounts[0]
          account_id = account.get("id") if isinstance(account, dict) else None
          if not isinstance(account_id, str) or re.fullmatch(r"[0-9a-fA-F]{32}", account_id) is None:
              raise SystemExit("Cloudflare account discovery returned a malformed account id")

          print(account_id)
          PY
          )"
          fi

          if [[ ! "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::resolved Cloudflare account id is malformed." >&2
            exit 1
          fi
          echo "::add-mask::$account_id"
          printf 'account_id=%s\n' "$account_id" >> "$GITHUB_OUTPUT"
      - name: Deploy the exact source-controlled Worker and custom domain
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        env:
          SOURCE_REVISION: ${{ github.sha }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare-account.outputs.account_id }}
          workingDirectory: ops/alert-relay-worker
          packageManager: npm
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          command: deploy --config wrangler.jsonc --message ${{ github.sha }}
          vars: |
            SOURCE_REVISION
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Read back the live revision from ntfy.a11oy.net
        shell: bash
        run: >-
          python scripts/verify_worker_revision.py
          --url https://ntfy.a11oy.net/.well-known/szl-worker-revision
          --worker szl-alert-relay
          --expect-revision "${GITHUB_SHA}"
      - name: Prove one bounded real delivery through the deployed relay
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ALERT_CHANNEL_MODE: ntfy
        shell: bash
        run: |
          source scripts/managed_alert_env.sh &&
          mkdir -p evidence &&
          python scripts/alert_channel_canary.py \
            --output evidence/alert-channel-post-deploy.json \
            --mode ntfy \
            --timeout 30 \
            --send
      - name: Upload secret-free delivery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alert-relay-post-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/alert-channel-post-deploy.json
          if-no-files-found: warn
          retention-days: 90
