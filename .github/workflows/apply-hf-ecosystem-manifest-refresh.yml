# SPDX-License-Identifier: Apache-2.0
name: Apply HF ecosystem manifest refresh

on:
  push:
    branches:
      - fix/hf-ecosystem-manifest-refresh-20260901

permissions:
  contents: write

concurrency:
  group: apply-hf-ecosystem-manifest-refresh-20260901
  cancel-in-progress: false

jobs:
  refresh:
    name: Generate, verify, and commit current public manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/hf-ecosystem-manifest-refresh-20260901
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify collector contracts
        run: |
          set -euo pipefail
          python3 scripts/test_audit_huggingface_ecosystem.py
          python3 -m py_compile scripts/audit_huggingface_ecosystem.py

      - name: Generate exact current public inventory
        run: |
          set -euo pipefail
          python3 scripts/audit_huggingface_ecosystem.py \
            --output docs/huggingface-ecosystem-manifest.json
          python3 scripts/audit_huggingface_ecosystem.py \
            --check \
            --output docs/huggingface-ecosystem-manifest.json

      - name: Commit only the permanent generated manifest
        env:
          BRANCH: fix/hf-ecosystem-manifest-refresh-20260901
        run: |
          set -euo pipefail
          git config user.name 'SZL Holdings Automation'
          git config user.email 'eng@szlholdings.com'
          git add docs/huggingface-ecosystem-manifest.json
          git rm .github/workflows/apply-hf-ecosystem-manifest-refresh.yml
          git diff --cached --check
          git commit -s -m 'fix(hf): refresh public ecosystem manifest'
          git push origin "HEAD:${BRANCH}"
