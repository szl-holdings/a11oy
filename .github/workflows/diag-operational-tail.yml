name: Grype Root Cause — Bounded Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diag-operational-tail.yml

permissions:
  contents: read

concurrency:
  group: diag-grype-root-cause-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Capture exact HIGH/CRITICAL Grype matches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify the production gate contract first
        run: python3 tests/test_grype_gate_contract.py

      - name: Scan without suppressing evidence
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          path: .
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: reports/grype/grype.json
          cache-db: true

      - name: Render bounded redacted finding summary
        id: summarize
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          source = Path('reports/grype/grype.json')
          payload = json.loads(source.read_text(encoding='utf-8'))
          findings = []
          for match in payload.get('matches', []):
              vulnerability = match.get('vulnerability') or {}
              severity = str(vulnerability.get('severity') or '').upper()
              if severity not in {'HIGH', 'CRITICAL'}:
                  continue
              artifact = match.get('artifact') or {}
              fix = vulnerability.get('fix') or {}
              locations = []
              for location in artifact.get('locations') or []:
                  path = location.get('path') if isinstance(location, dict) else None
                  if isinstance(path, str) and path:
                      locations.append(path)
              findings.append({
                  'id': vulnerability.get('id'),
                  'severity': severity,
                  'package': artifact.get('name'),
                  'version': artifact.get('version'),
                  'type': artifact.get('type'),
                  'fix_versions': sorted(str(value) for value in (fix.get('versions') or [])),
                  'fix_state': fix.get('state'),
                  'locations': sorted(set(locations)),
              })
          findings.sort(key=lambda item: (
              item['severity'],
              str(item['id']),
              str(item['package']),
              str(item['version']),
          ))
          summary = {
              'schema': 'szl.a11oy-grype-root-cause/v1',
              'source_revision': os.environ['GITHUB_SHA'],
              'high_or_critical_count': len(findings),
              'findings': findings,
              'secret_material_recorded': False,
          }
          output = Path('reports/grype/summary.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"count={len(findings)}\n")

      - name: Upload immutable scanner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-root-cause-${{ github.run_id }}
          path: reports/grype
          if-no-files-found: error
          retention-days: 14

      - name: Preserve the production gate result
        env:
          FINDING_COUNT: ${{ steps.summarize.outputs.count }}
        run: |
          set -euo pipefail
          count="${FINDING_COUNT:-1}"
          if [ "$count" -ne 0 ]; then
            echo "::error::$count HIGH/CRITICAL Grype finding(s) remain."
            exit 1
          fi
          echo 'No HIGH/CRITICAL Grype findings remain.'
