name: Gate final P0 release candidate

on:
  push:
    branches:
      - codex/p0-a11oy-work-20260811
    paths:
      - ".github/workflows/p0-final-pr-gate.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: p0-final-pr-gate
  cancel-in-progress: false

jobs:
  gate-final:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_BRANCH: codex/p0-a11oy-work-20260811
      FINAL_BRANCH: codex/p0-a11oy-final-20260817
      MIN_CHECKS: "25"
    steps:
      - name: Checkout source lane for one-shot retirement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/p0-a11oy-work-20260811
          fetch-depth: 0

      - name: Wait for final PR and a stable terminal exact-head check set
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          final_pr=''
          for _ in $(seq 1 60); do
            final_pr=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base main \
              --head "$FINAL_BRANCH" \
              --json number \
              --jq '.[0].number // empty')
            if [ -n "$final_pr" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$final_pr" ]; then
            echo "Final PR for $FINAL_BRANCH did not appear within the bounded wait." >&2
            exit 1
          fi

          stage_sha=''
          previous=''
          stable=0
          verdict='TIMEOUT'
          total=0
          snapshot='{}'
          for _ in $(seq 1 150); do
            observed_sha=$(gh pr view "$final_pr" \
              --repo "$GITHUB_REPOSITORY" \
              --json headRefOid \
              --jq .headRefOid)
            if [ "$observed_sha" != "$stage_sha" ]; then
              stage_sha="$observed_sha"
              previous=''
              stable=0
            fi

            snapshot=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$stage_sha/check-runs?per_page=100")
            total=$(jq '.check_runs | length' <<<"$snapshot")
            pending=$(jq '[.check_runs[] | select(.status != "completed")] | length' <<<"$snapshot")
            failed=$(jq '[.check_runs[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length' <<<"$snapshot")
            fingerprint=$(jq -c '[.check_runs[] | {name,status,conclusion}] | sort_by(.name)' <<<"$snapshot")

            if [ "$total" -ge "$MIN_CHECKS" ] && [ "$pending" -eq 0 ]; then
              if [ "$fingerprint" = "$previous" ]; then
                stable=$((stable + 1))
              else
                stable=1
              fi
              if [ "$stable" -ge 3 ]; then
                if [ "$failed" -eq 0 ]; then
                  verdict='PASS'
                else
                  verdict='FAIL'
                fi
                break
              fi
            else
              stable=0
            fi
            previous="$fingerprint"
            sleep 10
          done

          report=$(jq -r '[.check_runs[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")) | "- " + .name + ": " + .status + "/" + (.conclusion // "pending") + " — " + .details_url] | join("\n")' <<<"$snapshot")
          if [ -z "$report" ]; then
            report='- no pending or failing checks observed'
          fi
          printf '## Final exact-head release gate\n\n- PR: #%s\n- Exact head: %s\n- Check runs: %s\n- Verdict: %s\n\n%s\n' \
            "$final_pr" "$stage_sha" "$total" "$verdict" "$report" \
            > /tmp/p0-final-gate.md
          gh pr comment "$final_pr" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/p0-final-gate.md

          {
            echo "final_pr=$final_pr"
            echo "stage_sha=$stage_sha"
            echo "verdict=$verdict"
          } >> "$GITHUB_OUTPUT"
          test "$verdict" = 'PASS'

      - name: Mark the exact final head ready and request independent Codex review
        if: steps.gate.outputs.verdict == 'PASS'
        shell: bash
        run: |
          set -euo pipefail
          current_sha=$(gh pr view "${{ steps.gate.outputs.final_pr }}" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefOid \
            --jq .headRefOid)
          test "$current_sha" = "${{ steps.gate.outputs.stage_sha }}"
          draft=$(gh pr view "${{ steps.gate.outputs.final_pr }}" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft)
          if [ "$draft" = 'true' ]; then
            gh pr ready "${{ steps.gate.outputs.final_pr }}" --repo "$GITHUB_REPOSITORY"
          fi
          gh pr comment "${{ steps.gate.outputs.final_pr }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body "@codex review the exact head $current_sha. Focus on P0/P1 security, RLS/worker authority, idempotency, public route boundaries, supply-chain pins, rollback, and honest-status claims. Do not merge or deploy."

      - name: Close obsolete implementation lanes
        if: steps.gate.outputs.verdict == 'PASS'
        shell: bash
        run: |
          set -euo pipefail
          for number in 1261; do
            state=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || true)
            if [ "$state" = 'OPEN' ]; then
              gh pr close "$number" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "Superseded by exact-head final release candidate #${{ steps.gate.outputs.final_pr }} at ${{ steps.gate.outputs.stage_sha }}. Final protected merge and deployment remain separately governed."
            fi
          done

      - name: Retire this one-shot gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_BRANCH"
          git switch --detach "origin/$SOURCE_BRANCH"
          git switch -c p0-final-pr-gate-retirement
          if test -f .github/workflows/p0-final-pr-gate.yml; then
            git rm .github/workflows/p0-final-pr-gate.yml
            git config user.name "Stephen Lutar"
            git config user.email "stephenlutar2@gmail.com"
            git commit -m "chore(p0): retire final release gate" \
              -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
            git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          fi
