name: temporary-build-lexicon-successor

on:
  push:
    branches:
      - fix/lexicon-category-current-main-20260830-v2
    paths:
      - .github/workflows/temporary-build-lexicon-successor.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/lexicon-category-current-main-20260830-v2
          fetch-depth: 0
          persist-credentials: true
      - name: Reproduce reviewed lexicon transformation and apply it to current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git fetch origin main lexicon/category-gacm
          merge_base="$(git merge-base origin/main origin/lexicon/category-gacm)"
          git show "${merge_base}:a11oy_landing.html" > /tmp/lexicon-base.html
          git show "origin/lexicon/category-gacm:a11oy_landing.html" > /tmp/lexicon-target.html
          git reset --hard origin/main
          python - <<'PY'
          import pathlib
          import re

          base = pathlib.Path('/tmp/lexicon-base.html').read_text(encoding='utf-8')
          target = pathlib.Path('/tmp/lexicon-target.html').read_text(encoding='utf-8')
          current_path = pathlib.Path('a11oy_landing.html')
          current = current_path.read_text(encoding='utf-8')

          def title_of(text: str) -> str:
              match = re.search(r'<title>(.*?)</title>', text, re.S)
              if not match:
                  raise SystemExit('reviewed target has no title')
              return match.group(1)

          def og_title_of(text: str) -> str:
              match = re.search(r'<meta\s+property="og:title"\s+content="([^"]*)"\s*/?>', text)
              if not match:
                  raise SystemExit('reviewed target has no og:title')
              return match.group(1)

          target_title = title_of(target)
          target_og = og_title_of(target)

          def transform(text: str) -> str:
              text = text.replace('Governed Inference', 'governed agent change management')
              text, n_title = re.subn(
                  r'<title>.*?</title>',
                  f'<title>{target_title}</title>',
                  text,
                  count=1,
                  flags=re.S,
              )
              text, n_og = re.subn(
                  r'(<meta\s+property="og:title"\s+content=")[^"]*("\s*/?>)',
                  rf'\g<1>{target_og}\g<2>',
                  text,
                  count=1,
              )
              if n_title != 1 or n_og != 1:
                  raise SystemExit('metadata transformation did not match exactly once')
              return text

          base_occurrences = base.count('Governed Inference')
          if base_occurrences != 9:
              raise SystemExit(f'reviewed base occurrence contract changed: {base_occurrences} != 9')
          if current.count('Governed Inference') != base_occurrences:
              raise SystemExit('current main no longer carries the same nine reviewed category occurrences')
          reproduced = transform(base)
          if reproduced != target:
              raise SystemExit('semantic transformation does not exactly reproduce the reviewed PR branch')
          updated = transform(current)
          if 'Governed Inference' in updated:
              raise SystemExit('retired category remains after transformation')
          if 'governed agent change management' not in updated:
              raise SystemExit('locked category was not installed')
          current_path.write_text(updated, encoding='utf-8')
          PY
          test ! -e .github/workflows/temporary-build-lexicon-successor.yml
          git add a11oy_landing.html
          git diff --cached --check
          python -m pip install --require-hashes -r .github/requirements/ci-core.txt
          python -m pytest -q \
            tests/test_identity_lock.py \
            tests/test_landing_audit_fixes.py \
            tests/test_holographic_command_bar.py
          python scripts/check_banned_tokens.py --root . --allowlist .doctrine-allowlist
          git commit -m "fix(lexicon): lock landing category to governed agent change management" -m "Signed-off-by: Stephen P. Lutar <stephenlutar2@gmail.com>"
          git push --force-with-lease origin HEAD:fix/lexicon-category-current-main-20260830-v2
