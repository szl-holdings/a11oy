name: temporary-main-refresh

on:
  push:
    branches:
      - agent/llm-registry-entrypoint-wire-20260830
    paths:
      - .github/workflows/temporary-main-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/llm-registry-entrypoint-wire-20260830
          fetch-depth: 0
          persist-credentials: true
      - name: Integrate current protected main without masking conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::branch has a real conflict with current protected main"
            git diff --name-status --diff-filter=U || true
            git merge --abort
            rm .github/workflows/temporary-main-refresh.yml
            git add -A
            git commit -m "ci: remove failed one-shot main refresh" -m "Signed-off-by: Stephen P. Lutar <stephenlutar2@gmail.com>"
            git push origin HEAD:agent/llm-registry-entrypoint-wire-20260830
            exit 1
          fi
          git diff --check
          python -m py_compile serve.py szl_llm_registry.py
          rm .github/workflows/temporary-main-refresh.yml
          git add -A
          git commit -m "chore(branch): integrate current protected main" -m "Signed-off-by: Stephen P. Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:agent/llm-registry-entrypoint-wire-20260830
