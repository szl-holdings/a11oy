#
# Offline contract for atelier-hub-publish.yml: it may not write a Hub repo that
# a converged kernel repo's own hf-kernel-publish.yml owns, and no other a11oy
# workflow may start writing one. No paths filter, because a new writer can be
# added in any workflow or in any script a workflow runs. Stdlib only, no token.
name: Atelier Hub publish contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: atelier-hub-publish-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Atelier targets exclude converged kernel repos
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Prove atelier and estate kernel-writer contract
        run: python3 tests/test_atelier_hub_publish_contract.py
