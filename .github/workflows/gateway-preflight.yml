name: Gateway preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'box-scripts/gateway_preflight.py'
      - 'box-scripts/test_gateway_preflight.py'
      - 'box-scripts/gateway-preflight-requirements.txt'
      - 'box-scripts/GATEWAY_PREFLIGHT.md'
      - '.github/workflows/gateway-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'box-scripts/gateway_preflight.py'
      - 'box-scripts/test_gateway_preflight.py'
      - 'box-scripts/gateway-preflight-requirements.txt'
      - 'box-scripts/GATEWAY_PREFLIGHT.md'
      - '.github/workflows/gateway-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: Gateway contract (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            box-scripts
            .github/workflows
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-pinned parser
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-deps
          -r box-scripts/gateway-preflight-requirements.txt
      - name: Compile
        run: python -m py_compile box-scripts/gateway_preflight.py box-scripts/test_gateway_preflight.py
      - name: Test with synthetic fixtures and loopback servers
        run: python -m unittest discover -s box-scripts -p test_gateway_preflight.py -v
