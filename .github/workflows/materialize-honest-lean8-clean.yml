name: Materialize clean Lean-8 honesty successor

on:
  push:
    branches:
      - ops/materialize-honest-lean8-20260829
    paths:
      - .github/workflows/materialize-honest-lean8-clean.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: materialize-honest-lean8-clean
  cancel-in-progress: false

env:
  SOURCE_SHA: a9b2f2970c20b7e87639db19684548ff518f1d36
  TARGET_BRANCH: fix/honest-lean8-bind-clean-20260829
  TARGET_BASE: 5f5610edb6ed43e792d756470bc2d0eba049e0ff

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout exact target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact target identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_BASE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$TARGET_BASE"

      - name: Recover reviewed final bytes
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            a11oy_landing.html \
            console/static/viz/router/app.js \
            pages/console.html; do
            mkdir -p "$(dirname "$path")"
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${SOURCE_SHA}" > "$path"
          done
          grep -Fq 'modeled load · not QPS' console/static/viz/router/app.js
          grep -Fq 'locked_formula_count' a11oy_landing.html
          grep -Fq 'locked_formula_count' pages/console.html

      - name: Run scoped source tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r .github/requirements/ci-core.txt >/dev/null
          python -m pytest \
            tests/test_investor_smoke_bind.py \
            tests/test_router_constellation_contract.py \
            -q

      - name: Create one GitHub-verified DCO commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['TARGET_BRANCH']
          base_sha = os.environ['TARGET_BASE']
          token = os.environ['GH_TOKEN']
          paths = [
              'a11oy_landing.html',
              'console/static/viz/router/app.js',
              'pages/console.html',
          ]
          additions = []
          for rel in paths:
              additions.append({
                  'path': rel,
                  'contents': base64.b64encode(pathlib.Path(rel).read_bytes()).decode('ascii'),
              })
          mutation = '''
          mutation Materialize($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) { commit { oid url } }
          }
          '''
          variables = {
              'input': {
                  'branch': {
                      'repositoryNameWithOwner': repository,
                      'branchName': branch,
                  },
                  'expectedHeadOid': base_sha,
                  'message': {
                      'headline': 'fix(honesty): bind Lean-8 chips to the honest kernel count',
                      'body': (
                          'Apply the reviewed three-file final state on a clean exact-base branch. '
                          'The landing and console read locked_formula_count from /honest, while '
                          'the router labels modeled load as not QPS.\n\n'
                          'Supersedes the unsigned lineage in #1483. No deployment, Hub mutation, '
                          'protected-main write, force push, or evidence-class weakening.\n\n'
                          'Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>'
                      ),
                  },
                  'fileChanges': {'additions': additions},
              }
          }
          request = urllib.request.Request(
              'https://api.github.com/graphql',
              data=json.dumps({'query': mutation, 'variables': variables}).encode(),
              method='POST',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'szl-honest-lean8-materializer',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'GitHub GraphQL HTTP {exc.code}') from exc
          if result.get('errors'):
              raise SystemExit('; '.join(str(row.get('message')) for row in result['errors']))
          commit = result['data']['createCommitOnBranch']['commit']
          oid = str(commit['oid'])
          if len(oid) != 40:
              raise SystemExit('invalid commit OID')
          pathlib.Path('/tmp/result.json').write_text(json.dumps(commit), encoding='utf-8')
          PY
          commit_sha="$(jq -er '.oid' /tmp/result.json)"
          commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${commit_sha}")"
          jq -e '.commit.verification.verified == true' <<<"$commit_json" >/dev/null
          test "$(jq -er '.parents | length' <<<"$commit_json")" = '1'
          test "$(jq -er '.parents[0].sha' <<<"$commit_json")" = "$TARGET_BASE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$commit_sha"
          echo "- clean successor head: \`$commit_sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- source PR final state: \`$SOURCE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub signature: verified" >> "$GITHUB_STEP_SUMMARY"
