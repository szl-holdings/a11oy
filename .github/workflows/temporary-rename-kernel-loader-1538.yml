name: temporary-rename-kernel-loader-1538

# One-shot exact repair: preserve the tested public name without an unused alias.
on:
  push:
    branches:
      - fix/console-command-bar-restore-20260830
    paths:
      - .github/workflows/temporary-rename-kernel-loader-1538.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/console-command-bar-restore-20260830
          fetch-depth: 0
          persist-credentials: true
      - name: Rename the canonical loader to the tested public contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('a11oy_landing.html')
          text = path.read_text(encoding='utf-8')
          old = 'loadLockedKernel'
          new = 'loadKernelLocked'
          count = text.count(old)
          if count < 2 or count > 4:
              raise SystemExit(f'unexpected canonical loader occurrence count: {count}')
          if new in text:
              raise SystemExit('tested public loader name already exists unexpectedly')
          text = text.replace(old, new)
          if old in text or text.count(new) != count:
              raise SystemExit('loader rename did not complete exactly')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python3 - <<'PY'
          from pathlib import Path
          text = Path('a11oy_landing.html').read_text(encoding='utf-8')
          assert 'async function loadKernelLocked(){' in text
          assert 'loadKernelLocked();' in text
          PY
          rm .github/workflows/temporary-rename-kernel-loader-1538.yml
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add a11oy_landing.html .github/workflows/temporary-rename-kernel-loader-1538.yml
          git commit -m "fix(frontend): use canonical tested kernel loader name" -m "Signed-off-by: Stephen P. Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:fix/console-command-bar-restore-20260830
