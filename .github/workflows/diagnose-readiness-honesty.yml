name: Materialize readiness honesty relock

on:
  push:
    branches:
      - fix/readiness-honesty-relock-20260829
    paths:
      - .github/workflows/diagnose-readiness-honesty.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: materialize-readiness-honesty-relock
  cancel-in-progress: false

env:
  TARGET_BRANCH: fix/readiness-honesty-relock-v2-20260829
  TARGET_BASE: 96367c9aaadd2ed9bf2705381f497f65e9f0b6aa
  MATERIALIZER_SOURCE: d198ff2adb59130f9e7c8fae83041e39631c5b7d

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout exact clean target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable target identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_BASE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$TARGET_BASE"

      - name: Recover the reviewed materializer steps as inert workflow text
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/diagnose-readiness-honesty.yml?ref=${MATERIALIZER_SOURCE}" \
            > /tmp/materializer-source.yml
          python3 - <<'PY'
          from pathlib import Path

          text = Path('/tmp/materializer-source.yml').read_text(encoding='utf-8')
          names = [
              ('Apply bounded root-cause repair', '/tmp/apply.sh'),
              ('Generate and validate the exact contract', '/tmp/validate.sh'),
              ('Create one GitHub-native verified DCO commit', '/tmp/commit.sh'),
          ]
          for name, output in names:
              marker = f'      - name: {name}\n        shell: bash\n        run: |\n'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'missing reviewed step: {name}')
              start += len(marker)
              end = text.find('\n      - name: ', start)
              if end < 0:
                  end = len(text)
              block = text[start:end]
              lines = []
              for line in block.splitlines():
                  if line.startswith('          '):
                      lines.append(line[10:])
                  elif not line:
                      lines.append('')
                  else:
                      raise SystemExit(f'unexpected indentation in {name}: {line!r}')
              Path(output).write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          chmod 0500 /tmp/apply.sh /tmp/validate.sh /tmp/commit.sh

      - name: Apply, validate, and materialize the verified source commit
        shell: bash
        run: |
          set -euo pipefail
          /tmp/apply.sh
          /tmp/validate.sh
          /tmp/commit.sh
