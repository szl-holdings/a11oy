name: Auto-merge Cloudflare execution trigger

on:
  push:
    branches:
      - ops/cloudflare-production-execution-20260904
    paths:
      - .github/workflows/auto-merge-cloudflare-execution.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/cloudflare-production-execution-20260904
          fetch-depth: 1

      - name: Remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/auto-merge-cloudflare-execution.yml
          git config user.name 'szl-cloudflare-operator[bot]'
          git config user.email 'szl-cloudflare-operator[bot]@users.noreply.github.com'
          git add .github/workflows/auto-merge-cloudflare-execution.yml
          git commit -m 'chore(cloudflare): remove one-shot merge operator' -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:ops/cloudflare-production-execution-20260904

      - name: Enable protected squash auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head ops/cloudflare-production-execution-20260904 --state open --json number --jq '.[0].number')"
          test -n "$pr"
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash
