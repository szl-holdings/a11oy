name: Materialize reviewed HF deployer pin once v2

on:
  push:
    branches:
      - fix/pin-hf-remote-add-deployer-20260904
    paths:
      - .github/workflows/materialize-hf-deployer-pin-once-v2.yml

permissions:
  contents: write

concurrency:
  group: materialize-reviewed-hf-deployer-pin-once-v2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact pin branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/pin-hf-remote-add-deployer-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Replace only the six permanent reviewed pin references
        shell: bash
        env:
          OLD_PIN: e3ec47ad2e99a535839afe0f30fefbd8973d52da
          NEW_PIN: 03f1aa3110ee172ba6710317a53c7e276b4d103d
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          old = os.environ["OLD_PIN"]
          new = os.environ["NEW_PIN"]
          expected = {
              ".github/workflows/hf-sync.yml",
              "audit/workflow-action-pins.json",
              "tests/test_canonical_a11oy_relock.py",
              "tests/test_copy_sync_lockstep_source_derived.py",
              "tests/test_operational_route_contracts.py",
              "tools/check_copy_sync_lockstep.py",
          }
          transport_prefix = ".github/workflows/materialize-hf-deployer-pin-once"

          result = subprocess.run(
              ["git", "grep", "-l", old, "--"],
              check=False,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
          )
          if result.returncode not in (0, 1):
              raise SystemExit(result.stderr)
          observed = {line for line in result.stdout.splitlines() if line}
          permanent = {line for line in observed if not line.startswith(transport_prefix)}
          transport = observed - permanent
          if permanent != expected:
              raise SystemExit(
                  "reviewed permanent pin closure drifted: "
                  f"expected={sorted(expected)} observed={sorted(permanent)}"
              )
          if not transport:
              raise SystemExit("transport-only pin references were not observed")

          for relative in sorted(permanent):
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f"pin disappeared before replacement: {relative}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          remaining = subprocess.run(
              ["git", "grep", "-n", old, "--"],
              check=False,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
          )
          if remaining.returncode not in (0, 1):
              raise SystemExit(remaining.stderr)
          residual = [
              line
              for line in remaining.stdout.splitlines()
              if line and not line.startswith(transport_prefix)
          ]
          if residual:
              raise SystemExit("obsolete permanent deployer pin remains:\n" + "\n".join(residual))

          print(
              "permanent_pin_closure=6 "
              f"transport_references={len(transport)} "
              f"new_pin={new}"
          )
          PY

      - name: Prove pin, audit, relock, and source-derived deployment contracts
        shell: bash
        env:
          NEW_PIN: 03f1aa3110ee172ba6710317a53c7e276b4d103d
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.3.5"
          python -m py_compile \
            tools/check_copy_sync_lockstep.py \
            tests/test_canonical_a11oy_relock.py \
            tests/test_copy_sync_lockstep_source_derived.py \
            tests/test_operational_route_contracts.py
          python tools/check_copy_sync_lockstep.py
          python -m pytest -q \
            tests/test_canonical_a11oy_relock.py \
            tests/test_copy_sync_lockstep_source_derived.py \
            tests/test_operational_route_contracts.py
          python -m json.tool audit/workflow-action-pins.json >/dev/null
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          pin = os.environ["NEW_PIN"]
          old = "e3ec47ad2e99a535839afe0f30fefbd8973d52da"
          workflow = Path(".github/workflows/hf-sync.yml").read_text(encoding="utf-8")
          assert workflow.count(
              "uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@" + pin
          ) == 1
          audit = json.loads(Path("audit/workflow-action-pins.json").read_text(encoding="utf-8"))
          encoded = json.dumps(audit, sort_keys=True)
          assert pin in encoded
          assert old not in encoded
          for relative in (
              "tests/test_canonical_a11oy_relock.py",
              "tests/test_copy_sync_lockstep_source_derived.py",
              "tests/test_operational_route_contracts.py",
              "tools/check_copy_sync_lockstep.py",
          ):
              text = Path(relative).read_text(encoding="utf-8")
              assert pin in text, relative
              assert old not in text, relative
          PY
          git diff --check

      - name: Remove transport workflows and push clean head
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/materialize-hf-deployer-pin-once.yml \
            .github/workflows/materialize-hf-deployer-pin-once-v2.yml
          git add \
            .github/workflows/hf-sync.yml \
            audit/workflow-action-pins.json \
            tests/test_canonical_a11oy_relock.py \
            tests/test_copy_sync_lockstep_source_derived.py \
            tests/test_operational_route_contracts.py \
            tools/check_copy_sync_lockstep.py
          git diff --cached --check
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git commit -s -m "fix(hf): pin the remote ADD-aware reusable deployer" \
            -m "Bind the canonical A11oy publisher and its lockstep/audit tests to szl-holdings/.github@03f1aa3110ee172ba6710317a53c7e276b4d103d, the reviewed revision that treats checksum-pinned remote ADD inputs as Dockerfile-bound externals while keeping COPY strict."
          git push origin HEAD:fix/pin-hf-remote-add-deployer-20260904
