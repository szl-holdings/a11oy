name: Action-contract promotion guard

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read

jobs:
  immutable-validator:
    name: Immutable protected-base validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: protected-base
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch exact candidate manifest as untrusted data
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CANDIDATE_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          CANDIDATE_REPO: ${{ github.event.pull_request.head.repo.name }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require("fs");
            const response = await github.rest.repos.getContent({
              owner: process.env.CANDIDATE_OWNER,
              repo: process.env.CANDIDATE_REPO,
              path: "docs/action-contract-manifest.json",
              ref: process.env.CANDIDATE_SHA,
            });
            const candidate = response.data;
            if (
              Array.isArray(candidate) ||
              candidate.type !== "file" ||
              candidate.encoding !== "base64"
            ) {
              core.setFailed("candidate manifest must be a regular base64-encoded file");
              return;
            }
            const content = Buffer.from(
              candidate.content.replace(/\n/g, ""),
              "base64",
            );
            if (content.length > 1024 * 1024) {
              core.setFailed("candidate manifest exceeds the 1 MiB validation limit");
              return;
            }
            fs.writeFileSync(
              "protected-base/docs/action-contract-manifest.json",
              content,
              { flag: "w", mode: 0o600 },
            );

      - name: Validate candidate manifest with protected code
        shell: bash
        run: |
          set -euo pipefail
          cd protected-base
          python3 scripts/validate_action_contract_manifest.py
