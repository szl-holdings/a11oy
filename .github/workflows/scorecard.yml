name: OpenSSF Scorecard supply-chain security

on:
  branch_protection_rule:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 1 * * 6'  # Weekly Saturday 01:30 UTC

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF results
        uses: github/codeql-action/upload-sarif@6f530319d8c989665d0835536ec9571735fd2008 # v3.28.15
        with:
          sarif_file: results.sarif
