name: OpenSSF Scorecard supply-chain security

on:
  branch_protection_rule:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 1 * * 6'  # Weekly Saturday 01:30 UTC

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF results
        uses: github/codeql-action/upload-sarif@0db2f2b4a5f50ab62fcc3f9789381adcfae49fa3 # v3.28.15
        with:
          sarif_file: results.sarif
