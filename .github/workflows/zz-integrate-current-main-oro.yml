name: Integrate current protected main into ORO

on:
  push:
    branches:
      - feat/oro-operational-control-plane-v3-20260817

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: integrate-current-main-oro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'szl-holdings/a11oy' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact ORO branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Forward-integrate protected main and remove bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git merge --no-ff --no-commit origin/main
          git rm .github/workflows/zz-integrate-current-main-oro.yml
          git add -A
          git diff --cached --check
          git commit \
            -m 'merge(oro): integrate current protected main' \
            -m 'Forward-integrate the exact current protected main without rebasing or rewriting reviewed ORO history, and remove the bounded branch-local integrator from the final tree.' \
            -m 'Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>'
          git push origin "HEAD:${GITHUB_REF_NAME}"

          pr="$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
            --jq 'if length == 1 then .[0].number else error("expected exactly one ORO PR") end')"
          gh pr ready "$pr" --repo "$GITHUB_REPOSITORY" || true
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash
