name: truth-gates

"on":
  push:
    branches:
      - fix/realestate-readiness-truth-v1

permissions:
  contents: write

jobs:
  materialize-realestate-readiness-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/realestate-readiness-truth-v1
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Apply and verify the exact source repair
        shell: bash
        run: |
          set -euo pipefail
          python tools/_realestate_truth_materializer.py
          python -m pip install --disable-pip-version-check --no-cache-dir pytest==9.1.1 fastapi==0.137.2 httpx==0.28.1
          python -m py_compile a11oy_vertical_feeds.py a11oy_deva_feeds.py tests/test_realestate_readiness_truth_contract.py
          python -m pytest tests/test_realestate_readiness_truth_contract.py -q
          git diff --check
      - name: Commit and push only the permanent source contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add a11oy_vertical_feeds.py a11oy_deva_feeds.py tests/test_realestate_readiness_truth_contract.py
          git commit --signoff -m "fix(readiness): type real-estate upstream failures honestly"
          git push origin "HEAD:fix/realestate-readiness-truth-v1"
