name: Materialize Unify runtime wiring

"on":
  push:
    branches:
      - fix/unify-flock-runtime-wiring

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/unify-flock-runtime-wiring
          fetch-depth: 4
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
      - name: Apply and verify
        run: |
          set -euo pipefail
          python tools/_unify_wiring_materializer.py
          python -m py_compile szl_unify_flock.py serve.py tests/test_unify_flock_runtime_wiring.py
          python -m pip install --disable-pip-version-check --no-cache-dir pytest==9.1.1
          python -m pytest tests/test_unify_flock_runtime_wiring.py -q
          python .github/scripts/register_invocation.py --root . --entrypoints serve.py wayra_serve.py ayni_os_serve.py kipu_qillqaq_serve.py --allowlist .github/register-invocation-allowlist.txt
          git diff --check
      - name: Publish permanent files only
        run: |
          set -euo pipefail
          git show HEAD~3:.github/workflows/truth-gates.yml > .github/workflows/truth-gates.yml
          rm tools/_unify_wiring_materializer.py
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git commit --signoff -m "fix(runtime): wire the Unify flock ledger"
          git push origin HEAD:fix/unify-flock-runtime-wiring
