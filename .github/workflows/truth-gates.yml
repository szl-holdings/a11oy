name: truth-gates

"on":
  push:
    branches:
      - fix/realestate-readiness-truth-v1

permissions:
  contents: write

jobs:
  materialize-realestate-readiness-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/realestate-readiness-truth-v1
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Decode and apply the exact source repair
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/realestate_truth_patch.py
          python /tmp/realestate_truth_patch.py
          python -m pip install --disable-pip-version-check --no-cache-dir pytest==9.1.1 fastapi==0.137.2 httpx==0.28.1
          python -m py_compile a11oy_vertical_feeds.py a11oy_deva_feeds.py tests/test_realestate_readiness_truth_contract.py
          python -m pytest tests/test_realestate_readiness_truth_contract.py -q
          git diff --check
      - name: Restore canonical workflow and publish the exact source repair
        shell: bash
        run: |
          set -euo pipefail
          git show e24126eefc550f4888dfd5bf5e32ec767f1f4d32:.github/workflows/truth-gates.yml > .github/workflows/truth-gates.yml
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git commit --signoff -m "fix(readiness): type real-estate upstream failures honestly"
          git push origin "HEAD:fix/realestate-readiness-truth-v1"
