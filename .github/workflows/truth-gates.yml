# truth-gates.yml — round-10 payload truth gates.
#
#   1. py_compile of tools/*.py and src/          hard gate (syntax)
#   2. docs lexicon gate                          blocking on a push to
#      main or a tag. A non-zero exit fails the job. Other refs stay
#      observe-mode: the step still runs and still returns the tool
#      status, and the job continues (CANON section 11).
#   3. commercial release gate                    blocking on a tag push
#      only. A push to main and every pull request stay observe-mode.
#      The tool still runs and still returns its status. Unverified
#      raise-blocking COMMERCIAL_LEDGER rows fail a tag-push job
#      (CANON section 8). Real evidence is what clears those rows.
#   4. demo harness                               hard gate: the 12-step
#      acceptance demo must stay 12/12 on every run.
#
# Lexicon blocking: push AND (refs/heads/main OR refs/tags/*).
# Commercial blocking: push AND refs/tags/*.
# continue-on-error is true only for the negation of that step's predicate.
# Any expression failure fails the workflow rather than skipping the gate.
# Finding cleanup: docs/RUNBOOK_WEEK1.md.
# Triggers, action pins, permissions, and secrets are unchanged.

name: truth-gates

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  truth-gates:
    runs-on: ubuntu-latest
    env:
      # Shell annotations only. Job failure is continue-on-error below,
      # from the same predicate as the matching variable.
      LEXICON_GATE_BLOCKING: "${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}"
      COMMERCIAL_GATE_BLOCKING: "${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}"
    steps:
      # Org policy: all actions pinned to full-length commit SHAs (same pins
      # as the existing workflows in this repo).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify lexicon and commercial gate failure rules
        run: python3 tests/test_truth_gates_release_blocking.py

      - name: Install demo-slice runtime deps (pydantic, cryptography)
        run: python3 -m pip install --quiet "pydantic>=2" "cryptography>=42"

      - name: Compile check (tools/*.py and src/)
        run: |
          python3 -m py_compile tools/*.py
          find src -name '*.py' -print0 | xargs -0 python3 -m py_compile

      - name: Docs lexicon gate
        continue-on-error: "${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) }}"
        run: |
          set +e
          python3 tools/docs_lexicon_gate.py --root .
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if [ "$LEXICON_GATE_BLOCKING" = "true" ]; then
              echo "::error title=docs lexicon gate::exit $rc — findings above fail this push to main or a tag (CANON section 11)"
            else
              echo "::notice title=docs lexicon gate::exit $rc — findings above are recorded; this ref is not a push to main or a tag, so the job continues (CANON section 11)"
            fi
          fi
          exit "$rc"

      - name: Commercial release gate
        continue-on-error: "${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}"
        run: |
          set +e
          python3 tools/commercial_release_gate.py --root .
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if [ "$COMMERCIAL_GATE_BLOCKING" = "true" ]; then
              echo "::error title=commercial release gate::exit $rc — findings above fail this tag push (CANON section 8)"
            else
              echo "::notice title=commercial release gate::exit $rc — findings above are recorded; this ref is not a tag push, so the job continues (CANON section 8)"
            fi
          fi
          exit "$rc"

      - name: Acceptance demo (12 steps — hard gate)
        run: >-
          python3 tools/demo_harness.py --root .
          --conformance evidence/conformance/eu-ai-act-article-12.v1.yaml

  workspace-disposition-contract:
    name: Workspace receipt identity and proxy contract (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing locked core test dependencies
        run: python -m pip install --require-hashes -r .github/requirements/ci-core.txt
      - name: Verify exact source and run workspace contracts
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python -m pytest -q \
            tests/test_workspace_disposition.py \
            tests/test_workspace_disposition_identity.py \
            tests/test_workspace_disposition_ci.py \
            --junitxml=workspace-disposition-tests.xml
      - name: Retain workspace contract results including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-contract-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: workspace-disposition-tests.xml
          if-no-files-found: error
          retention-days: 14
