# SPDX-License-Identifier: Apache-2.0
name: Fix public estate control once

"on":
  push:
    branches: [feat/public-estate-control-plane-v1-20260904]
    paths:
      - .github/workflows/zz-fix-public-estate-control-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: public-estate-control-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/public-estate-control-plane-v1-20260904
          fetch-depth: 1
          persist-credentials: true

      - name: Repair exact test loader and step-summary anchors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test = Path("tests/test_public_estate_live_witness.py")
          text = test.read_text(encoding="utf-8")
          old = "import json\nfrom pathlib import Path\n\nimport pytest\n"
          new = "import json\nimport sys\nfrom pathlib import Path\n\nimport pytest\n"
          if text.count(old) != 1:
              raise SystemExit("test import anchor drift")
          text = text.replace(old, new, 1)
          old = "witness = importlib.util.module_from_spec(spec)\nspec.loader.exec_module(witness)\n"
          new = "witness = importlib.util.module_from_spec(spec)\nsys.modules[spec.name] = witness\nspec.loader.exec_module(witness)\n"
          if text.count(old) != 1:
              raise SystemExit("module loader anchor drift")
          test.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/public-estate-live-witness.yml")
          text = workflow.read_text(encoding="utf-8")
          old = "          import json\n          from pathlib import Path\n"
          new = "          import json\n          import os\n          from pathlib import Path\n"
          if text.count(old) != 1:
              raise SystemExit("summary import anchor drift")
          text = text.replace(old, new, 1)
          old = '          with Path("$GITHUB_STEP_SUMMARY").open("a", encoding="utf-8") as stream:\n'
          new = '          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:\n'
          if text.count(old) != 1:
              raise SystemExit("summary path anchor drift")
          workflow.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Prove the complete control plane
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.3.5"
          python -m pytest -q tests/test_public_estate_live_witness.py
          python scripts/public_estate_live_witness.py \
            --offline-contract-only \
            --output /tmp/public-estate-contract.json
          python -m py_compile scripts/public_estate_live_witness.py
          git diff --check

      - name: Remove temporary writer and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-fix-public-estate-control-once.yml
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add \
            tests/test_public_estate_live_witness.py \
            .github/workflows/public-estate-live-witness.yml
          git diff --cached --check
          git commit --signoff -m "fix(estate): harden witness test and operator summary"
          git push origin HEAD:feat/public-estate-control-plane-v1-20260904
