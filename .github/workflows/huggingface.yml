name: Publish Hugging Face Payload

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: Fixed existing A11oy model repository
        type: choice
        options:
          - SZLHOLDINGS/a11oy-v19-substrate
        required: true
        default: SZLHOLDINGS/a11oy-v19-substrate
      repo_type:
        description: Hugging Face repository type
        type: choice
        options:
          - model
        required: true
        default: model
      expected_revision:
        description: Exact current 40-character Hub parent revision reviewed by the operator
        required: true
      apply:
        description: Apply the full additive payload after all existing evidence checks (false only plans)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and reconcile the fixed payload
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: 10.33.3

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate doctrine and payload
        run: |
          pnpm test:doctrine
          pnpm typecheck:doctrine
          pnpm build:doctrine
          pnpm ecosystem:audit
          pnpm ecosystem:readiness
          pnpm payload:verify

      - name: Validate publish-bound Hugging Face evidence
        run: |
          pnpm hf:ecosystem:audit
          python3 scripts/build_ecosystem_stage_matrix.py --check
          node scripts/validate_huggingface_ecosystem_schema.mjs

      - name: Prepare Hugging Face payload
        run: pnpm payload:huggingface

      - name: Install Hugging Face client
        run: python -m pip install --upgrade huggingface_hub

      - name: Prove additive publisher controls offline
        run: python3 -m unittest discover -s tests -p test_publish_huggingface_payload.py

      - name: Plan or apply the parent-bound payload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TARGET_REPO_ID: ${{ inputs.repo_id }}
          TARGET_REPO_TYPE: ${{ inputs.repo_type }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          APPLY_PAYLOAD: ${{ inputs.apply }}
        run: |
          args=(--repo-id "$TARGET_REPO_ID" --repo-type "$TARGET_REPO_TYPE" --expected-revision "$EXPECTED_REVISION")
          if [[ "$APPLY_PAYLOAD" == 'true' ]]; then args+=(--apply); fi
          python3 scripts/publish_huggingface_payload.py "${args[@]}"
