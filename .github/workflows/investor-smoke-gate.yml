name: Investor smoke gate (S1–S12)

# Fail-closed investor-honest quality gate. Does not merge. Does not touch
# Dockerfile / HF byte parity. Does not rewrite genome.json. No POST.
#
# Admission lifecycle:
# - pull requests run deterministic source contracts and the S7 source bind;
# - protected-main pushes, the six-hour schedule, and manual dispatch also run
#   the live provider measurements;
# - a provider outage remains visible and red in the post-merge monitor, but it
#   cannot deadlock an unrelated source-only security or documentation change.
# A skipped live job on a pull request is an explicit lifecycle state, not proof
# that either public origin is healthy.
#
# Origin contract:
# - a-11-oy.com is the static product/front-door origin.
# - szlholdings-a11oy.hf.space is the canonical live application runtime.
# Runtime API and HEAD/GET assertions must target the runtime origin. The static
# origin receives a separate reachability probe and is never treated as an API.
#
# S7 is a BIND: landing #pt-locked via loadLockedKernel/loadKernelLocked and
# trust/console #cnt-locked must read GET /api/a11oy/v1/honest locked_formula_count
# (8 or N/A). Genome LOCKED-PROVEN=25 is catalog. PR 1396 landed console
# #cnt-locked on main. S1/S2 product is 1394 on main; live probes measure
# origin and must not invent LIVE. Do not touch 1363.
#
# Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_FRONT_DOOR: https://a-11-oy.com
  RUNTIME_ORIGIN: https://szlholdings-a11oy.hf.space

jobs:
  contract:
    name: Investor smoke contract (S1-S12 static)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pytest (stdlib gate + pytest runner; no app deps)
        run: python3 -m pip install pytest

      - name: Contract tests (fixtures, origin split, labelling, skip-as-green, S12)
        run: >-
          python3 -m pytest -q
          tests/test_investor_smoke_gate.py
          tests/test_investor_smoke_origin_contract.py

  bind:
    name: Investor smoke bind (S7 kernel chips → /honest 8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python3 -m pip install pytest

      - name: S7 kernel chips must bind to /honest locked_formula_count
        run: python3 -m pytest -q tests/test_investor_smoke_bind.py

  live:
    name: Investor smoke live probes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Static product front door is reachable (no runtime claim)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.request

          origin = os.environ["PRODUCT_FRONT_DOOR"].rstrip("/")
          request = urllib.request.Request(
              origin + "/",
              method="GET",
              headers={"User-Agent": "a11oy-investor-smoke-front-door/1.0"},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit(f"static front door returned HTTP {response.status}")
              response.read(4096)
          print(f"static product front door: PASS ({origin}/)")
          PY

      - name: Runtime GET/HEAD probes (no POST)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/investor_smoke_gate.py --mode live \
            --origin "$RUNTIME_ORIGIN"
