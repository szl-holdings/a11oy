name: HF Space source map materializer 2026-08-17

on:
  push:
    branches:
      - feat/hf-space-source-map-v1-20260817
    paths:
      - .github/workflows/hf-space-source-map-materialize-20260817.yml

permissions:
  contents: write

concurrency:
  group: hf-space-source-map-materialize-20260817
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.actor == 'stephenlutar2-hash' &&
      github.ref == 'refs/heads/feat/hf-space-source-map-v1-20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: feat/hf-space-source-map-v1-20260817
      SELF_PATH: .github/workflows/hf-space-source-map-materialize-20260817.yml
      MAP_PATH: docs/huggingface-space-source-map-v1.json
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind checkout to event head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install exact focused-test runtime
        run: python3 -m pip install --disable-pip-version-check 'pytest==9.0.3'

      - name: Verify source-map logic before network use
        run: |
          python3 -m py_compile scripts/build_hf_space_source_map_v1.py
          python3 -m pytest -q tests/test_hf_space_source_map_v1.py

      - name: Materialize and verify current public source map
        run: |
          python3 scripts/build_hf_space_source_map_v1.py
          python3 scripts/build_hf_space_source_map_v1.py --check

      - name: Enforce exact generated mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for path in "${changed[@]}"; do
            case "$path" in
              $MAP_PATH|$SELF_PATH) ;;
              *) echo "::error::Unexpected materializer path: $path"; exit 1 ;;
            esac
          done
          test -f "$MAP_PATH"

      - name: Retire materializer and commit source map
        shell: bash
        run: |
          set -euo pipefail
          git rm "$SELF_PATH"
          git add "$MAP_PATH"
          git config user.name 'Stephen P. Lutar Jr.'
          git config user.email 'stephen@szlholdings.com'
          git commit \
            -m 'feat(hf): materialize public Space source map v1' \
            -m 'Signed-off-by: Stephen P. Lutar Jr. <stephen@szlholdings.com>'
          git push origin HEAD:$HEAD_BRANCH
