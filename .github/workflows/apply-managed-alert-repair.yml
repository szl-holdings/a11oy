# SPDX-License-Identifier: Apache-2.0
name: Apply managed alert relay repair

on:
  push:
    branches:
      - fix/managed-alert-relay-operational

permissions:
  contents: read

concurrency:
  group: apply-managed-alert-relay-repair
  cancel-in-progress: false

jobs:
  patch:
    name: Apply, verify, and export alert transport repair
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/managed-alert-relay-operational
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Apply deterministic repair
        run: python .github/scripts/apply_managed_alert_repair.py

      - name: Install exact core test dependencies
        run: pip install --require-hashes -r .github/requirements/ci-core.txt

      - name: Verify endpoint, workflow, and relay contracts
        run: |
          pytest \
            tests/test_alert_channel_canary.py \
            tests/test_alert_channel_static_registry_contract.py \
            tests/test_alert_channel_workflow_contract.py \
            tests/test_managed_alert_endpoint.py \
            tests/test_managed_alert_transport_workflows.py \
            -q
          node --test ops/alert-relay-worker/test/index.test.mjs

      - name: Parse every workflow after the migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY

      - name: Build immutable permanent-tree artifact
        run: |
          set -euo pipefail
          git rm .github/scripts/apply_managed_alert_repair.py
          git rm .github/workflows/apply-managed-alert-repair.yml
          git add -A
          git diff --cached --check
          mkdir -p evidence
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import subprocess
          import zipfile

          root = Path.cwd()

          def changed_paths(diff_filter: str) -> list[str]:
              raw = subprocess.check_output([
                  'git', 'diff', '--cached', '--name-only', '-z',
                  f'--diff-filter={diff_filter}',
              ])
              return sorted(
                  part.decode('utf-8') for part in raw.split(b'\0') if part
              )

          files = changed_paths('ACMRTUXB')
          deletions = changed_paths('D')
          manifest = {
              'schema': 'szl.managed-alert-repair-tree/v1',
              'source_head': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'files': files,
              'deletions': deletions,
          }
          expected_deletions = {
              '.github/scripts/apply_managed_alert_repair.py',
              '.github/workflows/apply-managed-alert-repair.yml',
          }
          if set(deletions) != expected_deletions:
              raise SystemExit(
                  f'unexpected deletion set: {deletions!r}'
              )
          if len(files) != 21:
              raise SystemExit(
                  f'expected 21 permanent files, found {len(files)}: {files!r}'
              )

          output = root / 'evidence' / 'managed-alert-repair-tree.zip'
          with zipfile.ZipFile(
              output, 'w', compression=zipfile.ZIP_DEFLATED
          ) as archive:
              archive.writestr(
                  'manifest.json',
                  json.dumps(manifest, sort_keys=True, indent=2) + '\n',
              )
              for relative in files:
                  path = root / relative
                  if not path.is_file():
                      raise SystemExit(f'manifest file is absent: {relative}')
                  archive.write(path, arcname=f'files/{relative}')
          print(json.dumps(manifest, sort_keys=True, indent=2))
          PY

      - name: Upload validated permanent tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-alert-repair-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/managed-alert-repair-tree.zip
          if-no-files-found: error
          retention-days: 90
