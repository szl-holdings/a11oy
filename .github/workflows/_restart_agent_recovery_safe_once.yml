name: Restart agent recovery with self-branch exclusion

on:
  push:
    branches:
      - ops/codex-perplexity-recovery-20260904-v1
    paths:
      - .github/workflows/_restart_agent_recovery_safe_once.yml

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: restart-agent-estate-recovery-safe-once
  cancel-in-progress: false

jobs:
  repair:
    name: Cancel unsafe pass, close self-PR, patch controller, and retrigger
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out controller branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/codex-perplexity-recovery-20260904-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Cancel earlier running recovery passes and close any self-generated PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='ops/codex-perplexity-recovery-20260904-v1'
          gh api "repos/szl-holdings/a11oy/actions/runs?branch=${branch}&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "One-pass Codex and Perplexity estate recovery" and (.status == "queued" or .status == "in_progress" or .status == "waiting")) | .id' \
            | while read -r run_id; do
                [ -n "$run_id" ] || continue
                gh api --method POST "repos/szl-holdings/a11oy/actions/runs/${run_id}/cancel" || true
              done
          gh api 'repos/szl-holdings/a11oy/pulls?state=open&head=szl-holdings%3Aops%2Fcodex-perplexity-recovery-20260904-v1' \
            --jq '.[].number' | while read -r number; do
              [ -n "$number" ] || continue
              gh api --method POST "repos/szl-holdings/a11oy/issues/${number}/comments" \
                -f body='Closing unmerged: this is the isolated recovery controller/evidence branch, not a product candidate. It is explicitly excluded from orphan-agent promotion.' >/dev/null
              gh api --method PATCH "repos/szl-holdings/a11oy/pulls/${number}" -f state=closed >/dev/null
            done

      - name: Patch the controller exclusion and retire this repair workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/agent_estate_recovery_once.py')
          text = path.read_text(encoding='utf-8')
          needle = '        if not name or name == default:\n            continue\n'
          replacement = (
              '        if not name or name == default:\n'
              '            continue\n'
              '        if repo_full == f"{ORG}/a11oy" and name == "ops/codex-perplexity-recovery-20260904-v1":\n'
              '            continue\n'
          )
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('orphan-branch insertion point is absent')
              text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/agent_estate_recovery_once.py
          git rm .github/workflows/_restart_agent_recovery_safe_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/agent_estate_recovery_once.py
          git diff --cached --check
          git commit -s -m "fix(ops): exclude recovery controller from agent promotion"
          git push origin HEAD:ops/codex-perplexity-recovery-20260904-v1
