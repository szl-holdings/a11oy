name: Sync and Relock Canonical Hugging Face Space

# Permanent source-derived deployment path. The pinned reusable controller derives
# the exact Space file set from Dockerfile COPY sources, publishes and byte-attests
# the immutable runtime, binds the exact checked-out Git SHA, and verifies the live
# build-info contract. This caller retains only A11oy-specific terminal evidence.
# The main-push trigger intentionally has no path filter: every Dockerfile source
# change must enter deployment before the strict parity dispatch.
#
# Promote path: push to main writes Space SZLHOLDINGS/a11oy (szlholdings-a11oy.hf.space).
# Staging Space ≠ prod DNS. GitHub main SHA and Space runtime SHA can drift;
# do not claim they match. This workflow does not change DNS. Apex a-11-oy.com
# stays Cloudflare orange-cloud (proxied). HF custom domain stays
# PENDING/UNAVAILABLE in product. Stephen may later add the HF verify TXT
# (_huggingface.a-11-oy.com) WITHOUT dropping that proxy. Keep orange-cloud.
# Do not grey-cloud. Do not stamp LIVE. www.a-11-oy.com GET / is
# Cloudflare HTTP 404 (UNAVAILABLE until Cloudflare 301 www → apex).
# Do not add a second HF custom domain. This workflow does not change DNS.
# x-szl-wire-d LIVE is DSSE Wire D provenance, not domain LIVE.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_vertical_flagships:
        description: Publish six domain-native flagship Spaces. Default false until plan complete=true.
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: sync-relock-canonical-a11oy
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  CANONICAL_SPACE: SZLHOLDINGS/a11oy
  CANONICAL_ORIGIN: https://szlholdings-a11oy.hf.space
  CAPACITY_DONOR_SPACE: SZLHOLDINGS/holographic
  RELOCK_ISSUE: "1043"
  REPORT_PATH: reports/canonical-a11oy-relock-v4.json

jobs:
  resume-paused-space:
    name: Resume the canonical Space without changing its allocation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      RESUME_REPORT: /tmp/canonical-a11oy-resume.json
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact Hugging Face control client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.23.0"

      - name: Resume only an explicitly paused canonical runtime
        run: >-
          python .github/scripts/resume_hf_space.py
          --repo-id "$CANONICAL_SPACE"
          --capacity-donor "$CAPACITY_DONOR_SPACE"
          --output "$RESUME_REPORT"

      - name: Upload immutable resume evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0b # v7.0.1
        with:
          name: canonical-a11oy-resume-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESUME_REPORT }}
          if-no-files-found: error
          retention-days: 90
