name: Sync and Relock Canonical Hugging Face Space

# Permanent source-derived deployment path. The pinned reusable controller derives
# the exact Space file set from Dockerfile COPY sources, publishes and byte-attests
# the immutable runtime, binds the exact checked-out Git SHA, and verifies the live
# build-info contract. This caller retains only A11oy-specific terminal evidence.
# The main-push trigger intentionally has no path filter: every Dockerfile source
# change enters this canonical workflow. Every gate is an invariant, never an
# exact identity: the source must be protected main, the newest main wins and a
# superseded run ends neutral with a notice, the deploy path starts the Space
# once, and the live Space must report this exact source afterwards. Until
# durable storage lands, a deploy needs an open maintenance window (a PAUSED
# Space or an operator dispatch with open_deploy_window); otherwise the run
# writes and deploys nothing and ends with a warning. Pause and
# restart durability proofs run only in the manual restart-drill.yml.
# The permanent target remains Space SZLHOLDINGS/a11oy (szlholdings-a11oy.hf.space).
# Staging Space ≠ prod DNS. GitHub main SHA and Space runtime SHA can drift;
# do not claim they match. This workflow does not change DNS. Apex a-11-oy.com
# stays Cloudflare orange-cloud (proxied). HF custom domain stays
# PENDING/UNAVAILABLE in product. Stephen may later add the HF verify TXT
# (_huggingface.a-11-oy.com) WITHOUT dropping that proxy. Keep orange-cloud.
# Do not grey-cloud. Do not stamp LIVE. www.a-11-oy.com GET / is
# Cloudflare HTTP 404 (UNAVAILABLE until Cloudflare 301 www → apex).
# Do not add a second HF custom domain. This workflow does not change DNS.
# x-szl-wire-d LIVE is DSSE Wire D provenance, not domain LIVE.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_vertical_flagships:
        description: Publish six domain-native flagship Spaces. Default false until plan complete=true.
        type: boolean
        default: false

      vertical_plan_json:
        description: Complete approved plan JSON with expected_source_revision bound to exact A11oy main; not a production-readiness certificate.
        required: false
        type: string
        default: ""

      open_deploy_window:
        description: Operator-attested maintenance window. Until durable storage lands, a deploy onto a running or crashed Space proceeds only when true (a PAUSED Space is itself the window).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-relock-canonical-a11oy
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  CANONICAL_SPACE: SZLHOLDINGS/a11oy
  CANONICAL_ORIGIN: https://szlholdings-a11oy.hf.space
  REPORT_PATH: reports/canonical-a11oy-relock-v4.json

jobs:
  source-admission:
    name: Admit the queued source before provider mutation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.owner.outputs.publish }}
      artifact_id: ${{ steps.source_artifact.outputs.artifact-id }}
      artifact_sha256: ${{ steps.source_artifact.outputs.artifact-digest }}
    steps:
      - name: Checkout the immutable queued source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Require main and classify current source ownership
        id: owner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          python3 -B scripts/hf_exact_main_ownership.py \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/canonical-source-admission.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Retain the source admission decision
        id: source_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-source-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canonical-source-admission.json
          if-no-files-found: error
          retention-days: 90

  preflight:
    name: Classify the canonical runtime and converge configuration before deploy
    needs: source-admission
    if: ${{ needs.source-admission.result == 'success' && needs.source-admission.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.window.outputs.open == 'true' && steps.owner.outputs.publish == 'true' }}
      restart_required: ${{ steps.runtime.outputs.restart_required }}
      converged: ${{ steps.converge.outputs.converged }}
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      PREFLIGHT_REPORT: /tmp/canonical-a11oy-preflight.json
      RUNTIME_CONFIG_REPORT: /tmp/series-a-runtime-config.json
      GDW_CONFIG_REPORT: /tmp/gdw-runtime-config.json
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      # Before any provider effect: a re-run of a superseded source must never
      # write its older configuration contract over a newer live revision.
      - name: Require current protected main before any provider effect
        id: admit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/hf_exact_main_ownership.py \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/preflight-admission.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Python
        if: ${{ steps.admit.outputs.publish == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact Hugging Face control client
        if: ${{ steps.admit.outputs.publish == 'true' }}
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.31.0"
          "requests==2.32.5"
          "cryptography==50.0.1"

      # Never restarts. A serving Space is rebuilt by the deploy commit; a
      # paused, crashed or failed-build Space is started once by the publisher
      # after the commit. Either way the deploy starts the new revision once.
      - name: Classify the runtime stage without restarting it
        id: runtime
        if: ${{ steps.admit.outputs.publish == 'true' }}
        run: >-
          python -B .github/scripts/resume_hf_space.py
          --repo-id "$CANONICAL_SPACE"
          --output "$PREFLIGHT_REPORT"
          --github-output "$GITHUB_OUTPUT"

      # Until durable storage replaces SQLite on the bucket mount, a deploy
      # must not overlap a serving writer outside an agreed maintenance window:
      # the operator pauses the Space, or dispatches with open_deploy_window.
      - name: Require an open deploy window while SQLite lives on the bucket mount
        id: window
        if: ${{ steps.admit.outputs.publish == 'true' }}
        shell: bash
        env:
          STAGE: ${{ steps.runtime.outputs.stage }}
          DISPATCH_WINDOW: ${{ github.event_name == 'workflow_dispatch' && inputs.open_deploy_window == true }}
        run: |
          set -euo pipefail
          if [ "${STAGE:-}" = 'PAUSED' ] || [ "${DISPATCH_WINDOW:-false}" = 'true' ]; then
            echo 'open=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::Deploy window closed (stage=${STAGE:-UNKNOWN}); nothing was written or deployed. Pause the Space, or dispatch hf-sync.yml on main with open_deploy_window=true, inside an agreed maintenance window."
          echo 'open=false' >> "$GITHUB_OUTPUT"

      # Idempotent: a converged Space receives no write. Convergence needs the
      # serving runtime to prove installed authority, so a paused or crashed
      # Space defers it to runtime-config against the deployed revision.
      - name: Converge runtime configuration before the single deploy start
        id: converge
        if: ${{ steps.window.outputs.open == 'true' }}
        shell: bash
        env:
          CONVERGE: ${{ steps.runtime.outputs.converge }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${CONVERGE:-false}" != 'true' ]; then
            echo '::notice::The canonical runtime is not serving; configuration converges against the deployed revision.'
            echo 'converged=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -B scripts/hf_exact_main_ownership.py \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/preflight-series-config-admission.json" \
            --github-output "$RUNNER_TEMP/preflight-series-config-admission.out"
          if ! grep -Fqx 'publish=true' "$RUNNER_TEMP/preflight-series-config-admission.out"; then
            echo '::error::Protected main changed before Series-A configuration.'
            exit 1
          fi
          python -B scripts/configure_hf_series_a_runtime.py \
            --repo-id "$CANONICAL_SPACE" --bucket "SZLHOLDINGS/szl-evidence" \
            --expected-source-sha "$GITHUB_SHA" \
            --output "$RUNTIME_CONFIG_REPORT"
          python3 -B scripts/hf_exact_main_ownership.py \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/preflight-gdw-config-admission.json" \
            --github-output "$RUNNER_TEMP/preflight-gdw-config-admission.out"
          if ! grep -Fqx 'publish=true' "$RUNNER_TEMP/preflight-gdw-config-admission.out"; then
            echo '::error::Protected main changed before GDW configuration.'
            exit 1
          fi
          python -B scripts/configure_hf_gdw_runtime.py \
            --repo-id "$CANONICAL_SPACE" --expected-source-sha "$GITHUB_SHA" \
            --output "$GDW_CONFIG_REPORT"
          echo 'converged=true' >> "$GITHUB_OUTPUT"

      - name: Re-admit current protected main immediately before deploy
        id: owner
        if: ${{ steps.window.outputs.open == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/hf_exact_main_ownership.py \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/preflight-source-admission.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Skip a superseded source with a notice
        if: ${{ steps.admit.outputs.publish != 'true' || (steps.window.outputs.open == 'true' && steps.owner.outputs.publish != 'true') }}
        run: echo '::notice::A newer protected main superseded this source before deploy; that run deploys it.'

      - name: Retain secret-free preflight evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-a11oy-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PREFLIGHT_REPORT }}
            ${{ env.RUNTIME_CONFIG_REPORT }}
            ${{ env.GDW_CONFIG_REPORT }}
            ${{ runner.temp }}/preflight-admission.json
            ${{ runner.temp }}/preflight-series-config-admission.json
            ${{ runner.temp }}/preflight-gdw-config-admission.json
            ${{ runner.temp }}/preflight-source-admission.json
          if-no-files-found: error
          retention-days: 90
  deploy:
    name: Deploy, source-bind, and attest exact surface
    needs: [source-admission, preflight]
    if: ${{ needs.source-admission.outputs.publish == 'true' && needs.preflight.result == 'success' && needs.preflight.outputs.publish == 'true' }}
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@4738365705a6a478c0e4c2e94b784ebe5e5e25da
    with:
      hf-repo: SZLHOLDINGS/a11oy
      ref: ${{ github.sha }}
      # Recheck next to the provider commit if main advances after admission.
      require-default-branch-tip: true
      dockerfile-path: Dockerfile
      include-readme: true
      prune: true
      wait-running: 1200
      # Single start: the commit rebuilds a serving or crashed Space; only a
      # PAUSED Space is started explicitly, after the commit has landed.
      restart-space: ${{ needs.preflight.outputs.restart_required == 'true' }}
      source-revision-variable: SZL_GIT_SHA
      source-revision-probe-path: /api/build-info
      smoke-paths: '["/","/api/livez","/api/build-info","/api/a11oy/v1/honest","/api/a11oy/healthz","/api/a11oy/v1/brain/capabilities","/api/a11oy/v1/readiness/tab-matrix?view=summary","/api/a11oy/v1/series-a/status","/holographic","/holographic/","/static/3d/holographic.html","/assets/brain-frontier-v7.css","/assets/brain-frontier-v7.js","/assets/brain-frontier-v7.json","/static/landing-honest-bind.js","/atelier/frontier","/api/a11oy/v1/atelier/frontier/registry","/api/a11oy/v1/atelier/frontier/evaluate?evidence=90&repeatability=90&coverage=90&governance=90&safety=1&energy_state=UNAVAILABLE","/api/a11oy/v1/atelier/frontier/evaluate?safety=0"]'
    secrets:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}

  runtime-config:
    name: Verify the deployed runtime configuration without restarting it
    needs: [preflight, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      RUNTIME_CONFIG_REPORT: /tmp/series-a-runtime-config.json
      GDW_CONFIG_REPORT: /tmp/gdw-runtime-config.json
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact Hugging Face control client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.31.0"
          "requests==2.32.5"
          "cryptography==50.0.1"

      # Converged before deploy: verify the deployed revision's installed
      # authority with no provider write. Otherwise converge now, fail closed.
      - name: Verify or converge runtime configuration against the deployed revision
        shell: bash
        env:
          PREDEPLOY_CONVERGED: ${{ needs.preflight.outputs.converged }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode=()
          if [ "${PREDEPLOY_CONVERGED:-false}" = 'true' ]; then
            mode=(--check-only)
          else
            echo '::notice::Configuration was not converged before deploy; converging against the deployed revision.'
            python3 -B scripts/hf_exact_main_ownership.py \
              --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA" \
              --receipt "$RUNNER_TEMP/runtime-series-config-admission.json" \
              --github-output "$RUNNER_TEMP/runtime-series-config-admission.out"
            if ! grep -Fqx 'publish=true' "$RUNNER_TEMP/runtime-series-config-admission.out"; then
              echo '::error::Protected main changed before post-deploy Series-A configuration.'
              exit 1
            fi
          fi
          python -B scripts/configure_hf_series_a_runtime.py \
            --repo-id "$CANONICAL_SPACE" --bucket "SZLHOLDINGS/szl-evidence" \
            --expected-source-sha "$GITHUB_SHA" \
            "${mode[@]}" --output "$RUNTIME_CONFIG_REPORT"
          if [ "${PREDEPLOY_CONVERGED:-false}" != 'true' ]; then
            python3 -B scripts/hf_exact_main_ownership.py \
              --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA" \
              --receipt "$RUNNER_TEMP/runtime-gdw-config-admission.json" \
              --github-output "$RUNNER_TEMP/runtime-gdw-config-admission.out"
            if ! grep -Fqx 'publish=true' "$RUNNER_TEMP/runtime-gdw-config-admission.out"; then
              echo '::error::Protected main changed before post-deploy GDW configuration.'
              exit 1
            fi
          fi
          python -B scripts/configure_hf_gdw_runtime.py \
            --repo-id "$CANONICAL_SPACE" \
            --expected-source-sha "$GITHUB_SHA" \
            "${mode[@]}" --output "$GDW_CONFIG_REPORT"

      # A convergence write restarts the deployed revision. Read-only: wait
      # until it is RUNNING and serves this exact source again before probing.
      - name: Await the deployed revision serving again after any convergence write
        run: >-
          python -B .github/scripts/await_hf_runtime_serving.py
          --repo-id "$CANONICAL_SPACE"
          --origin "$CANONICAL_ORIGIN"
          --source-sha "$GITHUB_SHA"
          --report "$RUNTIME_CONFIG_REPORT"
          --report "$GDW_CONFIG_REPORT"

      - name: Upload secret-free runtime configuration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: series-a-runtime-config-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RUNTIME_CONFIG_REPORT }}
            ${{ env.GDW_CONFIG_REPORT }}
            ${{ runner.temp }}/runtime-series-config-admission.json
            ${{ runner.temp }}/runtime-gdw-config-admission.json
          if-no-files-found: error
          retention-days: 90

  publish-vertical-flagships:
    name: Publish and live-verify six domain-native flagship Spaces
    # Other-Space execute is not product promote. Skip on push until plan complete=true.
    # Explicit opt-in includes this publisher in the requested run completion.
    # Product-only pushes still skip it; canonical product evidence stays separate.
    if: ${{ needs.source-admission.outputs.publish == 'true' && needs.deploy.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish_vertical_flagships }}
    needs: [source-admission, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: hf-vertical-estate
      cancel-in-progress: false
    env:
      HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
      HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert the workflow owns exact protected main
        id: exact_main_owner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/hf_exact_main_ownership.py \
            --repository "$GITHUB_REPOSITORY" \
            --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/hf-main-ownership.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload exact-main ownership receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned
        with:
          name: hf-main-ownership-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hf-main-ownership.json
          if-no-files-found: error
          retention-days: 90
      - name: Set up Python
        if: ${{ steps.exact_main_owner.outputs.publish == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require the approved plan for the actual vertical source
        id: vertical_plan
        if: ${{ steps.exact_main_owner.outputs.publish == 'true' }}
        env:
          VERTICAL_PLAN_JSON: ${{ inputs.vertical_plan_json }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/estate_repair_dispatch.py \
            --repair true --vertical-requested true --plan-from-env \
            --expected-sha "$GITHUB_SHA" --current-sha "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --require-vertical \
            --github-output "$GITHUB_OUTPUT" \
            > "$RUNNER_TEMP/hf-vertical-plan.json"

      - name: Upload the vertical plan decision without raw operator input
        if: ${{ always() && steps.exact_main_owner.outputs.publish == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-vertical-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hf-vertical-plan.json
          if-no-files-found: error
          retention-days: 180

      - name: Install pinned vertical publisher
        if: ${{ steps.exact_main_owner.outputs.publish == 'true' && steps.vertical_plan.outputs.vertical_flagships == 'true' }}
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface_hub==1.31.0"

      - name: Publish and verify the v4 vertical estate
        id: vertical_publish
        if: ${{ steps.exact_main_owner.outputs.publish == 'true' && steps.vertical_plan.outputs.vertical_flagships == 'true' }}
        run: python scripts/hf_publish_vertical_flagships_v4.py

      - name: Enforce complete explicitly requested vertical publication
        if: always()
        env:
          EXACT_MAIN_PUBLISH: ${{ steps.exact_main_owner.outputs.publish }}
          VERTICAL_PLAN_PUBLISH: ${{ steps.vertical_plan.outputs.vertical_flagships }}
          VERTICAL_PUBLISH_OUTCOME: ${{ steps.vertical_publish.outcome }}
        run: python scripts/estate_child_completion.py

      - name: Preserve source-bound Lyte failure diagnostics
        if: ${{ always() && hashFiles('hf-lyte-enterprise-manifest.failed.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-lyte-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hf-lyte-enterprise-manifest.failed.json
            hf-lyte-enterprise-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload immutable vertical publication receipt
        if: ${{ always() && steps.exact_main_owner.outputs.publish == 'true' && steps.vertical_plan.outputs.vertical_flagships == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-vertical-flagships-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hf-vertical-flagships-receipt.json
            hf-lyte-enterprise-receipt.json
            hf-lyte-enterprise-manifest.failed.json
            hf-lyte-release-evidence/
          if-no-files-found: error
          retention-days: 180

  readiness-verdict:
    name: Probe and ingest exact post-deploy readiness verdict
    needs: runtime-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    env:
      SOURCE_SHA: ${{ github.sha }}
      VERDICT_PATH: /tmp/readiness-verdict.json
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Probe the exact canonical deployment
        run: >-
          node tools/readiness-harness/probe_runner.mjs
          --base "$CANONICAL_ORIGIN"
          --samples 1
          --concurrency 2
          --retries 2
          --await-readiness
          --soft
          --out "$VERDICT_PATH"

      - name: Upload immutable full probe evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-a11oy-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.VERDICT_PATH }}
          if-no-files-found: error
          retention-days: 90

      # The same fail-closed verdict gate (lies, unreachable, throttled,
      # degraded, stale or foreign source), but no Space variable write: that
      # write would restart the revision this run just started once. The
      # compact verdict is handed to relock as a job output and re-validated.
      - name: Validate the source-bound verdict without a Space write
        id: gate
        run: >-
          python .github/scripts/publish_readiness_verdict.py
          --validate-only
          --input "$VERDICT_PATH"
          --expected-origin "$CANONICAL_ORIGIN"
          --expected-source-sha "$SOURCE_SHA"
          --github-output "$GITHUB_OUTPUT"

  relock:
    name: Prove exact live source, runtime, routes, and singleton state
    needs: [runtime-config, readiness-verdict]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      current_main: ${{ steps.post_deploy_owner.outputs.publish }}
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact read-only verification clients
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.23.0"
          "requests==2.32.5"

      # The live route honestly serves no verdict (the deploy path never writes
      # one into the Space); relock re-validates this run's verdict instead.
      - name: Evaluate the canonical application contract
        id: verify
        shell: bash
        env:
          RUN_READINESS_VERDICT: ${{ needs.readiness-verdict.outputs.verdict }}
        run: |
          set +e
          printf '%s' "$RUN_READINESS_VERDICT" > "$RUNNER_TEMP/run-readiness-verdict.json"
          python .github/scripts/verify_canonical_a11oy.py \
            --repo-id "$CANONICAL_SPACE" \
            --origin "$CANONICAL_ORIGIN" \
            --source-sha "$SOURCE_SHA" \
            --source-variable SZL_GIT_SHA \
            --readiness-verdict-file "$RUNNER_TEMP/run-readiness-verdict.json" \
            --output "$REPORT_PATH" \
            --attempts 60 \
            --retry-seconds 10
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Re-admit exact current main after live verification
        id: post_deploy_owner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/hf_exact_main_ownership.py \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/post-deploy-source-admission.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload immutable relock evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-a11oy-relock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.REPORT_PATH }}
            ${{ runner.temp }}/post-deploy-source-admission.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain the verification outcome without issue mutation
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          case "${EXIT_CODE:-2}" in
            0) outcome=PASS ;;
            *) outcome=FAIL ;;
          esac
          printf 'Canonical verification outcome: %s. See the immutable relock artifact.\n' "$outcome" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce exact live state
        if: always()
        env:
          EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
          CURRENT_MAIN: ${{ steps.post_deploy_owner.outputs.publish }}
        run: |
          code="${EXIT_CODE:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::Canonical A11oy relock failed with exit ${code}."
            exit "$code"
          fi
          if [ "${CURRENT_MAIN:-false}" != 'true' ]; then
            echo '::notice::A newer protected main superseded this verified source; that run deploys and relocks it.'
            exit 0
          fi
          echo 'Canonical A11oy is source-bound, singleton, and route-operational.'

  post-deployment-parity:
    name: Await strict live and repository parity
    needs: relock
    # A superseded source is not current main, so repository parity belongs
    # to the newer run that deploys it.
    if: ${{ needs.relock.outputs.current_main == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/hf-module-drift.yml

  terminal-source-authorization:
    name: Re-authorize exact protected main after all publication proofs
    needs: [relock, post-deployment-parity, publish-vertical-flagships]
    if: ${{ always() && needs.relock.result == 'success' && (needs.post-deployment-parity.result == 'success' || (needs.post-deployment-parity.result == 'skipped' && needs.relock.outputs.current_main != 'true')) && (needs.publish-vertical-flagships.result == 'success' || needs.publish-vertical-flagships.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout the immutable completed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Re-authorize exact protected main after awaited parity
        id: terminal_owner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/hf_exact_main_ownership.py \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/terminal-source-authorization.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Retain terminal source authorization
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-source-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-source-authorization.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-read and enforce exact protected-main ownership as the final step
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/hf_exact_main_ownership.py \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/terminal-source-authorization-final.json" \
            --github-output "$RUNNER_TEMP/terminal-source-authorization-final.out"
          if ! grep -Fqx 'publish=true' "$RUNNER_TEMP/terminal-source-authorization-final.out"; then
            echo '::notice::A newer protected main superseded this completed publication; that run owns the next one.'
            exit 0
          fi
          echo 'Completed A11oy publication remains exact protected main.'
