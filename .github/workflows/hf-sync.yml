name: Sync and Relock Canonical Hugging Face Space

# Permanent source-derived deployment path. The pinned reusable controller derives
# the exact Space file set from Dockerfile COPY sources, publishes and byte-attests
# the immutable runtime, binds the exact checked-out Git SHA, and verifies the live
# build-info contract. This caller retains only A11oy-specific terminal evidence.
# The main-push trigger intentionally has no path filter: every Dockerfile source
# change enters this canonical workflow; this checkpoint retains the inspection hold.
#
# This reviewed source selects a bounded read-only inspection after admission.
# Preservation, reconciliation and pair configuration are literally disabled;
# the inspection exits HELD, so downstream publication cannot become eligible.
# The permanent target remains Space SZLHOLDINGS/a11oy (szlholdings-a11oy.hf.space).
# Staging Space ≠ prod DNS. GitHub main SHA and Space runtime SHA can drift;
# do not claim they match. This workflow does not change DNS. Apex a-11-oy.com
# stays Cloudflare orange-cloud (proxied). HF custom domain stays
# PENDING/UNAVAILABLE in product. Stephen may later add the HF verify TXT
# (_huggingface.a-11-oy.com) WITHOUT dropping that proxy. Keep orange-cloud.
# Do not grey-cloud. Do not stamp LIVE. www.a-11-oy.com GET / is
# Cloudflare HTTP 404 (UNAVAILABLE until Cloudflare 301 www → apex).
# Do not add a second HF custom domain. This workflow does not change DNS.
# x-szl-wire-d LIVE is DSSE Wire D provenance, not domain LIVE.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_vertical_flagships:
        description: Publish six domain-native flagship Spaces. Default false until plan complete=true.
        type: boolean
        default: false

      vertical_plan_json:
        description: Complete approved plan JSON with expected_source_revision bound to exact A11oy main; not a production-readiness certificate.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: sync-relock-canonical-a11oy
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  CANONICAL_SPACE: SZLHOLDINGS/a11oy
  CANONICAL_ORIGIN: https://szlholdings-a11oy.hf.space
  REPORT_PATH: reports/canonical-a11oy-relock-v4.json

jobs:
  source-admission:
    name: Admit the queued source before provider mutation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.owner.outputs.publish }}
      artifact_id: ${{ steps.source_artifact.outputs.artifact-id }}
      artifact_sha256: ${{ steps.source_artifact.outputs.artifact-digest }}
    steps:
      - name: Checkout the immutable queued source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Require main and classify current source ownership
        id: owner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          python3 -B scripts/hf_exact_main_ownership.py \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/canonical-source-admission.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Retain the source admission decision
        id: source_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-source-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canonical-source-admission.json
          if-no-files-found: error
          retention-days: 90

  recovery-reconciliation:
    name: Reconcile the held acquisition before provider mutation
    needs: source-admission
    # The 62ca attempt entered artifact publication with effects unknown.
    # This source cannot reuse the old absence result as retry authority.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && needs.source-admission.result == 'success' && needs.source-admission.outputs.publish == 'true' && false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      admitted: ${{ steps.reconciliation.outputs.admitted }}
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout the exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up the isolated reconciliation interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the exact read-only reconciliation ABI
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface_hub==1.31.0" "requests==2.32.5" "cryptography==50.0.1"
      - name: Require the fixed inspection and unchanged absent private fence
        id: reconciliation
        # The helper admits only the signed direct successor of the inspected
        # source, its unique first push run, and the exact still-absent HEAD.
        # This step performs metadata reads only, before any new private copy.
        run: >-
          python -B scripts/acquire_gdw_durable_storage.py --reconcile-supervised-acquisition
          --github-output "$GITHUB_OUTPUT"
          --output "$RUNNER_TEMP/gdw-supervised-reconciliation.json"
      - name: Retain the bounded read-only reconciliation decision
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-supervised-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gdw-supervised-reconciliation.json
          if-no-files-found: error
          retention-days: 90

  manual-prerequisites:
    name: Check manual authority prerequisites before provider writes
    needs: [source-admission, recovery-reconciliation]
    # Preserve the original authority predicates and exact 1.23.0 helper bytes.
    # The literal hold makes all private capture copies unreachable in this source.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && needs.source-admission.outputs.publish == 'true' && needs.recovery-reconciliation.result == 'success' && needs.recovery-reconciliation.outputs.admitted == 'true' && false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.recovery_mode.outputs.mode }}
      artifact_id: ${{ steps.prerequisite_artifact.outputs.artifact-id }}
      artifact_sha256: ${{ steps.prerequisite_artifact.outputs.artifact-digest }}
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
    steps:
      - name: Checkout the immutable admitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact metadata client
        # cryptography parses the live runtime public key for the pinned
        # installed-authority check (scripts/verify_installed_authority.py).
        run: python -m pip install --disable-pip-version-check "huggingface_hub==1.23.0" "requests==2.32.5" "cryptography==50.0.1"
      # Incident recovery acquisition runs before live-signer qualification:
      # that runtime is unavailable when GDW's integrity guard blocks startup.
      # The helper rechecks exact main and copies only observed Xet identities
      # into a new prefix of the existing private evidence bucket. It cannot
      # restart a Space, change originals, repair SQLite, or admit deployment.
      - name: Preserve stopped private stores before any runtime mutation
        id: preserve_stores
        continue-on-error: true
        run: >-
          python -B scripts/preserve_hf_gdw_store.py
          --supervised-acquisition
          --output "${{ runner.temp }}/gdw-store-preservation.json"
      # The verified incident capture is an immutable, source-pinned input.
      # This read-only follow-up runs after the acquisition guard's expected
      # blocked exit. Candidate bytes stay private and are never promoted.
      - name: Qualify the pinned private capture without admitting restore
        id: qualify_stores
        if: ${{ always() && steps.preserve_stores.outcome == 'failure' }}
        continue-on-error: true
        run: >-
          python -B scripts/qualify_gdw_store_recovery.py
          --capture-report docs/operations/evidence/gdw-capture-37223162231.json
          --historical-anchors docs/operations/evidence/gdw-recovery-historical-anchors.json
          --output "${{ runner.temp }}/gdw-store-recovery-qualification.json"
      - name: Classify the exact native candidate without admitting deployment
        id: recovery_mode
        if: ${{ always() }}
        run: >-
          python -B scripts/acquire_gdw_durable_storage.py --classify-prerequisites
          --preservation "${{ runner.temp }}/gdw-store-preservation.json"
          --qualification "${{ runner.temp }}/gdw-store-recovery-qualification.json"
          --github-output "$GITHUB_OUTPUT"
          --output "${{ runner.temp }}/manual-prerequisites.json"
      - name: Retain metadata checks and fail closed on UNKNOWN authority
        if: ${{ steps.recovery_mode.outputs.mode != 'managed-recovery' && steps.recovery_mode.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          python -B scripts/configure_hf_series_a_runtime.py \
            --repo-id "$CANONICAL_SPACE" --check-only \
            --output "$RUNNER_TEMP/manual-series-a.json"
          series_code=$?
          python -B scripts/configure_hf_gdw_runtime.py \
            --repo-id "$CANONICAL_SPACE" --check-only \
            --output "$RUNNER_TEMP/manual-gdw.json"
          gdw_code=$?
          set -euo pipefail
          python -B scripts/check_hf_manual_prerequisites.py \
            --series-a "$RUNNER_TEMP/manual-series-a.json" --series-a-exit "$series_code" \
            --gdw "$RUNNER_TEMP/manual-gdw.json" --gdw-exit "$gdw_code" \
            --source-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/manual-prerequisites.json"
      - name: Retain bounded prerequisite decision
        id: prerequisite_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-manual-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
          # Exact allowlist: raw captures, SQLite copies and SDK caches stay in
          # a private TemporaryDirectory and are never Actions artifacts.
          path: |
            ${{ runner.temp }}/manual-prerequisites.json
            ${{ runner.temp }}/gdw-store-preservation.json
            ${{ runner.temp }}/gdw-store-recovery-qualification.json
          if-no-files-found: error
          retention-days: 90

  durable-acquisition:
    name: Acquire qualified private storage through the canonical publisher
    needs: [source-admission, recovery-reconciliation, manual-prerequisites]
    # Retain the native job identity and dependency graph. Only the owned first
    # push may inspect through both literal holds; successful copies cannot enter.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && always() && needs.source-admission.result == 'success' && needs.source-admission.outputs.publish == 'true' && needs.recovery-reconciliation.result == 'skipped' && needs.manual-prerequisites.result == 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.acquisition_artifact.outputs.artifact-id }}
      artifact_sha256: ${{ steps.acquisition_artifact.outputs.artifact-digest }}
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout the exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Read the existing immutable COPY publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/.github
          ref: e3ec47ad2e99a535839afe0f30fefbd8973d52da
          path: .gdw-source-publisher
          persist-credentials: false
          fetch-depth: 1
      - name: Set up the isolated acquisition interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the exact managed acquisition ABI
        # The prior preservation/qualification job retains its exact 1.23.0
        # interpreter. No environment is silently upgraded across those jobs.
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface_hub==1.31.0" "requests==2.32.5" "cryptography==50.0.1"
      - name: Inspect the held prior acquisition without provider mutation
        # The separate fixed 62ca reader binds the native failure artifact
        # before bounded dataset metadata reads; prior private effects stay unknown.
        # Every result exits 2/HELD; no acquisition, retry or locator is admitted.
        run: >-
          python -B scripts/acquire_gdw_durable_storage.py --inspect-held-acquisition
          --output "$RUNNER_TEMP/gdw-durable-acquisition.json"
      - name: Install the persistent old-source guard and both managed configurations once
        # Inspection never supplies an acquisition locator. Keep the existing
        # pair command literally disabled even if a prior step's result changes.
        if: ${{ github.ref == 'refs/heads/main' && false }}
        run: >-
          python -B scripts/configure_hf_gdw_runtime.py
          --managed-acquisition "$RUNNER_TEMP/gdw-durable-acquisition.json"
          --source-sha "$GITHUB_SHA" --managed-deadline-seconds 120
          --output "$RUNNER_TEMP/gdw-managed-configuration.json"
      - name: Retain only the bounded inspection metadata report
        id: acquisition_artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-durable-acquisition-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gdw-durable-acquisition.json
          if-no-files-found: error
          retention-days: 90

  resume-paused-space:
    name: Resume the canonical Space without changing its allocation
    needs: [source-admission, manual-prerequisites]
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && needs.source-admission.outputs.publish == 'true' && needs.manual-prerequisites.result == 'success' && needs.manual-prerequisites.outputs.mode != 'managed-recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      RESUME_REPORT: /tmp/canonical-a11oy-resume.json
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact Hugging Face control client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.23.0"

      - name: Resume only an explicitly paused canonical runtime
        run: >-
          python .github/scripts/resume_hf_space.py
          --repo-id "$CANONICAL_SPACE"
          --output "$RESUME_REPORT"

      - name: Upload immutable resume evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-a11oy-resume-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESUME_REPORT }}
          if-no-files-found: error
          retention-days: 90

  runtime-config:
    name: Verify post-deploy configuration and bounded live proofs
    needs: [manual-prerequisites, durable-acquisition, deploy]
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && always() && needs.manual-prerequisites.result == 'success' && needs.durable-acquisition.result == 'success' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      RUNTIME_CONFIG_REPORT: /tmp/series-a-runtime-config.json
      SERIES_A_LIVE_REPORT: /tmp/series-a-restart-proof.json
      GDW_CONFIG_REPORT: /tmp/gdw-runtime-config.json
      GDW_LIVE_REPORT: /tmp/gdw-live-proof.json
      LIVE_PROOF_ADMISSION_REPORT: /tmp/live-proof-admission.json
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact Hugging Face control client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.31.0"
          "requests==2.32.5"
          "cryptography==50.0.1"

      - name: Read the exact same-run managed selector without granting local-file authority
        run: >-
          python -B scripts/acquire_gdw_durable_storage.py --fetch-locator
          --acquisition-artifact-id "${{ needs.durable-acquisition.outputs.artifact_id }}"
          --acquisition-artifact-sha256 "${{ needs.durable-acquisition.outputs.artifact_sha256 }}"
          --output "$RUNNER_TEMP/gdw-durable-acquisition.json"

      - name: Converge fail-closed runtime configuration
        if: ${{ needs.manual-prerequisites.outputs.mode != 'managed-recovery' }}
        run: >-
          python scripts/configure_hf_series_a_runtime.py
          --repo-id "$CANONICAL_SPACE"
          --bucket "SZLHOLDINGS/szl-evidence"
          --output "$RUNTIME_CONFIG_REPORT"

      - name: Converge isolated GDW successor configuration
        if: ${{ needs.manual-prerequisites.outputs.mode != 'managed-recovery' }}
        run: >-
          python scripts/configure_hf_gdw_runtime.py
          --repo-id "$CANONICAL_SPACE"
          --output "$GDW_CONFIG_REPORT"

      # Bounded (scripts/hf_live_proof_bounds.py): exact destinations only, no
      # redirects, fixed diagnostic codes, 8 attempts / 10 minutes for
      # transient admission, effects limited to SZLHOLDINGS/a11oy.
      - name: Prove live Series-A restart persistence (bounded)
        id: series_a_proof
        shell: bash
        run: |
          set +e
          python -B scripts/prove_hf_series_a_restart.py \
            --repo-id "$CANONICAL_SPACE" --origin "$CANONICAL_ORIGIN" \
            --managed-acquisition "$RUNNER_TEMP/gdw-durable-acquisition.json" \
            --run-context "${{ github.run_id }}:${{ github.run_attempt }}" \
            --source-sha "${{ github.sha }}" --output "$SERIES_A_LIVE_REPORT"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      # Writes only in the a11oy GDW namespace; the proof-tagged receipt must
      # verify against ayllu/keys/council-runtime-2026-07-21.pub.
      - name: Prove live GDW write, drain, and receipt integrity (bounded)
        id: gdw_proof
        if: ${{ always() && needs.manual-prerequisites.result == 'success' && needs.deploy.result == 'success' && (steps.series_a_proof.outcome == 'success' || steps.series_a_proof.outcome == 'failure') }}
        shell: bash
        env:
          GDW_OPERATOR_TOKEN: ${{ secrets.GDW_OPERATOR_TOKEN }}
        run: |
          set +e
          python -B scripts/prove_hf_gdw_runtime.py \
            --series-a-proof "$SERIES_A_LIVE_REPORT" \
            --run-context "${{ github.run_id }}:${{ github.run_attempt }}" \
            --origin "$CANONICAL_ORIGIN" \
            --managed-acquisition "$RUNNER_TEMP/gdw-durable-acquisition.json" \
            --source-sha "${{ github.sha }}" --output "$GDW_LIVE_REPORT"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Admit bounded live proof reports and fail closed
        if: ${{ always() && needs.manual-prerequisites.result == 'success' && needs.deploy.result == 'success' }}
        shell: bash
        env:
          SERIES_A_PROOF_EXIT: ${{ steps.series_a_proof.outputs.exit_code }}
          GDW_PROOF_EXIT: ${{ steps.gdw_proof.outputs.exit_code }}
        run: |
          set -euo pipefail
          python -B scripts/check_hf_manual_prerequisites.py --admit-live-proofs \
            --managed-acquisition "$RUNNER_TEMP/gdw-durable-acquisition.json" \
            --series-a-proof "$SERIES_A_LIVE_REPORT" --series-a-proof-exit "${SERIES_A_PROOF_EXIT:-2}" \
            --gdw-proof "$GDW_LIVE_REPORT" --gdw-proof-exit "${GDW_PROOF_EXIT:-2}" \
            --source-sha "${{ github.sha }}" --output "$LIVE_PROOF_ADMISSION_REPORT"

      - name: Upload secret-free runtime configuration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: series-a-runtime-config-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RUNTIME_CONFIG_REPORT }}
            ${{ env.SERIES_A_LIVE_REPORT }}
            ${{ env.GDW_CONFIG_REPORT }}
            ${{ env.GDW_LIVE_REPORT }}
            ${{ env.LIVE_PROOF_ADMISSION_REPORT }}
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy, source-bind, and attest exact surface
    needs: [source-admission, manual-prerequisites, durable-acquisition, resume-paused-space]
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && always() && needs.source-admission.outputs.publish == 'true' && needs.manual-prerequisites.result == 'success' && ((needs.manual-prerequisites.outputs.mode == 'managed-recovery' && needs.durable-acquisition.result == 'success') || (needs.manual-prerequisites.outputs.mode != 'managed-recovery' && needs.resume-paused-space.result == 'success')) }}
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@e3ec47ad2e99a535839afe0f30fefbd8973d52da
    with:
      hf-repo: SZLHOLDINGS/a11oy
      ref: ${{ github.sha }}
      # Recheck next to the provider commit if main advances after admission.
      require-default-branch-tip: true
      dockerfile-path: Dockerfile
      include-readme: true
      prune: true
      wait-running: 1200
      restart-space: true
      source-revision-variable: SZL_GIT_SHA
      source-revision-probe-path: /api/build-info
      smoke-paths: '["/","/api/livez","/api/build-info","/api/a11oy/v1/honest","/api/a11oy/healthz","/api/a11oy/v1/brain/capabilities","/api/a11oy/v1/readiness/tab-matrix?view=summary","/api/a11oy/v1/series-a/status","/holographic","/holographic/","/static/3d/holographic.html","/assets/brain-frontier-v7.css","/assets/brain-frontier-v7.js","/assets/brain-frontier-v7.json","/static/landing-honest-bind.js","/atelier/frontier","/api/a11oy/v1/atelier/frontier/registry","/api/a11oy/v1/atelier/frontier/evaluate?evidence=90&repeatability=90&coverage=90&governance=90&safety=1&energy_state=UNAVAILABLE","/api/a11oy/v1/atelier/frontier/evaluate?safety=0"]'
    secrets:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}

  publish-vertical-flagships:
    name: Publish and live-verify six domain-native flagship Spaces
    # Other-Space execute is not product promote. Skip on push until plan complete=true.
    # Explicit opt-in includes this publisher in the requested run completion.
    # Product-only pushes still skip it; canonical product evidence stays separate.
    if: ${{ github.run_attempt == 1 && needs.manual-prerequisites.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish_vertical_flagships }}
    needs: [manual-prerequisites, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: hf-vertical-estate
      cancel-in-progress: false
    env:
      HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
      HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert the workflow owns exact protected main
        id: exact_main_owner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/hf_exact_main_ownership.py \
            --repository "$GITHUB_REPOSITORY" \
            --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/hf-main-ownership.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload exact-main ownership receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned
        with:
          name: hf-main-ownership-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hf-main-ownership.json
          if-no-files-found: error
          retention-days: 90
      - name: Set up Python
        if: ${{ steps.exact_main_owner.outputs.publish == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require the approved plan for the actual vertical source
        id: vertical_plan
        if: ${{ steps.exact_main_owner.outputs.publish == 'true' }}
        env:
          VERTICAL_PLAN_JSON: ${{ inputs.vertical_plan_json }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/estate_repair_dispatch.py \
            --repair true --vertical-requested true --plan-from-env \
            --expected-sha "$GITHUB_SHA" --current-sha "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --require-vertical \
            --github-output "$GITHUB_OUTPUT" \
            > "$RUNNER_TEMP/hf-vertical-plan.json"

      - name: Upload the vertical plan decision without raw operator input
        if: ${{ always() && steps.exact_main_owner.outputs.publish == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-vertical-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hf-vertical-plan.json
          if-no-files-found: error
          retention-days: 180

      - name: Install pinned vertical publisher
        if: ${{ steps.exact_main_owner.outputs.publish == 'true' && steps.vertical_plan.outputs.vertical_flagships == 'true' }}
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface_hub==1.31.0"

      - name: Publish and verify the v4 vertical estate
        id: vertical_publish
        if: ${{ steps.exact_main_owner.outputs.publish == 'true' && steps.vertical_plan.outputs.vertical_flagships == 'true' }}
        run: python scripts/hf_publish_vertical_flagships_v4.py

      - name: Enforce complete explicitly requested vertical publication
        if: always()
        env:
          EXACT_MAIN_PUBLISH: ${{ steps.exact_main_owner.outputs.publish }}
          VERTICAL_PLAN_PUBLISH: ${{ steps.vertical_plan.outputs.vertical_flagships }}
          VERTICAL_PUBLISH_OUTCOME: ${{ steps.vertical_publish.outcome }}
        run: python scripts/estate_child_completion.py

      - name: Preserve source-bound Lyte failure diagnostics
        if: ${{ always() && hashFiles('hf-lyte-enterprise-manifest.failed.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-lyte-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hf-lyte-enterprise-manifest.failed.json
            hf-lyte-enterprise-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload immutable vertical publication receipt
        if: ${{ always() && steps.exact_main_owner.outputs.publish == 'true' && steps.vertical_plan.outputs.vertical_flagships == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-vertical-flagships-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hf-vertical-flagships-receipt.json
            hf-lyte-enterprise-receipt.json
            hf-lyte-enterprise-manifest.failed.json
            hf-lyte-release-evidence/
          if-no-files-found: error
          retention-days: 180

  publish-finance-projection:
    name: Rebind and functionally verify the existing Finance projection
    # Finance validates the exact backend SHA, so every successful canonical
    # relock must update it through the same established scoped publisher.
    # An explicitly requested estate publication already owns Finance.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && needs.manual-prerequisites.result == 'success' && (github.event_name == 'push' || !inputs.publish_vertical_flagships) }}
    needs: [manual-prerequisites, relock]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: hf-vertical-estate
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
      HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
      SZL_FLAGSHIP_SCOPE: finance
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout the exact relocked source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Admit only the current protected main owner
        id: owner
        run: >-
          python3 -B scripts/hf_exact_main_ownership.py
          --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA"
          --receipt "$RUNNER_TEMP/finance-main-ownership.json"
          --github-output "$GITHUB_OUTPUT"
      - name: Set up Python
        if: ${{ steps.owner.outputs.publish == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the established pinned publisher
        if: ${{ steps.owner.outputs.publish == 'true' }}
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'huggingface_hub==1.31.0'
      - name: Publish exactly Finance and require public functional evidence
        if: ${{ steps.owner.outputs.publish == 'true' }}
        run: python scripts/hf_publish_vertical_flagships_v4.py
      - name: Retain ownership and functional publication receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finance-projection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/finance-main-ownership.json
            hf-vertical-flagships-receipt.json
          if-no-files-found: error
          retention-days: 180

  readiness-verdict:
    name: Probe and ingest exact post-deploy readiness verdict
    needs: [manual-prerequisites, runtime-config]
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      SOURCE_SHA: ${{ github.sha }}
      VERDICT_PATH: /tmp/readiness-verdict.json
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact verdict publisher
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.23.0"

      - name: Probe the exact canonical deployment
        run: >-
          node tools/readiness-harness/probe_runner.mjs
          --base "$CANONICAL_ORIGIN"
          --samples 1
          --concurrency 2
          --retries 2
          --soft
          --out "$VERDICT_PATH"

      - name: Upload immutable full probe evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-a11oy-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.VERDICT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish compact source-bound verdict to the runtime
        run: >-
          python .github/scripts/publish_readiness_verdict.py
          --input "$VERDICT_PATH"
          --repo-id "$CANONICAL_SPACE"
          --expected-origin "$CANONICAL_ORIGIN"
          --expected-source-sha "$SOURCE_SHA"

  relock:
    name: Prove exact live source, runtime, routes, and singleton state
    needs: [manual-prerequisites, runtime-config, readiness-verdict]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact read-only verification clients
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.23.0"
          "requests==2.32.5"

      - name: Evaluate the canonical application contract
        id: verify
        shell: bash
        run: |
          set +e
          python .github/scripts/verify_canonical_a11oy.py \
            --repo-id "$CANONICAL_SPACE" \
            --origin "$CANONICAL_ORIGIN" \
            --source-sha "$SOURCE_SHA" \
            --source-variable SZL_GIT_SHA \
            --output "$REPORT_PATH" \
            --attempts 60 \
            --retry-seconds 10
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Re-admit exact current main after live verification
        id: post_deploy_owner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/hf_exact_main_ownership.py \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/post-deploy-source-admission.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload immutable relock evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-a11oy-relock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.REPORT_PATH }}
            ${{ runner.temp }}/post-deploy-source-admission.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain the verification outcome without issue mutation
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          case "${EXIT_CODE:-2}" in
            0) outcome=PASS ;;
            *) outcome=FAIL ;;
          esac
          printf 'Canonical verification outcome: %s. See the immutable relock artifact.\n' "$outcome" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce exact live state
        if: always()
        env:
          EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
          CURRENT_MAIN: ${{ steps.post_deploy_owner.outputs.publish }}
        run: |
          code="${EXIT_CODE:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::Canonical A11oy relock failed with exit ${code}."
            exit "$code"
          fi
          if [ "${CURRENT_MAIN:-false}" != 'true' ]; then
            echo '::error::Canonical A11oy relock source is no longer current protected main.'
            exit 3
          fi
          echo 'Canonical A11oy is source-bound, singleton, and route-operational.'

  post-deployment-parity:
    name: Await strict live and repository parity
    needs: relock
    permissions:
      contents: read
    uses: ./.github/workflows/hf-module-drift.yml

  terminal-source-authorization:
    name: Re-authorize exact protected main after all publication proofs
    needs: [post-deployment-parity, publish-vertical-flagships, publish-finance-projection]
    if: ${{ always() && needs.post-deployment-parity.result == 'success' && (needs.publish-vertical-flagships.result == 'success' || needs.publish-vertical-flagships.result == 'skipped') && (needs.publish-finance-projection.result == 'success' || needs.publish-finance-projection.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout the immutable completed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Re-authorize exact protected main after awaited parity
        id: terminal_owner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/hf_exact_main_ownership.py \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/terminal-source-authorization.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Retain terminal source authorization
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-source-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-source-authorization.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-read and enforce exact protected-main ownership as the final step
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/hf_exact_main_ownership.py \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/terminal-source-authorization-final.json" \
            --github-output "$RUNNER_TEMP/terminal-source-authorization-final.out"
          if ! grep -Fqx 'publish=true' "$RUNNER_TEMP/terminal-source-authorization-final.out"; then
            echo '::error::Completed A11oy publication is no longer exact protected main.'
            exit 3
          fi
          echo 'Completed A11oy publication remains exact protected main.'
