name: Publish Packet 8 vertical Hugging Face Spaces

# Thin Docker adapters for Terra, Aegis, Puriq Markets and Counsel.
# Uses org HF_ORG_TOKEN || HF_TOKEN. Creates/updates private Spaces.
# Does not wait for RUNNING. Does not stamp LIVE. Does not touch
# the canonical SZLHOLDINGS/a11oy Space (see hf-sync.yml).

on:
  push:
    branches: [main]
    paths:
      - 'huggingface/spaces/**'
      - 'verticals/**'
      - '.github/workflows/hf-packet8-vertical-spaces.yml'
      - '.github/scripts/publish_packet8_vertical_spaces.py'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: packet8-vertical-spaces
  cancel-in-progress: false

jobs:
  publish:
    name: Upload private Packet 8 Space adapters
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      EVIDENCE: /tmp/packet8-hub-publish.json
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact Hugging Face control client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.23.0"

      - name: Publish four private Docker Spaces
        run: >-
          python .github/scripts/publish_packet8_vertical_spaces.py
          --root .
          --source-sha "${{ github.sha }}"
          --output "$EVIDENCE"

      - name: Upload immutable publish evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packet8-hub-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
