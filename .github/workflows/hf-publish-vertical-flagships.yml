# SPDX-License-Identifier: Apache-2.0
name: Materialize A11oy mobile Public Experience repair once

on:
  push:
    branches:
      - fix/a11oy-mobile-public-experience-v3-2
    paths:
      - .github/workflows/hf-publish-vertical-flagships.yml

permissions:
  contents: write

concurrency:
  group: a11oy-mobile-public-experience-v3-2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require a current-main-rooted workflow-only bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/a11oy-mobile-public-experience-v3-2
          git fetch --no-tags origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          test "$(git merge-base HEAD "$current_main")" = "$current_main"
          mapfile -t changed < <(git diff --name-only "$current_main" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = .github/workflows/hf-publish-vertical-flagships.yml

      - name: Materialize and validate the exact landing repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          landing = Path("a11oy_landing.html")
          text = landing.read_text(encoding="utf-8")
          old_root = '<html lang="en">'
          new_root = '<html lang="en" data-szl-public-experience-v3="true" data-szl-space-holo-v2="true" data-szl-zoom-tier="normal">'
          if new_root not in text:
              if text.count(old_root) != 1:
                  raise SystemExit("landing lacks one exact HTML root")
              text = text.replace(old_root, new_root, 1)

          style = """<style id="szl-public-experience-v3-2">
          html[data-szl-public-experience-v3="true"],html[data-szl-public-experience-v3="true"] body{max-inline-size:100%;overflow-x:clip}
          html[data-szl-public-experience-v3="true"] :where(main,section,article,aside,header,footer,nav,div){min-inline-size:0}
          html[data-szl-public-experience-v3="true"] :where(.skip-link,.origin-banner a,header.nav .brand,.szl-flow-rail a,a[href*="ledger"],.audience-paths a){display:inline-flex;align-items:center;min-block-size:44px;max-inline-size:100%;touch-action:manipulation}
          html[data-szl-public-experience-v3="true"] .origin-banner a{padding-inline:8px}
          html[data-szl-public-experience-v3="true"] .skip-link{padding-block:10px}
          .audience-paths{padding-block:clamp(48px,8vw,96px)}.audience-paths>p{max-inline-size:68ch;color:var(--sub)}
          .audience-path-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-block-start:24px}
          .audience-paths a{min-block-size:132px!important;padding:20px;border:1px solid var(--border);border-radius:var(--r);background:rgba(255,255,255,.035);flex-direction:column;align-items:flex-start!important;justify-content:center;gap:6px}
          .audience-paths a:hover{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.07)}
          .audience-paths span{color:var(--ghost);font:600 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase}
          .audience-paths strong{font:650 clamp(18px,2vw,24px)/1.2 var(--head)}.audience-paths small{color:var(--sub);line-height:1.5}
          html[data-szl-zoom-tier="high"] header.nav,html[data-szl-zoom-tier="extreme"] header.nav,html[style*="zoom: 2"] header.nav,html[style*="zoom:2"] header.nav,html[style*="zoom: 4"] header.nav,html[style*="zoom:4"] header.nav{position:relative!important;inset:auto!important;inline-size:auto!important;max-inline-size:100%!important;transform:none!important}
          html[data-szl-zoom-tier="high"] .szl-flow-rail,html[data-szl-zoom-tier="extreme"] .szl-flow-rail,html[style*="zoom: 2"] .szl-flow-rail,html[style*="zoom:2"] .szl-flow-rail,html[style*="zoom: 4"] .szl-flow-rail,html[style*="zoom:4"] .szl-flow-rail{position:relative!important;inset:auto!important;inline-size:auto!important;max-inline-size:100%!important;max-block-size:none!important;margin:8px!important;transform:none!important;overflow:auto!important;flex-wrap:wrap!important}
          @media(max-width:760px){.audience-path-grid{grid-template-columns:minmax(0,1fr)}.audience-paths a{min-block-size:112px!important}}
          @media(prefers-reduced-motion:reduce){.audience-paths a{transition:none!important}}
          @media(forced-colors:active){.audience-paths a{forced-color-adjust:auto}}
          </style>"""
          if 'id="szl-public-experience-v3-2"' not in text:
              if text.count("</head>") != 1:
                  raise SystemExit("landing lacks one closing head")
              text = text.replace("</head>", style + "</head>", 1)

          audience = """<section class="audience-paths wrap" aria-labelledby="audience-paths-title">
          <p class="mono">TASK-FIRST ENTRY POINTS</p><h2 id="audience-paths-title">Choose the view that matches your job.</h2>
          <p>The product, implementation evidence, and operating status stay separate so users, developers, and investors can verify the layer they need without navigating the entire estate.</p>
          <div class="audience-path-grid">
          <a href="/static/3d/holographic.html" aria-label="Open the A11oy operator experience"><span>Users and operators</span><strong>Run the governed experience</strong><small>Explore evidence-labelled operational surfaces and defensive workbenches.</small></a>
          <a href="https://github.com/szl-holdings/a11oy" target="_blank" rel="noopener" aria-label="Open the A11oy source repository"><span>Developers</span><strong>Inspect source and contracts</strong><small>Review APIs, tests, deployment authority, and reproducible evidence.</small></a>
          <a href="https://a11oy.net/status/" target="_blank" rel="noopener" aria-label="Open the independently attested estate status"><span>Investors and diligence</span><strong>Verify operating status</strong><small>Separate observed deployment evidence from modeled claims and roadmap work.</small></a>
          </div></section>"""
          if 'id="audience-paths-title"' not in text:
              if text.count("</main>") != 1:
                  raise SystemExit("landing lacks one closing main")
              text = text.replace("</main>", audience + "</main>", 1)

          runtime = """<script id="szl-public-experience-v3-runtime">(function(){'use strict';var r=document.documentElement,f=0;function s(){f=0;var z=Number.parseFloat(r.style.zoom||'1');if(!Number.isFinite(z)||z<=0)z=1;r.dataset.szlPublicExperienceV3='true';r.dataset.szlSpaceHoloV2='true';r.dataset.szlZoomTier=z>=3?'extreme':(z>=1.5?'high':'normal')}function q(){if(!f)f=window.requestAnimationFrame(s)}s();if(window.MutationObserver)new MutationObserver(q).observe(r,{attributes:true,attributeFilter:['style']});window.addEventListener('resize',q,{passive:true})}());</script>"""
          if 'id="szl-public-experience-v3-runtime"' not in text:
              if text.count("</body>") != 1:
                  raise SystemExit("landing lacks one closing body")
              text = text.replace("</body>", runtime + "</body>", 1)

          required = (
              'data-szl-public-experience-v3="true"',
              'data-szl-space-holo-v2="true"',
              'id="szl-public-experience-v3-2"',
              'id="szl-public-experience-v3-runtime"',
              'id="audience-paths-title"',
              'min-block-size:44px',
              'data-szl-zoom-tier="extreme"',
              'Users and operators',
              'Developers',
              'Investors and diligence',
              'header.nav',
              '.szl-flow-rail',
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f"landing repair is incomplete: {missing}")
          runtime_tail = text[text.index('id="szl-public-experience-v3-runtime"'):]
          for forbidden in ("fetch(", "localStorage", "sessionStorage", "document.cookie"):
              if forbidden in runtime_tail:
                  raise SystemExit(f"runtime contains prohibited behavior: {forbidden}")
          landing.write_text(text, encoding="utf-8")
          PY
          git show origin/main:.github/workflows/hf-publish-vertical-flagships.yml > .github/workflows/hf-publish-vertical-flagships.yml
          git add a11oy_landing.html .github/workflows/hf-publish-vertical-flagships.yml
          git diff --cached --check
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 2
          printf '%s\n' "${staged[@]}" | grep -Fx .github/workflows/hf-publish-vertical-flagships.yml
          printf '%s\n' "${staged[@]}" | grep -Fx a11oy_landing.html

      - name: Commit the permanent one-file result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Stephen Lutar'
          git config user.email 'stephenlutar2@gmail.com'
          git commit -m 'fix(frontend): make A11oy mobile, zoom-safe, and task-first' -m 'Add a static Public Experience v3 identity, exact audit-derived touch and 400 percent zoom containment, and distinct user, developer, and investor entry paths.' -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          test "$(git diff --name-only origin/main HEAD)" = a11oy_landing.html
          git push origin HEAD:fix/a11oy-mobile-public-experience-v3-2
