# SPDX-License-Identifier: Apache-2.0
name: Reconcile A11oy protected base to canonical HF once

on:
  push:
    branches:
      - exec/a11oy-protected-base-parity-20260903
    paths:
      - .github/workflows/hf-publish-vertical-flagships.yml

permissions:
  contents: read

concurrency:
  group: sync-relock-canonical-a11oy
  cancel-in-progress: false

jobs:
  verify-execution:
    runs-on: ubuntu-24.04
    outputs:
      main_sha: ${{ steps.bind.outputs.main_sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind to exact current protected main
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/exec/a11oy-protected-base-parity-20260903
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          test "$(git rev-parse HEAD^)" = "$main_sha"
          mapfile -t changed < <(git diff --name-only "$main_sha" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = .github/workflows/hf-publish-vertical-flagships.yml
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify-execution
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@e3ec47ad2e99a535839afe0f30fefbd8973d52da
    with:
      hf-repo: SZLHOLDINGS/a11oy
      ref: ${{ needs.verify-execution.outputs.main_sha }}
      dockerfile-path: Dockerfile
      include-readme: true
      prune: true
      wait-running: 1200
      restart-space: true
      source-revision-variable: SZL_GIT_SHA
      source-revision-probe-path: /api/build-info
      smoke-paths: '["/","/api/livez","/api/build-info","/static/3d/aegis-proof-cells/demo.json","/static/3d/aegis-proof-cells/engine.mjs"]'
    secrets:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}

  verify-live:
    needs: [verify-execution, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      EXPECTED_SHA: ${{ needs.verify-execution.outputs.main_sha }}
      ORIGIN: https://szlholdings-a11oy.hf.space
      REPORT: /tmp/a11oy-protected-base-parity.json
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Verify exact build and missing assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          origin = os.environ["ORIGIN"].rstrip("/")
          expected = os.environ["EXPECTED_SHA"].lower()
          paths = (
              "/api/build-info",
              "/static/3d/aegis-proof-cells/demo.json",
              "/static/3d/aegis-proof-cells/engine.mjs",
          )
          headers = {
              "User-Agent": "SZL-A11oy-Protected-Base-Parity/1.0",
              "Cache-Control": "no-cache, no-store",
          }

          def read(path):
              request = urllib.request.Request(origin + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return response.status, response.read(1_048_577)
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(65_536)

          deadline = time.monotonic() + 900
          result = {}
          while time.monotonic() < deadline:
              observations = {}
              for path in paths:
                  status, body = read(path)
                  observations[path] = {
                      "status": status,
                      "bytes": len(body),
                      "sha256": hashlib.sha256(body).hexdigest(),
                  }
                  if path == "/api/build-info":
                      try:
                          observations[path]["payload"] = json.loads(body.decode("utf-8"))
                      except Exception:
                          observations[path]["payload"] = {}
              build = observations["/api/build-info"]["payload"]
              revision = str((build.get("build") or {}).get("revision") or "").lower()
              result = {
                  "expected_sha": expected,
                  "observed_revision": revision,
                  "observations": observations,
              }
              if (
                  revision == expected
                  and all(item["status"] == 200 and item["bytes"] > 0 for item in observations.values())
              ):
                  result["ok"] = True
                  break
              time.sleep(10)
          else:
              result["ok"] = False

          Path(os.environ["REPORT"]).write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          if not result["ok"]:
              raise SystemExit("A11oy protected-base parity proof failed")
          PY

      - name: Upload immutable parity proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11oy-protected-base-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT }}
          if-no-files-found: error
          retention-days: 90
