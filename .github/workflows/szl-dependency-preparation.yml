name: Scoped dependency source preparation
on:
  push:
    branches: [szl/prepare-root-dependencies-20260914]
    paths: [.github/workflows/szl-dependency-preparation.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/szl/prepare-root-dependencies-20260914' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - name: Exact preparation source, no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Existing operational pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.33.3
      - name: Existing operational Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run exact source preparation with the observed ESM import correction
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          import textwrap
          raw = subprocess.check_output(['git', 'show', '60ccd72cdd3f79e361b6952d7636db078659e362:.github/workflows/szl-dependency-preparation.yml'])
          sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if sha != 'e2e4de30e6b71677f754a7bd2dc387692f9c2697':
              raise RuntimeError('reviewed preparation source moved')
          parts = raw.decode().split("          python - <<'PY'\n")
          if len(parts) != 3:
              raise RuntimeError('preparation block shape changed')
          code = textwrap.dedent(parts[1].split('          PY\n', 1)[0])
          old = "git('rev-parse', 'HEAD^') == BASE"
          if code.count(old) != 1:
              raise RuntimeError('parent anchor changed')
          code = code.replace(old, "git('rev-parse', 'HEAD^') == '60ccd72cdd3f79e361b6952d7636db078659e362'", 1)
          old = "    workspace = before['pnpm-workspace.yaml'].decode()"
          correction = """    test_path = 'tests/dependency-overrides.test.mjs'
              test_source = before[test_path]
              require(test_source.count(b\"import yaml from 'js-yaml';\") == 1, 'test import anchor changed')
              Path(test_path).write_bytes(test_source.replace(b\"import yaml from 'js-yaml';\", b\"import * as yaml from 'js-yaml';\", 1))
          """
          correction = textwrap.dedent(correction)
          correction = textwrap.indent(correction, '    ')
          if code.count(old) != 1:
              raise RuntimeError('source-test seam changed')
          code = code.replace(old, correction + old, 1)
          old = "expected_changes = {'pnpm-workspace.yaml', 'pnpm-lock.yaml', '.github/workflows/operational.yml'}"
          new = "expected_changes = {'pnpm-workspace.yaml', 'pnpm-lock.yaml', '.github/workflows/operational.yml', 'tests/dependency-overrides.test.mjs'}"
          if code.count(old) != 1:
              raise RuntimeError('tracked-diff anchor changed')
          code = code.replace(old, new, 1)
          exec(compile(code, '<reviewed-dependency-preparation>', 'exec'))
          PY
      - name: Store only tested content blobs, no ref or publication operations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          import textwrap
          raw = subprocess.check_output(['git', 'show', '60ccd72cdd3f79e361b6952d7636db078659e362:.github/workflows/szl-dependency-preparation.yml'])
          sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if sha != 'e2e4de30e6b71677f754a7bd2dc387692f9c2697':
              raise RuntimeError('reviewed blob preparation source moved')
          parts = raw.decode().split("          python - <<'PY'\n")
          if len(parts) != 3:
              raise RuntimeError('preparation block shape changed')
          code = textwrap.dedent(parts[2].split('          PY\n', 1)[0])
          exec(compile(code, '<reviewed-content-blob-store>', 'exec'))
          PY
      - name: Retain preparation and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-source-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-preparation-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
