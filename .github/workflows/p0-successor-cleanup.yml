name: P0 successor seed cleanup

on:
  push:
    branches:
      - codex/p0-a11oy-stage-20260811
    paths:
      - .github/workflows/p0-successor-cleanup.yml

permissions:
  contents: write

concurrency:
  group: p0-successor-seed-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: codex/p0-a11oy-successor-20260817
    steps:
      - name: Checkout controller lineage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Remove stale task-lane instructions and redundant proof fragments
        run: |
          set -euo pipefail
          git config user.name "a11oy-work-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main "$TARGET_BRANCH"
          git switch --force-create "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

          git rm -f --ignore-unmatch .codex/CODEX_CLOUD_ENVIRONMENT_20260811.md

          task=.codex/tasks/P0_CURRENT_MAIN_PRODUCTION_COMPLETION_20260811.md
          python - <<'PY'
          from pathlib import Path

          path = Path(".codex/tasks/P0_CURRENT_MAIN_PRODUCTION_COMPLETION_20260811.md")
          text = path.read_text(encoding="utf-8")
          banner = '''> **STATUS — SOURCE EXECUTION COMPLETED ON THE CURRENT-MAIN SUCCESSOR.**  
> This file is retained as an audit contract. Do not dispatch the closed seed PR #1261 or the retired work branch. The active promotion authority is the successor PR for `codex/p0-a11oy-successor-20260817`; its exact head, hosted checks, independent review, protected merge, deployment, and live readback remain authoritative.

'''
          if not text.startswith("> **STATUS — SOURCE EXECUTION COMPLETED"):
              text = banner + text
          path.write_text(text, encoding="utf-8")
          PY

          redundant=(
            artifacts/proof-packets/20260817-successor-lineage.md
            artifacts/proof-packets/20260817-successor-nonclaims.md
            artifacts/proof-packets/20260817-successor-scope.md
            artifacts/proof-packets/20260817-successor-checklist.md
            artifacts/proof-packets/20260817-successor-finality-boundary.md
            artifacts/proof-packets/20260817-successor-readiness.md
            artifacts/proof-packets/20260817-successor-promotion-gates.md
            artifacts/proof-packets/20260817-successor-review-boundary.md
            artifacts/proof-packets/20260817-successor-rollback.md
          )
          git rm -f --ignore-unmatch "${redundant[@]}"
          git add "$task"
          git diff --cached --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact test dependencies
        run: python -m pip install --require-hashes -r .github/requirements/ci-core.txt

      - name: Requalify cleaned source
        run: |
          set -euo pipefail
          python -m py_compile routers/memory_covenant.py routers/memory_worker.py routers/token_ingress_core.py routers/token_ingress.py routers/frontier_reads.py
          pytest -q tests/test_memory_covenant_runtime.py tests/test_memory_worker_runtime.py tests/test_token_ingress.py tests/test_demo_critical_routes.py
          git diff --cached --check

      - name: Commit and push cleanup
        run: |
          set -euo pipefail
          git commit \
            -m "chore(p0): retire stale seed instructions" \
            -m "Removes the closed PR #1261 environment handoff, labels the retained task as an audit contract, and consolidates redundant proof fragments before final review." \
            -m "Signed-off-by: a11oy-work-agent[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin "$TARGET_BRANCH"
