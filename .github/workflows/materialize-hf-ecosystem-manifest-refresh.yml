name: Materialize HF ecosystem manifest refresh

on:
  push:
    branches:
      - fix/hf-ecosystem-manifest-refresh-20260903
    paths:
      - ".github/workflows/materialize-hf-ecosystem-manifest-refresh.yml"

permissions:
  contents: write

concurrency:
  group: materialize-hf-ecosystem-manifest-refresh-20260903
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact refresh branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-ecosystem-manifest-refresh-20260903
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prove the collector contract
        run: |
          python3 scripts/test_audit_huggingface_ecosystem.py
          python3 -m py_compile scripts/audit_huggingface_ecosystem.py

      - name: Generate a fresh public manifest
        run: python3 scripts/audit_huggingface_ecosystem.py --output docs/huggingface-ecosystem-manifest.json

      - name: Validate exact generated revisions and canonical public-nine cardinality
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_huggingface_ecosystem.py --check --output docs/huggingface-ecosystem-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/huggingface-ecosystem-manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          counts = manifest["counts"]
          if counts.get("spaces") != 9:
              raise SystemExit(f"canonical public Space count must be 9, observed {counts.get('spaces')!r}")
          for kind in ("models", "datasets", "spaces"):
              if counts.get(kind, 0) < 1:
                  raise SystemExit(f"public {kind} inventory is unexpectedly empty")
              if counts[kind] != len(manifest["inventory"][kind]):
                  raise SystemExit(f"{kind} count does not match its inventory length")
          print(json.dumps(counts, sort_keys=True))
          PY
          git diff --check

      - name: Commit the manifest-only successor and remove this controller
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-hf-ecosystem-manifest-refresh.yml
          git config user.name "SZL HF Manifest Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add docs/huggingface-ecosystem-manifest.json .github/workflows/materialize-hf-ecosystem-manifest-refresh.yml
          if git diff --cached --quiet; then
            echo "The tracked manifest is already current."
            exit 0
          fi
          git commit -s -m "chore(hf): refresh the public ecosystem manifest"
          git push origin HEAD:fix/hf-ecosystem-manifest-refresh-20260903
