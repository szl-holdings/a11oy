# SPDX-License-Identifier: Apache-2.0
name: Finish Lyte source pin once

"on":
  push:
    branches:
      - fix/lyte-source-pin-a6a653b
    paths:
      - .github/workflows/finish-lyte-source-pin-once.yml

permissions:
  contents: write

concurrency:
  group: finish-lyte-source-pin-once
  cancel-in-progress: true

jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/lyte-source-pin-a6a653b
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Complete the exact source-pin replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = "a0479279505aded5c084d1644012829a1d93ad77"
          new = "a6a653b0d93a0d150b868a044642ce4f5c71d766"
          paths = (
              Path("scripts/hf_publish_lyte_enterprise.py"),
              Path("scripts/hf_publish_vertical_flagships_v4.py"),
              Path("tests/test_hf_publish_lyte_enterprise.py"),
              Path("tests/test_hf_publish_vertical_flagships_v4.py"),
          )
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if path.name == "hf_publish_lyte_enterprise.py":
                  if old in text or new not in text:
                      raise SystemExit(f"unexpected partial publisher state: {path}")
                  continue
              if old not in text:
                  raise SystemExit(f"expected stale pin was not present exactly where scoped: {path}")
              updated = text.replace(old, new)
              if old in updated or new not in updated:
                  raise SystemExit(f"source pin replacement failed: {path}")
              path.write_text(updated, encoding="utf-8")
          PY

      - name: Prove focused Lyte publisher contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "pytest==9.0.3"
          python -m py_compile \
            scripts/hf_publish_lyte_enterprise.py \
            scripts/hf_publish_vertical_flagships_v4.py \
            tests/test_hf_publish_lyte_enterprise.py \
            tests/test_hf_publish_vertical_flagships_v4.py
          python -m pytest -q \
            tests/test_hf_publish_lyte_enterprise.py \
            tests/test_hf_publish_vertical_flagships_v4.py
          python - <<'PY'
          from pathlib import Path
          old = "a0479279505aded5c084d1644012829a1d93ad77"
          new = "a6a653b0d93a0d150b868a044642ce4f5c71d766"
          active = (
              Path("scripts/hf_publish_lyte_enterprise.py"),
              Path("scripts/hf_publish_vertical_flagships_v4.py"),
              Path("tests/test_hf_publish_lyte_enterprise.py"),
              Path("tests/test_hf_publish_vertical_flagships_v4.py"),
          )
          for path in active:
              text = path.read_text(encoding="utf-8")
              assert old not in text, path
              assert new in text, path
          PY
          git diff --check

      - name: Commit forward and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git rm .github/workflows/finish-lyte-source-pin-once.yml
          git add \
            scripts/hf_publish_vertical_flagships_v4.py \
            tests/test_hf_publish_lyte_enterprise.py \
            tests/test_hf_publish_vertical_flagships_v4.py
          git diff --cached --check
          git commit -s -m "fix(hf): bind all Lyte publisher contracts to current source"
          git push origin HEAD:fix/lyte-source-pin-a6a653b
