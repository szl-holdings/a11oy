# SPDX-License-Identifier: Apache-2.0
name: Readiness unavailable-envelope repair once

on:
  push:
    branches:
      - fix/readiness-canonical-unavailable-envelope
    paths:
      - scripts/repair_readiness_unavailable_envelope_contract.py
      - .github/workflows/zz-readiness-unavailable-envelope-repair-once.yml

permissions:
  contents: write

concurrency:
  group: readiness-unavailable-envelope-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/readiness-canonical-unavailable-envelope
          fetch-depth: 0
          persist-credentials: true

      - name: Prove bounded execution lineage
        shell: bash
        env:
          BASE_SHA: d6dbe2f60b722ff66ffbad9a1681b53efb11ce79
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --name-only "$BASE_SHA"...HEAD | sort > /tmp/actual-paths
          printf '%s\n' \
            '.github/workflows/zz-readiness-unavailable-envelope-repair-once.yml' \
            'scripts/repair_readiness_unavailable_envelope_contract.py' \
            | sort > /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install hash-locked CI closure
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt

      - name: Apply deterministic repair and targeted regressions
        run: python scripts/repair_readiness_unavailable_envelope_contract.py

      - name: Remove one-shot execution files and prove final scope
        shell: bash
        env:
          BASE_SHA: d6dbe2f60b722ff66ffbad9a1681b53efb11ce79
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/zz-readiness-unavailable-envelope-repair-once.yml \
            scripts/repair_readiness_unavailable_envelope_contract.py
          git add -A
          git diff --cached --check
          git diff --name-only "$BASE_SHA" | sort > /tmp/final-paths
          printf '%s\n' \
            'tests/test_readiness_deep_vertical_contract.py' \
            'tools/readiness-harness/probe_runner.mjs' \
            | sort > /tmp/expected-final-paths
          diff -u /tmp/expected-final-paths /tmp/final-paths

      - name: Commit and push exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git commit \
            -m 'fix(readiness): admit canonical unavailable source envelopes' \
            -m 'Accept value=null only for an exact UNAVAILABLE source wrapper with a measured failure timestamp and non-empty error. Preserve strict observed-item schemas, citations, freshness, labels, and fail-closed release gating.' \
            -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:fix/readiness-canonical-unavailable-envelope
