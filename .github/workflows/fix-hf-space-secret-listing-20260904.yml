name: Repair HF Space secret metadata compatibility

on:
  push:
    branches:
      - fix/hf-space-secret-listing-20260904
    paths:
      - .github/workflows/fix-hf-space-secret-listing-20260904.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-space-secret-listing-20260904
          fetch-depth: 1

      - name: Pin the first client release with secret metadata listing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = (
              Path('.github/workflows/hf-sync.yml'),
              Path('.github/workflows/hf-publish-vertical-flagships.yml'),
              Path('tests/test_hf_publish_vertical_flagships_v4.py'),
          )
          old = 'huggingface_hub==1.10.1'
          new = 'huggingface_hub==1.14.0'
          for path in targets:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one {old}; found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-hf-space-secret-listing-20260904.yml

      - name: Prove the pinned API and publisher contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'huggingface_hub==1.14.0' 'pytest==9.0.2'
          python - <<'PY'
          from huggingface_hub import HfApi
          assert hasattr(HfApi, 'get_space_secrets')
          PY
          python -m pytest tests/test_hf_publish_vertical_flagships_v4.py -q
          python -m compileall -q \
            scripts/hf_publish_vertical_flagships_v4.py \
            scripts/hf_publish_vertical_services.py

      - name: Commit exact compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stephen P. Lutar Jr."
          git config user.email "stephenlutar2@gmail.com"
          git add \
            .github/workflows/hf-sync.yml \
            .github/workflows/hf-publish-vertical-flagships.yml \
            tests/test_hf_publish_vertical_flagships_v4.py
          git commit -m "fix(hf): pin Space secret metadata support" -m "Use huggingface_hub 1.14.0, the first release exposing get_space_secrets, in both canonical and owner-dispatched vertical publishers. Preserve existing secrets by key rather than rotating write-only values."
          git push origin HEAD:fix/hf-space-secret-listing-20260904
