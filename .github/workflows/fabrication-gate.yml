name: Fabrication monitor (legacy contract RETIRED)

# The old OpenAI inference contract is retired. The monitor emits RETIRED /
# UNAVAILABLE and exits 2 without inference until a governed evaluator is qualified.
# A retired or unavailable monitor must not finish as a successful SKIP or
# auto-file a false fabrication finding. Only a recorded MEASURED /
# FABRICATION-DETECTED / FAIL verdict is eligible for a model-fabrication issue.
# Retain immutable evidence before enforcing every nonzero monitor outcome.

on:
  pull_request:
    paths:
      - '.github/workflows/fabrication-gate.yml'
      - 'scripts/check_fabrication_gate.py'
      - 'szl_braineval.py'
      - 'tests/test_fabrication_gate_workflow.py'
      - 'tests/test_braineval.py'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Fabrication verdict and evidence contract (offline)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the existing hash-locked test dependencies
        run: python -m pip install --require-hashes -r .github/requirements/ci-core.txt
      - name: Prove verdicts and evidence ordering without calling the live model
        run: python -m pytest -q tests/test_fabrication_gate_workflow.py tests/test_braineval.py

  fabrication-gate:
    name: Fabrication monitoring unavailable until governed evaluation migration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run the fabrication gate
        id: gate
        continue-on-error: true   # retain the verdict and incident before enforcing the result
        run: |
          set -euo pipefail
          python3 scripts/check_fabrication_gate.py
      - name: Classify recorded fabrication evidence
        id: evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from scripts.check_fabrication_gate import issue_eligible

          with open("fabrication-gate-verdict.json", encoding="utf-8") as stream:
              verdict = json.load(stream)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("fabrication_detected=" + str(issue_eligible(verdict)).lower() + "\n")
          PY
      - name: File or update the fabrication finding
        if: steps.evidence.outputs.fabrication_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "[FABRICATION-GATE] served model fabricated on a doctrine probe"
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --search "in:title $ISSUE_TITLE" --state open --json number --jq '.[0].number // ""')"
          body="## Fabrication gate FAIL

          The served SZL-Khipu-1.5B model answered doctrine probes this run and FABRICATED on at least one (see the run's \`fabrication-gate-verdict.json\` artifact for the per-probe outcomes). This is a MEASURED reading — never inferred, never inflated.

          Actionable paths: improve the model's refusal behavior (training-side, admitted through the signed Brain training-admission contract), or gate any dependent MEASURED claims on this posture honestly."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Re-confirmed by run $GITHUB_RUN_ID: fabrication detected again." >/dev/null
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body" >/dev/null
          fi
      - name: Upload immutable verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fabrication-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: fabrication-gate-verdict.json
          if-no-files-found: error
      - name: Enforce the recorded gate result
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: test "$GATE_OUTCOME" = success
