name: Controlled apex routing diagnostic

on:
  push:
    branches:
      - diagnose/apex-routing-20260903
    paths:
      - .github/workflows/_diagnose_apex_routing.yml

permissions:
  contents: read

concurrency:
  group: apex-routing-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Capture DNS, TLS, redirects, and origin responses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture DNS chain
        shell: bash
        run: |
          set -euo pipefail
          hosts=(
            a-11-oy.com
            www.a-11-oy.com
            _huggingface.a-11-oy.com
            hf.space
            szl-holdings.github.io
            szlholdings-a11oy.hf.space
          )
          for host in "${hosts[@]}"; do
            echo "===== DNS ${host} ====="
            getent ahosts "${host}" || true
            if command -v dig >/dev/null 2>&1; then
              for type in CNAME A AAAA TXT NS SOA CAA; do
                echo "-- ${type} --"
                dig +short "${type}" "${host}" || true
              done
            fi
          done
          if command -v dig >/dev/null 2>&1; then
            for resolver in 1.1.1.1 8.8.8.8; do
              echo "===== PUBLIC RESOLVER ${resolver} ====="
              dig +short @"${resolver}" A a-11-oy.com || true
              dig +short @"${resolver}" CNAME a-11-oy.com || true
              dig +short @"${resolver}" TXT _huggingface.a-11-oy.com || true
              dig +short @"${resolver}" NS a-11-oy.com || true
              dig +short @"${resolver}" SOA a-11-oy.com || true
            done
            echo "===== PARENT DELEGATION ====="
            dig +trace NS a-11-oy.com || true
            echo "===== REVERSE ADDRESS ====="
            dig +short -x 44.223.168.227 || true
          fi

      - name: Capture TLS certificates
        shell: bash
        run: |
          set -euo pipefail
          for host in a-11-oy.com hf.space szl-holdings.github.io szlholdings-a11oy.hf.space; do
            echo "===== TLS ${host} ====="
            timeout 15 openssl s_client -connect "${host}:443" -servername "${host}" </dev/null 2>/dev/null \
              | openssl x509 -noout -subject -issuer -serial -dates -ext subjectAltName || true
          done

      - name: Capture HTTP routing evidence
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://a-11-oy.com/"
            "https://a-11-oy.com/console"
            "https://a-11-oy.com/products/"
            "https://www.a-11-oy.com/"
            "https://hf.space/"
            "https://szl-holdings.github.io/"
            "https://szlholdings-a11oy.hf.space/"
            "https://szlholdings-a11oy.hf.space/console"
          )
          for url in "${urls[@]}"; do
            echo "===== HTTP ${url} ====="
            : > /tmp/body
            : > /tmp/headers
            curl --silent --show-error --location \
              --max-time 25 --connect-timeout 10 \
              --output /tmp/body \
              --dump-header /tmp/headers \
              --write-out 'effective_url=%{url_effective}\nhttp_code=%{http_code}\nremote_ip=%{remote_ip}\nredirects=%{num_redirects}\ncontent_type=%{content_type}\nsize_download=%{size_download}\n' \
              "${url}" || true
            sed -n '1,40p' /tmp/headers || true
            echo "-- BODY PREFIX --"
            head -c 500 /tmp/body | tr '\000-\010\013\014\016-\037' ' ' || true
            echo
          done

      - name: Inspect public Hugging Face Space metadata for domain evidence
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            --max-time 25 \
            https://huggingface.co/api/spaces/SZLHOLDINGS/a11oy \
            --output /tmp/space.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/space.json').read_text(encoding='utf-8'))
          print('top_level_keys=', sorted(data))

          def walk(value, path=()):
              if isinstance(value, dict):
                  for key, child in value.items():
                      key_text = str(key)
                      next_path = path + (key_text,)
                      lowered = key_text.lower()
                      if any(token in lowered for token in ('domain', 'host', 'url', 'subdomain')):
                          rendered = child
                          if isinstance(child, (dict, list)):
                              rendered = json.dumps(child, sort_keys=True)[:1000]
                          print('.'.join(next_path), '=', rendered)
                      walk(child, next_path)
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, path + (str(index),))

          walk(data)
          raw = json.dumps(data, sort_keys=True)
          print('contains_apex=', 'a-11-oy.com' in raw)
          print('contains_custom_domain_key=', 'customDomain' in raw or 'custom_domain' in raw)
          PY
          curl --silent --show-error --fail \
            --max-time 25 \
            https://huggingface.co/spaces/SZLHOLDINGS/a11oy \
            --output /tmp/space-page.html
          echo "===== PUBLIC PAGE DOMAIN REFERENCES ====="
          grep -oiE '.{0,120}(custom.?domain|a-11-oy\.com).{0,240}' /tmp/space-page.html | head -n 40 || true
