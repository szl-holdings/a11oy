name: Living Anatomy cross-surface drift guard

# szl-holdings/a11oy ships the product-side Anatomy map in the /console
# marker block. GitHub szl-holdings/anatomy is authoritative; the public
# betterwithage/anatomy Space is its active deployment mirror; and
# a-11-oy.com is the product entry point.
#
# Pin both the reusable workflow and checker registry to the same reviewed
# szl-holdings/.github origin repair at 1bda800. No provider credentials or inherited
# secrets cross the reusable-workflow boundary.

on:
  push:
    branches: [main]
    paths:
      - "pages/console.html"
      - ".github/workflows/anatomy-map-drift.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  anatomy-map-drift:
    uses: szl-holdings/.github/.github/workflows/reusable-anatomy-map-drift.yml@1bda800b8326aa1a8456987250d75137f9379f47
    with:
      checker-ref: 1bda800b8326aa1a8456987250d75137f9379f47
