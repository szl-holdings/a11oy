name: Living Anatomy cross-surface drift guard

# szl-holdings/a11oy ships the product-side Anatomy map in the /console
# marker block. GitHub szl-holdings/anatomy is authoritative; the public
# SZLHOLDINGS/anatomy Space is its source-bound deployment mirror; and
# a-11-oy.com is the product entry point.
#
# Pin both the reusable workflow and checker registry to the same reviewed
# szl-holdings/.github#624 squash commit. No provider credentials or inherited
# secrets cross the reusable-workflow boundary.

on:
  push:
    branches: [main]
    paths:
      - "pages/console.html"
      - ".github/workflows/anatomy-map-drift.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  anatomy-map-drift:
    uses: szl-holdings/.github/.github/workflows/reusable-anatomy-map-drift.yml@c3a838ce240a157c70bd5d6e0e700c30a0cd494d
    with:
      checker-ref: c3a838ce240a157c70bd5d6e0e700c30a0cd494d
