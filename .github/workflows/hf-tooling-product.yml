name: HF tooling product integration

on:
  pull_request:
    paths:
      - 'routers/hf_tooling_evidence.py'
      - 'routers/model_pretraining.py'
      - 'routers/data/model-pretraining-snapshot.json'
      - 'docs/huggingface-ecosystem-manifest.json'
      - 'a11oy_model_intel.py'
      - 'pages/model-pretraining.*'
      - 'console/assets/szl-flow.*'
      - 'console/assets/szl-spectral-v2.css'
      - 'tests/test_model_pretraining*.py'
      - 'tests/model-pretraining.test.mjs'
      - 'scripts/build_model_pretraining_projection.py'
      - 'scripts/test_model_pretraining_browser.py'
      - 'scripts/verify_model_pretraining_live.py'
      - 'scripts/prepare_hf_inventory_refresh.py'
      - 'tests/test_hf_inventory_refresh*.py'
      - '.github/workflows/hf-ecosystem-drift.yml'
      - 'routers/data/hf-tooling-20260910.json'
      - 'routers/frontier_reads.py'
      - 'routers/frontier_now_web/index.html'
      - 'routers/__init__.py'
      - 'pages/hf-tooling.*'
      - 'tests/test_hf_tooling_evidence.py'
      - 'scripts/test_hf_tooling_browser.py'
      - '.github/workflows/hf-tooling-product.yml'
  push:
    branches: [main]
    paths:
      - 'routers/hf_tooling_evidence.py'
      - 'routers/model_pretraining.py'
      - 'routers/data/model-pretraining-snapshot.json'
      - 'docs/huggingface-ecosystem-manifest.json'
      - 'a11oy_model_intel.py'
      - 'pages/model-pretraining.*'
      - 'console/assets/szl-flow.*'
      - 'console/assets/szl-spectral-v2.css'
      - 'tests/test_model_pretraining*.py'
      - 'tests/model-pretraining.test.mjs'
      - 'scripts/build_model_pretraining_projection.py'
      - 'scripts/test_model_pretraining_browser.py'
      - 'scripts/verify_model_pretraining_live.py'
      - 'scripts/prepare_hf_inventory_refresh.py'
      - 'tests/test_hf_inventory_refresh*.py'
      - '.github/workflows/hf-ecosystem-drift.yml'
      - 'routers/data/hf-tooling-20260910.json'
      - 'routers/frontier_reads.py'
      - 'routers/frontier_now_web/index.html'
      - 'routers/__init__.py'
      - 'pages/hf-tooling.*'
      - 'tests/test_hf_tooling_evidence.py'
      - 'scripts/test_hf_tooling_browser.py'
      - '.github/workflows/hf-tooling-product.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Sync and Relock Canonical Hugging Face Space']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hf-tooling-product-${{ github.event_name }}-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  python-api-and-browser:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the product API and browser test dependencies
        run: >-
          python -m pip install
          'fastapi==0.141.1' 'starlette==1.6.0' 'httpx==0.28.1'
          'uvicorn==0.52.4' 'playwright==1.62.0'
      - name: Verify archive, current-process metadata and production registration seam
        run: python -m unittest discover -s tests -p 'test_hf_tooling_evidence.py' -v
      - name: Check generated model projection, Python API and browser boundary
        run: |
          python scripts/build_model_pretraining_projection.py --check
          python -m unittest discover -s tests -p 'test_model_pretraining*.py' -v
          python -m unittest discover -s tests -p 'test_hf_inventory_refresh*.py' -v
          node --test tests/model-pretraining.test.mjs
      - name: Verify the canonical image already includes all new runtime files
        run: |
          python - <<'PY'
          from pathlib import Path
          docker = Path('Dockerfile').read_text()
          assert 'COPY routers/ ./routers/' in docker
          assert 'COPY pages/ ./pages/' in docker
          assert '"hf_tooling_evidence"' in Path('routers/__init__.py').read_text()
          assert 'href="/frontier-tooling"' in Path('routers/frontier_now_web/index.html').read_text()
          PY
      - name: Install the pinned test browser
        run: python -m playwright install --with-deps chromium
      - name: Exercise the real Python API and responsive view
        run: |
          python scripts/test_hf_tooling_browser.py
          python scripts/test_model_pretraining_browser.py
      - name: Retain browser evidence and viewport captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hf-tooling-product-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/hf-tooling-product/
            artifacts/model-pretraining/
          if-no-files-found: warn
          retention-days: 30

  published-model-readback:
    name: Read back model preparation (${{ matrix.surface }})
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.repository == 'szl-holdings/a11oy'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        surface: [canonical, product]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Execute trusted default-branch code, never a triggering run payload.
          # A moved source fails the observer comparison before network access.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check served source, API contract, and frontend bytes without credentials
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SURFACE: ${{ matrix.surface }}
        run: >-
          python -B scripts/verify_model_pretraining_live.py
          --surface "$SURFACE"
          --expected-source "$SOURCE_SHA"
          --output "artifacts/model-pretraining/live-$SURFACE.json"
      - name: Preserve each origin result without aggregating it into estate readiness
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: model-live-${{ matrix.surface }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/model-pretraining/live-${{ matrix.surface }}.json
          if-no-files-found: error
          retention-days: 90
