name: llama-cpp wheel guard

# The canonical A11oy image consumes one exact official llama-cpp-python
# manylinux CPU wheel. This workflow validates the literal Dockerfile contract,
# downloads the same immutable asset, checks size and SHA-256, installs it on
# CPython 3.12/glibc, imports it, and proves the bundled libllama.so links glibc
# rather than musl. It never compiles an alternate artifact from mutable source.
#
# Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'scripts/weight_guard_alert.sh'
      - 'scripts/weight_guard_alert.test.sh'
      - '.github/workflows/llama-wheel-guard.yml'
      - 'scripts/parse-llama-pin.sh'
      - 'scripts/parse-llama-pin.test.sh'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'scripts/weight_guard_alert.sh'
      - 'scripts/weight_guard_alert.test.sh'
      - '.github/workflows/llama-wheel-guard.yml'
      - 'scripts/parse-llama-pin.sh'
      - 'scripts/parse-llama-pin.test.sh'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-self-test:
    name: Self-test the Dockerfile pin parser (negative fixtures)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run negative-fixture self-test
        run: bash scripts/parse-llama-pin.test.sh

  wheel-guard:
    runs-on: ubuntu-24.04
    needs: parser-self-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Self-test the shared alert relay (offline)
        run: bash scripts/weight_guard_alert.test.sh

      - name: Parse the exact llama-cpp-python version
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash scripts/parse-llama-pin.sh Dockerfile)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'Parsed exact llama-cpp-python version %s\n' "$version"

      - name: Resolve the literal official wheel contract
        id: contract
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          text = Path("Dockerfile").read_text(encoding="utf-8")
          normalized = re.sub(r"\\\s*\n", " ", text)
          version_pattern = r"[0-9]+(?:[.][0-9]+){2}"
          wheel_pattern = (
              r"llama_cpp_python-(?P<version>" + version_pattern + r")-"
              r"py3-none-manylinux2014_x86_64[.]manylinux_2_17_x86_64[.]whl"
          )
          contract = re.compile(
              r"ADD\s+--checksum=sha256:(?P<sha>[0-9a-f]{64})\s+"
              r"(?P<url>https://github[.]com/abetlen/llama-cpp-python/releases/"
              r"download/v(?P<release>" + version_pattern + r")/"
              r"(?P<filename>" + wheel_pattern + r"))\s+"
              r"/wheels/(?P=filename)"
          )
          matches = list(contract.finditer(normalized))
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one official wheel ADD contract, found {len(matches)}"
              )
          match = matches[0]
          expected = os.environ["EXPECTED_VERSION"]
          versions = {match.group("version"), match.group("release"), expected}
          if len(versions) != 1:
              raise SystemExit(f"wheel version drift: {sorted(versions)}")

          sizes = set(
              re.findall(r"assert\s+os[.]path[.]getsize[(]path[)]\s*==\s*([0-9]+)", text)
          )
          if len(sizes) != 1:
              raise SystemExit(f"expected one literal wheel-size assertion, found {sorted(sizes)}")
          size = next(iter(sizes))
          sha = match.group("sha")
          if text.count(sha) < 2:
              raise SystemExit("wheel SHA-256 is not independently rechecked in the Dockerfile")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"url={match.group('url')}\n")
              handle.write(f"filename={match.group('filename')}\n")
              handle.write(f"sha256={sha}\n")
              handle.write(f"size={size}\n")
          print(
              "Resolved official wheel contract:",
              match.group("filename"),
              "size", size,
              "sha256", sha,
          )
          PY

      - name: Download and verify the exact official wheel
        shell: bash
        env:
          VERSION: ${{ steps.parse.outputs.version }}
          WHEEL_URL: ${{ steps.contract.outputs.url }}
          WHEEL_FILENAME: ${{ steps.contract.outputs.filename }}
          WHEEL_SHA256: ${{ steps.contract.outputs.sha256 }}
          WHEEL_SIZE: ${{ steps.contract.outputs.size }}
        run: |
          set -euo pipefail
          wheel="$RUNNER_TEMP/$WHEEL_FILENAME"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --proto '=https' --tlsv1.2 \
            "$WHEEL_URL" -o "$wheel"
          actual_size="$(stat -c '%s' "$wheel")"
          test "$actual_size" = "$WHEEL_SIZE"
          printf '%s  %s\n' "$WHEEL_SHA256" "$wheel" | sha256sum -c -
          python -m pip install --disable-pip-version-check --no-cache-dir "$wheel"
          python - <<'PY'
          from __future__ import annotations

          import glob
          import os
          from importlib.metadata import version

          import llama_cpp

          expected = os.environ["VERSION"]
          installed = version("llama-cpp-python")
          assert installed == expected, (installed, expected)
          base = os.path.dirname(llama_cpp.__file__)
          shared = glob.glob(os.path.join(base, "**", "libllama.so"), recursive=True)
          assert shared, f"libllama.so not found under {base}"
          data = open(shared[0], "rb").read()
          assert b"libc.so.6" in data, "official wheel is not glibc-linked"
          assert b"libc.musl-x86_64.so.1" not in data, "official wheel is musl-linked"
          print(
              "OK: exact official llama-cpp-python wheel imported on CPython 3.12/glibc:",
              shared[0],
              installed,
          )
          PY

      - name: Page on unattended scheduled failure
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION: ${{ steps.parse.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          source scripts/managed_alert_env.sh &&
          export MSG=":rotating_light: a11oy official llama-cpp wheel guard failed. The exact pinned llama-cpp-python==${VERSION:-?} asset is unavailable, changed bytes/size, cannot import on CPython 3.12/glibc, or no longer contains a glibc-linked libllama.so. Run: ${RUN_URL}" &&
          bash scripts/weight_guard_alert.sh
