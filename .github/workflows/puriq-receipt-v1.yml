name: PurIQ receipt v1 contract

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "serve.py"
      - "schemas/puriq-receipt-v1.json"
      - "static/shared/puriq_receipt_v1.js"
      - "scripts/generate_puriq_receipt_v1_vectors.mjs"
      - "scripts/verify_puriq_receipt_v1_golden.py"
      - "tests/fixtures/puriq-receipt-v1-vectors.json"
      - "tests/test_puriq_receipt_runtime.py"
      - "__tests__/compliance/puriq_receipt_v1.test.ts"
      - ".github/workflows/puriq-receipt-v1.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "serve.py"
      - "schemas/puriq-receipt-v1.json"
      - "static/shared/puriq_receipt_v1.js"
      - "scripts/generate_puriq_receipt_v1_vectors.mjs"
      - "scripts/verify_puriq_receipt_v1_golden.py"
      - "tests/fixtures/puriq-receipt-v1-vectors.json"
      - "tests/test_puriq_receipt_runtime.py"
      - "__tests__/compliance/puriq_receipt_v1.test.ts"
      - ".github/workflows/puriq-receipt-v1.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: puriq-receipt-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Schema, vectors, and browser verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify committed vectors are deterministic
        run: node scripts/generate_puriq_receipt_v1_vectors.mjs --check

      - name: Cross-check canonical golden bytes independently
        run: python3 scripts/verify_puriq_receipt_v1_golden.py

      - name: Install pinned runtime-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          fastapi==0.141.1
          httpx==0.28.1
          starlette==1.6.0
          pytest==9.0.3

      - name: Verify runtime publication and deny-by-default routes
        run: python -m pytest -q tests/test_puriq_receipt_runtime.py

      - name: Verify schema, hashes, chains, and client behavior
        run: npx jest --runInBand __tests__/compliance/puriq_receipt_v1.test.ts

      - name: Diff hygiene
        run: git diff --check
