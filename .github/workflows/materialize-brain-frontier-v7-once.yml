# SPDX-License-Identifier: Apache-2.0
name: Materialize Brain Frontier v7 once

on:
  push:
    branches:
      - feat/brain-frontier-holographic-v7-20260904
    paths:
      - .github/workflows/materialize-brain-frontier-v7-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/brain-frontier-holographic-v7-20260904
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact focused test tooling
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.3.5"

      - name: Materialize current source handles and bind one contextual asset pair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_brain_frontier_v7.py \
            --output console/assets/brain-frontier-v7.json
          python - <<'PY'
          from pathlib import Path

          path = Path("static/3d/holographic.html")
          text = path.read_text(encoding="utf-8")
          style = '<link rel="stylesheet" href="/assets/brain-frontier-v7.css" data-szl-brain-frontier-v7="style" />'
          script = '<script src="/assets/brain-frontier-v7.js" defer data-szl-brain-frontier-v7="script"></script>'
          if text.count('data-szl-brain-frontier-v7="style"') > 1:
              raise SystemExit("duplicate Brain Frontier style marker")
          if text.count('data-szl-brain-frontier-v7="script"') > 1:
              raise SystemExit("duplicate Brain Frontier script marker")
          if style not in text:
              position = text.lower().rfind("</head>")
              if position < 0:
                  raise SystemExit("holographic shell has no closing head")
              text = text[:position] + "  " + style + "\n" + text[position:]
          if script not in text:
              position = text.lower().rfind("</body>")
              if position < 0:
                  raise SystemExit("holographic shell has no closing body")
              text = text[:position] + "  " + script + "\n" + text[position:]
          if text.count('data-szl-brain-frontier-v7="style"') != 1:
              raise SystemExit("Brain Frontier style was not mounted exactly once")
          if text.count('data-szl-brain-frontier-v7="script"') != 1:
              raise SystemExit("Brain Frontier script was not mounted exactly once")
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git diff --check

      - name: Prove source, UI, and existing holographic compatibility
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/materialize_brain_frontier_v7.py \
            tests/test_brain_frontier_v7.py \
            tests/test_brain_frontier_v7_surface.py
          node --check console/assets/brain-frontier-v7.js
          python -m json.tool console/assets/brain-frontier-v7.json >/dev/null
          python -m pytest -q \
            tests/test_brain_frontier_v7.py \
            tests/test_brain_frontier_v7_surface.py
          for test_file in test_router_surface_3d.py tests/test_attest.py; do
            if [ -f "$test_file" ]; then
              python -m pytest -q "$test_file"
            fi
          done
          git diff --check

      - name: Commit the source-native shell binding and remove this controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add static/3d/holographic.html console/assets/brain-frontier-v7.json
          git rm .github/workflows/materialize-brain-frontier-v7-once.yml
          git diff --cached --quiet && { echo "no Holographic v7 materialization changes"; exit 1; }
          digest="$(python -c 'import json; print(json.load(open("console/assets/brain-frontier-v7.json"))["snapshot_sha256"][:16])')"
          git commit -s -m "feat(holographic): bind Brain Frontier v7 ${digest}"
          git push origin HEAD:feat/brain-frontier-holographic-v7-20260904
