name: Controlled branch-only ecosystem stage-matrix refresh

on:
  push:
    branches:
      - fix/hf-manifest-current-20260903
    paths:
      - .github/workflows/_refresh_hf_stage_matrix_branch.yml

permissions:
  contents: write

concurrency:
  group: ecosystem-stage-matrix-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Generate, verify, and commit the derived stage matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out the controlled branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-manifest-current-20260903
          fetch-depth: 0
          persist-credentials: true

      - name: Regenerate from tracked evidence
        run: |
          set -euo pipefail
          python scripts/build_ecosystem_stage_matrix.py
          python scripts/build_ecosystem_stage_matrix.py --check

      - name: Commit only the generated matrix
        run: |
          set -euo pipefail
          changed=$(git status --porcelain -- docs/ecosystem-stage-matrix.json)
          test -n "$changed"
          test "$(git status --porcelain | wc -l | tr -d ' ')" = "1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/ecosystem-stage-matrix.json
          git commit -s -m "chore(hf): refresh derived ecosystem stage matrix"
          git push origin HEAD:fix/hf-manifest-current-20260903
