name: Bootstrap frontend live-canary repair

on:
  push:
    branches:
      - fix/frontend-live-canary-operational-20260831

permissions:
  contents: write

concurrency:
  group: bootstrap-frontend-live-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          fetch-depth: 0

      - name: Apply exact repair and regression guard
        run: python3 .github/scripts/_apply_frontend_canary_fix.py

      - name: Commit converged source and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes remained to commit."
            exit 0
          fi
          git commit \
            -m "fix(frontend): clear live canary touch targets" \
            -m "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin "HEAD:${GITHUB_REF_NAME}"
