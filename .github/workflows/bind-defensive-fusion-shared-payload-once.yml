# SPDX-License-Identifier: Apache-2.0
name: Bind defensive-fusion shared payload once

on:
  push:
    branches:
      - feat/defensive-fusion-shared-sync-20260904
    paths:
      - .github/workflows/bind-defensive-fusion-shared-payload-once.yml

permissions:
  contents: write

concurrency:
  group: bind-defensive-fusion-shared-payload-once
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact coordination branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/defensive-fusion-shared-sync-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Build canonical content-addressed manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          paths = (
              "szl_connectors/bindings.py",
              "szl_connectors/data_sources/security.py",
          )
          document = {
              "files": {
                  path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
                  for path in paths
              },
              "payload_id": "defensive-fusion-wave4-20260904",
              "schema": "szl-shared-source-payload/v1",
          }
          raw = (json.dumps(document, indent=2, ensure_ascii=False) + "\n").encode("utf-8")
          target = Path(".github/shared-source-payload-manifest.json")
          target.write_bytes(raw)
          digest = hashlib.sha256(raw).hexdigest()
          with Path("/tmp/manifest-digest").open("w", encoding="utf-8") as handle:
              handle.write(digest)
          print(f"manifest_sha256={digest}")
          PY
          git rm .github/workflows/bind-defensive-fusion-shared-payload-once.yml
          git diff --check

      - name: Commit canonical manifest and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          digest="$(cat /tmp/manifest-digest)"
          test "${#digest}" -eq 64
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add .github/shared-source-payload-manifest.json
          git commit -s -m "chore(shared): bind defensive-fusion payload" \
            -m "Shared-source-payload: sha256:${digest}"
          git push origin HEAD:feat/defensive-fusion-shared-sync-20260904
