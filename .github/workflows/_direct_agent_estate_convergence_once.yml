name: Direct agent estate convergence once

on:
  push:
    branches:
      - ops/codex-perplexity-recovery-20260904-v1
    paths:
      - .github/workflows/_direct_agent_estate_convergence_once.yml

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: direct-agent-estate-convergence-20260904
  cancel-in-progress: false

jobs:
  converge:
    name: Cancel stale controllers, converge current state, and emit direct receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_ADMIN_TOKEN: ${{ secrets.SZL_GITHUB_TOKEN || secrets.GH_ADMIN_TOKEN || secrets.GITHUB_ADMIN_TOKEN || secrets.ORG_ADMIN_TOKEN || secrets.GH_PAT || github.token }}
      HF_ADMIN_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_ORG_TOKEN1 || secrets.HF_TOKEN || secrets.HF_WRITE_TOKEN || secrets.HUGGINGFACEHUB_API_TOKEN || secrets.HUGGING_FACE_HUB_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out isolated controller branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/codex-perplexity-recovery-20260904-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Cancel only stale branch-local orchestration waiters
        env:
          GH_TOKEN: ${{ env.GH_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          current="$GITHUB_RUN_ID"
          stale_names='^(Publish Codex and Perplexity recovery receipt once|Publish corrected Codex and Perplexity recovery receipt once|Final post-remediation estate verification once|Repair terminal agent blockers once)$'
          gh api 'repos/szl-holdings/a11oy/actions/runs?branch=ops%2Fcodex-perplexity-recovery-20260904-v1&per_page=100' \
            --jq '.workflow_runs[] | select((.status == "queued" or .status == "in_progress" or .status == "waiting") and (.name | test("'"$stale_names"'"))) | .id' \
            | while read -r run_id; do
                [ -n "$run_id" ] || continue
                [ "$run_id" = "$current" ] && continue
                gh api --method POST "repos/szl-holdings/a11oy/actions/runs/${run_id}/cancel" || true
              done

      - name: Run dependency-free current-state convergence
        env:
          GH_TOKEN: ${{ env.GH_ADMIN_TOKEN }}
          HF_TOKEN: ${{ env.HF_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/agent-recovery/2026-09-04/direct
          cat > /tmp/direct.py <<'PY'
          from __future__ import annotations
          import datetime as dt, json, os, re, subprocess, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          ORG='szl-holdings'; HF_ORG='SZLHOLDINGS'
          HOLD=re.compile(r'(?:do not merge|\bhold\b|evidence[- ]only|terminal disposition|owner click|manual approval|isolated recovery controller)',re.I)
          GOOD={'success','neutral','skipped'}; BAD={'failure','timed_out','cancelled','startup_failure','stale','action_required'}
          PROVIDER=re.compile(r'(?:cloudflare|custom.?domain|neon migration|production witness|gpu|train|billing)',re.I)
          result={'schema':'szl.direct-agent-estate-convergence/v1','generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),'credential_values_recorded':False,'passes':[],'open_prs':[],'default_branches':[],'hf':{'counts':{},'spaces':[],'unsafe':[],'errors':[]},'domain':{},'known_handoffs':[],'errors':[]}

          def cmd(args,check=False,timeout=180):
              p=subprocess.run(args,text=True,capture_output=True,timeout=timeout)
              if check and p.returncode: raise RuntimeError((p.stderr or p.stdout)[-2000:])
              return p
          def gh(path,method='GET',fields=None,check=False):
              a=['gh','api'];
              if method!='GET':a+=['--method',method]
              a.append(path)
              for k,v in (fields or {}).items():a+=['-f',f'{k}={v}']
              p=cmd(a,check=check)
              if not p.stdout.strip():return None
              try:return json.loads(p.stdout)
              except:return p.stdout
          def pages(path,key=None):
              out=[]; sep='&' if '?' in path else '?'
              for page in range(1,31):
                  d=gh(f'{path}{sep}per_page=100&page={page}',check=True); rows=d.get(key,[]) if key else d
                  if not isinstance(rows,list):raise RuntimeError('pagination shape')
                  out+=rows
                  if len(rows)<100:break
              return out
          def checks(repo,sha):
              d=gh(f'repos/{repo}/commits/{sha}/check-runs?per_page=100') or {}; rows=d.get('check_runs',[]) if isinstance(d,dict) else []
              return {'count':len(rows),'failed':[r.get('name') for r in rows if r.get('status')=='completed' and r.get('conclusion') not in GOOD],'pending':[r.get('name') for r in rows if r.get('status')!='completed']}
          def runs(repo,sha):
              d=gh(f'repos/{repo}/actions/runs?head_sha={sha}&per_page=100') or {}; return d.get('workflow_runs',[]) if isinstance(d,dict) else []
          def recover(repo,sha,actions):
              for r in runs(repo,sha):
                  if r.get('status')=='completed' and r.get('conclusion')=='action_required':
                      p=cmd(['gh','api','--method','POST',f"repos/{repo}/actions/runs/{r['id']}/approve"]);actions.append({'run':r['id'],'name':r.get('name'),'action':'approve','ok':p.returncode==0})
                  elif r.get('status')=='completed' and r.get('conclusion') in BAD and not PROVIDER.search(str(r.get('name') or '')) and int(r.get('run_attempt') or 1)<=1:
                      p=cmd(['gh','api','--method','POST',f"repos/{repo}/actions/runs/{r['id']}/rerun-failed-jobs"]);actions.append({'run':r['id'],'name':r.get('name'),'action':'rerun','ok':p.returncode==0})
          repos=pages(f'orgs/{ORG}/repos?type=all&sort=updated'); active=[r for r in repos if not r.get('archived') and not r.get('disabled')]
          result['github_counts']={'total':len(repos),'active':len(active),'archived':sum(bool(r.get('archived')) for r in repos)}

          for n in range(1,4):
              pr_pairs=[]
              for meta in active:
                  rows=gh(f"repos/{meta['full_name']}/pulls?state=open&per_page=100")
                  if isinstance(rows,list):pr_pairs += [(meta,r) for r in rows]
              row={'pass':n,'observed':len(pr_pairs),'merged':[],'blocked':[],'held':[],'actions':[]}
              for meta,stub in pr_pairs:
                  repo=meta['full_name']; number=int(stub['number']); pr=gh(f'repos/{repo}/pulls/{number}')
                  if not isinstance(pr,dict):row['blocked'].append({'repo':repo,'number':number,'reason':'read failed'});continue
                  text=str(pr.get('title') or '')+'\n'+str(pr.get('body') or '')
                  head=(pr.get('head') or {}).get('ref'); sha=(pr.get('head') or {}).get('sha'); head_repo=str((((pr.get('head') or {}).get('repo') or {}).get('full_name')) or '')
                  item={'repo':repo,'number':number,'title':pr.get('title'),'head':head,'sha':sha}
                  if pr.get('draft') or HOLD.search(text) or head=='ops/codex-perplexity-recovery-20260904-v1' or not head_repo.startswith(f'{ORG}/'):
                      item['reason']='draft/hold/controller/external';row['held'].append(item);continue
                  if pr.get('mergeable_state')=='behind':
                      u=gh(f'repos/{repo}/pulls/{number}/update-branch',method='PUT',fields={'expected_head_sha':sha});time.sleep(15);pr=gh(f'repos/{repo}/pulls/{number}') or pr;sha=(pr.get('head') or {}).get('sha');item['sha']=sha
                  ev=checks(repo,sha)
                  if ev['failed'] or ev['pending']:
                      recover(repo,sha,row['actions']);deadline=time.monotonic()+900
                      while time.monotonic()<deadline:
                          time.sleep(20);ev=checks(repo,sha)
                          if not ev['pending']:break
                  item['checks']=ev;pr=gh(f'repos/{repo}/pulls/{number}') or pr
                  if ev['count']>0 and not ev['failed'] and not ev['pending'] and pr.get('mergeable') is True and pr.get('mergeable_state') in {'clean','has_hooks','unstable'}:
                      m=gh(f'repos/{repo}/pulls/{number}/merge',method='PUT',fields={'sha':sha,'merge_method':'squash','commit_title':f"{pr.get('title')} (#{number})",'commit_message':'Recovered through current exact-head protected checks.\n\nSigned-off-by: Stephen Lutar <stephenlutar2@gmail.com>'})
                      item['merged']=bool((m or {}).get('merged')) if isinstance(m,dict) else False;item['merge_sha']=(m or {}).get('sha') if isinstance(m,dict) else None
                      (row['merged'] if item['merged'] else row['blocked']).append(item)
                  else:item['reason']='not clean after bounded recovery';row['blocked'].append(item)
              result['passes'].append(row)
              if not row['merged']:break
              time.sleep(30)

          for meta in active:
              repo=meta['full_name']; default=meta.get('default_branch') or 'main'; b=gh(f'repos/{repo}/branches/{urllib.parse.quote(default,safe="")}')
              if not isinstance(b,dict) or 'commit' not in b:result['default_branches'].append({'repo':repo,'state':'UNAVAILABLE'});continue
              sha=str((b.get('commit') or {}).get('sha') or '');rs=runs(repo,sha)
              result['default_branches'].append({'repo':repo,'sha':sha,'failed':[{'id':r.get('id'),'name':r.get('name'),'conclusion':r.get('conclusion')} for r in rs if r.get('status')=='completed' and r.get('conclusion') not in GOOD],'pending':[{'id':r.get('id'),'name':r.get('name'),'status':r.get('status')} for r in rs if r.get('status')!='completed']})
              prs=gh(f'repos/{repo}/pulls?state=open&per_page=100')
              if isinstance(prs,list):
                  for pr in prs:result['open_prs'].append({'repo':repo,'number':pr.get('number'),'title':pr.get('title'),'draft':pr.get('draft'),'head':(pr.get('head') or {}).get('ref'),'sha':(pr.get('head') or {}).get('sha'),'mergeable':pr.get('mergeable'),'mergeable_state':pr.get('mergeable_state'),'hold':bool(HOLD.search(str(pr.get('title') or '')+'\n'+str(pr.get('body') or '')))})

          # HF read + one bounded public restart.
          def hfreq(path,method='GET'):
              headers={'User-Agent':'SZL-direct-convergence/1.0'}
              if os.environ.get('HF_TOKEN'):headers['Authorization']=f"Bearer {os.environ['HF_TOKEN']}"
              req=urllib.request.Request('https://huggingface.co'+path,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=40) as r:
                      p=r.read();return r.status,json.loads(p) if p else None
              except urllib.error.HTTPError as e:
                  p=e.read().decode('utf-8','replace')
                  try:d=json.loads(p)
                  except:d={'message':p}
                  return e.code,d
              except Exception as e:return 0,{'message':f'{type(e).__name__}: {e}'[:500]}
          datasets=[];spaces=[]
          for family in ('models','datasets','spaces'):
              code,data=hfreq(f'/api/{family}?author={HF_ORG}&limit=100&full=true')
              if code==200 and isinstance(data,list):
                  result['hf']['counts'][family]=len(data)
                  if family=='models':
                      for m in data:
                          bad=sorted(str(x.get('rfilename') or '') for x in m.get('siblings',[]) if str(x.get('rfilename') or '').lower().endswith(('.joblib','.pkl','.pickle','.dill')))
                          if bad:result['hf']['unsafe'].append({'model':m.get('id'),'files':bad})
                  if family=='spaces':spaces=data
              else:result['hf']['counts'][family]=None;result['hf']['errors'].append({'family':family,'http':code,'detail':data})
          restarted=[]
          for s in spaces:
              runtime=s.get('runtime') or {};stage=str(runtime.get('stage') or 'UNKNOWN');item={'id':s.get('id'),'private':bool(s.get('private')),'sha':s.get('sha'),'before':stage,'action':'NONE'}
              if os.environ.get('HF_TOKEN') and not item['private'] and stage in {'PAUSED','STOPPED','RUNTIME_ERROR','BUILD_ERROR'}:
                  code,data=hfreq(f"/api/spaces/{item['id']}/restart",'POST');item['restart_http']=code
                  if code in {200,202}:item['action']='RESTART_REQUESTED';restarted.append(item['id'])
                  else:item['action']='RESTART_REFUSED'
              elif item['private'] and stage in {'PAUSED','STOPPED','RUNTIME_ERROR','BUILD_ERROR'}:item['action']='PRIVATE_FOLDED_PRESERVED'
              result['hf']['spaces'].append(item)
          if restarted:
              deadline=time.monotonic()+900;pending=set(restarted)
              while pending and time.monotonic()<deadline:
                  time.sleep(30)
                  for sid in list(pending):
                      code,d=hfreq(f'/api/spaces/{sid}');stage=str(((d or {}).get('runtime') or {}).get('stage') or 'UNAVAILABLE') if code==200 else 'UNAVAILABLE'
                      for item in result['hf']['spaces']:
                          if item['id']==sid:item['after']=stage
                      if stage in {'RUNNING','RUNNING_APP_STARTING','RUNNING_BUILDING'}:pending.remove(sid)

          def probe(url,follow=True):
              class No(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,req,fp,code,msg,headers,newurl):return None
              opener=urllib.request.build_opener() if follow else urllib.request.build_opener(No)
              try:
                  with opener.open(urllib.request.Request(url,headers={'User-Agent':'SZL-direct-convergence/1.0'}),timeout=30) as r:
                      body=r.read(131072);return {'status':r.status,'effective':r.geturl(),'location':r.headers.get('Location'),'body':body[:2000].decode('utf-8','replace')}
              except urllib.error.HTTPError as e:return {'status':e.code,'effective':e.geturl(),'location':e.headers.get('Location'),'body':e.read(131072)[:2000].decode('utf-8','replace')}
              except Exception as e:return {'status':'UNAVAILABLE','error':f'{type(e).__name__}: {e}'[:500]}
          result['domain']={'apex':probe('https://a-11-oy.com/'),'honest':probe('https://a-11-oy.com/api/a11oy/v1/honest'),'www':probe('https://www.a-11-oy.com/__szl_edge_probe__/path?contract=v3&preserve=yes',False),'hf_origin':probe('https://szlholdings-a11oy.hf.space/')}
          try:contract=json.loads(result['domain']['honest'].get('body') or '{}')
          except:contract={}
          result['domain']['contract']={'organ':contract.get('organ'),'locked_formula_count':contract.get('locked_formula_count')}
          expected='https://a-11-oy.com/__szl_edge_probe__/path?contract=v3&preserve=yes'
          result['domain']['verified']=bool(result['domain']['apex'].get('status')==200 and result['domain']['honest'].get('status')==200 and contract.get('organ')=='a11oy' and contract.get('locked_formula_count')==8 and result['domain']['www'].get('status') in {301,308} and result['domain']['www'].get('location')==expected and result['domain']['hf_origin'].get('status')==200)
          for repo,num in [('szl-holdings/szl-platform',9),('szl-holdings/szl-forge',88),('szl-holdings/killinchu',375),('szl-holdings/a11oy',1617),('szl-holdings/a11oy',1618),('szl-holdings/a11oy',1531)]:
              p=gh(f'repos/{repo}/pulls/{num}');result['known_handoffs'].append({'repo':repo,'number':num,'state':p.get('state') if isinstance(p,dict) else 'UNAVAILABLE','merged':bool(p.get('merged')) if isinstance(p,dict) else False,'merge_sha':p.get('merge_commit_sha') if isinstance(p,dict) else None,'title':p.get('title') if isinstance(p,dict) else None})
          nonheld=[p for p in result['open_prs'] if not p['draft'] and not p['hold'] and p['head']!='ops/codex-perplexity-recovery-20260904-v1']
          unhealthy=[r for r in result['default_branches'] if r.get('state')=='UNAVAILABLE' or r.get('failed') or r.get('pending')]
          public_bad=[s for s in result['hf']['spaces'] if not s['private'] and str(s.get('after',s['before'])) not in {'RUNNING','RUNNING_APP_STARTING','RUNNING_BUILDING'}]
          result['terminal']={'nonheld_open_prs':len(nonheld),'unhealthy_default_branches':len(unhealthy),'public_space_failures':len(public_bad),'unsafe_serialization_findings':len(result['hf']['unsafe']),'domain_verified':result['domain']['verified'],'hf_errors':len(result['hf']['errors']),'errors':len(result['errors'])}
          result['terminal']['complete']=bool(result['terminal']['nonheld_open_prs']==0 and result['terminal']['unhealthy_default_branches']==0 and result['terminal']['public_space_failures']==0 and result['terminal']['unsafe_serialization_findings']==0 and result['terminal']['domain_verified'] and result['terminal']['hf_errors']==0 and result['terminal']['errors']==0)
          Path('evidence/agent-recovery/2026-09-04/direct/final-direct.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
          python /tmp/direct.py

      - name: Render and publish direct receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('evidence/agent-recovery/2026-09-04/direct/final-direct.json').read_text())
          t=d['terminal'];lines=['# Direct agent estate convergence','',f"Generated: `{d['generated_at']}`",'',f"Overall: **{'COMPLETE' if t['complete'] else 'BLOCKED'}**",'',*[f'- {k}: **{v}**' for k,v in t.items()],'','## Passes','']
          for p in d['passes']:lines.append(f"- Pass {p['pass']}: observed {p['observed']}, merged {len(p['merged'])}, blocked {len(p['blocked'])}, held {len(p['held'])}, actions {len(p['actions'])}")
          if d['open_prs']:
              lines+=['','## Open PRs',''];lines += [f"- `{x['repo']}#{x['number']}` — hold `{x['hold']}` — `{x['mergeable_state']}` — {x['title']}" for x in d['open_prs']]
          bad=[x for x in d['default_branches'] if x.get('state')=='UNAVAILABLE' or x.get('failed') or x.get('pending')]
          if bad:
              lines+=['','## Current default-branch blockers',''];lines += [f"- `{x['repo']}` — failed `{[r.get('name') for r in x.get('failed',[])]}` — pending `{[r.get('name') for r in x.get('pending',[])]}`" for x in bad]
          lines+=['','## Domain', '',f"- apex `{d['domain']['apex'].get('status')}`",f"- honest `{d['domain']['honest'].get('status')}` / `{d['domain']['contract']}`",f"- www `{d['domain']['www'].get('status')}` → `{d['domain']['www'].get('location')}`",f"- HF origin `{d['domain']['hf_origin'].get('status')}`",f"- verified `{d['domain']['verified']}`",'', 'No credential value, protection, review, visibility, hardware, storage, billing, or provider state is fabricated or bypassed.']
          Path('evidence/agent-recovery/2026-09-04/direct/final-direct.md').write_text('\n'.join(lines)+'\n')
          PY
          gh issue comment 1326 --repo szl-holdings/a11oy --body-file evidence/agent-recovery/2026-09-04/direct/final-direct.md

      - name: Upload immutable direct receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: direct-agent-estate-convergence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/agent-recovery/2026-09-04/direct
          if-no-files-found: error
          retention-days: 90

      - name: Retire direct controller and retain evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin ops/codex-perplexity-recovery-20260904-v1
          git rm --ignore-unmatch .github/workflows/_direct_agent_estate_convergence_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/agent-recovery/2026-09-04/direct || true
          if ! git diff --cached --quiet; then
            git commit -s -m 'chore(evidence): retain direct agent estate convergence'
            git push origin HEAD:ops/codex-perplexity-recovery-20260904-v1
          fi
