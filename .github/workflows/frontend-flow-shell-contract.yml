name: Frontend Flow Shell Contract

on:
  pull_request:
    paths:
    - a11oy_landing.html
    - govern_showcase.html
    - cathedral_genius.html
    - pages/**
    - web/**
    - console/**
    - static/shared/szl_command_bar.css
    - static/shared/szl_command_bar.js
    - tools/check_holographic_shell_browser.py
    - tools/check_shared_shell_source_browser.py
    - tests/test_holographic_shell_contract.py
    - tests/test_command_bar_hit_target_contract.py
    - _vendor_blobs.py
    - spaces/**
    - docs/frontend-theme-registry-v1.json
    - docs/frontend-flow-shell-state.json
    - scripts/rollout_frontend_flow_shell.py
    - tests/test_frontend_flow_shell.py
    - tests/browser_landing_reflow.cjs
    - tests/test_cloudflare_product_edge.py
    - scripts/repair_cloudflare_product_edge.py
    - cloudflare/**
    - .github/workflows/repair-cloudflare-product-edge.yml
    - .github/workflows/frontend-flow-shell-contract.yml
    - .github/workflows/rollout-frontend-flow-shell.yml
  push:
    branches:
    - main
    paths:
    - a11oy_landing.html
    - govern_showcase.html
    - cathedral_genius.html
    - pages/**
    - web/**
    - console/**
    - static/shared/szl_command_bar.css
    - static/shared/szl_command_bar.js
    - tools/check_holographic_shell_browser.py
    - tools/check_shared_shell_source_browser.py
    - tests/test_holographic_shell_contract.py
    - tests/test_command_bar_hit_target_contract.py
    - _vendor_blobs.py
    - spaces/**
    - docs/frontend-theme-registry-v1.json
    - docs/frontend-flow-shell-state.json
    - scripts/rollout_frontend_flow_shell.py
    - tests/test_frontend_flow_shell.py
    - tests/browser_landing_reflow.cjs
    - tests/test_cloudflare_product_edge.py
    - scripts/repair_cloudflare_product_edge.py
    - cloudflare/**
    - .github/workflows/repair-cloudflare-product-edge.yml
    - .github/workflows/frontend-flow-shell-contract.yml
    - .github/workflows/rollout-frontend-flow-shell.yml
  workflow_dispatch: null
  merge_group:
    types:
    - checks_requested
permissions:
  contents: read

jobs:
  shared-shell-browser:
    name: Shared shell source qualification
    # Playwright 1.57.0 has no Chromium host build for ubuntu-26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Fetch the immutable stylesheet comparison base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          SHELL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$SHELL_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$SHELL_BASE_SHA"
          git cat-file -e "${SHELL_BASE_SHA}:static/shared/szl_command_bar.css"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the existing pinned browser test runner
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.57.0'
          # GitHub-hosted ubuntu-24.04 images ship the Chromium system libraries;
          # apt-based --with-deps is currently broken on the runner image and is not needed here.
          python -m playwright install chromium
      - name: Verify component and actual source-page behavior
        shell: bash
        env:
          SHELL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_holographic_shell_contract.py -v
          python -m unittest discover -s tests -p test_command_bar_hit_target_contract.py -v
          browser_bin="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tools/check_holographic_shell_browser.py --chromium "$browser_bin" --output "$RUNNER_TEMP/shared-shell-evidence/component"
          baseline=()
          if [[ -n "$SHELL_BASE_SHA" ]]; then baseline=(--base "$SHELL_BASE_SHA"); fi
          python tools/check_shared_shell_source_browser.py --chromium "$browser_bin" --output "$RUNNER_TEMP/shared-shell-evidence/source" "${baseline[@]}"
      - name: Retain source observations and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-shell-${{ github.sha }}
          path: ${{ runner.temp }}/shared-shell-evidence/
          if-no-files-found: error
          retention-days: 30

  landing-browser:
    name: Homepage source reflow
    # Playwright 1.57.0 has no Chromium host build for ubuntu-26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Fetch the immutable comparison base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          LANDING_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$LANDING_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$LANDING_BASE_SHA"
          git cat-file -e "${LANDING_BASE_SHA}:a11oy_landing.html"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install isolated browser test dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/landing-browser" --no-audit --no-fund playwright@1.57.0
          # GitHub-hosted ubuntu-24.04 images ship the Chromium system libraries;
          # apt-based --with-deps is currently broken on the runner image and is not needed here.
          "$RUNNER_TEMP/landing-browser/node_modules/.bin/playwright" install chromium
      - name: Compare exact source reflow against its base
        shell: bash
        env:
          LANDING_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          NODE_PATH="$RUNNER_TEMP/landing-browser/node_modules" \
            LANDING_EVIDENCE_DIR="$RUNNER_TEMP/landing-browser-evidence" \
            node tests/browser_landing_reflow.cjs
      - name: Retain source measurements and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-reflow-${{ github.sha }}
          path: ${{ runner.temp }}/landing-browser-evidence/
          if-no-files-found: error

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile rollout controller
        run: python -m py_compile scripts/rollout_frontend_flow_shell.py tests/test_frontend_flow_shell.py
      - name: Run offline flow-shell and edge contracts
        run: |
          python tests/test_frontend_flow_shell.py -v
          python tests/test_cloudflare_product_edge.py -v
      - name: Verify exact rollout when active
        shell: bash
        run: |
          state="$(python -c 'import json; print(json.load(open("docs/frontend-flow-shell-state.json"))["state"])')"
          if [ "$state" = "ROLLED_OUT" ]; then
            python scripts/rollout_frontend_flow_shell.py --check
          fi
      - name: Whitespace integrity
        run: git diff --check

  diagnose-browser-install:
    name: Diagnose browser install (temporary)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Stage A - download and launch chromium headless without apt
        shell: bash
        run: |
          set +e
          python -m pip install --disable-pip-version-check 'playwright==1.57.0' > /tmp/pip.log 2>&1
          pip_rc=$?
          python -m playwright install chromium > /tmp/pw-download.log 2>&1
          dl_rc=$?
          {
            echo "### Stage A"
            echo "- pip install exit: ${pip_rc}"
            echo "- playwright download exit: ${dl_rc}"
            echo; echo "#### download tail"; echo '```'; tail -n 10 /tmp/pw-download.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$pip_rc" -ne 0 ] || [ "$dl_rc" -ne 0 ]; then
            echo "::error::Stage A install failed (pip=${pip_rc}, download=${dl_rc})"
            tail -n 8 /tmp/pw-download.log
            exit 1
          fi
          if ! python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(headless=True); pg = b.new_page(); pg.goto("about:blank"); print("chromium launch OK:", b.version); b.close(); p.stop()' > /tmp/launch.log 2>&1; then
            echo "::error::Stage A headless chromium launch FAILED"
            tail -n 12 /tmp/launch.log
            exit 1
          fi
          {
            echo "- headless launch: OK"
            echo '```'; cat /tmp/launch.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stage B - publish why apt --with-deps fails (informational)
        shell: bash
        run: |
          set +e
          sudo apt-get update > /tmp/aptupdate.log 2>&1
          upd_rc=$?
          python -m playwright install-deps chromium > /tmp/pwdeps.log 2>&1
          deps_rc=$?
          {
            echo "### Stage B"
            echo "- apt-get update exit: ${upd_rc}"
            echo "- playwright install-deps exit: ${deps_rc}"
            echo; echo "#### apt update tail"; echo '```'; tail -n 12 /tmp/aptupdate.log; echo '```'
            echo; echo "#### install-deps tail"; echo '```'; tail -n 15 /tmp/pwdeps.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$upd_rc" -ne 0 ]; then
            echo "::warning::apt-get update exit ${upd_rc}"
            tail -n 10 /tmp/aptupdate.log | sed 's/^/apt-update: /' | while IFS= read -r line; do echo "::warning::$line"; done
          fi
          if [ "$deps_rc" -ne 0 ]; then
            echo "::warning::playwright install-deps exit ${deps_rc}"
            tail -n 15 /tmp/pwdeps.log | sed 's/^/deps: /' | while IFS= read -r line; do echo "::warning::$line"; done
          fi
