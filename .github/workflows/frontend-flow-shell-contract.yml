name: Frontend Flow Shell Contract

on:
  pull_request:
    paths:
    - a11oy_landing.html
    - govern_showcase.html
    - cathedral_genius.html
    - pages/**
    - web/**
    - console/**
    - spaces/**
    - docs/frontend-theme-registry-v1.json
    - docs/frontend-flow-shell-state.json
    - scripts/rollout_frontend_flow_shell.py
    - tests/test_frontend_flow_shell.py
    - tests/browser_landing_reflow.cjs
    - tests/test_cloudflare_product_edge.py
    - scripts/repair_cloudflare_product_edge.py
    - cloudflare/**
    - .github/workflows/repair-cloudflare-product-edge.yml
    - .github/workflows/frontend-flow-shell-contract.yml
    - .github/workflows/rollout-frontend-flow-shell.yml
  push:
    branches:
    - main
    paths:
    - a11oy_landing.html
    - govern_showcase.html
    - cathedral_genius.html
    - pages/**
    - web/**
    - console/**
    - spaces/**
    - docs/frontend-theme-registry-v1.json
    - docs/frontend-flow-shell-state.json
    - scripts/rollout_frontend_flow_shell.py
    - tests/test_frontend_flow_shell.py
    - tests/browser_landing_reflow.cjs
    - tests/test_cloudflare_product_edge.py
    - scripts/repair_cloudflare_product_edge.py
    - cloudflare/**
    - .github/workflows/repair-cloudflare-product-edge.yml
    - .github/workflows/frontend-flow-shell-contract.yml
    - .github/workflows/rollout-frontend-flow-shell.yml
  workflow_dispatch: null
  merge_group:
    types:
    - checks_requested
permissions:
  contents: read

jobs:
  landing-browser:
    name: Homepage source reflow
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install isolated browser test dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/landing-browser" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/landing-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compare exact source reflow against its base
        shell: bash
        env:
          LANDING_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          NODE_PATH="$RUNNER_TEMP/landing-browser/node_modules" \
            LANDING_EVIDENCE_DIR="$RUNNER_TEMP/landing-browser-evidence" \
            node tests/browser_landing_reflow.cjs
      - name: Retain source measurements and screenshots
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: landing-reflow-${{ github.sha }}
          path: ${{ runner.temp }}/landing-browser-evidence/
          if-no-files-found: error

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile rollout controller
        run: python -m py_compile scripts/rollout_frontend_flow_shell.py tests/test_frontend_flow_shell.py
      - name: Run offline flow-shell and edge contracts
        run: |
          python tests/test_frontend_flow_shell.py -v
          python tests/test_cloudflare_product_edge.py -v
      - name: Verify exact rollout when active
        shell: bash
        run: |
          state="$(python -c 'import json; print(json.load(open("docs/frontend-flow-shell-state.json"))["state"])')"
          if [ "$state" = "ROLLED_OUT" ]; then
            python scripts/rollout_frontend_flow_shell.py --check
          fi
      - name: Whitespace integrity
        run: git diff --check
