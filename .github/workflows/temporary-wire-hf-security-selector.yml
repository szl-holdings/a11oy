name: temporary-wire-hf-security-selector

on:
  push:
    branches:
      - fix/hf-security-selector-wiring-20260830
    paths:
      - .github/workflows/temporary-wire-hf-security-selector.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact wiring branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-security-selector-wiring-20260830
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact pinned core test closure
        run: python -m pip install --require-hashes -r .github/requirements/ci-core.txt

      - name: Route candidate admission through the protected-base selector
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/hf-module-drift.yml")
          text = path.read_text(encoding="utf-8")
          old = 'baseline/.github/scripts/verify_hf_candidate_admission.py'
          new = 'baseline/.github/scripts/select_hf_candidate_admission.py'
          if text.count(old) != 1 or new in text:
              raise SystemExit("candidate admission predecessor is not exact")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          python -m pytest -q \
            tests/test_hf_candidate_selector_wiring.py \
            tests/test_hf_security_candidate_admission.py \
            tests/test_verify_hf_candidate_admission.py
          git diff --check

      - name: Commit tested selector wiring and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          rm .github/workflows/temporary-wire-hf-security-selector.yml
          git add -A
          git commit \
            -m "fix(hf): route candidate admission through protected selector" \
            -m "The workflow still executes only immutable protected-base code; candidate head bytes remain inert data bound by exact Git and Hugging Face object identities." \
            -m "Signed-off-by: Stephen P. Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:refs/heads/fix/hf-security-selector-wiring-20260830
