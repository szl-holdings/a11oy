name: One-use narrow Killinchu revision policy

on:
  push:
    branches:
      - fix/public-estate-witness-provider-policy-v1
    paths:
      - .github/workflows/one-use-narrow-killinchu-revision.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-use-narrow-killinchu-revision
  cancel-in-progress: false

jobs:
  narrow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/public-estate-witness-provider-policy-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Narrow nested revision extraction and add regression
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('scripts/public_estate_live_witness.py')
          source = source_path.read_text(encoding='utf-8')
          broad = '''    # Killinchu's strict public route intentionally exposes build.revision rather
              # than duplicating a repository claim inside the process. Normalize only this
              # unambiguous nested runtime field; never treat an arbitrary deployment
              # revision as source identity.
              build = payload.get("build")
              if "source_revision" not in selected and isinstance(build, dict):
                  revision = build.get("revision")
                  if revision not in (None, ""):
                      selected["source_revision"] = revision
          '''
          if source.count(broad) != 1:
              raise SystemExit('expected exactly one broad nested-revision block')
          source = source.replace(broad, '', 1)

          old_revision = '    revision = str(result.get("source_revision", "")).lower()\n'
          new_revision = '    revision = str(build.get("revision", "")).lower()\n'
          if source.count(old_revision) != 1:
              raise SystemExit('expected exactly one policy revision assignment')
          source = source.replace(old_revision, new_revision, 1)

          old_binding = '    result["source_repository"] = str(surface["deployment_source_repository"])\n'
          new_binding = (
              '    result["source_revision"] = revision\n'
              '    result["source_repository"] = str(surface["deployment_source_repository"])\n'
          )
          if source.count(old_binding) != 1:
              raise SystemExit('expected exactly one manifest repository binding')
          source = source.replace(old_binding, new_binding, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_public_estate_live_witness.py')
          tests = test_path.read_text(encoding='utf-8')
          test_name = 'test_nested_build_revision_is_not_generic_source_identity'
          if test_name in tests:
              raise SystemExit('regression test already exists')
          tests += '''


def test_nested_build_revision_is_not_generic_source_identity():
    payload = {
        "service": "another-surface",
        "build": {
            "state": "OBSERVED",
            "revision": "e" * 40,
            "revision_source": "env:SZL_GIT_SHA",
        },
    }
    assert "source_revision" not in witness.selected_build_fields(payload)
'''
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Verify focused contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/public_estate_live_witness.py tests/test_public_estate_live_witness.py
          python -m pytest tests/test_public_estate_live_witness.py -q
          git diff --check

      - name: Commit durable repair and remove this controller
        run: |
          set -euo pipefail
          git config user.name 'Stephen Lutar'
          git config user.email 'stephenlutar2@gmail.com'
          git add scripts/public_estate_live_witness.py tests/test_public_estate_live_witness.py
          git rm .github/workflows/one-use-narrow-killinchu-revision.yml
          git commit -s -m 'fix(witness): confine nested revision trust to Killinchu'
          git push origin HEAD:fix/public-estate-witness-provider-policy-v1
