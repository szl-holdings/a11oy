name: Materialize vertical real-data bindings v2 once

on:
  push:
    branches:
      - feat/vertical-real-data-bindings-v1
    paths:
      - .github/workflows/zz-materialize-vertical-real-data-bindings-v2-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-vertical-real-data-bindings-v2
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/vertical-real-data-bindings-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Reset to current main and build permanent source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main feat/vertical-real-data-bindings-v1
          git reset --hard origin/main
          mkdir -p tests docs .github/workflows

          cat > /tmp/patch_vertical_publisher.py <<'PY'
          from __future__ import annotations

          import ast
          import re
          from pathlib import Path

          path = Path("scripts/hf_publish_vertical_flagships_v2.py")
          source = path.read_text(encoding="utf-8")

          bindings = {
              "terra": "terra",
              "sentra": "sentra",
              "counsel": "counsel",
              "finance": "finance",
              "vessels": "vessels",
              "lyte": "lyte",
          }
          for slug, vertical in bindings.items():
              pattern = re.compile(
                  rf'(?P<open>\{{\n\s*"slug": "{re.escape(slug)}",)(?P<body>.*?)(?P<close>\n\s*\}})',
                  re.DOTALL,
              )
              match = pattern.search(source)
              if match is None:
                  raise SystemExit(f"flagship block not found: {slug}")
              block = match.group(0)
              if '"evidence_upstream"' not in block:
                  upstream = re.search(r'(?m)^(\s*)"upstream": ([^\n]+),$', block)
                  if upstream is None:
                      raise SystemExit(f"upstream field missing: {slug}")
                  insertion = (
                      upstream.group(0)
                      + f'\n{upstream.group(1)}"evidence_upstream": '
                      + f'f"{{A11OY}}/api/a11oy/v1/real-data/vertical/{vertical}",'
                  )
                  block = block[: upstream.start()] + insertion + block[upstream.end() :]
                  source = source[: match.start()] + block + source[match.end() :]

          app = '''import concurrent.futures
          import json
          import time
          from pathlib import Path

          import httpx
          from fastapi import FastAPI
          from fastapi.responses import HTMLResponse

          CFG = json.loads(Path("config.json").read_text())
          INDEX = Path("index.html").read_text()
          app = FastAPI(title=CFG["title"] + " - SZL Holdings")


          def fetch_source(label, url):
              started = time.monotonic()
              try:
                  response = httpx.get(
                      url,
                      timeout=12,
                      follow_redirects=False,
                      headers={
                          "Accept": "application/json",
                          "User-Agent": "SZLHOLDINGS-Flagship/4.0",
                      },
                  )
                  content_type = response.headers.get("content-type", "")
                  body = (
                      response.json()
                      if "json" in content_type.casefold()
                      else {"text": response.text[:4000]}
                  )
                  state = "LIVE" if response.is_success else "UNAVAILABLE"
                  if label == "official_evidence" and isinstance(body, dict):
                      observed = str(body.get("state") or "").upper()
                      if observed in {"LIVE", "CACHED", "UNAVAILABLE"}:
                          state = observed
                  return {
                      "label": label,
                      "url": url,
                      "state": state,
                      "http_status": response.status_code,
                      "latency_ms": round((time.monotonic() - started) * 1000, 1),
                      "content_type": content_type,
                      "data": body,
                  }
              except Exception as exc:
                  return {
                      "label": label,
                      "url": url,
                      "state": "UNAVAILABLE",
                      "http_status": None,
                      "latency_ms": round((time.monotonic() - started) * 1000, 1),
                      "error": type(exc).__name__,
                      "data": None,
                  }


          def probe():
              targets = {
                  "product_feed": CFG["upstream"],
                  "official_evidence": CFG["evidence_upstream"],
              }
              with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                  futures = {
                      name: pool.submit(fetch_source, name, url)
                      for name, url in targets.items()
                  }
                  sources = {name: future.result() for name, future in futures.items()}
              product_live = sources["product_feed"]["state"] == "LIVE"
              evidence_live = sources["official_evidence"]["state"] in {"LIVE", "CACHED"}
              if product_live and evidence_live:
                  state = "LIVE"
              elif product_live or evidence_live:
                  state = "PARTIAL"
              else:
                  state = "UNAVAILABLE"
              return {
                  "schema": "szl.vertical-live-evidence/v1",
                  "state": state,
                  "status": state,
                  "product": CFG["title"],
                  "vertical": CFG["vertical"],
                  "sources": sources,
                  "truth": {
                      "product_feed": "OBSERVED_WHEN_HTTP_SUCCESS",
                      "official_evidence": "LIVE_OR_CACHED_OR_UNAVAILABLE",
                      "unavailable_is_not_zero": True,
                  },
                  "authority": {
                      "external_writes": "DISABLED",
                      "effectors": [],
                      "production_authorization": False,
                  },
              }


          @app.get("/healthz")
          def healthz():
              return {
                  "ok": True,
                  "product": CFG["title"],
                  "source": CFG["source"],
                  "public_experience": CFG["public_experience"],
                  "evidence_upstream": CFG["evidence_upstream"],
                  "external_writes": "DISABLED",
              }


          @app.get("/api/live")
          def live():
              return probe()


          @app.get("/api/source")
          def source():
              return CFG


          @app.get("/api/build-info")
          def build_info():
              return {
                  "git_sha": CFG["source_revision"],
                  "source": CFG["source"],
                  "public_experience": CFG["public_experience"],
                  "evidence_upstream": CFG["evidence_upstream"],
              }


          @app.get("/", response_class=HTMLResponse)
          def root():
              return INDEX
          '''
          app = "\n".join(line[10:] if line.startswith("          ") else line for line in app.splitlines()) + "\n"
          source, count = re.subn(
              r"APP = '''.*?'''\n\nDOCKER =",
              "APP = " + repr(app) + "\n\nDOCKER =",
              source,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("APP block replacement failed")

          html = '''<!doctype html>
          <html lang="en" data-szl-public-experience-v3="true" data-szl-vertical-evidence="4.0.0">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#030507">
          <title>__TITLE__ - SZL Holdings</title>
          <style>
          :root{color-scheme:dark;--bg:#030507;--panel:#091018;--line:#273442;--fg:#f4f7fa;--muted:#9dabb9;--accent:#7dd3fc;--ok:#91e6b4;--warn:#f8d57e;--touch:44px}
          *{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 78% 0,rgba(74,163,255,.14),transparent 34%),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),var(--bg);background-size:auto,32px 32px,32px 32px;color:var(--fg);font:15px/1.58 Inter,ui-sans-serif,system-ui,sans-serif}
          a{color:inherit}.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:9;background:#fff;color:#000;padding:12px;border-radius:8px}
          main{width:min(100%,1180px);margin:auto;padding:max(30px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(64px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
          nav{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:64px}.brand{font-weight:860;letter-spacing:.14em}.tag,.eyebrow,.chip{font:12px ui-monospace,monospace}.tag{min-height:var(--touch);display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:var(--muted)}
          .eyebrow{color:var(--accent);letter-spacing:.12em}h1{font-size:clamp(42px,9vw,108px);line-height:.9;letter-spacing:-.06em;margin:.2em 0;overflow-wrap:anywhere}.lede{max-width:76ch;color:var(--muted);font-size:clamp(17px,2vw,21px)}
          .summary{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr);gap:16px;margin-top:36px}.panel{min-width:0;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);border-radius:18px;padding:20px}.status{display:flex;align-items:center;gap:9px;font:12px ui-monospace,monospace}.dot{width:10px;height:10px;border-radius:50%;background:#64748b}.status.live .dot{background:var(--ok);box-shadow:0 0 18px var(--ok)}.status.partial .dot{background:var(--warn)}
          .source-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.source{min-width:0;border:1px solid var(--line);border-radius:14px;padding:14px}.source h2{font-size:15px;margin:0 0 6px}.meta{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.chip{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px 8px;margin-top:8px}
          .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button,a.action{min-height:var(--touch);display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:10px 15px;font-weight:760}button{border:0;background:var(--fg);color:#050607;cursor:pointer}.action{border:1px solid var(--line);text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
          pre{margin:0;max-width:100%;max-height:520px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;background:#020406;border:1px solid var(--line);border-radius:14px;padding:15px;color:#cbd5e1;font:12px/1.58 ui-monospace,monospace}.truth{display:grid;gap:10px;color:var(--muted);font-size:13px}.truth strong{color:var(--fg)}
          @media(max-width:780px){nav{margin-bottom:42px}.summary{grid-template-columns:minmax(0,1fr)}.source-grid{grid-template-columns:minmax(0,1fr)}}
          @media(max-width:420px){main{padding-inline:max(14px,env(safe-area-inset-left))}h1{font-size:clamp(38px,16vw,62px)}.panel{padding:15px}.actions>*{width:100%}}
          @media(hover:none),(pointer:coarse){button,a.action,.tag{min-height:48px}button{min-width:48px}}
          @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
          @media(prefers-contrast:more){:root{--line:#8697a8;--muted:#d0d9e2}}
          @media(forced-colors:active){button,.panel,.source,.tag,.chip,pre{forced-color-adjust:auto}}
          </style>
          </head>
          <body>
          <a class="skip" href="#content">Skip to evidence</a>
          <main id="content">
          <nav><div class="brand">SZL HOLDINGS</div><div class="tag">A11OY · GOVERNED VERTICAL</div></nav>
          <div class="eyebrow">__VERTICAL__</div>
          <h1>__TITLE__</h1>
          <p class="lede">A product feed and an official-source evidence channel are observed independently. Unavailable evidence stays visible; it is never converted into a zero, a success claim, or a demo record.</p>
          <section class="summary">
          <section class="panel truth">
          <div id="st" class="status" role="status" aria-live="polite"><span class="dot"></span><span>PROBING</span></div>
          <div><strong>Product feed</strong><br><span id="primaryState">CHECKING</span></div>
          <div><strong>Official evidence</strong><br><span id="evidenceState">CHECKING</span></div>
          <div><strong>Authority</strong><br>External writes DISABLED · effectors []</div>
          <div class="actions"><button id="refresh" type="button">Refresh evidence</button><a class="action" href="/api/live">Developer JSON</a><a class="action" href="/api/build-info">Build identity</a></div>
          </section>
          <section class="panel">
          <div class="source-grid"><article class="source"><h2>Product feed</h2><div id="primaryUrl" class="meta">CHECKING</div><span id="primaryChip" class="chip">UNAVAILABLE</span></article><article class="source"><h2>Official-source evidence</h2><div id="evidenceUrl" class="meta">CHECKING</div><span id="evidenceChip" class="chip">UNAVAILABLE</span></article></div>
          <pre id="out">Loading governed evidence…</pre>
          </section>
          </section>
          </main>
          <script>
          const $=id=>document.getElementById(id);
          function paint(name,value){$(name+'State').textContent=value.state||'UNAVAILABLE';$(name+'Url').textContent=value.url||'UNAVAILABLE';$(name+'Chip').textContent=value.state||'UNAVAILABLE'}
          async function load(){const status=$('st'),out=$('out');$('refresh').disabled=true;try{const response=await fetch('/api/live',{cache:'no-store',headers:{Accept:'application/json'}});const value=await response.json();const state=value.state||'UNAVAILABLE';status.className='status '+state.toLowerCase();status.children[1].textContent=state;paint('primary',value.sources?.product_feed||{});paint('evidence',value.sources?.official_evidence||{});out.textContent=JSON.stringify(value,null,2)}catch(error){status.className='status';status.children[1].textContent='UNAVAILABLE';out.textContent=String(error)}finally{$('refresh').disabled=false}}
          $('refresh').addEventListener('click',load);load();setInterval(load,60000);
          </script>
          </body>
          </html>
          '''
          html = "\n".join(line[10:] if line.startswith("          ") else line for line in html.splitlines()) + "\n"
          source, count = re.subn(
              r"HTML_TEMPLATE = '''.*?'''\n\n\ndef token_from_env",
              "HTML_TEMPLATE = " + repr(html) + "\n\n\ndef token_from_env",
              source,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("HTML template replacement failed")

          for anchor, insertion in (
              (
                  '                    "upstream": item["upstream"],\n',
                  '                    "evidence_upstream": item["evidence_upstream"],\n',
              ),
              (
                  '            "upstream": item["upstream"],\n',
                  '            "evidence_upstream": item["evidence_upstream"],\n',
              ),
          ):
              if anchor not in source:
                  raise SystemExit(f"config anchor missing: {anchor.strip()}")
              if insertion not in source:
                  source = source.replace(anchor, anchor + insertion, 1)

          probe_pattern = re.compile(
              r"def probe_root\(slug: str, \*, timeout: int = 20\) -> dict\[str, Any\]:.*?\n\n\ndef main\(\) -> int:",
              re.DOTALL,
          )
          probe = '''def probe_space(
              slug: str,
              expected_evidence: str,
              *,
              timeout: int = 20,
          ) -> dict[str, Any]:
              root_url = f"https://szlholdings-{slug}.hf.space/"
              api_url = root_url + "api/live"
              result: dict[str, Any] = {
                  "url": root_url,
                  "api_url": api_url,
                  "http_status": None,
                  "api_http_status": None,
                  "v3_marker": False,
                  "api_contract": False,
              }
              request = urllib.request.Request(root_url, headers={"User-Agent": USER_AGENT})
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      result["http_status"] = response.status
                      result["v3_marker"] = PUBLIC_EXPERIENCE_MARKER in body
              except urllib.error.HTTPError as exc:
                  result["http_status"] = exc.code
              except Exception as exc:
                  result["root_error"] = f"{type(exc).__name__}: {exc}"

              request = urllib.request.Request(
                  api_url,
                  headers={"User-Agent": USER_AGENT, "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      raw = response.read()
                      api_status = response.status
                  payload = json.loads(raw.decode("utf-8"))
                  sources = payload.get("sources") if isinstance(payload, dict) else None
                  official = sources.get("official_evidence") if isinstance(sources, dict) else None
                  official_state = str(official.get("state") or "") if isinstance(official, dict) else ""
                  result["api_http_status"] = api_status
                  result["vertical_state"] = payload.get("state") if isinstance(payload, dict) else None
                  result["evidence_state"] = official_state
                  result["evidence_url"] = official.get("url") if isinstance(official, dict) else None
                  result["api_contract"] = (
                      api_status == 200
                      and isinstance(payload, dict)
                      and payload.get("schema") == "szl.vertical-live-evidence/v1"
                      and payload.get("state") in {"LIVE", "PARTIAL", "UNAVAILABLE"}
                      and isinstance(sources, dict)
                      and isinstance(sources.get("product_feed"), dict)
                      and isinstance(official, dict)
                      and official.get("url") == expected_evidence
                      and official_state in {"LIVE", "CACHED", "UNAVAILABLE"}
                      and (payload.get("authority") or {}).get("external_writes") == "DISABLED"
                      and (payload.get("authority") or {}).get("effectors") == []
                  )
              except urllib.error.HTTPError as exc:
                  result["api_http_status"] = exc.code
              except Exception as exc:
                  result["api_error"] = f"{type(exc).__name__}: {exc}"
              return result


          def main() -> int:'''
          probe = "\n".join(line[10:] if line.startswith("          ") else line for line in probe.splitlines())
          source, count = probe_pattern.subn(probe, source, count=1)
          if count != 1:
              raise SystemExit("probe function replacement failed")

          source = source.replace(
              '            root = probe_root(slug)\n',
              '            root = probe_space(slug, row["evidence_upstream"])\n',
          )
          ok_pattern = re.compile(
              r'(?P<indent>\s*)row\["ok"\] = \(\n(?P=indent)    row\.get\("stage"\) == "RUNNING"\n(?P=indent)    and root\.get\("http_status"\) == 200\n(?P=indent)    and root\.get\("v3_marker"\) is True\n(?P=indent)\)',
          )
          match = ok_pattern.search(source)
          if match is None:
              raise SystemExit("publisher final ok contract not found")
          indent = match.group("indent")
          replacement = (
              f'{indent}row["ok"] = (\n'
              f'{indent}    row.get("stage") == "RUNNING"\n'
              f'{indent}    and root.get("http_status") == 200\n'
              f'{indent}    and root.get("v3_marker") is True\n'
              f'{indent}    and root.get("api_http_status") == 200\n'
              f'{indent}    and root.get("api_contract") is True\n'
              f'{indent})'
          )
          source = source[: match.start()] + replacement + source[match.end() :]

          ast.parse(source)
          path.write_text(source, encoding="utf-8")
          PY

          python /tmp/patch_vertical_publisher.py

          cat > tests/test_hf_vertical_real_data_bindings.py <<'PY'
          from __future__ import annotations

          import ast
          import re
          from pathlib import Path

          SCRIPT = Path("scripts/hf_publish_vertical_flagships_v2.py")


          def source() -> str:
              value = SCRIPT.read_text(encoding="utf-8")
              ast.parse(value)
              return value


          def test_all_six_flagships_bind_the_governed_gateway() -> None:
              value = source()
              for slug, vertical in {
                  "terra": "terra",
                  "sentra": "sentra",
                  "counsel": "counsel",
                  "finance": "finance",
                  "vessels": "vessels",
                  "lyte": "lyte",
              }.items():
                  block = re.search(
                      rf'\{{\n\s*"slug": "{slug}",.*?\n\s*\}}',
                      value,
                      re.DOTALL,
                  )
                  assert block is not None
                  assert f'/api/a11oy/v1/real-data/vertical/{vertical}' in block.group(0)


          def test_runtime_and_publisher_require_both_source_channels() -> None:
              value = source()
              for marker in (
                  "ThreadPoolExecutor(max_workers=2)",
                  '"product_feed"',
                  '"official_evidence"',
                  '"szl.vertical-live-evidence/v1"',
                  '"PARTIAL"',
                  '"external_writes": "DISABLED"',
                  '"effectors": []',
                  'data-szl-public-experience-v3="true"',
                  'data-szl-vertical-evidence="4.0.0"',
                  "def probe_space(",
                  'official.get("url") == expected_evidence',
                  'root.get("api_contract") is True',
              ):
                  assert marker in value
          PY

          cat > scripts/verify_vertical_real_data_spaces.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path
          from typing import Any, Mapping

          VERTICALS = {
              "terra": "terra",
              "sentra": "sentra",
              "counsel": "counsel",
              "finance": "finance",
              "vessels": "vessels",
              "lyte": "lyte",
          }


          class ProofError(RuntimeError):
              pass


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):  # type: ignore[no-untyped-def]
                  return None


          def get(url: str) -> tuple[dict[str, Any], bytes]:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json,text/html;q=0.9,*/*;q=0.1",
                      "Cache-Control": "no-cache, no-store",
                      "User-Agent": "SZL-Vertical-Real-Data-Proof/1.0",
                  },
              )
              try:
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=45) as response:
                      body = response.read(1_048_577)
                      status = response.status
                      location = response.headers.get("location")
              except urllib.error.HTTPError as exc:
                  body = exc.read(65_536)
                  status = exc.code
                  location = exc.headers.get("location")
              if status != 200 or location or not body or len(body) > 1_048_576:
                  raise ProofError(f"{url} failed exact response contract")
              return {
                  "url": url,
                  "status": status,
                  "bytes": len(body),
                  "sha256": hashlib.sha256(body).hexdigest(),
              }, body


          def as_object(body: bytes, url: str) -> Mapping[str, Any]:
              try:
                  value = json.loads(body.decode("utf-8"))
              except Exception as exc:
                  raise ProofError(f"{url} returned invalid JSON") from exc
              if not isinstance(value, Mapping):
                  raise ProofError(f"{url} JSON is not an object")
              return value


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--output", required=True)
              args = parser.parse_args()
              rows = []
              observed = 0
              for slug, vertical in VERTICALS.items():
                  root = f"https://szlholdings-{slug}.hf.space/"
                  root_evidence, root_body = get(root)
                  text = root_body.decode("utf-8")
                  if (
                      'data-szl-public-experience-v3="true"' not in text
                      or 'data-szl-vertical-evidence="4.0.0"' not in text
                  ):
                      raise ProofError(f"{slug} lacks the mobile evidence contract")
                  api_evidence, api_body = get(root + "api/live")
                  payload = as_object(api_body, root + "api/live")
                  sources = payload.get("sources")
                  official = sources.get("official_evidence") if isinstance(sources, Mapping) else None
                  expected = (
                      "https://szlholdings-a11oy.hf.space"
                      f"/api/a11oy/v1/real-data/vertical/{vertical}"
                  )
                  if (
                      payload.get("schema") != "szl.vertical-live-evidence/v1"
                      or payload.get("state") not in {"LIVE", "PARTIAL", "UNAVAILABLE"}
                      or not isinstance(official, Mapping)
                      or official.get("url") != expected
                      or official.get("state") not in {"LIVE", "CACHED", "UNAVAILABLE"}
                      or (payload.get("authority") or {}).get("external_writes") != "DISABLED"
                      or (payload.get("authority") or {}).get("effectors") != []
                  ):
                      raise ProofError(f"{slug} violates the governed evidence contract")
                  if official.get("state") in {"LIVE", "CACHED"}:
                      observed += 1
                  rows.append(
                      {
                          "slug": slug,
                          "vertical": vertical,
                          "state": payload.get("state"),
                          "official_evidence_state": official.get("state"),
                          "root": root_evidence,
                          "api": api_evidence,
                      }
                  )
              if observed == 0:
                  raise ProofError("no Space observed current or cached official evidence")
              report = {
                  "schema": "szl.vertical-real-data-proof/v1",
                  "ok": True,
                  "space_count": len(rows),
                  "official_evidence_observed_count": observed,
                  "spaces": rows,
                  "external_writes": "DISABLED",
                  "effectors": [],
              }
              Path(args.output).write_text(
                  json.dumps(report, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              print(json.dumps(report, indent=2, sort_keys=True))
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          cat > docs/VERTICAL_REAL_DATA_BINDINGS.md <<'MD'
          # Six public verticals — governed real-data binding

          Each flagship Space presents its existing product feed and a separate official/provider-operated source reached through the A11oy Real Data Gateway.

          | Space | Governed evidence |
          |---|---|
          | Terra | U.S. Census ACS median home value |
          | Sentra | CISA Known Exploited Vulnerabilities |
          | PRISM Counsel | Federal Register documents |
          | PURIQ Finance | U.S. Treasury Fiscal Data |
          | Vessels | NOAA CO-OPS water-level observations |
          | Lyte | GitHub Status components |

          The mobile surface shows both states independently. `UNAVAILABLE` is never converted into a zero or success claim. All routes remain read-only with `external_writes=DISABLED`, `effectors=[]`, and no production authorization.
          MD

          cat > .github/workflows/vertical-real-data-bindings.yml <<'YAML'
          name: Vertical Real Data Bindings

          on:
            pull_request:
              paths:
                - scripts/hf_publish_vertical_flagships_v2.py
                - tests/test_hf_vertical_real_data_bindings.py
                - scripts/verify_vertical_real_data_spaces.py
                - docs/VERTICAL_REAL_DATA_BINDINGS.md
                - .github/workflows/vertical-real-data-bindings.yml
            push:
              branches: [main]
              paths:
                - scripts/hf_publish_vertical_flagships_v2.py
                - tests/test_hf_vertical_real_data_bindings.py
                - scripts/verify_vertical_real_data_spaces.py
                - docs/VERTICAL_REAL_DATA_BINDINGS.md
                - .github/workflows/vertical-real-data-bindings.yml
            workflow_run:
              workflows: ["HF Publish Vertical Flagships"]
              types: [completed]

          permissions:
            actions: write
            contents: read

          jobs:
            source-contract:
              if: github.event_name == 'pull_request'
              runs-on: ubuntu-24.04
              timeout-minutes: 12
              steps:
                - name: Harden runner
                  uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
                  with:
                    egress-policy: audit
                - name: Checkout exact candidate
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    persist-credentials: false
                - name: Set up Python
                  uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
                  with:
                    python-version: '3.12'
                - name: Prove all six source and mobile contracts
                  run: |
                    set -euo pipefail
                    python -m pytest tests/test_hf_vertical_real_data_bindings.py -q
                    python -m py_compile scripts/hf_publish_vertical_flagships_v2.py scripts/verify_vertical_real_data_spaces.py
                    git diff --check

            dispatch-canonical-writer:
              if: github.event_name == 'push'
              runs-on: ubuntu-24.04
              timeout-minutes: 5
              steps:
                - name: Dispatch the single canonical vertical writer
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: gh workflow run hf-publish-vertical-flagships.yml --repo "$GITHUB_REPOSITORY" --ref main

            live-proof:
              if: >-
                github.event_name == 'workflow_run' &&
                github.event.workflow_run.conclusion == 'success' &&
                github.event.workflow_run.head_branch == 'main' &&
                github.event.workflow_run.repository.full_name == github.repository
              runs-on: ubuntu-24.04
              timeout-minutes: 15
              steps:
                - name: Harden runner
                  uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
                  with:
                    egress-policy: audit
                - name: Checkout current protected main
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    ref: main
                    fetch-depth: 1
                    persist-credentials: false
                - name: Set up Python
                  uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
                  with:
                    python-version: '3.12'
                - name: Prove six deployed mobile evidence contracts
                  run: python scripts/verify_vertical_real_data_spaces.py --output /tmp/vertical-real-data-spaces.json
                - name: Upload immutable proof
                  uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                  with:
                    name: vertical-real-data-proof-${{ github.run_id }}-${{ github.run_attempt }}
                    path: /tmp/vertical-real-data-spaces.json
                    if-no-files-found: error
                    retention-days: 180
          YAML

          rm -f \
            .github/workflows/zz-materialize-vertical-real-data-bindings-once.yml \
            .github/workflows/zz-materialize-vertical-real-data-bindings-v2-once.yml

          python -m py_compile scripts/hf_publish_vertical_flagships_v2.py scripts/verify_vertical_real_data_spaces.py tests/test_hf_vertical_real_data_bindings.py
          python -m pytest tests/test_hf_vertical_real_data_bindings.py -q
