name: Council kernel contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/council-kernel/**"
      - ".github/workflows/council-kernel.yml"

permissions:
  contents: read

concurrency:
  group: council-kernel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile kernel and tests
        run: >-
          python -m compileall -q
          packages/council-kernel/src
          packages/council-kernel/tests

      - name: Run authority, veto, diversity, ledger, and receipt tests
        env:
          PYTHONPATH: packages/council-kernel/src
        run: >-
          python -m unittest discover
          -s packages/council-kernel/tests
          -v

      - name: Reject whitespace errors
        run: >-
          git diff --check origin/main...HEAD --
          packages/council-kernel
          .github/workflows/council-kernel.yml
