name: Readiness phase-B source snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/readiness-phase-b-source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    if: >-
      github.event.pull_request.user.login == 'stephenlutar2-hash' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/readiness-observation-clocks-20260817' &&
      github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/readiness-observation-clocks-20260817
          persist-credentials: false
      - name: Bind checked-out tree to PR head
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
      - name: Resolve exact phase-B route owners
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase-b-source
          cp --parents \
            serve.py \
            szl_provenance.py \
            szl_energy_live.py \
            a11oy_warhacker_obs.py \
            routers/frontier_reads.py \
            tools/readiness-harness/gen_tabs_matrix.py \
            tools/readiness-harness/tabs.json \
            /tmp/phase-b-source/
          rg -ni -C 12 'kevgate|live KEV IDs/dates/vendors|data_kind.*EPSS|sec/.{0,24}kev' . \
            --glob '!tools/readiness-harness/readiness-verdict.json' \
            > /tmp/phase-b-source/kevgate-search.txt || true
          mapfile -t owners < <(rg -li 'kevgate|live KEV IDs/dates/vendors|data_kind.*EPSS|sec/.{0,24}kev' . \
            --glob '!tools/readiness-harness/readiness-verdict.json' | sort -u)
          for file in "${owners[@]}"; do
            test -f "$file" && cp --parents "$file" /tmp/phase-b-source/
          done
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/phase-b-source/source-sha.txt
      - name: Capture live route and runtime identity without mutation
        shell: bash
        run: |
          set -uo pipefail
          origin='https://szlholdings-a11oy.hf.space'
          curl --fail --silent --show-error --max-time 20 \
            "$origin/api/build-info" \
            > /tmp/phase-b-source/live-build-info.json || printf '{"state":"UNAVAILABLE"}\n' > /tmp/phase-b-source/live-build-info.json
          curl --fail --silent --show-error --max-time 20 \
            "$origin/api/a11oy/v1/sec/kevgate" \
            > /tmp/phase-b-source/live-kevgate.json || printf '{"state":"UNAVAILABLE"}\n' > /tmp/phase-b-source/live-kevgate.json
          curl --fail --silent --show-error --max-time 30 \
            "$origin/openapi.json" \
            > /tmp/phase-b-source/live-openapi.json || printf '{"paths":{}}\n' > /tmp/phase-b-source/live-openapi.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/phase-b-source')
          try:
              doc = json.loads((root / 'live-openapi.json').read_text())
          except Exception:
              doc = {'paths': {}}
          paths = {
              path: value for path, value in (doc.get('paths') or {}).items()
              if 'kev' in path.lower() or 'mesh/state' in path.lower()
          }
          (root / 'live-openapi-phase-b.json').write_text(
              json.dumps({'paths': paths}, indent=2, sort_keys=True) + '\n'
          )
          PY
      - name: Upload exact phase-B source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readiness-phase-b-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/phase-b-source
          if-no-files-found: error
          retention-days: 7
