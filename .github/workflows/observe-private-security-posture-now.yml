name: Observe current private security posture

on:
  push:
    branches:
      - diag/private-security-posture-20260905
    paths:
      - .github/workflows/observe-private-security-posture-now.yml
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  security-events: read

concurrency:
  group: observe-private-security-posture-now
  cancel-in-progress: false

env:
  TARGET_REVISION: 9fbae997b48db45a9e890f79692e94acf14425a3
  REPORT_PATH: private-security-posture.json

jobs:
  observe:
    name: Re-observe aggregate private alerts without dismissing anything
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SZL_SECURITY_TOKEN: ${{ secrets.SZL_ORG_ADMIN_TOKEN || secrets.ORG_ADMIN_TOKEN || secrets.SZL_GITHUB_TOKEN || secrets.GH_PAT || github.token }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_REVISION }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prove the redaction and no-dismissal contracts
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_private_security_posture
          python -m py_compile .github/scripts/private_security_posture.py
          git diff --check

      - name: Collect a dry-run redacted posture receipt
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/private_security_posture.py \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$TARGET_REVISION" \
            --default-branch main \
            --report "$REPORT_PATH"

      - name: Independently enforce the public persistence boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          module_path = Path('.github/scripts/private_security_posture.py')
          spec = importlib.util.spec_from_file_location('private_security_posture', module_path)
          if spec is None or spec.loader is None:
              raise SystemExit('posture verifier could not load the controller')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          receipt = json.loads(Path('private-security-posture.json').read_text(encoding='utf-8'))
          if receipt.get('schema') != module.SCHEMA:
              raise SystemExit('unexpected private posture schema')
          if receipt.get('incident_action') != 'DRY_RUN':
              raise SystemExit('diagnostic unexpectedly mutated incident state')
          privacy = receipt.get('privacy') or {}
          required_false = (
              'raw_alerts_persisted',
              'alert_urls_persisted',
              'paths_persisted',
              'secret_types_persisted',
              'automatic_dismissal',
          )
          if any(privacy.get(key) is not False for key in required_false):
              raise SystemExit('privacy declaration failed closed')
          if module.public_receipt_errors(receipt):
              raise SystemExit('private data crossed the public persistence boundary')
          print(json.dumps({
              'schema': receipt['schema'],
              'source_revision': receipt['source_revision'],
              'summary_digest': receipt['summary_digest'],
              'families': receipt['families'],
              'attention': receipt['attention'],
              'incident_action': receipt['incident_action'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload immutable redacted diagnostic receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-security-posture-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 30
