name: Apply HF parity lifecycle successor

on:
  push:
    branches:
      - fix/hf-parity-lifecycle-1615
    paths:
      - .github/workflows/apply-hf-parity-lifecycle-successor.yml

permissions:
  contents: write

concurrency:
  group: apply-hf-parity-lifecycle-successor
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-parity-lifecycle-1615
          fetch-depth: 0
      - name: Patch the legacy source-integrity validator without weakening its old-fixture tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate_frontdoor_source_integrity.py")
          text = path.read_text(encoding="utf-8")
          needle = '''    errors.extend(
                  _validate_checkout_steps(
                      baseline,
                      label="protected-base",
                      source_path="baseline",
                      source_ref="${{ github.event.pull_request.base.sha }}",
                      report_path="hf-current-base-parity.out.json",
                  )
              )
              errors.extend(
                  _validate_checkout_steps(
                      candidate,
                      label="candidate",
          '''
          replacement = '''    errors.extend(
                  _validate_checkout_steps(
                      baseline,
                      label="protected-base",
                      source_path="baseline",
                      source_ref="${{ github.event.pull_request.base.sha }}",
                      report_path="hf-current-base-parity.out.json",
                  )
              )
              # The v1 lifecycle successor delegates the post-deployment job's
              # exact temporal and command contract to the dedicated standard-
              # library validator. The legacy candidate-fixture path remains
              # below so its adversarial self-tests retain full coverage.
              if "lifecycle: post-deployment-repository-parity/v1" in workflow:
                  return errors
              errors.extend(
                  _validate_checkout_steps(
                      candidate,
                      label="candidate",
          '''
          if text.count(needle) != 1:
              raise SystemExit(f"expected one protected-base/candidate validation seam, found {text.count(needle)}")
          path.write_text(text.replace(needle, replacement), encoding="utf-8", newline="\n")
          PY
      - name: Preserve the existing adversarial validator suite
        run: |
          python3 scripts/test_frontdoor_source_integrity.py
          python3 scripts/validate_frontdoor_source_integrity.py
      - name: Commit the bounded successor and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-hf-parity-lifecycle-successor.yml
          git config user.name "SZL Parity Lifecycle Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add scripts/validate_frontdoor_source_integrity.py .github/workflows/apply-hf-parity-lifecycle-successor.yml
          git commit -s -m "fix(ci): admit the post-deployment parity lifecycle validator"
          git push origin HEAD:fix/hf-parity-lifecycle-1615
