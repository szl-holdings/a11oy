name: Refresh gated-inventory stage matrix once

on:
  push:
    branches:
      - fix/public-inventory-gated-evidence-20260905
    paths:
      - .github/workflows/_refresh_gated_inventory_stage_matrix_once.yml

permissions:
  contents: write

concurrency:
  group: gated-inventory-stage-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Generate, verify, commit, and self-remove
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/public-inventory-gated-evidence-20260905
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Regenerate and verify the derived stage matrix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_ecosystem_stage_matrix.py
          python scripts/build_ecosystem_stage_matrix.py --check
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('docs/huggingface-ecosystem-manifest.json').read_text(encoding='utf-8'))
          matrix = json.loads(Path('docs/ecosystem-stage-matrix.json').read_text(encoding='utf-8'))
          assert manifest['schemaVersion'] == 2
          assert matrix['observedAt'] == manifest['observedAt']
          assert matrix['machineGeneratedCounts']['huggingFacePublic'] == manifest['counts']
          PY
          git diff --check

      - name: Commit only the matrix and remove this controller
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git status --porcelain -- docs/ecosystem-stage-matrix.json)
          test -n "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/ecosystem-stage-matrix.json
          git rm -- .github/workflows/_refresh_gated_inventory_stage_matrix_once.yml
          git commit -s -m 'fix(hf): refresh stage matrix for gated public evidence'
          git push origin HEAD:fix/public-inventory-gated-evidence-20260905
