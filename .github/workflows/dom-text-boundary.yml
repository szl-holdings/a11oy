name: DOM text boundary browser regressions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: dom-text-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Verify literal text, local controls, and explicit route dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install isolated pinned browser runner
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Exercise actual pages with intercepted synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dom-evidence
          git rev-parse HEAD > dom-evidence/checkout.txt
          python tests/browser_dom_text_boundaries.py 2>&1 | tee dom-evidence/tests.log
      - name: Preserve actual test outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dom-text-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: dom-evidence/
          if-no-files-found: error
          retention-days: 30
