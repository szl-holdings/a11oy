name: DOM text boundary browser regressions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: dom-text-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Verify literal text, local controls, and explicit route dispatch
    # Playwright 1.57.0 has no Chromium host build for ubuntu-26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install isolated pinned browser runner
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Exercise actual pages with intercepted synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dom-evidence
          git rev-parse HEAD > dom-evidence/checkout.txt
          python tests/browser_dom_text_boundaries.py 2>&1 | tee dom-evidence/tests.log
      - name: Preserve actual test outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dom-text-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: dom-evidence/
          if-no-files-found: error
          retention-days: 30
