name: Materialize public inventory gate repair once

on:
  push:
    branches: [fix/public-inventory-gated-evidence-20260905]
    paths: [.github/workflows/materialize-inventory-gate-once.yml]

permissions:
  contents: write

concurrency:
  group: materialize-public-inventory-gate-once
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/fix/public-inventory-gated-evidence-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the exact isolated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Prove old behavior fails then materialize reviewed repair
        shell: bash
        run: |
          set -euo pipefail
          if python -S scripts/test_hf_gated_public_inventory.py > /tmp/gated-red.txt 2>&1; then
            echo 'Expected the original collector to fail the new access contract'
            exit 1
          fi
          tail -n 6 /tmp/gated-red.txt
          python -S scripts/materialize_inventory_gate_once.py
          python -S scripts/test_audit_huggingface_ecosystem.py
          python -S scripts/test_hf_gated_public_inventory.py
          python -S -m py_compile scripts/audit_huggingface_ecosystem.py
          git diff --check
      - name: Generate and independently check current public-only inventory
        shell: bash
        run: |
          set -euo pipefail
          python -S scripts/audit_huggingface_ecosystem.py
          python -S scripts/audit_huggingface_ecosystem.py --check
          python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          value = json.loads(Path('docs/huggingface-ecosystem-manifest.json').read_text())
          schema = json.loads(Path('docs/huggingface-ecosystem-manifest.schema.json').read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(value)
          restricted = [item['id'] for rows in value['inventory'].values() for item in rows if item.get('gated')]
          print(json.dumps({'schema_version': value['schemaVersion'], 'observed_at': value['observedAt'], 'counts': value['counts'], 'restricted': restricted, 'authenticated': value['inventoryScope']['authenticated'], 'protected_downloads_requested': False}, sort_keys=True))
          PY
      - name: Commit only reviewed source, schema, and public snapshot to this branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/public-inventory-gated-evidence-20260905
          observed="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$observed" = "$EXPECTED_HEAD"
          rm scripts/materialize_inventory_gate_once.py
          git add -- scripts/audit_huggingface_ecosystem.py docs/huggingface-ecosystem-manifest.schema.json docs/huggingface-ecosystem-manifest.json scripts/materialize_inventory_gate_once.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(hf): record gated public metadata without protected file access'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
