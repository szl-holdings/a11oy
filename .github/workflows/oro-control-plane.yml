name: ORO operational control plane

on:
  pull_request:
    paths:
      - "oro/**"
      - "schemas/oro/**"
      - "deploy/oro/**"
      - "tests/test_oro_operational_v3.py"
      - ".github/workflows/oro-control-plane.yml"
  push:
    branches: [main]
    paths:
      - "oro/**"
      - "schemas/oro/**"
      - "deploy/oro/**"
      - "tests/test_oro_operational_v3.py"
      - ".github/workflows/oro-control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oro-control-plane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install exact core test dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt
      - name: Compile the complete ORO runtime
        run: python3 -m compileall -q oro tests/test_oro_operational_v3.py
      - name: Validate committed JSON schemas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("schemas/oro/v1").glob("*.json"))
          assert files, "no ORO schemas found"
          for path in files:
              value = json.loads(path.read_text(encoding="utf-8"))
              assert value.get("$schema") == "https://json-schema.org/draft/2020-12/schema", path
              assert value.get("$id"), path
              assert value.get("additionalProperties") is False, path
          print(f"validated {len(files)} ORO Draft 2020-12 schemas")
          PY
      - name: Prove rank, barrier, signing, persistence, API, and refusal contracts
        run: python3 -m pytest -q tests/test_oro_operational_v3.py
      - name: Start real Uvicorn loopback runtime
        env:
          SZL_ORO_ENV: development
          SZL_ORO_DB_PATH: ${{ runner.temp }}/oro-loopback.sqlite
          SZL_ORO_ALLOW_EPHEMERAL_SIGNER: "1"
          SZL_ORO_ALLOW_DEVELOPMENT_AUTH: "1"
        run: |
          set -euo pipefail
          python3 -m uvicorn oro.api:app --host 127.0.0.1 --port 8877 >"$RUNNER_TEMP/oro-uvicorn.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/oro-uvicorn.pid"
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:8877/api/a11oy/v1/oro/readyz >"$RUNNER_TEMP/oro-ready.json"; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent --show-error http://127.0.0.1:8877/api/a11oy/v1/oro/healthz >"$RUNNER_TEMP/oro-health.json"
          curl --fail --silent --show-error http://127.0.0.1:8877/api/a11oy/v1/oro/contract >"$RUNNER_TEMP/oro-contract.json"
          curl --fail --silent --show-error http://127.0.0.1:8877/oro >"$RUNNER_TEMP/oro-dashboard.html"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          health = json.loads((root / "oro-health.json").read_text())
          ready = json.loads((root / "oro-ready.json").read_text())
          contract = json.loads((root / "oro-contract.json").read_text())
          dashboard = (root / "oro-dashboard.html").read_text()
          assert health["alive"] is True
          assert ready["ready"] is True
          assert ready["signer"]["state"] == "ACTIVE"
          assert ready["write_authorizer"]["state"] == "ACTIVE"
          assert contract["normal_termination"] == "STRUCTURAL_RANK_DECREASE"
          assert contract["release_effector"] == "ABSENT"
          assert contract["machine_checked_termination"] == "NOT_PROVED"
          assert "Obligation-Ranked Orbits" in dashboard
          assert "https://cdn" not in dashboard.lower()
          PY
      - name: Stop loopback runtime
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/oro-uvicorn.pid"; then
            kill "$(cat "$RUNNER_TEMP/oro-uvicorn.pid")" 2>/dev/null || true
          fi
      - name: Upload source-bound loopback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oro-loopback-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/oro-health.json
            ${{ runner.temp }}/oro-ready.json
            ${{ runner.temp }}/oro-contract.json
            ${{ runner.temp }}/oro-uvicorn.log
          if-no-files-found: error
          retention-days: 90

  repair:
    name: One-shot durable-state and write-auth repair
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/oro-operational-control-plane-v3-20260817'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Normalize schema fixture and apply bounded ORO repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/_apply_oro_v3_repairs.py')
          text = path.read_text(encoding='utf-8')
          patch_store = text.index('def patch_store() -> None:')
          start = text.index('    replace_once(\n        path,\n', patch_store)
          end = text.index('    replace_once(\n        path,\n', start + 1)
          schema_call = """    replace_once(
              path,
              \"                        generation INTEGER NOT NULL CHECK(generation >= 0),\\n\"
              \"                        status TEXT NOT NULL CHECK(status IN ('RUNNING','CONTINUE','COMPLETE','REFUSED')),\\n\",
              \"                        generation INTEGER NOT NULL CHECK(generation >= 0),\\n\"
              \"                        current_rank_json TEXT NOT NULL,\\n\"
              \"                        status TEXT NOT NULL CHECK(status IN ('RUNNING','COMPLETE','REFUSED')),\\n\",
              \"durable orbit schema\",
          )
          """
          path.write_text(text[:start] + schema_call + text[end:], encoding='utf-8')
          PY
          python3 -m py_compile scripts/_apply_oro_v3_repairs.py
          python3 scripts/_apply_oro_v3_repairs.py
      - name: Remove source transformer
        run: rm scripts/_apply_oro_v3_repairs.py
      - name: Install exact focused dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt
      - name: Prove repaired source
        run: |
          python3 -m compileall -q oro tests/test_oro_operational_v3.py
          python3 -m pytest -q tests/test_oro_operational_v3.py
          git diff --check
      - name: Commit final non-workflow repairs
        run: |
          set -euo pipefail
          git add \
            oro/store.py \
            oro/service.py \
            oro/auth.py \
            oro/api.py \
            deploy/oro/compose.yaml \
            tests/test_oro_operational_v3.py
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git config user.name 'Stephen Lutar'
          git config user.email 'stephenlutar2@gmail.com'
          git commit \
            -m 'fix(oro): bind durable frontier and authenticated writes' \
            -m 'Map internal barrier decisions to durable plan/orbit states, advance the persisted generation and rank atomically, reject stale or terminal execution, require bearer authority for all writes, derive approval identity from the token binding, bound list queries, and mount managed API-token authority in the hardened Compose contract.' \
            -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:feat/oro-operational-control-plane-v3-20260817
