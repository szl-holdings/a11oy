name: HF candidate-admission controller tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/verify_hf_candidate_admission.py
      - tests/test_verify_hf_candidate_admission.py
      - .github/workflows/hf-candidate-admission-tests.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/verify_hf_candidate_admission.py
      - tests/test_verify_hf_candidate_admission.py
      - .github/workflows/hf-candidate-admission-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller-tests:
    name: Protected-base successor controller regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prove ordinary delegation and fail-closed successor admission
        run: python3 -B -m unittest tests.test_verify_hf_candidate_admission -v
      - name: Compile controller and regressions
        run: >-
          python3 -B -m py_compile
          .github/scripts/verify_hf_candidate_admission.py
          tests/test_verify_hf_candidate_admission.py
      - name: Reject whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              head="$CURRENT_SHA"
              ;;
            *)
              base="$(git rev-parse HEAD^)"
              head="$(git rev-parse HEAD)"
              ;;
          esac
          git diff --check "$base...$head" -- \
            .github/scripts/verify_hf_candidate_admission.py \
            tests/test_verify_hf_candidate_admission.py \
            .github/workflows/hf-candidate-admission-tests.yml
