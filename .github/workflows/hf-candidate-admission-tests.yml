name: HF candidate-admission controller tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/verify_hf_candidate_admission.py
      - tests/test_verify_hf_candidate_admission.py
      - .github/workflows/hf-candidate-admission-tests.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/verify_hf_candidate_admission.py
      - tests/test_verify_hf_candidate_admission.py
      - .github/workflows/hf-candidate-admission-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller-tests:
    name: Protected-base successor controller regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prove ordinary delegation and fail-closed successor admission
        run: python3 -B -m unittest tests.test_verify_hf_candidate_admission -v
      - name: Compile controller and regressions
        run: >-
          python3 -B -m py_compile
          .github/scripts/verify_hf_candidate_admission.py
          tests/test_verify_hf_candidate_admission.py
      - name: Reject whitespace errors
        run: >-
          git diff --check origin/main...HEAD --
          .github/scripts/verify_hf_candidate_admission.py
          tests/test_verify_hf_candidate_admission.py
          .github/workflows/hf-candidate-admission-tests.yml
