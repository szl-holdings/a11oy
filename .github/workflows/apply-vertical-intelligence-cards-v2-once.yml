name: Apply vertical intelligence cards v2 once

on:
  push:
    branches: [feat/frontdoor-vertical-intelligence-cards-v2]
    paths:
      - .github/workflows/apply-vertical-intelligence-cards-v2-once.yml
      - .github/scripts/apply_vertical_intelligence_cards_v2.py
      - tests/test_vertical_intelligence_cards_v2.py

permissions:
  contents: write

concurrency:
  group: apply-vertical-intelligence-cards-v2-once
  cancel-in-progress: false

jobs:
  apply:
    name: Generate five source-native intelligence cards
    if: github.ref == 'refs/heads/feat/frontdoor-vertical-intelligence-cards-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/frontdoor-vertical-intelligence-cards-v2
          fetch-depth: 1
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Apply the fail-closed card transform
        run: python .github/scripts/apply_vertical_intelligence_cards_v2.py

      - name: Remove the superseded trailing card CSS block
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("a11oy_landing.html")
          text = path.read_text(encoding="utf-8")
          marker = "  .fabric-note{"
          first = text.find(marker)
          second = text.find(marker, first + 1)
          if first < 0 or second < 0:
              raise SystemExit("expected generated and superseded fabric-note CSS blocks")
          end = text.find("\n\n</style>", second)
          if end < 0:
              raise SystemExit("could not locate the end of the superseded card CSS block")
          text = text[:second] + text[end:]
          if text.count(marker) != 1:
              raise SystemExit("card CSS cleanup did not converge to one block")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install exact network-free test runner
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==9.0.3"

      - name: Prove card, taxonomy, accessibility, and clean-room contracts
        run: |
          python -m py_compile \
            .github/scripts/apply_vertical_intelligence_cards_v2.py \
            tests/test_vertical_intelligence_cards_v2.py \
            tests/test_living_command_fabric_frontdoor.py
          python -m pytest -q \
            tests/test_vertical_intelligence_cards_v2.py \
            tests/test_living_command_fabric_frontdoor.py
          git diff --check

      - name: Commit only the durable source and regression
        run: |
          set -euo pipefail
          git rm \
            .github/scripts/apply_vertical_intelligence_cards_v2.py \
            .github/workflows/apply-vertical-intelligence-cards-v2-once.yml
          git add a11oy_landing.html tests/test_vertical_intelligence_cards_v2.py
          git diff --cached --check
          git config user.name "SZL governed transformer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat(frontdoor): overhaul vertical intelligence cards"
          git push origin HEAD:feat/frontdoor-vertical-intelligence-cards-v2
