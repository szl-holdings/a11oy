# SPDX-License-Identifier: Apache-2.0
name: Apply final HF existing-Space idempotency repair

on:
  push:
    branches:
      - fix/hf-existing-space-idempotency-v1
    paths:
      - .github/workflows/apply-hf-existing-space-idempotency-v3.yml

permissions:
  contents: write

concurrency:
  group: apply-hf-existing-space-idempotency-v3
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-existing-space-idempotency-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact publisher repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          helper = dedent('''
          def ensure_space_repository(api: HfApi, repo_id: str) -> str:
              """Create only a genuinely absent Space, then prove write access."""
              try:
                  exists = bool(api.repo_exists(repo_id=repo_id, repo_type="space"))
              except Exception as exc:
                  raise RuntimeError(
                      f"unable to determine whether target Space exists: {repo_id}"
                  ) from exc
              if exists:
                  action = "space_existing"
              else:
                  api.create_repo(
                      repo_id=repo_id,
                      repo_type="space",
                      space_sdk="docker",
                      exist_ok=True,
                      private=False,
                  )
                  action = "space_created"
              api.auth_check(repo_id=repo_id, repo_type="space", write=True)
              return action


          ''')

          flagship = Path("scripts/hf_publish_vertical_flagships_v4_impl.py")
          text = flagship.read_text(encoding="utf-8")
          marker = "def main() -> int:\n"
          if text.count(marker) != 1 or "def ensure_space_repository(" in text:
              raise SystemExit("flagship insertion boundary drift")
          text = text.replace(marker, helper + marker, 1)
          old = (
              '            api.create_repo(repo_id=rid, repo_type="space", '
              'space_sdk="docker", exist_ok=True, private=False)\n'
              '            row["actions"].append("ensure_space")'
          )
          new = '            row["actions"].append(ensure_space_repository(api, rid))'
          if text.count(old) != 1:
              raise SystemExit("flagship create target drift")
          flagship.write_text(text.replace(old, new, 1), encoding="utf-8")

          combined = Path("scripts/hf_publish_vertical_services.py")
          text = combined.read_text(encoding="utf-8")
          marker = "def ensure_runtime_configuration(api: HfApi) -> dict[str, Any]:\n"
          if text.count(marker) != 1 or "def ensure_space_repository(" in text:
              raise SystemExit("combined insertion boundary drift")
          text = text.replace(marker, helper + marker, 1)
          old = (
              '    api.create_repo(\n'
              '        repo_id=HF_REPOSITORY,\n'
              '        repo_type="space",\n'
              '        space_sdk="docker",\n'
              '        exist_ok=True,\n'
              '        private=False,\n'
              '    )\n'
              '    api.auth_check(repo_id=HF_REPOSITORY, repo_type="space", write=True)\n'
          )
          if text.count(old) != 1:
              raise SystemExit("combined create target drift")
          text = text.replace(
              old,
              '    space_action = ensure_space_repository(api, HF_REPOSITORY)\n',
              1,
          )
          old_return = '    return {\n        "secret": SIGNING_SECRET,\n'
          if text.count(old_return) != 1:
              raise SystemExit("combined return target drift")
          text = text.replace(
              old_return,
              '    return {\n        "space_action": space_action,\n'
              '        "secret": SIGNING_SECRET,\n',
              1,
          )
          combined.write_text(text, encoding="utf-8")

          Path("tests/test_hf_existing_space_idempotency.py").write_text(
              dedent('''
              # SPDX-License-Identifier: Apache-2.0
              from __future__ import annotations

              import importlib.util
              import sys
              from pathlib import Path
              from types import ModuleType

              import pytest

              MODULES = [
                  ("scripts/hf_publish_vertical_flagships_v4_impl.py", "flagship"),
                  ("scripts/hf_publish_vertical_services.py", "combined"),
              ]

              def load_module(path: str, name: str):
                  spec = importlib.util.spec_from_file_location(name, Path(path))
                  assert spec is not None and spec.loader is not None
                  module = importlib.util.module_from_spec(spec)
                  fake_hub = ModuleType("huggingface_hub")
                  fake_hub.HfApi = type("HfApi", (), {})
                  previous = sys.modules.get("huggingface_hub")
                  sys.modules["huggingface_hub"] = fake_hub
                  try:
                      spec.loader.exec_module(module)
                  finally:
                      if previous is None:
                          sys.modules.pop("huggingface_hub", None)
                      else:
                          sys.modules["huggingface_hub"] = previous
                  return module

              class FakeApi:
                  def __init__(self, exists=True, probe_error=None):
                      self.exists = exists
                      self.probe_error = probe_error
                      self.created = []
                      self.authorized = []
                  def repo_exists(self, *, repo_id, repo_type):
                      assert repo_type == "space"
                      if self.probe_error:
                          raise self.probe_error
                      return self.exists
                  def create_repo(self, **kwargs):
                      self.created.append(kwargs)
                  def auth_check(self, **kwargs):
                      self.authorized.append(kwargs)

              @pytest.mark.parametrize("path,name", MODULES)
              def test_existing_space_avoids_creation_quota(path, name):
                  module = load_module(path, name + "_existing")
                  api = FakeApi(exists=True)
                  assert module.ensure_space_repository(api, "SZLHOLDINGS/lyte") == "space_existing"
                  assert api.created == []
                  assert api.authorized == [{"repo_id": "SZLHOLDINGS/lyte", "repo_type": "space", "write": True}]

              @pytest.mark.parametrize("path,name", MODULES)
              def test_missing_space_is_created_once(path, name):
                  module = load_module(path, name + "_missing")
                  api = FakeApi(exists=False)
                  assert module.ensure_space_repository(api, "SZLHOLDINGS/new-space") == "space_created"
                  assert api.created == [{
                      "repo_id": "SZLHOLDINGS/new-space",
                      "repo_type": "space",
                      "space_sdk": "docker",
                      "exist_ok": True,
                      "private": False,
                  }]
                  assert len(api.authorized) == 1

              @pytest.mark.parametrize("path,name", MODULES)
              def test_probe_failure_never_falls_through_to_creation(path, name):
                  module = load_module(path, name + "_failure")
                  api = FakeApi(probe_error=RuntimeError("provider unavailable"))
                  with pytest.raises(RuntimeError, match="unable to determine"):
                      module.ensure_space_repository(api, "SZLHOLDINGS/lyte")
                  assert api.created == []
                  assert api.authorized == []
              ''').lstrip(),
              encoding="utf-8",
          )

          for path in (
              ".github/workflows/apply-hf-existing-space-idempotency.yml",
              ".github/workflows/apply-hf-existing-space-idempotency-v3.yml",
          ):
              Path(path).unlink()
          PY

      - name: Prove repaired publisher contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/hf_publish_vertical_flagships_v4_impl.py \
            scripts/hf_publish_vertical_services.py
          python -m pytest \
            tests/test_hf_existing_space_idempotency.py \
            tests/test_hf_publish_vertical_flagships_v4.py \
            -q
          git diff --check

      - name: Commit exact forward repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add \
            scripts/hf_publish_vertical_flagships_v4_impl.py \
            scripts/hf_publish_vertical_services.py \
            tests/test_hf_existing_space_idempotency.py \
            .github/workflows/apply-hf-existing-space-idempotency.yml \
            .github/workflows/apply-hf-existing-space-idempotency-v3.yml
          git commit -s -m "fix(hf): avoid creation quota for existing Spaces"
          git push origin HEAD:fix/hf-existing-space-idempotency-v1
