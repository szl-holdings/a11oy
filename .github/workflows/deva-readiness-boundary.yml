name: DEV-A and Cyber readiness HTTP boundaries

on:
  pull_request:
    branches:
    - main
    paths:
    - a11oy_deva_feeds.py
    - a11oy_devb_endpoints.py
    - a11oy_vertical_feeds.py
    - tests/test_courtlistener_freshness_contract.py
    - tests/test_feed_cache_singleflight.py
    - tests/test_finance_feed_readiness.py
    - tests/test_deva_realestate_readiness_route_boundary.py
    - tests/test_deva_realestate_http_boundary.py
    - tests/test_cyber_readiness_truth_contract.py
    - tests/test_legal_readiness_unavailable_contract.py
    - tests/test_realestate_readiness_truth_contract.py
    - .github/requirements/ci-core.txt
    - .github/workflows/deva-readiness-boundary.yml
  push:
    branches:
    - main
    paths:
    - a11oy_deva_feeds.py
    - a11oy_devb_endpoints.py
    - a11oy_vertical_feeds.py
    - tests/test_courtlistener_freshness_contract.py
    - tests/test_feed_cache_singleflight.py
    - tests/test_finance_feed_readiness.py
    - tests/test_deva_realestate_readiness_route_boundary.py
    - tests/test_deva_realestate_http_boundary.py
    - tests/test_cyber_readiness_truth_contract.py
    - tests/test_legal_readiness_unavailable_contract.py
    - tests/test_realestate_readiness_truth_contract.py
    - .github/requirements/ci-core.txt
    - .github/workflows/deva-readiness-boundary.yml
  merge_group:
    types:
    - checks_requested
    branches:
    - main
permissions:
  contents: read

jobs:
  route-boundary:
    name: DEV-A cold cached live HTTP regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install existing hash-locked core test dependencies
        run: python -m pip install --require-hashes -r .github/requirements/ci-core.txt
      - name: Verify source envelopes through real registered HTTP routes
        run: >-
          python -m pytest -q
          tests/test_deva_realestate_readiness_route_boundary.py
          tests/test_deva_realestate_http_boundary.py
          tests/test_cyber_readiness_truth_contract.py
          tests/test_legal_readiness_unavailable_contract.py
          tests/test_realestate_readiness_truth_contract.py
          tests/test_courtlistener_freshness_contract.py
          tests/test_feed_cache_singleflight.py
          tests/test_finance_feed_readiness.py
