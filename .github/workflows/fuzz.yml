name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fuzz.yml'
      - 'package.json'
      - 'packages/qec-integrity/package.json'
      - 'packages/qec-integrity/src/qec_lineage.ts'
      - 'tools/*qec_properties.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fuzz.yml'
      - 'package.json'
      - 'packages/qec-integrity/package.json'
      - 'packages/qec-integrity/src/qec_lineage.ts'
      - 'tools/*qec_properties.mjs'
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (QEC generated properties)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with:
          node-version: '22'
      # Native TypeScript stripping runs this dependency-free module; no npm
      # install, optional test selection, skip, or missing-script success path.
      - name: Generated properties and mutation checks
        run: npm run test:fuzz
