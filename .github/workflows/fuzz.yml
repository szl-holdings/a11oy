name: Fuzz

on:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (fast-check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with:
          node-version: '20'
      - run: |
          set -euo pipefail
          if [ -f "package.json" ]; then
            npm ci
            if node -e "process.exit(require('./package.json').scripts?.['test:fuzz'] ? 0 : 1)"; then
              npm run test:fuzz
            else
              echo "::notice::Fuzz NOT RUN: no test:fuzz script configured (advisory workflow)"
            fi
          else
            echo "No package.json found"
          fi
