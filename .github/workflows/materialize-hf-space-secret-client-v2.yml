name: Materialize HF Space secret client repair

on:
  push:
    branches:
      - fix/hf-space-secret-client-v2

permissions:
  contents: write

concurrency:
  group: materialize-hf-space-secret-client-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-space-secret-client-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Patch the canonical publisher client contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path('.github/workflows/hf-sync.yml')
          test_path = Path('tests/test_hf_vertical_publisher_client_contract.py')
          temporary_path = Path('.github/workflows/materialize-hf-space-secret-client-v2.yml')

          source = workflow_path.read_text(encoding='utf-8')
          old_pin = '"huggingface_hub==1.10.1"'
          new_pin = '"huggingface_hub==1.23.0"'
          if source.count(old_pin) != 1:
              raise SystemExit(f'expected one obsolete HF client pin, found {source.count(old_pin)}')
          source = source.replace(old_pin, new_pin, 1)

          marker = '      - name: Publish and verify the v4 vertical estate\n'
          if source.count(marker) != 1:
              raise SystemExit(f'expected one publication step, found {source.count(marker)}')
          guard = (
              '      - name: Assert pinned client exposes Space configuration APIs\n'
              '        run: >-\n'
              "          python -c 'from huggingface_hub import HfApi;\n"
              '          required=("get_space_secrets","add_space_secret","add_space_variable");\n'
              '          missing=[name for name in required if not hasattr(HfApi,name)];\n'
              '          assert not missing, f"missing HfApi methods: {missing}"\'\n\n'
          )
          source = source.replace(marker, guard + marker, 1)
          workflow_path.write_text(source, encoding='utf-8')

          test_path.write_text(textwrap.dedent('''
              #!/usr/bin/env python3
              """Regression contract for the canonical HF vertical publisher client."""
              from __future__ import annotations

              import unittest
              from pathlib import Path

              ROOT = Path(__file__).resolve().parents[1]
              WORKFLOW = ROOT / ".github" / "workflows" / "hf-sync.yml"
              PUBLISHER = ROOT / "scripts" / "hf_publish_vertical_services.py"


              class HfVerticalPublisherClientContract(unittest.TestCase):
                  @classmethod
                  def setUpClass(cls) -> None:
                      cls.workflow = WORKFLOW.read_text(encoding="utf-8")
                      cls.publisher = PUBLISHER.read_text(encoding="utf-8")

                  def test_workflow_uses_client_with_secret_listing_api(self) -> None:
                      self.assertIn('"huggingface_hub==1.23.0"', self.workflow)
                      self.assertNotIn('"huggingface_hub==1.10.1"', self.workflow)

                  def test_workflow_fails_fast_before_publication(self) -> None:
                      self.assertIn("Assert pinned client exposes Space configuration APIs", self.workflow)
                      for method in ("get_space_secrets", "add_space_secret", "add_space_variable"):
                          self.assertIn(method, self.workflow)

                  def test_publisher_preserves_write_only_secret_contract(self) -> None:
                      self.assertIn("api.get_space_secrets", self.publisher)
                      self.assertIn('secret_action = "preserved"', self.publisher)
                      self.assertIn('"secret_value_recorded": False', self.publisher)


              if __name__ == "__main__":
                  unittest.main(verbosity=2)
          ''').lstrip(), encoding='utf-8')

          temporary_path.unlink()
          PY

      - name: Validate exact dependency and offline contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "huggingface_hub==1.23.0" "PyYAML==6.0.3"
          python -c 'from huggingface_hub import HfApi; required=("get_space_secrets","add_space_secret","add_space_variable"); missing=[name for name in required if not hasattr(HfApi,name)]; assert not missing, missing'
          python -m py_compile scripts/hf_publish_vertical_services.py
          python tests/test_hf_vertical_publisher_client_contract.py
          python -c 'import pathlib,yaml; yaml.safe_load(pathlib.Path(".github/workflows/hf-sync.yml").read_text(encoding="utf-8"))'

      - name: Commit verified permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stephen Lutar"
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git diff --cached --check
          git commit -s -m "fix(hf): use client that supports Space secret metadata"
          git push origin HEAD:fix/hf-space-secret-client-v2
