# SPDX-License-Identifier: Apache-2.0
name: Refresh HF ecosystem manifest once

on:
  push:
    branches:
      - fix/hf-ecosystem-manifest-current-20260906
    paths:
      - .github/workflows/_refresh_hf_ecosystem_manifest_once.yml

permissions:
  contents: write

concurrency:
  group: refresh-hf-ecosystem-manifest-once
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/fix/hf-ecosystem-manifest-current-20260906'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Generate current public evidence and deterministic consumers
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_huggingface_ecosystem.py \
            --output docs/huggingface-ecosystem-manifest.json
          python scripts/audit_huggingface_ecosystem.py \
            --check \
            --output docs/huggingface-ecosystem-manifest.json
          python scripts/render_public_estate_alignment.py
          python scripts/build_ecosystem_stage_matrix.py
          python scripts/render_public_estate_alignment.py --check
          python scripts/build_ecosystem_stage_matrix.py --check
          python scripts/test_audit_huggingface_ecosystem.py
          python -m unittest -v \
            tests.test_public_estate_alignment \
            tests.test_hf_keep_policy_continuations
          python -m py_compile \
            scripts/audit_huggingface_ecosystem.py \
            scripts/render_public_estate_alignment.py \
            scripts/build_ecosystem_stage_matrix.py
          git diff --check

      - name: Restrict the generated change set
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              docs/huggingface-ecosystem-manifest.json|docs/ecosystem-stage-matrix.json|docs/generated/github-org-public-estate.md|docs/generated/huggingface-org-card.md|docs/generated/a11oy-net-public-estate.md)
                ;;
              *)
                echo "::error::Unexpected generated path: $path"
                exit 1
                ;;
            esac
          done

      - name: Commit permanent evidence and self-remove
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/hf-ecosystem-manifest-current-20260906
          remote_head=$(git ls-remote origin "refs/heads/${branch}" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git rm -- .github/workflows/_refresh_hf_ecosystem_manifest_once.yml
          git add -- \
            docs/huggingface-ecosystem-manifest.json \
            docs/ecosystem-stage-matrix.json \
            docs/generated/github-org-public-estate.md \
            docs/generated/huggingface-org-card.md \
            docs/generated/a11oy-net-public-estate.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'fix(hf): refresh current ecosystem evidence' \
            -m 'Replace the stale public-only Hugging Face snapshot with a fresh canonical observation and regenerate every deterministic public-estate consumer from that single source.'
          remote_head=$(git ls-remote origin "refs/heads/${branch}" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/${branch}"
