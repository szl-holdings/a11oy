name: Local POST input admission

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: local-post-admission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-contract:
    name: Offline POST admission and local effect contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install existing hash-locked route-test dependencies
        run: python -m pip install --require-hashes -r .github/requirements/ci-rag.txt
      - name: Check admission, no-effect refusal, and receipt negative controls
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_local_post_object_admission.py
          tests/test_local_effect_acceptance_runner.py
          tests/test_effect_acceptance.py
      - name: Exercise the assembled application without production credentials
        # Developer-only Python audit guards, not an OS sandbox or a runtime witness.
        # The child denies network/process effects and writes only to runner.temp.
        run: >-
          python -I -B tools/readiness-harness/local_effect_acceptance.py
          --output-root "${{ runner.temp }}/local-post-admission"
          --timeout 300
      - name: Retain bounded local-only evidence without databases or logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-post-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/local-post-admission/**/launch.json
            ${{ runner.temp }}/local-post-admission/**/source-manifest.json
            ${{ runner.temp }}/local-post-admission/**/report.json
          if-no-files-found: warn
          retention-days: 7
