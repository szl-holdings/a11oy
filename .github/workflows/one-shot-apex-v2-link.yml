name: One-shot apex v2 visual wiring

on:
  push:
    branches: [design/command-center-v2-20260902]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/command-center-v2-20260902
      - name: Wire apex visual override
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('a11oy_landing.html')
          text = path.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="/assets/apex-v2.css" data-szl-apex-v2="style" />'
          if link not in text:
              if '</head>' not in text:
                  raise SystemExit('landing head close missing')
              text = text.replace('</head>', f'  {link}\n</head>', 1)
              path.write_text(text, encoding='utf-8')
          PY
          git config user.name "szl-ui[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a11oy_landing.html
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "feat(ui): wire apex v2 visual layer" -m "Signed-off-by: szl-ui[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            git push origin HEAD:design/command-center-v2-20260902
          fi
