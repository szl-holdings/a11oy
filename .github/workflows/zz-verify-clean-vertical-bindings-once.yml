name: Verify and clean vertical real-data binding tree once

on:
  push:
    branches:
      - feat/vertical-real-data-bindings-v1
    paths:
      - .github/workflows/zz-verify-clean-vertical-bindings-once.yml

permissions:
  contents: write

concurrency:
  group: verify-clean-vertical-real-data-bindings
  cancel-in-progress: false

jobs:
  verify-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/vertical-real-data-bindings-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Require and qualify the permanent generated source
        shell: bash
        run: |
          set -euo pipefail
          required=(
            scripts/hf_publish_vertical_flagships_v2.py
            tests/test_hf_vertical_real_data_bindings.py
            scripts/verify_vertical_real_data_spaces.py
            docs/VERTICAL_REAL_DATA_BINDINGS.md
            .github/workflows/vertical-real-data-bindings.yml
          )
          for path in "${required[@]}"; do
            test -f "$path"
          done

          python -m py_compile \
            scripts/hf_publish_vertical_flagships_v2.py \
            scripts/verify_vertical_real_data_spaces.py \
            tests/test_hf_vertical_real_data_bindings.py

          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('scripts/hf_publish_vertical_flagships_v2.py')
          source = path.read_text(encoding='utf-8')
          ast.parse(source)
          required = {
              'terra': '/api/a11oy/v1/real-data/vertical/terra',
              'sentra': '/api/a11oy/v1/real-data/vertical/sentra',
              'counsel': '/api/a11oy/v1/real-data/vertical/counsel',
              'finance': '/api/a11oy/v1/real-data/vertical/finance',
              'vessels': '/api/a11oy/v1/real-data/vertical/vessels',
              'lyte': '/api/a11oy/v1/real-data/vertical/lyte',
          }
          for slug, route in required.items():
              if f'"slug": "{slug}"' not in source or route not in source:
                  raise SystemExit(f'missing governed binding: {slug}')
          for marker in (
              'szl.vertical-live-evidence/v1',
              'data-szl-public-experience-v3="true"',
              'data-szl-vertical-evidence="4.0.0"',
              'ThreadPoolExecutor(max_workers=2)',
              'external_writes',
              'effectors',
              'def probe_space(',
              'api_contract',
          ):
              if marker not in source:
                  raise SystemExit(f'missing publisher contract: {marker}')
          PY

          python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt
          python -m pytest tests/test_hf_vertical_real_data_bindings.py -q
          git diff --check

      - name: Remove every one-shot bootstrap and publish clean head
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/zz-materialize-vertical-real-data-bindings-once.yml \
            .github/workflows/zz-materialize-vertical-real-data-bindings-v2-once.yml \
            .github/workflows/zz-verify-clean-vertical-bindings-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit \
            -m 'chore(verticals): remove real-data binding bootstraps' \
            -m 'Keep only the permanent publisher, tests, documentation, canonical writer dispatch, and source-bound post-publish verifier.' \
            -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:feat/vertical-real-data-bindings-v1