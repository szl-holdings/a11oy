name: Canonical A11oy Restart Drill

# Manual-only restart durability drill. The Series-A proof pauses and restarts
# the live canonical Space and the GDW proof restarts it, so neither runs on the
# deploy path: hf-sync.yml starts the Space exactly once per deploy. Dispatch
# only from main, only while that exact main revision is live, and never while
# an hf-sync deploy is in progress. Every proof is bounded and fails closed.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: restart-drill-canonical-a11oy
  cancel-in-progress: false

env:
  CANONICAL_SPACE: SZLHOLDINGS/a11oy
  CANONICAL_ORIGIN: https://szlholdings-a11oy.hf.space

jobs:
  restart-drill:
    name: Prove restart durability of the live canonical Space
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      SERIES_A_LIVE_REPORT: /tmp/series-a-restart-proof.json
      GDW_LIVE_REPORT: /tmp/gdw-live-proof.json
      LIVE_PROOF_ADMISSION_REPORT: /tmp/live-proof-admission.json
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Require the drill to target current protected main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          python3 -B scripts/hf_exact_main_ownership.py \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/restart-drill-source-admission.json" \
            --github-output "$RUNNER_TEMP/restart-drill-source-admission.out"
          if ! grep -Fqx 'publish=true' "$RUNNER_TEMP/restart-drill-source-admission.out"; then
            echo '::error::The restart drill must target the current protected main revision.'
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact Hugging Face control client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.31.0"
          "requests==2.32.5"
          "cryptography==50.0.1"

      # Bounded (scripts/hf_live_proof_bounds.py): exact destinations only, no
      # redirects, fixed diagnostic codes, 8 attempts / 10 minutes for
      # transient admission, effects limited to SZLHOLDINGS/a11oy.
      - name: Prove live Series-A restart persistence (bounded)
        id: series_a_proof
        shell: bash
        run: |
          set +e
          python -B scripts/prove_hf_series_a_restart.py \
            --repo-id "$CANONICAL_SPACE" --origin "$CANONICAL_ORIGIN" \
            --run-context "${{ github.run_id }}:${{ github.run_attempt }}" \
            --source-sha "${{ github.sha }}" --output "$SERIES_A_LIVE_REPORT"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      # Writes only in the a11oy GDW namespace; the proof-tagged receipt must
      # verify against ayllu/keys/council-runtime-2026-07-21.pub.
      - name: Prove live GDW write, drain, and receipt integrity (bounded)
        id: gdw_proof
        if: ${{ always() && (steps.series_a_proof.outcome == 'success' || steps.series_a_proof.outcome == 'failure') }}
        shell: bash
        env:
          GDW_OPERATOR_TOKEN: ${{ secrets.GDW_OPERATOR_TOKEN }}
        run: |
          set +e
          python -B scripts/prove_hf_gdw_runtime.py \
            --series-a-proof "$SERIES_A_LIVE_REPORT" \
            --run-context "${{ github.run_id }}:${{ github.run_attempt }}" \
            --origin "$CANONICAL_ORIGIN" \
            --source-sha "${{ github.sha }}" --output "$GDW_LIVE_REPORT"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Admit bounded live proof reports and fail closed
        if: ${{ always() && (steps.series_a_proof.outcome == 'success' || steps.series_a_proof.outcome == 'failure') }}
        shell: bash
        env:
          SERIES_A_PROOF_EXIT: ${{ steps.series_a_proof.outputs.exit_code }}
          GDW_PROOF_EXIT: ${{ steps.gdw_proof.outputs.exit_code }}
        run: |
          set -euo pipefail
          python -B scripts/check_hf_manual_prerequisites.py --admit-live-proofs \
            --series-a-proof "$SERIES_A_LIVE_REPORT" --series-a-proof-exit "${SERIES_A_PROOF_EXIT:-2}" \
            --gdw-proof "$GDW_LIVE_REPORT" --gdw-proof-exit "${GDW_PROOF_EXIT:-2}" \
            --source-sha "${{ github.sha }}" --output "$LIVE_PROOF_ADMISSION_REPORT"

      - name: Upload secret-free restart drill evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-a11oy-restart-drill-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SERIES_A_LIVE_REPORT }}
            ${{ env.GDW_LIVE_REPORT }}
            ${{ env.LIVE_PROOF_ADMISSION_REPORT }}
            ${{ runner.temp }}/restart-drill-source-admission.json
          if-no-files-found: error
          retention-days: 90
