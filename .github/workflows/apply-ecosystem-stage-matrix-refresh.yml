# SPDX-License-Identifier: Apache-2.0
name: Apply ecosystem stage matrix refresh

on:
  push:
    branches:
      - fix/ecosystem-stage-matrix-refresh-20260901

permissions:
  contents: write

concurrency:
  group: apply-ecosystem-stage-matrix-refresh-20260901
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/ecosystem-stage-matrix-refresh-20260901
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Regenerate and verify exact stage matrix
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_ecosystem_stage_matrix.py
          python3 scripts/build_ecosystem_stage_matrix.py
          python3 scripts/build_ecosystem_stage_matrix.py --check

      - name: Commit only the permanent generated matrix
        env:
          BRANCH: fix/ecosystem-stage-matrix-refresh-20260901
        run: |
          set -euo pipefail
          git config user.name 'SZL Holdings Automation'
          git config user.email 'eng@szlholdings.com'
          git add docs/ecosystem-stage-matrix.json
          git rm .github/workflows/apply-ecosystem-stage-matrix-refresh.yml
          git diff --cached --check
          git commit -s -m 'fix(ops): refresh ecosystem stage matrix'
          git push origin "HEAD:${BRANCH}"
