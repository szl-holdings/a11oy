# SPDX-License-Identifier: Apache-2.0
name: Apply defensive-fusion shared source once

on:
  push:
    branches:
      - feat/defensive-fusion-shared-sync-20260904
    paths:
      - .github/workflows/apply-defensive-fusion-shared-sync-once.yml

permissions:
  contents: write

concurrency:
  group: apply-defensive-fusion-shared-sync-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BRANCH: feat/defensive-fusion-shared-sync-20260904
      SOURCE_SHA: caaff414d1d1da2c03d8a45f111dc7dfad564637
      BINDINGS_BLOB: fbde9518a63bfe9bf42c0f107106ccec70f414a8
      SECURITY_BLOB: 06e9655d3d4c0986ef7c5f77dbe9af27021713bc
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact synchronization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/defensive-fusion-shared-sync-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Import and verify the exact Killinchu shared payload
        shell: bash
        run: |
          set -euo pipefail
          root="https://raw.githubusercontent.com/szl-holdings/killinchu/${SOURCE_SHA}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "${root}/szl_connectors/bindings.py" -o /tmp/bindings.py
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "${root}/szl_connectors/data_sources/security.py" -o /tmp/security.py
          test "$(git hash-object /tmp/bindings.py)" = "$BINDINGS_BLOB"
          test "$(git hash-object /tmp/security.py)" = "$SECURITY_BLOB"
          install -m 0644 /tmp/bindings.py szl_connectors/bindings.py
          install -m 0644 /tmp/security.py szl_connectors/data_sources/security.py
          git rm .github/workflows/apply-defensive-fusion-shared-sync-once.yml
          git diff --check

      - name: Commit the verified byte-identical substrate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add szl_connectors/bindings.py szl_connectors/data_sources/security.py
          git commit -s -m "feat(defend): sync exact-CVE defensive fusion substrate"
          git push origin HEAD:"$BRANCH"
