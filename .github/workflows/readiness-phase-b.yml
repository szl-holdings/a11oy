name: Readiness Phase B Observation Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "routers/frontier_reads.py"
      - "tests/test_readiness_phase_b_observation_contract.py"
      - ".github/workflows/readiness-phase-b.yml"
  push:
    branches: [main]
    paths:
      - "routers/frontier_reads.py"
      - "tests/test_readiness_phase_b_observation_contract.py"
      - ".github/workflows/readiness-phase-b.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: readiness-phase-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-b-contract:
    name: Phase B observation and KEV semantics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact core test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt

      - name: Compile exact source and regression module
        run: >-
          python -m py_compile
          routers/frontier_reads.py
          tests/test_readiness_phase_b_observation_contract.py

      - name: Prove observation clocks and KEV vocabulary fail closed
        run: pytest tests/test_readiness_phase_b_observation_contract.py -q

      - name: Reject whitespace errors in the exact contract paths
        run: >-
          git diff --check
          "${{ github.event.pull_request.base.sha || github.event.before }}"...HEAD --
          routers/frontier_reads.py
          tests/test_readiness_phase_b_observation_contract.py
          .github/workflows/readiness-phase-b.yml
