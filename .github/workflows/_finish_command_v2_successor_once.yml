name: Finish current-main Command Centre v2 successor

"on":
  push:
    branches:
      - feat/command-centre-v2-current-main-20260904
    paths:
      - .github/scripts/finish_command_v2_successor.py
      - .github/workflows/_finish_command_v2_successor_once.yml

permissions:
  contents: write

concurrency:
  group: finish-command-v2-successor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    name: Materialize exact source, image closure, and regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact successor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/command-centre-v2-current-main-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Materialize current-main successor
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/finish_command_v2_successor.py

      - name: Bind the regression to the current grouped-copy image layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_command_v2_shipping.py')
          text = path.read_text(encoding='utf-8')
          old = 'docker.index("COPY serve.py ./")'
          new = 'docker.index("ENV PORT=7860")'
          if text.count(old) != 1:
              raise SystemExit(f'expected one obsolete image-order assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Prove route, image, mobile, and accessibility contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            pytest==8.4.2 starlette==1.6.0 httpx==0.28.1
          python -m py_compile a11oy_command_center.py tests/test_command_v2_shipping.py
          python a11oy_command_center.py
          python -m pytest tests/test_command_v2_shipping.py -q
          git diff --check
          test -s web/command_v2.html
          grep --fixed-strings 'COPY web/command_v2.html ./web/command_v2.html' Dockerfile

      - name: Commit permanent source and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            Dockerfile \
            a11oy_command_center.py \
            web/command_v2.html \
            docs/audits/COMMAND_V2_SHIP_PATH.md \
            tests/test_command_v2_shipping.py
          git rm -- \
            .github/scripts/finish_command_v2_successor.py \
            .github/workflows/_finish_command_v2_successor_once.yml
          git commit -s -m 'feat(command): ship additive Command Centre v2'
          git push origin HEAD:feat/command-centre-v2-current-main-20260904
