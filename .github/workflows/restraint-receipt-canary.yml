name: Bounded restraint receipt canary

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact protected main and deployed source reviewed for this one receipt
        type: string
        required: true
      confirm_single_receipt:
        description: Authorize exactly one fixed restraint receipt; no model or GPU work
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: sync-relock-canonical-a11oy
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SOURCE: ${{ inputs.expected_source_sha }}
      CONFIRM: ${{ inputs.confirm_single_receipt }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      REF_PROTECTED: ${{ github.ref_protected }}
    steps:
      - name: Admit the owner and exact protected main before reading operator credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = szl-holdings/a11oy
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$CONFIRM" = true
          test "$GITHUB_ACTOR" = "$TRIGGERING_ACTOR"
          test "$EXPECTED_SOURCE" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq '.permission')" = admin
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq 'select(.protected == true) | .commit.sha')" = "$GITHUB_SHA"
      - name: Checkout the admitted immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install bounded client and public verification dependencies
        run: python -I -m pip install --disable-pip-version-check "httpx==0.28.1" "cryptography==50.0.2" "pytest==9.2.0"
      - name: Verify the local adverse-case contract before any live effect
        run: python -m pytest -q tests/test_restraint_receipt_canary.py
      - name: Require exact current source immediately before the canary
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq 'select(.protected == true) | .commit.sha')" = "$GITHUB_SHA"
      - name: Execute one fixed receipt and independently verify its readback
        env:
          A11OY_CODE_ADMIN_KEY: ${{ secrets.A11OY_CODE_ADMIN_KEY }}
          A11OY_EXECUTION_HF_REVISION: ${{ vars.A11OY_EXECUTION_HF_REVISION }}
          A11OY_EXECUTION_BOOT_ID: ${{ vars.A11OY_EXECUTION_BOOT_ID }}
          A11OY_EXECUTION_AUTHORITY_PINS_JSON: ${{ vars.A11OY_EXECUTION_AUTHORITY_PINS_JSON }}
        run: >-
          python -I -B .github/scripts/restraint_receipt_canary.py
          --source-sha "$GITHUB_SHA" --execute
          --output "$RUNNER_TEMP/restraint-receipt-canary.json"
      - name: Require exact main after the receipt observation
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq 'select(.protected == true) | .commit.sha')" = "$GITHUB_SHA"
      - name: Retain the bounded result without updating any readiness gate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restraint-receipt-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/restraint-receipt-canary.json
          if-no-files-found: warn
          retention-days: 30
