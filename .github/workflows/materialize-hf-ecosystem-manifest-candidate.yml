name: Materialize HF ecosystem manifest candidate

on:
  push:
    branches:
      - fix/hf-ecosystem-manifest-current-20260903-1116
    paths:
      - .github/workflows/materialize-hf-ecosystem-manifest-candidate.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: materialize-hf-ecosystem-manifest-candidate
  cancel-in-progress: false

jobs:
  materialize:
    name: Promote digest-bound public Hub evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download exact drift-controller artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9890677106'
          ARTIFACT_SHA256: '829912fd025053196c6481eef0f079769a648627c5da6b5192907a7ad53387dd'
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/hf-candidate.zip
          echo "${ARTIFACT_SHA256}  /tmp/hf-candidate.zip" | sha256sum --check --strict
          rm -rf /tmp/hf-candidate
          mkdir -p /tmp/hf-candidate
          unzip -q /tmp/hf-candidate.zip -d /tmp/hf-candidate
          test -f /tmp/hf-candidate/huggingface-ecosystem-manifest.candidate.json

      - name: Validate and promote candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          candidate = Path('/tmp/hf-candidate/huggingface-ecosystem-manifest.candidate.json')
          data = json.loads(candidate.read_text(encoding='utf-8'))
          if data.get('schemaVersion') != 1:
              raise SystemExit('candidate schemaVersion must be 1')
          if data.get('generatedBy') != 'scripts/audit_huggingface_ecosystem.py':
              raise SystemExit('candidate generator identity mismatch')
          if data.get('org') != 'SZLHOLDINGS':
              raise SystemExit('candidate organization mismatch')
          if data.get('inventoryScope', {}).get('visibility') != 'public-only':
              raise SystemExit('candidate visibility scope mismatch')
          counts = data.get('counts', {})
          inventory = data.get('inventory', {})
          for key in ('models', 'datasets', 'spaces'):
              if counts.get(key) != len(inventory.get(key, [])):
                  raise SystemExit(f'candidate {key} count mismatch')
          target = Path('docs/huggingface-ecosystem-manifest.json')
          target.write_text(candidate.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          python3 scripts/test_audit_huggingface_ecosystem.py
          python3 scripts/audit_huggingface_ecosystem.py \
            --check \
            --output docs/huggingface-ecosystem-manifest.json
          git diff --check

      - name: Commit current evidence and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add docs/huggingface-ecosystem-manifest.json
          git rm .github/workflows/materialize-hf-ecosystem-manifest-candidate.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::No manifest refresh was produced'
            exit 1
          fi
          git commit -s -m "fix(hf): refresh public ecosystem manifest"
          git push origin "HEAD:${GITHUB_REF_NAME}"
