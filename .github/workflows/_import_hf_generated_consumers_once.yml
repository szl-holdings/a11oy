# SPDX-License-Identifier: Apache-2.0
name: Import verified Hugging Face generated consumers once

on:
  push:
    branches:
      - fix/hf-ecosystem-manifest-current-20260906
    paths:
      - .github/workflows/_import_hf_generated_consumers_once.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: import-hf-generated-consumers-current-20260906
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/fix/hf-ecosystem-manifest-current-20260906'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact import branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-ecosystem-manifest-current-20260906
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable import subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "ffb249463120a5b1d39ccba71e400839f359418f"
          test "$(git ls-remote origin refs/heads/fix/hf-ecosystem-manifest-current-20260906 | cut -f1)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download and import exact retained artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9988699403/zip" \
            --output /tmp/hf-generated-consumers.zip
          test "$(sha256sum /tmp/hf-generated-consumers.zip | cut -d' ' -f1)" = \
            "f569955b60be0252abf3751b55828e05830ee3a9a6a7fe3345822b2976dfd443"

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import zipfile
          from pathlib import Path, PurePosixPath

          expected = {
              "generated/github-org-public-estate.md": (
                  "docs/generated/github-org-public-estate.md",
                  2079,
                  "fa17f1f3af5dbe2d6bb5f30d92181c7cf92b14f6e53dd7f89a453935dfbf04a1",
              ),
              "generated/a11oy-net-public-estate.md": (
                  "docs/generated/a11oy-net-public-estate.md",
                  1217,
                  "28672fa10b34f3b938159d66af05a02fc3f76a4c7bc5f60c8ef1609fbfcf9666",
              ),
              "generated/huggingface-org-card.md": (
                  "docs/generated/huggingface-org-card.md",
                  1819,
                  "31ab2a768c62ead089ceab29eb28ffdd56a30ba33ba52fb4af120d17b7a29af2",
              ),
              "ecosystem-stage-matrix.json": (
                  "docs/ecosystem-stage-matrix.json",
                  70455,
                  "076166263c72937c8ddc66a01bc13a88655d110f0647e1a4305b782ce5534112",
              ),
          }

          archive = Path("/tmp/hf-generated-consumers.zip")
          with zipfile.ZipFile(archive) as bundle:
              infos = [info for info in bundle.infolist() if not info.is_dir()]
              names = {info.filename for info in infos}
              if names != set(expected):
                  raise SystemExit(
                      f"artifact path set drift: expected={sorted(expected)} observed={sorted(names)}"
                  )
              for info in infos:
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or ".." in path.parts or info.external_attr >> 16 & 0o170000 == 0o120000:
                      raise SystemExit(f"unsafe artifact member: {info.filename}")
                  target, size, digest = expected[info.filename]
                  payload = bundle.read(info)
                  if len(payload) != size:
                      raise SystemExit(f"artifact size drift: {info.filename}")
                  observed = hashlib.sha256(payload).hexdigest()
                  if observed != digest:
                      raise SystemExit(
                          f"artifact digest drift: {info.filename}: {observed}"
                      )
                  destination = Path(target)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(payload)
          PY

      - name: Prove imported consumers against tracked source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/render_public_estate_alignment.py \
            scripts/build_ecosystem_stage_matrix.py \
            tests/test_public_estate_alignment.py
          python scripts/render_public_estate_alignment.py --check
          python scripts/build_ecosystem_stage_matrix.py --check
          PYTHONPATH=. python tests/test_public_estate_alignment.py
          python scripts/test_audit_huggingface_ecosystem.py
          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          expected = {
              "docs/generated/github-org-public-estate.md",
              "docs/generated/a11oy-net-public-estate.md",
              "docs/generated/huggingface-org-card.md",
              "docs/ecosystem-stage-matrix.json",
          }
          changed = {
              row
              for row in subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
              if row
          }
          if changed != expected:
              raise SystemExit(
                  f"import escaped bounds: expected={sorted(expected)} observed={sorted(changed)}"
              )
          manifest = json.loads(
              Path("docs/huggingface-ecosystem-manifest.json").read_text(encoding="utf-8")
          )
          matrix = json.loads(
              Path("docs/ecosystem-stage-matrix.json").read_text(encoding="utf-8")
          )
          if matrix.get("observedAt") != manifest.get("observedAt"):
              raise SystemExit("matrix observation is not bound to manifest")
          if matrix.get("machineGeneratedCounts", {}).get("huggingFacePublic") != manifest.get("counts"):
              raise SystemExit("matrix counts are not bound to manifest")
          PY
          git diff --check

      - name: Commit exact consumers and retire temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/hf-ecosystem-manifest-current-20260906
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git rm -- \
            .github/workflows/_import_hf_generated_consumers_once.yml \
            .github/workflows/_refresh_hf_generated_consumers_once.yml
          git add -- \
            docs/generated/github-org-public-estate.md \
            docs/generated/a11oy-net-public-estate.md \
            docs/generated/huggingface-org-card.md \
            docs/ecosystem-stage-matrix.json
          git diff --cached --check
          expected_paths=$'.github/workflows/_import_hf_generated_consumers_once.yml\n.github/workflows/_refresh_hf_generated_consumers_once.yml\ndocs/ecosystem-stage-matrix.json\ndocs/generated/a11oy-net-public-estate.md\ndocs/generated/github-org-public-estate.md\ndocs/generated/huggingface-org-card.md'
          test "$(git diff --cached --name-only | sort)" = "$expected_paths"
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git commit -s -m 'fix(hf): import verified generated ecosystem consumers'
          git push origin "HEAD:refs/heads/$branch"
