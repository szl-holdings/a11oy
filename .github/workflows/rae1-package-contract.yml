name: RAE-1 package contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/rae1/**'
      - '.github/workflows/rae1-package-contract.yml'
  push:
    branches: [main]
    paths:
      - 'packages/rae1/**'
      - '.github/workflows/rae1-package-contract.yml'
  workflow_dispatch: {}
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: rae1-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  package:
    name: RAE-1 build and installed-package contract (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    defaults:
      run:
        working-directory: packages/rae1
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked package dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check types
        run: npm run typecheck
      - name: Verify receipt contracts
        run: npm test
      - name: Build and exercise the installed tarball
        run: npm run test:package
      - name: Verify clean tracked source
        run: git diff --exit-code
