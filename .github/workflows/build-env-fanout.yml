name: Build-environment fan-out contracts

on:
  pull_request:
    paths:
      - '.github/workflows/build-env-fanout.yml'
      - '.github/requirements/ci-build-env-fanout.txt'
      - 'a11oy_build_env_fanout.py'
      - 'serve.py'
      - 'Dockerfile'
      - 'vsp_otel/**'
      - 'tests/test_build_env_fanout*.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-env-fanout.yml'
      - '.github/requirements/ci-build-env-fanout.txt'
      - 'a11oy_build_env_fanout.py'
      - 'serve.py'
      - 'Dockerfile'
      - 'vsp_otel/**'
      - 'tests/test_build_env_fanout*.py'

permissions:
  contents: read

concurrency:
  group: build-env-fanout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Fixed-target fan-out and native loopback OTLP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-locked test dependency closure
        run: python -m pip install --require-hashes -r .github/requirements/ci-build-env-fanout.txt
      - name: Verify bounded reads and real local trace export
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_build_env_fanout.py tests/test_build_env_fanout_otlp.py
          --junitxml=fanout-test-evidence/junit.xml
          --basetemp=fanout-test-evidence/fixtures
      - name: Retain fixture-only evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-env-fanout-fixtures-${{ github.sha }}
          path: fanout-test-evidence/
          if-no-files-found: error
          retention-days: 30
