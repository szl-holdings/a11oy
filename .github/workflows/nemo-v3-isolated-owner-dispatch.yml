name: Nemo v3 isolated owner GPU dispatch

# repository_dispatch always loads this workflow from the protected default
# branch. The managed Hub credential is scoped to two trusted helper steps and
# never enters the networkless remote-code execution container.

on:
  repository_dispatch:
    types: [nemo-v3-isolated-owner-gpu]

permissions:
  contents: read

concurrency:
  group: nemo-v3-isolated-owner-gpu-attempt
  cancel-in-progress: false

jobs:
  execute:
    name: Execute one credential-separated Nemo v3 attempt
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.ref_protected &&
      github.actor == 'stephenlutar2-hash' &&
      github.triggering_actor == 'stephenlutar2-hash'
    runs-on: [self-hosted, Windows, X64, szl-owner-gpu]
    timeout-minutes: 330
    env:
      JOB_ID: job-2026-nemo-v3-governed-attempt-1
      BRIDGE_REVISION: 31a49762fdf9adc2b661137f61c5cd27ed8f0af3
      TRAINING_IMAGE: unsloth/unsloth@sha256:9cc97606fc386b4b13455285eb7bd2668f51530988a9c2578707fe6cdfc46123
      BRIDGE_ROOT: C:\szl-bridge
      CACHE_ROOT: C:\szl-bridge-cache
    steps:
      - name: Check out the exact dispatched default-branch revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare exact public source and trusted control runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($git) {
            $gitExecutable = $git.Source
          } else {
            $gitPath = (
              "C:\Users\steph\.cache\codex-runtimes\codex-primary-runtime" +
              "\dependencies\native\git\cmd\git.exe"
            )
            if (-not (Test-Path -LiteralPath $gitPath -PathType Leaf)) {
              throw "Git is unavailable on the owner runner."
            }
            $gitExecutable = $gitPath
            Add-Content `
              -LiteralPath $env:GITHUB_PATH `
              -Value (Split-Path -Parent $gitPath)
          }

          $python = (
            "C:\Users\steph\.cache\codex-runtimes\codex-primary-runtime" +
            "\dependencies\python\python.exe"
          )
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            $pythonCommand = Get-Command python.exe -ErrorAction Stop
            $python = $pythonCommand.Source
          }

          $source = Join-Path $env:RUNNER_TEMP (
            "szl-gpu-bridge-" + $env:GITHUB_RUN_ID
          )
          $control = Join-Path $env:RUNNER_TEMP (
            "szl-nemo-control-" + $env:GITHUB_RUN_ID
          )
          if (
            (Test-Path -LiteralPath $source) -or
            (Test-Path -LiteralPath $control)
          ) {
            throw "Per-run trusted source or control path already exists."
          }

          & $gitExecutable clone `
            --filter=blob:none `
            --no-checkout `
            https://github.com/szl-holdings/szl-gpu-bridge.git `
            $source
          if ($LASTEXITCODE -ne 0) {
            throw "Bridge clone failed."
          }
          & $gitExecutable -C $source fetch `
            --depth=1 `
            origin `
            $env:BRIDGE_REVISION
          if ($LASTEXITCODE -ne 0) {
            throw "Exact bridge revision fetch failed."
          }
          & $gitExecutable -C $source checkout --detach $env:BRIDGE_REVISION
          if ($LASTEXITCODE -ne 0) {
            throw "Exact bridge revision checkout failed."
          }
          $observed = (& $gitExecutable -C $source rev-parse HEAD).Trim()
          if ($observed -ne $env:BRIDGE_REVISION) {
            throw "Bridge source revision mismatch: $observed"
          }
          if (& $gitExecutable -C $source status --porcelain --untracked-files=no) {
            throw "Exact bridge source is dirty."
          }

          $controlLock = Join-Path $env:GITHUB_WORKSPACE (
            ".github\requirements\nemo-v3-control-win-py312.lock"
          )
          if (-not (Test-Path -LiteralPath $controlLock -PathType Leaf)) {
            throw "Hash-verified trusted-control lock file is missing."
          }
          & $python -m venv $control
          if ($LASTEXITCODE -ne 0) {
            throw "Trusted control virtual environment creation failed."
          }
          $controlPython = Join-Path $control "Scripts\python.exe"
          & $controlPython -m pip install `
            --disable-pip-version-check `
            --require-hashes `
            --only-binary=:all: `
            --no-deps `
            --requirement $controlLock
          if ($LASTEXITCODE -ne 0) {
            throw "Hash-verified trusted control dependency installation failed."
          }
          & $controlPython -m pip check
          if ($LASTEXITCODE -ne 0) {
            throw "Hash-verified trusted control dependency set is inconsistent."
          }

          $docker = (Get-Command docker.exe -ErrorAction Stop).Source
          & $docker pull $env:TRAINING_IMAGE
          if ($LASTEXITCODE -ne 0) {
            throw "Digest-pinned Unsloth image pull failed."
          }
          & $docker run `
            --rm `
            --gpus all `
            --network none `
            --entrypoint python `
            $env:TRAINING_IMAGE `
            -c "import torch; assert torch.cuda.is_available(); print(torch.cuda.get_device_name(0))"
          if ($LASTEXITCODE -ne 0) {
            throw "Digest-pinned container cannot access the owner GPU."
          }

          "BRIDGE_SOURCE=$source" | Add-Content -LiteralPath $env:GITHUB_ENV
          "CONTROL_PYTHON=$controlPython" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Prefetch exact authenticated inputs without executing model code
        shell: powershell
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:HF_TOKEN)) {
            throw "HF_TOKEN was not injected into the trusted prefetch step."
          }

          $hfCache = Join-Path $env:CACHE_ROOT "huggingface\hub"
          $inputCache = Join-Path $env:CACHE_ROOT "inputs"
          foreach ($directory in @($hfCache, $inputCache)) {
            if (-not (Test-Path -LiteralPath $directory)) {
              New-Item -ItemType Directory -Path $directory | Out-Null
            }
          }
          $spec = Join-Path $env:BRIDGE_SOURCE (
            "queue\pending\" + $env:JOB_ID + ".json"
          )
          $engineKey = Join-Path $env:BRIDGE_SOURCE "keys\engine_pubkey.json"
          $receipt = Join-Path $inputCache ($env:JOB_ID + "-prefetch.json")

          & $env:CONTROL_PYTHON `
            (Join-Path $env:BRIDGE_SOURCE "laptop\prefetch_nemo_v3.py") `
            --spec $spec `
            --engine-key $engineKey `
            --hf-cache $hfCache `
            --input-cache $inputCache `
            --receipt $receipt
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticated prefetch failed."
          }

      - name: Atomically claim the single governed attempt
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $controlRoot = Join-Path $env:BRIDGE_ROOT "control"
          if (-not (Test-Path -LiteralPath $controlRoot)) {
            New-Item -ItemType Directory -Path $controlRoot -Force | Out-Null
          }
          $claimPath = Join-Path $controlRoot (
            $env:JOB_ID + "-attempt.claim.json"
          )
          $specPath = Join-Path $env:BRIDGE_SOURCE (
            "queue\pending\" + $env:JOB_ID + ".json"
          )
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try {
            $specDigest = [BitConverter]::ToString(
              $sha256.ComputeHash([IO.File]::ReadAllBytes($specPath))
            ).Replace("-", "").ToLowerInvariant()
          } finally {
            $sha256.Dispose()
          }
          $claim = @{
            jobId = $env:JOB_ID
            bridgeRevision = $env:BRIDGE_REVISION
            dispatchedRevision = "${{ github.sha }}"
            envelopeSha256 = $specDigest
            runId = "${{ github.run_id }}"
            runAttempt = "${{ github.run_attempt }}"
          } | ConvertTo-Json -Compress
          $encoding = New-Object Text.UTF8Encoding($false)
          $claimBytes = $encoding.GetBytes($claim + "`n")

          try {
            $stream = [IO.File]::Open(
              $claimPath,
              [IO.FileMode]::CreateNew,
              [IO.FileAccess]::Write,
              [IO.FileShare]::None
            )
          } catch [IO.IOException] {
            throw "The single governed attempt was already claimed."
          }
          try {
            $stream.Write($claimBytes, 0, $claimBytes.Length)
            $stream.Flush($true)
          } finally {
            $stream.Dispose()
          }

      - name: Execute remote model code without network, credentials, or signing key
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & powershell.exe `
            -NoProfile `
            -NonInteractive `
            -ExecutionPolicy Bypass `
            -File (
              Join-Path $env:BRIDGE_SOURCE "laptop\run_nemo_v3_isolated.ps1"
            ) `
            -JobId $env:JOB_ID `
            -BridgeRevision $env:BRIDGE_REVISION `
            -Image $env:TRAINING_IMAGE `
            -BridgeSource $env:BRIDGE_SOURCE `
            -BridgeRoot $env:BRIDGE_ROOT `
            -HfCache (Join-Path $env:CACHE_ROOT "huggingface\hub") `
            -InputCache (Join-Path $env:CACHE_ROOT "inputs")
          if ($LASTEXITCODE -ne 0) {
            throw "Credentialless GPU execution failed."
          }

      - name: Sign, upload, and immutably read back the fresh receipt
        shell: powershell
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:HF_TOKEN)) {
            throw "HF_TOKEN was not injected into the trusted finalizer step."
          }

          $jobRoot = Join-Path $env:BRIDGE_ROOT ("jobs\" + $env:JOB_ID)
          $outbox = Join-Path $jobRoot "receipt-outbox"
          $intents = @(
            Get-ChildItem -LiteralPath $outbox -Filter "*.intent.json" -File
          )
          if ($intents.Count -ne 1) {
            throw "Expected one fresh receipt intent; found $($intents.Count)."
          }
          $intent = Get-Content -LiteralPath $intents[0].FullName -Raw |
            ConvertFrom-Json
          $allowedReceiptNames = @(
            "blocked_receipt.signed.json",
            "nemo-v3-qualified.signed.json",
            "nemo-v3-terminal.signed.json"
          )
          if ($intent.requestedReceiptName -notin $allowedReceiptNames) {
            throw "Receipt intent requested an unapproved file name."
          }
          $expectedIntentName = (
            $intent.requestedReceiptName -replace "\.signed\.json$", ".intent.json"
          )
          if ($intents[0].Name -cne $expectedIntentName) {
            throw "Receipt intent file name does not match its requested receipt."
          }
          $notBefore = Get-Content -LiteralPath (
            Join-Path $env:BRIDGE_ROOT (
              "control\" + $env:JOB_ID + "-not-before.txt"
            )
          ) -Raw

          & $env:CONTROL_PYTHON `
            (Join-Path $env:BRIDGE_SOURCE "laptop\finalize_nemo_v3_receipt.py") `
            --spec (
              Join-Path $env:BRIDGE_SOURCE (
                "queue\pending\" + $env:JOB_ID + ".json"
              )
            ) `
            --intent $intents[0].FullName `
            --engine-key (
              Join-Path $env:BRIDGE_SOURCE "keys\engine_pubkey.json"
            ) `
            --bridge-root $env:BRIDGE_ROOT `
            --not-before $notBefore.Trim() `
            --ledger (Join-Path $env:BRIDGE_ROOT "jobs\seen.txt")
          if ($LASTEXITCODE -ne 0) {
            throw "Trusted receipt finalization failed."
          }

      - name: Remove per-run trusted source and control runtime
        if: ${{ always() }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $runnerTemp = [IO.Path]::GetFullPath(
            $env:RUNNER_TEMP
          ).TrimEnd("\") + "\"
          $temporaryPaths = @(
            (Join-Path $env:RUNNER_TEMP (
              "szl-gpu-bridge-" + $env:GITHUB_RUN_ID
            )),
            (Join-Path $env:RUNNER_TEMP (
              "szl-nemo-control-" + $env:GITHUB_RUN_ID
            ))
          )
          foreach ($path in $temporaryPaths) {
            $resolved = [IO.Path]::GetFullPath($path)
            $leaf = Split-Path -Leaf $resolved
            if (
              -not $resolved.StartsWith(
                $runnerTemp,
                [StringComparison]::OrdinalIgnoreCase
              ) -or
              $leaf -notmatch "^szl-(gpu-bridge|nemo-control)-[0-9]+$"
            ) {
              throw "Refusing to clean an unexpected path: $resolved"
            }
            if (Test-Path -LiteralPath $resolved) {
              Remove-Item -LiteralPath $resolved -Recurse -Force
            }
          }
