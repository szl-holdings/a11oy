# SPDX-License-Identifier: Apache-2.0
name: Materialize Hugging Face generated consumers

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - docs/huggingface-ecosystem-manifest.json
      - .github/workflows/_refresh_hf_generated_consumers_once.yml

permissions:
  contents: read

concurrency:
  group: materialize-hf-generated-consumers-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'szl-holdings/a11oy' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/hf-ecosystem-manifest-current-20260906'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable subject
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Regenerate and prove exact consumers
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/render_public_estate_alignment.py \
            scripts/build_ecosystem_stage_matrix.py \
            tests/test_public_estate_alignment.py

          python scripts/render_public_estate_alignment.py
          python scripts/build_ecosystem_stage_matrix.py

          python scripts/render_public_estate_alignment.py --check
          python scripts/build_ecosystem_stage_matrix.py --check
          PYTHONPATH=. python tests/test_public_estate_alignment.py
          python scripts/test_audit_huggingface_ecosystem.py
          python scripts/audit_huggingface_ecosystem.py \
            --check \
            --output docs/huggingface-ecosystem-manifest.json

          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          expected = {
              'docs/generated/github-org-public-estate.md',
              'docs/generated/huggingface-org-card.md',
              'docs/generated/a11oy-net-public-estate.md',
              'docs/ecosystem-stage-matrix.json',
          }
          changed = {
              row
              for row in subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines()
              if row
          }
          if changed != expected:
              raise SystemExit(
                  f'generated-consumer drift escaped bounds: '
                  f'expected={sorted(expected)} observed={sorted(changed)}'
              )

          matrix = json.loads(
              Path('docs/ecosystem-stage-matrix.json').read_text(encoding='utf-8')
          )
          manifest = json.loads(
              Path('docs/huggingface-ecosystem-manifest.json').read_text(encoding='utf-8')
          )
          if matrix.get('observedAt') != manifest.get('observedAt'):
              raise SystemExit('stage matrix is not bound to manifest observedAt')
          if matrix.get('machineGeneratedCounts', {}).get('huggingFacePublic') != manifest.get('counts'):
              raise SystemExit('stage matrix public counts do not match manifest')
          if matrix.get('generatedBy') != 'scripts/build_ecosystem_stage_matrix.py':
              raise SystemExit('stage matrix generator authority drift')

          for path in sorted(expected - {'docs/ecosystem-stage-matrix.json'}):
              text = Path(path).read_text(encoding='utf-8')
              if 'GENERATED' not in text or manifest['observedAt'] not in text:
                  raise SystemExit(f'generated public-estate binding missing: {path}')
          print(json.dumps({
              'state': 'GENERATED_CONSUMERS_CURRENT',
              'observedAt': manifest['observedAt'],
              'counts': manifest['counts'],
              'files': sorted(expected),
          }, sort_keys=True))
          PY

          git diff --check

      - name: Retain exact generated consumers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-generated-consumers-${{ github.event.pull_request.head.sha }}
          path: |
            docs/generated/github-org-public-estate.md
            docs/generated/huggingface-org-card.md
            docs/generated/a11oy-net-public-estate.md
            docs/ecosystem-stage-matrix.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
