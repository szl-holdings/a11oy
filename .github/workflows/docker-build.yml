name: Container build + GHCR push

# Builds the root Dockerfile, generates an image SBOM, and pushes to GHCR:
#   * Pull-request:    build + smoke-test only (no push, no registry login).
#   * Push to main:    build + push SHA-tagged image to ghcr.io/szl-holdings/a11oy.
#   * Release published: push semver + latest tags, sign with cosign keyless.
#
# L1 fix (2026-05-31): REVISION build-arg is now passed as github.sha so that
# the runtime ENV A11OY_GIT_SHA is populated in the container and /healthz
# returns the real deployed SHA. Reference: red-team finding L1.
#
# Cosign keyless verification (no stored key; GitHub OIDC + Fulcio + Rekor):
#   cosign verify \
#     --certificate-identity-regexp \
#       "https://github.com/szl-holdings/a11oy/.github/workflows/docker-build.yml.*" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     ghcr.io/szl-holdings/a11oy:<tag>
#
# References:
#   docker/build-push-action: https://github.com/docker/build-push-action
#   anchore/sbom-action:       https://github.com/anchore/sbom-action
#   cosign keyless:            https://docs.sigstore.dev/cosign/signing/overview/
#
# Authored for SZL Holdings. Signed-off per repository DCO.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/szl-holdings/a11oy

jobs:
  build:
    name: Build image + SBOM (push on main + release)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR on main and release
      id-token: write        # cosign keyless OIDC token
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Derive image version and tags
        id: ver
        run: |
          SHA7="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            TAGS="${{ env.IMAGE }}:${VERSION}
          ${{ env.IMAGE }}:latest
          ${{ env.IMAGE }}:sha-${SHA7}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            VERSION="0.0.0-dev-${SHA7}"
            TAGS="${{ env.IMAGE }}:sha-${SHA7}"
          else
            VERSION="0.0.0-pr-${SHA7}"
            TAGS="${{ env.IMAGE }}:pr-${SHA7}"
          fi
          echo "version=${VERSION}"      >> "$GITHUB_OUTPUT"
          echo "sha7=${SHA7}"            >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          # Multi-line value — use heredoc to avoid quoting issues.
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Log in on push-to-main and on release; skip for PRs.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push on main + release; load on PR)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.ver.outputs.build_date }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.ver.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # FIX (Yachay, empire-reliability 2026-06-01): docker/build-push-action@v6
          # defaults to provenance:true, which exports an OCI attestation manifest.
          # Pushing that referrers index to ghcr.io/szl-holdings/* returns 403 Forbidden
          # on the attestation blob HEAD (org GHCR rejects the auto-created attestation
          # index). Image SBOM is already produced by the dedicated anchore/syft step,
          # so disabling buildx attestations is the root-cause fix, not a workaround.
          provenance: false
          sbom: false

      - name: Smoke test image (PR builds — loaded into local daemon)
        if: github.event_name == 'pull_request'
        timeout-minutes: 12
        run: |
          TAG="${{ env.IMAGE }}:pr-${{ steps.ver.outputs.sha7 }}"
          IMAGE_REVISION="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${TAG}")"
          test "${IMAGE_REVISION}" = "${GITHUB_SHA}"
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${TAG}")"
          echo "=== boot exact-source container + probe health and model feature ==="
          CID="$(docker run -d -e PORT=7860 -e SZL_GIT_SHA="${GITHUB_SHA}" -p 127.0.0.1:7860:7860 "${TAG}")"
          cleanup() { echo "--- container logs (tail) ---"; docker logs "${CID}" 2>&1 | tail -60 || true; docker rm -f "${CID}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ok=0
          for i in $(seq 1 120); do
            code="$(curl --noproxy '*' --connect-timeout 2 --max-time 5 -sS -o /tmp/a11oy_healthz.json -w '%{http_code}' "http://127.0.0.1:7860/api/a11oy/healthz" 2>/dev/null || true)"
            if [ "${code}" = "200" ]; then ok=1; echo "healthz 200 after ${i}s:"; cat /tmp/a11oy_healthz.json; echo; break; fi
            sleep 1
          done
          if [ "${ok}" != "1" ]; then echo "::error::a11oy image failed /api/a11oy/healthz smoke after 120s"; exit 1; fi
          python3 -B - <<'PY'
          import json
          import re
          import urllib.request
          parent = "00-0123456789abcdef0123456789abcdef-0123456789abcdef-00"
          request = urllib.request.Request(
              "http://127.0.0.1:7860/api/a11oy/v1/otel/status",
              headers={"traceparent": parent},
          )
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(request, timeout=10) as response:
              body = json.load(response)
              child = response.headers.get("traceparent", "")
          assert re.fullmatch(r"00-[0-9a-f]{32}-[0-9a-f]{16}-00", child), child
          assert child.split("-")[1] == parent.split("-")[1], child
          assert child.split("-")[2] not in {"0" * 16, parent.split("-")[2]}, child
          assert body["in_process"]["trace_propagation"] == "READY", body
          assert body["exporter"]["delivery_asserted"] is False, body
          assert body["receipt_minted"] is False, body
          print("Packaged telemetry propagation verified; collector delivery is not asserted.")
          PY
          python3 -B scripts/test_model_pretraining_container.py \
            --expected-source "${GITHUB_SHA}" --image-id "${IMAGE_ID}" \
            --output artifacts/model-pretraining-container/report.json

      - name: Retain full-image model feature checks, including failures
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: model-pretraining-container-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/model-pretraining-container/
          if-no-files-found: warn
          retention-days: 30

      # FIX (Yachay, empire-reliability 2026-06-01): the SBOM step previously always
      # referenced the pushed main tag `:sha-<sha7>`. On pull_request builds the image
      # is NOT pushed to GHCR (push:false) — it is `load`ed into the local Docker daemon
      # under tag `:pr-<sha7>`. Syft therefore tried to pull `ghcr.io/.../a11oy:sha-<sha7>`
      # which does not exist for PRs and returned `unauthorized` (registry has no such
      # manifest + no PR login), failing every PR run. Root-cause fix: scan the
      # locally-loaded PR image on PRs and the pushed SHA tag on push-to-main.
      - name: Generate image SBOM (CycloneDX) via Syft — push to main
        if: github.event_name == 'push'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:sha-${{ steps.ver.outputs.sha7 }}
          format: cyclonedx-json
          output-file: a11oy-image-sbom.cyclonedx.json
          upload-artifact: true

      - name: Generate image SBOM (CycloneDX) via Syft — PR (local image)
        if: github.event_name == 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:pr-${{ steps.ver.outputs.sha7 }}
          format: cyclonedx-json
          output-file: a11oy-image-sbom.cyclonedx.json
          upload-artifact: true

      - name: Rehearse required POST contracts in isolated PR image
        if: github.event_name == 'pull_request'
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ env.IMAGE }}:pr-${{ steps.ver.outputs.sha7 }}"
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${TAG}")"
          SOURCE="${RUNNER_TEMP}/effect-acceptance-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git worktree add --detach "${SOURCE}" "${GITHUB_SHA}"
          test "$(git -C "${SOURCE}" rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git -C "${SOURCE}" status --porcelain=v1)"
          REPORT="${RUNNER_TEMP}/effect-acceptance.json"
          status=0
          python3 -B "${SOURCE}/tools/readiness-harness/effect_acceptance.py" \
            --image "${IMAGE_ID}" --out "${REPORT}" || status=$?
          # Exit 2 is the driver's honest diagnostic result: agent-loop effect
          # execution remains unavailable even when the other four contracts pass.
          if [ "${status}" -ne 2 ]; then
            echo "::error::Effect rehearsal returned unexpected exit ${status}"
            exit 1
          fi
          python3 - "${REPORT}" "${IMAGE_ID}" "${GITHUB_SHA}" <<'PY'
          import json
          import sys

          path, image_id, source = sys.argv[1:]
          with open(path, encoding="utf-8") as stream:
              report = json.load(stream)
          required = {
              "schema": "szl.a11oy-effect-acceptance/v1",
              "evidenceClass": "SIMULATED",
              "scope": "one_shot_declared_source_isolated_container",
              "sourceRevision": source,
              "imageId": image_id,
              "sourceBinding": "DECLARED_IMAGE_REVISION_LABEL",
              "network": "docker_none",
              "productionReadiness": "UNAVAILABLE",
              "containerCleanupVerified": True,
              "summary": {"total": 5, "pass": 4, "unavailable": 1},
          }
          for key, expected in required.items():
              if report.get(key) != expected:
                  raise SystemExit(f"Effect rehearsal {key} mismatch or unavailable")
          with open(path + ".recovery.jsonl", encoding="utf-8") as stream:
              recovery = [json.loads(line) for line in stream]
          if ([event.get("phase") for event in recovery]
                  != ["prepared", "cidfile", "cleanup"]
                  or recovery[0].get("sourceRevision") != source
                  or recovery[0].get("imageId") != image_id
                  or recovery[2].get("containerCleanupVerified") is not True):
              raise SystemExit("Effect rehearsal recovery identity or cleanup unavailable")
          paths = (
              "/api/a11oy/v1/policy/decide",
              "/api/a11oy/v1/operator/ask",
              "/api/a11oy/v1/eval/run",
              "/api/a11oy/v1/agentloop/run",
              "/api/a11oy/v1/policy/compliance",
          )
          rows = report.get("results")
          if not isinstance(rows, list) or [row.get("path") for row in rows] != list(paths):
              raise SystemExit("Effect rehearsal route inventory mismatch")
          for index, row in enumerate(rows):
              expected_result = "UNAVAILABLE" if index == 3 else "PASS"
              expected_class = "UNAVAILABLE" if index == 3 else "SIMULATED"
              if (row.get("result") != expected_result
                      or row.get("evidenceClass") != expected_class
                      or row.get("attempts") != 1
                      or row.get("effectState") == "UNKNOWN"):
                  raise SystemExit(f"Effect rehearsal contract mismatch: {paths[index]}")
          agentloop = rows[3]
          if (agentloop.get("reason") != "agentloop_effect_not_executed"
                  or agentloop.get("effectState") != "REFUSED_BEFORE_ROUTE"
                  or agentloop.get("statusCode") != 401
                  or agentloop.get("semantic") != {"authorizationRefused": True}):
              raise SystemExit("Agent-loop refusal boundary not observed")
          print("SIMULATED isolated PR-image rehearsal: four contracts observed; "
                "agent-loop effect and production readiness UNAVAILABLE.")
          PY

      - name: Retain isolated POST rehearsal receipt and recovery identity
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: effect-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/effect-acceptance.json
            ${{ runner.temp }}/effect-acceptance.json.recovery.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Install cosign (release only)
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign keyless (release only)
        if: github.event_name == 'release'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"
          echo "Signed ${{ env.IMAGE }}@${DIGEST} (keyless OIDC)."

      - name: Generate + attach image SBOM on release (signed)
        if: github.event_name == 'release'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          format: cyclonedx-json
          output-file: a11oy-image-sbom.cyclonedx.json
          upload-artifact: true
