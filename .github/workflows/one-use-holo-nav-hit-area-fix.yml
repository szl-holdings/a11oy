name: One-use Holo navigation hit-area repair

on:
  push:
    branches:
      - fix/holo-nav-hit-area-20260904
    paths:
      - .github/workflows/one-use-holo-nav-hit-area-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-use-holo-navigation-hit-area-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/holo-nav-hit-area-20260904
          fetch-depth: 1
          persist-credentials: true

      - name: Apply deterministic rounded-control geometry repair
        env:
          TEST_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('a11oy_landing.html')
          text = path.read_text(encoding='utf-8')
          old = 'min-width:44px;min-height:44px;height:auto;padding:8px 11px;border-radius:10px'
          new = 'min-width:50px;min-height:50px;height:auto;padding:8px 11px;border-radius:10px'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one canonical nav geometry rule, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          mkdir -p tests
          printf '%s' "$TEST_B64" | base64 -d > tests/test_landing_nav_hit_area_geometry.py

      - name: Prove focused contract and source hygiene
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_landing_nav_hit_area_geometry
          python -m py_compile tests/test_landing_nav_hit_area_geometry.py
          git diff --check

      - name: Commit product repair only
        run: |
          set -euo pipefail
          git config user.name 'Stephen Lutar'
          git config user.email 'stephenlutar2@gmail.com'
          git add a11oy_landing.html tests/test_landing_nav_hit_area_geometry.py
          git diff --cached --quiet && {
            echo 'Holo navigation geometry already repaired.'
            exit 0
          }
          git commit -s -m 'fix(frontend): guarantee Holo 44px hit area'
          git push origin HEAD:fix/holo-nav-hit-area-20260904
