# SPDX-License-Identifier: Apache-2.0
name: Reconcile phone fold CTA geometry once

on:
  push:
    branches:
      - fix/phone-first-fold-cta-visibility-20260906
    paths:
      - .github/workflows/_reconcile_phone_fold_cta_once.yml

permissions:
  contents: write

concurrency:
  group: reconcile-phone-fold-cta-once
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/fix/phone-first-fold-cta-visibility-20260906'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact reconciliation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Reconcile physical target and first-fold geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, observed {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "console/assets/szl-flow.css",
              '''/* Homepage-owned hero actions retain one CSS pixel of rendering headroom above
   the 44px physical target floor, even before Flow decorates <body>. */
@media(max-width:480px){html[data-szl-shell-owner="homepage"] .cta-row .btn{min-height:45px}}''',
              '''/* Keep the shipped Flow-shell override equal to the landing page's 52px
   mobile CTA contract. The short-phone geometry rule below moves the full
   target inside the viewport instead of shrinking or hiding the control. */
@media(max-width:480px){html[data-szl-shell-owner="homepage"] .cta-row .btn{min-height:52px}}''',
          )

          replace_once(
              "tests/test_landing_touch_targets.py",
              '''def test_phone_hero_ctas_use_durable_product_css_with_rendering_headroom() -> None:
    html = Path("a11oy_landing.html").read_text(encoding="utf-8")
    flow = Path("console/assets/szl-flow.css").read_text(encoding="utf-8")
    size_rule = (
        '@media(max-width:480px){'
        'html[data-szl-shell-owner="homepage"] .cta-row .btn{min-height:45px}'
        '}'
    )
    assert 'href="/assets/szl-flow.css"' in html
    assert size_rule in flow
    assert "rendering headroom" in flow
    assert not Path("ops/patches/mobile-cta-hit-area-44px.patch").exists()
    assert not Path("ops/patches/README-mobile-cta-hit-area.md").exists()
    assert not Path(".github/workflows/_materialize_mobile_hero_cta_hit_area_once.yml").exists()
''',
              '''def test_phone_hero_ctas_preserve_full_mobile_target_contract() -> None:
    html = Path("a11oy_landing.html").read_text(encoding="utf-8")
    flow = Path("console/assets/szl-flow.css").read_text(encoding="utf-8")
    inline_contract = (
        ".cta-row .btn{width:100%;min-height:52px;border-radius:6px;"
        "white-space:normal;text-align:center}"
    )
    size_rule = (
        '@media(max-width:480px){'
        'html[data-szl-shell-owner="homepage"] .cta-row .btn{min-height:52px}'
        '}'
    )
    assert 'href="/assets/szl-flow.css"' in html
    assert inline_contract in html
    assert size_rule in flow
    assert "52px" in flow and "inside the viewport" in flow
    assert 'html[data-szl-shell-owner="homepage"] .cta-row .btn{min-height:45px}' not in flow
    assert not Path("ops/patches/mobile-cta-hit-area-44px.patch").exists()
    assert not Path("ops/patches/README-mobile-cta-hit-area.md").exists()
    assert not Path(".github/workflows/_materialize_mobile_hero_cta_hit_area_once.yml").exists()
''',
          )
          PY

      - name: Verify focused geometry contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile tests/test_landing_touch_targets.py
          pytest -q tests/test_landing_touch_targets.py
          git diff --check

      - name: Commit reconciled permanent repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/phone-first-fold-cta-visibility-20260906
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git rm -- .github/workflows/_reconcile_phone_fold_cta_once.yml
          git add -- console/assets/szl-flow.css tests/test_landing_touch_targets.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'fix(frontdoor): preserve full CTA target inside first fold' \
            -m 'Restore the 52px mobile target contract and retain the measured narrow-short hero compaction so the complete control moves above the custom-domain viewport boundary.'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$branch"
