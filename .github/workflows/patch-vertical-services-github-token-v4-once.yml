name: Patch vertical-services GitHub token propagation once

on:
  push:
    branches:
      - fix/vertical-services-github-token-v4

permissions:
  contents: write

concurrency:
  group: patch-vertical-services-github-token-v4-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/vertical-services-github-token-v4
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize the permanent GH_TOKEN compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          script_path = Path('scripts/hf_publish_vertical_services.py')
          test_path = Path('tests/test_hf_publish_vertical_services_token_alias.py')
          text = script_path.read_text(encoding='utf-8')

          helper = '''
          def ensure_github_token_alias() -> str:
              """Expose the workflow token under the controller's canonical name.

              GitHub Actions commonly exports the ephemeral token as ``GH_TOKEN``
              for ``gh`` while the pinned exact-source controller intentionally
              reads ``GITHUB_TOKEN``. Accept either name, normalize only in process,
              and return the source name for secret-free receipts.
              """
              for name in ("GITHUB_TOKEN", "GH_TOKEN"):
                  value = os.getenv(name, "").strip()
                  if value:
                      os.environ["GITHUB_TOKEN"] = value
                      return name
              raise RuntimeError(
                  "no GitHub API token available for the default-branch-tip guard"
              )
          '''

          helper_anchor = '''    raise RuntimeError("no Hugging Face write token available to canonical writer")


def run_checked(command: list[str], *, cwd: Path | None = None) -> None:
          '''
          if 'def ensure_github_token_alias() -> str:' not in text:
              if helper_anchor not in text:
                  raise SystemExit('token helper insertion anchor was not found')
              replacement = (
                  '    raise RuntimeError("no Hugging Face write token available to canonical writer")\n\n\n'
                  + textwrap.dedent(helper).strip()
                  + '\n\n\ndef run_checked(command: list[str], *, cwd: Path | None = None) -> None:\n'
              )
              text = text.replace(helper_anchor, replacement, 1)

          main_anchor = '''def main() -> int:
              token, token_source = token_from_env()
              os.environ["HF_TOKEN"] = token
              receipt: dict[str, Any] = {
          '''
          main_replacement = '''def main() -> int:
              token, token_source = token_from_env()
              os.environ["HF_TOKEN"] = token
              github_token_source = ensure_github_token_alias()
              receipt: dict[str, Any] = {
          '''
          if 'github_token_source = ensure_github_token_alias()' not in text:
              if textwrap.dedent(main_anchor) not in text:
                  raise SystemExit('main token normalization anchor was not found')
              text = text.replace(
                  textwrap.dedent(main_anchor),
                  textwrap.dedent(main_replacement),
                  1,
              )

          receipt_anchor = '''        "token_source_name": token_source,
                  "token_value_recorded": False,
          '''
          receipt_replacement = '''        "token_source_name": token_source,
                  "token_value_recorded": False,
                  "github_token_source_name": github_token_source,
                  "github_token_value_recorded": False,
          '''
          if '"github_token_source_name": github_token_source' not in text:
              if textwrap.dedent(receipt_anchor) not in text:
                  raise SystemExit('receipt token metadata anchor was not found')
              text = text.replace(
                  textwrap.dedent(receipt_anchor),
                  textwrap.dedent(receipt_replacement),
                  1,
              )

          script_path.write_text(text, encoding='utf-8')

          test_source = '''
          #!/usr/bin/env python3
          """Regression tests for vertical-services GitHub token normalization."""
          from __future__ import annotations

          import importlib.util
          import os
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          MODULE_PATH = ROOT / "scripts" / "hf_publish_vertical_services.py"
          SPEC = importlib.util.spec_from_file_location("hf_publish_vertical_services", MODULE_PATH)
          if SPEC is None or SPEC.loader is None:
              raise RuntimeError("unable to load publisher module")
          MODULE = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(MODULE)


          class GitHubTokenAliasContract(unittest.TestCase):
              def setUp(self) -> None:
                  self.original = {
                      name: os.environ.get(name)
                      for name in ("GITHUB_TOKEN", "GH_TOKEN")
                  }
                  os.environ.pop("GITHUB_TOKEN", None)
                  os.environ.pop("GH_TOKEN", None)

              def tearDown(self) -> None:
                  for name, value in self.original.items():
                      if value is None:
                          os.environ.pop(name, None)
                      else:
                          os.environ[name] = value

              def test_canonical_name_is_preserved(self) -> None:
                  os.environ["GITHUB_TOKEN"] = "canonical-test-token"
                  os.environ["GH_TOKEN"] = "cli-test-token"
                  self.assertEqual(MODULE.ensure_github_token_alias(), "GITHUB_TOKEN")
                  self.assertEqual(os.environ["GITHUB_TOKEN"], "canonical-test-token")

              def test_cli_name_is_normalized_for_controller(self) -> None:
                  os.environ["GH_TOKEN"] = "cli-test-token"
                  self.assertEqual(MODULE.ensure_github_token_alias(), "GH_TOKEN")
                  self.assertEqual(os.environ["GITHUB_TOKEN"], "cli-test-token")

              def test_missing_token_fails_closed(self) -> None:
                  with self.assertRaisesRegex(RuntimeError, "default-branch-tip guard"):
                      MODULE.ensure_github_token_alias()


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          '''
          test_path.write_text(textwrap.dedent(test_source), encoding='utf-8')
          PY

      - name: Validate syntax, behavior, and existing vertical contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'huggingface_hub==1.10.1'
          python -m py_compile scripts/hf_publish_vertical_services.py
          python tests/test_hf_publish_vertical_services_token_alias.py
          python tests/test_hf_publish_vertical_flagships_v4.py
          git diff --check
          git diff -- scripts/hf_publish_vertical_services.py tests/test_hf_publish_vertical_services_token_alias.py

      - name: Commit and push only non-workflow implementation files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stephen Lutar"
          git config user.email "stephenlutar2@gmail.com"
          git add scripts/hf_publish_vertical_services.py tests/test_hf_publish_vertical_services_token_alias.py
          if git diff --cached --quiet; then
            echo 'Publisher compatibility repair is already materialized.'
            exit 0
          fi
          git commit -s -m "fix(hf): normalize GH_TOKEN for vertical source guard"
          git push origin HEAD:fix/vertical-services-github-token-v4
