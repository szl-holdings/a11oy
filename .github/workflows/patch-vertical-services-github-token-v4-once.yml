name: Patch vertical-services GitHub token propagation once

on:
  push:
    branches:
      - fix/vertical-services-github-token-v4

permissions:
  contents: write

concurrency:
  group: patch-vertical-services-github-token-v4-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/vertical-services-github-token-v4
          fetch-depth: 0
          persist-credentials: true

      - name: Add the token name required by the guarded nested publisher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/hf-sync.yml')
          one_shot_path = Path('.github/workflows/patch-vertical-services-github-token-v4-once.yml')
          text = workflow_path.read_text(encoding='utf-8')

          job_start = text.index('  publish-vertical-flagships:\n')
          job_end = text.index('\n  readiness-verdict:', job_start)
          block = text[job_start:job_end]
          token_expression = chr(36) + '{{ github.token }}'
          marker = '      GITHUB_TOKEN: ' + token_expression

          if marker not in block:
              env_anchor = '    env:\n'
              if env_anchor not in block:
                  raise SystemExit('publish-vertical-flagships job-level env block was not found')
              insertion = (
                  env_anchor
                  + '      # Required by the nested exact-source publisher when its default-branch-tip guard is enabled.\n'
                  + marker
                  + '\n'
              )
              block = block.replace(env_anchor, insertion, 1)
              text = text[:job_start] + block + text[job_end:]
              workflow_path.write_text(text, encoding='utf-8')

          one_shot_path.unlink()
          PY

      - name: Validate the exact scoped YAML change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/hf-sync.yml').read_text(encoding='utf-8')
          token_expression = chr(36) + '{{ github.token }}'
          marker = 'GITHUB_TOKEN: ' + token_expression
          top_level_marker = 'GH_TOKEN: ' + token_expression
          job_start = text.index('  publish-vertical-flagships:\n')
          job_end = text.index('\n  readiness-verdict:', job_start)
          block = text[job_start:job_end]

          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one GITHUB_TOKEN marker, found {text.count(marker)}')
          if marker not in block:
              raise SystemExit('GITHUB_TOKEN is not scoped to publish-vertical-flagships')
          if top_level_marker not in text:
              raise SystemExit('existing top-level GH_TOKEN contract was lost')
          if Path('.github/workflows/patch-vertical-services-github-token-v4-once.yml').exists():
              raise SystemExit('one-shot workflow was not removed')
          PY
          git diff --check
          git diff -- .github/workflows/hf-sync.yml

      - name: Commit the permanent repair and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stephen Lutar"
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git commit -s -m "fix(hf): pass GitHub token to guarded vertical publisher"
          git push origin HEAD:fix/vertical-services-github-token-v4
