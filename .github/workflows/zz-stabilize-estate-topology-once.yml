# SPDX-License-Identifier: Apache-2.0
name: Stabilize estate topology once

"on":
  push:
    branches: [feat/estate-product-topology-v1-20260904]
    paths:
      - .github/workflows/zz-stabilize-estate-topology-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stabilize-estate-topology-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Require exact branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/estate-product-topology-v1-20260904
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Make test loading deterministic and remove proven unused import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path("scripts/estate_product_topology.py")
          source = script.read_text(encoding="utf-8")
          source = source.replace("import os\n", "", 1)
          script.write_text(source, encoding="utf-8")

          test = Path("tests/test_estate_product_topology.py")
          text = test.read_text(encoding="utf-8")
          if "import sys\n" not in text:
              anchor = "import json\n"
              if text.count(anchor) != 1:
                  raise SystemExit("test import anchor drifted")
              text = text.replace(anchor, anchor + "import sys\n", 1)
          registration = "    sys.modules[spec.name] = module\n"
          if registration not in text:
              anchor = "    module = importlib.util.module_from_spec(spec)\n"
              if text.count(anchor) != 1:
                  raise SystemExit("test loader anchor drifted")
              text = text.replace(anchor, anchor + registration, 1)
          test.write_text(text, encoding="utf-8")
          PY
          ! grep -Fq 'import os' scripts/estate_product_topology.py
          grep -Fq 'sys.modules[spec.name] = module' tests/test_estate_product_topology.py

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Prove topology contract and focused lint
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "pytest==8.4.2" "ruff==0.16.6"
          python -m py_compile scripts/estate_product_topology.py tests/test_estate_product_topology.py
          ruff check scripts/estate_product_topology.py tests/test_estate_product_topology.py --select E9,F
          python -m pytest -q tests/test_estate_product_topology.py
          git diff --check

      - name: Remove all topology repair controls
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/zz-fix-topology-test-loader-once.yml \
            .github/workflows/zz-stabilize-estate-topology-once.yml

      - name: Commit clean review surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repair required."
            exit 0
          fi
          git commit --signoff -m "test(topology): stabilize exact-source witness"
          git push origin "HEAD:${GITHUB_REF_NAME}"
