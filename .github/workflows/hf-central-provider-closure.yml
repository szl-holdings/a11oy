name: HF central exact-source provider closure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hf-central-provider-closure.yml
  workflow_dispatch:
    inputs:
      target:
        description: Space deployment target
        required: true
        type: choice
        default: both
        options:
          - both
          - nexus
          - lyte-lattice

permissions:
  contents: read

concurrency:
  group: hf-central-provider-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish and attest ${{ matrix.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - slug: nexus
            source_repository: szl-holdings/nexus
            source_ref: main
            hf_repo: SZLHOLDINGS/nexus
            dockerfile_path: space/Dockerfile
            smoke_paths: '["/"]'
          - slug: lyte-lattice
            source_repository: szl-holdings/lyte-lattice
            source_ref: main
            hf_repo: SZLHOLDINGS/lyte-lattice
            dockerfile_path: Dockerfile
            smoke_paths: '["/"]'
    concurrency:
      group: hf-central-provider-${{ matrix.slug }}
      cancel-in-progress: false
    steps:
      - name: Select requested target
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TARGET: ${{ inputs.target || 'both' }}
          MATRIX_TARGET: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          enabled=false
          if [ "$EVENT_NAME" = push ] || [ "$REQUESTED_TARGET" = both ] || [ "$REQUESTED_TARGET" = "$MATRIX_TARGET" ]; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "target=$MATRIX_TARGET enabled=$enabled"

      - name: Harden runner
        if: steps.select.outputs.enabled == 'true'
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact current source tip
        if: steps.select.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.source_repository }}
          ref: ${{ matrix.source_ref }}
          path: caller
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout immutable publisher tools
        if: steps.select.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/.github
          ref: 61d38c3138460e72d2b118196fa626506e598a62
          path: tools
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact source and tool identities
        if: steps.select.outputs.enabled == 'true'
        id: source
        shell: bash
        env:
          EXPECTED_TOOLS_SHA: 61d38c3138460e72d2b118196fa626506e598a62
          SOURCE_REPOSITORY: ${{ matrix.source_repository }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C caller rev-parse --verify HEAD)"
          TOOLS_SHA="$(git -C tools rev-parse --verify HEAD)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$TOOLS_SHA" = "$EXPECTED_TOOLS_SHA" ]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "manifest=hf-deploy-${{ matrix.slug }}.json" >> "$GITHUB_OUTPUT"
          printf 'source_repository=%s\nsource_sha=%s\ntools_sha=%s\n' "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$TOOLS_SHA"

      - name: Set up exact Python runtime
        if: steps.select.outputs.enabled == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - name: Create isolated hash-locked publisher
        if: steps.select.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/hf-publisher-venv"
          test ! -e "$VENV"
          python3 -m venv "$VENV"
          test "$("$VENV/bin/python" -I -P -c 'import platform; print(platform.python_version())')" = '3.12.10'
          "$VENV/bin/python" -I -P -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --ignore-installed \
            -r tools/requirements/hf-publisher.lock

      - name: Require credentialed organization publisher
        if: steps.select.outputs.enabled == 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || {
            echo '::error::Neither HF_ORG_TOKEN nor HF_TOKEN is configured in the central control plane.'
            exit 2
          }

      - name: Ensure approved Docker Space exists
        if: steps.select.outputs.enabled == 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
          HF_REPO: ${{ matrix.hf_repo }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P - <<'PY'
          import os
          from huggingface_hub import create_repo

          repo_id = os.environ["HF_REPO"]
          allowed = {"SZLHOLDINGS/nexus", "SZLHOLDINGS/lyte-lattice"}
          if repo_id not in allowed:
              raise SystemExit(f"refusing unapproved Space target: {repo_id}")
          create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="docker",
              private=False,
              exist_ok=True,
              token=os.environ["HF_TOKEN"],
          )
          print(f"ensured approved public Docker Space: {repo_id}")
          PY

      - name: Publish exact Dockerfile-derived source
        if: steps.select.outputs.enabled == 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ matrix.source_repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          HF_REPO: ${{ matrix.hf_repo }}
          DOCKERFILE_PATH: ${{ matrix.dockerfile_path }}
          SMOKE_PATHS: ${{ matrix.smoke_paths }}
          MANIFEST: ${{ steps.source.outputs.manifest }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P \
            tools/.github/scripts/hf_deploy_from_dockerfile.py \
            --repo-root caller \
            --github-repo "$SOURCE_REPOSITORY" \
            --hf-repo "$HF_REPO" \
            --ref "$SOURCE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --dockerfile-path "$DOCKERFILE_PATH" \
            --include-readme true \
            --smoke-paths "$SMOKE_PATHS" \
            --prune \
            --require-default-branch-tip \
            --manifest-out "$MANIFEST"

      - name: Restart published Space
        if: steps.select.outputs.enabled == 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
          HF_REPO: ${{ matrix.hf_repo }}
          MANIFEST: ${{ steps.source.outputs.manifest }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P \
            tools/.github/scripts/hf_deploy_from_dockerfile.py \
            --restart-space \
            --manifest "$MANIFEST" \
            --hf-repo "$HF_REPO"

      - name: Attest Hub commit, bytes, runtime, and smoke route
        if: steps.select.outputs.enabled == 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
          HF_REPO: ${{ matrix.hf_repo }}
          MANIFEST: ${{ steps.source.outputs.manifest }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P \
            tools/.github/scripts/hf_deploy_from_dockerfile.py \
            --attest \
            --manifest "$MANIFEST" \
            --hf-repo "$HF_REPO" \
            --wait-running 1200

      - name: Upload immutable provider evidence
        if: always() && steps.select.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-central-provider-${{ matrix.slug }}-${{ github.run_id }}
          path: ${{ steps.source.outputs.manifest }}
          if-no-files-found: warn
          retention-days: 90
