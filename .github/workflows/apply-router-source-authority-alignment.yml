name: Apply router source-authority alignment

"on":
  push:
    branches:
      - fix/router-source-authority-alignment-20260908
    paths:
      - scripts/align_router_source_authority.py
      - .github/workflows/apply-router-source-authority-alignment.yml
  pull_request:
    branches: [main]
    paths:
      - szl_brain.py
      - organs/amaru/szl_brain.py
      - organs/sentra/szl_brain.py
      - szl_llm_registry.py
      - a11oy_code.py
      - src/pages/A11oyCode.tsx
      - scripts/align_router_source_authority.py
      - .github/workflows/apply-router-source-authority-alignment.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    name: Apply exact authority rewrite
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/router-source-authority-alignment-20260908
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Apply deterministic codemod
        run: python scripts/align_router_source_authority.py
      - name: Commit exact rewritten sources
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source-authority diff remained.'
            exit 0
          fi
          git config user.name 'SZL Source Authority Bot'
          git config user.email 'stephenlutar2@gmail.com'
          git add \
            szl_brain.py \
            organs/amaru/szl_brain.py \
            organs/sentra/szl_brain.py \
            szl_llm_registry.py \
            a11oy_code.py \
            src/pages/A11oyCode.tsx
          git commit -m 'fix(router): make szl-router the canonical runtime source' \
            -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:fix/router-source-authority-alignment-20260908

  validate:
    name: Validate canonical router ownership
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile and assert the authority contract
        run: |
          set -euo pipefail
          python -m py_compile \
            szl_brain.py \
            szl_llm_registry.py \
            a11oy_code.py \
            scripts/align_router_source_authority.py
          grep -Fq 'szl-holdings/szl-router' szl_brain.py
          grep -Fq 'szl-holdings/szl-router' szl_llm_registry.py
          ! grep -Fq 'platform/packages/llm-router' szl_brain.py
          ! grep -Fq 'a11oy is THE LLM Hub' szl_llm_registry.py
      - name: Enable protected squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
