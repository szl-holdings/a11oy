name: Apply router source-authority alignment

"on":
  push:
    branches:
      - fix/router-source-authority-alignment-20260908
    paths:
      - scripts/align_router_source_authority.py
      - .github/workflows/apply-router-source-authority-alignment.yml
  pull_request:
    branches: [main]
    paths:
      - szl_brain.py
      - organs/amaru/szl_brain.py
      - organs/sentra/szl_brain.py
      - szl_llm_registry.py
      - a11oy_code.py
      - src/pages/A11oyCode.tsx
      - scripts/align_router_source_authority.py
      - .github/workflows/apply-router-source-authority-alignment.yml

permissions: read-all
jobs:
  apply:
    permissions:
      contents: write
      pull-requests: write
  validate:
    permissions:
      contents: read
      pull-requests: read
