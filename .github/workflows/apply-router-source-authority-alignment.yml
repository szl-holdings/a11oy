name: Validate router source-authority alignment

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: router-source-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Declared router source authority
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Exercise fail-closed declaration checks
        run: python -B -m unittest discover -s tests -p test_router_source_authority_alignment.py -v
      - name: Validate this source tree without writes
        run: python -B scripts/align_router_source_authority.py --check
