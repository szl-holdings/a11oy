name: Anatomy observation contract

on:
  pull_request:
    paths:
      - "szl_anatomy_3d.py"
      - "szl_operator_auth.py"
      - "szl_khipu.py"
      - "szl_observability.py"
      - "Dockerfile"
      - "serve.py"
      - "szl3d_holographic.py"
      - "static/3d/holographic.html"
      - "tests/image_layout.py"
      - "tests/test_brain_reranker.py"
      - "tests/test_anatomy_3d_observation_contract.py"
      - "tests/test_anatomy_3d_browser_contract.py"
      - ".github/scripts/install_playwright_chromium.sh"
      - "tests/test_chain_verified_missing_defaults.py"
      - "static-vendor/three.min.js"
      - "console/assets/szl/**"
      - ".github/requirements/ci-core.txt"
      - ".github/requirements/ci-rag.txt"
      - ".github/requirements/platform-candidate-browser.txt"
      - ".github/workflows/anatomy-observation-contract.yml"
  push:
    branches: [main]
    paths:
      - "szl_anatomy_3d.py"
      - "szl_operator_auth.py"
      - "szl_khipu.py"
      - "szl_observability.py"
      - "Dockerfile"
      - "serve.py"
      - "szl3d_holographic.py"
      - "static/3d/holographic.html"
      - "tests/image_layout.py"
      - "tests/test_brain_reranker.py"
      - "tests/test_anatomy_3d_observation_contract.py"
      - "tests/test_anatomy_3d_browser_contract.py"
      - ".github/scripts/install_playwright_chromium.sh"
      - "tests/test_chain_verified_missing_defaults.py"
      - "static-vendor/three.min.js"
      - "console/assets/szl/**"
      - ".github/requirements/ci-core.txt"
      - ".github/requirements/ci-rag.txt"
      - ".github/requirements/platform-candidate-browser.txt"
      - ".github/workflows/anatomy-observation-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anatomy-observation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anatomy-observation:
    name: Anatomy read boundary and browser contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install existing hash-locked test dependencies
        run: >-
          python -m pip install --require-hashes
          -r .github/requirements/ci-rag.txt
          -r .github/requirements/platform-candidate-browser.txt
      - name: Verify shipped modules and preserved route wiring
        run: |
          python - <<'PY'
          import ast
          import pathlib

          source = pathlib.Path("tests/test_brain_reranker.py").resolve()
          tree = ast.parse(source.read_text(encoding="utf-8"))
          name = "test_docker_and_frontend_wiring_present"
          nodes = [node for node in tree.body
                   if isinstance(node, ast.FunctionDef) and node.name == name]
          assert len(nodes) == 1, "Expected the existing source-wiring test"
          namespace = {"__file__": str(source), "pathlib": pathlib}
          exec(compile(ast.Module(body=nodes, type_ignores=[]), str(source), "exec"),
               namespace)
          namespace[name]()
          PY
      - name: Restore cached Chromium OS packages
        id: chromium-debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/szl-chromium-debs
          key: szl-chromium-debs-${{ runner.os }}-${{ runner.arch }}-ubuntu-latest-anatomy-${{ hashFiles('.github/scripts/install_playwright_chromium.sh') }}
          restore-keys: |
            szl-chromium-debs-${{ runner.os }}-${{ runner.arch }}-ubuntu-latest-anatomy-
      - name: Install isolated Chromium
        env:
          SZL_PW_DEB_CACHE: ~/.cache/szl-chromium-debs
        run: bash .github/scripts/install_playwright_chromium.sh python -m playwright
      - name: Save Chromium OS packages for later jobs
        if: success() && steps.chromium-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/szl-chromium-debs
          key: ${{ steps.chromium-debs.outputs.cache-primary-key }}
      - name: Verify registered routes and seven browser surfaces
        env:
          SZL_ANATOMY_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/anatomy-browser
        run: >-
          python -m pytest -q
          tests/test_anatomy_3d_observation_contract.py
          tests/test_anatomy_3d_browser_contract.py
          --junitxml="${{ runner.temp }}/anatomy-browser/junit.xml"
      - name: Retain source-bound offline browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anatomy-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/anatomy-browser
          if-no-files-found: error
          retention-days: 14
