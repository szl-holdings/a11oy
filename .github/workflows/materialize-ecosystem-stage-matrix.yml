name: Materialize ecosystem stage matrix

on:
  push:
    branches:
      - fix/hf-ecosystem-manifest-current-20260903-1116
    paths:
      - .github/workflows/materialize-ecosystem-stage-matrix.yml

permissions:
  contents: write

concurrency:
  group: materialize-ecosystem-stage-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    name: Regenerate, verify, commit, and self-delete
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Regenerate and verify deterministic matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_ecosystem_stage_matrix.py
          python3 scripts/build_ecosystem_stage_matrix.py
          python3 scripts/build_ecosystem_stage_matrix.py --check
          python3 scripts/test_audit_huggingface_ecosystem.py
          git diff --check
          git status --short

      - name: Commit derived artifact and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add docs/ecosystem-stage-matrix.json
          git rm .github/workflows/materialize-ecosystem-stage-matrix.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::Expected a derived stage-matrix update and workflow removal'
            exit 1
          fi
          git commit -s -m "fix(hf): regenerate ecosystem stage matrix"
          git push origin "HEAD:${GITHUB_REF_NAME}"
