name: HF universal frontend estate contract

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/hf_universal_frontend_control.py
      - tests/conftest.py
      - tests/test_hf_universal_frontend_control.py
      - docs/HF_UNIVERSAL_FRONTEND_CONTRACT.md
      - docs/HF_UNIVERSAL_FRONTEND_RUNBOOK.md
      - .github/workflows/hf-universal-frontend-estate.yml
      - .github/workflows/hf-universal-frontend-rollout.yml
  push:
    branches: [main]
    paths:
      - scripts/hf_universal_frontend_control.py
      - tests/conftest.py
      - tests/test_hf_universal_frontend_control.py
      - docs/HF_UNIVERSAL_FRONTEND_CONTRACT.md
      - docs/HF_UNIVERSAL_FRONTEND_RUNBOOK.md
      - .github/workflows/hf-universal-frontend-estate.yml
      - .github/workflows/hf-universal-frontend-rollout.yml
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-universal-frontend-estate-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Controller and source-bound safety contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install exact test and Hub clients
        run: >-
          python -m pip install --disable-pip-version-check
          'pytest==9.0.3'
          'huggingface_hub==1.23.0'

      - name: Compile and test the controller
        run: |
          python -m py_compile scripts/hf_universal_frontend_control.py tests/test_hf_universal_frontend_control.py
          python -m pytest -q tests/test_hf_universal_frontend_control.py

      - name: Prove bounded mutation surface
        run: |
          ! grep -nE 'update_repo_visibility|request_space_hardware|add_space_secret|delete_repo\(|CommitOperationDelete' scripts/hf_universal_frontend_control.py
          grep -n 'parent_commit=asset.sha' scripts/hf_universal_frontend_control.py
          grep -n 'create_pr=True' scripts/hf_universal_frontend_control.py

      - name: Prove manual-only provider authority
        run: |
          python - <<'PY'
          from pathlib import Path

          rollout = Path('.github/workflows/hf-universal-frontend-rollout.yml').read_text(encoding='utf-8')
          on_block = rollout.split('\npermissions:', 1)[0]
          assert 'workflow_dispatch:' in on_block
          for forbidden in ('pull_request:', 'push:', 'schedule:', 'workflow_run:', 'repository_dispatch:'):
              assert forbidden not in on_block, forbidden
          assert 'operation == \'execute\'' in rollout
          assert '--execute' in rollout and '--merge' in rollout
          assert rollout.count('--protected-source-sha "$GITHUB_SHA"') == 2
          PY
