name: Ecosystem Stage Matrix — Bounded Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diag-stage-matrix-candidate.yml

permissions:
  contents: write

concurrency:
  group: diag-stage-matrix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    name: Render and publish exact stage-matrix candidate
    if: >-
      github.repository == 'szl-holdings/a11oy' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/one-lathe-rekor-index-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Render and verify the exact tracked candidate
        run: |
          set -euo pipefail
          mkdir -p reports/stage-matrix-candidate
          cp docs/ecosystem-stage-matrix.json reports/stage-matrix-candidate/previous.json
          python3 scripts/build_ecosystem_stage_matrix.py
          python3 scripts/build_ecosystem_stage_matrix.py --check
          diff -u reports/stage-matrix-candidate/previous.json \
            docs/ecosystem-stage-matrix.json \
            > reports/stage-matrix-candidate/stage-matrix.diff || true
          cp docs/ecosystem-stage-matrix.json \
            reports/stage-matrix-candidate/ecosystem-stage-matrix.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          old = json.loads(Path('reports/stage-matrix-candidate/previous.json').read_text())
          new = json.loads(Path('docs/ecosystem-stage-matrix.json').read_text())
          summary = {
              'old_observed_at': old.get('observedAt'),
              'new_observed_at': new.get('observedAt'),
              'old_counts': old.get('machineGeneratedCounts'),
              'new_counts': new.get('machineGeneratedCounts'),
              'old_repository_count': len(old.get('repositories', [])),
              'new_repository_count': len(new.get('repositories', [])),
              'old_formula_count': len(old.get('formulas', [])),
              'new_formula_count': len(new.get('formulas', [])),
              'old_hf_count': len(old.get('huggingFace', [])),
              'new_hf_count': len(new.get('huggingFace', [])),
          }
          Path('reports/stage-matrix-candidate/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary['new_counts']['githubReadinessEntries'] == 19
          assert summary['new_counts']['theoremRuntimeEntries'] == 46
          assert summary['new_counts']['huggingFacePublic'] == {
              'models': 15,
              'datasets': 26,
              'spaces': 25,
          }
          assert summary['new_repository_count'] == 19
          assert summary['new_formula_count'] == 46
          assert summary['new_hf_count'] == 66
          PY
      - name: Upload immutable candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-matrix-candidate-${{ github.run_id }}
          path: reports/stage-matrix-candidate
          if-no-files-found: error
          retention-days: 14
      - name: Create one GitHub-signed generated-evidence commit
        id: commit
        shell: python
        run: |
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          matrix = Path('docs/ecosystem-stage-matrix.json').read_bytes()
          query = '''
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid url }
            }
          }
          '''
          variables = {
              'input': {
                  'branch': {
                      'repositoryNameWithOwner': os.environ['GITHUB_REPOSITORY'],
                      'branchName': os.environ['HEAD_BRANCH'],
                  },
                  'message': {
                      'headline': 'docs(ecosystem): refresh generated stage matrix',
                      'body': (
                          'Regenerate the stage matrix from the reviewed readiness, '
                          'theorem-runtime, and Hugging Face manifests.\n\n'
                          'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
                      ),
                  },
                  'expectedHeadOid': os.environ['EXPECTED_HEAD'],
                  'fileChanges': {
                      'additions': [{
                          'path': 'docs/ecosystem-stage-matrix.json',
                          'contents': base64.b64encode(matrix).decode('ascii'),
                      }],
                  },
              },
          }
          request = urllib.request.Request(
              'https://api.github.com/graphql',
              data=json.dumps({'query': query, 'variables': variables}).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'a11oy-stage-matrix-refresh/1',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.loads(response.read())
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode('utf-8', errors='replace')[:4000]
              print(f'GraphQL HTTP {exc.code}: {detail}')
              raise SystemExit(1) from exc
          if payload.get('errors'):
              print(json.dumps(payload['errors'], indent=2))
              raise SystemExit(1)
          commit = payload['data']['createCommitOnBranch']['commit']
          print(json.dumps(commit, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"sha={commit['oid']}\n")
      - name: Verify exact branch head and signed commit
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          observed="$(gh api "repos/$GITHUB_REPOSITORY/branches/$HEAD_BRANCH" --jq .commit.sha)"
          test "$observed" = "$COMMIT_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq .commit.verification.verified)" = 'true'
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq .commit.verification.reason)" = 'valid'
