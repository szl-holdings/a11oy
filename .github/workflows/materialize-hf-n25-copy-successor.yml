name: Materialize HF N25 COPY successor

on:
  push:
    branches:
      - ops/hf-n25-copy-successor-materializer-20260829
    paths:
      - ops/hf_n25_copy_successor_materializer.py
      - ops/hf_n25_copy_successor_postpatch.py
      - .github/workflows/materialize-hf-n25-copy-successor.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: materialize-hf-n25-copy-successor
  cancel-in-progress: false

env:
  TARGET_BRANCH: fix/hf-n25-copy-successor-20260829
  TARGET_BASE: 3eea2d39482790e50919b1c168bb4c5fa1334592
  HELPER_ONE: ops/hf_n25_copy_successor_materializer.py
  HELPER_TWO: ops/hf_n25_copy_successor_postpatch.py

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout exact clean successor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable target identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_BASE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$TARGET_BASE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$TARGET_BASE"

      - name: Fetch and apply reviewed inert materializers
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${HELPER_ONE}?ref=${GITHUB_SHA}" \
            > /tmp/hf_n25_copy_successor_materializer.py
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${HELPER_TWO}?ref=${GITHUB_SHA}" \
            > /tmp/hf_n25_copy_successor_postpatch.py
          python3 -m py_compile \
            /tmp/hf_n25_copy_successor_materializer.py \
            /tmp/hf_n25_copy_successor_postpatch.py
          python3 /tmp/hf_n25_copy_successor_materializer.py
          python3 /tmp/hf_n25_copy_successor_postpatch.py

      - name: Validate exact source and deployment contract
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-paths <<'EOF'
          .github/scripts/verify_hf_candidate_admission.py
          Dockerfile
          tests/test_verify_hf_candidate_admission.py
          tests/test_verify_hf_n25_copy_admission.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          git diff --name-only | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --check
          git diff --exit-code -- a11oy_n25_organs.py

          python3 -m py_compile \
            .github/scripts/verify_hf_candidate_admission.py \
            a11oy_n25_organs.py \
            tests/test_verify_hf_candidate_admission.py \
            tests/test_verify_hf_n25_copy_admission.py
          python3 -m unittest \
            tests.test_verify_hf_candidate_admission \
            tests.test_verify_hf_n25_copy_admission -v
          python3 .github/dockerfile-copy-check.py Dockerfile .
          python3 .github/scripts/copy_completeness.py
          python3 tools/check_copy_sync_lockstep.py .

      - name: Create one GitHub-native verified DCO commit
        shell: bash
        run: |
          set -euo pipefail
          export MATERIALIZE_REPOSITORY="$GITHUB_REPOSITORY"
          export MATERIALIZE_BRANCH="$TARGET_BRANCH"
          export MATERIALIZE_BASE="$TARGET_BASE"
          export MATERIALIZE_TOKEN="$GH_TOKEN"
          python3 - /tmp/materialize-result.json <<'PY'
          import base64
          import json
          import os
          import pathlib
          import sys
          import urllib.error
          import urllib.request

          output = pathlib.Path(sys.argv[1])
          repository = os.environ["MATERIALIZE_REPOSITORY"]
          branch = os.environ["MATERIALIZE_BRANCH"]
          base_sha = os.environ["MATERIALIZE_BASE"]
          token = os.environ["MATERIALIZE_TOKEN"]
          paths = [
              ".github/scripts/verify_hf_candidate_admission.py",
              "Dockerfile",
              "tests/test_verify_hf_candidate_admission.py",
              "tests/test_verify_hf_n25_copy_admission.py",
          ]
          additions = []
          for rel in paths:
              data = pathlib.Path(rel).read_bytes()
              additions.append(
                  {
                      "path": rel,
                      "contents": base64.b64encode(data).decode("ascii"),
                  }
              )

          mutation = """
          mutation MaterializeN25Copy($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid url }
            }
          }
          """
          variables = {
              "input": {
                  "branch": {
                      "repositoryNameWithOwner": repository,
                      "branchName": branch,
                  },
                  "expectedHeadOid": base_sha,
                  "message": {
                      "headline": "fix(hf): land N25 module COPY before runtime relock",
                      "body": (
                          "Add the exact a11oy_n25_organs.py Dockerfile COPY line and "
                          "its protected admission successor before the N1-N25 runtime "
                          "relock PR is refreshed. The module bytes are unchanged.\n\n"
                          "No protected-main write, force push, provider mutation, "
                          "secret read, or guard bypass.\n\n"
                          "Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>"
                      ),
                  },
                  "fileChanges": {"additions": additions},
              }
          }
          payload = json.dumps(
              {"query": mutation, "variables": variables}
          ).encode("utf-8")
          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "szl-hf-n25-copy-materializer",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"GitHub GraphQL HTTP {exc.code}") from exc
          if result.get("errors"):
              messages = [
                  str(row.get("message", "GraphQL error"))
                  for row in result["errors"]
              ]
              raise SystemExit("; ".join(messages)[:1000])
          commit = (
              ((result.get("data") or {}).get("createCommitOnBranch") or {})
              .get("commit")
              or {}
          )
          oid = str(commit.get("oid") or "")
          if len(oid) != 40 or any(ch not in "0123456789abcdef" for ch in oid):
              raise SystemExit("GitHub did not return a valid commit OID")
          output.write_text(
              json.dumps(
                  {"commit_oid": oid, "url": commit.get("url")},
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

          commit_sha="$(jq -er '.commit_oid' /tmp/materialize-result.json)"
          commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${commit_sha}")"
          jq -e '.commit.verification.verified == true' <<<"$commit_json" >/dev/null
          test "$(jq -er '.parents | length' <<<"$commit_json")" = "1"
          test "$(jq -er '.parents[0].sha' <<<"$commit_json")" = "$TARGET_BASE"
          grep -Eq '^Signed-off-by: .+ <[^>]+>$' \
            <<<"$(jq -r '.commit.message' <<<"$commit_json")"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$commit_sha"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$TARGET_BASE"

          {
            echo '### HF N25 COPY successor materialized'
            echo "- base: \`$TARGET_BASE\`"
            echo "- branch: \`$TARGET_BRANCH\`"
            echo "- commit: \`$commit_sha\`"
            echo '- GitHub signature: verified'
            echo '- N25 source bytes changed: false'
            echo '- protected-main writes: 0'
          } >>"$GITHUB_STEP_SUMMARY"
