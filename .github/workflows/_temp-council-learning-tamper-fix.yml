name: Temporary Council outcome-verification repair

on:
  push:
    branches:
      - feat/council-kernel-v0.6.0-20260817
    paths:
      - .github/workflows/_temp-council-learning-tamper-fix.yml

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.actor == 'stephenlutar2-hash' &&
      github.ref == 'refs/heads/feat/council-kernel-v0.6.0-20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind checkout to event head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Repair complete-record outcome verification
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/council-kernel/src/a11oy_council/learning.py')
          text = path.read_text(encoding='utf-8')
          old = '''    return hmac.compare_digest(expected.evaluation_digest, evaluation.evaluation_digest)'''
          new = '''    expected_record = canonical_json(expected.canonical_dict())
              provided_record = canonical_json(evaluation.canonical_dict())
              return hmac.compare_digest(expected_record, provided_record)'''.replace('              ', '    ')
          if text.count(old) != 1:
              raise SystemExit(f'expected one verification return, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Prove focused and full Council contracts
        env:
          PYTHONPATH: packages/council-kernel/src
        run: |
          python -m compileall -q packages/council-kernel/src packages/council-kernel/tests
          python -m unittest packages/council-kernel/tests/test_learning.py -v
          python -m unittest discover -s packages/council-kernel/tests -v
          git diff --check

      - name: Commit repaired kernel source
        shell: bash
        run: |
          set -euo pipefail
          git add packages/council-kernel/src/a11oy_council/learning.py
          test "$(git diff --cached --name-only)" = 'packages/council-kernel/src/a11oy_council/learning.py'
          git config user.name 'Stephen Lutar'
          git config user.email 'stephenlutar2@gmail.com'
          git commit \
            -m 'fix(council): bind outcome verification to full record' \
            -m 'Reject state, reason, observation, contract, timestamp, or digest tampering by comparing the complete canonical evaluation record against a deterministic recomputation.' \
            -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:feat/council-kernel-v0.6.0-20260817
