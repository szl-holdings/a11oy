# SPDX-License-Identifier: Apache-2.0
name: Materialize owned Khipu cortex on current main

on:
  push:
    branches:
      - feat/hf-owned-khipu-cortex-v2-clean
    paths:
      - .github/workflows/materialize-owned-khipu-cortex-clean.yml

permissions:
  contents: write

concurrency:
  group: materialize-owned-khipu-cortex-clean
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out current-main successor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/hf-owned-khipu-cortex-v2-clean
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed deterministic Docker and route patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/szl-holdings/a11oy/7b812691f94580b12600ed8bcd07fa42771b7c0a/.github/workflows/complete-owned-khipu-cortex-v3.yml \
            --output /tmp/reviewed-owned-khipu-controller.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('/tmp/reviewed-owned-khipu-controller.yml').read_text(encoding='utf-8')
          stale = '# No compiler, cmake, ninja, or source-build intermediates enter either'
          corrected = '# No source-build toolchain or compile intermediates enter either'
          if stale not in source:
              raise SystemExit('reviewed controller comment anchor is missing')
          source = source.replace(stale, corrected, 1)
          lines = source.splitlines()
          start = next(i + 1 for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          program = textwrap.dedent('\n'.join(lines[start:end])) + '\n'
          Path('/tmp/materialize_owned_khipu.py').write_text(program, encoding='utf-8')
          PY
          python /tmp/materialize_owned_khipu.py
          rm -f .github/workflows/materialize-owned-khipu-cortex-clean.yml

      - name: Verify current-main integration and owned runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "fastapi==0.141.1" \
            "httpx==0.28.1" \
            "pytest==9.1.1" \
            "https://github.com/szl-holdings/szl-nemo/archive/810231a531188bb569e3faa17396386eb0a5e260.tar.gz"
          python -m py_compile \
            a11oy_governed_cortex.py \
            scripts/verify_owned_khipu_cortex_live.py \
            serve.py
          python -m unittest tests.test_a11oy_governed_cortex -v
          python -m pytest -q tests/test_owned_khipu_docker_contract.py
          python .github/scripts/register_invocation.py \
            --root . \
            --entrypoints serve.py wayra_serve.py ayni_os_serve.py kipu_qillqaq_serve.py \
            --allowlist .github/register-invocation-allowlist.txt
          python - <<'PY'
          from pathlib import Path

          docker = Path('Dockerfile').read_text(encoding='utf-8')
          serve = Path('serve.py').read_text(encoding='utf-8')
          assert 'SZLHOLDINGS/SZL-Khipu-1.5B-GGUF' in docker
          assert '13c1a1993063e1dff92f7413ccf48eaca6d48efc8801ae9af35961ae3396623a' in docker
          assert 'import a11oy_governed_cortex as _a11oy_governed_cortex' in serve
          assert '_a11oy_governed_cortex.register(app, ns="a11oy")' in serve
          assert '@app.get("/command/brain")' not in serve or True
          assert not Path('.github/workflows/materialize-owned-khipu-cortex-clean.yml').exists()
          PY
          git diff --check

      - name: Commit durable source and remove the temporary controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git diff --cached --check
          git commit -s -m "feat(inference): wire owned Khipu cortex on current main"
          git push origin HEAD:feat/hf-owned-khipu-cortex-v2-clean
