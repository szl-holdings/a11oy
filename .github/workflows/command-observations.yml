name: Command observation contract

on:
  pull_request:
    paths:
      - pages/command-v2.html
      - console/assets/szl/**
      - scripts/preview_command_observations.py
      - tests/test_command_observations.cjs
      - tests/test_command_preview.py
      - .github/workflows/command-observations.yml
  push:
    branches: [main]
    paths:
      - pages/command-v2.html
      - console/assets/szl/**
      - scripts/preview_command_observations.py
      - tests/test_command_observations.cjs
      - tests/test_command_preview.py
      - .github/workflows/command-observations.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observations:
    name: Read-only source observation regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: node --test tests/test_command_observations.cjs
      - run: python -m unittest discover -s tests -p test_command_preview.py -v
