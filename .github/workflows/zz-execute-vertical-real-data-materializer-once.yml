# SPDX-License-Identifier: Apache-2.0
name: Execute reviewed vertical real-data materializer once

on:
  push:
    branches:
      - feat/vertical-real-data-bindings-v1
    paths:
      - .github/workflows/zz-execute-vertical-real-data-materializer-once.yml

permissions:
  contents: write

concurrency:
  group: execute-vertical-real-data-materializer-once
  cancel-in-progress: false

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/vertical-real-data-bindings-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Extract and execute the reviewed materialization body
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('.github/workflows/zz-materialize-vertical-real-data-bindings-v2-once.yml')
          text = source_path.read_text(encoding='utf-8')
          step = '      - name: Reset to current main and build permanent source\n'
          run_marker = '        run: |\n'
          step_start = text.index(step)
          body_start = text.index(run_marker, step_start) + len(run_marker)
          next_step = text.find('\n      - name:', body_start)
          body_end = len(text) if next_step < 0 else next_step
          raw_lines = text[body_start:body_end].splitlines()
          if not raw_lines or any(line and not line.startswith('          ') for line in raw_lines):
              raise SystemExit('materializer body indentation contract failed')
          body = '\n'.join(line[10:] if line else '' for line in raw_lines) + '\n'
          if not body.startswith('set -euo pipefail\n'):
              raise SystemExit('materializer body start contract failed')
          required = (
              'git reset --hard origin/main',
              'scripts/hf_publish_vertical_flagships_v2.py',
              'tests/test_hf_vertical_real_data_bindings.py',
              'scripts/verify_vertical_real_data_spaces.py',
              'docs/VERTICAL_REAL_DATA_BINDINGS.md',
          )
          missing = [item for item in required if item not in body]
          if missing:
              raise SystemExit(f'materializer body missing required operations: {missing}')
          Path('/tmp/vertical-real-data-materialize.sh').write_text(body, encoding='utf-8')
          PY
          bash /tmp/vertical-real-data-materialize.sh
