# SPDX-License-Identifier: Apache-2.0
name: Forge governed inference release recovery

on:
  push:
    branches:
      - ops/forge-inference-hf-auth-probe-20260904
    paths:
      - .github/workflows/forge-inference-hf-auth-probe.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: forge-governed-inference-release-recovery
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact Forge source and retain live proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      FORGE_REVISION: 9b1f8ae75da2075d5a45997b9a19b17b799e1f65
      SPACE_REPO: SZLHOLDINGS/szl-model-inference-lab
      MODEL_REPO: SZLHOLDINGS/SZL-Khipu-1.5B-GGUF
      SPACE_ORIGIN: https://szlholdings-szl-model-inference-lab.hf.space
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact governed Forge source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/szl-forge
          ref: ${{ env.FORGE_REVISION }}
          path: forge
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git -C forge rev-parse HEAD)"
          test "$observed" = "$FORGE_REVISION"
          test "$(git -C forge status --porcelain)" = ""

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact publication and verification clients
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface-hub==1.23.0"
          "requests==2.32.5"
          "cryptography==49.0.0"
          "pytest==9.1.1"

      - name: Re-run canonical offline publication contracts
        shell: bash
        run: |
          set -euo pipefail
          cd forge
          PYTHONPATH=tools python tools/test_publish_hf_space.py
          PYTHONPATH=tools python tools/test_publish_model_source_bindings.py
          python -m pytest -q \
            tests/test_acquire_hf_publisher_token.py \
            tests/test_governed_live_verifier_entrypoint.py
          python -m py_compile \
            tools/acquire_hf_publisher_token.py \
            tools/publish_hf_space.py \
            tools/publish_model_source_bindings.py \
            tools/run_governed_live_verifier.py \
            spaces/szl-model-inference-lab/verify_governed_live.py

      - name: Acquire actively validated Space publisher credential
        shell: bash
        env:
          HF_ORG_TOKEN_CANDIDATE: ${{ secrets.HF_ORG_TOKEN }}
          HF_WRITE_TOKEN_CANDIDATE: ${{ secrets.HF_WRITE_TOKEN }}
          HF_TOKEN_CANDIDATE: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN_CANDIDATE: ${{ secrets.HUGGINGFACE_TOKEN }}
          HUGGING_FACE_HUB_TOKEN_CANDIDATE: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p forge/reports
          python forge/tools/acquire_hf_publisher_token.py \
            --target-repo "$SPACE_REPO" \
            --target-type space \
            --oidc-resource "spaces/$SPACE_REPO" \
            --allow-create \
            --github-env "$GITHUB_ENV" \
            --report forge/reports/hf-space-publisher-credential.json

      - name: Create or recover Space, publish exact source, and attest RUNNING
        shell: bash
        run: |
          set -euo pipefail
          cd forge
          python tools/publish_hf_space.py \
            --source-dir spaces/szl-model-inference-lab \
            --repo-id "$SPACE_REPO" \
            --source-revision "$FORGE_REVISION" \
            --publish \
            --clear-space-volumes \
            --wait-seconds 1800 \
            --smoke-path /live \
            --smoke-path /health \
            --smoke-path /api/build-info \
            --smoke-path /api/v1/identity \
            --smoke-path /api/v2/governed-health \
            --smoke-path /.well-known/szl-inference-contract.json \
            --smoke-path /.well-known/szl-governed-inference-contract.json \
            --smoke-path /v1/models \
            --report reports/model-inference-lab-publication.json

      - name: Exercise live Brain, Forge, Nemo, Formula, and Anatomy path
        shell: bash
        run: |
          set -euo pipefail
          cd forge
          python tools/run_governed_live_verifier.py \
            --script spaces/szl-model-inference-lab/verify_governed_live.py \
            --base-url "$SPACE_ORIGIN" \
            --expected-source-revision "$FORGE_REVISION" \
            --report reports/governed-space-live-verification.json

      - name: Acquire actively validated model publisher credential
        shell: bash
        env:
          HF_ORG_TOKEN_CANDIDATE: ${{ secrets.HF_ORG_TOKEN }}
          HF_WRITE_TOKEN_CANDIDATE: ${{ secrets.HF_WRITE_TOKEN }}
          HF_TOKEN_CANDIDATE: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN_CANDIDATE: ${{ secrets.HUGGINGFACE_TOKEN }}
          HUGGING_FACE_HUB_TOKEN_CANDIDATE: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          set -euo pipefail
          python forge/tools/acquire_hf_publisher_token.py \
            --target-repo "$MODEL_REPO" \
            --target-type model \
            --github-env "$GITHUB_ENV" \
            --report forge/reports/hf-model-publisher-credential.json

      - name: Publish and read back exact model-source bindings
        shell: bash
        run: |
          set -euo pipefail
          cd forge
          python tools/publish_model_source_bindings.py \
            --source-revision "$FORGE_REVISION" \
            --expected-runtime-source-revision "$FORGE_REVISION" \
            --publish \
            --report reports/model-source-bindings.json

      - name: Print secret-free release proof summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("forge/reports")
          publication = json.loads(
              (root / "model-inference-lab-publication.json").read_text()
          )
          live = json.loads(
              (root / "governed-space-live-verification.json").read_text()
          )
          bindings = json.loads(
              (root / "model-source-bindings.json").read_text()
          )
          print(
              json.dumps(
                  {
                      "space_repository_state": publication[
                          "repository_reconciliation"
                      ]["state"],
                      "space_runtime_stage": publication["live"][
                          "runtime_stage"
                      ],
                      "source_revision": publication["live"][
                          "source_revision"
                      ],
                      "governed_live_state": live["state"],
                      "receipt_sha256": live["evidence"]["receipt_sha256"],
                      "claims_sha256": live["evidence"]["claims_sha256"],
                      "citations_sha256": live["evidence"][
                          "citations_sha256"
                      ],
                      "model_bindings_ok": bindings["ok"],
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Upload immutable secret-free release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-governed-inference-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            forge/reports/hf-space-publisher-credential.json
            forge/reports/model-inference-lab-publication.json
            forge/reports/governed-space-live-verification.json
            forge/reports/hf-model-publisher-credential.json
            forge/reports/model-source-bindings.json
          if-no-files-found: warn
          retention-days: 180
