name: temporary-stage-matrix-refresh-1543

on:
  push:
    branches:
      - fix/hf-space-source-map-refresh-20260830
    paths:
      - .github/workflows/temporary-stage-matrix-refresh-1543.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-space-source-map-refresh-20260830
          fetch-depth: 0
          persist-credentials: true

      - name: Regenerate and verify the ecosystem stage matrix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          python3 scripts/build_ecosystem_stage_matrix.py
          python3 scripts/build_ecosystem_stage_matrix.py --check
          rm .github/workflows/temporary-stage-matrix-refresh-1543.yml
          git add docs/ecosystem-stage-matrix.json .github/workflows/temporary-stage-matrix-refresh-1543.yml
          git diff --cached --check
          git commit \
            -m "fix(hf): refresh generated ecosystem stage matrix" \
            -m "Signed-off-by: Stephen P. Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:refs/heads/fix/hf-space-source-map-refresh-20260830
