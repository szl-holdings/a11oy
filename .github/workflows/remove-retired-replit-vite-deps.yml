name: Remove retired Replit Vite dependencies

on:
  push:
    branches:
      - refactor/remove-retired-replit-vite-deps-20260903
    paths:
      - .github/workflows/remove-retired-replit-vite-deps.yml
      - scripts/maintenance/retire_replit_vite.py
      - organs/sentra/stubs/platform-registry/index.ts
      - organs/sentra/stubs/design-system/index.ts

permissions:
  contents: write

concurrency:
  group: remove-retired-replit-vite-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove dead dependencies and build Sentra offline
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Activate pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          test "$(pnpm --version)" = "10.26.1"

      - name: Prove retired plugins are not active
        shell: bash
        run: |
          set -euo pipefail
          for config in web/vite.config.ts organs/sentra/web/vite.config.ts; do
            if grep -Eq '@replit/vite-plugin-|REPL_ID|runtimeErrorOverlay|cartographer|devBanner' "$config"; then
              echo "::error file=${config}::Retired Replit plugin code is still active"
              exit 1
            fi
          done

      - name: Prepare deterministic retirement migration
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/maintenance/retire_replit_vite.py
          python scripts/maintenance/retire_replit_vite.py

      - name: Install self-contained Sentra workspace
        shell: bash
        env:
          NODE_AUTH_TOKEN: ""
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
        run: |
          set -euo pipefail
          pnpm --dir organs/sentra install --lockfile=false --ignore-scripts

      - name: Build and test Sentra offline
        shell: bash
        env:
          NODE_AUTH_TOKEN: ""
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
        run: |
          set -euo pipefail
          pnpm --dir organs/sentra build:offline
          pnpm --dir organs/sentra test:offline

      - name: Verify complete dependency and contract repair
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n '@replit/vite-plugin-' -- \
            web/package.json \
            web/vite.config.ts \
            organs/sentra/web/package.json \
            organs/sentra/web/vite.config.ts \
            organs/sentra/pnpm-workspace.yaml
          then
            echo '::error::Retired Replit Vite plugin references remain in cleaned inputs'
            exit 1
          fi
          grep -Fq 'export function useStandardQuery' organs/sentra/stubs/api-client-react/index.ts
          grep -Fq 'export function useStandardMutation' organs/sentra/stubs/api-client-react/index.ts
          grep -Fq '"@tanstack/react-query": "catalog:"' organs/sentra/stubs/api-client-react/package.json
          grep -Fq 'export const OperationalOwnerChip' organs/sentra/stubs/shared-ui/index.ts
          grep -Fq 'export const OperationalAuditTimeline' organs/sentra/stubs/shared-ui/index.ts
          grep -Fq 'export function makeClaimResolver' organs/sentra/stubs/platform-registry/index.ts
          grep -Fq 'export function metricDisplay' organs/sentra/stubs/platform-registry/index.ts
          grep -Fq 'export const productAccent' organs/sentra/stubs/design-system/index.ts
          grep -Fq 'export const EvalBadge' organs/sentra/stubs/design-system/index.ts
          grep -Fq 'export const LeaderboardTable' organs/sentra/stubs/design-system/index.ts
          git diff --check
          git status --short

      - name: Commit production diff and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add \
            web/package.json \
            organs/sentra/web/package.json \
            organs/sentra/pnpm-workspace.yaml \
            organs/sentra/stubs/api-client-react/index.ts \
            organs/sentra/stubs/api-client-react/package.json \
            organs/sentra/stubs/shared-ui/index.ts
          git rm \
            .github/workflows/remove-retired-replit-vite-deps.yml \
            scripts/maintenance/retire_replit_vite.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::The retirement migration produced no tracked production changes'
            exit 1
          fi
          git commit -s -m "fix(build): retire Replit Vite dependencies and restore Sentra offline contracts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
