name: Materialize bounded Terra DOB repair once

on:
  push:
    branches: [fix/terra-dob-recent-valid-20260905]
    paths: [.github/workflows/repair-terra-dob-once.yml]

permissions:
  contents: write

concurrency:
  group: repair-terra-dob-recent-valid-20260905
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/fix/terra-dob-recent-valid-20260905' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact isolated repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply only the exact reviewed function replacement
        shell: bash
        run: |
          set -euo pipefail
          python -S - <<'PY'
          import ast
          import hashlib
          from pathlib import Path
          path = Path('a11oy_vertical_feeds.py')
          raw = path.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if blob != '9db28769da510a54025836f06dd53f7c16436828':
              raise SystemExit('Source changed; refusing to overwrite concurrent work')
          candidate = Path('scripts/repair_terra_dob_function.txt').read_bytes()
          if hashlib.sha256(candidate).hexdigest() != 'df8abee1b24b863cc7f87b65251246de143f612075256c0d89fba39a17f1e485':
              raise SystemExit('Candidate integrity mismatch')
          source = raw.decode('utf-8')
          nodes = [n for n in ast.parse(source).body if isinstance(n, ast.FunctionDef) and n.name == 'feed_nyc_dob']
          if len(nodes) != 1:
              raise SystemExit('Function identity is ambiguous')
          node = nodes[0]
          lines = source.splitlines(keepends=True)
          lines[node.lineno - 1:node.end_lineno] = [candidate.decode('utf-8')]
          updated = ''.join(lines)
          compile(updated, str(path), 'exec')
          path.write_text(updated, encoding='utf-8')
          print('Applied one source function; no provider access or production mutation')
          PY
          python -S -m unittest discover -s tests -p test_nyc_dob_recent_source.py -v
          git diff --check
      - name: Remove the one-use materializer and fast-forward only its repair branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/terra-dob-recent-valid-20260905
          observed="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$observed" = "$EXPECTED_HEAD"
          rm scripts/repair_terra_dob_function.txt .github/workflows/repair-terra-dob-once.yml
          git add -- a11oy_vertical_feeds.py scripts/repair_terra_dob_function.txt .github/workflows/repair-terra-dob-once.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(terra): serve calendar-valid newest DOB records'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
