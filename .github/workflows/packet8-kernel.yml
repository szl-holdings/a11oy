name: Packet 8 Decision Integrity Kernel

on:
  pull_request:
    paths:
      - 'verticals/**'
      - '.github/workflows/packet8-kernel.yml'
  push:
    branches: [main]
    paths:
      - 'verticals/**'
      - '.github/workflows/packet8-kernel.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  kernel:
    name: Evaluate frozen Packet 8 vertical cases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run kernel unit tests
        run: python -m unittest -v verticals/_kernel/test_a11oy_kernel.py
