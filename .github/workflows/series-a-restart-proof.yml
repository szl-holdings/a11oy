name: Series-A Restart Durability Proof

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current protected-main source SHA to prove
        required: true
        type: string
      origin:
        description: Credential-free canonical runtime origin
        required: true
        default: https://szlholdings-a11oy.hf.space
        type: string

permissions:
  contents: read

concurrency:
  group: series-a-restart-proof
  cancel-in-progress: false

jobs:
  restart-proof:
    name: Restart and prove persistent signer, database, and receipt chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      ORIGIN: ${{ inputs.origin }}
      PROOF_PATH: /tmp/series-a-restart-proof.json
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Bind requested source to current protected main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_sha must be an exact lowercase 40-character SHA"
            exit 1
          }
          observed="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$observed" != "$SOURCE_SHA" ]; then
            echo "::error::protected main moved: expected $SOURCE_SHA, observed $observed"
            exit 1
          fi

      - name: Install exact restart-proof clients
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.23.0"

      - name: Restart stalled canonical runtime and prove recovery
        run: >-
          python scripts/prove_hf_series_a_restart.py
          --repo-id "SZLHOLDINGS/a11oy"
          --origin "$ORIGIN"
          --source-sha "$SOURCE_SHA"
          --output "$PROOF_PATH"

      - name: Upload immutable restart proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: series-a-restart-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROOF_PATH }}
          if-no-files-found: error
          retention-days: 90
