# SPDX-License-Identifier: Apache-2.0
name: Materialize runtime boundary current-main successor once

on:
  push:
    branches:
      - fix/runtime-boundary-current-main-20260905
    paths:
      - .github/workflows/_materialize_runtime_boundary_current_main_once.yml

permissions:
  contents: write

concurrency:
  group: materialize-runtime-boundary-current-main-once
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/fix/runtime-boundary-current-main-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact clean branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/runtime-boundary-current-main-20260905
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - name: Port only reviewed functional files from superseded PR 1994
        shell: bash
        run: |
          set -euo pipefail
          source_head=de1b8b15f3f5b51f2a3bfb82fc51f8be97d1b395
          git fetch --no-tags origin "$source_head"
          git cat-file -e "$source_head^{commit}"
          git checkout "$source_head" -- \
            audit/POST_MERGE_1986_REVIEW_REPAIR_2026-09-05.md \
            src/pages/Ouroboros.tsx \
            szl_agentic_loop.py \
            szl_immune.py \
            tests/test_post_merge_1986_review_repairs.py
          python scripts/_materialize_runtime_boundary_successor.py

      - name: Prove the focused runtime and receipt boundaries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'fastapi==0.116.1' \
            'httpx==0.28.1' \
            'pytest==9.0.2' \
            'cryptography==46.0.3'
          python -m py_compile \
            szl_agentic_loop.py \
            szl_immune.py \
            tests/test_post_merge_1986_review_repairs.py \
            tests/test_runtime_boundary_fallback_attribution.py
          python -m pytest -q \
            tests/test_post_merge_1986_review_repairs.py \
            tests/test_runtime_boundary_fallback_attribution.py
          manifest_sha="$(sha256sum .github/shared-source-payload-manifest.json | cut -d' ' -f1)"
          python .github/validate-shared-payload.py . . \
            --expected-manifest-sha256="$manifest_sha"
          git diff --check

      - name: Commit only permanent successor files and self-remove
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/runtime-boundary-current-main-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git rm -- \
            .github/workflows/_materialize_runtime_boundary_current_main_once.yml \
            scripts/_materialize_runtime_boundary_successor.py
          git add -- \
            .github/shared-source-payload-manifest.json \
            audit/POST_MERGE_1986_REVIEW_REPAIR_2026-09-05.md \
            src/pages/Ouroboros.tsx \
            szl_agentic_loop.py \
            szl_immune.py \
            tests/test_post_merge_1986_review_repairs.py \
            tests/test_runtime_boundary_fallback_attribution.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'fix(runtime): close reviewed boundary gaps on current main'
          git push origin "HEAD:refs/heads/$branch"
