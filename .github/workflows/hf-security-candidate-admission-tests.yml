name: HF protected security-input admission tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/select_hf_candidate_admission.py
      - .github/scripts/verify_hf_security_candidate_admission.py
      - tests/test_hf_security_candidate_admission.py
      - .github/workflows/hf-security-candidate-admission-tests.yml
  push:
    branches:
      - fix/hf-security-input-admission-bootstrap-20260830
    paths:
      - .github/scripts/select_hf_candidate_admission.py
      - .github/scripts/verify_hf_security_candidate_admission.py
      - tests/test_hf_security_candidate_admission.py
      - .github/workflows/hf-security-candidate-admission-tests.yml

permissions:
  contents: read

jobs:
  security-successor-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile protected-base authorities
        run: |
          python -m py_compile \
            .github/scripts/select_hf_candidate_admission.py \
            .github/scripts/verify_hf_security_candidate_admission.py

      - name: Run fail-closed successor and selector regressions
        run: python -m unittest tests.test_hf_security_candidate_admission -v
