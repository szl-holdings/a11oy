# SPDX-License-Identifier: Apache-2.0
# Manual capture only. The Space must already be PAUSED or RUNTIME_ERROR under
# an independently reviewed maintenance action. This workflow never pauses,
# resumes, restarts, deploys, restores, or overwrites the original databases.
# A verified private capture still leaves restore/deployment BLOCKED until the
# bucket-mounted SQLite storage contract is qualified in a separate change.
name: Preserve stopped A11oy private stores

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact current protected main SHA; stopped Space required
        required: true
        type: string

permissions:
  contents: read

# The canonical publisher and this private capture cannot write concurrently.
concurrency:
  group: sync-relock-canonical-a11oy
  cancel-in-progress: false

jobs:
  preserve:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == inputs.expected_source_sha && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact requested main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use pinned Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: '3.12'
      - name: Require exact protected current main before private credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = szl-holdings/a11oy
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" |
            python3 -c 'import json, os, sys; b=json.load(sys.stdin); sys.exit(0 if b.get("name")=="main" and b.get("protected") is True and b.get("commit",{}).get("sha")==os.environ["GITHUB_SHA"] else 1)'
      - name: Install exact reviewed private bucket SDK
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'huggingface_hub==1.23.0'
      - name: Capture stopped originals into private bucket only
        id: capture
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          result=0
          python3 -B scripts/preserve_hf_gdw_store.py \
            --output "$RUNNER_TEMP/private-preservation-report.json" || result=$?
          printf 'exit_code=%s\n' "$result" >> "$GITHUB_OUTPUT"
      - name: Classify private readback into a public-safe blocked receipt
        env:
          PRESERVATION_EXIT_CODE: ${{ steps.capture.outputs.exit_code }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python3 -I -B scripts/classify_hf_private_store_preservation.py
          --report "$RUNNER_TEMP/private-preservation-report.json"
          --output "$RUNNER_TEMP/public-preservation-status.json"
          --expected-source-sha "$EXPECTED_SOURCE_SHA"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --preservation-exit-code "$PRESERVATION_EXIT_CODE"
      - name: Retain only the public-safe capture status
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-store-capture-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-preservation-status.json
          if-no-files-found: warn
          retention-days: 90
