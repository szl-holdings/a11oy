# SPDX-License-Identifier: Apache-2.0
name: Materialize estate census snapshot once

on:
  push:
    branches:
      - fix/estate-census-revision-consistency-20260905
    paths:
      - .github/workflows/_materialize_estate_census_snapshot_once.yml

permissions:
  contents: write

concurrency:
  group: materialize-estate-census-snapshot-once
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/fix/estate-census-revision-consistency-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact census branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/estate-census-revision-consistency-20260905
          fetch-depth: 1
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - name: Correct the authenticated estate census only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/strategy/living-command-fabric.v1.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          estate = value['estate']
          before = {
              key: estate[key]
              for key in (
                  'repository_count',
                  'active_repository_count',
                  'archived_repository_count',
                  'public_repository_count',
                  'private_repository_count',
              )
          }
          expected_before = {
              'repository_count': 117,
              'active_repository_count': 83,
              'archived_repository_count': 34,
              'public_repository_count': 117,
              'private_repository_count': 0,
          }
          if before != expected_before:
              raise SystemExit(f'estate census anchor changed: {before!r}')

          estate.update(
              repository_count=123,
              active_repository_count=89,
              archived_repository_count=34,
              public_repository_count=117,
              private_repository_count=6,
              census_method=(
                  'Authenticated GitHub installation inventory observed on 2026-09-05: '
                  '123 accessible organization repositories, comprising 117 public and '
                  '6 private repositories; 89 are active and 34 are archived. This is a '
                  'point-in-time source census for the connected installation.'
              ),
          )
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')

          test_path = Path('tests/test_estate_census_snapshot.py')
          test_path.write_text('''#!/usr/bin/env python3
          from __future__ import annotations

          import json
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          CONTRACT = ROOT / "docs" / "strategy" / "living-command-fabric.v1.json"
          EXPECTED = {
              "repository_count": 123,
              "active_repository_count": 89,
              "archived_repository_count": 34,
              "public_repository_count": 117,
              "private_repository_count": 6,
          }
          HISTORICAL_VERTICAL_SERVICES_REVISION = "83edba5c5e730c91d8f5f0a6531213fb860677af"
          CURRENT_VERTICAL_SERVICES_AUTHORITY = "895c4de2e8c07236c4adeabc7376ca5367b2b835"


          class EstateCensusSnapshotTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.value = json.loads(CONTRACT.read_text(encoding="utf-8"))

              def test_authenticated_snapshot_is_exact_and_arithmetic_closes(self) -> None:
                  estate = self.value["estate"]
                  self.assertEqual(
                      {key: estate[key] for key in EXPECTED},
                      EXPECTED,
                  )
                  self.assertEqual(
                      estate["repository_count"],
                      estate["active_repository_count"] + estate["archived_repository_count"],
                  )
                  self.assertEqual(
                      estate["repository_count"],
                      estate["public_repository_count"] + estate["private_repository_count"],
                  )
                  self.assertIn("Authenticated GitHub installation inventory", estate["census_method"])
                  self.assertIn("point-in-time", estate["census_method"])

              def test_current_authority_and_historical_strategy_pins_are_not_conflated(self) -> None:
                  self.assertEqual(
                      self.value["authorities"]["vertical_services"]["revision"],
                      CURRENT_VERTICAL_SERVICES_AUTHORITY,
                  )
                  self.assertEqual(
                      self.value["public_product_taxonomy"]["vertical_services_revision"],
                      HISTORICAL_VERTICAL_SERVICES_REVISION,
                  )
                  self.assertEqual(
                      self.value["intelligence_fabric"]["source_revision"],
                      HISTORICAL_VERTICAL_SERVICES_REVISION,
                  )


          if __name__ == "__main__":
              unittest.main()
          ''', encoding='utf-8')
          PY

      - name: Prove census and historical-pin boundaries
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tests/test_estate_census_snapshot.py \
            tests/test_estate_one_fabric_alignment.py \
            tests/test_living_command_fabric_frontdoor.py
          python tests/test_estate_census_snapshot.py
          python tests/test_estate_one_fabric_alignment.py
          python tests/test_living_command_fabric_frontdoor.py
          python -m json.tool docs/strategy/living-command-fabric.v1.json >/dev/null
          git diff --check

      - name: Commit only the reviewed census correction
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/estate-census-revision-consistency-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git add -- \
            docs/strategy/living-command-fabric.v1.json \
            tests/test_estate_census_snapshot.py
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            docs/strategy/living-command-fabric.v1.json \
            tests/test_estate_census_snapshot.py | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'fix(alignment): correct authenticated estate census'
          git push origin "HEAD:refs/heads/$branch"
