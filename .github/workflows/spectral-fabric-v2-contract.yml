name: Spectral Fabric v2 Contract

on:
  pull_request:
    branches:
    - main
    paths:
    - console/assets/szl-flow.js
    - console/assets/szl-flow.css
    - console/assets/szl-spectral-v2.css
    - docs/frontend-theme-registry-v2.json
    - docs/SZL_SPECTRAL_FABRIC_V2.md
    - tests/test_spectral_fabric_v2.py
    - .github/workflows/spectral-fabric-v2-contract.yml
  push:
    branches:
    - main
    paths:
    - console/assets/szl-flow.js
    - console/assets/szl-flow.css
    - console/assets/szl-spectral-v2.css
    - docs/frontend-theme-registry-v2.json
    - docs/SZL_SPECTRAL_FABRIC_V2.md
    - tests/test_spectral_fabric_v2.py
    - .github/workflows/spectral-fabric-v2-contract.yml
  workflow_dispatch: null
  merge_group:
    types:
    - checks_requested
    branches:
    - main
permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate JavaScript syntax
        run: node --check console/assets/szl-flow.js
      - name: Run offline Spectral Fabric contract
        run: python tests/test_spectral_fabric_v2.py
      - name: Verify JSON and whitespace integrity
        run: |
          python -m json.tool docs/frontend-theme-registry-v2.json >/dev/null
          git diff --check
