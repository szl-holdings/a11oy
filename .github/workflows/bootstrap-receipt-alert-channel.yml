name: Bootstrap receipt alert channel

on:
  push:
    branches:
      - fix/receipt-alert-dual-path-v1
    paths:
      - ".github/workflows/bootstrap-receipt-alert-channel.yml"

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: bootstrap-receipt-alert-channel-v1
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact alert candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/receipt-alert-dual-path-v1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the full local alert contract
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_receipt_alert_delivery.py
          python -m py_compile scripts/receipt_alert_delivery.py
          git diff --check

      - name: Resolve and bind the exact pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head fix/receipt-alert-dual-path-v1 \
            --json number,headRefOid,isDraft,baseRefName \
            --jq '.[] | select(.isDraft == false and .baseRefName == "main" and .headRefOid == "'"$GITHUB_SHA"'") | .number' | head -n1)"
          test -n "$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Wait for all independent exact-head checks
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          current_run = os.environ["GITHUB_RUN_ID"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "SZL-alert-promotion/1.0",
          }
          allowed = {"success", "neutral", "skipped"}
          failed = {
              "failure",
              "cancelled",
              "timed_out",
              "action_required",
              "startup_failure",
              "stale",
          }

          def get(path):
              request = urllib.request.Request(
                  "https://api.github.com" + path, headers=headers
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.loads(response.read())

          deadline = time.monotonic() + 28 * 60
          while time.monotonic() < deadline:
              checks = get(f"/repos/{repo}/commits/{sha}/check-runs?per_page=100").get("check_runs", [])
              statuses = get(f"/repos/{repo}/commits/{sha}/status").get("statuses", [])
              independent = [
                  row
                  for row in checks
                  if f"/actions/runs/{current_run}" not in str(row.get("details_url") or "")
              ]
              active = [
                  str(row.get("name") or row.get("id"))
                  for row in independent
                  if row.get("status") != "completed"
              ]
              failures = [
                  f"{row.get('name')}:{row.get('conclusion')}"
                  for row in independent
                  if row.get("status") == "completed"
                  and str(row.get("conclusion") or "").casefold() not in allowed
              ]
              status_active = [
                  str(row.get("context") or row.get("id"))
                  for row in statuses
                  if row.get("state") == "pending"
              ]
              status_failures = [
                  f"{row.get('context')}:{row.get('state')}"
                  for row in statuses
                  if row.get("state") in {"failure", "error"}
              ]
              if failures or status_failures:
                  raise SystemExit(
                      "independent alert checks failed: "
                      + ", ".join(failures + status_failures)
                  )
              if independent and not active and not status_active:
                  print(
                      json.dumps(
                          {
                              "head": sha,
                              "independent_checks": len(independent),
                              "legacy_statuses": len(statuses),
                              "result": "PASS",
                          },
                          sort_keys=True,
                      )
                  )
                  break
              print(
                  "waiting for independent checks:",
                  active + status_active or ["none observed yet"],
              )
              time.sleep(10)
          else:
              raise SystemExit("timed out waiting for independent exact-head checks")
          PY

      - name: Reject changes requested, unresolved threads, or head drift
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          current="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$current" = "$GITHUB_SHA"
          decision="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json reviewDecision --jq '.reviewDecision // ""')"
          test "$decision" != "CHANGES_REQUESTED"
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          unresolved="$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
            -f owner="$owner" \
            -f name="$name" \
            -F number="$PR_NUMBER" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          test "$unresolved" = "0"

      - name: Merge through ordinary protection at the exact head
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$GITHUB_SHA" \
            --subject "fix(alerts): make receipt delivery durable across GitHub and ntfy"
