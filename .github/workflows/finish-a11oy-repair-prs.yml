name: Finish exact-green A11oy repair PRs

on:
  push:
    branches:
      - ops/finish-live-now-20260904-v1
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: finish-exact-green-a11oy-repair-prs
  cancel-in-progress: false

jobs:
  finish:
    name: Refresh, verify, and squash-merge only PRs 1897 and 1900
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Finish the explicit repair allowlist without bypassing protection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from typing import Any

          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          PRS = [1897, 1900]
          SUCCESS = {"success", "neutral", "skipped"}
          TERMINAL_FAILURE = {
              "failure",
              "cancelled",
              "timed_out",
              "action_required",
              "startup_failure",
              "stale",
          }
          USER_AGENT = "SZL-Exact-Green-Repair-Finisher/1.0"

          def api(method: str, path: str, payload: dict[str, Any] | None = None) -> tuple[int, Any]:
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {TOKEN}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": USER_AGENT,
              }
              data = None
              if payload is not None:
                  data = json.dumps(payload, separators=(",", ":")).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  data=data,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read(3_000_000)
                      return response.status, json.loads(body.decode("utf-8")) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read(1_000_000)
                  try:
                      parsed = json.loads(body.decode("utf-8")) if body else None
                  except Exception:
                      parsed = None
                  return exc.code, parsed

          def pull(number: int) -> dict[str, Any]:
              status, payload = api("GET", f"/repos/{REPO}/pulls/{number}")
              if status != 200 or not isinstance(payload, dict):
                  raise RuntimeError(f"PR {number} read failed with HTTP {status}")
              return payload

          def check_state(sha: str) -> dict[str, Any]:
              _, checks = api("GET", f"/repos/{REPO}/commits/{sha}/check-runs?per_page=100")
              check_runs = (checks or {}).get("check_runs", []) if isinstance(checks, dict) else []
              _, combined = api("GET", f"/repos/{REPO}/commits/{sha}/status")
              statuses = (combined or {}).get("statuses", []) if isinstance(combined, dict) else []
              active: list[dict[str, Any]] = []
              failed: list[dict[str, Any]] = []
              passed: list[str] = []
              for row in check_runs:
                  if not isinstance(row, dict):
                      continue
                  item = {
                      "name": row.get("name"),
                      "status": row.get("status"),
                      "conclusion": row.get("conclusion"),
                      "url": row.get("html_url"),
                  }
                  if row.get("status") != "completed":
                      active.append(item)
                  elif str(row.get("conclusion") or "") in TERMINAL_FAILURE:
                      failed.append(item)
                  elif str(row.get("conclusion") or "") in SUCCESS:
                      passed.append(str(row.get("name")))
              for row in statuses:
                  if not isinstance(row, dict):
                      continue
                  state = str(row.get("state") or "")
                  item = {
                      "name": row.get("context"),
                      "status": state,
                      "conclusion": state,
                      "url": row.get("target_url"),
                  }
                  if state == "pending":
                      active.append(item)
                  elif state in {"failure", "error"}:
                      failed.append(item)
                  elif state == "success":
                      passed.append(str(row.get("context")))
              return {"active": active, "failed": failed, "passed": sorted(set(passed))}

          report: dict[str, Any] = {
              "schema": "szl.exact-green-pr-finisher/v1",
              "generated_at": dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z"),
              "repository": REPO,
              "allowlisted_prs": PRS,
              "results": [],
              "branch_protection_bypassed": False,
              "secret_values_recorded": False,
          }

          for number in PRS:
              row: dict[str, Any] = {"number": number, "steps": []}
              current = pull(number)
              if current.get("state") != "open":
                  row.update({
                      "result": "already-closed",
                      "merged": current.get("merged") is True,
                      "merged_at": current.get("merged_at"),
                  })
                  report["results"].append(row)
                  continue

              if current.get("draft") is True:
                  # GraphQL mutation is not used; REST has no ready-for-review endpoint.
                  row["steps"].append({"operation": "blocked", "reason": "PR_IS_DRAFT"})
                  row["result"] = "blocked-draft"
                  report["results"].append(row)
                  continue

              # Process one PR at a time. If the base moved, use GitHub's native
              # update-branch operation and let all checks run again.
              head_sha = str((current.get("head") or {}).get("sha") or "")
              base_sha = str((current.get("base") or {}).get("sha") or "")
              compare_status, compare = api(
                  "GET",
                  f"/repos/{REPO}/compare/{urllib.parse.quote(base_sha, safe='')}..."
                  f"{urllib.parse.quote(head_sha, safe='')}",
              )
              behind = int((compare or {}).get("behind_by") or 0) if compare_status == 200 else 0
              if behind > 0:
                  update_status, update_payload = api(
                      "PUT",
                      f"/repos/{REPO}/pulls/{number}/update-branch",
                      {"expected_head_sha": head_sha},
                  )
                  row["steps"].append({
                      "operation": "update-branch",
                      "http": update_status,
                      "previous_head": head_sha,
                      "behind_by": behind,
                  })
                  if update_status not in {200, 202}:
                      row["result"] = "update-branch-rejected"
                      report["results"].append(row)
                      continue
                  deadline = time.monotonic() + 10 * 60
                  while time.monotonic() < deadline:
                      updated = pull(number)
                      new_head = str((updated.get("head") or {}).get("sha") or "")
                      if new_head and new_head != head_sha:
                          current = updated
                          head_sha = new_head
                          break
                      time.sleep(5)

              # Wait for exact-head checks to become terminal. A run that never
              # materializes is not accepted as green.
              deadline = time.monotonic() + 25 * 60
              final_checks = {"active": [], "failed": [], "passed": []}
              while time.monotonic() < deadline:
                  current = pull(number)
                  if current.get("state") != "open":
                      break
                  observed_head = str((current.get("head") or {}).get("sha") or "")
                  if observed_head != head_sha:
                      head_sha = observed_head
                  final_checks = check_state(head_sha)
                  if final_checks["failed"]:
                      break
                  if not final_checks["active"] and final_checks["passed"]:
                      break
                  time.sleep(15)

              current = pull(number)
              if current.get("state") != "open":
                  row.update({
                      "result": "closed-during-wait",
                      "merged": current.get("merged") is True,
                      "merged_at": current.get("merged_at"),
                      "head_sha": head_sha,
                  })
                  report["results"].append(row)
                  continue

              row["checks"] = final_checks
              row["head_sha"] = head_sha
              if final_checks["failed"]:
                  row["result"] = "terminal-red"
                  report["results"].append(row)
                  continue
              if final_checks["active"] or not final_checks["passed"]:
                  row["result"] = "checks-not-terminal"
                  report["results"].append(row)
                  continue

              # Re-read exact head immediately before the protected merge.
              current = pull(number)
              exact_head = str((current.get("head") or {}).get("sha") or "")
              if exact_head != head_sha:
                  row["result"] = "head-moved-before-merge"
                  report["results"].append(row)
                  continue
              merge_status, merge_payload = api(
                  "PUT",
                  f"/repos/{REPO}/pulls/{number}/merge",
                  {
                      "sha": exact_head,
                      "merge_method": "squash",
                      "commit_title": f"{current.get('title')} (#{number})",
                      "commit_message": (
                          "Protected exact-head repair merge. Branch protection and "
                          "provider-native mergeability remain authoritative.\n\n"
                          "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
                      ),
                  },
              )
              row["steps"].append({
                  "operation": "squash-merge",
                  "http": merge_status,
                  "head_sha": exact_head,
              })
              row["result"] = "merged" if merge_status == 200 and (merge_payload or {}).get("merged") is True else "merge-rejected"
              row["merge_sha"] = (merge_payload or {}).get("sha") if isinstance(merge_payload, dict) else None
              row["merge_message"] = (merge_payload or {}).get("message") if isinstance(merge_payload, dict) else None
              report["results"].append(row)

          report["complete"] = all(
              item.get("result") in {"merged", "already-closed", "closed-during-wait"}
              and item.get("merged", True) is not False
              for item in report["results"]
          )
          Path("reports/exact-green-pr-finisher.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          if not report["complete"]:
              raise SystemExit(1)
          PY

      - name: Upload exact-head merge receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-green-a11oy-repair-prs-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/exact-green-pr-finisher.json
          if-no-files-found: error
          retention-days: 90
