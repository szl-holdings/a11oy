name: Emergency exact-source live convergence

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: emergency-exact-source-live-convergence
  cancel-in-progress: true

jobs:
  deploy-a11oy:
    name: Deploy and attest exact protected A11oy source
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@e3ec47ad2e99a535839afe0f30fefbd8973d52da
    with:
      hf-repo: SZLHOLDINGS/a11oy
      ref: ${{ github.sha }}
      dockerfile-path: Dockerfile
      include-readme: true
      prune: true
      wait-running: 1200
      restart-space: true
      source-revision-variable: SZL_GIT_SHA
      source-revision-probe-path: /api/build-info
      smoke-paths: '["/","/api/livez","/api/build-info","/console","/assets/szl-holo-v2.css","/assets/szl-holo-v2.js","/killinchu","/hatun-mcp","/cockpit","/brain","/anatomy-v5","/living-anatomy","/khipu","/immune","/lyte","/estate"]'
    secrets:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}

  publish-vertical:
    name: Publish and attest current combined six-engine runtime
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
      HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert protected-main authority and source pin
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          observed="$(git ls-remote https://github.com/szl-holdings/vertical-services.git refs/heads/main | awk '{print $1}')"
          test "$observed" = "b191c14bf7449a52f1ec3d5959722b396af7fddd"
          grep -Fq 'SOURCE_REVISION = "b191c14bf7449a52f1ec3d5959722b396af7fddd"' scripts/hf_publish_vertical_services.py
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact governed Hub client
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface_hub==1.10.1" "pytest==8.4.2"
      - name: Prove publisher contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/hf_publish_vertical_flagships_v4.py scripts/hf_publish_vertical_services.py
          python -m pytest -q tests/test_hf_space_secret_reader_compat.py tests/test_hf_publish_vertical_flagships_v4.py
      - name: Publish, restart, attest, and verify combined runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_ORG_TOKEN:-}${HF_WRITE_TOKEN:-}${HF_TOKEN:-}${HUGGINGFACE_TOKEN:-}${HUGGING_FACE_HUB_TOKEN:-}"
          python - <<'PY'
          import runpy
          entry = runpy.run_path("scripts/hf_publish_vertical_flagships_v4.py")
          mode = entry["ensure_space_secret_reader"]()
          assert mode in {"native", "backported-metadata-only"}, mode
          combined = runpy.run_path("scripts/hf_publish_vertical_services.py")
          raise SystemExit(combined["main"]())
          PY
      - name: Upload immutable combined-runtime receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emergency-vertical-services-${{ github.run_id }}-${{ github.run_attempt }}
          path: hf-vertical-services-receipt.json
          if-no-files-found: warn
          retention-days: 180

  prove-live:
    name: Prove domain, rail, Brain/Anatomy, and six engines
    needs: [deploy-a11oy, publish-vertical]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_A11OY_SHA: ${{ github.sha }}
      EXPECTED_VERTICAL_SHA: b191c14bf7449a52f1ec3d5959722b396af7fddd
      A11OY_DEPLOY_RESULT: ${{ needs.deploy-a11oy.result }}
      VERTICAL_DEPLOY_RESULT: ${{ needs.publish-vertical.result }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Independently prove all public contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import concurrent.futures, json, os, time, urllib.error, urllib.request
          from pathlib import Path

          origins = ("https://szlholdings-a11oy.hf.space", "https://a-11-oy.com")
          vertical_origin = "https://szlholdings-vertical-services.hf.space"
          expected_a11oy = os.environ["EXPECTED_A11OY_SHA"]
          expected_vertical = os.environ["EXPECTED_VERTICAL_SHA"]
          routes = ("/console", "/killinchu", "/hatun-mcp", "/cockpit", "/brain", "/anatomy-v5", "/living-anatomy", "/khipu", "/immune", "/lyte", "/estate")
          engines = {"sentra", "lyte", "killinchu", "finance", "terra", "counsel"}
          health_paths = ("/healthz", "/readyz", "/sentra/healthz", "/lyte/healthz", "/vessels/healthz", "/finance/healthz", "/terra/healthz", "/counsel/healthz")

          def get(url: str) -> dict:
              req = urllib.request.Request(url + ("&" if "?" in url else "?") + f"proof={time.time_ns()}", headers={"Accept": "*/*", "Cache-Control": "no-cache", "User-Agent": "SZL-Live-Proof/2"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return {"status": response.status, "body": response.read()}
              except urllib.error.HTTPError as exc:
                  return {"status": exc.code, "body": exc.read()}
              except Exception as exc:
                  return {"status": None, "body": b"", "error": f"{type(exc).__name__}: {exc}"}

          def obj(record: dict) -> dict:
              try:
                  value = json.loads(record.get("body", b"").decode("utf-8"))
              except Exception:
                  return {}
              return value if isinstance(value, dict) else {}

          def revision(payload: dict) -> str | None:
              build = payload.get("build")
              if isinstance(build, dict) and isinstance(build.get("revision"), str):
                  return build["revision"]
              for key in ("source_revision", "git_sha", "revision"):
                  if isinstance(payload.get(key), str):
                      return payload[key]
              return None

          report = {"schema": "szl.emergency-live-convergence-proof/v2", "expected_a11oy_sha": expected_a11oy, "expected_vertical_sha": expected_vertical, "workflow_results": {"a11oy": os.environ.get("A11OY_DEPLOY_RESULT"), "vertical": os.environ.get("VERTICAL_DEPLOY_RESULT")}, "attempts": [], "credential_values_recorded": False}
          for attempt in range(1, 25):
              urls = [origin + path for origin in origins for path in ("/", "/api/build-info", "/assets/szl-holo-v2.css", "/assets/szl-holo-v2.js", *routes)]
              urls += [vertical_origin + path for path in ("/api/build-info", *health_paths)]
              with concurrent.futures.ThreadPoolExecutor(max_workers=20) as pool:
                  records = dict(zip(urls, pool.map(get, urls)))

              a11oy = {}
              for origin in origins:
                  css = records[origin + "/assets/szl-holo-v2.css"]["body"].decode("utf-8", errors="replace")
                  js = records[origin + "/assets/szl-holo-v2.js"]["body"].decode("utf-8", errors="replace")
                  route_status = {path: records[origin + path]["status"] for path in routes}
                  ui = {
                      "fluid_css": "SZL FLUID ESTATE RAIL V4" in css,
                      "fluid_js": "SZL FLUID ESTATE RAIL V4" in js,
                      "cyan": "#57ebff" in css and "#31e6d1" in css,
                      "arrows": ".szl-estate-scroll" in css and "Scroll estate tabs left" in js and "Scroll estate tabs right" in js,
                      "killinchu": "KILLINCHU" in js,
                      "hatun": "HATUN" in js,
                      "brain_anatomy": "SECOND BRAIN" in js and "LIVING ANATOMY" in js and "szlBrainAnatomyNav" in js and "brain-anatomy" in js,
                  }
                  a11oy[origin] = {
                      "root_http": records[origin + "/"]["status"],
                      "build_http": records[origin + "/api/build-info"]["status"],
                      "build_revision": revision(obj(records[origin + "/api/build-info"])),
                      "css_http": records[origin + "/assets/szl-holo-v2.css"]["status"],
                      "js_http": records[origin + "/assets/szl-holo-v2.js"]["status"],
                      "routes": route_status,
                      "routes_all_200": all(code == 200 for code in route_status.values()),
                      "ui": ui,
                      "ui_complete": all(ui.values()),
                  }

              ready_record = records[vertical_origin + "/readyz"]
              ready = obj(ready_record)
              build_record = records[vertical_origin + "/api/build-info"]
              build = obj(build_record)
              verticals = ready.get("verticals") if isinstance(ready.get("verticals"), dict) else {}
              signer_ready = set(verticals) == engines and all(
                  isinstance(row, dict)
                  and row.get("ready") is True
                  and row.get("status") == "READY"
                  and isinstance(row.get("requirements"), dict)
                  and row["requirements"].get("persistent_signing_key") is True
                  for row in verticals.values()
              )
              health = {path: records[vertical_origin + path]["status"] for path in health_paths}
              vertical = {
                  "build_http": build_record["status"],
                  "build_revision": revision(build),
                  "ready_http": ready_record["status"],
                  "ready": ready.get("ready"),
                  "bindings_agree": (build.get("source_binding") or {}).get("bindings_agree") if isinstance(build.get("source_binding"), dict) else None,
                  "persistent_signer_ready": signer_ready,
                  "observed_verticals": sorted(verticals),
                  "health": health,
                  "health_all_200": all(code == 200 for code in health.values()),
              }
              state = {"attempt": attempt, "a11oy": a11oy, "vertical": vertical}
              report["attempts"].append(state)
              a11oy_ok = all(row["root_http"] == 200 and row["build_http"] == 200 and row["build_revision"] == expected_a11oy and row["css_http"] == 200 and row["js_http"] == 200 and row["routes_all_200"] and row["ui_complete"] for row in a11oy.values())
              vertical_ok = vertical["build_http"] == 200 and vertical["build_revision"] == expected_vertical and vertical["ready_http"] == 200 and vertical["ready"] is True and vertical["bindings_agree"] is True and vertical["persistent_signer_ready"] and vertical["health_all_200"]
              if a11oy_ok and vertical_ok:
                  report["complete"] = True
                  break
              if attempt < 24:
                  time.sleep(15)
          else:
              report["complete"] = False

          report["final"] = report["attempts"][-1]
          Path("emergency-live-convergence-proof.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({"complete": report["complete"], "final": report["final"]}, indent=2, sort_keys=True))
          if not report["complete"]:
              raise SystemExit(1)
          PY
      - name: Upload immutable convergence proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emergency-live-convergence-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: emergency-live-convergence-proof.json
          if-no-files-found: error
          retention-days: 180
