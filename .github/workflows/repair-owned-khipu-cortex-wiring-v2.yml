# SPDX-License-Identifier: Apache-2.0
name: Repair owned Khipu cortex wiring v2

on:
  push:
    branches:
      - feat/hf-owned-khipu-cortex-v1
    paths:
      - .github/workflows/repair-owned-khipu-cortex-wiring-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-owned-khipu-cortex-wiring-v2
  cancel-in-progress: false

jobs:
  wire:
    name: Wire exact owned model path and remove temporary writers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/hf-owned-khipu-cortex-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply idempotent Docker and route wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          module = Path("szl_owned_khipu_cortex.py")
          vendor = Path("vendor/szl_nemo/szl_nemo/__init__.py")
          if not module.is_file():
              raise SystemExit("szl_owned_khipu_cortex.py is missing")
          if not vendor.is_file():
              raise SystemExit("vendored szl-nemo package is missing")

          dockerfile = Path("Dockerfile")
          docker = dockerfile.read_text(encoding="utf-8")
          copy_lines = (
              "# OWNED KHIPU GOVERNED CORTEX — exact GGUF execution + vendored Nemo witness\n"
              "COPY szl_owned_khipu_cortex.py ./\n"
              "COPY vendor/szl_nemo/ ./vendor/szl_nemo/\n"
          )
          if "COPY szl_owned_khipu_cortex.py ./" not in docker:
              anchors = ["\nCMD ", "\nENTRYPOINT ", "\nHEALTHCHECK "]
              positions = [docker.rfind(anchor) for anchor in anchors if docker.rfind(anchor) >= 0]
              if positions:
                  position = min(positions)
                  docker = docker[:position] + "\n" + copy_lines + docker[position:]
              else:
                  docker = docker.rstrip() + "\n\n" + copy_lines
          if "COPY vendor/szl_nemo/ ./vendor/szl_nemo/" not in docker:
              marker = "COPY szl_owned_khipu_cortex.py ./\n"
              if marker not in docker:
                  raise SystemExit("owned cortex Docker marker missing")
              docker = docker.replace(marker, marker + "COPY vendor/szl_nemo/ ./vendor/szl_nemo/\n", 1)
          if docker.count("COPY szl_owned_khipu_cortex.py ./") != 1:
              raise SystemExit("owned cortex Docker COPY is not unique")
          if docker.count("COPY vendor/szl_nemo/ ./vendor/szl_nemo/") != 1:
              raise SystemExit("vendored Nemo Docker COPY is not unique")
          dockerfile.write_text(docker, encoding="utf-8")

          serve_path = Path("serve.py")
          serve = serve_path.read_text(encoding="utf-8")
          registration = '''\n# -- OWNED KHIPU GOVERNED CORTEX -- executes the exact immutable SZLHOLDINGS\n# Khipu GGUF in this Docker runtime, grounds only through the public brain\n# projection, witnesses pre/post inference with vendored deterministic SZL-Nemo,\n# binds the locked-eight formula authority, and emits proposal-only hash receipts.\n# Registered after the Brain API and before the SPA catch-all. A11oy remains the\n# sole consequential-action authority; Lambda/F23 is advisory and non-authorizing.\n_owned_khipu_cortex_registered = False\ntry:\n    import szl_owned_khipu_cortex as _szl_owned_khipu_cortex\n    _owned_khipu_cortex_status = _szl_owned_khipu_cortex.register(app, ns="a11oy")\n    _owned_khipu_cortex_registered = True\n    print(f"[a11oy] Owned Khipu cortex registered: {_owned_khipu_cortex_status}", file=__import__("sys").stderr)\nexcept Exception as _owned_khipu_cortex_e:  # pragma: no cover - honest fail-closed degradation\n    print(f"[a11oy] Owned Khipu cortex NOT registered: {_owned_khipu_cortex_e!r}; existing surfaces unaffected", file=__import__("sys").stderr)\n\n'''
          if "_szl_owned_khipu_cortex.register(app" not in serve:
              anchors = (
                  "# -- BRAIN CAPABILITIES LEDGER --",
                  "# BRAIN UNCERTAINTY",
                  "# -- szl_brainmemory BRAIN MEMORY FRESHNESS",
              )
              anchor = next((candidate for candidate in anchors if candidate in serve), None)
              if anchor is None:
                  raise SystemExit("stable pre-SPA route anchor not found in serve.py")
              serve = serve.replace(anchor, registration + anchor, 1)
          if serve.count("_szl_owned_khipu_cortex.register(app") != 1:
              raise SystemExit("owned cortex register call is not unique")
          serve_path.write_text(serve, encoding="utf-8")

          Path(".github/workflows/apply-owned-khipu-cortex-wiring.yml").unlink(missing_ok=True)
          Path(".github/workflows/repair-owned-khipu-cortex-wiring-v2.yml").unlink(missing_ok=True)
          PY

      - name: Prove source and image wiring
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            szl_owned_khipu_cortex.py \
            vendor/szl_nemo/szl_nemo/__init__.py \
            vendor/szl_nemo/szl_nemo/schema.py \
            vendor/szl_nemo/szl_nemo/rules.py \
            vendor/szl_nemo/szl_nemo/engine.py \
            vendor/szl_nemo/szl_nemo/envelope.py \
            serve.py
          python - <<'PY'
          import ast
          from pathlib import Path

          module = Path("szl_owned_khipu_cortex.py").read_text(encoding="utf-8")
          tree = ast.parse(module)
          names = {node.name for node in tree.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}
          if "register" not in names:
              raise SystemExit("owned cortex module has no register function")

          docker = Path("Dockerfile").read_text(encoding="utf-8")
          serve = Path("serve.py").read_text(encoding="utf-8")
          required = {
              "docker_module": "COPY szl_owned_khipu_cortex.py ./" in docker,
              "docker_nemo": "COPY vendor/szl_nemo/ ./vendor/szl_nemo/" in docker,
              "serve_import": "import szl_owned_khipu_cortex" in serve,
              "serve_register": "_szl_owned_khipu_cortex.register(app" in serve,
              "no_old_writer": not Path(".github/workflows/apply-owned-khipu-cortex-wiring.yml").exists(),
              "no_new_writer": not Path(".github/workflows/repair-owned-khipu-cortex-wiring-v2.yml").exists(),
          }
          failed = [name for name, value in required.items() if not value]
          if failed:
              raise SystemExit("wiring contract failed: " + ", ".join(failed))
          PY
          git diff --check

      - name: Run owned-cortex tests when present
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          for candidate in \
            tests/test_owned_khipu_cortex.py \
            tests/test_owned_khipu_cortex_wiring.py \
            tests/test_hf_owned_khipu_cortex.py; do
            if [[ -f "$candidate" ]]; then
              tests+=("$candidate")
            fi
          done
          if (( ${#tests[@]} > 0 )); then
            python -m pytest -q "${tests[@]}"
          fi

      - name: Commit the permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add Dockerfile serve.py \
            .github/workflows/apply-owned-khipu-cortex-wiring.yml \
            .github/workflows/repair-owned-khipu-cortex-wiring-v2.yml
          if git diff --cached --quiet; then
            echo "Permanent wiring is already present"
            exit 0
          fi
          git commit -s -m "fix(inference): complete owned Khipu cortex wiring"
          git push origin HEAD:feat/hf-owned-khipu-cortex-v1
