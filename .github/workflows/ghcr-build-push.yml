name: GHCR Build + Push (uds-v0.3.0)

on:
  push:
    branches: [main]
    tags: ["v*", "uds-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable containerd image store
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/docker
          if [ -s /etc/docker/daemon.json ]; then
            sudo jq '.features."containerd-snapshotter" = true' /etc/docker/daemon.json > /tmp/daemon.json
            sudo mv /tmp/daemon.json /etc/docker/daemon.json
          else
            echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          fi
          sudo systemctl restart docker
          for i in $(seq 1 30); do
            docker info >/dev/null 2>&1 && break
            sleep 1
          done
          docker info -f '{{ .DriverStatus }}'

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Derive immutable build identity
        id: build-identity
        shell: bash
        run: |
          set -euo pipefail
          SHA7="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="0.0.0-dev-${SHA7}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "build_date=${BUILD_DATE}" >> "${GITHUB_OUTPUT}"

      - name: Build and push immutable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-push
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          build-args: |
            A11OY_REQUIRE_LOCAL_LLM=1
            VERSION=${{ steps.build-identity.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.build-identity.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/szl-holdings/${{ github.event.repository.name }}:uds-v0.3.0
            ghcr.io/szl-holdings/${{ github.event.repository.name }}:latest

      - name: Prove demo tier serves a real local model
        timeout-minutes: 8
        env:
          IMG: ghcr.io/szl-holdings/${{ github.event.repository.name }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${IMG}@${DIGEST}"
          docker run --rm -i --entrypoint python3 "${IMG}@${DIGEST}" - <<'PYEOF'
          import json
          import sys
          import szl_alloy_models as m

          errors = []
          demo = [x for x in m.ALLOY_ROSTER if x.get("tier_band") == "demo_cpu"]
          if not demo:
              errors.append("no demo_cpu tier model present in ALLOY_ROSTER")

          path = m._gguf_path()
          available = m.backend_available()
          fingerprint = m._gguf_sha(path)
          print(
              "gguf_path=%r backend_available=%s gguf_sha256_fp=%s backend_error=%r"
              % (path, available, fingerprint, m._LLAMA_ERR),
              flush=True,
          )
          if not path:
              errors.append("no GGUF weight in image")
          if not available:
              errors.append("llama.cpp backend unavailable: %s" % (m._LLAMA_ERR,))

          generation = m._local_generate(
              "Write a Python function add(a, b) that returns their sum.",
              max_tokens=48,
          )
          safe = {
              key: (value[:200] if key == "text" and isinstance(value, str) else value)
              for key, value in generation.items()
          }
          print("generation=" + json.dumps(safe), flush=True)

          if not generation.get("served_locally"):
              errors.append("served_locally=False")
          if generation.get("tower_side"):
              errors.append("tower_side=True")
          if generation.get("backend") != "llama.cpp":
              errors.append("backend=%r, expected llama.cpp" % generation.get("backend"))
          if generation.get("honest_label"):
              errors.append("fallback marker present")
          text = (generation.get("text") or "").strip()
          if not text:
              errors.append("generation text was empty")

          if errors:
              for error in errors:
                  print("::error::" + error)
              sys.exit(1)
          print(
              "[OK] bundled GGUF served genuine llama.cpp output (%d chars)." % len(text),
              flush=True,
          )
          PYEOF

      - name: Prove demo tier over HTTP
        timeout-minutes: 8
        env:
          IMG: ghcr.io/szl-holdings/${{ github.event.repository.name }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${IMG}@${DIGEST}"
          docker run --rm -i --entrypoint python3 "${IMG}@${DIGEST}" - <<'PYEOF'
          import json
          import sys
          from fastapi import FastAPI
          from starlette.testclient import TestClient
          import szl_alloy_models as m

          errors = []
          app = FastAPI()
          status = m.register(app, "a11oy")
          if "demo" not in status.get("endpoints", []):
              errors.append("demo endpoint not registered")

          client = TestClient(app)
          requests = (
              ("GET", {}),
              (
                  "POST",
                  {
                      "json": {
                          "prompt": "Write a Python function add(a, b).",
                          "max_tokens": 48,
                      }
                  },
              ),
          )
          for method, kwargs in requests:
              response = client.request(method, "/v1/alloy/demo", **kwargs)
              if response.status_code != 200:
                  errors.append("%s /v1/alloy/demo -> HTTP %d" % (method, response.status_code))
                  continue
              data = response.json()
              safe = {
                  key: value
                  for key, value in data.items()
                  if key in ("tier_forced", "backend", "served_locally", "live_demo", "honest_label")
              }
              print("%s /v1/alloy/demo -> %s" % (method, json.dumps(safe)), flush=True)
              if data.get("tier_forced") != "demo_cpu":
                  errors.append("%s: wrong tier" % method)
              if data.get("backend") != "llama.cpp":
                  errors.append("%s: wrong backend" % method)
              if not data.get("served_locally"):
                  errors.append("%s: not served locally" % method)
              tier = (data.get("router") or {}).get("chosen", {}).get("tier_band")
              if tier != "demo_cpu":
                  errors.append("%s: routed tier=%r" % (method, tier))
              generated = ((data.get("generation") or {}).get("text") or "").strip()
              if not generated:
                  errors.append("%s: empty generation" % method)

          if errors:
              for error in errors:
                  print("::error::" + error)
              sys.exit(1)
          print("[OK] /v1/alloy/demo serves the bundled model over HTTP.", flush=True)
          PYEOF

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/szl-holdings/${{ github.event.repository.name }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.8.1

      - name: Sign immutable image with bounded retry
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMG: ghcr.io/szl-holdings/${{ github.event.repository.name }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cosign sign --yes "${IMG}@${DIGEST}"; then
              echo "Signed immutable image ${IMG}@${DIGEST}."
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Sigstore signing failed after ${attempt} bounded attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Attach cosign-verifiable SLSA provenance
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMG: ghcr.io/szl-holdings/${{ github.event.repository.name }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          cat > predicate.json <<EOF
          {
            "builder": {
              "id": "${{ github.server_url }}/${{ github.repository }}/.github/workflows/ghcr-build-push.yml@${{ github.ref }}"
            },
            "buildType": "https://actions.github.io/buildtypes/workflow/v1",
            "invocation": {
              "configSource": {
                "uri": "git+${{ github.server_url }}/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" },
                "entryPoint": ".github/workflows/ghcr-build-push.yml"
              },
              "environment": {
                "event_name": "${{ github.event_name }}",
                "repository_id": "${{ github.repository_id }}",
                "runner_environment": "github-hosted"
              }
            },
            "metadata": {
              "buildInvocationId": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}",
              "completeness": {
                "parameters": true,
                "environment": false,
                "materials": false
              },
              "reproducible": false
            },
            "materials": [
              {
                "uri": "git+${{ github.server_url }}/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" }
              }
            ]
          }
          EOF

          for attempt in 1 2 3; do
            if cosign attest --yes \
              --type slsaprovenance \
              --predicate predicate.json \
              "${IMG}@${DIGEST}"; then
              echo "Attached SLSA provenance to ${IMG}@${DIGEST}."
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::SLSA attestation failed after ${attempt} bounded attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Verify SLSA provenance
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMG: ghcr.io/szl-holdings/${{ github.event.repository.name }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cosign verify-attestation \
              --type slsaprovenance \
              --certificate-identity-regexp="github.com/szl-holdings" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              "${IMG}@${DIGEST}" > /dev/null; then
              echo "SLSA L2 verified for ${IMG}@${DIGEST}."
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::SLSA verification failed after ${attempt} bounded attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done
