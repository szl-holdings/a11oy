name: Docs CI

# CI for showcase repos that ship documentation and metadata only.
# Validates citation files, markdown, links, governance files, and runs
# the secret scan. Pushes to main keep a path filter so asset-only
# changes (e.g. social previews) don't churn cancelled runs. Pull
# requests run unconditionally: the branch rules require checks from
# these jobs, and a path-filtered pull request never reports them, so
# its merge stays blocked on "required status checks are expected".

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.cff'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: szl-holdings/.github/.github/workflows/reusable-docs-ci.yml@4d38db6d5ff8c3d18c8831a4426e8dba6dc80ceb # v1 (.github main)

  secrets:
    uses: szl-holdings/.github/.github/workflows/reusable-secret-scan.yml@4d38db6d5ff8c3d18c8831a4426e8dba6dc80ceb # v1 (.github main)