name: Console source and runtime evidence

on:
  pull_request:
    branches: [main]
    paths:
      - pages/console.html
      - tests/test_console_source_runtime_evidence.mjs
      - .github/workflows/console-source-evidence.yml
  push:
    branches: [main]
    paths:
      - pages/console.html
      - tests/test_console_source_runtime_evidence.mjs
      - .github/workflows/console-source-evidence.yml

permissions:
  contents: read

jobs:
  source-runtime-evidence:
    name: Network-free console contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Run console source and runtime evidence tests
        run: node --test tests/test_console_source_runtime_evidence.mjs
