name: Console source and runtime evidence

on:
  pull_request:
    branches: [main]
    paths:
      - pages/console.html
      - tests/test_console_source_runtime_evidence.mjs
      - scripts/test_console_evidence.cjs
      - .github/workflows/console-source-evidence.yml
  push:
    branches: [main]
    paths:
      - pages/console.html
      - tests/test_console_source_runtime_evidence.mjs
      - scripts/test_console_evidence.cjs
      - .github/workflows/console-source-evidence.yml

permissions:
  contents: read

jobs:
  source-runtime-evidence:
    name: Network-free console contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Run console source and runtime evidence tests
        run: node --test tests/test_console_source_runtime_evidence.mjs
      - name: Verify shipped ledger, energy and sample-signature helpers offline
        run: node scripts/test_console_evidence.cjs
