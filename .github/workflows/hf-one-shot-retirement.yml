name: Canonical A11oy HF One-Shot Retirement

on:
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/deploy-verify-brain-now.yml
    - .github/workflows/deploy-verify-canonical-a11oy-now.yml
    - .github/workflows/hf-sync.yml
    - .github/workflows/hf-one-shot-retirement.yml
    - tests/test_hf_one_shots_retired.py
  push:
    branches:
    - main
    paths:
    - .github/workflows/deploy-verify-brain-now.yml
    - .github/workflows/deploy-verify-canonical-a11oy-now.yml
    - .github/workflows/hf-sync.yml
    - .github/workflows/hf-one-shot-retirement.yml
    - tests/test_hf_one_shots_retired.py
  merge_group:
    types:
    - checks_requested
    branches:
    - main
permissions:
  contents: read

jobs:
  verify:
    name: Permanent source-derived controller is the sole authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Enforce retirement and permanent-authority contract
        run: |
          set -euo pipefail
          python -m py_compile tests/test_hf_one_shots_retired.py
          python tests/test_hf_one_shots_retired.py
          git diff --check
