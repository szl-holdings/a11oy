name: Reusable protected build boundary

on:
  workflow_call:
    inputs:
      image:
        description: Fixed canonical image repository
        type: string
        required: false
        default: ghcr.io/szl-holdings/a11oy
    outputs:
      image_digest:
        description: Immutable digest produced and attested inside this workflow
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - name: Validate fixed release boundary
        env:
          REQUESTED_IMAGE: ${{ inputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          test "${REQUESTED_IMAGE}" = "ghcr.io/szl-holdings/a11oy"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish from this source checkout
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ inputs.image }}:sha-${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fail closed on missing immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Generate SPDX JSON SBOM for the exact image digest
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: evidence/sbom.spdx.json
          upload-artifact: false

      - name: Scan the exact image digest
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          image: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
          output-format: sarif
          output-file: evidence/vulnerability-report.sarif
          fail-build: true
          severity-cutoff: high

      - name: Generate GitHub artifact attestation for the exact digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless sign immutable digest only
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp '^https://github.com/szl-holdings/a11oy/.github/workflows/reusable-build.yml@refs/(heads|tags)/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE}@${DIGEST}" > evidence/cosign-verification.json

      - name: Record immutable build evidence
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          required = [
              Path("evidence/sbom.spdx.json"),
              Path("evidence/vulnerability-report.sarif"),
              Path("evidence/cosign-verification.json"),
          ]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit("mandatory evidence missing: " + ", ".join(missing))
          Path("evidence/build-identity.json").write_text(json.dumps({
              "source_commit": os.environ["GITHUB_SHA"],
              "image": os.environ["IMAGE"],
              "digest": os.environ["DIGEST"],
              "workflow": "reusable-build.yml",
              "run_id": os.environ["GITHUB_RUN_ID"],
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload complete evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operation-verified-build-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
