name: One-shot Command Center deep-link polish

on:
  push:
    branches:
      - feat/command-center-deeplinks-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/command-center-deeplinks-20260902
          fetch-depth: 0
      - name: Patch canonical Command Center
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          htmlp = Path('web/elite_console.html')
          html = htmlp.read_text(encoding='utf-8')
          html = html.replace('20 fully-functional tabs', '21 fully-functional tabs')
          html = html.replace('— 20 tabs · zero mocks', '— 21 tabs · zero mocks')
          html = html.replace('<div class="tabbar" id="tabbar">', '<div class="tabbar" id="tabbar" role="tablist" aria-label="A11oy Command Center views">')

          # Make each visible tab a real accessible tab with a stable control id.
          html = re.sub(
              r'<button class="tab-btn( active)?" data-tab="([^"]+)">',
              lambda m: '<button class="tab-btn%s" data-tab="%s" id="tab-btn-%s" role="tab" aria-controls="tab-%s" aria-selected="%s" tabindex="%s">' % (
                  m.group(1) or '', m.group(2), m.group(2), m.group(2),
                  'true' if m.group(1) else 'false', '0' if m.group(1) else '-1'
              ),
              html,
          )
          html = re.sub(
              r'<div class="tab-panel( active)?" id="tab-([^"]+)">',
              lambda m: '<div class="tab-panel%s" id="tab-%s" role="tabpanel" aria-labelledby="tab-btn-%s" tabindex="0">' % (
                  m.group(1) or '', m.group(2), m.group(2)
              ),
              html,
          )

          old = """function activateTab(id) {
  tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === id));
  panels.forEach(p => p.classList.toggle('active', p.id === 'tab-' + id));
  if (!tabLoaded[id]) { tabLoaded[id] = true; loadTab(id); }
}

tabs.forEach(t => t.addEventListener('click', () => activateTab(t.dataset.tab)));"""
          new = """function commandTabFromLocation() {
  const path = (location.pathname || '').replace(/^\\/command\\/?/, '').split('/')[0];
  if (path && [...tabs].some(t => t.dataset.tab === path)) return path;
  try {
    const queryTab = new URLSearchParams(location.search).get('tab');
    if (queryTab && [...tabs].some(t => t.dataset.tab === queryTab)) return queryTab;
  } catch (_) {}
  return 'overview';
}

function activateTab(id, options = {}) {
  if (![...tabs].some(t => t.dataset.tab === id)) id = 'overview';
  tabs.forEach(t => {
    const active = t.dataset.tab === id;
    t.classList.toggle('active', active);
    t.setAttribute('aria-selected', active ? 'true' : 'false');
    t.tabIndex = active ? 0 : -1;
  });
  panels.forEach(p => p.classList.toggle('active', p.id === 'tab-' + id));
  if (!tabLoaded[id]) { tabLoaded[id] = true; loadTab(id); }
  if (options.history !== false) {
    const url = id === 'overview' ? '/command' : '/command/' + encodeURIComponent(id);
    const method = options.replace ? 'replaceState' : 'pushState';
    history[method]({ commandTab: id }, '', url);
  }
}

tabs.forEach(t => t.addEventListener('click', () => activateTab(t.dataset.tab)));
window.addEventListener('popstate', () => activateTab(commandTabFromLocation(), { history:false }));"""
          if old not in html:
              raise SystemExit('tab routing anchor not found')
          html = html.replace(old, new)
          html = html.replace("// ══ Initial load ══\nloadTab('overview');", "// ══ Initial load ══\nactivateTab(commandTabFromLocation(), { history:false });")
          htmlp.write_text(html, encoding='utf-8')

          # Keep server-side self-test truthful about the current surface.
          for fp in ('a11oy_command_center.py', 'tests/test_command_center_origin.py'):
              p = Path(fp)
              text = p.read_text(encoding='utf-8').replace('20 fully-functional tabs', '21 fully-functional tabs').replace('20-tab Elite Console', '21-tab Elite Console').replace('elite-20-tab', 'elite-21-tab')
              p.write_text(text, encoding='utf-8')

          # Make the shared public command affordance land on canonical /command.
          p = Path('static/shared/szl_command_bar.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace("{ label: 'Command Center', href: '/console?view=command' }", "{ label: 'Command Center', href: '/command' }")
          text = text.replace("href: '/console',\n      'aria-label': 'Open the command center'", "href: '/command',\n      'aria-label': 'Open the command center'")
          text = text.replace("el('a', { class: 'flag', href: '/console', text: 'A11OY' })", "el('a', { class: 'flag', href: '/command', text: 'A11OY' })")
          p.write_text(text, encoding='utf-8')

          # Ecosystem map: canonical Command Center is /command; operator views stay /console.
          p = Path('pages/ecosystem.html')
          text = p.read_text(encoding='utf-8').replace("{id:'Command Center',kind:'home',href:'/console?view=command',note:'Home · operator application on this origin'}", "{id:'Command Center',kind:'home',href:'/command',note:'Home · canonical 21-view command cockpit on this origin'}")
          p.write_text(text, encoding='utf-8')

          # Update narrow tests that intentionally lock these links.
          for fp in ('tests/test_ecosystem_in_app_map.py', 'tests/test_holographic_command_bar.py'):
              p = Path(fp)
              if p.exists():
                  text = p.read_text(encoding='utf-8').replace('/console?view=command', '/command')
                  p.write_text(text, encoding='utf-8')

          # Add a structural regression test for every tab/button/panel/deep-link contract.
          Path('tests/test_elite_command_center_tabs.py').write_text(r'''# SPDX-License-Identifier: Apache-2.0
from pathlib import Path
import re

HTML = Path(__file__).resolve().parents[1] / "web" / "elite_console.html"


def test_every_command_tab_has_exactly_one_panel_and_loader_contract():
    text = HTML.read_text(encoding="utf-8")
    tabs = re.findall(r'data-tab="([^"]+)"', text)
    assert len(tabs) == 21, tabs
    assert len(set(tabs)) == len(tabs)
    for tab in tabs:
        assert text.count(f'id="tab-{tab}"') == 1
        assert text.count(f'id="tab-btn-{tab}"') == 1
        assert f"case '{tab}':" in text


def test_tabs_are_accessible_and_deep_linkable():
    text = HTML.read_text(encoding="utf-8")
    assert 'role="tablist"' in text
    assert text.count('role="tab"') == 21
    assert text.count('role="tabpanel"') == 21
    assert 'commandTabFromLocation' in text
    assert "'/command/' + encodeURIComponent(id)" in text
    assert "window.addEventListener('popstate'" in text
    assert '21 fully-functional tabs' in text
    assert '— 21 tabs · zero mocks' in text
''', encoding='utf-8')
          PY

          rm -f .github/workflows/command-center-deeplink-patch.yml

          python3 -m py_compile a11oy_command_center.py tests/test_command_center_origin.py tests/test_elite_command_center_tabs.py
          python3 -m pytest -q tests/test_command_center_origin.py tests/test_elite_command_center_tabs.py tests/test_holographic_command_bar.py tests/test_ecosystem_in_app_map.py
          git diff --check

          git config user.name 'SZL Command Center Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -s -m 'feat(command): deep-link and accessibility polish all command tabs'
          git push origin HEAD:feat/command-center-deeplinks-20260902
