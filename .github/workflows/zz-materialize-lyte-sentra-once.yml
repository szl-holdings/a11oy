name: Materialize Lyte source ownership and Sentra authority once

on:
  push:
    branches:
      - fix/lyte-source-owned-publisher
    paths:
      - .github/workflows/zz-materialize-lyte-sentra-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/lyte-source-owned-publisher
          persist-credentials: true
          fetch-depth: 0

      - name: Apply the current owner directive and source binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          publisher_path = Path('scripts/hf_publish_vertical_flagships_v4.py')
          tests_path = Path('tests/test_hf_publish_lyte_enterprise.py')
          publisher = publisher_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          replacements = {
              'The established Domain Experience v4 implementation remains the renderer for\nTerra, Counsel, and Finance. Lyte is no longer regenerated as a generic shell:':
              'The established Domain Experience v4 implementation remains the renderer for\nTerra, Sentra, Counsel, and Finance. Lyte is no longer regenerated as a generic shell:',
              'publisher. Sentra and Vessels remain capability planes inside Killinchu and are\nfiltered before any independent Hugging Face mutation.':
              'publisher. Sentra remains the sole Assurance Command. Vessels remains a\ncapability plane inside Killinchu and is filtered before independent publication.',
              'PUBLIC_FLAGSHIP_SLUGS = ("terra", "counsel", "finance", "lyte")':
              'PUBLIC_FLAGSHIP_SLUGS = ("terra", "sentra", "counsel", "finance", "lyte")',
              'GENERATED_FLAGSHIP_SLUGS = ("terra", "counsel", "finance")':
              'GENERATED_FLAGSHIP_SLUGS = ("terra", "sentra", "counsel", "finance")',
              'FOLDED_INTO_KILLINCHU = ("sentra", "vessels")':
              'FOLDED_INTO_KILLINCHU = ("vessels",)',
              'KILLINCHU_SPACE = "SZLHOLDINGS/killinchu"\nVERTICAL_SERVICES_REPOSITORY':
              'KILLINCHU_SPACE = "SZLHOLDINGS/killinchu"\nSENTRA_SPACE = "SZLHOLDINGS/sentra"\nLYTE_SOURCE_REVISION = "2131d2eb3611267bd62c134b6bba6b4cf7523127"\nVERTICAL_SERVICES_REPOSITORY',
              'flagship["killinchu_space"] = KILLINCHU_SPACE\n    flagship["lyte_runtime"]':
              'flagship["killinchu_space"] = KILLINCHU_SPACE\n    flagship["sentra_space"] = SENTRA_SPACE\n    flagship["lyte_runtime"]',
              'and lyte.get("source_revision")\n        == "f5e85a57cd616c0d2b216e2c5f1686485b8c43e8"':
              'and lyte.get("source_revision") == LYTE_SOURCE_REVISION',
          }
          for old, new in replacements.items():
              count = publisher.count(old)
              if count != 1:
                  raise SystemExit(f'publisher replacement count for {old!r}: {count}')
              publisher = publisher.replace(old, new)

          test_replacements = {
              'PUBLIC_FLAGSHIP_SLUGS = ("terra", "counsel", "finance", "lyte")':
              'PUBLIC_FLAGSHIP_SLUGS = ("terra", "sentra", "counsel", "finance", "lyte")',
              'GENERATED_FLAGSHIP_SLUGS = ("terra", "counsel", "finance")':
              'GENERATED_FLAGSHIP_SLUGS = ("terra", "sentra", "counsel", "finance")',
              'assert \'FOLDED_INTO_KILLINCHU = ("sentra", "vessels")\' in source':
              'assert \'FOLDED_INTO_KILLINCHU = ("vessels",)\' in source\n    assert \'PUBLIC_FLAGSHIP_SLUGS = ("terra", "sentra", "counsel", "finance", "lyte")\' in source\n    assert \'GENERATED_FLAGSHIP_SLUGS = ("terra", "sentra", "counsel", "finance")\' in source\n    assert \'SENTRA_SPACE = "SZLHOLDINGS/sentra"\' in source\n    assert \'FOLDED_INTO_KILLINCHU = ("sentra", "vessels")\' not in source',
          }
          for old, new in test_replacements.items():
              count = tests.count(old)
              if count != 1:
                  raise SystemExit(f'test replacement count for {old!r}: {count}')
              tests = tests.replace(old, new)

          tests += '''\n\ndef test_estate_receipt_binds_the_exact_lyte_source_revision() -> None:\n    publisher = PUBLISHER.read_text(encoding="utf-8")\n    entrypoint = ENTRYPOINT.read_text(encoding="utf-8")\n    expected = "2131d2eb3611267bd62c134b6bba6b4cf7523127"\n    assert f'SOURCE_REVISION = "{expected}"' in publisher\n    assert f'LYTE_SOURCE_REVISION = "{expected}"' in entrypoint\n    assert 'lyte.get("source_revision") == LYTE_SOURCE_REVISION' in entrypoint\n'''

          publisher_path.write_text(publisher, encoding='utf-8')
          tests_path.write_text(tests, encoding='utf-8')
          PY

          python -m py_compile \
            scripts/hf_publish_vertical_flagships_v4.py \
            scripts/hf_publish_lyte_enterprise.py
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m pytest -q tests/test_hf_publish_lyte_enterprise.py

      - name: Commit durable source and remove one-use controller
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-materialize-lyte-sentra-once.yml
          git add scripts/hf_publish_vertical_flagships_v4.py tests/test_hf_publish_lyte_enterprise.py
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git commit -m 'fix(hf): align Lyte source ownership with Sentra authority

          Bind the estate receipt to the exact current Lyte source revision, publish Sentra as the sole Assurance Command, and keep only Vessels folded into Killinchu.

          Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:fix/lyte-source-owned-publisher
