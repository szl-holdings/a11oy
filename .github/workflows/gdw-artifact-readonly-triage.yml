name: GDW artifact read-only triage
on:
  pull_request:
    paths:
      - '.github/workflows/gdw-artifact-readonly-triage.yml'
      - 'scripts/triage_gdw_artifacts_readonly.py'
      - 'tests/test_gdw_artifact_readonly_triage.py'
      - 'gdw_durable_artifacts.py'
      - 'scripts/qualify_gdw_store_recovery.py'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact current protected main; read-only diagnostic, never recovery'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gdw-artifact-readonly-triage-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install hash-locked core test dependencies
        run: python -m pip install --require-hashes -r .github/requirements/ci-core.txt
      - name: Prove read-only triage boundaries with actual disposable databases
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m pytest tests/test_gdw_artifact_readonly_triage.py -q
  triage:
    needs: contract
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == inputs.source_sha && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact protected diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the existing exact native read ABI
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'huggingface_hub==1.31.0' 'requests==2.32.5' 'cryptography==50.0.1'
      - name: Inspect captured candidates and stop before any artifact publication
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TRIAGE_SOURCE_SHA: ${{ inputs.source_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/triage_gdw_artifacts_readonly.py --source-sha "$TRIAGE_SOURCE_SHA" --output "$RUNNER_TEMP/gdw-artifact-triage.json"
      - name: Retain only the closed diagnostic record
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gdw-artifact-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gdw-artifact-triage.json
          if-no-files-found: error
          retention-days: 90
