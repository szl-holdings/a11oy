# SPDX-License-Identifier: Apache-2.0
name: Apply public vertical estate convergence once

on:
  push:
    branches: [feat/killinchu-vertical-estate-convergence-20260904]
    paths:
      - .github/workflows/zz-apply-vertical-estate-convergence-once.yml
      - scripts/apply_vertical_estate_convergence.py
      - tests/test_public_vertical_topology_v7.py
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apply-public-vertical-estate-convergence
  cancel-in-progress: false

jobs:
  apply-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Apply exact estate transformation
        run: python scripts/apply_vertical_estate_convergence.py
      - name: Compile and test product topology
        run: |
          python -m py_compile \
            scripts/apply_vertical_estate_convergence.py \
            scripts/hf_publish_vertical_flagships_v4.py \
            scripts/hf_publish_vertical_flagships_v4_impl.py \
            tests/test_public_vertical_topology_v7.py
          python -m pip install --disable-pip-version-check --no-cache-dir pytest
          python -m pytest -q \
            tests/test_public_vertical_topology_v7.py \
            tests/test_hf_publish_vertical_flagships_v3.py
          git diff --check
      - name: Commit transformed estate files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Estate topology already exact."
            exit 0
          fi
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add a11oy_landing.html scripts/hf_publish_vertical_flagships_v4_impl.py docs/estate/PUBLIC_VERTICAL_TOPOLOGY.md
          git diff --cached --check
          git commit --signoff -m "feat(estate): fold Aegis and Sentra into Killinchu and repair vertical sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
