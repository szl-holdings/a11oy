name: One-shot estate build convergence repair

on:
  push:
    branches:
      - fix/estate-build-convergence-20260904
    paths:
      - .github/workflows/repair-estate-builds-once.yml
      - scripts/repair_estate_builds_once.py

permissions:
  contents: write

concurrency:
  group: estate-build-convergence-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/estate-build-convergence-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Repair source and flow-shell drift
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repair_estate_builds_once.py
          python scripts/rollout_frontend_flow_shell.py \
            --report audit/frontend-flow-shell-repair-20260904.json

      - name: Refresh current public Hugging Face ecosystem manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_huggingface_ecosystem.py \
            --output docs/huggingface-ecosystem-manifest.json
          python scripts/audit_huggingface_ecosystem.py \
            --check \
            --output docs/huggingface-ecosystem-manifest.json

      - name: Run focused convergence tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            szl_energy_ledger.py \
            scripts/rollout_frontend_flow_shell.py \
            scripts/audit_huggingface_ecosystem.py
          python -m pytest -q \
            test_energy_ledger.py \
            tests/test_frontend_source_boundaries.py
          python tests/test_frontend_flow_shell.py -v
          python scripts/test_audit_huggingface_ecosystem.py
          python scripts/rollout_frontend_flow_shell.py --check
          python scripts/investor_smoke_gate.py --mode contract
          git diff --check

      - name: Commit repair and remove one-shot controller
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/repair-estate-builds-once.yml \
            scripts/repair_estate_builds_once.py
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair diff was produced."
            exit 1
          fi
          git commit -s \
            -m "fix(convergence): repair stalled estate builds" \
            -m "Bound the public energy-ledger projection, bind the constellation surface to the shared flow shell, and refresh the current public Hugging Face ecosystem manifest."
          git push origin HEAD:fix/estate-build-convergence-20260904
