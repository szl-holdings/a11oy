name: One-shot estate build convergence repair

on:
  push:
    branches:
      - fix/estate-build-convergence-20260904
    paths:
      - .github/workflows/repair-estate-builds-once.yml

permissions:
  contents: write

concurrency:
  group: estate-build-convergence-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/estate-build-convergence-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Repair flow shell and bound the energy ledger response
        shell: bash
        env:
          ESTATE_REPAIR_PATCH_B64:  bi'.replace(' ','')