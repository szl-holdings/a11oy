# SPDX-License-Identifier: Apache-2.0
name: Materialize runtime fallback attribution once

"on":
  push:
    branches:
      - fix/runtime-fallback-source-attribution-20260905
    paths:
      - .github/workflows/_materialize_runtime_fallback_attribution_once.yml

permissions:
  contents: write

concurrency:
  group: materialize-runtime-fallback-attribution-a11oy
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'szl-holdings/a11oy' && github.ref == 'refs/heads/fix/runtime-fallback-source-attribution-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/runtime-fallback-source-attribution-20260905
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Materialize permanent source and focused regression
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge --no-edit origin/main
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          payload = ""
          Path("/tmp/materialize.py").write_bytes(
              zlib.decompress(base64.b64decode(payload, validate=True))
          )
          PY
          python /tmp/materialize.py
          python -m py_compile szl_immune.py tests/test_runtime_fallback_source_attribution.py
          git diff --check
          rm -f -- .github/workflows/_materialize_runtime_fallback_attribution_once.yml
          git add .github/shared-source-payload-manifest.json
          git add .github/workflows/_materialize_runtime_fallback_attribution_once.yml
          git add szl_immune.py tests/test_runtime_fallback_source_attribution.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -m "fix(runtime): report bounded fallback source exactly"
          git push origin "HEAD:fix/runtime-fallback-source-attribution-20260905"
