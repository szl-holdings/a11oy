name: Repair Browserslist Lock on Holographic Branch

on:
  push:
    branches:
      - feat/holographic-experience-v2-bound
    paths:
      - ".github/workflows/repair-browserslist-lock-on-branch.yml"

permissions:
  contents: write

concurrency:
  group: repair-browserslist-lock-holographic-branch
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/holographic-experience-v2-bound
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Add patched resolution contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("package.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload.setdefault("pnpm", {}).setdefault("overrides", {})["browserslist@<=4.28.6"] = "4.28.7"
          payload.setdefault("overrides", {})["browserslist@<=4.28.6"] = "4.28.7"
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Regenerate lockfile with pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm --version
          pnpm install --lockfile-only --ignore-scripts

      - name: Prove vulnerable resolution is absent
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'browserslist@4.28.7:' pnpm-lock.yaml
          if grep -Eq 'browserslist@4\.28\.[0-6]:' pnpm-lock.yaml; then
            echo '::error::A vulnerable browserslist resolution remains in pnpm-lock.yaml.'
            grep -En 'browserslist@4\.28\.[0-6]:' pnpm-lock.yaml
            exit 1
          fi
          python3 -m json.tool package.json >/dev/null
          git diff --check

      - name: Commit authentic lockfile and remove one-shot controller
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-browserslist-lock-on-branch.yml
          git config user.name "SZL Dependency Repair Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add package.json pnpm-lock.yaml .github/workflows/repair-browserslist-lock-on-branch.yml
          git commit -s -m "fix(security): resolve browserslist at patched 4.28.7"
          git push origin HEAD:feat/holographic-experience-v2-bound
