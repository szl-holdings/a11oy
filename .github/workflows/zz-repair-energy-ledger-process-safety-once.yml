# SPDX-License-Identifier: Apache-2.0
# Retry 6: the retained predecessor uses the canonical sha256:<64hex> format.
name: Repair EnergyLedger rolling-restart safety once

on:
  push:
    branches:
      - fix/energy-ledger-transport-bound-20260904
    paths:
      - .github/workflows/zz-repair-energy-ledger-process-safety-once.yml

permissions:
  contents: write

concurrency:
  group: repair-energy-ledger-process-safety-once
  cancel-in-progress: false

jobs:
  repair:
    name: cross-process lock, forensic reset, and bounded read proof
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/energy-ledger-transport-bound-20260904
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Apply bounded process-safety repair
        run: |
          set -euo pipefail
          python tools/patch_energy_ledger_process_safety.py
          python tools/patch_energy_ledger_rotation_compat.py
          python tools/patch_energy_ledger_runtime_name.py
          python tools/patch_energy_ledger_digest_shape.py

      - name: Install exact CI dependency closure
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r .github/requirements/ci-core.txt

      - name: Expose first append contract
        run: |
          python - <<'PY'
          import json
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path
          from szl_energy_ledger import EnergyLedger, JobRecord

          with tempfile.TemporaryDirectory() as directory:
              path = str(Path(directory) / "energy.jsonl")
              now = 1_000_000.0
              job = JobRecord(
                  node="diagnostic",
                  joules_measured=1000.0,
                  joules_label="measured",
                  tokens=10,
                  wall_s=1.0,
                  ts=datetime.fromtimestamp(now - 1.0, tz=timezone.utc).isoformat(),
                  model="diagnostic",
                  nvml_age_s=1.0,
              )
              ledger = EnergyLedger(path=path)
              result = ledger.append_job(job, now=now)
              print(json.dumps(result, indent=2, sort_keys=True, default=str))
              if not result.get("appended"):
                  raise SystemExit("first append failed closed: " + str(result.get("message") or result.get("error")))
          PY

      - name: Prove concurrency, recovery, persistence, and response bounds
        run: |
          set -euo pipefail
          python -m py_compile \
            szl_energy_ledger.py \
            szl_energy_ledger_recovery.py \
            szl_durable_ledger.py \
            tests/test_energy_ledger_process_safety.py
          python -m pytest -q \
            test_energy_ledger.py \
            tests/test_durable_ledger.py \
            test_energy_wire_operator_ledger.py \
            tests/test_energy_ledger_process_safety.py
          python szl_energy_ledger.py >/tmp/energy-selftest.json
          python - <<'PY'
          from pathlib import Path
          source = Path('szl_energy_ledger.py').read_text(encoding='utf-8')
          docker = Path('Dockerfile').read_text(encoding='utf-8')
          for marker in (
              'exclusive_writer_lock',
              'INVALID_PRIOR_GENERATION_QUARANTINED',
              'WRITER_LOCK_TIMEOUT',
              'MAX_LEDGER_PAGE_LIMIT',
              'ledger/summary',
              'ROTATED_SEGMENTS_PRESENT',
              'retention_anchor',
              'first_prev.startswith("sha256:")',
          ):
              assert marker in source, marker
          assert 'szl_energy_ledger_recovery.py' in docker
          assert 'return get_ledger().summary()' in source
          assert 'Path(self.path).name' not in source
          PY
          git diff --check

      - name: Commit only durable repair
        run: |
          set -euo pipefail
          git rm tools/patch_energy_ledger_process_safety.py
          git rm tools/patch_energy_ledger_rotation_compat.py
          git rm tools/patch_energy_ledger_runtime_name.py
          git rm tools/patch_energy_ledger_digest_shape.py
          git rm .github/workflows/zz-repair-energy-ledger-process-safety-once.yml
          git add \
            szl_energy_ledger.py \
            szl_energy_ledger_recovery.py \
            tests/test_energy_ledger_process_safety.py \
            Dockerfile
          git config user.name "SZL Energy Ledger Recovery Controller"
          git config user.email "stephenlutar2@gmail.com"
          git commit \
            -m "fix(energy): serialize writers and quarantine forked generations" \
            -m "Use a bounded POSIX writer lease, strict durable-tail reload, explicit retained-generation anchors, digest-bound forensic quarantine, reset receipts, persist-before-memory acknowledgement, and capped cursor pages. Preserve the bounded rotating store and fail closed on unavailable storage." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:fix/energy-ledger-transport-bound-20260904
