name: HF Vertical Frontier v3 contract

"on":
  pull_request:
    branches: [main]
    paths:
      - scripts/hf_publish_vertical_flagships_v4.py
      - scripts/hf_publish_vertical_services.py
      - scripts/hf_publish_vertical_services_frontier_v3.py
      - tests/test_hf_publish_vertical_flagships_v4.py
      - tests/test_hf_frontier_v3_pr_trigger.py
      - .github/workflows/hf-frontier-v3.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-vertical-frontier-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Lock exact source, aliases, sources, and non-authority
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install exact test runner
        run: python -m pip install --disable-pip-version-check --no-cache-dir pytest==8.4.1

      - name: Compile publisher chain
        run: >-
          python -m py_compile
          scripts/hf_publish_vertical_flagships_v4.py
          scripts/hf_publish_vertical_services.py
          scripts/hf_publish_vertical_services_frontier_v3.py

      - name: Prove frontier-v3 publication contract
        run: >-
          python -m pytest
          tests/test_hf_publish_vertical_flagships_v4.py
          tests/test_hf_frontier_v3_pr_trigger.py
          -q
