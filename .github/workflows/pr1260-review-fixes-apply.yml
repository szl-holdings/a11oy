name: PR1260 review fixes apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - a11oy_landing.html
      - scripts/apply_pr1260_review_fixes.py
      - .github/workflows/pr1260-review-fixes-apply.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-review-fixes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'fix/frontdoor-truth-mobile-clean-2026-08-11')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/frontdoor-truth-mobile-clean-2026-08-11
          fetch-depth: 0
      - name: Apply review repairs
        run: python3 scripts/apply_pr1260_review_fixes.py a11oy_landing.html
      - name: Verify repair is idempotent
        run: python3 scripts/apply_pr1260_review_fixes.py a11oy_landing.html --check
      - name: Commit branch-only repair when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- a11oy_landing.html; then
            echo 'Review repairs already materialized.'
            exit 0
          fi
          git config user.name 'Stephen P. Lutar Jr.'
          git config user.email 'stephen@szlholdings.com'
          git add a11oy_landing.html
          git commit -m 'fix(frontdoor): honor mobile cascade and measured evidence' \
            -m 'Signed-off-by: Stephen P. Lutar Jr. <stephen@szlholdings.com>'
          git push origin HEAD:fix/frontdoor-truth-mobile-clean-2026-08-11
