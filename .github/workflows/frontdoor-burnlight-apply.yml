name: A11oy front-door Burn-Light apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - a11oy_landing.html
      - config/a11oy-frontdoor/PATCH_SPEC.json
      - scripts/repair_a11oy_frontdoor.py
      - scripts/check_a11oy_frontdoor_truth.py
      - tests/test_a11oy_frontdoor_truth.py
      - .github/workflows/frontdoor-burnlight-apply.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/frontdoor-truth-mobile-2026-08-11'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/frontdoor-truth-mobile-2026-08-11
          fetch-depth: 0
      - name: Apply exact-anchor repair
        run: python3 scripts/repair_a11oy_frontdoor.py a11oy_landing.html
      - name: Verify truth and mobile contract
        run: python3 scripts/check_a11oy_frontdoor_truth.py a11oy_landing.html
      - name: Run adversarial contract tests
        run: python3 -m unittest -v tests/test_a11oy_frontdoor_truth.py
      - name: Commit branch-only repair when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- a11oy_landing.html; then
            echo 'Landing already satisfies Burn-Light contract.'
            exit 0
          fi
          git config user.name 'szl-holdings-release-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a11oy_landing.html
          git commit -m 'fix(frontdoor): truth-bound receipts and universal mobile layout'
          git push origin HEAD:fix/frontdoor-truth-mobile-2026-08-11
