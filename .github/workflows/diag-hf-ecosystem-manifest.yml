name: HF Ecosystem Manifest — Bounded Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diag-hf-ecosystem-manifest.yml

permissions:
  contents: write

concurrency:
  group: diag-hf-ecosystem-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and publish reviewed public-estate manifest
    if: >-
      github.repository == 'szl-holdings/a11oy' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/one-lathe-rekor-index-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Generate exact live candidate and bounded semantic diff
        run: |
          set -euo pipefail
          mkdir -p reports/hf-ecosystem-candidate
          python3 scripts/audit_huggingface_ecosystem.py \
            --output reports/hf-ecosystem-candidate/huggingface-ecosystem-manifest.json
          diff -u \
            docs/huggingface-ecosystem-manifest.json \
            reports/hf-ecosystem-candidate/huggingface-ecosystem-manifest.json \
            > reports/hf-ecosystem-candidate/manifest.diff || true
          python3 - <<'PY'
          import json
          from pathlib import Path

          old = json.loads(Path('docs/huggingface-ecosystem-manifest.json').read_text())
          new = json.loads(Path('reports/hf-ecosystem-candidate/huggingface-ecosystem-manifest.json').read_text())
          summary = {
              'old_observed_at': old.get('observedAt'),
              'new_observed_at': new.get('observedAt'),
              'old_counts': old.get('counts'),
              'new_counts': new.get('counts'),
              'added': {},
              'removed': {},
              'changed_cards': {},
          }
          for kind in ('models', 'datasets', 'spaces'):
              old_items = {item['id']: item for item in old.get('inventory', {}).get(kind, [])}
              new_items = {item['id']: item for item in new.get('inventory', {}).get(kind, [])}
              summary['added'][kind] = sorted(set(new_items) - set(old_items))
              summary['removed'][kind] = sorted(set(old_items) - set(new_items))
              summary['changed_cards'][kind] = sorted(
                  item_id for item_id in set(old_items) & set(new_items)
                  if old_items[item_id].get('cardSemanticSha256') != new_items[item_id].get('cardSemanticSha256')
              )
          Path('reports/hf-ecosystem-candidate/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2, sort_keys=True))

          assert summary['old_counts'] == summary['new_counts'], summary
          assert not any(summary['added'].values()), summary
          assert not any(summary['removed'].values()), summary
          assert summary['changed_cards'] == {
              'models': [],
              'datasets': [],
              'spaces': ['SZLHOLDINGS/immune'],
          }, summary
          PY
      - name: Verify the generated candidate is internally valid
        run: >-
          python3 scripts/audit_huggingface_ecosystem.py
          --check
          --output reports/hf-ecosystem-candidate/huggingface-ecosystem-manifest.json
      - name: Upload immutable candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-ecosystem-candidate-${{ github.run_id }}
          path: reports/hf-ecosystem-candidate
          if-no-files-found: error
          retention-days: 14
      - name: Create one GitHub-signed manifest refresh commit
        id: commit
        shell: python
        run: |
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          candidate = Path(
              'reports/hf-ecosystem-candidate/huggingface-ecosystem-manifest.json'
          ).read_bytes()
          query = '''
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid url }
            }
          }
          '''
          variables = {
              'input': {
                  'branch': {
                      'repositoryNameWithOwner': os.environ['GITHUB_REPOSITORY'],
                      'branchName': os.environ['HEAD_BRANCH'],
                  },
                  'message': {
                      'headline': 'docs(hf): refresh exact public ecosystem evidence',
                      'body': (
                          'Refresh the generated public-only Hugging Face estate '
                          'snapshot after the verified IMMUNE Space card license '
                          'alignment. Inventory membership and counts are unchanged.\n\n'
                          'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
                      ),
                  },
                  'expectedHeadOid': os.environ['EXPECTED_HEAD'],
                  'fileChanges': {
                      'additions': [{
                          'path': 'docs/huggingface-ecosystem-manifest.json',
                          'contents': base64.b64encode(candidate).decode('ascii'),
                      }],
                  },
              },
          }
          request = urllib.request.Request(
              'https://api.github.com/graphql',
              data=json.dumps({'query': query, 'variables': variables}).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'a11oy-hf-manifest-refresh/1',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.loads(response.read())
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode('utf-8', errors='replace')[:4000]
              print(f'GraphQL HTTP {exc.code}: {detail}')
              raise SystemExit(1) from exc
          if payload.get('errors'):
              print(json.dumps(payload['errors'], indent=2))
              raise SystemExit(1)
          commit = payload['data']['createCommitOnBranch']['commit']
          print(json.dumps(commit, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"sha={commit['oid']}\n")
      - name: Verify exact branch head and signed commit
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          observed="$(gh api "repos/$GITHUB_REPOSITORY/branches/$HEAD_BRANCH" --jq .commit.sha)"
          test "$observed" = "$COMMIT_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq .commit.verification.verified)" = 'true'
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq .commit.verification.reason)" = 'valid'
