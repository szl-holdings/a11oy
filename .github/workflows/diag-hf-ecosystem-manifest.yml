name: HF Ecosystem Manifest — Bounded Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diag-hf-ecosystem-manifest.yml

permissions:
  contents: read

concurrency:
  group: diag-hf-ecosystem-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate current public-estate manifest candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Generate exact live candidate and semantic diff
        run: |
          set -euo pipefail
          mkdir -p reports/hf-ecosystem-candidate
          python3 scripts/audit_huggingface_ecosystem.py \
            --output reports/hf-ecosystem-candidate/huggingface-ecosystem-manifest.json
          diff -u \
            docs/huggingface-ecosystem-manifest.json \
            reports/hf-ecosystem-candidate/huggingface-ecosystem-manifest.json \
            > reports/hf-ecosystem-candidate/manifest.diff || true
          python3 - <<'PY'
          import json
          from pathlib import Path

          old = json.loads(Path('docs/huggingface-ecosystem-manifest.json').read_text())
          new = json.loads(Path('reports/hf-ecosystem-candidate/huggingface-ecosystem-manifest.json').read_text())
          summary = {
              'old_observed_at': old.get('observedAt'),
              'new_observed_at': new.get('observedAt'),
              'old_counts': old.get('counts'),
              'new_counts': new.get('counts'),
              'added': {},
              'removed': {},
              'changed_cards': {},
          }
          for kind in ('models', 'datasets', 'spaces'):
              old_items = {item['id']: item for item in old.get('inventory', {}).get(kind, [])}
              new_items = {item['id']: item for item in new.get('inventory', {}).get(kind, [])}
              summary['added'][kind] = sorted(set(new_items) - set(old_items))
              summary['removed'][kind] = sorted(set(old_items) - set(new_items))
              summary['changed_cards'][kind] = sorted(
                  item_id for item_id in set(old_items) & set(new_items)
                  if old_items[item_id].get('cardSemanticSha256') != new_items[item_id].get('cardSemanticSha256')
              )
          Path('reports/hf-ecosystem-candidate/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Verify the generated candidate is internally valid
        run: >-
          python3 scripts/audit_huggingface_ecosystem.py
          --check
          --output reports/hf-ecosystem-candidate/huggingface-ecosystem-manifest.json
      - name: Upload immutable candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-ecosystem-candidate-${{ github.run_id }}
          path: reports/hf-ecosystem-candidate
          if-no-files-found: error
          retention-days: 14
