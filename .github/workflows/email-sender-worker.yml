#
# GitOps for the szl-email-sender Worker: test every change, deploy only the
# exact commit that reached main, then fail unless the live Worker reports that
# exact 40-character SHA. Owner prerequisites (secrets, token scopes, the
# cloudflare-production environment) are listed in ops/email-sender-worker/README.md.
name: Email sender worker

on:
  pull_request:
    paths:
      - '.github/workflows/email-sender-worker.yml'
      - 'ops/email-sender-worker/**'
      - 'scripts/verify_worker_revision.py'
      - 'tests/test_verify_worker_revision.py'
      - 'tests/test_email_worker_account_resolution.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/email-sender-worker.yml'
      - 'ops/email-sender-worker/**'
      - 'scripts/verify_worker_revision.py'
      - 'tests/test_verify_worker_revision.py'
      - 'tests/test_email_worker_account_resolution.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-sender-worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test MIME, auth, and the workerd send_email contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: false
          cache: npm
          cache-dependency-path: ops/email-sender-worker/package-lock.json
      - name: Install the locked toolchain
        working-directory: ops/email-sender-worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit tests with a mocked SEND_EMAIL binding
        working-directory: ops/email-sender-worker
        run: npm test
      - name: Bundle the exact upload without deploying
        working-directory: ops/email-sender-worker
        run: npm run build
      - name: Run the bundle in workerd with the local send_email binding
        working-directory: ops/email-sender-worker
        run: npm run test:workerd
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install exact core test dependencies
        run: python -m pip install --require-hashes -r .github/requirements/ci-core.txt
      - name: Test readback and deployment toolchain contracts
        run: python -m pytest tests/test_verify_worker_revision.py tests/test_managed_alert_transport_workflows.py tests/test_email_worker_account_resolution.py -q

  deploy:
    name: Deploy szl-email-sender and read back the live revision
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cloudflare-production
    concurrency:
      group: deploy-szl-email-sender
      cancel-in-progress: false
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prove exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: false
      - name: Install the locked Wrangler
        id: wrangler
        working-directory: ops/email-sender-worker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          locked_version="$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")"
          test "$(node -p "require('./node_modules/wrangler/package.json').version")" = "$locked_version"
          printf 'version=%s\n' "$locked_version" >> "$GITHUB_OUTPUT"
      - name: Resolve Cloudflare deployment account
        id: cloudflare-account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::cloudflare-production needs CLOUDFLARE_API_TOKEN (see ops/email-sender-worker/README.md)." >&2
            exit 1
          fi

          account_id="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -n "$account_id" ]; then
            if [[ ! "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
              echo "::error::CLOUDFLARE_ACCOUNT_ID must be exactly 32 hexadecimal characters." >&2
              exit 1
            fi
          else
            response_file="$(mktemp)"
            trap 'rm -f "$response_file"' EXIT
            if ! curl --fail --silent --show-error --retry 2 --retry-all-errors \
              --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Accept: application/json" \
              "https://api.cloudflare.com/client/v4/accounts?page=1&per_page=5" \
              --output "$response_file"; then
              echo "::error::Cloudflare account discovery request failed." >&2
              exit 1
            fi
            account_id="$(python - "$response_file" <<'PY'
          import json
          import re
          import sys

          try:
              with open(sys.argv[1], "rb") as response:
                  raw = response.read(1024 * 1024 + 1)
              if len(raw) > 1024 * 1024:
                  raise SystemExit("Cloudflare account discovery response exceeds its size limit")
              payload = json.loads(raw)
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              raise SystemExit("invalid Cloudflare account discovery response") from None

          if not isinstance(payload, dict) or payload.get("success") is not True:
              raise SystemExit("Cloudflare account discovery response was not successful")

          accounts = payload.get("result")
          if not isinstance(accounts, list) or len(accounts) != 1:
              raise SystemExit("Cloudflare account discovery must return exactly one account")

          info = payload.get("result_info")
          if info is not None:
              if not isinstance(info, dict):
                  raise SystemExit("Cloudflare account discovery pagination is malformed")
              if "per_page" in info and (type(info["per_page"]) is not int or info["per_page"] != 5):
                  raise SystemExit("Cloudflare account discovery pagination does not match the request")
              for field in ("count", "page", "total_count", "total_pages"):
                  if field in info and (type(info[field]) is not int or info[field] != 1):
                      raise SystemExit("Cloudflare account discovery must return exactly one account")

          account = accounts[0]
          account_id = account.get("id") if isinstance(account, dict) else None
          if not isinstance(account_id, str) or re.fullmatch(r"[0-9a-fA-F]{32}", account_id) is None:
              raise SystemExit("Cloudflare account discovery returned a malformed account id")

          print(account_id)
          PY
          )"
          fi

          if [[ ! "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::resolved Cloudflare account id is malformed." >&2
            exit 1
          fi
          echo "::add-mask::$account_id"
          printf 'account_id=%s\n' "$account_id" >> "$GITHUB_OUTPUT"
      - name: Deploy the exact commit with SOURCE_REVISION
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        env:
          SOURCE_REVISION: ${{ github.sha }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare-account.outputs.account_id }}
          workingDirectory: ops/email-sender-worker
          packageManager: npm
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          command: deploy --message ${{ github.sha }}
          vars: |
            SOURCE_REVISION
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Read back the live revision and readiness
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${DEPLOYMENT_URL}" =~ ^https://szl-email-sender\.[a-z0-9-]+\.workers\.dev$ ]]; then
            echo "::error::wrangler reported no workers.dev deployment URL for szl-email-sender."
            exit 1
          fi
          python scripts/verify_worker_revision.py \
            --url "${DEPLOYMENT_URL}/.well-known/szl-worker-revision" \
            --worker szl-email-sender \
            --expect-revision "${GITHUB_SHA}" \
            --require-ready
