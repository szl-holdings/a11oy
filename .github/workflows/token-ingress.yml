name: Token ingress contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "szl_token_ingress.py"
      - "tests/test_token_ingress.py"
      - ".github/workflows/token-ingress.yml"

permissions:
  contents: read

jobs:
  token-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact core test dependencies
        run: python -m pip install --require-hashes -r .github/requirements/ci-core.txt
      - name: Compile ingress module
        run: python -m py_compile szl_token_ingress.py tests/test_token_ingress.py
      - name: Run ingress contract tests
        run: pytest tests/test_token_ingress.py -q
      - name: Reject whitespace errors
        run: git diff --check origin/main...HEAD
