name: Token ingress contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "routers/token_ingress.py"
      - "routers/token_ingress_core.py"
      - "routers/frontier_reads.py"
      - "routers/__init__.py"
      - "tests/test_token_ingress.py"
      - "tests/test_token_ingress_route_wiring.py"
      - ".github/workflows/token-ingress.yml"

permissions:
  contents: read

jobs:
  token-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact core test dependencies
        run: python -m pip install --require-hashes -r .github/requirements/ci-core.txt
      - name: Compile ingress runtime
        run: >-
          python -m py_compile
          routers/token_ingress_core.py
          routers/token_ingress.py
          routers/frontier_reads.py
          tests/test_token_ingress.py
          tests/test_token_ingress_route_wiring.py
      - name: Run ingress and assembled-route contract tests
        run: pytest tests/test_token_ingress.py tests/test_token_ingress_route_wiring.py -q
      - name: Reject whitespace errors in ingress changes
        run: >-
          git diff --check origin/main...HEAD --
          routers/token_ingress_core.py
          routers/token_ingress.py
          routers/frontier_reads.py
          routers/__init__.py
          tests/test_token_ingress.py
          tests/test_token_ingress_route_wiring.py
          .github/workflows/token-ingress.yml
