name: HF frontend live canary v1

on:
  pull_request:
    branches: [main]
    paths:
      - a11oy_landing.html
      - scripts/audit_hf_frontend_live_canary_v1.py
      - scripts/audit_hf_space_frontends_v1.py
      - tests/test_hf_frontend_live_canary_v1.py
      - docs/HUGGINGFACE_FRONTEND_LIVE_CANARY_V1.md
      - .github/workflows/hf-frontend-live-canary-v1.yml
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Sync and Relock Canonical Hugging Face Space"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hf-frontend-live-canary-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout pull-request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned focused-test dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt

      - name: Verify live-canary logic offline
        run: |
          python3 -m py_compile scripts/audit_hf_frontend_live_canary_v1.py
          python3 -m pytest -q tests/test_hf_frontend_live_canary_v1.py

  trusted-contract:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.verify-source.outputs.source_sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Resolve current protected main before checkout
        id: resolve-source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SYNC_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SYNC_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SYNC_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          if [ "$EVENT_NAME" = workflow_run ]; then
            test "$SYNC_CONCLUSION" = success
            test "$SYNC_HEAD_BRANCH" = main
            [[ "$SYNC_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            if ! test "$SYNC_HEAD_SHA" = "$current_main"; then
              echo "stale=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Sync head $SYNC_HEAD_SHA was superseded by main $current_main before this canary started; skipping the stale run. The successor sync triggers its own canary."
              exit 0
            fi
          fi
          echo "stale=false" >> "$GITHUB_OUTPUT"
          echo "source_sha=$current_main" >> "$GITHUB_OUTPUT"

      - name: Checkout literal protected main
        if: ${{ steps.resolve-source.outputs.stale != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Verify protected main did not move across checkout
        id: verify-source
        if: ${{ steps.resolve-source.outputs.stale != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRECHECK_SOURCE_SHA: ${{ steps.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if ! test "$checked_out" = "$PRECHECK_SOURCE_SHA" || ! test "$current_main" = "$PRECHECK_SOURCE_SHA"; then
            echo "::notice::Main moved across checkout (precheck $PRECHECK_SOURCE_SHA, now $current_main); skipping the stale canary run."
            exit 0
          fi
          echo "source_sha=$checked_out" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: ${{ steps.resolve-source.outputs.stale != 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned focused-test dependencies
        if: ${{ steps.resolve-source.outputs.stale != 'true' }}
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt

      - name: Verify trusted live-canary logic offline
        if: ${{ steps.resolve-source.outputs.stale != 'true' }}
        run: |
          python3 -m py_compile scripts/audit_hf_frontend_live_canary_v1.py
          python3 -m pytest -q tests/test_hf_frontend_live_canary_v1.py

  live-canary:
    if: ${{ github.event_name != 'pull_request' && needs.trusted-contract.result == 'success' && needs.trusted-contract.outputs.source_sha != '' }}
    needs: trusted-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SOURCE_SHA: ${{ needs.trusted-contract.outputs.source_sha }}
      REPORT_DIR: evidence/hf-frontend-live-canary
      ISSUE_TITLE: '[HF-FRONTEND-CANARY] Universal viewport or source drift'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Require exact current protected main
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$checked_out" = "$EXPECTED_SOURCE_SHA"
          if [ "$current_main" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Canary source ${EXPECTED_SOURCE_SHA} was superseded by main ${current_main}; skipping instead of auditing a stale checkout."
            exit 0
          fi

      - name: Set up Python
        if: ${{ steps.preflight.outputs.stale != 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install exact browser controller
        if: ${{ steps.preflight.outputs.stale != 'true' }}
        run: python3 -m pip install --disable-pip-version-check 'playwright==1.55.0'

      - name: Resolve system Chromium
        if: ${{ steps.preflight.outputs.stale != 'true' }}
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$chrome"
          echo "path=$chrome" >> "$GITHUB_OUTPUT"
          "$chrome" --version

      - name: Audit all live viewport classes and source identities
        if: ${{ steps.preflight.outputs.stale != 'true' }}
        id: audit
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          set +e
          python3 scripts/audit_hf_frontend_live_canary_v1.py \
            --chrome "$CHROME" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir "$REPORT_DIR"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable browser evidence
        id: evidence
        if: ${{ always() && steps.preflight.outputs.stale != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-frontend-live-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Synchronize deterministic drift issue
        id: issue-sync
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        shell: bash
        env:
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          set -euo pipefail
          issue_output="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --limit 100 \
            --search '"[HF-FRONTEND-CANARY] Universal viewport or source drift" in:title' \
            --json number,state,title \
            --jq '.[] | select(.title == "[HF-FRONTEND-CANARY] Universal viewport or source drift") | "\(.number)\t\(.state)"')"
          issue_matches=()
          if [ -n "$issue_output" ]; then
            mapfile -t issue_matches <<< "$issue_output"
          fi
          if [ "${#issue_matches[@]}" -gt 1 ]; then
            echo "::error::Multiple deterministic frontend-canary issues exist; refusing ambiguous mutation."
            exit 1
          fi
          number=""
          issue_state=""
          if [ "${#issue_matches[@]}" -eq 1 ]; then
            IFS=$'\t' read -r number issue_state <<< "${issue_matches[0]}"
          fi
          python3 - <<'PY' > /tmp/hf-frontend-canary.md
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('evidence/hf-frontend-live-canary/report.json').read_text())
          print('## Hugging Face universal frontend live canary')
          print()
          print(f"- Protected source: `{os.environ['EXPECTED_SOURCE_SHA']}`")
          print(f"- Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          print(f"- Status: `{report['summary']['status']}`")
          print()
          print('```json')
          print(json.dumps(report['summary'], indent=2, sort_keys=True))
          print('```')
          if report.get('identity_failures'):
              print('\n### Identity failures\n')
              print('```json')
              print(json.dumps(report['identity_failures'], indent=2, sort_keys=True))
              print('```')
          page_failures = [
              {
                  'surface': item['surface'],
                  'viewport': item['viewport'],
                  'failures': item.get('failures') or [],
              }
              for item in report['results']
              if item.get('failures')
          ]
          if page_failures:
              print('\n### Page failures\n')
              print('```json')
              print(json.dumps(page_failures, indent=2, sort_keys=True))
              print('```')
          print('\nThe canary does not mutate any Hugging Face resource or source branch. It may create, reopen, edit, or close this tracking issue.')
          PY
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_main" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Main advanced to ${current_main}; skipping issue mutation for superseded source ${EXPECTED_SOURCE_SHA}. The successor canary files or closes the issue."
            exit 0
          fi
          if [ "${EXIT_CODE:-1}" = '0' ]; then
            if [ -n "$number" ] && [ "$issue_state" = "OPEN" ]; then
              gh issue close "$number" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed \
                --comment "All live viewport and immutable source-identity gates passed for ${EXPECTED_SOURCE_SHA} in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            fi
          elif [ -z "$number" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body-file /tmp/hf-frontend-canary.md
          else
            if [ "$issue_state" = "CLOSED" ]; then
              gh issue reopen "$number" --repo "$GITHUB_REPOSITORY"
            fi
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file /tmp/hf-frontend-canary.md
          fi

      - name: Enforce the live contract
        if: ${{ always() && steps.preflight.outputs.stale != 'true' && steps.issue-sync.outputs.stale != 'true' }}
        env:
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          code="${EXIT_CODE:-1}"
          if [ "$code" -ne 0 ]; then
            echo "::error::Live Hugging Face frontend canary failed with exit $code."
            exit "$code"
          fi
          echo 'Live Hugging Face frontend canary passed.'
