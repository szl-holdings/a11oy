name: HF frontend live canary v1

on:
  push:
    branches: [main]
    paths:
      - scripts/audit_hf_frontend_live_canary_v1.py
      - tests/test_hf_frontend_live_canary_v1.py
      - docs/HUGGINGFACE_FRONTEND_LIVE_CANARY_V1.md
      - docs/HUGGINGFACE_UNIVERSAL_FRONTEND_CONTRACT_V1.md
      - docs/huggingface-frontend-remediation-queue-v1.json
      - .github/workflows/hf-frontend-live-canary-v1.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/audit_hf_frontend_live_canary_v1.py
      - tests/test_hf_frontend_live_canary_v1.py
      - docs/HUGGINGFACE_FRONTEND_LIVE_CANARY_V1.md
      - docs/HUGGINGFACE_UNIVERSAL_FRONTEND_CONTRACT_V1.md
      - docs/huggingface-frontend-remediation-queue-v1.json
      - .github/workflows/hf-frontend-live-canary-v1.yml
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: hf-frontend-live-canary-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned focused-test dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt

      - name: Verify live-canary logic offline
        run: |
          python3 -m py_compile scripts/audit_hf_frontend_live_canary_v1.py
          python3 -m pytest -q tests/test_hf_frontend_live_canary_v1.py

  live-canary:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_DIR: evidence/hf-frontend-live-canary
      ISSUE_TITLE: '[HF-FRONTEND-CANARY] Universal viewport or source drift'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install exact browser controller
        run: python3 -m pip install --disable-pip-version-check 'playwright==1.55.0'

      - name: Resolve system Chromium
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$chrome"
          echo "path=$chrome" >> "$GITHUB_OUTPUT"
          "$chrome" --version

      - name: Audit all live viewport classes and source identities
        id: audit
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          set +e
          python3 scripts/audit_hf_frontend_live_canary_v1.py \
            --chrome "$CHROME" \
            --output-dir "$REPORT_DIR"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-frontend-live-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Synchronize deterministic drift issue
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          set -euo pipefail
          number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --limit 100 \
            --search '"[HF-FRONTEND-CANARY] Universal viewport or source drift" in:title' \
            --json number,title \
            --jq '.[] | select(.title == "[HF-FRONTEND-CANARY] Universal viewport or source drift") | .number' \
            | head -n 1)
          python3 - <<'PY' > /tmp/hf-frontend-canary.md
          import json
          from pathlib import Path
          report = json.loads(Path('evidence/hf-frontend-live-canary/report.json').read_text())
          print('## Hugging Face universal frontend live canary')
          print()
          print(f"- Protected source: `${{GITHUB_SHA}}`")
          print(f"- Run: ${{GITHUB_SERVER_URL}}/${{GITHUB_REPOSITORY}}/actions/runs/${{GITHUB_RUN_ID}}")
          print(f"- Status: `{report['summary']['status']}`")
          print()
          print('```json')
          print(json.dumps(report['summary'], indent=2, sort_keys=True))
          print('```')
          if report.get('identity_failures'):
              print('\n### Identity failures\n')
              print('```json')
              print(json.dumps(report['identity_failures'], indent=2, sort_keys=True))
              print('```')
          page_failures = [
              {
                  'surface': item['surface'],
                  'viewport': item['viewport'],
                  'failures': item.get('failures') or [],
              }
              for item in report['results']
              if item.get('failures')
          ]
          if page_failures:
              print('\n### Page failures\n')
              print('```json')
              print(json.dumps(page_failures, indent=2, sort_keys=True))
              print('```')
          print('\nThe workflow is read-only; no Hugging Face resource or source branch was changed.')
          PY
          if [ "${EXIT_CODE:-1}" = '0' ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed \
                --comment "All live viewport and immutable source-identity gates passed in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." || true
            fi
          elif [ -z "$number" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body-file /tmp/hf-frontend-canary.md
          else
            gh issue reopen "$number" --repo "$GITHUB_REPOSITORY" || true
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file /tmp/hf-frontend-canary.md
          fi

      - name: Enforce the live contract
        if: always()
        env:
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          code="${EXIT_CODE:-1}"
          if [ "$code" -ne 0 ]; then
            echo "::error::Live Hugging Face frontend canary failed with exit $code."
            exit "$code"
          fi
          echo 'Live Hugging Face frontend canary passed.'
