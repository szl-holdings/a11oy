# SPDX-License-Identifier: Apache-2.0
# Doctrine v11 LOCKED · Λ = Conjecture 1 (advisory)
#
# Audits the REAL dependency closure (Dockerfile pins + requirements.txt) for known
# vulnerabilities, and fails closed on anything that is not an explicitly registered,
# still-in-review accepted risk.
#
# Honest UNKNOWN over fabricated green: unpatchable findings are ACCEPTED IN A
# REGISTER with a reachability analysis and a review date — never silently ignored.
name: Dependency Audit

on:
  pull_request:
    paths:
    - requirements*.txt
    - Dockerfile
    - docs/DEPENDENCY_RISK_REGISTER.md
    - scripts/audit_closure_check.py
    - .github/workflows/dependency-audit.yml
  schedule:
  - cron: 17 6 * * 1
  workflow_dispatch: null
  merge_group:
    types:
    - checks_requested
permissions: read-all

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --no-cache-dir pip-audit==2.9.0

      - name: Assert the audit closure is the runtime install set
        shell: bash
        run: |
          set -euo pipefail
          # requirements-runtime.txt is the single source of truth: the Dockerfile
          # installs it with `pip install -r` and requirements-audit.txt includes it
          # with `-r`. Fails closed if any runtime pin is re-listed in either file.
          python scripts/audit_closure_check.py .

      - name: Verify the risk register is still in review window
        shell: bash
        run: |
          set -euo pipefail
          reg=docs/DEPENDENCY_RISK_REGISTER.md
          test -f "$reg" || { echo "::error::risk register missing"; exit 1; }
          rb=$(grep -oE 'review_by: [0-9]{4}-[0-9]{2}-[0-9]{2}' "$reg" | head -1 | awk '{print $2}')
          if [ -z "$rb" ]; then
            echo "::error::no review_by date in risk register"; exit 1
          fi
          today=$(date -u +%F)
          if [ "$today" \> "$rb" ]; then
            echo "::error::risk register review_by ${rb} has passed. Re-audit each accepted risk and move the date, or remediate. Accepted risks must not expire silently."
            exit 1
          fi
          echo "risk register in review window (review_by=${rb})"

      - name: pip-audit (fails closed on unregistered vulnerabilities)
        shell: bash
        run: |
          set -euo pipefail
          # Registered, upstream-unpatchable, reachability-scoped accepted risks.
          # Each MUST have a corresponding entry in docs/DEPENDENCY_RISK_REGISTER.md.
          # diskcache 5.6.3 / CVE-2025-69872: no fixed release exists; absent from the
          # default build (A11OY_REQUIRE_LOCAL_LLM=0).
          ACCEPTED="PYSEC-2026-2447"

          for id in $ACCEPTED; do
            grep -q "$id" docs/DEPENDENCY_RISK_REGISTER.md || {
              echo "::error::${id} is suppressed in CI but has no register entry"; exit 1; }
          done

          set +e
          python -m pip_audit -r requirements-audit.txt \
            --progress-spinner off \
            --ignore-vuln PYSEC-2026-2447
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::pip-audit found a vulnerability that is NOT a registered accepted risk. Remediate it, or add a reachability analysis to docs/DEPENDENCY_RISK_REGISTER.md and register the ID here."
            exit 1
          fi
          echo "no unregistered known vulnerabilities"

      - name: Prove pip-audit resolved every runtime pin at its exact version
        shell: bash
        run: |
          set -euo pipefail
          # A -r include the auditor skipped would otherwise look green. The JSON
          # report lists every dependency pip-audit resolved; each runtime pin must
          # be there at the pinned version.
          python -m pip_audit -r requirements-audit.txt \
            --progress-spinner off \
            --ignore-vuln PYSEC-2026-2447 \
            --format json --output "$RUNNER_TEMP/pip-audit.json"
          python scripts/audit_closure_check.py --audited-json "$RUNNER_TEMP/pip-audit.json" .

      - name: Report full findings (informational, never masks the gate)
        if: always()
        shell: bash
        run: |
          # Unsuppressed view, for the record. Does not affect job status.
          python -m pip_audit -r requirements-audit.txt --progress-spinner off || true
