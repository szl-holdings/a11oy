# SPDX-License-Identifier: Apache-2.0
name: Replace retired Anatomy origin once

on:
  push:
    branches:
      - fix/anatomy-creator-authority-v1-20260904
    paths:
      - .github/workflows/fix-anatomy-creator-origin-once.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/anatomy-creator-authority-v1-20260904
          fetch-depth: 0

      - name: Replace only the retired public origin in tracked text files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          excluded = {
              ".github/workflows/fix-anatomy-creator-origin-once.yml",
              ".github/workflows/smoke-monitor.yml",
              "tests/test_living_anatomy_flagship_policy.py",
          }
          old = "https://szlholdings-anatomy.hf.space"
          new = "https://betterwithage-anatomy.hf.space"
          changed = []
          paths = subprocess.check_output(
              ["git", "ls-files", "-z"], text=False
          ).split(b"\0")
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              if path.as_posix() in excluded:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
              changed.append(path.as_posix())

          if not changed:
              raise SystemExit("retired Anatomy origin was not found")
          print("updated tracked files:")
          for path in changed:
              print(path)
          PY
          git diff --check
          test -z "$(git grep -l 'https://szlholdings-anatomy.hf.space' -- ':!archive/**' ':!archives/**' ':!.github/workflows/fix-anatomy-creator-origin-once.yml' ':!.github/workflows/smoke-monitor.yml' ':!tests/test_living_anatomy_flagship_policy.py' || true)"

      - name: Commit the deterministic authority migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add --all
          git diff --cached --quiet && { echo "no migration changes"; exit 1; }
          git commit -s -m "fix(anatomy): replace the retired organization Space origin"
          git push origin HEAD:fix/anatomy-creator-authority-v1-20260904
