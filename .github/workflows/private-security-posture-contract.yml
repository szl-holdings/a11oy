name: Private security posture contract

on:
  pull_request:
    branches:
    - main
    paths:
    - .github/scripts/private_security_posture.py
    - .github/workflows/private-security-posture.yml
    - .github/workflows/private-security-posture-contract.yml
    - tests/test_private_security_posture.py
  push:
    branches:
    - main
    paths:
    - .github/scripts/private_security_posture.py
    - .github/workflows/private-security-posture.yml
    - .github/workflows/private-security-posture-contract.yml
    - tests/test_private_security_posture.py
  workflow_dispatch: {}
  merge_group:
    types:
    - checks_requested
    branches:
    - main
permissions:
  contents: read

concurrency:
  group: private-security-posture-contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  contract:
    name: Verify redaction and fail-closed alert observation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Enforce the posture controller contract
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_private_security_posture
          python -m py_compile .github/scripts/private_security_posture.py
          git diff --check
