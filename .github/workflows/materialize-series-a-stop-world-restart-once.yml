name: Materialize Series A stop-the-world restart once

on:
  push:
    branches:
      - fix/series-a-stop-the-world-restart-v1
    paths:
      - .github/workflows/materialize-series-a-stop-world-restart-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-series-a-stop-world-restart-once
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/series-a-stop-the-world-restart-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned test runtime
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt

      - name: Materialize serialized restart proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/prove_hf_series_a_restart.py)" = 0f5e3c56b526ff65bbe5f3b4609fa1a94ce142db
          test "$(git hash-object scripts/test_prove_hf_series_a_restart.py)" = 3bacdcc78a7b8d8628832c13d766c34cc4f6d739
          python -B tools/fix_series_a_materializer_syntax.py
          python -B -m py_compile tools/materialize_series_a_stop_world_restart.py
          python -B tools/materialize_series_a_stop_world_restart.py
          python -B -m py_compile scripts/prove_hf_series_a_restart.py scripts/test_prove_hf_series_a_restart.py scripts/test_series_a_stop_the_world_restart.py
          python -B -m pytest -q scripts/test_prove_hf_series_a_restart.py scripts/test_series_a_stop_the_world_restart.py
          git diff --check HEAD

      - name: Remove temporary materializers and commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-series-a-stop-world-restart-once.yml tools/fix_series_a_materializer_syntax.py tools/materialize_series_a_stop_world_restart.py
          git diff --check HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(series-a): serialize Hugging Face restart writers' -m 'Pause the A11oy Space, confirm PAUSED, and only then request the replacement runtime for both activation and durability proofs. Preserve exact pre-restart receipt recovery and prevent duplicate restart requests after a lost provider response.' -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:fix/series-a-stop-the-world-restart-v1
