name: Series-A Live Control Plane

on:
  pull_request:
    branches: [main]
    paths:
      - routers/series_a_control_plane.py
      - routers/series_a_web/**
      - routers/frontier_reads.py
      - routers/__init__.py
      - scripts/configure_hf_series_a_runtime.py
      - scripts/prove_hf_series_a_restart.py
      - scripts/test_configure_hf_series_a_runtime.py
      - scripts/test_prove_hf_series_a_restart.py
      - tests/test_canonical_a11oy_relock.py
      - tests/test_series_a_control_plane.py
      - .github/workflows/hf-sync.yml
      - .github/workflows/series-a-live-control-plane.yml
      - .github/workflows/series-a-restart-proof.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: series-a-live-control-plane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact test runtime
        run: python -m pip install --disable-pip-version-check 'fastapi==0.137.1' 'starlette==1.3.1' 'httpx==0.28.1' 'cryptography==50.0.0' 'huggingface_hub==1.23.0' 'pytest==9.0.2'
      - name: Compile and test
        run: |
          python -m compileall -q .github/scripts/verify_canonical_a11oy.py routers/series_a_control_plane.py scripts/configure_hf_series_a_runtime.py scripts/prove_hf_series_a_restart.py scripts/test_configure_hf_series_a_runtime.py scripts/test_prove_hf_series_a_restart.py tests/test_canonical_a11oy_relock.py tests/test_series_a_control_plane.py
          python -m pytest -q scripts/test_configure_hf_series_a_runtime.py scripts/test_prove_hf_series_a_restart.py tests/test_canonical_a11oy_relock.py tests/test_series_a_control_plane.py
          git diff --check
      - name: Prove no mock framework imports
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          banned = {"unittest.mock", "responses", "respx", "pytest_mock"}
          found = []
          for filename in (
              "routers/series_a_control_plane.py",
              "tests/test_series_a_control_plane.py",
          ):
              tree = ast.parse(Path(filename).read_text(encoding="utf-8"), filename)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [alias.name for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [node.module or ""]
                  else:
                      continue
                  for name in names:
                      if name in banned or any(name.startswith(value + ".") for value in banned):
                          found.append(f"{filename}:{node.lineno}:{name}")
          if found:
              raise SystemExit("mock framework imports found: " + ", ".join(found))
          PY
      - name: Prove browser source has no credential transit
        run: |
          ! grep -REn 'authorization|private[_-]?key|secret[_-]?value|access[_-]?token' routers/series_a_web
      - name: JavaScript syntax
        run: node --check routers/series_a_web/app.js
