# .gitleaks.toml — SZL Holdings secret-scanning allowlist.
#
# Doctrine v11 LOCKED 749/14/163 · SLSA L1 honest
# Signed-off-by: Yachay <yachay@szlholdings.ai>
# Co-Authored-By: Perplexity Computer Agent <agent@perplexity.ai>
#
# HONESTY OVER CHECKLIST: this file does NOT weaken secret detection. It uses
# the full upstream gitleaks default ruleset and only exempts demonstrable
# NON-secrets that the `generic-api-key` heuristic flags because they contain
# the substring "key":
#
#   • did:key public DID identifiers (z6Mk… multibase) — public by definition
#   • `keyid` labels (e.g. "szl-pepr-mldsa65-v1", "szlholdings-ec-p256") —
#     these name a key, they are not key material
#   • PLACEHOLDER / test signature stubs (sig bytes are 0xAB fill / "PLACEHOLDER")
#   • `receiptKeySecret: <name>` — the NAME of a Kubernetes Secret resource (the
#     real key material lives in the cluster Secret / Vault, never in git)
#   • a single DOCUMENTED demo HMAC key in AGENTS.md (base64 decodes to the
#     literal string "szl-dev-demo-key-2026-warhacker" — a throwaway demo value)
#   • problem-catalog slugs in serve.py ("key": "mesh-k1-failure" etc.) — these
#     are short kebab-case identifiers in a static problem list, not credentials
#   • test-fixture private keys under testdata/ (*.test.key) — mock keys
#   • Python TYPE ANNOTATIONS naming a key class (e.g. `private_key:
#     "Ed25519PrivateKey"`) — these are forward-ref type hints, NOT key material
#   • SHA-256 fingerprints of PUBLIC cosign keys (the a11oy verifiable-corpus
#     key-rotation trust set + documented ephemeral-orphan key). A sha256 digest
#     of a public PEM is public by definition — not key material. Only exempted
#     when the value is exactly 64 lowercase-hex chars (a sha256 digest) AND the
#     surrounding name says sha256 / fingerprint / orphan_key. See
#     docs/KEY_ROTATION.md and .github/hf-corpus-guards.json.
#   • one exact public source-digest row for the shared meter helper, bound to
#     the validated shared-source payload manifest path.
#
# Real credentials (tokens, private keys, cloud secrets) remain fully detected.

[extend]
useDefault = true

[allowlist]
description = "SZL non-secret identifiers and test/placeholder stubs"
regexTarget = "line"

regexes = [
  # Public DID key identifiers (did:key multibase, public by definition).
  '''did:key:z6Mk[1-9A-HJ-NP-Za-km-z]+''',
  # `keyid` / key-id LABELS — these NAME a key, they are not key material.
  '''(?i)(keyid|key[_-]?id|signing_key_id|listingkey)["']?\s*[:=]\s*["'`]?[A-Za-z0-9._-]+["'`]?''',
  # `receiptKeySecret: <name>` names a Kubernetes Secret resource, not a secret.
  '''(?i)receiptKeySecret["']?\s*:\s*["'`]?[A-Za-z0-9._-]+["'`]?''',
  # Static problem-catalog slugs in serve.py (kebab-case ids, not credentials).
  '''"id":\s*"P\d+",\s*"key":\s*"[a-z0-9][a-z0-9-]*"''',
  # Single DOCUMENTED demo HMAC key (decodes to "szl-dev-demo-key-2026-warhacker").
  '''SZL_HMAC_KEY=c3psLWRldi1kZW1vLWtleS0yMDI2LXdhcmhhY2tlcg==''',
  # Explicit placeholder / unsigned stub markers.
  '''PLACEHOLDER-NOT-SIGNED''',
  # Python type ANNOTATION naming a key class (forward-ref string hint), NOT a
  # secret: e.g. `private_key: "Ed25519PrivateKey"` in a function signature.
  '''(?i)private_key\s*:\s*["']Ed25519PrivateKey["']''',
  # SHA-256 fingerprints of PUBLIC cosign keys (corpus key-rotation trust set +
  # documented ephemeral-orphan key). Exempted ONLY when the value is exactly a
  # 64-hex sha256 digest AND the name says sha256 / fingerprint / orphan_key —
  # a public-key digest is not a credential. Real 64-hex tokens are not named so.
  '''(?i)(sha256|fingerprint|orphan_key)["']?\s*[:=]\s*["'][0-9a-f]{64}["']''',
  # Content-addressed public source digest, not a credential. Keep this bound
  # to the single gdw_auth manifest row; other 64-hex values remain scanned.
  '''^\s*"gdw_auth\.py"\s*:\s*"[0-9a-f]{64}",?\s*$''',
  # Public source digest row, not a credential. Exact module/path context and
  # a complete 64-hex JSON row only; the required paired payload validator
  # independently proves the digest against both source files. No file/path
  # exclusion or generic 64-hex exemption is added.
  '''^\s*"szl_operator_auth\.py"\s*:\s*"[0-9a-f]{64}",?\s*$''',
]

# Stopwords — exempt specific DOCUMENTED non-secret literals by their value,
# independent of the finding's line context. gitleaks' line-target allowlist
# regexes above rely on a populated `Line` field; for a few problem-catalog slugs
# that field can come back empty (a known gitleaks quirk that surfaces when
# unrelated additive edits shift byte offsets), so the regex exemption silently
# misses. These kebab-case slugs are static identifiers in the serve.py problem
# catalog (NOT credentials), already documented in the header above; listing the
# exact value here is a content-based exemption that does NOT weaken detection of
# any real token. (Wave-O Dev3: additive, honest.)
stopwords = [
  "mesh-k1-failure",
]

# Test fixtures legitimately carry mock key identifiers and stub signatures.
paths = [
  '''.*\.test\.ts$''',
  '''.*__tests__/.*''',
  '''.*_test\.py$''',
  '''.*/test/.*''',
  '''.*/tests/.*''',
  '''.*/testdata/.*''',
  '''.*\.test\.key$''',
]

# This one immutable public-source SHA is not signing material. Both the exact
# checker path and the complete literal row must match; all other findings from
# the inherited generic-api-key rule, including adjacent values, remain scanned.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Exact reviewed a11oy_signing_key.py source identity in source admission"
condition = "AND"
regexTarget = "line"
paths = ['''(^|[\\/])tools[\\/]check_copy_sync_lockstep\.py$''']
regexes = ['''^\s*"a11oy_signing_key\.py": "3315e58f39e0727590ecd6545f4f125d40b2ff0eea9f5fced15539da5d764d5c",\s*$''']

# Public CSS checksum in the byte-exact, accepted KANCHAY SOURCE manifest at
# szl-brand 4309f6fce89179331b0b3ed8c99494e76c5be256. The five installed copies
# and the complete immutable digest row must both match. A different digest,
# another path, or an adjacent credential remains subject to the default rule.
[[rules.allowlists]]
description = "Exact accepted KANCHAY token stylesheet checksum in five source manifests"
condition = "AND"
regexTarget = "line"
paths = [
  '''^console/assets/szl/SOURCE\.json$''',
  '''^docs/site/docs/public/szl/SOURCE\.json$''',
  '''^landing/szl/SOURCE\.json$''',
  '''^organs/amaru/web/public/szl/SOURCE\.json$''',
  '''^routers/command_centre_web/szl/SOURCE\.json$''',
]
regexes = ['''^\s*"szl-tokens\.css": "81f7c9baeef0b435e6e3f9d0c4e0d70e40fa17df5d1f30697f623cd3ef5f8eab"\s*$''']

# The governed-agent-bench projection embeds the exact same public KANCHAY
# stylesheet checksum in one source verifier and one unchanged upstream
# manifest. Both the complete literal row and one of these two exact paths must
# match. A changed value, another path, or an adjacent credential remains under
# the inherited generic-api-key rule.
[[rules.allowlists]]
description = "Exact accepted KANCHAY token stylesheet checksum in governed benchmark sources"
condition = "AND"
regexTarget = "line"
paths = [
  '''^benchmarks/governed-agent-bench/huggingface/native_presentation\.py$''',
  '''^benchmarks/governed-agent-bench/huggingface/szl/SOURCE\.json$''',
]
regexes = ['''^\s*"szl-tokens\.css"\s*:\s*"81f7c9baeef0b435e6e3f9d0c4e0d70e40fa17df5d1f30697f623cd3ef5f8eab"\s*,?\s*$''']

# The exact public SHA-256 of the shared meter helper is source identity, not
# an API credential. Both path and full row must match. The reciprocal payload
# validator independently checks this digest against both source files.
[[rules.allowlists]]
description = "Exact reviewed szl_meter_access.py digest in shared payload"
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|[\\/])\.github[\\/]shared-source-payload-manifest\.json$''',
  '''(^|[\\/])\.github[\\/]shared-source-payloads[\\/]code-engine-bounded-model-20261015-v1\.json$''',
]
regexes = ['''^\s*"szl_meter_access\.py"\s*:\s*"e28179c88e3b41ab6ea58364ba3229246ef43c9137473fdd52fbff83f7bb8ec4",?\s*$''']

# Immutable public SHA-256 of the byte-preserved predecessor payload manifest.
# Exempt only this complete literal row at the two declared manifest paths. Changed
# bytes, another path, and adjacent credentials remain subject to detection.
[[rules.allowlists]]
description = "Exact archived execution observer identity in active or preserved manifest"
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|[\\/])\.github[\\/]shared-source-payload-manifest\.json$''',
  '''(^|[\\/])\.github[\\/]shared-source-payloads[\\/]replication-payload-integrity-20261017-v1\.json$''',
]
regexes = ['''^\s*"\.github/shared-source-payloads/execution-observer-operator-auth-20261016-v1\.json"\s*:\s*"7dbf4ab396a4add29d22e7870951198accb3833f7feb32e8eebf6b7906ce8f1c",?\s*$''']
