<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0
     a11oy Command Centre v2 — 8-room operator skin
     Measured against live a-11-oy.com APIs. Honest labels only.
     Identity: NVIDIA monochrome / Anthropic calm / NR entity rooms / Datadog ⌘K
     Do not promote SAMPLE or UNAVAILABLE to LIVE.
     © 2026 SZL Holdings -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>a11oy · Command</title>
<style>
:root{
  --bg:#0a0a0a;--s1:#111;--s2:#171717;--s3:#1d1d1d;
  --ink:#f4f1ea;--dim:#c8c5bc;--mute:#7a776f;--rule:#2a2a2a;
  --line:#2a2a2a;--inv:#f4f1ea;
  --sans:"Space Grotesk","Söhne","Helvetica Neue",system-ui,sans-serif;
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,monospace;
  --rail:220px;--top:48px;--bot:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;background:none;border:0}
a{color:var(--ink);text-decoration:none}
button{cursor:pointer}
code,.mono{font-family:var(--mono)}
.app{display:grid;grid-template-rows:var(--top) 1fr;grid-template-columns:var(--rail) 1fr;height:100%;min-height:100dvh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--rule);background:var(--bg);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-weight:600;letter-spacing:-.02em}
.brand span{color:var(--mute);font:11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{font:10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--rule);padding:6px 8px;color:var(--dim);white-space:nowrap}
.kbtn{border:1px solid var(--rule);padding:6px 9px;font:10px/1 var(--mono);color:var(--dim)}
.rail{border-right:1px solid var(--rule);padding:16px 10px 72px;overflow:auto}
.rail .sec{font:10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:14px 10px 6px}
.room{display:block;width:100%;text-align:left;padding:8px 10px;color:var(--dim);border-radius:4px}
.room:hover{color:var(--ink);background:var(--s1)}
.room.on{color:var(--ink);background:var(--s2)}
.room small{display:block;color:var(--mute);font:10px/1.3 var(--mono);margin-top:2px}
.canvas{overflow:auto;padding:28px 28px 96px;min-width:0}
.kicker{font:11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{font-weight:500;letter-spacing:-.03em;font-size:clamp(28px,4vw,44px);line-height:1.05;margin:8px 0 12px;max-width:18ch}
.lede{color:var(--dim);max-width:62ch;margin-bottom:22px}
.row{display:grid;gap:12px;margin:16px 0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{border:1px solid var(--rule);background:var(--s1);padding:16px;min-width:0}
.card .l{font:10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.card .n{font:28px/1.1 var(--mono);letter-spacing:-.03em;margin:8px 0 6px}
.card .s{color:var(--mute);font-size:12px}
.table{width:100%;border-collapse:collapse;font:12px/1.4 var(--mono)}
.table th{text-align:left;color:var(--mute);font-weight:400;letter-spacing:.08em;text-transform:uppercase;font-size:10px;padding:8px;border-bottom:1px solid var(--rule)}
.table td{padding:8px;border-bottom:1px solid var(--rule);color:var(--dim);vertical-align:top}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.btn{border:1px solid var(--rule);padding:10px 14px;font-size:13px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{color:var(--mute);font-size:12px;max-width:70ch;margin:8px 0 18px}
.desk{display:grid;gap:8px}
.desk a{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--rule);color:var(--dim)}
.empty{border:1px dashed var(--rule);padding:22px;color:var(--mute)}
.axis{display:flex;align-items:center;gap:10px;margin:6px 0}
.axis b{flex:0 0 110px;font-weight:400;color:var(--dim);font-size:12px}
.bar{flex:1;height:4px;background:var(--s3)}
.bar>i{display:block;height:100%;background:var(--ink)}
.axis em{flex:0 0 42px;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--mute);text-align:right}
.palette{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:12vh 16px}
.palette.on{display:flex}
.pal{width:min(640px,100%);background:var(--s1);border:1px solid var(--rule)}
.pal input{width:100%;padding:14px 16px;border-bottom:1px solid var(--rule);outline:none}
.hit{display:block;width:100%;text-align:left;padding:10px 16px;color:var(--dim);border-bottom:1px solid var(--rule)}
.dock{display:none;position:fixed;left:0;right:0;bottom:0;height:var(--bot);border-top:1px solid var(--rule);background:var(--bg);z-index:30}
.dock button{flex:1;font:10px/1.1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:8px 4px}
.dock button.on{color:var(--ink)}
@media (max-width:900px){.app{grid-template-columns:1fr}.rail{display:none}.canvas{padding:20px 16px 88px}.g4,.g3,.g2{grid-template-columns:1fr 1fr}.dock{display:flex}}
@media (max-width:560px){.g4,.g3,.g2{grid-template-columns:1fr}}

button,.btn,.room,.hit,input{min-height:44px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
html,body{max-width:100%;overflow-x:hidden}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.001ms!important;transition-duration:.001ms!important}}
@media (forced-colors:active){*{forced-color-adjust:auto}.card,.btn,.chip,.kbtn{border:1px solid CanvasText}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>a11oy</b><span>command</span></div>
    <button class="kbtn" id="kopen" type="button">⌘K</button>
    <div class="chips">
      <span class="chip" id="chip-rel">CANDIDATE</span>
      <span class="chip" id="chip-l">Λ …</span>
      <span class="chip" id="chip-sign">SIGNER …</span>
      <span class="chip" id="chip-rec">RECEIPTS …</span>
    </div>
  </header>
  <nav class="rail" id="rail"></nav>
  <main class="canvas" id="canvas"></main>
</div>
<nav class="dock" id="dock"></nav>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Command palette"><div class="pal"><input id="q" aria-label="Open a room or tab" placeholder="Open a room or tab…" autocomplete="off" /><div class="hits" id="hits"></div></div></div>
<script>
const ORIGIN = (location.hostname.endsWith("a-11-oy.com") || location.hostname.includes("hf.space")) ? "" : "https://a-11-oy.com";
const ROOMS = [
  {id:"command", label:"Command", blurb:"Home · decisions · readiness", dock:true},
  {id:"evidence", label:"Evidence", blurb:"Receipts · chain · verify", dock:true},
  {id:"governance", label:"Governance", blurb:"Hatun · gates · MCP", dock:false},
  {id:"telemetry", label:"Telemetry", blurb:"Mesh · energy · observe", dock:false},
  {id:"defense", label:"Defense", blurb:"Killinchu · CUAS · legal line", dock:true},
  {id:"markets", label:"Markets", blurb:"Finance · Terra · Counsel", dock:true},
  {id:"models", label:"Models", blurb:"Registry · kernels · arena", dock:false},
  {id:"diligence", label:"Diligence", blurb:"Investor · SLSA · contract", dock:false}
];
const TABS = [["command","command","Command home"],["ask","command","Ask & act"],["receipts","evidence","Receipts"],["verify","evidence","Verify"],["hatun","governance","Hatun MCP"],["mesh","telemetry","Mesh"],["killinchu","defense","Killinchu"],["vfinance","markets","Finance"],["vrealestate","markets","Terra"],["vlegal","markets","Counsel"],["llm","models","Models"],["investor","diligence","Investor"]];
const state = {room:"command", data:{}};
async function get(path){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),9000);
  try{ const r=await fetch(ORIGIN+path,{signal:ctrl.signal,headers:{accept:"application/json"}}); const text=await r.text(); let json=null; try{json=JSON.parse(text)}catch(e){} return {ok:r.ok,status:r.status,json}; }
  catch(e){ return {ok:false,status:0,json:null}; } finally{ clearTimeout(t); }
}
function fmt(n){return n==null?"—":String(n)}
function kpi(l,n,s){return `<article class="card"><div class="l">${l}</div><div class="n">${n}</div><div class="s">${s||""}</div></article>`}
function rail(){ const nav=document.getElementById("rail"); nav.innerHTML="<div class=sec>Operate</div>"; ROOMS.forEach(r=>{ const b=document.createElement("button"); b.className="room"+(state.room===r.id?" on":""); b.innerHTML=r.label+"<small>"+r.blurb+"</small>"; b.onclick=()=>openRoom(r.id); nav.append(b); }); }
function dock(){ const d=document.getElementById("dock"); const items=[...ROOMS.filter(r=>r.dock),{id:"more",label:"More"}]; d.innerHTML=""; items.forEach(r=>{ const b=document.createElement("button"); b.className=(state.room===r.id||(r.id==="more"&&["governance","telemetry","models","diligence"].includes(state.room)))?"on":""; b.textContent=r.label; b.onclick=()=>openRoom(r.id==="more"?"governance":r.id); d.append(b); }); }
function openRoom(id){ state.room=id; rail(); dock(); paint(); history.replaceState(null,"","#"+id); }
function paintCommand(d){ const lam=d.lambda?.json||{}; const ver=d.version?.json||{}; const led=d.ledger?.json||{}; const sig=d.signing?.json||{}; const ready=d.ready?.json||{}; const ms=ready.matrix_summary||{}; const vs=ready.verdict_summary||{}; const axes=(lam.axes||[]).map(a=>`<div class=axis><b>${a.name}</b><div class=bar><i style=width:${Math.round((a.score||0)*100)}%></i></div><em>${a.score}</em></div>`).join(""); return `<div class=kicker>Command · live probes</div><h1>Governed AI you can prove.</h1><p class=lede>Deny by default. Every consequential change is a receipt you can verify offline. Λ is Conjecture 1.</p><div class=actions><a class="btn pri" href="${ORIGIN}/verify">Verify a receipt</a><a class=btn href="https://a11oy.net" target=_blank rel=noopener>Proof registry</a><a class=btn href="${ORIGIN}/console">Legacy console</a></div><div class="row g4">${kpi("Λ trust", lam.lambda!=null?Number(lam.lambda).toFixed(3):"—", `floor ${lam.lambda_floor??0.9} · conjecture`)}${kpi("Receipts minted", fmt(led.count??0), led.signature_state||"UNSIGNED")}${kpi("Signer", sig.non_repudiation===false?"PARTIAL":(sig.key_persistent?"PERSISTENT":"ABSENT"), sig.hmac_layer||"")}${kpi("Release", ver.release_state||"—", "v"+(ver.version||"?"))}</div><div class="row g2"><article class=card><div class=l>Readiness</div><div class=n>${ms.tabs||141} tabs</div><div class=s>${ms.staticTabs||41} static · probe ${vs.ok||"—"} OK · ${vs.lies||0} lies</div></article><article class=card><div class=l>Health</div><div class=n>${d.healthz?.ok?"200":d.healthz?.status||"DOWN"}</div><div class=s>mesh ${d.mesh?.ok?"200":d.mesh?.status||"DOWN"}</div></article></div><div class=kicker>Λ axes</div><div class=card>${axes||"<div class=empty>Λ unavailable</div>"}</div>`; }
function paintEvidence(d){ const led=d.ledger?.json||{}; return `<div class=kicker>Evidence</div><h1>One receipts workspace.</h1><div class="row g3">${kpi("Minted", fmt(led.count??0), "live empty is valid")}${kpi("Signature", led.signature_state||"UNSIGNED", "")}${kpi("Chain", led.chain_verified?"verified":"—", "")}</div><div class=empty>No receipts minted in the operator ledger this session. Historical series-a store is a different book.</div><div class=actions><a class="btn pri" href="${ORIGIN}/verify">Open verifier</a></div>`; }
function paintGovernance(d){ const h=d.hatun?.json||{}; return `<div class=kicker>Governance · Hatun</div><h1>Admission before action.</h1><div class="row g3">${kpi("Runtime", h.runtime?.status||"—", h.runtime?.mcp_endpoint||"/mcp/")}${kpi("Tools declared", fmt(h.tool_catalog?.count), h.tool_catalog?.status||"")}${kpi("Invocations", fmt(h.invocations?.count??0), h.invocations?.status||"UNKNOWN")}</div><p class=note>${h.honesty||""}</p><div class=actions><a class="btn pri" href="${ORIGIN}/mcp/">Open /mcp/</a><a class=btn href="${ORIGIN}/api/hatun/evidence">Evidence JSON</a></div>`; }
function paintTelemetry(d){ const mesh=d.mesh?.json||{}; const wires=mesh.wires||{}; const rows=Object.entries(wires).map(([k,v])=>`<tr><td>${k}</td><td>${v.status||""}</td><td>${v.edge||""}</td></tr>`).join(""); return `<div class=kicker>Telemetry</div><h1>Golden signals, then rooms.</h1><table class=table><thead><tr><th>Wire</th><th>Status</th><th>Edge</th></tr></thead><tbody>${rows||"<tr><td colspan=3>Mesh unavailable</td></tr>"}</tbody></table>`; }
function paintDefense(){ return `<div class=kicker>Defense · Killinchu</div><h1>Eyes and decision. Not the trigger.</h1><p class=lede>Keep /killinchu on-origin. HF Space is the twin. Effectors SIMULATED unless a receipt proves otherwise. Broadcast-ID only.</p><div class=desk><a href="${ORIGIN}/elite">Legal boundary · /elite</a><a href="${ORIGIN}/console#cuas_fusion">Fusion picture</a></div>`; }
function paintMarkets(){ return `<div class=kicker>Markets</div><h1>Three desks. One room.</h1><div class="row g3"><article class=card><div class=l>PURIQ Finance</div><div class=n>Desk</div></article><article class=card><div class=l>Terra</div><div class=n>Desk</div></article><article class=card><div class=l>PRISM Counsel</div><div class=n>Desk</div></article></div>`; }
function paintModels(d){ const caps=(d.version?.json||{}).capabilities||[]; const rows=caps.map(c=>`<tr><td>${c.name}</td><td>${c.label}</td></tr>`).join(""); return `<div class=kicker>Models</div><h1>Registry, not a manifesto.</h1><table class=table><thead><tr><th>Capability</th><th>Label</th></tr></thead><tbody>${rows||"<tr><td colspan=2>unavailable</td></tr>"}</tbody></table>`; }
function paintDiligence(d){ const s=d.series?.json||{}; return `<div class=kicker>Diligence</div><h1>What is proved. What is not.</h1><div class="row g3">${kpi("Series-A", s.state||"—", (s.critical_failures||[]).join(", "))}${kpi("Tab matrix", d.ready?.json?.available?"available":"—", "")}${kpi("Release", (d.version?.json||{}).release_state||"CANDIDATE", "")}</div>`; }
function paint(){ const map={command:paintCommand,evidence:paintEvidence,governance:paintGovernance,telemetry:paintTelemetry,defense:paintDefense,markets:paintMarkets,models:paintModels,diligence:paintDiligence}; document.getElementById("canvas").innerHTML=(map[state.room]||paintCommand)(state.data); }
function setChips(d){ const lam=d.lambda?.json||{}; const sig=d.signing?.json||{}; const led=d.ledger?.json||{}; const ver=d.version?.json||{}; document.getElementById("chip-l").textContent="Λ "+(lam.lambda!=null?Number(lam.lambda).toFixed(3):"—"); document.getElementById("chip-sign").textContent=sig.non_repudiation===false?"SIGNER PARTIAL":"SIGNER"; document.getElementById("chip-rec").textContent="RECEIPTS "+(led.count??0); document.getElementById("chip-rel").textContent=ver.release_state||"CANDIDATE"; }
function palette(on){ document.getElementById("palette").classList.toggle("on",on); if(on){ document.getElementById("q").value=""; renderHits(""); document.getElementById("q").focus(); } }
function renderHits(q){ const s=q.trim().toLowerCase(); const box=document.getElementById("hits"); box.innerHTML=""; ROOMS.filter(r=>!s||r.label.toLowerCase().includes(s)||r.id.includes(s)).forEach(r=>{ const b=document.createElement("button"); b.className="hit"; b.textContent=r.label; b.onclick=()=>{openRoom(r.id);palette(false)}; box.append(b); }); }
async function boot(){ rail(); dock(); const hash=(location.hash||"#command").slice(1); if(ROOMS.some(r=>r.id===hash)) state.room=hash; paint(); const paths={honest:"/api/a11oy/v1/honest",lambda:"/api/a11oy/v1/lambda",version:"/api/a11oy/v1/version",ledger:"/api/a11oy/v1/ledger",signing:"/api/a11oy/v1/signing-status",energy:"/api/a11oy/v1/energy/ledger",mesh:"/api/a11oy/v1/mesh/state",series:"/api/a11oy/v1/series-a/status",hatun:"/api/hatun/evidence",healthz:"/healthz",ready:"/api/a11oy/v1/readiness/tab-matrix?view=summary"}; const entries=await Promise.all(Object.entries(paths).map(async ([k,p])=>[k,await get(p)])); state.data=Object.fromEntries(entries); setChips(state.data); paint(); }
document.getElementById("kopen").onclick=()=>palette(true);
document.getElementById("palette").addEventListener("click",e=>{ if(e.target.id==="palette") palette(false); });
document.getElementById("q").addEventListener("input",e=>renderHits(e.target.value));
document.addEventListener("keydown",e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); palette(true);} if(e.key==="Escape") palette(false); });
boot();
</script>
</body>
</html>
