yaml_subset: SZL-YAML-1
ledger: claims-ledger
schema_version: 1
zero_bandaid: A public claim lacking evidence auto-demotes to UNKNOWN. This file is enforced by tools/release_gate.py.
claims:
  - id: clm-product-claim
    claim: a11oy issues signed, offline-verifiable receipts proving what an AI agent was authorized to do, what it actually did, and whether the required evidence exists
    state: VERIFIED
    evidence:
      - kind: demonstration
        ref: tools/demo_harness.py
        note: the 12-step acceptance demo exercises sign, verify, tamper, incompleteness, replay, and redaction checks
        status: supports
    last_audited: 2026-08-30
  - id: clm-solo-founder
    claim: SZL Holdings is a solo-founder company led by Stephen Lutar, Poughkeepsie NY, Python-first
    state: VERIFIED
    evidence:
      - kind: canon
        ref: payload CANON section 1
        note: estate facts audited across ten review rounds in the source thread
        status: supports
    last_audited: 2026-08-30
  - id: clm-competitor-funding
    claim: Zenity, Obsidian, and Hush announced rounds on or around 4 August 2026
    state: VERIFIED
    evidence:
      - kind: press
        ref: payload CANON section 5
        note: searched in-thread; dates as found
        status: supports
    last_audited: 2026-08-30
  - id: clm-conformance-profile
    claim: the Article 12 logging conformance profile is mapped and machine-checked
    state: VERIFIED
    evidence:
      - kind: demonstration
        ref: tools/demo_harness.py step 9 against evidence/conformance/eu-ai-act-article-12.v1.yaml
        note: recorded run 2026-08-31, 12/12 steps passing after DEFAULT_CONFORMANCE fix (step 9 previously read the legacy non-canonical profile and failed KeyError entries)
        status: supports
      - kind: review
        ref: docs/security/ADVERSARIAL_REVIEW_2026-08-31.md
        note: first-party-orchestrated AI adversarial review; external independent review (Daybreak Blue S2) remains recommended before claiming the receipt survives adversarial cryptographers
        status: supports
    last_audited: 2026-08-31
  - id: clm-adversarial-review
    claim: the governed-slice verifier, policy engine, and flight recorder have survived an executable adversarial review
    state: VERIFIED
    evidence:
      - kind: test
        ref: tests/adversarial/ (23 attacks, all held; 1 residual finding S2.6-6 documented)
        note: executed 2026-08-31 by Perplexity Computer against post-#1534 main; residual finding = partial-evidence-strip with issuer re-sign passes only when caller supplies no obligations; mitigations ranked in the review doc
        status: supports
    last_audited: 2026-08-31
