<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A11oy Command Centre v2</title>
  <meta name="description" content="A source-bound, read-only A11oy command instrument for evidence, governance, telemetry, defense, markets, models, and diligence.">
  <style>
    :root{color-scheme:dark;--bg:#030407;--panel:#0b0d12;--line:#252a36;--ink:#f7f8fb;--muted:#99a1af;--accent:#a8ffde;--warn:#ffd166;--danger:#ff6b7a;--touch:44px;--radius:16px;--rail:230px;--dock:76px}
    *{box-sizing:border-box;min-inline-size:0}html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}button,a,input{font:inherit}button,a{min-height:var(--touch)}a{color:inherit}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.app{min-height:100vh;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;min-height:62px;padding:9px 16px;border-bottom:1px solid var(--line);background:rgba(3,4,7,.92);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}.brand{font-weight:900;letter-spacing:.12em;text-transform:uppercase}.status{display:flex;gap:8px;align-items:center;margin-left:auto;color:var(--muted);font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.status[data-state="live"] .dot{background:var(--accent);box-shadow:0 0 18px var(--accent)}.status[data-state="partial"] .dot{background:var(--warn)}.kbd{border:1px solid var(--line);background:#11141b;border-radius:8px;padding:6px 9px;color:var(--muted);cursor:pointer}.rail{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:6px;background:#07090d;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}.room{width:100%;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:12px;padding:11px 12px;text-align:left;cursor:pointer;display:grid;gap:3px}.room strong{color:inherit}.room small{font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.05em}.room[aria-current="page"]{border-color:var(--line);background:#11141a;color:var(--ink)}.canvas{position:relative;padding:clamp(14px,2vw,26px);overflow:hidden}.field{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.28}.content{position:relative;z-index:1;display:grid;gap:16px;max-width:1480px;margin:0 auto}.hero{display:flex;align-items:flex-end;gap:20px;justify-content:space-between}.hero h1{font-size:clamp(30px,5vw,70px);line-height:.92;letter-spacing:-.055em;margin:.12em 0}.hero p{color:var(--muted);max-width:68ch;margin:0}.truth{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);border-radius:999px;padding:6px 9px;color:var(--muted);font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.card{grid-column:span 4;border:1px solid var(--line);background:linear-gradient(150deg,rgba(17,20,27,.96),rgba(8,10,14,.92));border-radius:var(--radius);padding:16px;min-height:170px;overflow:hidden}.card.wide{grid-column:span 8}.card.full{grid-column:1/-1}.card h2{margin:0 0 8px;font-size:16px}.card p{color:var(--muted);margin:0}.metric{font:900 clamp(28px,4vw,52px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.05em;margin:18px 0 6px}.meta{font:600 10px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;overflow-wrap:anywhere}.list{display:grid;gap:8px;margin-top:12px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;border-top:1px solid var(--line);padding-top:8px}.row b{overflow-wrap:anywhere}.row span{color:var(--muted);font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-decoration:none;background:#12151c;cursor:pointer}.btn.primary{background:var(--ink);color:var(--bg);font-weight:800}.dock{display:none}.palette{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.68);padding:10vh 16px 16px;visibility:hidden;opacity:0;transition:opacity .14s ease,visibility .14s ease}.palette[data-open="true"]{visibility:visible;opacity:1}.palette-box{max-width:680px;margin:0 auto;border:1px solid var(--line);border-radius:18px;background:#0a0c11;padding:12px;box-shadow:0 24px 80px rgba(0,0,0,.55)}.palette input{width:100%;min-height:48px;background:#11141b;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.hit{display:grid;width:100%;grid-template-columns:minmax(0,1fr) auto;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);padding:12px;cursor:pointer}.hit small{color:var(--muted)}button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    @media(max-width:1040px){.card{grid-column:span 6}.card.wide{grid-column:1/-1}}
    @media(max-width:760px){.app{display:block;padding-bottom:calc(var(--dock) + env(safe-area-inset-bottom))}.top{min-height:56px}.rail{display:none}.canvas{padding:14px 12px 24px}.hero{align-items:flex-start;flex-direction:column}.grid{display:block}.card{margin-bottom:10px;min-height:0}.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));min-height:var(--dock);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:rgba(5,7,10,.96);border-top:1px solid var(--line);backdrop-filter:blur(16px)}.dock button{border:0;background:transparent;color:var(--muted);border-radius:10px;font:700 10px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace}.dock button[aria-current="page"]{background:#151922;color:var(--ink)}.status span:last-child{display:none}}
    @media(pointer:coarse){button,a,input{min-height:48px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
    @media(forced-colors:active){*{forced-color-adjust:auto}.card,.btn,.chip,.kbd,.room,.palette-box,.palette input{border:1px solid CanvasText}.field{display:none}}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">A11oy / Command v2</div>
    <button class="kbd" type="button" id="palette-open" aria-haspopup="dialog" aria-controls="palette">⌘ K</button>
    <div class="status" id="global-status" data-state="partial" role="status" aria-live="polite"><span class="dot"></span><span>CHECKING EVIDENCE</span></div>
  </header>
  <nav class="rail" id="rail" aria-label="Command rooms"></nav>
  <main class="canvas" id="canvas" tabindex="-1">
    <canvas class="field" id="field" aria-hidden="true"></canvas>
    <div class="content" id="content"></div>
  </main>
</div>
<nav class="dock" id="dock" aria-label="Mobile command rooms"></nav>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-labelledby="palette-title" data-open="false">
  <div class="palette-box">
    <h2 class="sr-only" id="palette-title">Open a command room or product surface</h2>
    <input id="palette-query" aria-label="Search command rooms and product surfaces" placeholder="Open a room or surface…" autocomplete="off">
    <div id="palette-hits" role="listbox"></div>
  </div>
</div>
<script>
"use strict";

const SAME_ORIGIN_HOSTS = new Set([
  "a-11-oy.com",
  "www.a-11-oy.com",
  "szlholdings-a11oy.hf.space"
]);
const ORIGIN = SAME_ORIGIN_HOSTS.has(location.hostname.toLowerCase())
  ? ""
  : "https://a-11-oy.com";

const ROOMS = [
  {id:"command",label:"Command",blurb:"readiness · decisions",dock:true},
  {id:"evidence",label:"Evidence",blurb:"receipts · verify",dock:true},
  {id:"governance",label:"Governance",blurb:"Hatun · admission",dock:false},
  {id:"telemetry",label:"Telemetry",blurb:"mesh · energy",dock:false},
  {id:"defense",label:"Defense",blurb:"Killinchu · boundary",dock:true},
  {id:"markets",label:"Markets",blurb:"Finance · Terra · Counsel",dock:true},
  {id:"models",label:"Models",blurb:"registry · kernels",dock:false},
  {id:"diligence",label:"Diligence",blurb:"proof · release",dock:false}
];

const SURFACES = [
  {label:"Legacy console",detail:"/console",href:"/console"},
  {label:"Receipt verifier",detail:"/verify",href:"/verify"},
  {label:"Living Anatomy",detail:"/anatomy",href:"/anatomy"},
  {label:"Model registry",detail:"/models",href:"/models"},
  {label:"Estate proof",detail:"a11oy.net/estate/os",href:"https://a11oy.net/estate/os/"},
  {label:"Status",detail:"/status",href:"/status"}
];

const ENDPOINTS = {
  command:["/api/healthz","/api/readyz","/api/a11oy/v1/command/status"],
  evidence:["/api/evidence/latest","/api/receipts/latest","/api/a11oy/v1/evidence"],
  governance:["/api/governance/status","/api/hatun/status","/mcp/"],
  telemetry:["/api/mesh/status","/api/energy/status","/metrics"],
  defense:["/api/killinchu/v1/status","/api/immune/status","/api/defend/status"],
  markets:["/api/finance/status","/api/terra/status","/api/counsel/status"],
  models:["/api/models","/api/kernels","/api/inference/status"],
  diligence:["/api/build-info","/.well-known/szl-source.json","/api/release/status"]
};

const state = {room:"command",cache:new Map(),lastRefresh:null};
const $ = selector => document.querySelector(selector);
const escapeHtml = value => String(value ?? "").replace(/[&<>'"]/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[character]);

function classify(value){
  const text = JSON.stringify(value || {}).toUpperCase();
  if(/UNAVAILABLE|ERROR|FAILED|BLOCKED/.test(text)) return "UNAVAILABLE";
  if(/SAMPLE|MODELED|CONJECTURE/.test(text)) return "MODELED / SAMPLE";
  return "MEASURED / REPORTED";
}

async function fetchJson(path){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(),6500);
  try{
    const response = await fetch(ORIGIN+path,{cache:"no-store",signal:controller.signal,headers:{Accept:"application/json"}});
    const text = await response.text();
    let body;
    try{body=JSON.parse(text)}catch{body={status:"UNAVAILABLE",http_status:response.status,body_excerpt:text.slice(0,240)}}
    return {path,http_status:response.status,ok:response.ok,body};
  }catch(error){
    return {path,http_status:null,ok:false,body:{status:"UNAVAILABLE",error:error && error.name ? error.name : "request_failed"}};
  }finally{clearTimeout(timer)}
}

async function loadRoom(room,force=false){
  if(!force && state.cache.has(room)) return state.cache.get(room);
  const results = await Promise.all(ENDPOINTS[room].map(fetchJson));
  state.cache.set(room,results);
  state.lastRefresh=new Date();
  return results;
}

function metricValue(body){
  const candidates=[body?.count,body?.total,body?.assets,body?.models,body?.signals,body?.status,body?.state];
  const value=candidates.find(candidate=>candidate!==undefined&&candidate!==null&&candidate!=="");
  return value===undefined ? "UNAVAILABLE" : String(value);
}

function renderCards(results){
  return results.map(result=>{
    const truth=classify(result.body);
    const value=metricValue(result.body);
    const note=result.ok ? "Provider response observed" : "Route unavailable or refused";
    return `<article class="card"><h2>${escapeHtml(result.path)}</h2><div class="metric">${escapeHtml(value)}</div><div class="meta">HTTP ${escapeHtml(result.http_status ?? "—")} · ${escapeHtml(truth)}</div><p>${escapeHtml(note)}</p><div class="actions"><a class="btn" href="${escapeHtml(ORIGIN+result.path)}" target="_blank" rel="noopener">Open source route</a></div></article>`;
  }).join("");
}

function renderRoom(room,results){
  const definition=ROOMS.find(item=>item.id===room);
  const healthy=results.filter(item=>item.ok).length;
  const status=healthy===results.length ? "live" : healthy ? "partial" : "offline";
  $("#global-status").dataset.state=status;
  $("#global-status span:last-child").textContent=status==="live" ? "EVIDENCE ROUTES OBSERVED" : status==="partial" ? "PARTIAL / HONEST" : "UNAVAILABLE";
  $("#content").innerHTML=`
    <section class="hero"><div><div class="truth"><span class="chip">READ ONLY</span><span class="chip">${escapeHtml(status)}</span><span class="chip">Λ Conjecture 1</span></div><h1>${escapeHtml(definition.label)}</h1><p>${escapeHtml(definition.blurb)}. This surface shows bounded observations and never grants consequential authority.</p></div><button class="btn primary" type="button" id="refresh">Refresh evidence</button></section>
    <section class="grid">${renderCards(results)}<article class="card full"><h2>Truth boundary</h2><p>The interface will not invent missing values. MEASURED and REPORTED evidence remain distinct from MODELED, SAMPLE, UNAVAILABLE, and Conjecture 1 states.</p><div class="actions">${SURFACES.map(item=>`<a class="btn" href="${escapeHtml(item.href)}">${escapeHtml(item.label)}</a>`).join("")}</div><div class="meta" style="margin-top:14px">Last refresh: ${escapeHtml(state.lastRefresh?.toISOString() || "UNAVAILABLE")}</div></article></section>`;
  $("#refresh").addEventListener("click",()=>activate(room,true));
}

async function activate(room,force=false){
  state.room=room;
  document.querySelectorAll("[data-room]").forEach(button=>button.setAttribute("aria-current",button.dataset.room===room?"page":"false"));
  $("#content").innerHTML='<section class="hero"><div><span class="chip">LOADING</span><h1>Reading evidence…</h1><p>Bounded same-origin probes are running.</p></div></section>';
  const results=await loadRoom(room,force);
  renderRoom(room,results);
  history.replaceState(null,"",`#${room}`);
  $("#canvas").focus({preventScroll:true});
}

function createNavigation(){
  const rail=$("#rail"),dock=$("#dock");
  rail.innerHTML=ROOMS.map(item=>`<button class="room" type="button" data-room="${escapeHtml(item.id)}"><strong>${escapeHtml(item.label)}</strong><small>${escapeHtml(item.blurb)}</small></button>`).join("");
  dock.innerHTML=ROOMS.filter(item=>item.dock).map(item=>`<button type="button" data-room="${escapeHtml(item.id)}">${escapeHtml(item.label)}</button>`).join("");
  document.querySelectorAll("[data-room]").forEach(button=>button.addEventListener("click",()=>activate(button.dataset.room)));
}

function openPalette(){
  const palette=$("#palette"),query=$("#palette-query"),hits=$("#palette-hits");
  palette.dataset.open="true";
  const draw=()=>{
    const term=query.value.trim().toLowerCase();
    const candidates=[...ROOMS.map(room=>({label:room.label,detail:room.blurb,room:room.id})),...SURFACES];
    const filtered=candidates.filter(item=>!term||`${item.label} ${item.detail}`.toLowerCase().includes(term)).slice(0,10);
    hits.innerHTML=filtered.map((item,index)=>`<button class="hit" type="button" role="option" data-index="${index}"><span>${escapeHtml(item.label)}</span><small>${escapeHtml(item.detail)}</small></button>`).join("");
    hits.querySelectorAll("button").forEach((button,index)=>button.addEventListener("click",()=>{
      const item=filtered[index];
      closePalette();
      if(item.room) activate(item.room); else location.href=item.href;
    }));
  };
  query.value="";draw();
  query.oninput=draw;
  setTimeout(()=>query.focus(),0);
}

function closePalette(){
  $("#palette").dataset.open="false";
  $("#palette-open").focus();
}

function drawField(){
  const canvas=$("#field"),context=canvas.getContext("2d");
  if(!context)return;
  const ratio=Math.min(window.devicePixelRatio||1,2),box=canvas.getBoundingClientRect();
  canvas.width=Math.max(1,Math.floor(box.width*ratio));canvas.height=Math.max(1,Math.floor(box.height*ratio));context.scale(ratio,ratio);context.clearRect(0,0,box.width,box.height);
  context.strokeStyle="rgba(168,255,222,.13)";context.lineWidth=1;
  for(let x=20;x<box.width;x+=48){context.beginPath();context.moveTo(x,0);context.lineTo(x,box.height);context.stroke()}
  for(let y=20;y<box.height;y+=48){context.beginPath();context.moveTo(0,y);context.lineTo(box.width,y);context.stroke()}
}

createNavigation();
$("#palette-open").addEventListener("click",openPalette);
$("#palette").addEventListener("click",event=>{if(event.target===$("#palette"))closePalette()});
document.addEventListener("keydown",event=>{
  if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==="k"){event.preventDefault();openPalette()}
  if(event.key==="Escape"&&$("#palette").dataset.open==="true")closePalette();
});
window.addEventListener("resize",drawField,{passive:true});
drawField();
const requested=location.hash.slice(1);
activate(ROOMS.some(room=>room.id===requested)?requested:"command");
</script>
</body>
</html>
